<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ASCII Art Playground</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #010101;
        font-family: "Fira Code", "Courier New", monospace;
        color: #fff;
      }

      #canvasContainer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      /* ===== TOP BAR ===== */
      #topBar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 56px;
        background: rgba(10, 10, 10, 0.92);
        border-bottom: 1px solid #1a1a1a;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        z-index: 20;
        backdrop-filter: blur(8px);
      }

      #topBar h1 {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 1px;
        color: #fff;
      }

      #topBarRight {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      /* ===== UPLOAD BUTTON ===== */
      #uploadBtn {
        background: #0a0a0a;
        border: 1px solid #333;
        color: #aaa;
        font-family: "Fira Code", monospace;
        font-size: 12px;
        padding: 7px 16px;
        cursor: pointer;
        transition:
          border-color 0.2s,
          color 0.2s;
        letter-spacing: 0.5px;
      }

      #uploadBtn:hover {
        border-color: #666;
        color: #fff;
      }

      #fileInput {
        display: none;
      }

      /* ===== TOGGLE SWITCH ===== */
      .toggle-wrapper {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        color: #555;
        cursor: pointer;
        user-select: none;
      }

      .toggle-wrapper:hover {
        color: #aaa;
      }

      .toggle-switch {
        position: relative;
        width: 38px;
        height: 20px;
      }

      .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
        position: absolute;
      }

      .toggle-track {
        position: absolute;
        inset: 0;
        background: #222;
        border: 1px solid #333;
        transition: background 0.2s;
        cursor: pointer;
      }

      .toggle-track::after {
        content: "";
        position: absolute;
        left: 3px;
        top: 50%;
        transform: translateY(-50%);
        width: 12px;
        height: 12px;
        background: #555;
        transition:
          left 0.2s,
          background 0.2s;
      }

      .toggle-switch input:checked + .toggle-track {
        background: #1a1a1a;
        border-color: #555;
      }

      .toggle-switch input:checked + .toggle-track::after {
        left: 21px;
        background: #fff;
      }

      /* ===== SETTINGS PANEL ===== */
      #settingsPanel {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 52px;
        background: rgba(10, 10, 10, 0.92);
        border-top: 1px solid #1a1a1a;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 32px;
        z-index: 20;
        backdrop-filter: blur(8px);
        padding: 0 24px;
      }

      .setting-group {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 11px;
        color: #555;
      }

      .setting-group label {
        white-space: nowrap;
      }

      .setting-group input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100px;
        height: 2px;
        background: #333;
        outline: none;
      }

      .setting-group input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 12px;
        height: 12px;
        background: #fff;
        border-radius: 50%;
        cursor: pointer;
      }

      .setting-group select {
        background: #0a0a0a;
        border: 1px solid #333;
        color: #aaa;
        font-family: "Fira Code", monospace;
        font-size: 11px;
        padding: 4px 8px;
        cursor: pointer;
        outline: none;
      }

      .setting-group select:hover {
        border-color: #555;
        color: #fff;
      }

      /* ===== FILE NAME DISPLAY ===== */
      #fileName {
        font-size: 11px;
        color: #444;
        max-width: 200px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* ===== AXIS HUD ===== */
      #axisHUD {
        position: fixed;
        bottom: 70px;
        right: 20px;
        z-index: 15;
        pointer-events: none;
      }

      #axisCanvas {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: rgba(10, 10, 10, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(6px);
      }

      /* ===== LOADING ===== */
      #loadingOverlay {
        position: fixed;
        inset: 0;
        background: rgba(1, 1, 1, 0.85);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 30;
        display: none;
        gap: 16px;
      }

      #loadingOverlay.visible {
        display: flex;
      }

      #loadingText {
        font-size: 13px;
        color: #555;
        letter-spacing: 1px;
      }

      .spinner {
        width: 24px;
        height: 24px;
        border: 2px solid #222;
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ===== ASCII CONTAINER ===== */
      #asciiMount {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      #asciiMount > div {
        width: 100% !important;
        height: 100% !important;
        padding-top: 56px !important;
        padding-bottom: 52px !important;
        box-sizing: border-box !important;
      }
    </style>
  </head>

  <body>
    <!-- TOP BAR -->
    <div id="topBar">
      <h1>ASCII Art Playground</h1>
      <div id="topBarRight">
        <span id="fileName">astronaut.obj (default)</span>

        <!-- Background ASCII Toggle -->
        <label class="toggle-wrapper">
          <span>ASCII Background</span>
          <div class="toggle-switch">
            <input type="checkbox" id="bgToggle" checked />
            <div class="toggle-track"></div>
          </div>
        </label>

        <!-- Upload Button -->
        <button
          id="uploadBtn"
          onclick="document.getElementById('fileInput').click()"
        >
          + Upload Model / Image
        </button>
        <input
          type="file"
          id="fileInput"
          accept=".obj,.glb,.gltf,.usdz,.png,.jpg,.jpeg,.webp"
        />
      </div>
    </div>

    <!-- CANVAS -->
    <div id="canvasContainer">
      <div id="asciiMount"></div>
      <div id="axisHUD">
        <canvas id="axisCanvas" width="80" height="80"></canvas>
      </div>
    </div>

    <!-- BOTTOM BAR -->
    <div id="settingsPanel">
      <div class="setting-group">
        <label>Chars</label>
        <select id="charSet">
          <option value=" .:-=+*#%@">Standard</option>
          <option
            value=" .'`^,:;Il!i><~+_-?][}{1)(|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$"
          >
            Detailed
          </option>
          <option value=" .oO0@">Simple Circles</option>
          <option value=" +x*#">Cross Hatch</option>
          <option value=" ▒░█">Block</option>
          <option value=" .-~:;=!*#$@">Retro</option>
        </select>
      </div>
      <div class="setting-group">
        <label>Font Size</label>
        <input type="range" id="fontSizeSlider" min="4" max="20" value="8" />
        <span id="fontSizeVal">8px</span>
      </div>
      <div class="setting-group">
        <label>Rotation Speed</label>
        <input
          type="range"
          id="rotationSpeed"
          min="0"
          max="10"
          value="2"
          step="0.5"
        />
      </div>
      <div class="setting-group">
        <label>Color</label>
        <select id="colorMode">
          <option value="white">White on Black</option>
          <option value="green">Green (Matrix)</option>
          <option value="amber">Amber (Retro)</option>
          <option value="cyan">Cyan (Neon)</option>
          <option value="red">Red</option>
        </select>
      </div>
    </div>

    <!-- LOADING -->
    <div id="loadingOverlay">
      <div class="spinner"></div>
      <div id="loadingText">Loading model...</div>
    </div>

    <script type="module">
      import * as THREE from "https://esm.sh/three@0.160.0";
      import { OrbitControls } from "https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js";
      import { GLTFLoader } from "https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";
      import { OBJLoader } from "https://esm.sh/three@0.160.0/examples/jsm/loaders/OBJLoader.js";
      import { AsciiEffect } from "https://esm.sh/three@0.160.0/examples/jsm/effects/AsciiEffect.js";

      /* ===========================
         SCENE SETUP
      =========================== */
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);

      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.01,
        1000,
      );
      camera.position.set(0, 1, 5);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);

      /* ===========================
         ASCII EFFECT
      =========================== */
      let currentChars = " .:-=+*#%@";
      let currentFontSize = 8;
      let asciiEffect = null;
      const asciiMount = document.getElementById("asciiMount");

      function buildAsciiEffect() {
        if (asciiEffect) {
          asciiMount.innerHTML = "";
        }

        asciiEffect = new AsciiEffect(renderer, currentChars, {
          invert: true,
          resolution: 0.15,
        });

        asciiEffect.setSize(window.innerWidth, window.innerHeight);
        asciiEffect.domElement.style.position = "absolute";
        asciiEffect.domElement.style.top = "0";
        asciiEffect.domElement.style.left = "0";
        asciiEffect.domElement.style.width = "100%";
        asciiEffect.domElement.style.height = "100%";

        applyColorMode();
        asciiMount.appendChild(asciiEffect.domElement);
      }

      /* ===========================
         COLOR MODES
      =========================== */
      const colorModes = {
        white: { color: "#ffffff", background: "#000000" },
        green: { color: "#00ff41", background: "#000000" },
        amber: { color: "#ffb000", background: "#0a0600" },
        cyan: { color: "#00ffff", background: "#000000" },
        red: { color: "#ff2222", background: "#0a0000" },
      };

      function applyColorMode() {
        if (!asciiEffect) return;
        const mode = colorModes[document.getElementById("colorMode").value];
        asciiEffect.domElement.style.color = mode.color;
        asciiEffect.domElement.style.background = mode.background;
        asciiEffect.domElement.style.fontFamily = "Fira Code, monospace";
        asciiEffect.domElement.style.fontSize = currentFontSize + "px";
        asciiEffect.domElement.style.lineHeight = "1.0";
      }

      /* ===========================
         LIGHTS
      =========================== */
      scene.add(new THREE.AmbientLight(0xffffff, 0.8));
      const dirLight = new THREE.DirectionalLight(0xffffff, 8);
      dirLight.position.set(5, 10, 5);
      scene.add(dirLight);
      const backLight = new THREE.DirectionalLight(0xffffff, 3);
      backLight.position.set(-5, -5, -5);
      scene.add(backLight);

      /* ===========================
         CONTROLS
      =========================== */
      const controls = new OrbitControls(
        camera,
        document.getElementById("canvasContainer"),
      );
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.enablePan = true;

      /* ===========================
         MODEL LOADING
      =========================== */
      const gltfLoader = new GLTFLoader();
      const objLoader = new OBJLoader();
      let currentModel = null;
      let autoRotate = true;
      let rotationSpeed = 0.005;
      const loadingOverlay = document.getElementById("loadingOverlay");
      const loadingText = document.getElementById("loadingText");

      function showLoading(text = "Loading...") {
        loadingText.textContent = text;
        loadingOverlay.classList.add("visible");
      }

      function hideLoading() {
        loadingOverlay.classList.remove("visible");
      }

      function clearModel() {
        if (currentModel) {
          scene.remove(currentModel);
          currentModel.traverse((obj) => {
            if (obj.isMesh) {
              obj.geometry?.dispose();
              if (Array.isArray(obj.material))
                obj.material.forEach((m) => m.dispose?.());
              else obj.material?.dispose?.();
            }
          });
          currentModel = null;
        }
      }

      function fitCameraToModel(model) {
        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);

        model.position.sub(center);

        const fov = camera.fov * (Math.PI / 180);
        let cameraZ = Math.abs(maxDim / Math.tan(fov / 2)) * 1.4;
        camera.position.set(0, 0, cameraZ);
        camera.near = cameraZ / 100;
        camera.far = cameraZ * 100;
        camera.updateProjectionMatrix();

        controls.target.set(0, 0, 0);
        controls.update();
      }

      function loadDefaultModel() {
        showLoading("Loading astronaut...");
        objLoader.load(
          "https://raw.githubusercontent.com/Aishwary2004Gupta/ThreeJS_visuals/main/assets/astronaut.obj",
          (obj) => {
            obj.traverse((child) => {
              if (child.isMesh) {
                child.material = new THREE.MeshStandardMaterial({
                  color: 0xffffff,
                  roughness: 0.5,
                  metalness: 0.3,
                });
              }
            });
            clearModel();
            scene.add(obj);
            currentModel = obj;
            fitCameraToModel(obj);
            hideLoading();
          },
          undefined,
          (err) => {
            console.error("Failed to load default model", err);
            hideLoading();
          },
        );
      }

      function loadGLTF(url, name) {
        showLoading(`Loading ${name}...`);
        gltfLoader.load(
          url,
          (gltf) => {
            clearModel();
            scene.add(gltf.scene);
            currentModel = gltf.scene;
            fitCameraToModel(gltf.scene);
            hideLoading();
          },
          undefined,
          (err) => {
            console.error("GLTF load error", err);
            hideLoading();
          },
        );
      }

      function loadOBJ(url, name) {
        showLoading(`Loading ${name}...`);
        objLoader.load(
          url,
          (obj) => {
            obj.traverse((child) => {
              if (child.isMesh) {
                child.material = new THREE.MeshStandardMaterial({
                  color: 0xffffff,
                  roughness: 0.5,
                  metalness: 0.3,
                });
              }
            });
            clearModel();
            scene.add(obj);
            currentModel = obj;
            fitCameraToModel(obj);
            hideLoading();
          },
          undefined,
          (err) => {
            console.error("OBJ load error", err);
            hideLoading();
          },
        );
      }

      /* ===========================
         IMAGE AS PLANE
      =========================== */
      function loadImageAsPlane(file) {
        showLoading("Loading image...");
        const url = URL.createObjectURL(file);
        const texture = new THREE.TextureLoader().load(url, (tex) => {
          clearModel();
          const aspect = tex.image.width / tex.image.height;
          const geo = new THREE.PlaneGeometry(aspect * 3, 3);
          const mat = new THREE.MeshBasicMaterial({
            map: tex,
            side: THREE.DoubleSide,
          });
          const mesh = new THREE.Mesh(geo, mat);
          scene.add(mesh);
          currentModel = mesh;
          autoRotate = false;
          camera.position.set(0, 0, 5);
          controls.target.set(0, 0, 0);
          controls.update();
          hideLoading();
        });
      }

      /* ===========================
         FILE UPLOAD HANDLER
      =========================== */
      document.getElementById("fileInput").addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const name = file.name;
        document.getElementById("fileName").textContent = name;
        const ext = name.split(".").pop().toLowerCase();
        const url = URL.createObjectURL(file);

        if (ext === "glb" || ext === "gltf") {
          autoRotate = true;
          loadGLTF(url, name);
        } else if (ext === "obj") {
          autoRotate = true;
          loadOBJ(url, name);
        } else if (ext === "usdz") {
          // USDZ: attempt GLTF loader (may work in some browsers)
          autoRotate = true;
          loadGLTF(url, name);
        } else if (["png", "jpg", "jpeg", "webp"].includes(ext)) {
          loadImageAsPlane(file);
        }

        e.target.value = "";
      });

      /* ===========================
         BACKGROUND TOGGLE
      =========================== */
      const bgToggle = document.getElementById("bgToggle");
      bgToggle.addEventListener("change", () => {
        if (!asciiEffect) return;
        if (bgToggle.checked) {
          asciiEffect.domElement.style.background =
            colorModes[document.getElementById("colorMode").value].background;
        } else {
          asciiEffect.domElement.style.background = "transparent";
          asciiEffect.domElement.style.mixBlendMode = "screen";
        }
      });

      /* ===========================
         SETTINGS CONTROLS
      =========================== */
      document.getElementById("charSet").addEventListener("change", (e) => {
        currentChars = e.target.value;
        buildAsciiEffect();
      });

      document
        .getElementById("fontSizeSlider")
        .addEventListener("input", (e) => {
          currentFontSize = parseInt(e.target.value);
          document.getElementById("fontSizeVal").textContent =
            currentFontSize + "px";
          if (asciiEffect) {
            asciiEffect.domElement.style.fontSize = currentFontSize + "px";
          }
        });

      document
        .getElementById("rotationSpeed")
        .addEventListener("input", (e) => {
          rotationSpeed = parseFloat(e.target.value) * 0.002;
        });

      document.getElementById("colorMode").addEventListener("change", () => {
        applyColorMode();
        if (bgToggle.checked) {
          const mode = colorModes[document.getElementById("colorMode").value];
          if (asciiEffect)
            asciiEffect.domElement.style.background = mode.background;
        }
      });

      /* ===========================
         AXIS HUD
      =========================== */
      const axisCanvas = document.getElementById("axisCanvas");
      const axisCtx = axisCanvas.getContext("2d");

      function drawAxis(v, color, label, cx, cy, scale) {
        const ex = cx + v.x * scale;
        const ey = cy - v.y * scale;
        const alpha = v.z < 0 ? 0.3 : 0.9;
        axisCtx.strokeStyle = color;
        axisCtx.fillStyle = color;
        axisCtx.globalAlpha = alpha;
        axisCtx.lineWidth = 2;
        axisCtx.beginPath();
        axisCtx.moveTo(cx, cy);
        axisCtx.lineTo(ex, ey);
        axisCtx.stroke();
        axisCtx.globalAlpha = 1.0;
        axisCtx.font = "11px Fira Code, monospace";
        axisCtx.fillText(label, ex + 3, ey + 3);
      }

      function updateAxisHUD() {
        const w = axisCanvas.width;
        const h = axisCanvas.height;
        axisCtx.clearRect(0, 0, w, h);
        const cx = w / 2;
        const cy = h / 2;
        const scale = w * 0.35;
        const invQ = camera.quaternion.clone().invert();
        const xV = new THREE.Vector3(1, 0, 0).applyQuaternion(invQ);
        const yV = new THREE.Vector3(0, 1, 0).applyQuaternion(invQ);
        const zV = new THREE.Vector3(0, 0, 1).applyQuaternion(invQ);
        axisCtx.globalAlpha = 0.8;
        axisCtx.strokeStyle = "rgba(255,255,255,0.1)";
        axisCtx.lineWidth = 1;
        axisCtx.beginPath();
        axisCtx.arc(cx, cy, scale, 0, Math.PI * 2);
        axisCtx.stroke();
        drawAxis(xV, "#ff4d4d", "X", cx, cy, scale);
        drawAxis(yV, "#46ff7a", "Y", cx, cy, scale);
        drawAxis(zV, "#4da6ff", "Z", cx, cy, scale);
      }

      /* ===========================
         RESIZE
      =========================== */
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        if (asciiEffect)
          asciiEffect.setSize(window.innerWidth, window.innerHeight);
      });

      /* ===========================
         ANIMATE
      =========================== */
      function animate() {
        requestAnimationFrame(animate);
        controls.update();

        if (autoRotate && currentModel) {
          currentModel.rotation.y += rotationSpeed;
        }

        updateAxisHUD();

        if (asciiEffect) {
          asciiEffect.render(scene, camera);
        }
      }

      /* ===========================
         INIT
      =========================== */
      buildAsciiEffect();
      loadDefaultModel();
      animate();
    </script>
  </body>
</html>
