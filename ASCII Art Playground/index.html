<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Art Shader</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #010101;
            color: #fff;
            font-family: 'Fira Code', monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #controls {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 10px;
            background: rgba(10, 10, 10, 0.9);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #333;
            backdrop-filter: blur(10px);
        }

        #fileInput {
            display: none;
        }

        .btn {
            background: #0a0a0a;
            color: #fff;
            border: 1px solid #333;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #1a1a1a;
            border-color: #555;
        }

        .btn.active {
            background: #333;
            border-color: #666;
        }

        #toggleBtn {
            background: #0a0a0a;
            color: #fff;
            border: 1px solid #333;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            transition: all 0.2s;
        }

        #toggleBtn:hover {
            background: #1a1a1a;
        }

        #toggleBtn.ascii-on {
            background: #0066cc;
            border-color: #0088ff;
        }

        #toggleBtn.ascii-off {
            background: #663300;
            border-color: #996600;
        }

        #canvasContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #666;
            font-size: 14px;
            z-index: 50;
            display: none;
        }

        #info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: #555;
            font-size: 11px;
            z-index: 100;
        }

        #info kbd {
            background: #222;
            padding: 2px 6px;
            border-radius: 3px;
            border: 1px solid #444;
        }
    </style>
</head>
<body>
    <div id="controls">
        <label class="btn" for="fileInput">Upload File</label>
        <input type="file" id="fileInput" accept=".obj,.glb,.gltf,.usdz,.png,.jpg,.jpeg">
        <button id="toggleBtn" class="ascii-on">ASCII: ON</button>
    </div>

    <div id="loading">Loading...</div>
    <div id="info">
        Drag to rotate | Scroll to zoom | <kbd>Toggle</kbd> to switch ASCII mode
    </div>

    <div id="canvasContainer"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://esm.sh/three@0.160.0",
                "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { AsciiEffect } from 'three/addons/effects/AsciiEffect.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010101);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvasContainer').appendChild(renderer.domElement);

        // ASCII Effect
        const asciiEffect = new AsciiEffect(renderer, ' .:-=+*#%@', { invert: true });
        asciiEffect.setSize(window.innerWidth, window.innerHeight);
        asciiEffect.domElement.style.position = 'absolute';
        asciiEffect.domElement.style.top = '0';
        asciiEffect.domElement.style.left = '0';
        asciiEffect.domElement.style.color = '#00ff00';
        asciiEffect.domElement.style.backgroundColor = '#000000';
        asciiEffect.domElement.style.display = 'block';
        document.getElementById('canvasContainer').appendChild(asciiEffect.domElement);

        // Controls
        const controls = new OrbitControls(camera, asciiEffect.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);

        // Loaders
        const gltfLoader = new GLTFLoader();
        const objLoader = new OBJLoader();
        
        let currentModel = null;
        let asciiEnabled = true;

        // Default astronaut model
        const DEFAULT_MODEL_URL = 'https://raw.githubusercontent.com/Aishwary2004Gupta/ThreeJS_visuals/main/assets/astronaut.obj';

        function loadModel(url, isImage = false) {
            const loading = document.getElementById('loading');
            loading.style.display = 'block';

            // Remove previous model
            if (currentModel) {
                scene.remove(currentModel);
                if (currentModel.traverse) {
                    currentModel.traverse((child) => {
                        if (child.geometry) child.geometry.dispose();
                        if (child.material) {
                            if (Array.isArray(child.material)) {
                                child.material.forEach(m => m.dispose());
                            } else {
                                child.material.dispose();
                            }
                        }
                    });
                }
                currentModel = null;
            }

            if (isImage) {
                // Load as image texture on a plane
                const textureLoader = new THREE.TextureLoader();
                textureLoader.load(url, (texture) => {
                    const geometry = new THREE.PlaneGeometry(4, 3);
                    const material = new THREE.MeshBasicMaterial({ 
                        map: texture,
                        side: THREE.DoubleSide
                    });
                    const mesh = new THREE.Mesh(geometry, material);
                    scene.add(mesh);
                    currentModel = mesh;
                    loading.style.display = 'none';
                });
                return;
            }

            // Determine file type and load accordingly
            const extension = url.split('.').pop().toLowerCase();
            
            const onLoad = (object) => {
                let model;
                if (extension === 'obj') {
                    model = object;
                } else {
                    model = object.scene;
                }
                
                // Center and scale model
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                const scale = 3 / maxDim;
                
                model.scale.setScalar(scale);
                model.position.sub(center.multiplyScalar(scale));
                
                scene.add(model);
                currentModel = model;
                loading.style.display = 'none';
            };

            const onError = (error) => {
                console.error('Error loading model:', error);
                loading.style.display = 'none';
                alert('Failed to load model. Please try another file.');
            };

            if (extension === 'obj') {
                objLoader.load(url, onLoad, undefined, onError);
            } else if (extension === 'usdz') {
                // For USDZ, we need to use the USDZLoader
                import('three/addons/loaders/USDZLoader.js').then(({ USDZLoader }) => {
                    const usdzLoader = new USDZLoader();
                    usdzLoader.load(url, onLoad, undefined, onError);
                });
            } else {
                // GLTF/GLB
                gltfLoader.load(url, onLoad, undefined, onError);
            }
        }

        // Load default model
        loadModel(DEFAULT_MODEL_URL);

        // File upload handler
        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const url = URL.createObjectURL(file);
            const extension = file.name.split('.').pop().toLowerCase();
            const isImage = ['png', 'jpg', 'jpeg'].includes(extension);
            
            loadModel(url, isImage);
        });

        // Toggle ASCII button
        const toggleBtn = document.getElementById('toggleBtn');
        toggleBtn.addEventListener('click', () => {
            asciiEnabled = !asciiEnabled;
            
            if (asciiEnabled) {
                toggleBtn.textContent = 'ASCII: ON';
                toggleBtn.classList.remove('ascii-off');
                toggleBtn.classList.add('ascii-on');
                asciiEffect.domElement.style.display = 'block';
                renderer.domElement.style.display = 'none';
            } else {
                toggleBtn.textContent = 'ASCII: OFF';
                toggleBtn.classList.remove('ascii-on');
                toggleBtn.classList.add('ascii-off');
                asciiEffect.domElement.style.display = 'none';
                renderer.domElement.style.display = 'block';
            }
        });

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            asciiEffect.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            
            if (asciiEnabled) {
                asciiEffect.render(scene, camera);
            } else {
                renderer.render(scene, camera);
            }
        }

        animate();
    </script>
</body>
</html>
