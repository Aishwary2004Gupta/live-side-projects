<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ASCII Art Playground</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: "Fira Code", "Courier New", monospace;
        color: #fff;
      }

      #canvasContainer {
        position: fixed;
        inset: 0;
        overflow: hidden;
        z-index: 1;
      }

      /* ===== TOP BAR ===== */
      #topBar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        min-height: 56px;
        background: rgba(10, 10, 10, 0.88);
        border-bottom: 1px solid #1a1a1a;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 20px;
        z-index: 20;
        backdrop-filter: blur(8px);
        gap: 12px;
        flex-wrap: wrap;
      }

      #topBar h1 {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 1px;
        color: #fff;
        white-space: nowrap;
      }

      #topBarRight {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      #fileName {
        font-size: 11px;
        color: #777;
        max-width: 220px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .btn,
      .view-btn {
        background: #0a0a0a;
        border: 1px solid #333;
        color: #aaa;
        font-family: "Fira Code", monospace;
        font-size: 12px;
        padding: 7px 14px;
        cursor: pointer;
        transition:
          border-color 0.2s,
          color 0.2s,
          background 0.2s;
        letter-spacing: 0.4px;
      }

      .btn:hover,
      .view-btn:hover {
        border-color: #666;
        color: #fff;
      }

      .view-btn.active {
        border-color: #fff;
        color: #fff;
        background: #151515;
      }

      .view-switch {
        display: flex;
        border: 1px solid #333;
      }

      .view-switch .view-btn {
        border: none;
        border-right: 1px solid #333;
      }

      .view-switch .view-btn:last-child {
        border-right: none;
      }

      #fileInput {
        display: none;
      }

      /* ===== TOGGLE ===== */
      .toggle-wrapper {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        color: #777;
        cursor: pointer;
        user-select: none;
      }

      .toggle-wrapper:hover {
        color: #aaa;
      }

      .toggle-switch {
        position: relative;
        width: 40px;
        height: 22px;
      }

      .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
        position: absolute;
      }

      .toggle-track {
        position: absolute;
        inset: 0;
        background: #1b1b1b;
        border: 1px solid #333;
        transition: 0.2s;
      }

      .toggle-track::after {
        content: "";
        position: absolute;
        width: 14px;
        height: 14px;
        left: 3px;
        top: 50%;
        transform: translateY(-50%);
        background: #666;
        transition: 0.2s;
      }

      .toggle-switch input:checked + .toggle-track {
        border-color: #777;
        background: #121212;
      }

      .toggle-switch input:checked + .toggle-track::after {
        left: 21px;
        background: #fff;
      }

      /* ===== BOTTOM BAR ===== */
      #settingsPanel {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        min-height: 56px;
        background: rgba(10, 10, 10, 0.88);
        border-top: 1px solid #1a1a1a;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 24px;
        z-index: 20;
        backdrop-filter: blur(8px);
        padding: 10px 20px;
        flex-wrap: wrap;
      }

      .setting-group {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 11px;
        color: #777;
      }

      .setting-group label {
        white-space: nowrap;
      }

      .setting-group input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 110px;
        height: 2px;
        background: #333;
        outline: none;
      }

      .setting-group input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #fff;
        cursor: pointer;
      }

      .setting-group input[type="range"]::-moz-range-thumb {
        width: 12px;
        height: 12px;
        border: none;
        border-radius: 50%;
        background: #fff;
        cursor: pointer;
      }

      .setting-group select {
        background: #0a0a0a;
        border: 1px solid #333;
        color: #aaa;
        font-family: "Fira Code", monospace;
        font-size: 11px;
        padding: 4px 8px;
        cursor: pointer;
        outline: none;
      }

      .setting-group select:hover {
        border-color: #555;
        color: #fff;
      }

      .value-label {
        min-width: 42px;
        color: #ddd;
        font-size: 11px;
      }

      /* ===== AXIS HUD ===== */
      #axisHUD {
        position: fixed;
        bottom: 74px;
        right: 16px;
        z-index: 15;
        pointer-events: none;
      }

      #axisCanvas {
        width: 82px;
        height: 82px;
        border-radius: 50%;
        background: rgba(10, 10, 10, 0.42);
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(6px);
      }

      /* ===== LOADING ===== */
      #loadingOverlay {
        position: fixed;
        inset: 0;
        background: rgba(1, 1, 1, 0.88);
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 30;
        gap: 16px;
      }

      #loadingOverlay.visible {
        display: flex;
      }

      #loadingText {
        font-size: 13px;
        color: #888;
        letter-spacing: 1px;
      }

      .spinner {
        width: 24px;
        height: 24px;
        border: 2px solid #222;
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 900px) {
        #topBar,
        #settingsPanel {
          justify-content: center;
        }

        #fileName {
          max-width: 150px;
        }
      }
    </style>
  </head>

  <body>
    <div id="topBar">
      <h1>ASCII Art Playground</h1>

      <div id="topBarRight">
        <span id="fileName">astronaut.obj (default)</span>

        <div class="view-switch">
          <button id="asciiViewBtn" class="view-btn active">ASCII View</button>
          <button id="normalViewBtn" class="view-btn">Normal View</button>
        </div>

        <label class="toggle-wrapper">
          <span>ASCII Background</span>
          <div class="toggle-switch">
            <input type="checkbox" id="bgToggle" checked />
            <div class="toggle-track"></div>
          </div>
        </label>

        <button
          id="uploadBtn"
          class="btn"
          onclick="document.getElementById('fileInput').click()"
        >
          + Upload Model / Image
        </button>

        <input
          type="file"
          id="fileInput"
          accept=".obj,.glb,.gltf,.png,.jpg,.jpeg,.webp"
        />
      </div>
    </div>

    <div id="canvasContainer">
      <div id="axisHUD">
        <canvas id="axisCanvas" width="82" height="82"></canvas>
      </div>
    </div>

    <div id="settingsPanel">
      <div class="setting-group">
        <label>Chars</label>
        <select id="charSet">
          <option value=" .:-=+*#%@">Standard</option>
          <option value=" .,:;irsXA253hMHGS#9B&@">
  Detailed
</option>
          <option value=" .oO0@">Simple Circles</option>
          <option value=" .+x*#">Cross Hatch</option>
          <option value=" .░▒█">Block</option>
          <option value=" .-~:;=!*#$@">Retro</option>
        </select>
      </div>

      <div class="setting-group">
        <label>Font Size</label>
        <input type="range" id="fontSizeSlider" min="4" max="20" value="8" />
        <span id="fontSizeVal" class="value-label">8px</span>
      </div>

      <div class="setting-group">
        <label>Rotation Speed</label>
        <input
          type="range"
          id="rotationSpeed"
          min="0"
          max="10"
          value="2"
          step="0.5"
        />
        <span id="rotationSpeedVal" class="value-label">2.0</span>
      </div>

      <div class="setting-group">
        <label>Color</label>
        <select id="colorMode">
          <option value="white">White on Black</option>
          <option value="green">Green (Matrix)</option>
          <option value="amber">Amber (Retro)</option>
          <option value="cyan">Cyan (Neon)</option>
          <option value="red">Red</option>
        </select>
      </div>
    </div>

    <div id="loadingOverlay">
      <div class="spinner"></div>
      <div id="loadingText">Loading model...</div>
    </div>

    <script type="module">
      import * as THREE from "https://esm.sh/three@0.160.0";
      import { OrbitControls } from "https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js";
      import { GLTFLoader } from "https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";
      import { OBJLoader } from "https://esm.sh/three@0.160.0/examples/jsm/loaders/OBJLoader.js";
      import { AsciiEffect } from "https://esm.sh/three@0.160.0/examples/jsm/effects/AsciiEffect.js";

      /* ===========================
         DOM
      =========================== */
      const canvasContainer = document.getElementById("canvasContainer");
      const fileNameEl = document.getElementById("fileName");
      const fileInput = document.getElementById("fileInput");
      const asciiViewBtn = document.getElementById("asciiViewBtn");
      const normalViewBtn = document.getElementById("normalViewBtn");
      const bgToggle = document.getElementById("bgToggle");
      const charSetSelect = document.getElementById("charSet");
      const fontSizeSlider = document.getElementById("fontSizeSlider");
      const fontSizeVal = document.getElementById("fontSizeVal");
      const rotationSpeedSlider = document.getElementById("rotationSpeed");
      const rotationSpeedVal = document.getElementById("rotationSpeedVal");
      const colorModeSelect = document.getElementById("colorMode");
      const loadingOverlay = document.getElementById("loadingOverlay");
      const loadingText = document.getElementById("loadingText");

      /* ===========================
         SCENE SETUP
      =========================== */
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);

      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.01,
        1000,
      );
      camera.position.set(0, 0, 5);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.domElement.style.position = "absolute";
      renderer.domElement.style.top = "0";
      renderer.domElement.style.left = "0";
      canvasContainer.appendChild(renderer.domElement);

      /* ===========================
         LIGHTS
      =========================== */
      scene.add(new THREE.AmbientLight(0xffffff, 0.85));

      const dirLight = new THREE.DirectionalLight(0xffffff, 6);
      dirLight.position.set(5, 10, 6);
      scene.add(dirLight);

      const backLight = new THREE.DirectionalLight(0xffffff, 2.2);
      backLight.position.set(-5, -4, -5);
      scene.add(backLight);

      /* ===========================
         CONTROLS
      =========================== */
      const controls = new OrbitControls(camera, canvasContainer);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.enablePan = false;

      canvasContainer.addEventListener("contextmenu", (e) =>
        e.preventDefault(),
      );

      /* ===========================
         STATE
      =========================== */
      const gltfLoader = new GLTFLoader();
      const objLoader = new OBJLoader();

      let currentModel = null;
      let currentObjectURL = null;
      let asciiEffect = null;

      let viewMode = "ascii"; // 'ascii' | 'normal'
      let currentChars = charSetSelect.value;
      let currentFontSize = parseInt(fontSizeSlider.value, 10);
      let rotationSpeed = parseFloat(rotationSpeedSlider.value) * 0.002;
      let autoRotate = true;

      const colorModes = {
        white: { color: "#ffffff", background: "#000000" },
        green: { color: "#00ff41", background: "#000000" },
        amber: { color: "#ffb000", background: "#120a00" },
        cyan: { color: "#00ffff", background: "#000000" },
        red: { color: "#ff4040", background: "#120000" },
      };

      /* ===========================
         HELPERS
      =========================== */
      function showLoading(text = "Loading...") {
        loadingText.textContent = text;
        loadingOverlay.classList.add("visible");
      }

      function hideLoading() {
        loadingOverlay.classList.remove("visible");
      }

      function revokeCurrentURL() {
        if (currentObjectURL) {
          URL.revokeObjectURL(currentObjectURL);
          currentObjectURL = null;
        }
      }

      function disposeMaterial(material) {
        if (!material) return;
        if (Array.isArray(material)) {
          material.forEach(disposeMaterial);
          return;
        }
        for (const key in material) {
          const value = material[key];
          if (value && value.isTexture) value.dispose();
        }
        material.dispose?.();
      }

      function clearModel() {
        if (!currentModel) return;
        scene.remove(currentModel);
        currentModel.traverse((obj) => {
          if (obj.isMesh) {
            obj.geometry?.dispose?.();
            disposeMaterial(obj.material);
          }
        });
        currentModel = null;
      }

      function fitCameraToModel(model) {
        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        model.position.sub(center);

        const maxDim = Math.max(size.x, size.y, size.z, 0.001);
        const fov = THREE.MathUtils.degToRad(camera.fov);
        const cameraZ = (maxDim / (2 * Math.tan(fov / 2))) * 2.1;

        camera.position.set(0, 0, cameraZ);
        camera.near = Math.max(0.01, cameraZ / 100);
        camera.far = cameraZ * 100;
        camera.updateProjectionMatrix();

        controls.target.set(0, 0, 0);
        controls.update();
      }

      function applySceneBackground() {
        const mode = colorModes[colorModeSelect.value];
        scene.background = new THREE.Color(mode.background);
        document.body.style.background = mode.background;
      }

      /* ===========================
         ASCII LOGIC
      =========================== */
      // The first character of the charset is what AsciiEffect uses for
      // the darkest pixels (with invert:true). If it's a space, the
      // background is empty. If it's ".", the background fills with dots
      // exactly like classic ASCII art.
      function getEffectiveChars() {
        if (bgToggle.checked) {
          return currentChars.startsWith(" ")
            ? "." + currentChars.slice(1)
            : currentChars;
        }
        return currentChars.startsWith(" ") ? currentChars : " " + currentChars;
      }

      // AsciiEffect derives its internal font size as (2 / resolution).
      // So resolution = 2 / desiredFontSize makes the slider value exact.
      function getAsciiResolutionFromFontSize() {
  return 0.18;
}

      function styleAsciiEffect() {
        if (!asciiEffect) return;
        const mode = colorModes[colorModeSelect.value];
        const el = asciiEffect.domElement;

        el.style.position = "absolute";
        el.style.top = "0";
        el.style.left = "0";
        el.style.zIndex = "2";
        el.style.overflow = "hidden";
        el.style.pointerEvents = "none"; // let OrbitControls work through it
        el.style.userSelect = "none";
        el.style.color = mode.color;
        el.style.backgroundColor = mode.background;
        // NOTE: do NOT override the internal table's font-size/width/height.
        // AsciiEffect computes its own font metrics from `resolution` and
        // overriding them breaks the character grid alignment.
      }

      function buildAsciiEffect() {
        if (asciiEffect?.domElement?.parentNode) {
          asciiEffect.domElement.parentNode.removeChild(asciiEffect.domElement);
        }

        asciiEffect = new AsciiEffect(renderer, getEffectiveChars(), {
          invert: true,
          resolution: getAsciiResolutionFromFontSize(currentFontSize),
        });

        asciiEffect.setSize(window.innerWidth, window.innerHeight);
        canvasContainer.appendChild(asciiEffect.domElement);
        styleAsciiEffect();
        updateViewMode();
      }

      function updateViewMode() {
        asciiViewBtn.classList.toggle("active", viewMode === "ascii");
        normalViewBtn.classList.toggle("active", viewMode === "normal");

        const isAscii = viewMode === "ascii";

        // In ASCII view: hide the WebGL canvas entirely (the ASCII layer
        // replaces it — never show both at once, that causes a double image).
        if (asciiEffect)
          asciiEffect.domElement.style.display = isAscii ? "block" : "none";
        renderer.domElement.style.display = isAscii ? "none" : "block";
      }

      /* ===========================
         MODEL LOADING
      =========================== */
      function loadDefaultModel() {
        showLoading("Loading astronaut...");

        objLoader.load(
          "https://raw.githubusercontent.com/Aishwary2004Gupta/ThreeJS_visuals/main/assets/astronaut.obj",
          (obj) => {
            obj.traverse((child) => {
              if (child.isMesh) {
                child.material = new THREE.MeshStandardMaterial({
                  color: 0xffffff,
                  roughness: 0.5,
                  metalness: 0.25,
                });
              }
            });

            clearModel();
            scene.add(obj);
            currentModel = obj;
            autoRotate = true;
            fitCameraToModel(obj);
            hideLoading();
          },
          undefined,
          (err) => {
            console.error("Failed to load default model:", err);
            hideLoading();
            alert("Could not load the default model.");
          },
        );
      }

      function loadGLTF(url, name) {
        showLoading(`Loading ${name}...`);

        gltfLoader.load(
          url,
          (gltf) => {
            clearModel();
            const model = gltf.scene;
            scene.add(model);
            currentModel = model;
            autoRotate = true;
            fitCameraToModel(model);
            hideLoading();
            revokeCurrentURL();
          },
          undefined,
          (err) => {
            console.error("GLTF load error:", err);
            hideLoading();
            revokeCurrentURL();
            alert(
              "Failed to load GLTF/GLB file. Note: .gltf files with external textures/bin files cannot be loaded from a single file upload — use .glb instead.",
            );
          },
        );
      }

      function loadOBJ(url, name) {
        showLoading(`Loading ${name}...`);

        objLoader.load(
          url,
          (obj) => {
            obj.traverse((child) => {
              if (child.isMesh) {
                child.material = new THREE.MeshStandardMaterial({
                  color: 0xffffff,
                  roughness: 0.5,
                  metalness: 0.25,
                });
              }
            });

            clearModel();
            scene.add(obj);
            currentModel = obj;
            autoRotate = true;
            fitCameraToModel(obj);
            hideLoading();
            revokeCurrentURL();
          },
          undefined,
          (err) => {
            console.error("OBJ load error:", err);
            hideLoading();
            revokeCurrentURL();
            alert("Failed to load OBJ file.");
          },
        );
      }

      function loadImageAsPlane(url, name) {
        showLoading(`Loading ${name}...`);

        new THREE.TextureLoader().load(
          url,
          (texture) => {
            texture.colorSpace = THREE.SRGBColorSpace;

            clearModel();

            const imgW = texture.image.width || 1;
            const imgH = texture.image.height || 1;
            const aspect = imgW / imgH;

            const height = 3;
            const width = height * aspect;

            const plane = new THREE.Mesh(
              new THREE.PlaneGeometry(width, height),
              new THREE.MeshBasicMaterial({
                map: texture,
                side: THREE.DoubleSide,
              }),
            );

            scene.add(plane);
            currentModel = plane;
            autoRotate = false;
            fitCameraToModel(plane);

            hideLoading();
            revokeCurrentURL();
          },
          undefined,
          (err) => {
            console.error("Image load error:", err);
            hideLoading();
            revokeCurrentURL();
            alert("Failed to load image.");
          },
        );
      }

      fileInput.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const name = file.name;
        const ext = name.split(".").pop().toLowerCase();

        revokeCurrentURL();
        const url = URL.createObjectURL(file);
        currentObjectURL = url;
        fileNameEl.textContent = name;

        if (ext === "glb" || ext === "gltf") {
          loadGLTF(url, name);
        } else if (ext === "obj") {
          loadOBJ(url, name);
        } else if (["png", "jpg", "jpeg", "webp"].includes(ext)) {
          loadImageAsPlane(url, name);
        } else {
          revokeCurrentURL();
          alert(
            "Unsupported file type. Use OBJ, GLB, GLTF, PNG, JPG, JPEG, or WEBP.",
          );
        }

        e.target.value = "";
      });

      /* ===========================
         UI EVENTS
      =========================== */
      asciiViewBtn.addEventListener("click", () => {
        viewMode = "ascii";
        updateViewMode();
      });

      normalViewBtn.addEventListener("click", () => {
        viewMode = "normal";
        updateViewMode();
      });

      charSetSelect.addEventListener("change", (e) => {
        currentChars = e.target.value;
        buildAsciiEffect();
      });

      // Debounced rebuild — rebuilding the effect on every slider tick is heavy
      // let fontRebuildTimer = null;

      fontSizeSlider.addEventListener("input", (e) => {
  currentFontSize = parseInt(e.target.value, 10);
  fontSizeVal.textContent = `${currentFontSize}px`;

  if (asciiEffect) {
    asciiEffect.domElement.style.fontSize = `${currentFontSize}px`;
  }
});

      rotationSpeedSlider.addEventListener("input", (e) => {
        const val = parseFloat(e.target.value);
        rotationSpeed = val * 0.002;
        rotationSpeedVal.textContent = val.toFixed(1);
      });

      colorModeSelect.addEventListener("change", () => {
        applySceneBackground();
        styleAsciiEffect();
      });

      bgToggle.addEventListener("change", () => {
        // Rebuild because the background fill depends on the charset's
        // first character (space = empty, "." = dotted background)
        buildAsciiEffect();
      });

      /* ===========================
         AXIS HUD
      =========================== */
      const axisCanvas = document.getElementById("axisCanvas");
      const axisCtx = axisCanvas.getContext("2d");

      function drawAxis(v, color, label, cx, cy, scale) {
        const ex = cx + v.x * scale;
        const ey = cy - v.y * scale;
        const alpha = v.z < 0 ? 0.3 : 0.95;

        axisCtx.strokeStyle = color;
        axisCtx.fillStyle = color;
        axisCtx.globalAlpha = alpha;
        axisCtx.lineWidth = 2.2;
        axisCtx.beginPath();
        axisCtx.moveTo(cx, cy);
        axisCtx.lineTo(ex, ey);
        axisCtx.stroke();

        axisCtx.globalAlpha = 1;
        axisCtx.font = "11px Fira Code, monospace";
        axisCtx.fillText(label, ex + 3, ey + 3);
      }

      function updateAxisHUD() {
        const w = axisCanvas.width;
        const h = axisCanvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const scale = w * 0.35;

        axisCtx.clearRect(0, 0, w, h);

        const invQ = camera.quaternion.clone().invert();
        const xV = new THREE.Vector3(1, 0, 0).applyQuaternion(invQ);
        const yV = new THREE.Vector3(0, 1, 0).applyQuaternion(invQ);
        const zV = new THREE.Vector3(0, 0, 1).applyQuaternion(invQ);

        axisCtx.globalAlpha = 0.8;
        axisCtx.strokeStyle = "rgba(255,255,255,0.12)";
        axisCtx.lineWidth = 1;
        axisCtx.beginPath();
        axisCtx.arc(cx, cy, scale, 0, Math.PI * 2);
        axisCtx.stroke();

        drawAxis(xV, "#ff4d4d", "X", cx, cy, scale);
        drawAxis(yV, "#46ff7a", "Y", cx, cy, scale);
        drawAxis(zV, "#4da6ff", "Z", cx, cy, scale);
      }

      /* ===========================
         RESIZE
      =========================== */
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();

        renderer.setSize(window.innerWidth, window.innerHeight);

        if (asciiEffect) {
          asciiEffect.setSize(window.innerWidth, window.innerHeight);
          styleAsciiEffect();
        }
      });

      /* ===========================
         ANIMATION
      =========================== */
      function animate() {
        requestAnimationFrame(animate);
        controls.update();

        if (autoRotate && currentModel) {
          currentModel.rotation.y += rotationSpeed;
        }

        updateAxisHUD();

        if (viewMode === "ascii" && asciiEffect) {
          asciiEffect.render(scene, camera);
        } else {
          renderer.render(scene, camera);
        }
      }

      /* ===========================
         INIT
      =========================== */
      applySceneBackground();
      buildAsciiEffect();
      loadDefaultModel();
      animate();
    </script>
  </body>
</html>
