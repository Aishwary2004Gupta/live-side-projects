<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated SVG Signature</title>

  <link rel="stylesheet" href="./style.css" />

  <!-- Opentype.js CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>

  <!-- Your JS -->
  <script defer src="./script.js"></script>
</head>
<body>

  <main class="page">
    <section class="card">
      <p class="eyebrow">Animated SVG Signature</p>

      <div id="signature-container" class="signature-wrap"></div>

      <div class="controls">
        <input
          id="signature-text"
          type="text"
          value="John Doe"
          aria-label="Signature text"
        />

        <button id="update-btn" type="button">Update Text</button>
        <button id="replay-btn" type="button">Replay</button>
      </div>

      <p class="hint">
        If the font does not load, use Live Server or run this through a local server.
      </p>
    </section>
  </main>

</body>
</html>
