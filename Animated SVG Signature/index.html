<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated SVG Signature</title>
  <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 50%, #16213e 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 2rem;
    }
    
    .demo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3rem;
      max-width: 900px;
      width: 100%;
    }
    
    .signature-wrapper {
      position: relative;
      overflow: visible;
    }
    
    .signature-svg {
      display: block;
      color: #e8d5b7;
      filter: drop-shadow(0 2px 8px rgba(232, 213, 183, 0.3));
    }
    
    .signature-svg.dark {
      color: #ffffff;
      filter: drop-shadow(0 2px 8px rgba(255, 255, 255, 0.2));
    }
    
    .signature-svg.colorful {
      color: #00d4aa;
      filter: drop-shadow(0 2px 12px rgba(0, 212, 170, 0.4));
    }
    
    .controls {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 1.5rem;
      width: 100%;
      max-width: 500px;
      backdrop-filter: blur(10px);
    }
    
    .controls h3 {
      margin: 0 0 1.5rem;
      color: #e8d5b7;
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    
    .control-group {
      margin-bottom: 1rem;
    }
    
    .control-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.875rem;
    }
    
    .control-group input[type="text"],
    .control-group input[type="number"],
    .control-group input[type="color"],
    .control-group select {
      width: 100%;
      padding: 0.625rem 0.875rem;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #fff;
      font-size: 0.9375rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    
    .control-group input:focus,
    .control-group select:focus {
      outline: none;
      border-color: #e8d5b7;
      box-shadow: 0 0 0 3px rgba(232, 213, 183, 0.15);
    }
    
    .control-group input[type="color"] {
      height: 44px;
      padding: 0.25rem;
      cursor: pointer;
    }
    
    .control-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      cursor: pointer;
    }
    
    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #e8d5b7;
      cursor: pointer;
    }
    
    .checkbox-group span {
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.9375rem;
    }
    
    .btn-regenerate {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.875rem;
      background: linear-gradient(135deg, #e8d5b7 0%, #c9b08a 100%);
      border: none;
      border-radius: 8px;
      color: #1a1a2e;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    
    .btn-regenerate:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(232, 213, 183, 0.3);
    }
    
    .btn-regenerate:active {
      transform: translateY(0);
    }
    
    .examples {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      margin-top: 1rem;
    }
    
    .example-btn {
      padding: 0.5rem 1rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.8125rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .example-btn:hover {
      background: rgba(232, 213, 183, 0.15);
      border-color: #e8d5b7;
      color: #e8d5b7;
    }
    
    h1 {
      color: #fff;
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 300;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      text-align: center;
    }
    
    .subtitle {
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.9375rem;
      text-align: center;
      max-width: 600px;
    }
    
    @media (prefers-reduced-motion: reduce) {
      .signature-svg * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <h1>Signature Animation</h1>
  <p class="subtitle">Hand-written SVG signature effect powered by opentype.js — animates each character sequentially with a mask reveal</p>
  
  <div class="demo-container">
    <div class="signature-wrapper">
      <svg id="signature" class="signature-svg" aria-hidden="true"></svg>
    </div>
    
    <div class="controls">
      <h3>Customize</h3>
      
      <div class="control-group">
        <label for="textInput">Text</label>
        <input type="text" id="textInput" value="Componentry" placeholder="Enter signature text">
      </div>
      
      <div class="control-row">
        <div class="control-group">
          <label for="fontSize">Font Size</label>
          <input type="number" id="fontSize" value="48" min="16" max="120" step="1">
        </div>
        <div class="control-group">
          <label for="duration">Duration (s)</label>
          <input type="number" id="duration" value="1.8" min="0.3" max="5" step="0.1">
        </div>
      </div>
      
      <div class="control-row">
        <div class="control-group">
          <label for="delay">Delay (s)</label>
          <input type="number" id="delay" value="0.2" min="0" max="3" step="0.1">
        </div>
        <div class="control-group">
          <label for="color">Color</label>
          <input type="color" id="color" value="#e8d5b7">
        </div>
      </div>
      
      <div class="control-group">
        <label class="checkbox-group">
          <input type="checkbox" id="inView" checked>
          <span>Animate only when in view</span>
        </label>
      </div>
      
      <div class="control-group">
        <label class="checkbox-group">
          <input type="checkbox" id="once" checked>
          <span>Animate only once</span>
        </label>
      </div>
      
      <button class="btn-regenerate" id="regenerate">Regenerate Signature</button>
      
      <div class="examples">
        <button class="example-btn" data-text="Componentry">Componentry</button>
        <button class="example-btn" data-text="John Doe">John Doe</button>
        <button class="example-btn" data-text="Sarah Mitchell">Sarah Mitchell</button>
        <button class="example-btn" data-text="Alexander">Alexander</button>
        <button class="example-btn" data-text="Design + Code">Design + Code</button>
      </div>
    </div>
  </div>

  <script>
    // ============================================
    // SIGNATURE COMPONENT - Vanilla JS Implementation
    // ============================================
    
    class Signature {
      constructor(container, options = {}) {
        this.container = container;
        this.options = {
          text: options.text || 'Signature',
          color: options.color || 'currentColor',
          fontSize: options.fontSize || 32,
          duration: options.duration || 1.5,
          delay: options.delay || 0,
          inView: options.inView !== false,
          once: options.once !== false,
          fontUrl: options.fontUrl || 'https://cdn.jsdelivr.net/gh/google/fonts/ofl/greatvibes/GreatVibes-Regular.ttf'
        };
        
        this.paths = [];
        this.width = 300;
        this.height = 0;
        this.font = null;
        this.maskId = `signature-mask-${Math.random().toString(36).slice(2, 9)}`;
        this.observer = null;
        this.hasAnimated = false;
        
        this.init();
      }
      
      async init() {
        await this.loadFont();
        this.generatePaths();
        this.render();
        this.setupIntersectionObserver();
      }
      
      async loadFont() {
        try {
          this.font = await new Promise((resolve, reject) => {
            opentype.load(this.options.fontUrl, (err, font) => {
              if (err) reject(err);
              else resolve(font);
            });
          });
        } catch (error) {
          console.error('Font load error:', error);
          // Fallback: create simple paths without font
          this.font = null;
        }
      }
      
      generatePaths() {
        const { text, fontSize } = this.options;
        const horizontalPadding = fontSize * 0.1;
        const topMargin = fontSize * 1.5;
        const baseline = topMargin;
        
        this.height = fontSize * 3;
        this.paths = [];
        
        if (!this.font) {
          // Fallback: simple rectangular paths for each character
          let x = horizontalPadding;
          const charWidth = fontSize * 0.6;
          
          for (let i = 0; i < text.length; i++) {
            const char = text[i];
            if (char === ' ') {
              x += charWidth * 0.5;
              this.paths.push('');
              continue;
            }
            const d = `M${x},${baseline} h${charWidth * 0.8} v-${fontSize * 0.7} h-${charWidth * 0.8} z`;
            this.paths.push(d);
            x += charWidth;
          }
          
          this.width = x + horizontalPadding;
          return;
        }
        
        let x = horizontalPadding;
        
        for (const char of text) {
          const glyph = this.font.charToGlyph(char);
          
          if (glyph && glyph.path) {
            const path = glyph.getPath(x, baseline, fontSize);
            this.paths.push(path.toPathData(3));
            
            const advanceWidth = glyph.advanceWidth ?? this.font.unitsPerEm;
            x += advanceWidth * (fontSize / this.font.unitsPerEm);
          } else {
            // Space or unknown glyph
            x += fontSize * 0.3;
            this.paths.push('');
          }
        }
        
        this.width = x + horizontalPadding;
      }
      
      render() {
        const { color, fontSize, duration, delay } = this.options;
        const strokeWidth = 2;
        const maskStrokeWidth = fontSize * 0.22;
        
        // Build SVG content
        let svgContent = `
          <defs>
            <mask id="${this.maskId}" maskUnits="userSpaceOnUse">
        `;
        
        // Mask paths (white, thick stroke for reveal)
        this.paths.forEach((d, i) => {
          if (!d) return;
          svgContent += `
            <path
              class="mask-path"
              d="${d}"
              stroke="white"
              stroke-width="${maskStrokeWidth}"
              fill="none"
              stroke-linecap="round"
              stroke-linejoin="round"
              vector-effect="non-scaling-stroke"
              style="stroke-dasharray: ${this.getPathLength(d)}; stroke-dashoffset: ${this.getPathLength(d)}; opacity: 0;"
              data-index="${i}"
              data-delay="${delay + i * 0.2}"
              data-duration="${duration}"
            />
          `;
        });
        
        svgContent += `
            </mask>
          </defs>
        `;
        
        // Visible stroke paths (animated stroke-dashoffset)
        this.paths.forEach((d, i) => {
          if (!d) return;
          const pathLength = this.getPathLength(d);
          svgContent += `
            <path
              class="stroke-path"
              d="${d}"
              stroke="${color}"
              stroke-width="${strokeWidth}"
              fill="none"
              stroke-linecap="butt"
              stroke-linejoin="round"
              vector-effect="non-scaling-stroke"
              style="stroke-dasharray: ${pathLength}; stroke-dashoffset: ${pathLength}; opacity: 0;"
              data-index="${i}"
              data-delay="${delay + i * 0.2}"
              data-duration="${duration}"
            />
          `;
        });
        
        // Filled paths (masked)
        svgContent += `<g mask="url(#${this.maskId})">`;
        this.paths.forEach((d, i) => {
          if (!d) return;
          svgContent += `<path d="${d}" fill="${color}" />`;
        });
        svgContent += `</g>`;
        
        this.container.innerHTML = svgContent;
        this.container.setAttribute('width', this.width);
        this.container.setAttribute('height', this.height);
        this.container.setAttribute('viewBox', `0 0 ${this.width} ${this.height}`);
        this.container.setAttribute('fill', 'none');
        
        // Store path lengths for animation
        this.pathElements = {
          mask: this.container.querySelectorAll('.mask-path'),
          stroke: this.container.querySelectorAll('.stroke-path')
        };
      }
      
      getPathLength(d) {
        // Create a temporary path element to measure length
        const tempPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        tempPath.setAttribute('d', d);
        document.body.appendChild(tempPath);
        const length = tempPath.getTotalLength();
        document.body.removeChild(tempPath);
        return length;
      }
      
      animate() {
        if (this.hasAnimated && this.options.once) return;
        
        const { mask, stroke } = this.pathElements;
        const easeInOut = (t) => t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
        
        [...mask, ...stroke].forEach(el => {
          const index = parseInt(el.dataset.index);
          const delay = parseFloat(el.dataset.delay);
          const duration = parseFloat(el.dataset.duration);
          const pathLength = this.getPathLength(el.getAttribute('d'));
          
          el.style.transition = 'none';
          el.style.strokeDashoffset = pathLength;
          el.style.opacity = 0;
          
          // Force reflow
          el.getBoundingClientRect();
          
          setTimeout(() => {
            el.style.transition = `stroke-dashoffset ${duration}s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.01s ${duration - 0.01}s`;
            el.style.strokeDashoffset = 0;
            el.style.opacity = 1;
          }, delay * 1000);
        });
        
        this.hasAnimated = true;
      }
      
      setupIntersectionObserver() {
        if (!this.options.inView) {
          // Animate immediately
          requestAnimationFrame(() => this.animate());
          return;
        }
        
        this.observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              this.animate();
              if (this.options.once) {
                this.observer.unobserve(this.container);
              }
            } else if (!this.options.once) {
              this.reset();
            }
          });
        }, { threshold: 0.1 });
        
        this.observer.observe(this.container);
      }
      
      reset() {
        const { mask, stroke } = this.pathElements;
        [...mask, ...stroke].forEach(el => {
          el.style.transition = 'none';
          const pathLength = this.getPathLength(el.getAttribute('d'));
          el.style.strokeDashoffset = pathLength;
          el.style.opacity = 0;
        });
        this.hasAnimated = false;
      }
      
      updateOptions(newOptions) {
        this.options = { ...this.options, ...newOptions };
        this.maskId = `signature-mask-${Math.random().toString(36).slice(2, 9)}`;
        this.hasAnimated = false;
        
        if (this.observer) {
          this.observer.disconnect();
        }
        
        this.generatePaths();
        this.render();
        this.setupIntersectionObserver();
      }
      
      destroy() {
        if (this.observer) {
          this.observer.disconnect();
        }
        this.container.innerHTML = '';
      }
    }
    
    // ============================================
    // DEMO APPLICATION
    // ============================================
    
    const signatureEl = document.getElementById('signature');
    const textInput = document.getElementById('textInput');
    const fontSizeInput = document.getElementById('fontSize');
    const durationInput = document.getElementById('duration');
    const delayInput = document.getElementById('delay');
    const colorInput = document.getElementById('color');
    const inViewInput = document.getElementById('inView');
    const onceInput = document.getElementById('once');
    const regenerateBtn = document.getElementById('regenerate');
    const exampleBtns = document.querySelectorAll('.example-btn');
    
    let signature = null;
    
    async function createSignature() {
      if (signature) signature.destroy();
      
      signature = new Signature(signatureEl, {
        text: textInput.value || 'Signature',
        fontSize: parseInt(fontSizeInput.value) || 48,
        duration: parseFloat(durationInput.value) || 1.5,
        delay: parseFloat(delayInput.value) || 0,
        color: colorInput.value,
        inView: inViewInput.checked,
        once: onceInput.checked
      });
    }
    
    // Event listeners
    regenerateBtn.addEventListener('click', createSignature);
    
    exampleBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        textInput.value = btn.dataset.text;
        createSignature();
      });
    });
    
    // Debounced update for color (immediate visual feedback)
    colorInput.addEventListener('input', () => {
      if (signature) {
        signature.updateOptions({ color: colorInput.value });
      }
    });
    
    // Initialize
    createSignature();
    
    // Expose for debugging
    window.signature = signature;
  </script>
</body>
</html>
