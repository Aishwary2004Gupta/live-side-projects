<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>3D Carousel — Toggle Full Circle</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      /* ====== 3D Carousel Styles ====== */
      .scene,
      .a3d {
        display: grid;
      }

      .scene {
        overflow: hidden;
        perspective: 45em;
        mask: linear-gradient(90deg, #0000, #000 15% 85%, #0000);
        cursor: grab;
        width: 100%;
        max-width: 100vw;
        padding: 5rem 0;
        touch-action: pan-y;
      }

      .scene:active {
        cursor: grabbing;
      }

      .a3d {
        place-self: center;
        transform-style: preserve-3d;
        --ry: 0turn;
        transform: rotateY(var(--ry));
        will-change: transform;
      }

      .card {
        --w: 17.5em;
        --ba: calc(var(--arc) / var(--n));
        --pop: 0em;
        --tiltX: 0deg;
        --tiltY: 0deg;

        grid-area: 1 / 1;
        width: var(--w);
        aspect-ratio: 7 / 10;
        object-fit: cover;
        border-radius: 1.5em;
        box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.4);
        backface-visibility: hidden;

        transition:
          transform 0.5s cubic-bezier(0.23, 1, 0.32, 1),
          box-shadow 0.5s ease;

        transform: rotateY(calc(var(--i) * var(--ba)))
          translateZ(
            calc(
              -1 * (0.5 * var(--w) + 0.5em) / tan(0.5 * var(--ba)) + var(--pop)
            )
          )
          rotateX(var(--tiltX)) rotateY(var(--tiltY));
      }

      .card.is-hovered {
        box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.55);
        filter: saturate(1.12) contrast(1.05);
      }

      /* ====== Page Styles ====== */
      html {
        height: 100%;
        overflow: hidden;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #fff3ed;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        overflow-x: hidden;
        height: 100%;
      }

      h1 {
        color: rgb(0, 0, 0);
        margin-bottom: 0.5rem;
        text-align: center;
      }
      .info {
        color: #888;
        font-size: 0.9rem;
        margin-top: 1rem;
      }

      /* ====== Button ====== */
      .toggle-btn {
        position: fixed;
        top: 2rem;
        right: 2rem;
        padding: 0.75rem 1.5rem;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 2em;
        font-size: 0.95rem;
        cursor: pointer;
        z-index: 1000;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .toggle-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
      }

      .toggle-btn.active {
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      }
    </style>
  </head>
  <body>

          class="card"
          src="https://images.unsplash.com/photo-1597512945089-17f1e583b274?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D?w=400"
          style="--i: 15"
          alt="img"
        />
        <img
          class="card"
          src="https://images.unsplash.com/photo-1585135497273-1a86b09fe70e?q=80&w=735&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D?w=400"
          style="--i: 16"
          alt="img"
        />
      </div>
    </div>

    <p class="info">
      Drag/Scroll to rotate • Hover any front-facing card to Pop &amp; Tilt
    </p>

    <button class="toggle-btn" id="toggleBtn">Toggle Full Circle</button>

    <script>
      const scene = document.querySelector(".scene");
      const a3d = document.querySelector(".a3d");
      const cards = Array.from(document.querySelectorAll(".card"));
      const N = cards.length;
      const toggleBtn = document.getElementById("toggleBtn");

      let ry = 0;
      let velocity = 0;
      let isDragging = false;
      let isPaused = false;
      let lastX = 0;
      let isFullCircle = false;

      /* ── hover state ── */
      let hoveredCard = null;
      let mouseX = -9999;
      let mouseY = -9999;
      let mouseInScene = false;

      const FRICTION = 0.92;
      const AUTO_SPEED = 0.0003;
      const MAX_TILT = 35;
      const POP_AMOUNT = 8;
      const FRONT_ARC = 0.24;

      /* ══════════════════════════════
         HOVER LOGIC — scene-level
         All cards have pointer-events: none.
         We detect hover manually via
         getBoundingClientRect hit-testing
         on the scene's mousemove.
      ══════════════════════════════ */

      cards.forEach((c) => {
        c.style.pointerEvents = "none";
      });

      function resetCard(card) {
        card.style.setProperty("--pop", "0em");
        card.style.setProperty("--tiltX", "0deg");
        card.style.setProperty("--tiltY", "0deg");
        card.classList.remove("is-hovered");
      }

      function applyTilt(card, cx, cy) {
        const r = card.getBoundingClientRect();
        const x = Math.max(0, Math.min(1, (cx - r.left) / r.width));
        const y = Math.max(0, Math.min(1, (cy - r.top) / r.height));

        card.style.setProperty("--tiltX", (0.5 - y) * MAX_TILT * 2 + "deg");
        card.style.setProperty("--tiltY", (x - 0.5) * MAX_TILT * 2 + "deg");
        card.style.setProperty("--pop", POP_AMOUNT + "em");
        card.classList.add("is-hovered");
      }

      function cardAngle(i) {
        const raw = ry + i / N;
        return raw - Math.round(raw);
      }

      function findCardAt(cx, cy) {
        let best = null;
        let bestDist = Infinity;

        for (let i = 0; i < N; i++) {
          const angle = cardAngle(i);
          if (Math.abs(angle) > FRONT_ARC) continue;

          const r = cards[i].getBoundingClientRect();
          if (cx >= r.left && cx <= r.right &&
              cy >= r.top  && cy <= r.bottom) {
            if (Math.abs(angle) < bestDist) {
              bestDist = Math.abs(angle);
              best = cards[i];
            }
          }
        }
        return best;
      }

      function updateHover() {
        if (isDragging || !mouseInScene) return;

        const target = findCardAt(mouseX, mouseY);

        if (target === hoveredCard) {
          if (hoveredCard) applyTilt(hoveredCard, mouseX, mouseY);
          return;
        }

        if (hoveredCard) resetCard(hoveredCard);

        hoveredCard = target;

        if (hoveredCard) {
          isPaused = true;
          velocity = 0;
          applyTilt(hoveredCard, mouseX, mouseY);
        } else {
          isPaused = false;
        }
      }

      /* ── scene-level listeners ── */
      scene.addEventListener("mousemove", (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        mouseInScene = true;
        updateHover();
      });

      scene.addEventListener("mouseleave", () => {
        mouseInScene = false;
        if (hoveredCard) {
          resetCard(hoveredCard);
          hoveredCard = null;
        }
        isPaused = false;
      });

      /* ── drag & wheel ── */
      const handleMove = (x) => {
        if (!isDragging) return;
        const delta = x - lastX;
        velocity = delta * -0.0008;
        ry += velocity;
        lastX = x;
      };

      scene.addEventListener("pointerdown", (e) => {
        if (hoveredCard) {
          resetCard(hoveredCard);
          hoveredCard = null;
          isPaused = false;
        }
        isDragging = true;
        lastX = e.clientX;
        velocity = 0;
      });
      window.addEventListener("pointermove", (e) => handleMove(e.clientX));
      window.addEventListener("pointerup", () => {
        isDragging = false;
      });

      scene.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          if (isPaused) return;
          velocity -= (e.deltaX + e.deltaY) * 0.00005;
        },
        { passive: false },
      );

      /* ── animation loop ── */
      function loop() {
        if (!isDragging) {
          velocity *= FRICTION;
          if (Math.abs(velocity) < 1e-7) velocity = 0;

          if (!isPaused) {
            ry += velocity + AUTO_SPEED;
          }
        }

        a3d.style.setProperty("--ry", ry + "turn");
        requestAnimationFrame(loop);
      }

      /* ── toggle full circle ── */
      function toggleFullCircle() {
        isFullCircle = !isFullCircle;
        toggleBtn.classList.toggle("active", isFullCircle);

        // smooth transition: animate the arc variable
        const startArc = isFullCircle ? 0.6 : 1; // 0.6turn = 216° semi-circle, 1turn = full circle
        const endArc = isFullCircle ? 1 : 0.6;

        a3d.style.setProperty("--arc", startArc + "turn");

        // animate with CSS transition
        setTimeout(() => {
          a3d.style.setProperty("--arc", endArc + "turn");
        }, 10);
      }

      toggleBtn.addEventListener("click", toggleFullCircle);

      /* ── handle tab-away ── */
      window.addEventListener("blur", () => {
        isDragging = false;
        if (hoveredCard) {
          resetCard(hoveredCard);
          hoveredCard = null;
        }
        isPaused = false;
      });

      loop();
    </script>
  </body>
