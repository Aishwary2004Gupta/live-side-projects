<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>3D Jellyfish Carousel — All Cards Hoverable</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      /* ====== 3D Carousel Styles ====== */
      .scene,
      .a3d {
        display: grid;
      }

      .scene {
        overflow: hidden;
        perspective: 45em;
        mask: linear-gradient(90deg, #0000, #000 15% 85%, #0000);
        cursor: grab;
        width: 100%;
        max-width: 100vw;
        padding: 5rem 0;
        touch-action: pan-y;
      }

      .scene:active {
        cursor: grabbing;
      }

      .a3d {
        place-self: center;
        transform-style: preserve-3d;
        --ry: 0turn;
        transform: rotateY(var(--ry));
        will-change: transform;
      }

      .card {
        --w: 17.5em;
        --ba: 1turn / var(--n);
        --pop: 0em;
        --tiltX: 0deg;
        --tiltY: 0deg;

        grid-area: 1 / 1;
        width: var(--w);
        aspect-ratio: 7 / 10;
        object-fit: cover;
        border-radius: 1.5em;
        box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.4);
        backface-visibility: hidden;

        transition:
          transform 0.5s cubic-bezier(0.23, 1, 0.32, 1),
          box-shadow 0.5s ease;

        transform: rotateY(calc(var(--i) * var(--ba)))
          translateZ(
            calc(
              -1 * (0.5 * var(--w) + 0.5em) / tan(0.5 * var(--ba)) + var(--pop)
            )
          )
          rotateX(var(--tiltX)) rotateY(var(--tiltY));
      }

      .card.is-hovered {
        box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.55);
        filter: saturate(1.12) contrast(1.05);
      }

      /* ====== Page Styles ====== */
      body {
        margin: 0;
        min-height: 100vh;
        background: #fff3ed;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        overflow-x: hidden;
      }

      h1 {
        color: #c55;
        margin-bottom: 0.5rem;
        text-align: center;
      }
      .info {
        color: #888;
        font-size: 0.9rem;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>Jellyfish 3D Carousel</h1>

    <div class="scene">
      <div class="a3d" style="--n: 12">
        <img class="card" src="https://images.unsplash.com/photo-1540968221243-29f5d70540bf?w=400" style="--i: 0" alt="jelly" />
        <img class="card" src="https://images.unsplash.com/photo-1596135187959-562c650d98bc?w=400" style="--i: 1" alt="jelly" />
        <img class="card" src="https://images.unsplash.com/photo-1628944682084-831f35256163?w=400" style="--i: 2" alt="jelly" />
        <img class="card" src="https://images.unsplash.com/photo-1590013330451-3946e83e0392?w=400" style="--i: 3" alt="jelly" />
        <img class="card" src="https://images.unsplash.com/photo-1590421959604-741d0eec0a2e?w=400" style="--i: 4" alt="jelly" />
        <img class="card" src="https://images.unsplash.com/photo-1572613000712-eadc57acbecd?w=400" style="--i: 5" alt="jelly" />
        <img class="card" src="https://images.unsplash.com/photo-1570097192570-4b49a6736f9f?w=400" style="--i: 6" alt="jelly" />
        <img class="card" src="https://images.unsplash.com/photo-1620789550663-2b10e0080354?w=400" style="--i: 7" alt="jelly" />
        <img class="card" src="https://images.unsplash.com/photo-1617775623669-20bff4ffaa5c?w=400" style="--i: 8" alt="jelly" />
        <img class="card" src="https://images.unsplash.com/photo-1548600916-dc8492f8e845?w=400" style="--i: 9" alt="jelly" />
        <img class="card" src="https://images.unsplash.com/photo-1573824969595-a76d4365a2e6?w=400" style="--i: 10" alt="jelly" />
        <img class="card" src="https://images.unsplash.com/photo-1633936929709-59991b5fdd72?w=400" style="--i: 11" alt="jelly" />
      </div>
    </div>

    <p class="info">Drag/Scroll to rotate • Hover any front-facing card to Pop &amp; Tilt</p>

    <script>
      const scene = document.querySelector(".scene");
      const a3d = document.querySelector(".a3d");
      const cards = Array.from(document.querySelectorAll(".card"));
      const N = cards.length;

      let ry = 0;
      let velocity = 0;
      let isDragging = false;
      let isPaused = false;
      let lastX = 0;

      /* ── hover state ── */
      let hoveredCard = null;
      let mouseX = -9999;
      let mouseY = -9999;
      let mouseInScene = false;

      const FRICTION = 0.92;
      const AUTO_SPEED = 0.0003;
      const MAX_TILT = 35;
      const POP_AMOUNT = 8;          // em
      const FRONT_ARC = 0.24;        // ±0.24 turns ≈ ±86°

      /* ══════════════════════════════
         HOVER LOGIC — scene-level
         All cards have pointer-events: none.
         We detect hover manually via
         getBoundingClientRect hit-testing
         on the scene's mousemove.
      ══════════════════════════════ */

      // Kill native pointer events on every card
      // so DOM stacking order can never block us
      cards.forEach(c => { c.style.pointerEvents = "none"; });

      // Robust angle normalisation → always returns -0.5 … +0.5
      function cardAngle(i) {
        const raw = ry + i / N;
        return raw - Math.round(raw);
      }

      function resetCard(card) {
        card.style.setProperty("--pop", "0em");
        card.style.setProperty("--tiltX", "0deg");
        card.style.setProperty("--tiltY", "0deg");
        card.classList.remove("is-hovered");
      }

      function applyTilt(card, cx, cy) {
        const r = card.getBoundingClientRect();
        // 0 → 1 across the full card surface
        const x = Math.max(0, Math.min(1, (cx - r.left) / r.width));
        const y = Math.max(0, Math.min(1, (cy - r.top) / r.height));

        card.style.setProperty("--tiltX", ((0.5 - y) * MAX_TILT * 2) + "deg");
        card.style.setProperty("--tiltY", ((x - 0.5) * MAX_TILT * 2) + "deg");
        card.style.setProperty("--pop", POP_AMOUNT + "em");
        card.classList.add("is-hovered");
      }

      // Given a screen point, find the best front-facing card under it
      function findCardAt(cx, cy) {
        let best = null;
        let bestDist = Infinity;

        for (let i = 0; i < N; i++) {
          const angle = cardAngle(i);

          // skip cards not facing the viewer
          if (Math.abs(angle) > FRONT_ARC) continue;

          const r = cards[i].getBoundingClientRect();

          // is the cursor inside this card's on-screen rectangle?
          if (cx >= r.left && cx <= r.right &&
              cy >= r.top  && cy <= r.bottom) {
            // among overlapping rects pick the most centred card
            if (Math.abs(angle) < bestDist) {
              bestDist = Math.abs(angle);
              best = cards[i];
            }
          }
        }
        return best;
      }

      function updateHover() {
        if (isDragging || !mouseInScene) return;

        const target = findCardAt(mouseX, mouseY);

        // nothing changed
        if (target === hoveredCard) {
          if (hoveredCard) applyTilt(hoveredCard, mouseX, mouseY);
          return;
        }

        // clear old
        if (hoveredCard) resetCard(hoveredCard);

        hoveredCard = target;

        if (hoveredCard) {
          isPaused = true;
          velocity = 0;
          applyTilt(hoveredCard, mouseX, mouseY);
        } else {
          isPaused = false;
        }
      }

      /* ── scene-level listeners ── */
      scene.addEventListener("mousemove", e => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        mouseInScene = true;
        updateHover();
      });

      scene.addEventListener("mouseleave", () => {
        mouseInScene = false;
        if (hoveredCard) {
          resetCard(hoveredCard);
          hoveredCard = null;
        }
        isPaused = false;
      });

      /* ══════════════════════════════
         DRAG & WHEEL (unchanged logic)
      ══════════════════════════════ */
      const handleMove = x => {
        if (!isDragging) return;
        const delta = x - lastX;
        velocity = delta * -0.0008;
        ry += velocity;
        lastX = x;
      };

      scene.addEventListener("pointerdown", e => {
        // cancel hover on drag start
        if (hoveredCard) {
          resetCard(hoveredCard);
          hoveredCard = null;
          isPaused = false;
        }
        isDragging = true;
        lastX = e.clientX;
        velocity = 0;
      });
      window.addEventListener("pointermove", e => handleMove(e.clientX));
      window.addEventListener("pointerup", () => { isDragging = false; });

      scene.addEventListener("wheel", e => {
        e.preventDefault();
        if (isPaused) return;          // freeze while hovering
        velocity -= (e.deltaX + e.deltaY) * 0.00005;
      }, { passive: false });

      /* ══════════════════════════════
         ANIMATION LOOP
      ══════════════════════════════ */
      function loop() {
        if (!isDragging) {
          velocity *= FRICTION;
          if (Math.abs(velocity) < 1e-7) velocity = 0;

          if (!isPaused) {
            ry += velocity + AUTO_SPEED;
          }
          // while paused: nothing added → carousel is frozen
        }

        a3d.style.setProperty("--ry", ry + "turn");
        requestAnimationFrame(loop);
      }

      // handle tab-away
      window.addEventListener("blur", () => {
        isDragging = false;
        if (hoveredCard) { resetCard(hoveredCard); hoveredCard = null; }
        isPaused = false;
      });

      loop();
    </script>
  </body>
</html>
