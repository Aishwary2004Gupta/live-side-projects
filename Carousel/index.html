<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>3D Carousel with Horizontal Scroll Control</title>
	<style>
		const-root { all: initial; }

		:root {
			--bg: #fff3ed;
			--fade-color: #000;
		}

		* { box-sizing: border-box; }

		html, body {
			height: 100%;
			margin: 0;
		}

		body {
			display: grid;
			place-items: center;
			background: var(--bg);
			font-family: system-ui, sans-serif;
		}

		.scene,
		.a3d {
			display: grid;
		}

		.scene {
			width: 100vw;
			height: 100vh;
			overflow-x: auto;
			overflow-y: hidden;
			perspective: 35em;
			padding: 2rem 50vw;
			scrollbar-width: thin;
			-webkit-overflow-scrolling: touch;
			mask: linear-gradient(90deg, transparent, var(--fade-color) 20% 80%, transparent);
			-webkit-mask: linear-gradient(90deg, transparent, var(--fade-color) 20% 80%, transparent);
			grid-template-columns: auto 220vw;
			align-items: center;
			cursor: grab;
		}

		.scene:active {
			cursor: grabbing;
		}

		.a3d {
			place-self: center;
			transform-style: preserve-3d;
			transform: rotateY(var(--ry, 0turn));
			will-change: transform;
		}

		.card {
			--w: 17.5em;
			--ba: calc(1turn / var(--n));
			grid-area: 1 / 1;
			width: var(--w);
			aspect-ratio: 7 / 10;
			object-fit: cover;
			border-radius: 1.5em;
			backface-visibility: hidden;
			box-shadow:
				0 1.2em 2em rgba(0, 0, 0, 0.18),
				0 0.35em 0.8em rgba(0, 0, 0, 0.12);
			transform:
				rotateY(calc(var(--i) * var(--ba)))
				translateZ(calc(-1 * (.5 * var(--w) + .5em) / tan(.5 * var(--ba))));
			user-select: none;
			-webkit-user-drag: none;
		}

		.spacer {
			height: 1px;
		}

		.hint {
			position: fixed;
			left: 50%;
			bottom: 1rem;
			transform: translateX(-50%);
			padding: 0.6rem 0.9rem;
			border-radius: 999px;
			background: rgba(255, 255, 255, 0.75);
			backdrop-filter: blur(8px);
			color: #5b463f;
			font-size: 0.9rem;
			box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.08);
			pointer-events: none;
		}

		@media (max-width: 700px) {
			.card {
				--w: 12.5em;
				border-radius: 1em;
			}

			.scene {
				padding: 1rem 55vw;
				grid-template-columns: auto 260vw;
			}
		}

		@media (prefers-reduced-motion: reduce) {
			.a3d {
				transition: none;
			}
		}
	</style>
</head>
<body>
	<div class="scene" id="scene">
		<div class="a3d" id="carousel" style="--n: 12">
			<img class="card" src="https://images.unsplash.com/photo-1540968221243-29f5d70540bf?w=280" style="--i: 0" alt="jellyfish" />
			<img class="card" src="https://images.unsplash.com/photo-1596135187959-562c650d98bc?w=280" style="--i: 1" alt="jellyfish" />
			<img class="card" src="https://images.unsplash.com/photo-1628944682084-831f35256163?w=280" style="--i: 2" alt="jellyfish" />
			<img class="card" src="https://images.unsplash.com/photo-1590013330451-3946e83e0392?w=280" style="--i: 3" alt="jellyfish" />
			<img class="card" src="https://images.unsplash.com/photo-1590421959604-741d0eec0a2e?w=280" style="--i: 4" alt="jellyfish" />
			<img class="card" src="https://images.unsplash.com/photo-1572613000712-eadc57acbecd?w=280" style="--i: 5" alt="jellyfish" />
			<img class="card" src="https://images.unsplash.com/photo-1570097192570-4b49a6736f9f?w=280" style="--i: 6" alt="jellyfish" />
			<img class="card" src="https://images.unsplash.com/photo-1620789550663-2b10e0080354?w=280" style="--i: 7" alt="jellyfish" />
			<img class="card" src="https://images.unsplash.com/photo-1617775623669-20bff4ffaa5c?w=280" style="--i: 8" alt="jellyfish" />
			<img class="card" src="https://images.unsplash.com/photo-1548600916-dc8492f8e845?w=280" style="--i: 9" alt="jellyfish" />
			<img class="card" src="https://images.unsplash.com/photo-1573824969595-a76d4365a2e6?w=280" style="--i: 10" alt="jellyfish" />
			<img class="card" src="https://images.unsplash.com/photo-1633936929709-59991b5fdd72?w=280" style="--i: 11" alt="jellyfish" />
		</div>
		<div class="spacer"></div>
	</div>

	<div class="hint">Scroll horizontally, use mouse wheel, or drag</div>

	<script>
		const scene = document.getElementById('scene');
		const carousel = document.getElementById('carousel');

		function updateRotation() {
			const maxScroll = scene.scrollWidth - scene.clientWidth;
			const progress = maxScroll > 0 ? scene.scrollLeft / maxScroll : 0;
			carousel.style.setProperty('--ry', `${progress}turn`);
		}

		scene.addEventListener('scroll', updateRotation, { passive: true });

		scene.addEventListener('wheel', (e) => {
			if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
				e.preventDefault();
				scene.scrollLeft += e.deltaY;
			}
		}, { passive: false });

		let isDown = false;
		let startX = 0;
		let startScrollLeft = 0;

		scene.addEventListener('pointerdown', (e) => {
			isDown = true;
			startX = e.clientX;
			startScrollLeft = scene.scrollLeft;
			scene.setPointerCapture(e.pointerId);
		});

		scene.addEventListener('pointermove', (e) => {
			if (!isDown) return;
			const dx = e.clientX - startX;
			scene.scrollLeft = startScrollLeft - dx;
		});

		function endDrag(e) {
			isDown = false;
			if (e.pointerId != null) {
				try { scene.releasePointerCapture(e.pointerId); } catch (_) {}
			}
		}

		scene.addEventListener('pointerup', endDrag);
		scene.addEventListener('pointercancel', endDrag);
		scene.addEventListener('pointerleave', () => { isDown = false; });

		updateRotation();
	</script>
</body>
</html>
