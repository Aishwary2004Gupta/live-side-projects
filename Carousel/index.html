<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>3D Jellyfish Carousel — Hover Pop & Tilt</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      /* ====== 3D Carousel Styles ====== */
      .scene,
      .a3d {
        display: grid;
      }

      .scene {
        overflow: hidden;
        perspective: 35em;
        mask: linear-gradient(90deg, #0000, #000 18% 82%, #0000);
        cursor: grab;
        width: 100%;
        max-width: 100vw;
        padding: 2rem 0;
      }

      .scene:active {
        cursor: grabbing;
      }

      .a3d {
        place-self: center;
        transform-style: preserve-3d;
        --ry: 0turn;
        transform: rotateY(var(--ry));
        will-change: transform;
      }

      .card {
        --w: 17.5em;
        --ba: 1turn / var(--n);
        --pop: 0em;
        --tiltX: 0deg;
        --tiltY: 0deg;

        grid-area: 1 / 1;
        width: var(--w);
        aspect-ratio: 7 / 10;
        object-fit: cover;
        border-radius: 1.5em;
        box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        backface-visibility: hidden;
        transition:
          --pop 0.45s ease,
          --tiltX 0.15s ease,
          --tiltY 0.15s ease,
          box-shadow 0.45s ease;

        transform: rotateY(calc(var(--i) * var(--ba)))
          translateZ(
            calc(
              -1 * (0.5 * var(--w) + 0.5em) / tan(0.5 * var(--ba)) + var(--pop)
            )
          )
          rotateX(var(--tiltX)) rotateY(var(--tiltY));
      }

      .card:hover {
        box-shadow: 0 25px 50px -15px rgba(0, 0, 0, 0.6);
      }

      /* ====== Page Styles ====== */
      body {
        margin: 0;
        min-height: 100vh;
        background: #fff3ed;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        padding: 2rem 1rem;
        box-sizing: border-box;
      }

      h1 {
        color: #c55;
        margin: 0 0 1rem 0;
        font-size: 2.2rem;
        text-align: center;
      }

      .info {
        text-align: center;
        color: #666;
        margin-top: 1.5rem;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <h1>Jellyfish 3D Carousel</h1>

    <div class="scene">
      <div class="a3d" style="--n: 12">
        <img
          class="card"
          src="https://images.unsplash.com/photo-1540968221243-29f5d70540bf?w=280"
          style="--i: 0"
          alt="jellyfish"
        />
        <img
          class="card"
          src="https://images.unsplash.com/photo-1596135187959-562c650d98bc?w=280"
          style="--i: 1"
          alt="jellyfish"
        />
        <img
          class="card"
          src="https://images.unsplash.com/photo-1628944682084-831f35256163?w=280"
          style="--i: 2"
          alt="jellyfish"
        />
        <img
          class="card"
          src="https://images.unsplash.com/photo-1590013330451-3946e83e0392?w=280"
          style="--i: 3"
          alt="jellyfish"
        />
        <img
          class="card"
          src="https://images.unsplash.com/photo-1590421959604-741d0eec0a2e?w=280"
          style="--i: 4"
          alt="jellyfish"
        />
        <img
          class="card"
          src="https://images.unsplash.com/photo-1572613000712-eadc57acbecd?w=280"
          style="--i: 5"
          alt="jellyfish"
        />
        <img
          class="card"
          src="https://images.unsplash.com/photo-1570097192570-4b49a6736f9f?w=280"
          style="--i: 6"
          alt="jellyfish"
        />
        <img
          class="card"
          src="https://images.unsplash.com/photo-1620789550663-2b10e0080354?w=280"
          style="--i: 7"
          alt="jellyfish"
        />
        <img
          class="card"
          src="https://images.unsplash.com/photo-1617775623669-20bff4ffaa5c?w=280"
          style="--i: 8"
          alt="jellyfish"
        />
        <img
          class="card"
          src="https://images.unsplash.com/photo-1548600916-dc8492f8e845?w=280"
          style="--i: 9"
          alt="jellyfish"
        />
        <img
          class="card"
          src="https://images.unsplash.com/photo-1573824969595-a76d4365a2e6?w=280"
          style="--i: 10"
          alt="jellyfish"
        />
        <img
          class="card"
          src="https://images.unsplash.com/photo-1633936929709-59991b5fdd72?w=280"
          style="--i: 11"
          alt="jellyfish"
        />
      </div>
    </div>

    <div class="info">
      ← Drag or scroll horizontally • Hover cards for 3D pop & tilt →
    </div>

    <script>
      const scene = document.querySelector(".scene");
      const a3d = document.querySelector(".a3d");
      const cards = document.querySelectorAll(".card");

      let ry = 0;
      let velocity = 0;
      let isDragging = false;
      let lastX = 0;
      let raf;

      const FRICTION = 0.89;
      const AUTO_SPEED = 0.00025;

      // Animation loop
      function loop() {
        velocity *= FRICTION;
        ry += velocity + AUTO_SPEED;
        a3d.style.setProperty("--ry", ry + "turn");
        raf = requestAnimationFrame(loop);
      }

      // Wheel scrolling
      scene.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          const delta = e.deltaX * 1.8 + e.deltaY * 0.9;
          velocity -= delta * 0.00095;
        },
        { passive: false },
      );

      // Drag support
      const startDrag = (x) => {
        isDragging = true;
        lastX = x;
        velocity = 0;
      };

      const moveDrag = (x) => {
        if (!isDragging) return;
        const delta = x - lastX;
        velocity = delta * -0.0045;
        ry += velocity;
        lastX = x;
        a3d.style.setProperty("--ry", ry + "turn");
      };

      scene.addEventListener("pointerdown", (e) => startDrag(e.clientX));
      window.addEventListener("pointermove", (e) => moveDrag(e.clientX));
      window.addEventListener("pointerup", () => (isDragging = false));

      // Touch support
      scene.addEventListener(
        "touchstart",
        (e) => startDrag(e.touches[0].clientX),
        { passive: true },
      );
      scene.addEventListener(
        "touchmove",
        (e) => moveDrag(e.touches[0].clientX),
        { passive: true },
      );
      scene.addEventListener("touchend", () => (isDragging = false));

      // ====== Hover Pop + Tilt Effect ======
      cards.forEach((card) => {
        card.addEventListener("mousemove", (e) => {
          const rect = card.getBoundingClientRect();
          const x = (e.clientX - rect.left) / rect.width; // 0 to 1
          const y = (e.clientY - rect.top) / rect.height; // 0 to 1

          const tiltX = (y - 0.5) * -38; // top tilts down
          const tiltY = (x - 0.5) * 38; // left/right tilt

          card.style.setProperty("--tiltX", tiltX + "deg");
          card.style.setProperty("--tiltY", tiltY + "deg");
          card.style.setProperty("--pop", "8.5em");
        });

        card.addEventListener("mouseleave", () => {
          card.style.setProperty("--tiltX", "0deg");
          card.style.setProperty("--tiltY", "0deg");
          card.style.setProperty("--pop", "0em");
        });
      });

      // Start animation
      loop();
    </script>
  </body>
</html>
