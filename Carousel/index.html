<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Carousel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      /* ====== 3D Carousel Styles ====== */
      .scene,
      .a3d {
        display: grid;
      }

      .scene {
        overflow: hidden;
        perspective: 45em;
        mask: linear-gradient(90deg, #0000, #000 15% 85%, #0000);
        -webkit-mask: linear-gradient(90deg, #0000, #000 15% 85%, #0000);
        cursor: grab;
        width: 100%;
        max-width: 100vw;
        padding: 5rem 0;
        touch-action: pan-y;
        /* Smooth scene-level transitions */
        transition:
          perspective 1400ms cubic-bezier(0.16, 1, 0.3, 1),
          padding 1400ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      .scene:active {
        cursor: grabbing;
      }

      .a3d {
        place-self: center;
        transform-style: preserve-3d;
        --ry: 0turn;
        transform: rotateY(var(--ry));
        will-change: transform;
      }

      .card {
        --w: 17.5em;
        --ba: 1turn / var(--n);
        --pop: 0em;
        --tiltX: 0deg;
        --tiltY: 0deg;

        grid-area: 1 / 1;
        width: var(--w);
        aspect-ratio: 7 / 10;
        object-fit: cover;
        border-radius: 1.5em;
        box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.4);
        backface-visibility: hidden;

        transition:
          transform 0.5s cubic-bezier(0.23, 1, 0.32, 1),
          box-shadow 0.5s ease,
          filter 0.4s ease;

        transform: rotateY(calc(var(--i) * var(--ba)))
          translateZ(
            calc(
              -1 * (0.5 * var(--w) + 0.5em) / tan(0.5 * var(--ba)) + var(--pop)
            )
          )
          rotateX(var(--tiltX)) rotateY(var(--tiltY));
      }

      .card.is-hovered {
        box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.55);
        filter: saturate(1.12) contrast(1.05);
      }

      /* ====== Page Styles ====== */
      html {
        height: 100%;
        overflow: hidden;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #fff3ed;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        overflow-x: hidden;
        height: 100%;
        transition: background 800ms ease;
      }

      .info {
        color: #888;
        font-size: 0.95rem;
        z-index: 10;
        pointer-events: none;
        text-align: center;
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        transition:
          opacity 600ms ease,
          transform 600ms cubic-bezier(0.16, 1, 0.3, 1),
          font-size 600ms ease,
          color 600ms ease;
      }

      /* Hide info during layout transition */
      .scene.is-layouting .info {
        opacity: 0;
        transform: translateX(-50%) translateY(10px) scale(0.95);
      }

      /* ============================================================
         FULL CIRCLE MODE
         ============================================================ */
      .scene.full {
        mask: none;
        -webkit-mask: none;
        position: fixed;
        inset: 0;
        padding: 0;
        perspective: 120em;
      }

      .scene.full .a3d {
        transform: rotateZ(var(--ry));
      }

      .scene.full .card {
        --w: clamp(4.2rem, 9vmin, 6.4rem);
        border-radius: 0.65rem;
        box-shadow: 0 12px 28px -14px rgba(0, 0, 0, 0.35);
        --R: min(44vmin, 420px);

        transform: rotateZ(calc(var(--i) * (1turn / var(--n))))
          translateY(calc(-1 * var(--R))) translateZ(var(--pop))
          rotateX(var(--tiltX)) rotateY(var(--tiltY));
      }

      /* Center the info text inside the circle in full mode */
      .scene.full .info {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 1.05rem;
        color: #666;
        z-index: 20;
        text-align: center;
        white-space: nowrap;
      }

      .scene.full.is-layouting .info {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.95);
      }

      .scene.full::after {
        content: "";
        position: absolute;
        width: calc(var(--R) * 2 + 20vmin);
        aspect-ratio: 1;
        border-radius: 50%;
        border: 1px solid rgba(0, 0, 0, 0.07);
        pointer-events: none;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
        transition:
          transform 1000ms cubic-bezier(0.16, 1, 0.3, 1) 400ms,
          opacity 800ms ease 400ms;
      }

      .scene.full.is-layouting::after {
        transform: translate(-50%, -50%) scale(0.3);
        opacity: 0;
        transition:
          transform 100ms ease,
          opacity 100ms ease;
      }

      /* ============================================================
         LAYOUT TRANSITION — smooth orchestrated animation
         ============================================================ */
      .scene.is-layouting .a3d {
        transition: transform 1400ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      .scene.is-layouting .card {
        transition:
          transform 1400ms cubic-bezier(0.16, 1, 0.3, 1),
          width 1200ms cubic-bezier(0.16, 1, 0.3, 1),
          border-radius 1000ms cubic-bezier(0.22, 0.61, 0.36, 1),
          box-shadow 800ms ease,
          filter 600ms ease;

        /* Stagger each card for a wave effect */
        transition-delay: calc(var(--i) * 30ms), calc(var(--i) * 30ms),
          calc(var(--i) * 25ms), calc(var(--i) * 20ms), calc(var(--i) * 15ms);
      }

      /* ============================================================
         Fade overlay during transition
         ============================================================ */
      .transition-overlay {
        position: fixed;
        inset: 0;
        background: radial-gradient(
          ellipse at center,
          rgba(255, 243, 237, 0.6) 0%,
          rgba(255, 243, 237, 0) 70%
        );
        pointer-events: none;
        z-index: 5;
        opacity: 0;
        transition: opacity 800ms ease;
      }

      .transition-overlay.active {
        opacity: 1;
      }

      /* ============================================================
         Layout Button
         ============================================================ */
      .layout-btn {
        position: fixed;
        top: 1.25rem;
        right: 1.25rem;
        z-index: 100;
        border: 1px solid rgba(0, 0, 0, 0.15);
        background: #fff;
        padding: 0.65rem 1.05rem;
        border-radius: 999px;
        font: inherit;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        transition:
          transform 400ms cubic-bezier(0.16, 1, 0.3, 1),
          box-shadow 400ms ease,
          opacity 300ms ease;
        user-select: none;
      }

      .layout-btn:hover {
        transform: translateY(-1px) scale(1.03);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      }

      .layout-btn:active {
        transform: translateY(0px) scale(0.97);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .layout-btn.is-transitioning {
        opacity: 0.6;
        pointer-events: none;
      }
    </style>
  </head>

  <body>

          class="card"
          src="https://images.unsplash.com/photo-1545126178-862cdb469409?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D?w=400"
          style="--i: 14"

        <img
          class="card"
          src="https://images.unsplash.com/photo-1597512945089-17f1e583b274?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D?w=400"
          style="--i: 15"

        />
        <img
          class="card"
          src="https://images.unsplash.com/photo-1585135497273-1a86b09fe70e?q=80&w=735&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D?w=400"
          style="--i: 16"
          alt="img"
        />
      </div>

      <p class="info">
        Drag/Scroll to rotate • Hover any front-facing card to Pop &amp; Tilt
      </p>
    </div>

    <script>
      const scene = document.querySelector(".scene");
      const a3d = document.querySelector(".a3d");
      const cards = Array.from(document.querySelectorAll(".card"));
      const btn = document.getElementById("layoutBtn");
      const overlay = document.getElementById("overlay");
      const N = cards.length;

      let ry = 0;
      let velocity = 0;
      let isDragging = false;
      let isPaused = false;
      let lastX = 0;

      let isFull = false;
      let isLayouting = false;

      let hoveredCard = null;
      let mouseX = -9999;
      let mouseY = -9999;
      let mouseInScene = false;

      // Smooth rotation animation during layout
      let layoutAnim = null;
      let layoutStartRy = 0;
      let layoutTargetRy = 0;
      let layoutStartTime = 0;
      const LAYOUT_DURATION = 1400;

      const FRICTION = 0.92;
      const AUTO_SPEED = 0.0003;
      const MAX_TILT = 35;
      const POP_SEMI = 8;
      const POP_FULL = 2.25;
      const FRONT_ARC = 0.24;

      cards.forEach((c) => (c.style.pointerEvents = "none"));

      // Easing: custom spring-like
      function easeOutExpo(t) {
        return t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
      }

      function easeInOutQuart(t) {
        return t < 0.5 ? 8 * t * t * t * t : 1 - Math.pow(-2 * t + 2, 4) / 2;
      }

      function cardAngle(i) {
        const raw = ry + i / N;
        return raw - Math.round(raw);
      }

      function resetCard(card) {
        card.style.setProperty("--pop", "0em");
        card.style.setProperty("--tiltX", "0deg");
        card.style.setProperty("--tiltY", "0deg");
        card.classList.remove("is-hovered");
      }

      function applyTilt(card, cx, cy) {
        const r = card.getBoundingClientRect();
        const x = Math.max(0, Math.min(1, (cx - r.left) / r.width));
        const y = Math.max(0, Math.min(1, (cy - r.top) / r.height));

        const pop = isFull ? POP_FULL : POP_SEMI;

        card.style.setProperty("--tiltX", (0.5 - y) * MAX_TILT * 2 + "deg");
        card.style.setProperty("--tiltY", (x - 0.5) * MAX_TILT * 2 + "deg");
        card.style.setProperty("--pop", pop + "em");
        card.classList.add("is-hovered");
      }

      function findCardAt(cx, cy) {
        let best = null;
        let bestDist = Infinity;
        const ARC = isFull ? 0.5 : FRONT_ARC;

        for (let i = 0; i < N; i++) {
          const angle = cardAngle(i);
          if (Math.abs(angle) > ARC) continue;

          const r = cards[i].getBoundingClientRect();
          if (cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom) {
            if (Math.abs(angle) < bestDist) {
              bestDist = Math.abs(angle);
              best = cards[i];
            }
          }
        }
        return best;
      }

      function updateHover() {
        if (isDragging || !mouseInScene || isLayouting) return;
        const target = findCardAt(mouseX, mouseY);

        if (target === hoveredCard) {
          if (hoveredCard) applyTilt(hoveredCard, mouseX, mouseY);
          return;
        }

        if (hoveredCard) resetCard(hoveredCard);
        hoveredCard = target;

        if (hoveredCard) {
          isPaused = true;
          velocity = 0;
          applyTilt(hoveredCard, mouseX, mouseY);
        } else {
          isPaused = false;
        }
      }

      scene.addEventListener("mousemove", (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        mouseInScene = true;
        updateHover();
      });

      scene.addEventListener("mouseleave", () => {
        mouseInScene = false;
        if (hoveredCard) {
          resetCard(hoveredCard);
          hoveredCard = null;
        }
        isPaused = false;
      });

      scene.addEventListener("pointerdown", (e) => {
        if (isLayouting) return;
        if (hoveredCard) {
          resetCard(hoveredCard);
          hoveredCard = null;
          isPaused = false;
        }
        isDragging = true;
        lastX = e.clientX;
        velocity = 0;
      });

      window.addEventListener("pointermove", (e) => {
        if (!isDragging) return;
        const delta = e.clientX - lastX;
        velocity = delta * -0.0008;
        ry += velocity;
        lastX = e.clientX;
      });

      window.addEventListener("pointerup", () => (isDragging = false));

      scene.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          if (isPaused || isLayouting) return;
          velocity -= (e.deltaX + e.deltaY) * 0.00005;
        },
        { passive: false }
      );

      btn.addEventListener("click", () => {
        if (isLayouting) return; // prevent double clicks

        if (hoveredCard) {
          resetCard(hoveredCard);
          hoveredCard = null;
        }
        isPaused = false;
        velocity = 0;

        // Snap to nearest card for clean transition
        layoutStartRy = ry;
        layoutTargetRy = Math.round(ry * N) / N;
        layoutStartTime = performance.now();

        isFull = !isFull;
        btn.textContent = isFull ? "Show semi circle" : "Show full circle";
        btn.classList.add("is-transitioning");

        isLayouting = true;
        scene.classList.add("is-layouting");

        // Show overlay
        overlay.classList.add("active");

        // Use double-rAF to ensure browser captures "before" state
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            scene.classList.toggle("full", isFull);
          });
        });

        // Fade overlay out midway
        setTimeout(() => {
          overlay.classList.remove("active");
        }, LAYOUT_DURATION * 0.5);

        setTimeout(() => {
          isLayouting = false;
          scene.classList.remove("is-layouting");
          btn.classList.remove("is-transitioning");
        }, LAYOUT_DURATION + 200);
      });

      function loop(now) {
        if (isLayouting) {
          // Smoothly animate ry to snap target
          const elapsed = now - layoutStartTime;
          const t = Math.min(1, elapsed / LAYOUT_DURATION);
          const eased = easeOutExpo(t);
          ry = layoutStartRy + (layoutTargetRy - layoutStartRy) * eased;
        } else if (!isDragging) {
          velocity *= FRICTION;
          if (Math.abs(velocity) < 1e-7) velocity = 0;

          if (!isPaused) {
            ry += velocity + AUTO_SPEED;
          }
        }

        a3d.style.setProperty("--ry", ry + "turn");
        requestAnimationFrame(loop);
      }

      window.addEventListener("blur", () => {
        isDragging = false;
        if (hoveredCard) {
          resetCard(hoveredCard);
          hoveredCard = null;
        }
        isPaused = false;
      });

      requestAnimationFrame(loop);
    </script>
  </body>
</html>
