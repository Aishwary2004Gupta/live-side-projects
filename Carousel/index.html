<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>3D Carousel — Centered Layouts</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #fff3ed;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        position: relative;
      }

      /* ====== 3D Scene ====== */
      .scene {
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        cursor: grab;
        touch-action: none;
        user-select: none;
      }

      .scene:active {
        cursor: grabbing;
      }

      .a3d {
        position: relative;
        transform-style: preserve-3d;
        will-change: transform;
        /* Center the pivot point */
        display: grid;
        place-items: center;
      }

      /* ====== Cards ====== */
      .card {
        grid-area: 1 / 1;
        width: var(--w);
        aspect-ratio: 7 / 10;
        object-fit: cover;
        border-radius: var(--br);
        box-shadow:
          0 10px 30px -10px rgba(0, 0, 0, 0.4),
          0 0 0 1px rgba(255, 255, 255, 0.1) inset;
        backface-visibility: hidden;
        pointer-events: none;

        transition:
          transform 0.8s cubic-bezier(0.22, 1, 0.36, 1),
          box-shadow 0.4s ease,
          filter 0.4s ease,
          width 0.8s cubic-bezier(0.22, 1, 0.36, 1),
          border-radius 0.8s ease;
      }

      .card.is-hovered {
        box-shadow:
          0 30px 60px -12px rgba(0, 0, 0, 0.6),
          0 0 0 2px rgba(255, 255, 255, 0.3) inset;
        filter: saturate(1.15) contrast(1.05) brightness(1.05);
        z-index: 100;
      }

      /* ====== UI Elements ====== */
      .info {
        position: fixed;
        bottom: 2rem;
        left: 50%;
        transform: translateX(-50%);
        color: #666;
        font-size: 0.9rem;
        text-align: center;
        pointer-events: none;
        z-index: 10;
        background: rgba(255, 243, 237, 0.8);
        padding: 0.5rem 1rem;
        border-radius: 2rem;
        backdrop-filter: blur(8px);
      }

      .toggle-btn {
        position: fixed;
        top: 2rem;
        right: 2rem;
        padding: 0.9rem 1.8rem;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 2rem;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        z-index: 1000;
        box-shadow: 0 4px 20px rgba(102, 126, 234, 0.3);
        transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .toggle-btn:hover {
        transform: translateY(-2px) scale(1.02);
        box-shadow: 0 8px 30px rgba(102, 126, 234, 0.4);
      }

      .toggle-btn.active {
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        box-shadow: 0 4px 20px rgba(245, 87, 108, 0.3);
      }
    </style>
  </head>
  <body>
    <div class="scene" id="scene">
      <div class="a3d" id="a3d" style="--n: 17">
        <img
          class="card"
          src="https://images.unsplash.com/photo-1730652201845-095193ddb555?q=80&w=722&auto=format&fit=crop"

        <img

          style="--i: 1"

        <img
          class="card"

          style="--i: 2"

        <img

        <img

        <img

        <img

        <img

        <img

        <img

        <img

        <img

        <img

        />
        <img
          class="card"
          src="https://images.unsplash.com/photo-1545126178-862cdb469409?q=80&w=687&auto=format&fit=crop"
          style="--i: 14"
          alt="art"
        />
        <img
          class="card"
          src="https://images.unsplash.com/photo-1597512945089-17f1e583b274?q=80&w=687&auto=format&fit=crop"
          style="--i: 15"
          alt="art"
        />
        <img
          class="card"
          src="https://images.unsplash.com/photo-1585135497273-1a86b09fe70e?q=80&w=735&auto=format&fit=crop"
          style="--i: 16"
          alt="art"
        />
      </div>
    </div>

    <p class="info">
      Drag / Scroll to rotate &nbsp;•&nbsp; Hover to Pop & Tilt
    </p>
    <button class="toggle-btn" id="toggleBtn">Full Circle View</button>

    <script>
      const scene = document.getElementById("scene");
      const a3d = document.getElementById("a3d");
      const cards = Array.from(document.querySelectorAll(".card"));
      const N = cards.length;
      const btn = document.getElementById("toggleBtn");

      // State
      let ry = 0,
        velocity = 0,
        isDragging = false,
        isPaused = false,
        lastX = 0;
      let isFullCircle = false;
      let hoveredCard = null;
      let mouseX = 0,
        mouseY = 0;

      // Layout configurations
      const configs = {
        semi: {
          cardW: 16, // em
          radius: null, // calculated
          arc: 0.6, // 60% of circle (216deg)
          tiltX: 0, // upright
          perspective: 50, // em
          cardBr: 1.5, // em
          pop: 8, // em
        },
        full: {
          cardW: 9, // em (smaller for ring)
          radius: 28, // em (large radius for ring)
          arc: 1.0, // full 360
          tiltX: -65, // degrees (view from above)
          perspective: 120, // em (wider view)
          cardBr: 0.6, // em (slightly sharper)
          pop: 4, // em (less pop in ring mode)
        },
      };

      // Current animated values
      const state = {
        ...configs.semi,
        tiltX: 0,
        cardW: 16,
        radius: 0,
        cardBr: 1.5,
        pop: 8,
      };

      // Calculate radius for semi-circle based on card width and count
      function calcSemiRadius(w, n, arc) {
        return (0.5 * w + 0.5) / Math.tan((Math.PI * arc) / n);
      }

      // Initialize
      configs.semi.radius = calcSemiRadius(
        configs.semi.cardW,
        N,
        configs.semi.arc,
      );
      state.radius = configs.semi.radius;

      // Lerp helper
      const lerp = (a, b, t = 0.06) =>
        Math.abs(b - a) < 0.001 ? b : a + (b - a) * t;

      // Update card transforms
      function updateCards() {
        const ba = (state.arc * Math.PI * 2) / N; // base angle in radians

        cards.forEach((card, i) => {
          const angle = (i / N) * state.arc - state.arc / 2; // center the arc
          const rotY = angle * Math.PI * 2; // radians

          // For semi-circle: cards face center then rotate back to face camera
          // For full circle: cards face outward
          let transform = "";

          if (isFullCircle || state.arc > 0.8) {
            // Full circle layout: cards in ring, facing outward
            transform = `
              rotateY(${i * (360 / N)}deg)
              translateZ(${state.radius}em)
              rotateY(90deg)
            `;
          } else {
            // Semi-circle: arc layout facing viewer
            transform = `
              rotateY(${angle}turn)
              translateZ(${-state.radius}em)
            `;
          }

          card.style.setProperty("--w", state.cardW + "em");
          card.style.setProperty("--br", state.cardBr + "em");
          card.style.transform = transform;
        });

        // Rotate entire assembly
        a3d.style.transform = `
          rotateX(${state.tiltX}deg)
          rotateY(${ry}turn)
        `;

        scene.style.perspective = state.perspective + "em";
      }

      // Hit testing for hover
      function getHoveredCard(cx, cy) {
        // Project cards to screen space roughly
        let best = null;
        let bestZ = -Infinity;

        cards.forEach((card, i) => {
          const rect = card.getBoundingClientRect();
          const pad = 10;

          if (
            cx >= rect.left - pad &&
            cx <= rect.right + pad &&
            cy >= rect.top - pad &&
            cy <= rect.bottom + pad
          ) {
            // Calculate approximate Z depth based on position in arc
            const angle =
              ((i / N) * state.arc - state.arc / 2 + ry) * Math.PI * 2;
            const z = Math.cos(angle) * state.radius;

            if (z > bestZ) {
              bestZ = z;
              best = card;
            }
          }
        });

        return best;
      }

      // Event listeners
      scene.addEventListener("mousemove", (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;

        if (isDragging) return;

        const target = getHoveredCard(mouseX, mouseY);

        if (target !== hoveredCard) {
          if (hoveredCard) {
            hoveredCard.classList.remove("is-hovered");
            hoveredCard.style.transform = hoveredCard.style.transform.replace(
              /translateZ\([^)]+\)/,
              `translateZ(${-state.radius}em)`,
            );
          }

          hoveredCard = target;

          if (hoveredCard) {
            isPaused = true;
            velocity = 0;
            hoveredCard.classList.add("is-hovered");

            // Add pop
            const currentTransform = hoveredCard.style.transform;
            const popZ = isFullCircle
              ? state.radius + state.pop
              : -state.radius - state.pop;
            hoveredCard.style.transform = currentTransform.replace(
              /translateZ\([^)]+\)/,
              `translateZ(${popZ}em)`,
            );

            // Calculate tilt based on mouse position relative to card center
            const rect = hoveredCard.getBoundingClientRect();
            const x = (mouseX - rect.left) / rect.width - 0.5;
            const y = (mouseY - rect.top) / rect.height - 0.5;

            // Apply additional tilt
            const tiltX = y * -30;
            const tiltY = x * 30;
            hoveredCard.style.transform += ` rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
          } else {
            isPaused = false;
          }
        } else if (hoveredCard) {
          // Update tilt while moving on same card
          const rect = hoveredCard.getBoundingClientRect();
          const x = (mouseX - rect.left) / rect.width - 0.5;
          const y = (mouseY - rect.top) / rect.height - 0.5;
          const tiltX = y * -30;
          const tiltY = x * 30;

          const baseTransform = hoveredCard.style.transform.replace(
            /rotateX\([^)]+\) rotateY\([^)]+\)/,
            "",
          );
          const popZ = isFullCircle
            ? state.radius + state.pop
            : -state.radius - state.pop;
          hoveredCard.style.transform =
            baseTransform + ` rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
        }
      });

      scene.addEventListener("mouseleave", () => {
        if (hoveredCard) {
          hoveredCard.classList.remove("is-hovered");
          updateCards(); // Reset positions
          hoveredCard = null;
        }
        isPaused = false;
        isDragging = false;
      });

      scene.addEventListener("pointerdown", (e) => {
        isDragging = true;
        lastX = e.clientX;
        velocity = 0;
        if (hoveredCard) {
          hoveredCard.classList.remove("is-hovered");
          hoveredCard = null;
          isPaused = false;
          updateCards();
        }
      });

      window.addEventListener("pointermove", (e) => {
        if (!isDragging) return;
        const delta = e.clientX - lastX;
        velocity = delta * -0.0005;
        ry += velocity;
        lastX = e.clientX;
      });

      window.addEventListener("pointerup", () => {
        isDragging = false;
      });

      scene.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          if (isPaused) return;
          velocity -= (e.deltaX + e.deltaY) * 0.00002;
        },
        { passive: false },
      );

      // Toggle button
      btn.addEventListener("click", () => {
        isFullCircle = !isFullCircle;
        btn.classList.toggle("active", isFullCircle);
        btn.textContent = isFullCircle
          ? "Semi-Circle View"
          : "Full Circle View";

        // Clear hover
        if (hoveredCard) {
          hoveredCard.classList.remove("is-hovered");
          hoveredCard = null;
          isPaused = false;
        }

        const target = isFullCircle ? configs.full : configs.semi;

        // Animate to new state
        function animateTransition() {
          state.cardW = lerp(state.cardW, target.cardW);
          state.radius = lerp(state.radius, target.radius);
          state.arc = lerp(state.arc, target.arc);
          state.tiltX = lerp(state.tiltX, target.tiltX);
          state.perspective = lerp(state.perspective, target.perspective);
          state.cardBr = lerp(state.cardBr, target.cardBr);
          state.pop = lerp(state.pop, target.pop);

          updateCards();

          const done =
            Math.abs(state.cardW - target.cardW) < 0.01 &&
            Math.abs(state.radius - target.radius) < 0.01 &&
            Math.abs(state.arc - target.arc) < 0.001;

          if (!done) requestAnimationFrame(animateTransition);
        }

        animateTransition();
      });

      // Animation loop
      function loop() {
        if (!isDragging && !isPaused) {
          velocity *= 0.95;
          if (Math.abs(velocity) < 0.00001) velocity = 0;
          ry += velocity + (isPaused ? 0 : 0.0002);
        }

        a3d.style.transform = `
          rotateX(${state.tiltX}deg)
          rotateY(${ry}turn)
        `;

        requestAnimationFrame(loop);
      }

      // Initial render
      updateCards();
      loop();
    </script>
  </body>
</html>
