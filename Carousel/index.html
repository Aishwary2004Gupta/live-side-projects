<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Carousel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      /* ====== 3D Carousel Styles ====== */
      .scene,
      .a3d {
        display: grid;
      }

      .scene {
        overflow: hidden;
        perspective: 45em;
        mask: linear-gradient(90deg, #0000, #000 15% 85%, #0000);
        cursor: grab;
        width: 100%;
        max-width: 100vw;
        padding: 5rem 0;
        touch-action: pan-y;
      }

      .scene:active {
        cursor: grabbing;
      }

      .a3d {
        place-self: center;
        transform-style: preserve-3d;
        --ry: 0turn;
        transform: rotateY(var(--ry));
        will-change: transform;
      }

      .card {
        --w: 17.5em;
        --ba: 1turn / var(--n);
        --pop: 0em;
        --tiltX: 0deg;
        --tiltY: 0deg;

        grid-area: 1 / 1;
        width: var(--w);
        aspect-ratio: 7 / 10;
        object-fit: cover;
        border-radius: 1.5em;
        box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.4);
        backface-visibility: hidden;

        transition:
          transform 0.5s cubic-bezier(0.23, 1, 0.32, 1),
          box-shadow 0.5s ease;

        transform: rotateY(calc(var(--i) * var(--ba)))
          translateZ(
            calc(
              -1 * (0.5 * var(--w) + 0.5em) / tan(0.5 * var(--ba)) + var(--pop)
            )
          )
          rotateX(var(--tiltX)) rotateY(var(--tiltY));
      }

      .card.is-hovered {
        box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.55);
        filter: saturate(1.12) contrast(1.05);
      }

      /* ====== Page Styles ====== */
      html {
        height: 100%;
        overflow: hidden;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #fff3ed;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        overflow-x: hidden;
        height: 100%;
      }

      h1 {
        color: rgb(0, 0, 0);
        margin-bottom: 0.5rem;
        text-align: center;
      }
      .info {
        color: #888;
        font-size: 0.9rem;
        margin-top: 1rem;
      }

      /* ============================================================
         FULL CIRCLE MODE — CENTERED & FULL SCREEN
         ============================================================ */
      .scene.full {
        /* Remove semi-circle mask */
        mask: none;
        -webkit-mask: none;

        /* Fill entire viewport and center content */
        position: fixed;
        inset: 0;
        padding: 0;

        /* Large perspective so circle looks flat/clean */
        perspective: 120em;
      }

      /* Spin around Z-axis in full mode (ring rotation) */
      .scene.full .a3d {
        transform: rotateZ(var(--ry));
      }

      /* Ring layout — big centered circle */
      .scene.full .card {
        /* Bigger cards for visibility */
        --w: clamp(4.2rem, 9vmin, 6.4rem);

        /* Small round corners like screenshot */
        border-radius: 0.65rem;
        box-shadow: 0 12px 28px -14px rgba(0, 0, 0, 0.35);

        /* Large radius: ~42% of smallest viewport dimension = fills screen well */
        --R: min(44vmin, 420px);

        /* Position each card around the circumference facing outward */
        transform:
          rotateZ(calc(var(--i) * (1turn / var(--n))))
          translateY(calc(-1 * var(--R)))
          translateZ(var(--pop))
          rotateX(var(--tiltX))
          rotateY(var(--tiltY));
      }

      /* Subtle ring guide */
      .scene.full::after {
        content: "";
        position: absolute;
        /* Ring diameter ≈ 2×R plus card size */
        width: calc(var(--R) * 2 + 20vmin);
        aspect-ratio: 1;
        border-radius: 50%;
        border: 1px solid rgba(0, 0, 0, 0.07);
        pointer-events: none;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }

      /* Smooth morph during toggle */
      .scene.is-layouting .a3d {
        transition: transform 900ms cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      .scene.is-layouting .card {
        transition:
          transform 900ms cubic-bezier(0.22, 0.61, 0.36, 1),
          box-shadow 0.5s ease,
          border-radius 900ms cubic-bezier(0.22, 0.61, 0.36, 1);
      }

      /* Button */
      .layout-btn {
        position: fixed;
        top: 1.25rem;
        right: 1.25rem;
        z-index: 10;
        border: 1px solid rgba(0, 0, 0, 0.15);
        background: #fff;
        backdrop-filter: blur(10px);
        padding: 0.65rem 1.05rem;
        border-radius: 999px;
        font: inherit;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        transition: background 0.3s;
      }
      .layout-btn:hover { background: #f8f8f8; }
      .layout-btn:active { transform: scale(0.97); }
    </style>
  </head>

  <body>
    <button class="layout-btn" id="layoutBtn">Show full circle</button>

    <div class="scene" id="scene">
      <div class="a3d" style="--n: 17">
        <img class="card" src="https://images.unsplash.com/photo-1730652201845-095193ddb555?q=80&w=722&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D?w=400" style="--i: 0" alt="img" />
        <img class="card" src="https://images.unsplash.com/flagged/photo-1572392640988-ba48d1a74457?q=80&w=764&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D?w=400" style="--i: 1" alt="img" />
        <img class="card" src="https://images.unsplash.com/photo-1579783928621-7a13d66a62d1?q=80&w=690&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D?w=400" style="--i: 2" alt="img" />
        <img class="card" src="https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?q=80&w=708&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D?w=400" style="--i: 3" alt="img" />
        <img class="card" src="https://plus.unsplash.com/premium_photo-1661963273643-3530570bff6b?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D?w=400" style="--i: 4" alt="img" />
        <img class="card" src="https://images.unsplash.com/photo-1762970444229-63fa47ddad16?q=80&w=739&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D?w=400" style="--i: 5" alt="img" />
        <img class="card" src="https://images.unsplash.com/photo-1597424482786-0b1b7065dbac?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D?w=400" style="--i: 6" alt="img" />
        <img class="card" src="https://images.unsplash.com/photo-1762970443978-e3f63489dd5d?q=80&w=775&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D?w=400" style="--i: 7" alt="img" />
        <img class="card" src="https://images.unsplash.com/photo-1772843062016-4258198fbbce?q=80&w=736&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D?w=400" style="--i: 8" alt="img" />
        <img class="card" src="https://plus.unsplash.com/premium_photo-1742457608525-050e57ec5086?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D?w=400" style="--i: 9" alt="img" />
        <img class="card" src="https://images.unsplash.com/photo-1682157693947-c67c6420b016?q=80&w=735&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D?w=400" style="--i: 10" alt="img" />
        <img class="card" src="https://images.unsplash.com/photo-1630121008266-3e6fbe505e7f?q=80&w=735&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D?w=400" style="--i: 11" alt="img" />
        <img class="card" src="https://images.unsplash.com/photo-1601980740525-fc689655157f?q=80&w=750&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D?w=400" style="--i: 12" alt="img" />
        <img class="card" src="https://images.unsplash.com/photo-1678966432189-d58296e45ad2?q=80&w=627&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D?w=400" style="--i: 13" alt="img" />
        <img class="card" src="https://images.unsplash.com/photo-1545126178-862cdb469409?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D?w=400" style="--i: 14" alt="img" />
        <img class="card" src="https://images.unsplash.com/photo-1597512945089-17f1e583b274?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D?w=400" style="--i: 15" alt="img" />
        <img class="card" src="https://images.unsplash.com/photo-1585135497273-1a86b09fe70e?q=80&w=735&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D?w=400" style="--i: 16" alt="img" />
      </div>
    </div>

    <p class="info">
      Drag/Scroll to rotate • Hover any front-facing card to Pop &amp; Tilt
    </p>

    <script>
      const scene = document.querySelector(".scene");
      const a3d = document.querySelector(".a3d");
      const cards = Array.from(document.querySelectorAll(".card"));
      const btn = document.getElementById("layoutBtn");
      const N = cards.length;

      let ry = 0;
      let velocity = 0;
      let isDragging = false;
      let isPaused = false;
      let lastX = 0;

      let isFull = false;
      let isLayouting = false;

      // hover state
      let hoveredCard = null;
      let mouseX = -9999;
      let mouseY = -9999;
      let mouseInScene = false;

      const FRICTION = 0.92;
      const AUTO_SPEED = 0.0003;
      const MAX_TILT = 35;
      const POP_SEMI = 8;     // em
      const POP_FULL = 2.25;  // em
      const FRONT_ARC = 0.24; // semi-circle front arc

      // kill native pointer events for hit-test
      cards.forEach((c) => (c.style.pointerEvents = "none"));

      function cardAngle(i) {
        const raw = ry + i / N;
        return raw - Math.round(raw); // -0.5..0.5
      }

      function resetCard(card) {
        card.style.setProperty("--pop", "0em");
        card.style.setProperty("--tiltX", "0deg");
        card.style.setProperty("--tiltY", "0deg");
        card.classList.remove("is-hovered");
      }

      function applyTilt(card, cx, cy) {
        const r = card.getBoundingClientRect();
        const x = Math.max(0, Math.min(1, (cx - r.left) / r.width));
        const y = Math.max(0, Math.min(1, (cy - r.top) / r.height));

        const pop = (isFull ? POP_FULL : POP_SEMI);

        card.style.setProperty("--tiltX", (0.5 - y) * MAX_TILT * 2 + "deg");
        card.style.setProperty("--tiltY", (x - 0.5) * MAX_TILT * 2 + "deg");
        card.style.setProperty("--pop", pop + "em");
        card.classList.add("is-hovered");
      }

      function findCardAt(cx, cy) {
        let best = null;
        let bestDist = Infinity;

        // allow full arc in circle mode so any card can be hovered
        const ARC = isFull ? 0.5 : FRONT_ARC;

        for (let i = 0; i < N; i++) {
          const angle = cardAngle(i);
          if (Math.abs(angle) > ARC) continue;

          const r = cards[i].getBoundingClientRect();
          if (cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom) {
            if (Math.abs(angle) < bestDist) {
              bestDist = Math.abs(angle);
              best = cards[i];
            }
          }
        }
        return best;
      }

      function updateHover() {
        if (isDragging || !mouseInScene) return;

        const target = findCardAt(mouseX, mouseY);

        if (target === hoveredCard) {
          if (hoveredCard) applyTilt(hoveredCard, mouseX, mouseY);
          return;
        }

        if (hoveredCard) resetCard(hoveredCard);
        hoveredCard = target;

        if (hoveredCard) {
          isPaused = true;
          velocity = 0;
          applyTilt(hoveredCard, mouseX, mouseY);
        } else {
          isPaused = false;
        }
      }

      scene.addEventListener("mousemove", (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        mouseInScene = true;
        updateHover();
      });

      scene.addEventListener("mouseleave", () => {
        mouseInScene = false;
        if (hoveredCard) {
          resetCard(hoveredCard);
          hoveredCard = null;
        }
        isPaused = false;
      });

      // drag & wheel (unchanged logic)
      const handleMove = (x) => {
        if (!isDragging) return;
        const delta = x - lastX;
        velocity = delta * -0.0008;
        ry += velocity;
        lastX = x;
      };

      scene.addEventListener("pointerdown", (e) => {
        if (hoveredCard) {
          resetCard(hoveredCard);
          hoveredCard = null;
          isPaused = false;
        }
        isDragging = true;
        lastX = e.clientX;
        velocity = 0;
      });

      window.addEventListener("pointermove", (e) => handleMove(e.clientX));
      window.addEventListener("pointerup", () => (isDragging = false));

      scene.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          if (isPaused) return;
          velocity -= (e.deltaX + e.deltaY) * 0.00005;
        },
        { passive: false },
      );

      // Toggle layout button
      btn.addEventListener("click", () => {
        if (hoveredCard) {
          resetCard(hoveredCard);
          hoveredCard = null;
        }
        isPaused = false;
        velocity = 0;

        isFull = !isFull;
        btn.textContent = isFull ? "Show semi circle" : "Show full circle";

        isLayouting = true;
        scene.classList.add("is-layouting");
        scene.classList.toggle("full", isFull);

        // freeze updates during smooth transition (900ms)
        setTimeout(() => {
          isLayouting = false;
          scene.classList.remove("is-layouting");
        }, 900);
      });

      // animation loop
      function loop() {
        if (!isDragging) {
          velocity *= FRICTION;
          if (Math.abs(velocity) < 1e-7) velocity = 0;

          // freeze while hovering OR during layout transition
          if (!isPaused && !isLayouting) {
            ry += velocity + AUTO_SPEED;
          }
        }

        a3d.style.setProperty("--ry", ry + "turn");
        requestAnimationFrame(loop);
      }

      window.addEventListener("blur", () => {
        isDragging = false;
        if (hoveredCard) {
          resetCard(hoveredCard);
          hoveredCard = null;
        }
        isPaused = false;
      });

      loop();
    </script>
  </body>
</html>
