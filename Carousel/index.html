<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jaya Narayana Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:'Montserrat',sans-serif;
}

.hero{
    position:relative;
    width:100vw;
    height:100vh;

    /* Replace with your image */
    background-image:url("https://images.unsplash.com/photo-1494790108377-be9c29b29330");
    background-size:cover;
    background-position:center;
}

nav{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:80px;

    background:rgba(244,240,238,0.95);

    display:flex;
    justify-content:center;
    align-items:center;
    z-index:10;
}

.nav-links{
    display:flex;
    gap:70px;
}

.nav-links a{
    text-decoration:none;
    color:#222;
    font-size:18px;
    font-weight:300;
}

.content{
    position:absolute;
    left:40px;
    top:120px;
}

.name{
    font-family:'Cormorant Garamond',serif;
    font-size:120px;
    line-height:0.88;
    color:#000;
    font-weight:300;
}

.role{
    margin-top:35px;

    font-size:45px;
    line-height:1.3;
    color:#111;
    font-weight:300;
}

.scroll{
    position:absolute;
    bottom:40px;
    left:50%;
    transform:translateX(-50%);

    width:74px;
    height:74px;

    border:3px solid white;
    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    backdrop-filter:blur(3px);
}

.arrow{
    width:18px;
    height:18px;

    border-right:3px solid white;
    border-bottom:3px solid white;

    transform:rotate(45deg) translateY(-4px);
}

</style>
</head>
<body>

<section class="hero">

    <nav>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Portfolio</a>
            <a href="#">Contact</a>
        </div>
    </nav>

    <div class="content">

        <h1 class="name">
            Aishwary<br>
            Gupta
        </h1>

        <div class="role">
            Software<br>
            Developer
        </div>

    </div>

    <div class="scroll">
        <div class="arrow"></div>
    </div>

</section>

</body>
</html>
