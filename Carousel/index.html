<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>3D Jellyfish Carousel — All Cards Hoverable</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      /* ====== 3D Carousel Styles ====== */
      .scene,
      .a3d {
        display: grid;
      }

      .scene {
        overflow: hidden;
        perspective: 45em; /* Slightly increased for better tilt view */
        mask: linear-gradient(90deg, #0000, #000 15% 85%, #0000);
        cursor: grab;
        width: 100%;
        max-width: 100vw;
        padding: 5rem 0;
        touch-action: pan-y;
      }

      .scene:active {
        cursor: grabbing;
      }

      .a3d {
        place-self: center;
        transform-style: preserve-3d;
        --ry: 0turn;
        transform: rotateY(var(--ry));
        will-change: transform;
      }

      .card {
        --w: 17.5em;
        --ba: 1turn / var(--n);
        --pop: 0em;
        --tiltX: 0deg;
        --tiltY: 0deg;

        grid-area: 1 / 1;
        width: var(--w);
        aspect-ratio: 7 / 10;
        object-fit: cover;
        border-radius: 1.5em;
        box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.4);

        /* backface-visibility: hidden is crucial so we don't click cards from behind */
        backface-visibility: hidden;

        /* Smooth transitions for popping and returning */
        transition:
          transform 0.5s cubic-bezier(0.23, 1, 0.32, 1),
          box-shadow 0.5s ease;

        /* Note: We use standard transform here to ensure tilt and pop work together */
        transform: rotateY(calc(var(--i) * var(--ba)))
          translateZ(
            calc(
              -1 * (0.5 * var(--w) + 0.5em) / tan(0.5 * var(--ba)) + var(--pop)
            )
          )
          rotateX(var(--tiltX)) rotateY(var(--tiltY));
      }

      .card:hover {
        box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.5);
        z-index: 100; /* Try to bring to front */
      }

      /* ====== Page Styles ====== */
      body {
        margin: 0;
        min-height: 100vh;
        background: #fff3ed;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        overflow-x: hidden;
      }

      h1 {
        color: #c55;
        margin-bottom: 0.5rem;
        text-align: center;
      }
      .info {
        color: #888;
        font-size: 0.9rem;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>Jellyfish 3D Carousel</h1>

    <div class="scene">
      <div class="a3d" style="--n: 12">
        <!-- Data rendered directly -->
        <img
          class="card"
          src="https://images.unsplash.com/photo-1540968221243-29f5d70540bf?w=400"
          style="--i: 0"
          alt="jelly"
        />
        <img
          class="card"
          src="https://images.unsplash.com/photo-1596135187959-562c650d98bc?w=400"
          style="--i: 1"
          alt="jelly"
        />
        <img
          class="card"
          src="https://images.unsplash.com/photo-1628944682084-831f35256163?w=400"
          style="--i: 2"
          alt="jelly"
        />
        <img
          class="card"
          src="https://images.unsplash.com/photo-1590013330451-3946e83e0392?w=400"
          style="--i: 3"
          alt="jelly"
        />
        <img
          class="card"
          src="https://images.unsplash.com/photo-1590421959604-741d0eec0a2e?w=400"
          style="--i: 4"
          alt="jelly"
        />
        <img
          class="card"
          src="https://images.unsplash.com/photo-1572613000712-eadc57acbecd?w=400"
          style="--i: 5"
          alt="jelly"
        />
        <img
          class="card"
          src="https://images.unsplash.com/photo-1570097192570-4b49a6736f9f?w=400"
          style="--i: 6"
          alt="jelly"
        />
        <img
          class="card"
          src="https://images.unsplash.com/photo-1620789550663-2b10e0080354?w=400"
          style="--i: 7"
          alt="jelly"
        />
        <img
          class="card"
          src="https://images.unsplash.com/photo-1617775623669-20bff4ffaa5c?w=400"
          style="--i: 8"
          alt="jelly"
        />
        <img
          class="card"
          src="https://images.unsplash.com/photo-1548600916-dc8492f8e845?w=400"
          style="--i: 9"
          alt="jelly"
        />
        <img
          class="card"
          src="https://images.unsplash.com/photo-1573824969595-a76d4365a2e6?w=400"
          style="--i: 10"
          alt="jelly"
        />
        <img
          class="card"
          src="https://images.unsplash.com/photo-1633936929709-59991b5fdd72?w=400"
          style="--i: 11"
          alt="jelly"
        />
      </div>
    </div>

    <p class="info">
      Drag/Scroll to rotate • Hover cards in front to Pop & Tilt
    </p>

    <script>
      const scene = document.querySelector(".scene");
      const a3d = document.querySelector(".a3d");
      const cards = Array.from(document.querySelectorAll(".card"));
      const N = cards.length;

      let ry = 0;
      let velocity = 0;
      let isDragging = false;
      let isPaused = false;
      let lastX = 0;

      const FRICTION = 0.92;
      const AUTO_SPEED = 0.0003;

      function loop() {
        if (!isDragging) {
          velocity *= FRICTION;
          if (!isPaused) ry += velocity + AUTO_SPEED;
          else ry += velocity;
        }

        a3d.style.setProperty("--ry", ry + "turn");

        // Logic to only allow hovering on cards facing the front (approx 120 degree arc)
        cards.forEach((card, i) => {
          // Calculate the current rotation of this specific card relative to the viewer
          const cardAngle = (ry + i / N) % 1;
          const normalizedAngle = ((cardAngle + 1.5) % 1) - 0.5; // range -0.5 to 0.5

          // If card is within the front 25% of the circle, enable hover
          if (Math.abs(normalizedAngle) < 0.18) {
            card.style.pointerEvents = "auto";
            card.style.opacity = "1";
          } else {
            card.style.pointerEvents = "none";
            card.style.opacity = "0.9"; // Dim back cards slightly
          }
        });

        requestAnimationFrame(loop);
      }

      // Interactivity - Drag & Wheel
      const handleMove = (x) => {
        if (!isDragging) return;
        const delta = x - lastX;
        velocity = delta * -0.0008;
        ry += velocity;
        lastX = x;
      };

      scene.addEventListener("pointerdown", (e) => {
        isDragging = true;
        lastX = e.clientX;
        velocity = 0;
      });
      window.addEventListener("pointermove", (e) => handleMove(e.clientX));
      window.addEventListener("pointerup", () => (isDragging = false));

      scene.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          velocity -= (e.deltaX + e.deltaY) * 0.00005;
        },
        { passive: false },
      );

      // Card Hover Effects
      cards.forEach((card) => {
        card.addEventListener("mouseenter", () => {
          isPaused = true;
          card.style.setProperty("--pop", "8em");
        });

        card.addEventListener("mousemove", (e) => {
          const rect = card.getBoundingClientRect();
          // Calculate mouse position relative to card center (-0.5 to 0.5)
          const x = (e.clientX - rect.left) / rect.width - 0.5;
          const y = (e.clientY - rect.top) / rect.height - 0.5;

          // Tilt intensity
          card.style.setProperty("--tiltX", y * -35 + "deg");
          card.style.setProperty("--tiltY", x * 35 + "deg");
        });

        card.addEventListener("mouseleave", () => {
          isPaused = false;
          card.style.setProperty("--pop", "0em");
          card.style.setProperty("--tiltX", "0deg");
          card.style.setProperty("--tiltY", "0deg");
        });
      });

      loop();
    </script>
  </body>
</html>
