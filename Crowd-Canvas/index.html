<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coded Crowd Canvas</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; }
        .container { position: relative; width: 100%; height: 100vh; }
        .header {
            position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
            text-align: center; opacity: 0.4; font-family: sans-serif; font-size: 12px;
            text-transform: uppercase; letter-spacing: 2px; z-index: 10;
        }
        .header::after {
            content: ''; position: absolute; left: 50%; top: 20px;
            width: 1px; height: 60px; background: linear-gradient(to bottom, #fff, #000);
        }
        canvas { display: block; width: 100%; height: 90vh; position: absolute; bottom: 0; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">Coded Crowd</div>
    <canvas id="crowdCanvas"></canvas>
</div>

<script>
/**
 * 1. GENERATE PROCEDURAL SPRITE SHEET
 * Instead of loading an image, we draw 100 unique stick-figure "peeps"
 * to a hidden canvas to act as our texture atlas.
 */
const createProceduralSpriteSheet = (rows, cols, size) => {
    const canvas = document.createElement('canvas');
    canvas.width = rows * size;
    canvas.height = cols * size;
    const ctx = canvas.getContext('2d');

    const colors = ['#222', '#333', '#444', '#555', '#111'];

    for (let i = 0; i < rows * cols; i++) {
        const x = (i % rows) * size + size / 2;
        const y = Math.floor(i / rows) * size + size / 2;
        const color = colors[i % colors.length];
        
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = 2.5;
        ctx.lineCap = 'round';

        // Draw a procedurally generated "Peep"
        // Head
        ctx.beginPath();
        ctx.arc(x, y - 25, 8, 0, Math.PI * 2);
        ctx.stroke();
        
        // Random Hairstyle/Hat
        if(i % 3 === 0) { // Bun
             ctx.beginPath(); ctx.arc(x, y - 34, 3, 0, Math.PI * 2); ctx.fill();
        } else if (i % 3 === 1) { // Cap
            ctx.fillRect(x - 8, y - 33, 16, 3);
        }

        // Body
        ctx.beginPath();
        ctx.moveTo(x, y - 17);
        ctx.lineTo(x, y + 5);
        ctx.stroke();

        // Arms (Random poses)
        const armWave = Math.sin(i) * 10;
        ctx.beginPath();
        ctx.moveTo(x, y - 10);
        ctx.lineTo(x - 12, y + armWave);
        ctx.moveTo(x, y - 10);
        ctx.lineTo(x + 12, y - armWave);
        ctx.stroke();

        // Legs
        ctx.beginPath();
        ctx.moveTo(x, y + 5);
        ctx.lineTo(x - 7, y + 25);
        ctx.moveTo(x, y + 5);
        ctx.lineTo(x + 7, y + 25);
        ctx.stroke();
    }
    return canvas;
};

/**
 * 2. MAIN LOGIC (Adapted from your React code)
 */
const initCrowd = () => {
    const canvas = document.getElementById('crowdCanvas');
    const ctx = canvas.getContext('2d');
    const config = { rows: 10, cols: 5, size: 100 };
    
    // Create the "coded" image
    const spriteSheet = createProceduralSpriteSheet(config.rows, config.cols, config.size);
    
    const stage = { width: 0, height: 0 };
    const allPeeps = [];
    const availablePeeps = [];
    const crowd = [];

    // Helper Utils
    const randomRange = (min, max) => min + Math.random() * (max - min);
    const removeRandom = (arr) => arr.splice(Math.floor(Math.random() * arr.length), 1)[0];

    const createPeep = (rect) => ({
        rect,
        x: 0, y: 0, anchorY: 0, scaleX: 1, walk: null,
        render(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.scale(this.scaleX, 1);
            ctx.drawImage(spriteSheet, ...this.rect, -50, -50, 100, 100);
            ctx.restore();
        }
    });

    // Populate the peeps collection
    for (let i = 0; i < config.rows * config.cols; i++) {
        allPeeps.push(createPeep([
            (i % config.rows) * config.size,
            Math.floor(i / config.rows) * config.size,
            config.size, config.size
        ]));
    }

    const resetPeep = (peep) => {
        const dir = Math.random() > 0.5 ? 1 : -1;
        const offsetY = 100 - 250 * Math.pow(Math.random(), 2);
        const startY = stage.height - 50 + offsetY;
        let startX = dir === 1 ? -60 : stage.width + 60;
        let endX = dir === 1 ? stage.width + 60 : -60;
        
        peep.x = startX;
        peep.y = startY;
        peep.anchorY = startY;
        peep.scaleX = dir;

        return { startX, endX, startY };
    };

    const startWalk = (peep) => {
        const props = resetPeep(peep);
        const tl = gsap.timeline({
            onComplete: () => {
                crowd.splice(crowd.indexOf(peep), 1);
                availablePeeps.push(peep);
                spawn();
            }
        });

        tl.timeScale(randomRange(0.6, 1.4));
        tl.to(peep, { duration: 10, x: props.endX, ease: "none" }, 0);
        tl.to(peep, { duration: 0.25, y: props.startY - 10, repeat: 40, yoyo: true, ease: "sine.inOut" }, 0);
        
        peep.walk = tl;
    };

    const spawn = () => {
        if (!availablePeeps.length) return;
        const peep = removeRandom(availablePeeps);
        crowd.push(peep);
        startWalk(peep);
        crowd.sort((a, b) => a.anchorY - b.anchorY);
    };

    const resize = () => {
        stage.width = canvas.clientWidth;
        stage.height = canvas.clientHeight;
        canvas.width = stage.width * devicePixelRatio;
        canvas.height = stage.height * devicePixelRatio;
        
        crowd.forEach(p => p.walk && p.walk.kill());
        crowd.length = 0;
        availablePeeps.length = 0;
        availablePeeps.push(...allPeeps);
        
        for(let i=0; i<allPeeps.length; i++) {
            spawn();
            crowd[crowd.length-1].walk.progress(Math.random());
        }
    };

    gsap.ticker.add(() => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.scale(devicePixelRatio, devicePixelRatio);
        crowd.forEach(p => p.render(ctx));
        ctx.restore();
    });

    window.addEventListener('resize', resize);
    resize();
};

initCrowd();
</script>

</body>
</html>
