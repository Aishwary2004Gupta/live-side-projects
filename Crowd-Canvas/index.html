<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crowd Canvas - Skiper UI Clone</title>
    
    <!-- GSAP Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <style>
        /* CSS to match the Tailwind classes in the React component */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #fff;
            color: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .page-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        .heading-wrapper {
            position: absolute;
            top: 5.5rem; /* approx 'top-22' */
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            justify-items: center;
            text-align: center;
            gap: 1.5rem;
            z-index: 10;
        }

        .text-label {
            position: relative;
            max-width: 12ch;
            font-size: 14px;
            text-transform: uppercase;
            line-height: 1.25;
            opacity: 0.4;
            font-weight: bold;
        }

        .text-label::after {
            content: '';
            position: absolute;
            bottom: -2rem; /* Top of the gradient line */
            left: 50%;
            width: 1px;
            height: 4rem;
            background: linear-gradient(to bottom, #fff, #000);
        }

        /* This matches the canvas container */
        .canvas-container {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #crowdCanvas {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 90vh;
            display: block;
        }
    </style>
</head>
<body>

    <div class="page-container">
        <div class="heading-wrapper">
            <span class="text-label">Crowd Canvas</span>
        </div>

        <div class="canvas-container">
            <canvas id="crowdCanvas" 
                    data-src="./images/peeps/all-peeps.png" 
                    data-rows="15" 
                    data-cols="7"></canvas>
        </div>
    </div>

    <script>
        // Configuration matching the React Props
        const CONFIG = {
            src: './images/peeps/all-peeps.png', // Ensure you downloaded the image here
            rows: 15,
            cols: 7
        };

        const canvas = document.getElementById('crowdCanvas');
        if (!canvas) return;

        const ctx = canvas.getContext("2d");
        if (!ctx) return;

        // UTILS
        const randomRange = (min, max) => min + Math.random() * (max - min);
        const randomIndex = (array) => randomRange(0, array.length) | 0;
        const removeFromArray = (array, i) => array.splice(i, 1)[0];
        const removeItemFromArray = (array, item) => removeFromArray(array, array.indexOf(item));
        const removeRandomFromArray = (array) => removeFromArray(array, randomIndex(array));
        const getRandomFromArray = (array) => array[randomIndex(array)];

        // FACTORY FUNCTIONS
        const createPeep = ({ image, rect }) => {
            const peep = {
                image,
                rect: [],
                width: 0,
                height: 0,
                drawArgs: [],
                x: 0,
                y: 0,
                anchorY: 0,
                scaleX: 1,
                walk: null,
                
                setRect: function(rect) {
                    this.rect = rect;
                    this.width = rect[2];
                    this.height = rect[3];
                },
                
                render: function(context) {
                    context.save();
                    context.translate(this.x, this.y);
                    context.scale(this.scaleX, 1);
                    context.drawImage(
                        this.image,
                        this.rect[0],
                        this.rect[1],
                        this.rect[2],
                        this.rect[3],
                        0,
                        0,
                        this.width,
                        this.height
                    );
                    context.restore();
                }
            };
            peep.setRect(rect);
            return peep;
        };

        // TWEEN FACTORIES
        const resetPeep = ({ stage, peep }) => {
            const direction = Math.random() > 0.5 ? 1 : -1;
            // The math for power2.in creates the density at the bottom
            const offsetY = 100 - 250 * gsap.parseEase("power2.in")(Math.random());
            const startY = stage.height - peep.height + offsetY;
            
            let startX, endX;

            if (direction === 1) {
                startX = -peep.width;
                endX = stage.width;
                peep.scaleX = 1;
            } else {
                startX = stage.width + peep.width;
                endX = 0;
                peep.scaleX = -1;
            }

            peep.x = startX;
            peep.y = startY;
            peep.anchorY = startY;

            return { startX, startY, endX };
        };

        const normalWalk = ({ peep, props }) => {
            const { startX, startY, endX } = props;
            const xDuration = 10;
            const yDuration = 0.25;

            const tl = gsap.timeline();
            tl.timeScale(randomRange(0.5, 1.5));
            
            tl.to(peep, { duration: xDuration, x: endX, ease: "none" }, 0);
            tl.to(peep, { 
                duration: yDuration, 
                repeat: xDuration / yDuration, 
                yoyo: true, 
                y: startY - 10,
                ease: "sine.inOut" // slightly smoother than default
            }, 0);

            return tl;
        };

        const walks = [normalWalk];

        // MAIN VARIABLES
        const img = new Image();
        const stage = { width: 0, height: 0 };
        const allPeeps = [];
        const availablePeeps = [];
        const crowd = [];

        // LOGIC
        const createPeeps = () => {
            const { rows, cols } = CONFIG;
            const { naturalWidth: width, naturalHeight: height } = img;
            const total = rows * cols;
            const rectWidth = width / rows;
            const rectHeight = height / cols;

            for (let i = 0; i < total; i++) {
                allPeeps.push(createPeep({
                    image: img,
                    rect: [
                        (i % rows) * rectWidth,
                        ((i / rows) | 0) * rectHeight,
                        rectWidth,
                        rectHeight
                    ]
                }));
            }
        };

        const addPeepToCrowd = () => {
            if(!availablePeeps.length) return;
            
            const peep = removeRandomFromArray(availablePeeps);
            const walk = getRandomFromArray(walks)({
                peep,
                props: resetPeep({ peep, stage })
            }).eventCallback("onComplete", () => {
                removePeepFromCrowd(peep);
                addPeepToCrowd();
            });

            peep.walk = walk;
            crowd.push(peep);
            crowd.sort((a, b) => a.anchorY - b.anchorY);
            return peep;
        };

        const removePeepFromCrowd = (peep) => {
            removeItemFromArray(crowd, peep);
            availablePeeps.push(peep);
        };

        const initCrowd = () => {
            while (availablePeeps.length) {
                addPeepToCrowd().walk.progress(Math.random());
            }
        };

        const resize = () => {
            stage.width = canvas.clientWidth;
            stage.height = canvas.clientHeight;
            
            // High DPI support
            const dpr = window.devicePixelRatio || 1;
            canvas.width = stage.width * dpr;
            canvas.height = stage.height * dpr;

            // Kill existing animations
            crowd.forEach((peep) => {
                if (peep.walk) peep.walk.kill();
            });

            // Reset arrays
            crowd.length = 0;
            availablePeeps.length = 0;
            availablePeeps.push(...allPeeps);

            initCrowd();
            render(); // Force immediate redraw
        };

        const render = () => {
            if (!ctx) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            
            const dpr = window.devicePixelRatio || 1;
            ctx.scale(dpr, dpr);

            crowd.forEach((peep) => {
                peep.render(ctx);
            });

            ctx.restore();
        };

        // INITIALIZATION
        const init = () => {
            createPeeps();
            resize();
            gsap.ticker.add(render);
        };

        img.onload = init;
        img.src = CONFIG.src;
        
        // Fallback if image doesn't load
        img.onerror = () => {
            console.error("Could not load crowd image. Please download the image from the link provided.");
        };

        window.addEventListener("resize", resize);
    </script>
</body>
</html>
