<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crowd Canvas — Skiper Style</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
        background: #fff;
      }
      .page {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #fff;
      }
      /* Header styling matching reference */
      .heading {
        position: absolute;
        top: 5.5rem;
        left: 50%;
        transform: translateX(-50%);
        display: grid;
        place-items: center;
        gap: 1.5rem;
        text-align: center;
        z-index: 2;
      }
      .heading span {
        position: relative;
        max-width: 12ch;
        font-size: 12px;
        line-height: 1.1;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        opacity: 0.4;
      }
      .heading span::after {
        content: "";
        position: absolute;
        top: 100%;
        left: 50%;
        width: 1px;
        height: 4rem;
        background: linear-gradient(to bottom, #fff, #000);
      }
      canvas {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 90vh; /* Occupy bottom 90% of screen */
        display: block;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="heading"><span>Crowd Canvas</span></div>
      <canvas id="crowdCanvas"></canvas>
    </main>

    <!-- GSAP Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <script>
      (function () {
        // --- UTILS ---
        const rr = (a, b) => a + Math.random() * (b - a); // Random Range
        const ri = (a, b) => Math.floor(rr(a, b));       // Random Int
        const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
        const ch = (p) => Math.random() < p;             // Chance (probability)
        const removeRandom = (arr) => {
            const i = Math.floor(Math.random() * arr.length);
            return arr.splice(i, 1)[0];
        };

        // --- CONSTANTS ---
        const INK = "#1a1a1a";      // Dark Grey/Black ink
        const WHITE = "#ffffff";
        const LIGHT = "#f0f0f0";    // Light grey shirt
        
        // Config
        const W = 140, H = 220, S = 2; // Sprite base width, height, scale

        /**
         * Draws a single person onto a small offscreen canvas.
         * This replaces loading external image sprites.
         */
        function drawPeep() {
          const c = document.createElement("canvas");
          c.width = W * S;
          c.height = H * S;
          const g = c.getContext("2d");
          g.scale(S, S); // Supersampling for crisp edges
          g.lineCap = "round";
          g.lineJoin = "round";

          // Traits
          const lw = 2.6; // Line width
          const cx = 70;
          
          // Head dimensions
          const headRx = rr(19, 26);
          const headRy = rr(23, 30);
          const headCy = 62;
          const headTop = headCy - headRy;
          
          // Body dimensions
          const shoulderY = headCy + headRy + rr(6, 16);
          const bodyW = rr(52, 76);
          const bodyL = cx - bodyW / 2;
          const bodyR = cx + bodyW / 2;
          
          const shirtFill = pick([INK, WHITE, LIGHT, LIGHT]); // Weighted towards light shirts
          const isDark = shirtFill === INK;
          const faceOff = headRx * 0.12; // Profile shift

          // --- CONFIGURE TRAITS ---
          const hairStyle = pick([
            "short","buzz","fringe","long","afro","curly","curly",
            "bun","ponytail","bangs","spiky","wavy","pompadour",
            "cap","beanie","headband","hoodie","bald","hijab"
          ]);
          const hasGlasses = ch(0.38);
          const glassStyle = pick(["round","square","sunglasses"]);
          const hasBeard = ch(0.28);
          const beardStyle = pick(["full","goatee","stubble","mustache"]);
          const hasMustache = hasBeard && (beardStyle==="mustache" || ch(0.35));
          const hasStripes = !isDark && ch(0.22);
          const hasCollar = ch(0.38);
          const hasTie = hasCollar && ch(0.18);
          const hasHoodie = hairStyle === "hoodie" || (!hasCollar && ch(0.15));
          const hasPhone = ch(0.18);
          const eyeStyle = pick(["open","open","happy","closed"]);
          const mouthType = pick(["smile","neutral","open","smirk"]);
          const earSide = ch(0.5);

          // --- DRAW HELPERS ---
          const stroke = (fn) => { g.strokeStyle=INK; g.lineWidth=lw; g.beginPath(); fn(); g.stroke(); };
          const fill = (color, fn) => { g.fillStyle=color; g.beginPath(); fn(); g.fill(); };
          const fillStroke = (color, fn) => {
            g.fillStyle=color; g.strokeStyle=INK; g.lineWidth=lw;
            g.beginPath(); fn(); g.fill(); g.stroke();
          };

          // 1. HIJAB / HOODIE BACKING
          if (hairStyle === "hijab") {
            fillStroke(INK, ()=>{
              g.moveTo(bodyL-6, shoulderY+15);
              g.quadraticCurveTo(bodyL-12, headTop-20, cx, headTop-18);
              g.quadraticCurveTo(bodyR+12, headTop-20, bodyR+6, shoulderY+15);
              g.lineTo(bodyR+6, shoulderY+30);
              g.quadraticCurveTo(bodyR, shoulderY+10, bodyR, shoulderY);
              g.lineTo(bodyL, shoulderY);
              g.quadraticCurveTo(bodyL, shoulderY+10, bodyL-6, shoulderY+30);
              g.closePath();
            });
          }

          // Long/Afro Backing
          if (["long","afro","curly"].includes(hairStyle)) {
            fill(INK, ()=> g.ellipse(cx+faceOff, headCy+headRy*0.4, headRx+12, headRy*1.5, 0, 0, Math.PI*2));
          }

          // 2. BODY
          const rad = 16;
          if (hasHoodie) {
            fillStroke(shirtFill, ()=>{
              g.moveTo(bodyL-2, H); g.lineTo(bodyL-2, shoulderY+rad+4);
              g.quadraticCurveTo(bodyL-2, shoulderY+2, bodyL+rad-2, shoulderY+2);
              g.lineTo(bodyR-rad+2, shoulderY+2);
              g.quadraticCurveTo(bodyR+2, shoulderY+2, bodyR+2, shoulderY+rad+4);
              g.lineTo(bodyR+2, H); g.closePath();
            });
            stroke(()=> g.moveTo(cx-14, shoulderY+2); g.quadraticCurveTo(cx, shoulderY+18, cx+14, shoulderY+2));
          } else {
            fillStroke(shirtFill, ()=>{
              g.moveTo(bodyL, H); g.lineTo(bodyL, shoulderY+rad);
              g.quadraticCurveTo(bodyL, shoulderY, bodyL+rad, shoulderY);
              g.lineTo(bodyR-rad, shoulderY);
              g.quadraticCurveTo(bodyR, shoulderY, bodyR, shoulderY+rad);
              g.lineTo(bodyR, H); g.closePath();
            });
          }

          // Stripes
          if (hasStripes) {
            g.save(); g.clip(); 
            g.strokeStyle=INK; g.lineWidth=2.2;
            for(let y=shoulderY+14; y<H; y+=11) { g.beginPath(); g.moveTo(bodyL-5,y); g.lineTo(bodyR+5,y); g.stroke(); }
            g.restore();
            stroke(()=> g.moveTo(bodyL, H); g.lineTo(bodyL, shoulderY+rad);
                g.quadraticCurveTo(bodyL, shoulderY, bodyL+rad, shoulderY);
                g.lineTo(bodyR-rad, shoulderY);
                g.quadraticCurveTo(bodyR, shoulderY, bodyR, shoulderY+rad);
                g.lineTo(bodyR, H));
          }
          
          // Collar/Tie
          if(hasCollar && !hasHoodie) stroke(()=> g.moveTo(cx-12, shoulderY); g.lineTo(cx-3, shoulderY+16); g.lineTo(cx, shoulderY+5); g.lineTo(cx+3, shoulderY+16); g.lineTo(cx+12, shoulderY));
          if(hasTie) fillStroke(INK, ()=> g.moveTo(cx-5, shoulderY+14); g.lineTo(cx, shoulderY+55); g.lineTo(cx+5, shoulderY+14); g.closePath());

          // 3. HEAD & NECK
          if (hairStyle !== "hijab") {
            // Neck
            fillStroke(WHITE, ()=> g.rect(cx-9, headCy+headRy-12, 18, shoulderY-(headCy+headRy)+14));
            
            // Face Shape
            fillStroke(WHITE, ()=> {
                const r = 6;
                // Simple oval or square logic
                if(Math.random() > 0.8) { // Square-ish face
                     g.moveTo(cx+faceOff-headRx+r, headCy-headRy); g.lineTo(cx+faceOff+headRx-r, headCy-headRy);
                     g.quadraticCurveTo(cx+faceOff+headRx, headCy-headRy, cx+faceOff+headRx, headCy-headRy+r);
                     g.lineTo(cx+faceOff+headRx, headCy+headRy-r);
                     g.quadraticCurveTo(cx+faceOff+headRx, headCy+headRy, cx+faceOff+headRx-r, headCy+headRy);
                     g.lineTo(cx+faceOff-headRx+r, headCy+headRy);
                     g.quadraticCurveTo(cx+faceOff-headRx, headCy+headRy, cx+faceOff-headRx, headCy+headRy-r);
                     g.lineTo(cx+faceOff-headRx, headCy-headRy+r);
                     g.quadraticCurveTo(cx+faceOff-headRx, headCy-headRy, cx+faceOff-headRx+r, headCy-headRy);
                } else {
                    g.ellipse(cx+faceOff, headCy, headRx, headRy, 0, 0, Math.PI*2);
                }
            });
            
            // Ear
            if(earSide && !["afro","curly","hoodie"].includes(hairStyle)) {
               fillStroke(WHITE, ()=> g.ellipse(cx-headRx+2, headCy+headRy*0.05, 5.5, 7.5, 0,0,Math.PI*2));
               stroke(()=> g.arc(cx-headRx+2, headCy+headRy*0.05, 3.2, Math.PI*0.3, Math.PI*1.5));
            }
          }

          // 4. HAIR STYLES
          const hairClip = (ratio) => { g.save(); g.beginPath(); g.ellipse(cx+faceOff, headCy, headRx+0.5, headRy+0.5, 0, 0, Math.PI*2); g.clip(); fill(INK, ()=> g.rect(cx+faceOff-headRx-5, headTop-5, headRx*2+10, headRy*ratio+5)); g.restore(); };
          const hairDome = (extra) => fillStroke(INK, ()=> g.ellipse(cx+faceOff, headCy, headRx+extra, headRy+extra, 0, Math.PI, Math.PI*2));

          if (hairStyle === "short") { hairClip(rr(0.42, 0.55)); hairDome(3); }
          if (hairStyle === "buzz") { hairClip(rr(0.3, 0.42)); hairDome(2); }
          if (hairStyle === "fringe") { hairClip(rr(0.6, 0.85)); hairDome(3); fill(INK, ()=> { g.moveTo(cx+faceOff+headRx, headTop+headRy*0.3); g.quadraticCurveTo(cx+faceOff, headTop-10, cx+faceOff-headRx, headTop+headRy*0.3); }); }
          if (hairStyle === "bangs") { hairClip(0.5); hairDome(3); fill(INK, ()=> g.rect(cx+faceOff-headRx-2, headTop-2, headRx*2+4, headRy*0.55)); }
          if (hairStyle === "long") { hairClip(0.55); hairDome(3); }
          if (hairStyle === "afro") { hairClip(0.45); fillStroke(INK, ()=> g.ellipse(cx+faceOff, headCy-headRy*0.3, headRx*1.6, headRy*1.4, 0,0,Math.PI*2)); }
          if (hairStyle === "spiky") { hairClip(0.35); for(let i=0; i<6; i++) { const a=Math.PI+(Math.PI*(i+0.5))/6; const len=rr(12,20); fillStroke(INK, ()=>g.moveTo(cx+faceOff+Math.cos(a)*(headRx+2), headCy+Math.sin(a)*(headRy+2)); g.lineTo(cx+faceOff+Math.cos(a)*len, headCy+Math.sin(a)*len); }); }
          if (hairStyle === "cap") { fillStroke(INK, ()=> g.ellipse(cx+faceOff, headCy-headRy*0.4, headRx+3, headRy*0.75, 0, Math.PI, Math.PI*2)); fillStroke(INK, ()=> { g.moveTo(cx+faceOff-headRx-3, headCy-headRy*0.42); g.lineTo(cx+faceOff+headRx+18, headCy-headRy*0.42); g.lineTo(cx+faceOff+headRx+16, headCy-headRy*0.34); g.lineTo(cx+faceOff-headRx-3, headCy-headRy*0.34); g.closePath(); }); }
          if (hairStyle === "beanie") { fillStroke(INK, ()=> g.ellipse(cx+faceOff, headCy-headRy*0.3, headRx+3, headRy*0.85, 0, Math.PI, Math.PI*2)); fillStroke(INK, ()=> g.rect(cx+faceOff-headRx-3, headCy-headRy*0.38, headRx*2+6, 9)); }

          // 5. BEARD
          if (hasBeard && beardStyle !== "mustache" && hairStyle !== "hijab") {
            g.save(); g.beginPath(); g.ellipse(cx+faceOff, headCy, headRx+2, headRy+2, 0, 0, Math.PI*2); g.clip();
            if(beardStyle==="full") fill(INK, ()=> g.rect(cx+faceOff-headRx-5, headCy+headRy*0.15, headRx*2+10, headRy));
            else if(beardStyle==="goatee") fill(INK, ()=> g.ellipse(cx+faceOff+headRx*0.3, headCy+headRy*0.55, 9, 13, 0,0,Math.PI*2));
            else if(beardStyle==="stubble") { g.fillStyle="rgba(0,0,0,0.3)"; for(let i=0;i<50;i++) g.fillRect(cx+faceOff+rr(-headRx*0.8, headRx*0.9), headCy+rr(headRy*0.2, headRy*0.9), 1.2, 1.2); }
            g.restore();
          }

          // 6. FACE FEATURES
          if (hairStyle !== "hijab") {
            const eyeX = cx + faceOff + headRx * 0.32;
            const eyeY = headCy - headRy * 0.06;

            // Eyes
            if (eyeStyle === "open") { fill(INK, ()=> g.ellipse(eyeX, eyeY, 2.8, 3.2, 0, 0, Math.PI*2)); fill(WHITE, ()=> g.arc(eyeX+0.9, eyeY-0.9, 1, 0, Math.PI*2)); }
            else if (eyeStyle === "happy") stroke(()=> g.arc(eyeX, eyeY+1, 3, Math.PI*1.1, Math.PI*1.9));
            else if (eyeStyle === "closed") stroke(()=> g.arc(eyeX, eyeY, 3, Math.PI*1.1, Math.PI*1.9));

            // Second eye (depth)
            if(ch(0.55)) fill(INK, ()=> g.ellipse(cx+faceOff-headRx*0.12, eyeY, 2, 2.4, 0,0,Math.PI*2));

            // Nose
            stroke(()=> g.moveTo(cx+faceOff+headRx*0.5, headCy-headRy*0.05); g.quadraticCurveTo(cx+faceOff+headRx-1, headCy+headRy*0.18, cx+faceOff+headRx*0.48, headCy+headRy*0.28));
            fill(INK, ()=> g.arc(cx+faceOff+headRx*0.5, headCy+headRy*0.25, 1.4, 0, Math.PI*2));

            // Mouth
            g.lineWidth = 2.2;
            const mouthY = headCy + headRy * 0.44;
            if (mouthType === "smile") stroke(()=> g.arc(eyeX-2, mouthY-2, 6, Math.PI*0.1, Math.PI*0.7));
            else if (mouthType === "neutral") stroke(()=> g.moveTo(eyeX-6, mouthY); g.lineTo(eyeX+4, mouthY));
            else if (mouthType === "open") fillStroke(INK, ()=> g.ellipse(eyeX-1, mouthY, 5, 3.5, 0, 0, Math.PI*2));

            // Mustache
            if (hasMustache) fill(INK, ()=> { g.moveTo(eyeX-8, mouthY-5); g.quadraticCurveTo(eyeX-4, mouthY-10, eyeX, mouthY-5); g.quadraticCurveTo(eyeX+5, mouthY-10, eyeX+8, mouthY-5); g.quadraticCurveTo(eyeX+3, mouthY-1, eyeX, mouthY-2); g.quadraticCurveTo(eyeX-3, mouthY-1, eyeX-8, mouthY-5); });

            // Glasses
            if (hasGlasses) {
                g.lineWidth = 2.4;
                if(glassStyle === "round") { g.beginPath(); g.arc(eyeX, eyeY, 9, 0, Math.PI*2); g.stroke(); g.beginPath(); g.moveTo(eyeX-9, eyeY); g.lineTo(cx-headRx+2, eyeY); g.stroke(); }
                else if(glassStyle === "square") { g.strokeRect(eyeX-9, eyeY-8, 18, 16); g.beginPath(); g.moveTo(eyeX-9, eyeY); g.lineTo(cx-headRx+2, eyeY); g.stroke(); }
                else if(glassStyle === "sunglasses") { fillStroke(INK, ()=> g.ellipse(eyeX, eyeY, 10, 8, 0, 0, Math.PI*2)); g.lineWidth=2.8; g.beginPath(); g.moveTo(eyeX-10, eyeY); g.lineTo(cx-headRx+1, eyeY); g.stroke(); }
            }
            
            // Outline redraw
            g.strokeStyle = INK; g.lineWidth = lw; g.beginPath(); g.ellipse(cx+faceOff, headCy, headRx, headRy, 0, 0, Math.PI*2); g.stroke();
          }

          // 7. PHONE
          if (hasPhone) {
            const px = cx + bodyW*0.3; const py = shoulderY + 30;
            fillStroke(INK, ()=> g.roundRect(px, py, 18, 30, 3));
            fill(WHITE, ()=> g.roundRect(px+2, py+3, 14, 22, 2));
            fillStroke(WHITE, ()=> g.ellipse(px+9, py+32, 10, 8, 0, 0, Math.PI*2));
          }

          return c;
        }

        // --- CROWD ENGINE ---
        
        // Peep Class wrapper
        class Peep {
          constructor(sprite) {
            this.image = sprite;
            // Randomize scale (depth perception)
            const s = rr(0.5, 1.15); 
            this.width = W * s;
            this.height = H * s;
            this.x = 0; this.y = 0;
            this.anchorY = 0; 
            this.scaleX = 1;
            this.walk = null;
          }
          render(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.scale(this.scaleX, 1);
            ctx.drawImage(this.image, 0, 0, this.image.width, this.image.height, 0, 0, this.width, this.height);
            ctx.restore();
          }
        }

        const canvas = document.getElementById("crowdCanvas");
        const ctx = canvas.getContext("2d");
        
        // Crowd density based on screen width
        const COUNT = Math.floor(window.innerWidth / 3); 

        const stage = { width:0, height:0 };
        let dpr = window.devicePixelRatio || 1;

        const allPeeps = [];
        const availablePeeps = [];
        const crowd = [];

        // Animation Logic
        const resetPeep = ({stage, peep}) => {
          const dir = Math.random() > 0.5 ? 1 : -1;
          // Power2.in ease creates the "closer at bottom, further at top" distribution
          const offsetY = 100 - 250 * gsap.parseEase("power2.in")(Math.random());
          const startY = stage.height - peep.height + offsetY;
          let startX, endX;
          
          if (dir === 1) {
            startX = -peep.width;
            endX = stage.width;
            peep.scaleX = 1; // Facing Right
          } else {
            startX = stage.width + peep.width;
            endX = 0;
            peep.scaleX = -1; // Facing Left
          }
          peep.x = startX;
          peep.y = startY;
          peep.anchorY = startY;
          return {startX, startY, endX};
        };

        const normalWalk = ({peep, props}) => {
          const {startY, endX} = props;
          const xD = 10; // Horizontal duration
          const yD = 0.25; // Bobbing duration
          
          const tl = gsap.timeline();
          tl.timeScale(rr(0.5, 1.5)); // Random speed
          
          // Walk across
          tl.to(peep, {duration: xD, x: endX, ease: "none"}, 0);
          // Bob up and down
          tl.to(peep, {
            duration: yD, 
            repeat: xD/yD, 
            yoyo: true, 
            y: startY - 10, 
            ease: "power1.inOut"
          }, 0);
          
          return tl;
        };

        function addPeep() {
          if (!availablePeeps.length) return null;
          const peep = removeRandom(availablePeeps);
          
          const walk = normalWalk({peep, props: resetPeep({peep, stage})}).eventCallback("onComplete", () => {
            removePeep(peep);
            addPeep();
          });
          
          peep.walk = walk;
          crowd.push(peep);
          // Sort by Y so lower people cover higher people
          crowd.sort((a,b) => a.anchorY - b.anchorY);
          return peep;
        }

        function removePeep(peep) {
          const i = crowd.indexOf(peep);
          if (i !== -1) crowd.splice(i, 1);
          availablePeeps.push(peep);
        }

        function initCrowd() {
          while (availablePeeps.length) {
            const p = addPeep();
            if (p && p.walk) p.walk.progress(Math.random()); // Start at random point in anim
          }
        }

        function render() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.save();
          ctx.scale(dpr, dpr);
          crowd.forEach(p => p.render(ctx));
          ctx.restore();
        }

        function resize() {
          dpr = window.devicePixelRatio || 1;
          stage.width = canvas.clientWidth;
          stage.height = canvas.clientHeight;
          canvas.width = stage.width * dpr;
          canvas.height = stage.height * dpr;
          
          // Kill animations
          crowd.forEach(p => p.walk && p.walk.kill());
          // Reset arrays
          crowd.length = 0;
          availablePeeps.length = 0;
          availablePeeps.push(...allPeeps);
          
          initCrowd();
          render();
        }

        // Initialization
        // Create all unique character sprites first
        for (let i = 0; i < COUNT; i++) allPeeps.push(new Peep(drawPeep()));
        
        resize();
        
        // Start Ticker
        gsap.ticker.add(render);
        window.addEventListener("resize", resize);

      })();
    </script>
  </body>
</html>
