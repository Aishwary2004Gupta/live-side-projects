<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enhanced Procedural Crowd</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f7f9fc; overflow: hidden; height: 100vh; font-family: system-ui, -apple-system, sans-serif; }
  
  .header {
    position: absolute; top: 50px; left: 50%; transform: translateX(-50%);
    z-index: 100; text-align: center; opacity: 0.6; pointer-events: none;
  }
  .header span {
    font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: #333;
  }
  .header::after {
    content: ''; position: absolute; bottom: -40px; left: 50%; width: 1px; height: 50px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(0,0,0,0));
    transform: translateX(-50%);
  }

  canvas { 
    position: absolute; bottom: 0; left: 0; width: 100%; height: 92vh; 
    display: block; image-rendering: pixelated; /* Keeps lines crisp */
  }
  
  /* Floor gradient for realism */
  .floor {
    position: absolute; bottom: 0; width: 100%; height: 50px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.1), transparent);
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="header"><span>Infinite Crowd Canvas</span></div>
<div class="floor"></div>
<canvas id="crowdCanvas"></canvas>

<script>
/**
 * -----------------------------------------------------------
 * PART 1: ENHANCED PROCEDURAL CHARACTER GENERATOR
 * Generates high-fidelity "Open Peeps" style characters using code.
 * -----------------------------------------------------------
 */
const INK = '#111111';
const R   = (min, max) => min + Math.random() * (max - min);
const P   = arr => arr[Math.floor(Math.random() * arr.length)];
const C   = p => Math.random() < p;

function drawPeep(ctx, size) {
  const cx = size / 2, cy = size * 0.7; // Center Y for torso/head alignment
  ctx.lineWidth = 3.5;
  ctx.lineCap = 'round';
  ctx.strokeStyle = INK;
  ctx.fillStyle = INK;
  ctx.beginPath(); ctx.setLineDash([]); // Reset dashes

  // --- Identity Variables ---
  const skinTone = C(0.9) ? '#fff' : '#eee'; // Mostly white, rarely off-white
  const hairstyle = P(['afro', 'bobs', 'hijab', 'short', 'long', 'curly', 'mohawk', 'puffs', 'messy']);
  const gender = C(0.5) ? 'male' : 'female'; // Slight influence on beard/beards
  
  // Face Dimensions
  const headR = size * 0.22;
  const headY = cy - (size * 0.15);

  // --- Torso/Shirt (Drawn First/Bottom Layer) ---
  const shoulderW = size * 0.75;
  const shirtType = P(['solid_black', 'solid_white', 'striped', 'polka', 'vneck']);
  const neckRect = () => {
    ctx.fillStyle = skinTone;
    ctx.fillRect(cx - 8, cy - 2, 16, 14);
  };

  const drawTorso = () => {
    ctx.beginPath();
    ctx.moveTo(cx - shoulderW/2, size);
    ctx.lineTo(cx - shoulderW/2, cy + 10);
    ctx.bezierCurveTo(cx - shoulderW/2 + 20, cy, cx - 10, cy, cx - 10, cy);
    ctx.lineTo(cx + 10, cy);
    ctx.bezierCurveTo(cx + 20, cy, cx + shoulderW/2, cy, cx + shoulderW/2, cy + 10);
    ctx.lineTo(cx + shoulderW/2, size);
    ctx.closePath();

    if(shirtType === 'solid_black') {
      ctx.fillStyle = INK; ctx.fill(); 
    } else {
      ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke();
      
      // Patterns
      ctx.save(); ctx.clip(); ctx.fillStyle = INK;
      if (shirtType === 'striped') {
        for(let y = cy + 15; y < size; y+=12) ctx.fillRect(cx - shoulderW/2, y, shoulderW, 4);
      } else if (shirtType === 'polka') {
        for(let i=0; i<10; i++) ctx.arc(R(cx-shoulderW/2, cx+shoulderW/2), R(cy+15, size), 3, 0, Math.PI*2);
      } else if (shirtType === 'vneck') {
         ctx.beginPath(); ctx.moveTo(cx, cy+10); ctx.lineTo(cx-15, cy+25); ctx.lineTo(cx+15, cy+25); ctx.fill();
      }
      ctx.restore();
    }
  };

  drawTorso();
  neckRect();

  // --- Hair Back (Behind Head) ---
  const drawHairBack = () => {
    switch(hairstyle) {
      case 'afro':
        ctx.beginPath(); ctx.arc(cx, headY - headR*0.2, headR*1.4, 0, Math.PI*2); ctx.fill();
        break;
      case 'long':
        ctx.beginPath(); 
        ctx.roundRect(cx - headR*1.2, headY - headR, headR*2.4, headR*3.2, [10,10,20,20]); 
        ctx.fill();
        break;
      case 'hijab':
        ctx.beginPath(); ctx.roundRect(cx - headR*1.3, headY - headR*1.2, headR*2.6, size - (headY-headR*1.2), [15,15,0,0]); ctx.fill();
        break;
    }
  };

  // --- Head Shape ---
  ctx.beginPath();
  ctx.ellipse(cx, headY, headR*0.95, headR, 0, 0, Math.PI*2);
  ctx.fillStyle = skinTone; ctx.fill(); ctx.stroke();

  // --- Facial Features ---
  const eyeY = headY - 2;
  const eyeX = headR * 0.45;
  const mouthY = headY + 18;

  // Ears (if not hijab)
  if(hairstyle !== 'hijab') {
    [-1, 1].forEach(s => {
       ctx.beginPath(); ctx.arc(cx + s*headR*0.9, headY + 5, headR*0.2, 0, Math.PI*2);
       ctx.fillStyle = skinTone; ctx.fill(); ctx.stroke();
    });
  }

  // Eyes / Eyebrows
  const expression = P(['smile', 'neutral', 'surprised', 'winking', 'grin']);
  const hasGlasses = C(0.35);
  const hasBeard = (gender === 'male') && C(0.3);
  const hasMustache = !hasBeard && C(0.25);

  // Draw Glasses frame first or eyes depending on type
  [-1, 1].forEach(s => {
    // Eyes
    if (expression === 'winking' && s === -1) {
        ctx.beginPath(); ctx.moveTo(cx + s*(eyeX-4), eyeY+2); ctx.quadraticCurveTo(cx + s*eyeX, eyeY-2, cx + s*(eyeX+4), eyeY+2); ctx.stroke();
    } else {
        ctx.beginPath(); ctx.arc(cx + s*eyeX, eyeY, 3.5, 0, Math.PI*2); ctx.fill();
    }
    
    // Glasses Over-Eye
    if (hasGlasses) {
      ctx.beginPath(); 
      if(hasGlasses && C(0.3)) { // Round glasses
         ctx.arc(cx + s*eyeX, eyeY, headR*0.22, 0, Math.PI*2);
      } else { // Square glasses
         ctx.rect(cx + s*eyeX - 8, eyeY - 8, 16, 16);
      }
      ctx.stroke();
      if(s===1 && s===1) ctx.beginPath(); ctx.moveTo(cx-eyeX+8, eyeY-5); ctx.lineTo(cx+eyeX-8, eyeY-5); ctx.stroke(); // Bridge
    }
  });

  // Eyebrows
  [-1, 1].forEach(s => {
    let arcStart = Math.PI * 0.2; 
    let arcEnd = Math.PI * 0.8;
    if (expression === 'surprised') { arcStart = 0; arcEnd = Math.PI; }
    else if (expression === 'sad') { arcStart = Math.PI; arcEnd = 0; } 
    
    ctx.beginPath();
    ctx.arc(cx + s*eyeX, eyeY - 10, 6, arcStart, arcEnd);
    ctx.stroke();
  });

  // Nose
  ctx.beginPath();
  ctx.moveTo(cx - 2, eyeY + 8);
  ctx.quadraticCurveTo(cx + 6, eyeY + 14, cx - 2, eyeY + 14);
  ctx.stroke();

  // Mouth
  ctx.beginPath();
  if (expression === 'smile' || expression === 'grin') {
     ctx.arc(cx, mouthY - 5, 8, 0.1, Math.PI * 0.9); ctx.stroke();
  } else if (expression === 'surprised') {
     ctx.arc(cx, mouthY, 5, 0, Math.PI*2); ctx.stroke();
  } else if (expression === 'neutral') {
     ctx.moveTo(cx - 6, mouthY); ctx.lineTo(cx + 6, mouthY); ctx.stroke();
  } else if (expression === 'winking') {
     ctx.arc(cx, mouthY, 5, 0.2, Math.PI*0.8); ctx.stroke();
  }

  // Mustache / Beard
  if (hasMustache) {
    ctx.beginPath(); ctx.arc(cx, mouthY - 10, 10, 0.2, Math.PI*0.8, false); ctx.stroke();
  }
  if (hasBeard) {
     ctx.beginPath();
     ctx.arc(cx, headY + 20, 18, Math.PI*0.2, Math.PI*0.8); // Jawline
     ctx.arc(cx, headY + 35, 12, Math.PI*1.0, Math.PI*0.0); // Chin
     ctx.closePath(); ctx.fill();
  }

  // --- Hair Front (On Top of Head) ---
  const drawHairFront = () => {
    ctx.fillStyle = INK;
    // Generic hair base over forehead
    ctx.beginPath(); ctx.arc(cx, headY, headR, Math.PI, 0, true); ctx.fill();

    switch(hairstyle) {
      case 'bobs':
        ctx.beginPath(); ctx.roundRect(cx - headR*1.1, headY - headR*0.5, headR*2.2, headR*1.2, [10,10,0,0]); ctx.fill(); break;
      case 'short':
        ctx.beginPath(); ctx.arc(cx, headY - headR*0.2, headR*1.1, 0, Math.PI, true); ctx.fill(); break;
      case 'curly':
         ctx.beginPath(); ctx.arc(cx - 10, headY - headR*0.8, 12, 0, Math.PI*2); ctx.fill();
         ctx.beginPath(); ctx.arc(cx + 10, headY - headR*0.8, 12, 0, Math.PI*2); ctx.fill();
         ctx.beginPath(); ctx.arc(cx, headY - headR*1.2, 14, 0, Math.PI*2); ctx.fill();
         break;
      case 'puffs':
        ctx.beginPath(); ctx.arc(cx - 18, headY - headR*0.5, 10, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx + 18, headY - headR*0.5, 10, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx, headY - headR*0.3, 15, Math.PI, 0); ctx.fill();
        break;
      case 'messy':
          for(let i=0; i<5; i++) {
              ctx.beginPath(); 
              ctx.arc(cx + R(-15, 15), headY + R(-10, -30), R(8, 12), 0, Math.PI*2); 
              ctx.fill();
          }
          break;
      case 'mohawk':
          ctx.beginPath(); ctx.moveTo(cx - 8, headY - headR*0.5); 
          ctx.lineTo(cx - 4, headY - headR*1.5); 
          ctx.lineTo(cx, headY - headR*0.5); 
          ctx.lineTo(cx + 4, headY - headR*1.5); 
          ctx.lineTo(cx + 8, headY - headR*0.5); 
          ctx.fill();
          break;
    }
  };

  if (hairstyle !== 'hijab') drawHairFront();
}


/**
 * -----------------------------------------------------------
 * PART 2: BULK SPRITE SHEET GENERATION
 * Creates a grid of 200 high-resolution characters.
 * -----------------------------------------------------------
 */
const COLS = 10;
const ROWS = 20; // 200 Unique Characters
const CHAR_SIZE = 150;
const RES_SCALE = 2; // Retina support generation

const sheetCanvas = document.createElement('canvas');
sheetCanvas.width = COLS * CHAR_SIZE * RES_SCALE;
sheetCanvas.height = ROWS * CHAR_SIZE * RES_SCALE;
const sCtx = sheetCanvas.getContext('2d');

for(let i = 0; i < COLS * ROWS; i++) {
    const x = (i % COLS) * CHAR_SIZE;
    const y = Math.floor(i / COLS) * CHAR_SIZE;
    
    sCtx.save();
    sCtx.scale(RES_SCALE, RES_SCALE);
    sCtx.translate(x * RES_SCALE, y * RES_SCALE);
    
    // Clip region to keep peeps neat
    sCtx.beginPath(); sCtx.rect(0, 0, CHAR_SIZE, CHAR_SIZE); sCtx.clip();
    
    drawPeep(sCtx, CHAR_SIZE);
    
    sCtx.restore();
}


/**
 * -----------------------------------------------------------
 * PART 3: THE CROWD ENGINE
 * Manages rendering, animation, and depth sorting.
 * -----------------------------------------------------------
 */
const canvas = document.getElementById('crowdCanvas');
const mainCtx = canvas.getContext('2d');
let stageWidth = 0, stageHeight = 0;

// Lists to manage state
const allChars = [];
const activeCrowd = [];
const pool = [];

// Pre-populate the sprite data array
for(let i = 0; i < COLS * ROWS; i++) {
    allChars.push({
        sx: (i % COLS) * CHAR_SIZE,
        sy: Math.floor(i / COLS) * CHAR_SIZE,
        w: CHAR_SIZE, h: CHAR_SIZE,
        x: 0, y: 0, 
        anchorY: 0,
        scaleX: 1,
        scale: 1,
        walkTl: null,
        
        render: function(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.scale(this.scaleX * this.scale, this.scale);
            // Draw from our generated sprite sheet
            ctx.drawImage(sheetCanvas, 
                this.sx * RES_SCALE, this.sy * RES_SCALE, 
                this.w * RES_SCALE, this.h * RES_SCALE, 
                -this.w/2, 0, this.w, this.h
            );
            ctx.restore();
        }
    });
}

// Utility Functions
const rand = (min, max) => min + Math.random() * (max - min);
const pickOne = (arr) => arr[Math.floor(Math.random() * arr.length)];
const removeFrom = (arr, item) => {
    const idx = arr.indexOf(item);
    if(idx > -1) arr.splice(idx, 1);
    return item;
};

const spawnPeep = () => {
    if(pool.length === 0) return;
    
    const char = pool.pop();
    activeCrowd.push(char);
    startWalking(char);
    
    // Sort by Y-position for depth (Painter's Algorithm)
    activeCrowd.sort((a, b) => a.anchorY - b.anchorY);
};

const startWalking = (char) => {
    // Reset Logic
    const dir = Math.random() > 0.5 ? 1 : -1;
    
    // Depth Logic: Randomize scale based on vertical position
    // Power function makes most people closer to normal size, fewer tiny far-away ones
    const depthVal = Math.pow(Math.random(), 2); 
    const yPosOffset = 150 - 500 * depthVal; // Start lower if smaller
    
    char.scale = 0.5 + 0.6 * depthVal; // 0.5x to 1.1x scale
    char.anchorY = stageHeight - char.h * 0.8 * char.scale + yPosOffset;
    char.y = char.anchorY;
    char.scaleX = dir;

    // Start X positions (Off-screen)
    const startX = dir === 1 ? -char.w : stageWidth + char.w;
    const endX   = dir === 1 ? stageWidth + char.w : -char.w;

    char.x = startX;

    // Create Timeline
    const tl = gsap.timeline({
        onComplete: () => {
            // Finished crossing? Send back to pool.
            removeFrom(activeCrowd, char);
            pool.push(char);
            
            // Keep the crowd full!
            spawnPeep();
        }
    });

    tl.timeScale(rand(0.8, 1.6)); // Walking speed variation

    // Move Across
    tl.to(char, {
        duration: 15 + Math.random() * 10, // Long duration
        x: endX,
        ease: "none"
    }, 0);

    // Bob up and down (Walking cycle)
    tl.to(char, {
        duration: 0.25,
        y: char.y - 12, // Bob height
        repeat: (15 * 4), // Approximate repeats to match duration
        yoyo: true,
        ease: "sine.inOut",
        overwrite: "auto"
    }, 0);

    char.walkTl = tl;
};

const renderLoop = () => {
    // Clear Screen
    mainCtx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Scale Context for High DPI
    mainCtx.save();
    mainCtx.scale(window.devicePixelRatio, window.devicePixelRatio);
    
    // Draw Everyone
    activeCrowd.forEach(p => p.render(mainCtx));
    
    mainCtx.restore();
};

const resizeHandler = () => {
    stageWidth = canvas.clientWidth;
    stageHeight = canvas.clientHeight;
    
    // Resize actual canvas buffer
    canvas.width = stageWidth * window.devicePixelRatio;
    canvas.height = stageHeight * window.devicePixelRatio;

    // Kill old animations
    activeCrowd.forEach(p => { if(p.walkTl) p.walkTl.kill(); });
    
    // Reset everyone to pool
    pool.push(...activeCrowd);
    activeCrowd.length = 0;

    // Respawn fresh crowd with random starts
    for(let i=0; i < 25; i++) spawnPeep().walkTl.progress(Math.random());
};

// Initialize
window.addEventListener('resize', resizeHandler);
gsap.ticker.add(renderLoop);
resizeHandler(); // Trigger initial setup

</script>
</body>
</html>
