<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crowd Canvas</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: #000;
    }

    .page {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #fff;
    }

    .heading {
      position: absolute;
      top: 5.5rem;
      left: 50%;
      transform: translateX(-50%);
      display: grid;
      place-items: center;
      gap: 1.5rem;
      text-align: center;
      z-index: 2;
    }

    .heading span {
      position: relative;
      max-width: 12ch;
      font-size: 12px;
      line-height: 1.1;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      opacity: 0.4;
    }

    .heading span::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      width: 1px;
      height: 4rem;
      background: linear-gradient(to bottom, #fff, #000);
    }

    .canvas-wrap {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100%;
    }

    #crowdCanvas {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 90vh;
      display: block;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="heading">
      <span>Croud Canvas</span>
    </div>

    <div class="canvas-wrap">
      <canvas
        id="crowdCanvas"
        data-src="images/peeps/all-peeps.png"
        data-rows="15"
        data-cols="7"
      ></canvas>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <script>
    const canvas = document.getElementById("crowdCanvas");
    const ctx = canvas.getContext("2d");

    const config = {
      src: canvas.dataset.src,
      rows: Number(canvas.dataset.rows) || 15,
      cols: Number(canvas.dataset.cols) || 7,
    };

    const stage = {
      width: 0,
      height: 0,
    };

    let dpr = window.devicePixelRatio || 1;

    const allPeeps = [];
    const availablePeeps = [];
    const crowd = [];

    const randomRange = (min, max) => min + Math.random() * (max - min);

    const randomIndex = (array) => {
      return randomRange(0, array.length) | 0;
    };

    const removeFromArray = (array, i) => {
      return array.splice(i, 1)[0];
    };

    const removeItemFromArray = (array, item) => {
      const index = array.indexOf(item);
      if (index !== -1) {
        return removeFromArray(array, index);
      }
    };

    const removeRandomFromArray = (array) => {
      return removeFromArray(array, randomIndex(array));
    };

    const getRandomFromArray = (array) => {
      return array[randomIndex(array)];
    };

    class Peep {
      constructor({ image, rect }) {
        this.image = image;
        this.rect = [];
        this.width = 0;
        this.height = 0;
        this.x = 0;
        this.y = 0;
        this.anchorY = 0;
        this.scaleX = 1;
        this.walk = null;

        this.setRect(rect);
      }

      setRect(rect) {
        this.rect = rect;
        this.width = rect[2];
        this.height = rect[3];
      }

      render(ctx) {
        ctx.save();

        ctx.translate(this.x, this.y);
        ctx.scale(this.scaleX, 1);

        ctx.drawImage(
          this.image,
          this.rect[0],
          this.rect[1],
          this.rect[2],
          this.rect[3],
          0,
          0,
          this.width,
          this.height
        );

        ctx.restore();
      }
    }

    const resetPeep = ({ stage, peep }) => {
      const direction = Math.random() > 0.5 ? 1 : -1;

      const offsetY =
        100 - 250 * gsap.parseEase("power2.in")(Math.random());

      const startY = stage.height - peep.height + offsetY;

      let startX;
      let endX;

      if (direction === 1) {
        startX = -peep.width;
        endX = stage.width;
        peep.scaleX = 1;
      } else {
        startX = stage.width + peep.width;
        endX = 0;
        peep.scaleX = -1;
      }

      peep.x = startX;
      peep.y = startY;
      peep.anchorY = startY;

      return {
        startX,
        startY,
        endX,
      };
    };

    const normalWalk = ({ peep, props }) => {
      const { startY, endX } = props;

      const xDuration = 10;
      const yDuration = 0.25;

      const tl = gsap.timeline();

      tl.timeScale(randomRange(0.5, 1.5));

      tl.to(
        peep,
        {
          duration: xDuration,
          x: endX,
          ease: "none",
        },
        0
      );

      tl.to(
        peep,
        {
          duration: yDuration,
          repeat: xDuration / yDuration,
          yoyo: true,
          y: startY - 10,
          ease: "power1.inOut",
        },
        0
      );

      return tl;
    };

    const walks = [normalWalk];

    const img = new Image();

    function createPeeps() {
      const { rows, cols } = config;
      const width = img.naturalWidth;
      const height = img.naturalHeight;

      const total = rows * cols;
      const rectWidth = width / rows;
      const rectHeight = height / cols;

      for (let i = 0; i < total; i++) {
        allPeeps.push(
          new Peep({
            image: img,
            rect: [
              (i % rows) * rectWidth,
              ((i / rows) | 0) * rectHeight,
              rectWidth,
              rectHeight,
            ],
          })
        );
      }
    }

    function addPeepToCrowd() {
      if (!availablePeeps.length) return null;

      const peep = removeRandomFromArray(availablePeeps);

      const walk = getRandomFromArray(walks)({
        peep,
        props: resetPeep({
          peep,
          stage,
        }),
      }).eventCallback("onComplete", () => {
        removePeepFromCrowd(peep);
        addPeepToCrowd();
      });

      peep.walk = walk;

      crowd.push(peep);
      crowd.sort((a, b) => a.anchorY - b.anchorY);

      return peep;
    }

    function removePeepFromCrowd(peep) {
      removeItemFromArray(crowd, peep);
      availablePeeps.push(peep);
    }

    function initCrowd() {
      while (availablePeeps.length) {
        const peep = addPeepToCrowd();

        if (peep && peep.walk) {
          peep.walk.progress(Math.random());
        }
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.scale(dpr, dpr);

      crowd.forEach((peep) => {
        peep.render(ctx);
      });

      ctx.restore();
    }

    function resize() {
      dpr = window.devicePixelRatio || 1;

      stage.width = canvas.clientWidth;
      stage.height = canvas.clientHeight;

      canvas.width = stage.width * dpr;
      canvas.height = stage.height * dpr;

      crowd.forEach((peep) => {
        if (peep.walk) peep.walk.kill();
      });

      crowd.length = 0;
      availablePeeps.length = 0;
      availablePeeps.push(...allPeeps);

      initCrowd();
      render();
    }

    function init() {
      createPeeps();
      resize();
      gsap.ticker.add(render);
    }

    img.onload = init;

    img.onerror = () => {
      console.error("Could not load sprite image:", config.src);
      console.log("Place your image at images/peeps/all-peeps.png or change data-src.");
    };

    img.src = config.src;

    window.addEventListener("resize", resize);
  </script>
</body>
</html>
