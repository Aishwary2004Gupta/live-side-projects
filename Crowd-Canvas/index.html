<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Procedural Crowd — Hand-Drawn Open Peeps Style</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
    }
    .page {
      position: relative;
      width: 100vw; height: 100vh;
      overflow: hidden; background: #ffffff;
    }
    .heading {
      position: absolute; top: 4rem; left: 50%;
      transform: translateX(-50%);
      display: grid; place-items: center; gap: 1rem;
      text-align: center; z-index: 10;
      pointer-events: none;
    }
    .heading span {
      position: relative;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      opacity: 0.5;
      font-weight: 700;
      color: #000000;
    }
    .heading span::after {
      content: ""; position: absolute; top: 100%; left: 50%;
      width: 1px; height: 2.5rem;
      background: linear-gradient(to bottom, #000000, rgba(0,0,0,0));
      margin-top: 8px;
    }
    #crowdCanvas {
      position: absolute; left: 0; bottom: 0;
      width: 100%; height: 100%;
      display: block; pointer-events: none;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="heading"><span>Crowd Canvas</span></div>
    <canvas id="crowdCanvas"></canvas>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
  (function() {
    const rr = (a,b) => a + Math.random()*(b-a);
    const ri = (a,b) => (rr(a,b))|0;
    const pick = a => a[(Math.random()*a.length)|0];
    const ch = p => Math.random()<p;
    const removeAt = (a,i) => a.splice(i,1)[0];
    const removeRandom = a => removeAt(a,(Math.random()*a.length)|0);

    const INK   = "#000000";
    const WHITE = "#ffffff";
    const LIGHT = "#f5f5f3";
    const FILLS = [INK, WHITE, WHITE, LIGHT, WHITE]; 

    // Base dimensions for the off-screen vector cache
    const W = 150, H = 220, S = 2;

    /* ════════════════════════════════════════
       HIGH-FIDELITY PROCEDURAL OPEN PEEPS GENERATOR
       ════════════════════════════════════════ */
    function drawPeep() {
      const c = document.createElement("canvas");
      c.width = W*S; c.height = H*S;
      const g = c.getContext("2d");
      g.scale(S,S);
      g.lineCap = "round"; g.lineJoin = "round";

      // Precise line weights matching the hand-drawn illustration
      const lw = 3.2; 
      const cx = 75;
      const headRx = rr(21, 25);
      const headRy = rr(25, 29);
      const headCy = 65;
      const headTop = headCy - headRy;
      const shoulderY = headCy + headRy + rr(8,14);
      const bodyW = rr(64, 82);
      const bodyL = cx - bodyW/2;
      const bodyR = cx + bodyW/2;
      const shirtFill = pick(FILLS);
      const isDark = shirtFill === INK;

      const faceOff = headRx * 0.15; // Natural head tilt/turn look

      const hairStyle = pick([
        "short","fringe","long","afro","curly",
        "bun","ponytail","bangs","spiky","wavy","pompadour",
        "cap","beanie","bald","braids","sidepart"
      ]);
      const hasGlasses  = ch(0.35);
      const glassStyle  = pick(["round","square","sunglasses"]);
      const hasBeard    = ch(0.3);
      const beardStyle  = pick(["full","goatee","stubble","mustache"]);
      const hasMustache = hasBeard || ch(0.25);
      const hasStripes  = !isDark && ch(0.25);
      const hasCollar   = ch(0.4);
      const hasJacket   = !hasCollar && ch(0.3);
      const hasPhone    = ch(0.15);
      const faceShape   = pick(["oval","round","square"]);
      const eyeStyle    = pick(["open","open","closed","wink"]);
      const mouthType   = pick(["smile","smile","neutral","open","smirk","teeth"]);
      const earSide     = ch(0.5);

      const stroke = (fn) => { g.strokeStyle=INK; g.lineWidth=lw; g.beginPath(); fn(); g.stroke(); };
      const fill   = (color, fn) => { g.fillStyle=color; g.beginPath(); fn(); g.fill(); };
      const fillStroke = (color, fn) => {
        g.fillStyle=color; g.strokeStyle=INK; g.lineWidth=lw;
        g.beginPath(); fn(); g.fill(); g.stroke();
      };

      // ─── BACKGROUND HAIR ───
      if (hairStyle === "long") {
        fill(INK, ()=>{ g.ellipse(cx+faceOff, headCy+headRy*0.5, headRx+15, headRy*1.7, 0, 0, Math.PI*2); });
      }
      if (hairStyle === "afro") {
        fillStroke(INK, ()=>{ g.ellipse(cx+faceOff, headCy-headRy*0.2, headRx*1.6, headRy*1.3, 0, 0, Math.PI*2); });
      }
      if (hairStyle === "curly") {
        fill(INK, ()=>{ g.ellipse(cx+faceOff, headCy-headRy*0.1, headRx+10, headRy+8, 0, 0, Math.PI*2); });
        for (let a = 0; a < Math.PI*2; a += 0.5) {
          const r = headRx + 8 + rr(1,4);
          fill(INK, ()=>{ g.arc(cx+faceOff+Math.cos(a)*r, headCy-headRy*0.1+Math.sin(a)*r, rr(4,8), 0, Math.PI*2); });
        }
      }
      if (hairStyle === "braids") {
        fill(INK, ()=>{ g.ellipse(cx+faceOff, headCy-headRy*0.2, headRx+6, headRy+4, 0, 0, Math.PI*2); });
        for (let i = 0; i < 4; i++) {
          const bx = cx + faceOff - headRx*0.5 + i*(headRx/3);
          fillStroke(INK, ()=>{
            g.moveTo(bx, headTop+headRy*0.5);
            g.quadraticCurveTo(bx+rr(-6,6), headCy+headRy*0.7, bx+rr(-8,8), headCy+headRy*1.4);
          });
        }
      }

      // ─── SHIRT & JACKETS (TORSO) ───
      const rad = 16;
      const drawBaseTorso = ()=>{
        g.moveTo(bodyL, H);
        g.lineTo(bodyL, shoulderY+rad);
        g.quadraticCurveTo(bodyL, shoulderY, bodyL+rad, shoulderY);
        g.lineTo(bodyR-rad, shoulderY);
        g.quadraticCurveTo(bodyR, shoulderY, bodyR, shoulderY+rad);
        g.lineTo(bodyR, H);
        g.closePath();
      };

      fillStroke(shirtFill, drawBaseTorso);

      // Stripes Pattern
      if (hasStripes) {
        g.save(); g.beginPath(); drawBaseTorso(); g.clip();
        g.strokeStyle = INK; g.lineWidth = 3.0;
        for (let y = shoulderY+12; y < H; y += 14) {
          g.beginPath(); g.moveTo(bodyL-5, y); g.lineTo(bodyR+5, y); g.stroke();
        }
        g.restore();
        stroke(drawBaseTorso);
      }

      // Jacket overlay
      if (hasJacket && !isDark) {
        fillStroke(LIGHT, ()=>{
          g.moveTo(cx-14, shoulderY); g.lineTo(bodyL, shoulderY+25); g.lineTo(bodyL, H);
          g.lineTo(cx-12, H); g.closePath();
        });
        fillStroke(LIGHT, ()=>{
          g.moveTo(cx+14, shoulderY); g.lineTo(bodyR, shoulderY+25); g.lineTo(bodyR, H);
          g.lineTo(cx+12, H); g.closePath();
        });
        // Lapels
        stroke(()=>{
          g.moveTo(cx-14, shoulderY); g.lineTo(cx-20, shoulderY+30); g.lineTo(cx-10, shoulderY+45);
          g.moveTo(cx+14, shoulderY); g.lineTo(cx+20, shoulderY+30); g.lineTo(cx+10, shoulderY+45);
        });
      }

      // Collars
      if (hasCollar) {
        stroke(()=>{
          g.moveTo(cx-14, shoulderY); g.lineTo(cx-4, shoulderY+16); g.lineTo(cx, shoulderY+5);
          g.lineTo(cx+4, shoulderY+16); g.lineTo(cx+14, shoulderY);
        });
      }

      // ─── NECK ───
      fillStroke(WHITE, ()=>{ g.rect(cx-10, headCy+headRy-8, 20, shoulderY - (headCy+headRy) + 12); });

      // ─── HEAD OVAL ───
      fillStroke(WHITE, ()=>{
        if (faceShape === "round") g.ellipse(cx+faceOff, headCy, headRx, headRy, 0, 0, Math.PI*2);
        else g.ellipse(cx+faceOff, headCy, headRx, headRy, 0, 0, Math.PI*2);
      });

      // ─── EAR ───
      if (earSide && ["afro","curly"].indexOf(hairStyle) === -1) {
        fillStroke(WHITE, ()=>{ g.ellipse(cx - headRx + 2, headCy + headRy*0.05, 6, 8, 0, 0, Math.PI*2); });
        stroke(()=>{ g.arc(cx - headRx + 2, headCy + headRy*0.05, 3.2, Math.PI*0.3, Math.PI*1.5); });
      }

      // ─── HAIR FOREHEAD OVERLAY ───
      const hairClip = (ratio) => {
        g.save(); g.beginPath();
        g.ellipse(cx+faceOff, headCy, headRx+0.5, headRy+0.5, 0, 0, Math.PI*2); g.clip();
        fill(INK, ()=>{ g.rect(cx+faceOff-headRx-5, headTop-5, headRx*2+10, headRy*ratio+5); });
        g.restore();
      };
      const hairDome = (extra) => {
        fillStroke(INK, ()=>{ g.ellipse(cx+faceOff, headCy, headRx+extra, headRy+extra, 0, Math.PI, Math.PI*2); });
      };

      if (hairStyle === "short") { hairClip(0.45); hairDome(3); }
      if (hairStyle === "fringe") {
        hairClip(0.65); hairDome(3);
        fill(INK, ()=>{
          g.moveTo(cx+faceOff+headRx, headTop+headRy*0.3);
          g.quadraticCurveTo(cx+faceOff, headTop+headRy*0.1, cx+faceOff-headRx, headTop+headRy*0.3);
          g.lineTo(cx+faceOff-headRx, headTop+headRy*0.5);
          g.quadraticCurveTo(cx+faceOff, headTop+headRy*0.15, cx+faceOff+headRx, headTop+headRy*0.15);
          g.closePath();
        });
      }
      if (hairStyle === "bangs") {
        hairClip(0.5); hairDome(3);
        fill(INK, ()=>{ g.rect(cx+faceOff-headRx-2, headTop-2, headRx*2+4, headRy*0.52); });
      }
      if (hairStyle === "long") { hairClip(0.55); hairDome(3); }
      if (hairStyle === "afro" || hairStyle === "curly") { hairClip(0.45); }
      if (hairStyle === "spiky") {
        hairClip(0.3);
        for (let i = 0; i < 6; i++) {
          const a = Math.PI + (Math.PI*(i+0.5))/6;
          const bx = cx+faceOff+Math.cos(a)*(headRx+1);
          const by = headCy+Math.sin(a)*(headRy+1);
          fillStroke(INK, ()=>{
            g.moveTo(bx-3, by+2); g.lineTo(bx+Math.cos(a)*14, by+Math.sin(a)*14); g.lineTo(bx+3, by+2); g.closePath();
          });
        }
      }
      if (hairStyle === "pompadour") {
        hairClip(0.35);
        fillStroke(INK, ()=>{
          g.moveTo(cx+faceOff-headRx, headTop+headRy*0.3);
          g.quadraticCurveTo(cx+faceOff, headTop-headRy*0.7, cx+faceOff+headRx*0.5, headTop-headRy*0.4);
          g.quadraticCurveTo(cx+faceOff+headRx+4, headTop, cx+faceOff+headRx, headTop+headRy*0.3);
          g.closePath();
        });
      }
      if (hairStyle === "bun") { hairClip(0.5); hairDome(3); fillStroke(INK, ()=>{ g.arc(cx+faceOff, headTop-4, 11, 0, Math.PI*2); }); }
      if (hairStyle === "ponytail") {
        hairClip(0.5); hairDome(3);
        fill(INK, ()=>{
          g.moveTo(cx+faceOff-headRx, headCy-headRy*0.3);
          g.quadraticCurveTo(cx+faceOff-headRx-18, headCy, cx+faceOff-headRx-10, headCy+headRy);
          g.closePath();
        });
      }
      if (hairStyle === "cap") {
        fillStroke(INK, ()=>{ g.ellipse(cx+faceOff, headCy-headRy*0.3, headRx+3, headRy*0.7, 0, Math.PI, Math.PI*2); });
        fillStroke(INK, ()=>{ g.rect(cx+faceOff-headRx-2, headCy-headRy*0.36, headRx*2+14, 6); });
      }
      if (hairStyle === "beanie") {
        fillStroke(INK, ()=>{ g.ellipse(cx+faceOff, headCy-headRy*0.25, headRx+3, headRy*0.8, 0, Math.PI, Math.PI*2); });
        fillStroke(INK, ()=>{ g.rect(cx+faceOff-headRx-2, headCy-headRy*0.33, headRx*2+4, 8); });
      }

      // ─── BEARD ───
      if (hasBeard && beardStyle !== "mustache") {
        g.save(); g.beginPath(); g.ellipse(cx+faceOff, headCy, headRx+1.5, headRy+1.5, 0, 0, Math.PI*2); g.clip();
        if (beardStyle === "full") fill(INK, ()=>{ g.rect(cx+faceOff-headRx-5, headCy+headRy*0.15, headRx*2+10, headRy); });
        else if (beardStyle === "goatee") fill(INK, ()=>{ g.ellipse(cx+faceOff+headRx*0.3, headCy+headRy*0.55, 10, 14, 0, 0, Math.PI*2); });
        else if (beardStyle === "chinstrap") stroke(()=>{ g.moveTo(cx+faceOff-headRx*0.5, headCy+headRy*0.3); g.quadraticCurveTo(cx+faceOff, headCy+headRy*0.9, cx+faceOff+headRx*0.7, headCy+headRy*0.3); });
        g.restore();
      }

      // ─── FACE FEATURES (HAND-DRAWN EXPRESSIONS) ───
      const eyeX = cx + faceOff + headRx*0.32;
      const eyeY = headCy - headRy*0.05;

      // Eyes
      if (eyeStyle === "open") {
        fill(INK, ()=>{ g.ellipse(eyeX, eyeY, 3.2, 3.8, 0, 0, Math.PI*2); });
      } else {
        stroke(()=>{ g.arc(eyeX, eyeY+1, 3.2, Math.PI*1.1, Math.PI*1.9); });
      }
      // Sideward glance perspective eye
      if (ch(0.65)) fill(INK, ()=>{ g.ellipse(cx+faceOff-headRx*0.1, eyeY, 2.2, 2.8, 0, 0, Math.PI*2); });

      // Hand-Drawn Nose
      stroke(()=>{
        g.moveTo(cx+faceOff+headRx*0.5, headCy-headRy*0.02);
        g.quadraticCurveTo(cx+faceOff+headRx*1.1, headCy+headRy*0.15, cx+faceOff+headRx*0.48, headCy+headRy*0.28);
      });

      // Mouth
      const mouthY = headCy + headRy*0.45;
      if (mouthType === "smile") stroke(()=>{ g.arc(eyeX-2, mouthY-2, 6, Math.PI*0.1, Math.PI*0.7); });
      else if (mouthType === "neutral") stroke(()=>{ g.moveTo(eyeX-6, mouthY); g.lineTo(eyeX+4, mouthY); });
      else if (mouthType === "open") fillStroke(INK, ()=>{ g.ellipse(eyeX-1, mouthY, 5, 3.2, 0, 0, Math.PI*2); });
      else if (mouthType === "teeth") {
        // Distinct grid-smile teeth from the image
        fillStroke(WHITE, ()=>{ g.rect(eyeX-5, mouthY-3, 10, 6, 2); });
        stroke(()=>{ g.moveTo(eyeX, mouthY-3); g.lineTo(eyeX, mouthY+3); });
      }

      if (hasMustache) {
        fill(INK, ()=>{ g.ellipse(eyeX-3, mouthY-4, 6, 2.8, 0, 0, Math.PI*2); });
      }

      // Glasses
      if (hasGlasses) {
        g.strokeStyle = INK; g.lineWidth = 2.6;
        if (glassStyle === "round") {
          g.beginPath(); g.arc(eyeX, eyeY, 9, 0, Math.PI*2); g.stroke();
          g.beginPath(); g.moveTo(eyeX-9, eyeY); g.lineTo(cx-headRx+2, eyeY); g.stroke();
        } else if (glassStyle === "square") {
          g.strokeRect(eyeX-9, eyeY-7, 18, 14);
          g.beginPath(); g.moveTo(eyeX-9, eyeY); g.lineTo(cx-headRx+2, eyeY); g.stroke();
        } else if (glassStyle === "sunglasses") {
          fillStroke(INK, ()=>{ g.ellipse(eyeX, eyeY, 10, 8, 0, 0, Math.PI*2); });
          g.beginPath(); g.moveTo(eyeX-10, eyeY); g.lineTo(cx-headRx+2, eyeY); g.stroke();
        }
      }

      // Outer facial line reinforcement
      g.strokeStyle = INK; g.lineWidth = lw;
      g.beginPath();
      g.ellipse(cx+faceOff, headCy, headRx, headRy, 0, 0, Math.PI*2);
      g.stroke();

      // Phone (Front-and-center detail)
      if (hasPhone) {
        const phoneX = cx + bodyW*0.22;
        const phoneY = shoulderY + 22;
        fillStroke(INK, ()=>{ g.roundRect(phoneX, phoneY, 18, 28, 4); });
        fill(WHITE, ()=>{ g.roundRect(phoneX+2, phoneY+2, 14, 20, 2); });
        fillStroke(WHITE, ()=>{ g.ellipse(phoneX+9, phoneY+29, 9, 8, 0, 0, Math.PI*2); });
      }

      return c;
    }

    /* ════════════════════════════════════════
       PEEP CONTROLLER & CLASS
       ════════════════════════════════════════ */
    class Peep {
      constructor(sprite) {
        this.image = sprite;
        this.width = W;
        this.height = H;
        this.x = 0; this.y = 0;
        this.anchorY = 0; this.scaleX = 1;
        this.scaleMultiplier = 1; 
        this.walk = null;
      }
      render(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.scale(this.scaleX * this.scaleMultiplier, this.scaleMultiplier);
        ctx.drawImage(this.image, 0, 0, this.image.width, this.image.height, 0, 0, W, H);
        ctx.restore();
      }
    }

    /* ════════════════════════════════════════
       CROWD ENGINE
       ════════════════════════════════════════ */
    const canvas = document.getElementById("crowdCanvas");
    const ctx = canvas.getContext("2d");
    
    // Population Count
    const COUNT = 320; 

    const stage = { width: 0, height: 0 };
    let dpr = window.devicePixelRatio || 1;

    const allPeeps = [], availablePeeps = [], crowd = [];

    // Realistic scale multiplier mapped directly to layer depth
    const resetPeep = ({ stage, peep }) => {
      const dir = Math.random() > 0.5 ? 1 : -1;
      
      // Strict perspective placement distribution
      const depth = Math.pow(Math.random(), 1.5); 

      peep.scaleMultiplier = 0.5 + depth * 1.2; // Back row 0.5x, Front row 1.7x (Huge and detailed)

      const horizonOffset = -140; 
      const startY = stage.height - (H * peep.scaleMultiplier) + (1 - depth) * horizonOffset + rr(-8, 8);
      
      let startX, endX;
      const margin = W * peep.scaleMultiplier;
      
      if (dir === 1) {
        startX = -margin;
        endX = stage.width + margin;
        peep.scaleX = 1;
      } else {
        startX = stage.width + margin;
        endX = -margin;
        peep.scaleX = -1;
      }

      peep.x = startX;
      peep.y = startY;
      peep.anchorY = startY;

      return { startX, startY, endX, depth };
    };

    const createWalkTimeline = ({ peep, props }) => {
      const { startY, endX, depth } = props;
      
      // Deeper characters move slower to emphasize parallax
      const baseDuration = 10;
      const xDuration = baseDuration + (1 - depth) * 11; 
      const yDuration = 0.23 + (1 - depth) * 0.12; 

      const tl = gsap.timeline();
      tl.timeScale(rr(0.45, 1.35));

      tl.to(peep, {
        duration: xDuration,
        x: endX,
        ease: "none"
      }, 0);

      tl.to(peep, {
        duration: yDuration,
        repeat: xDuration / yDuration,
        yoyo: true,
        y: startY - (8 * peep.scaleMultiplier), 
        ease: "power1.inOut"
      }, 0);

      return tl;
    };

    function addPeep() {
      if (!availablePeeps.length) return null;
      const peep = removeRandom(availablePeeps);
      const props = resetPeep({ stage, peep });
      
      peep.walk = createWalkTimeline({ peep, props })
        .eventCallback("onComplete", () => {
          removePeep(peep);
          addPeep();
        });

      crowd.push(peep);
      crowd.sort((a, b) => a.anchorY - b.anchorY);
      return peep;
    }

    function removePeep(peep) {
      const i = crowd.indexOf(peep);
      if (i !== -1) crowd.splice(i, 1);
      availablePeeps.push(peep);
    }

    function initCrowd() {
      while (availablePeeps.length) {
        const p = addPeep();
        if (p && p.walk) {
          p.walk.progress(Math.random());
        }
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.scale(dpr, dpr);

      crowd.forEach(p => p.render(ctx));

      // White gradient blend at the horizon
      const grad = ctx.createLinearGradient(0, 0, 0, stage.height * 0.55);
      grad.addColorStop(0, "rgba(255,255,255,1)");
      grad.addColorStop(0.2, "rgba(255,255,255,0.9)");
      grad.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, stage.width, stage.height * 0.55);

      ctx.restore();
    }

    function resize() {
      dpr = window.devicePixelRatio || 1;
      stage.width = canvas.clientWidth;
      stage.height = canvas.clientHeight;
      canvas.width = stage.width * dpr;
      canvas.height = stage.height * dpr;

      crowd.forEach(p => p.walk && p.walk.kill());
      crowd.length = 0;
      availablePeeps.length = 0;
      availablePeeps.push(...allPeeps);

      initCrowd();
      render();
    }

    // Cache procedural vectors to sprites once on load
    for (let i = 0; i < COUNT; i++) {
      allPeeps.push(new Peep(drawPeep()));
    }

    resize();
    gsap.ticker.add(render);
    window.addEventListener("resize", resize);
  })();
  </script>
</body>
</html>
