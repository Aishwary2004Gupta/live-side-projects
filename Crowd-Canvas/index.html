<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Endless Crowd Canvas — Open Peeps Style</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fff;
    }
    .page {
      position: relative;
      width: 100vw; height: 100vh;
      overflow: hidden; background: #fff;
    }
    .heading {
      position: absolute; top: 4.5rem; left: 50%;
      transform: translateX(-50%);
      display: grid; place-items: center; gap: 1.5rem;
      text-align: center; z-index: 10;
      pointer-events: none;
    }
    .heading span {
      position: relative; max-width: 15ch;
      font-size: 11px; line-height: 1.2;
      text-transform: uppercase; letter-spacing: 0.15em; opacity: 0.4;
      font-weight: 600;
    }
    .heading span::after {
      content: ""; position: absolute; top: 100%; left: 50%;
      width: 1px; height: 3rem;
      background: linear-gradient(to bottom, rgba(0,0,0,0.4), rgba(0,0,0,0));
      margin-top: 8px;
    }
    #crowdCanvas {
      position: absolute; left: 0; top: 0;
      width: 100%; height: 100%;
      display: block; pointer-events: none;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="heading"><span>Crowd Canvas</span></div>
    <canvas id="crowdCanvas"></canvas>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
  (function() {
    const rr = (a,b) => a + Math.random()*(b-a);
    const ri = (a,b) => (rr(a,b))|0;
    const pick = a => a[(Math.random()*a.length)|0];
    const ch = p => Math.random()<p;
    const removeAt = (a,i) => a.splice(i,1)[0];
    const removeRandom = a => removeAt(a,(Math.random()*a.length)|0);

    const INK   = "#111111";
    const WHITE = "#ffffff";
    const LIGHT = "#f3f3f3";
    const FILLS = [INK, WHITE, LIGHT, LIGHT, WHITE]; 

    // Base dimensions for the off-screen vector cache
    const W = 130, H = 210, S = 2;

    /* ════════════════════════════════════════
       PROCEDURAL CHARACTER GENERATOR (Open Peeps Vector Style)
       ════════════════════════════════════════ */
    function drawPeep() {
      const c = document.createElement("canvas");
      c.width = W*S; c.height = H*S;
      const g = c.getContext("2d");
      g.scale(S,S);
      g.lineCap = "round"; g.lineJoin = "round";

      const lw = 2.5;
      const cx = 65;
      const headRx = rr(18,24);
      const headRy = rr(21,27);
      const headCy = 58;
      const headTop = headCy - headRy;
      const shoulderY = headCy + headRy + rr(5,12);
      const bodyW = rr(50,70);
      const bodyL = cx - bodyW/2;
      const bodyR = cx + bodyW/2;
      const shirtFill = pick(FILLS);
      const isDark = shirtFill === INK;

      const faceOff = headRx * 0.12;

      const hairStyle = pick([
        "short","buzz","fringe","long","afro","curly","curly",
        "bun","ponytail","bangs","spiky","wavy","pompadour",
        "cap","beanie","headband","hoodie","bald","hijab",
        "braids","mohawk","mullet","sidepart"
      ]);
      const hasGlasses  = ch(0.35);
      const glassStyle  = pick(["round","round","square","sunglasses","cat"]);
      const hasBeard    = ch(0.25);
      const beardStyle  = pick(["full","goatee","stubble","mustache","chinstrap"]);
      const hasMustache = hasBeard && (beardStyle==="mustache" || beardStyle==="full" || ch(0.3));
      const hasStripes  = !isDark && ch(0.2);
      const hasDots     = !isDark && ch(0.1);
      const hasCollar   = ch(0.35);
      const hasTie      = hasCollar && ch(0.15);
      const hasHoodie   = hairStyle === "hoodie" || (!hasCollar && ch(0.15));
      const hasPhone    = ch(0.15);
      const hasHeadphones = ch(0.1);
      const hasScarf    = ch(0.08) && !hasCollar;
      const faceShape   = pick(["oval","round","square","long"]);
      const eyeStyle    = pick(["open","open","open","closed","wink"]);
      const mouthType   = pick(["smile","smile","neutral","open","smirk","teeth"]);
      const earSide     = ch(0.5);

      const stroke = (fn) => { g.strokeStyle=INK; g.lineWidth=lw; g.beginPath(); fn(); g.stroke(); };
      const fill   = (color, fn) => { g.fillStyle=color; g.beginPath(); fn(); g.fill(); };
      const fillStroke = (color, fn) => {
        g.fillStyle=color; g.strokeStyle=INK; g.lineWidth=lw;
        g.beginPath(); fn(); g.fill(); g.stroke();
      };

      // ─── HIJAB (behind head & torso) ───
      if (hairStyle === "hijab") {
        fillStroke(INK, ()=>{
          g.moveTo(bodyL-6, shoulderY+15);
          g.quadraticCurveTo(bodyL-12, headTop-20, cx, headTop-18);
          g.quadraticCurveTo(bodyR+12, headTop-20, bodyR+6, shoulderY+15);
          g.lineTo(bodyR+6, H);
          g.lineTo(bodyL-6, H);
          g.closePath();
        });
        fill(WHITE, ()=>{
          g.ellipse(cx+faceOff, headCy, headRx*0.85, headRy*0.9, 0, 0, Math.PI*2);
        });
        stroke(()=>{
          g.ellipse(cx+faceOff, headCy, headRx*0.85, headRy*0.9, 0, 0, Math.PI*2);
        });
      }

      // ─── LONG HAIR / AFRO / CURLY background hair ───
      if (hairStyle === "long") {
        fill(INK, ()=>{ g.ellipse(cx+faceOff, headCy+headRy*0.5, headRx+10, headRy*1.8, 0, 0, Math.PI*2); });
      }
      if (hairStyle === "afro") {
        fillStroke(INK, ()=>{ g.ellipse(cx+faceOff, headCy-headRy*0.3, headRx*1.5, headRy*1.3, 0, 0, Math.PI*2); });
      }
      if (hairStyle === "curly") {
        fill(INK, ()=>{ g.ellipse(cx+faceOff, headCy-headRy*0.1, headRx+8, headRy+6, 0, 0, Math.PI*2); });
        for (let a = 0; a < Math.PI*2; a += 0.5) {
          const r = headRx + 6 + rr(2,5);
          fill(INK, ()=>{ g.arc(cx+faceOff+Math.cos(a)*r, headCy-headRy*0.1+Math.sin(a)*r, rr(3,6), 0, Math.PI*2); });
        }
      }
      if (hairStyle === "hoodie") {
        fill(INK, ()=>{
          g.moveTo(bodyL-4, H); g.lineTo(bodyL-4, headTop-10);
          g.quadraticCurveTo(cx, headTop-18, bodyR+4, headTop-10);
          g.lineTo(bodyR+4, H); g.closePath();
        });
      }
      if (hairStyle === "braids") {
        fill(INK, ()=>{ g.ellipse(cx+faceOff, headCy-headRy*0.2, headRx+5, headRy+3, 0, 0, Math.PI*2); });
        for (let i = 0; i < 4; i++) {
          const bx = cx + faceOff - headRx*0.5 + i*(headRx/3);
          fillStroke(INK, ()=>{
            g.moveTo(bx, headTop+headRy*0.5);
            g.quadraticCurveTo(bx+rr(-6,6), headCy+headRy*0.6, bx+rr(-8,8), headCy+headRy*1.3);
          });
        }
      }

      // ─── BODY / SHIRT ───
      const rad = 14;
      const drawBaseTorso = ()=>{
        g.moveTo(bodyL, H);
        g.lineTo(bodyL, shoulderY+rad);
        g.quadraticCurveTo(bodyL, shoulderY, bodyL+rad, shoulderY);
        g.lineTo(bodyR-rad, shoulderY);
        g.quadraticCurveTo(bodyR, shoulderY, bodyR, shoulderY+rad);
        g.lineTo(bodyR, H);
        g.closePath();
      };

      if (hasHoodie) {
        fillStroke(shirtFill, ()=>{
          g.moveTo(bodyL-2, H); g.lineTo(bodyL-2, shoulderY+rad+2);
          g.quadraticCurveTo(bodyL-2, shoulderY+1, bodyL+rad, shoulderY+1);
          g.lineTo(bodyR-rad, shoulderY+1);
          g.quadraticCurveTo(bodyR+2, shoulderY+1, bodyR+2, shoulderY+rad+2);
          g.lineTo(bodyR+2, H); g.closePath();
        });
        stroke(()=>{ g.moveTo(cx-12, shoulderY+1); g.quadraticCurveTo(cx, shoulderY+14, cx+12, shoulderY+1); });
      } else {
        fillStroke(shirtFill, drawBaseTorso);
      }

      // Pattern Overlays
      if (hasStripes && !hasHoodie) {
        g.save(); g.beginPath(); drawBaseTorso(); g.clip();
        g.strokeStyle = INK; g.lineWidth = 2.0;
        for (let y = shoulderY+10; y < H; y += 10) {
          g.beginPath(); g.moveTo(bodyL-5, y); g.lineTo(bodyR+5, y); g.stroke();
        }
        g.restore();
        stroke(drawBaseTorso);
      }
      if (hasDots && !hasHoodie) {
        g.save(); g.beginPath(); drawBaseTorso(); g.clip();
        g.fillStyle = INK;
        for (let i = 0; i < 30; i++) {
          g.beginPath(); g.arc(rr(bodyL, bodyR), rr(shoulderY+5, H), rr(1.5, 3), 0, Math.PI*2); g.fill();
        }
        g.restore();
        stroke(drawBaseTorso);
      }

      // Collars / Neckwear
      if (hasCollar && !hasHoodie) {
        stroke(()=>{
          g.moveTo(cx-11, shoulderY); g.lineTo(cx-3, shoulderY+13); g.lineTo(cx, shoulderY+4);
          g.lineTo(cx+3, shoulderY+13); g.lineTo(cx+11, shoulderY);
        });
      }
      if (hasTie) {
        fillStroke(INK, ()=>{
          g.moveTo(cx-4, shoulderY+11); g.lineTo(cx, shoulderY+45); g.lineTo(cx+4, shoulderY+11); g.closePath();
        });
      }
      if (hasScarf) {
        fillStroke(INK, ()=>{
          g.ellipse(cx, shoulderY+5, 18, 8, 0, 0, Math.PI*2);
        });
      }

      // ─── NECK ───
      if (hairStyle !== "hijab") {
        fillStroke(WHITE, ()=>{ g.rect(cx-8, headCy+headRy-8, 16, shoulderY - (headCy+headRy) + 10); });
      }

      // ─── HEAD OVAL ───
      if (hairStyle !== "hijab") {
        fillStroke(WHITE, ()=>{
          if (faceShape === "round") g.ellipse(cx+faceOff, headCy, headRx, headRy, 0, 0, Math.PI*2);
          else if (faceShape === "long") g.ellipse(cx+faceOff, headCy, headRx*0.85, headRy*1.12, 0, 0, Math.PI*2);
          else g.ellipse(cx+faceOff, headCy, headRx, headRy, 0, 0, Math.PI*2);
        });
      }

      // ─── EAR ───
      if (earSide && ["afro","curly","hoodie","hijab"].indexOf(hairStyle) === -1) {
        fillStroke(WHITE, ()=>{ g.ellipse(cx - headRx + 2, headCy + headRy*0.05, 5, 7, 0, 0, Math.PI*2); });
        stroke(()=>{ g.arc(cx - headRx + 2, headCy + headRy*0.05, 2.5, Math.PI*0.3, Math.PI*1.5); });
      }

      // ─── HAIR FOREHEAD OVERLAY ───
      const hairClip = (ratio) => {
        g.save(); g.beginPath();
        g.ellipse(cx+faceOff, headCy, headRx+0.5, headRy+0.5, 0, 0, Math.PI*2); g.clip();
        fill(INK, ()=>{ g.rect(cx+faceOff-headRx-5, headTop-5, headRx*2+10, headRy*ratio+5); });
        g.restore();
      };
      const hairDome = (extra) => {
        fillStroke(INK, ()=>{ g.ellipse(cx+faceOff, headCy, headRx+extra, headRy+extra, 0, Math.PI, Math.PI*2); });
      };

      if (hairStyle === "short") { hairClip(0.45); hairDome(2); }
      if (hairStyle === "buzz")  { hairClip(0.35); hairDome(1.5); }
      if (hairStyle === "fringe") {
        hairClip(0.65); hairDome(2);
        fill(INK, ()=>{
          g.moveTo(cx+faceOff+headRx, headTop+headRy*0.3);
          g.quadraticCurveTo(cx+faceOff, headTop+headRy*0.1, cx+faceOff-headRx, headTop+headRy*0.3);
          g.lineTo(cx+faceOff-headRx, headTop+headRy*0.5);
          g.quadraticCurveTo(cx+faceOff, headTop+headRy*0.15, cx+faceOff+headRx, headTop+headRy*0.15);
          g.closePath();
        });
      }
      if (hairStyle === "bangs") {
        hairClip(0.5); hairDome(2);
        fill(INK, ()=>{ g.rect(cx+faceOff-headRx-2, headTop-2, headRx*2+4, headRy*0.52); });
      }
      if (hairStyle === "long") { hairClip(0.55); hairDome(2); }
      if (hairStyle === "afro" || hairStyle === "curly") { hairClip(0.45); }
      if (hairStyle === "spiky") {
        hairClip(0.3);
        for (let i = 0; i < 6; i++) {
          const a = Math.PI + (Math.PI*(i+0.5))/6;
          const bx = cx+faceOff+Math.cos(a)*(headRx+1);
          const by = headCy+Math.sin(a)*(headRy+1);
          fillStroke(INK, ()=>{
            g.moveTo(bx-3, by+2); g.lineTo(bx+Math.cos(a)*12, by+Math.sin(a)*12); g.lineTo(bx+3, by+2); g.closePath();
          });
        }
      }
      if (hairStyle === "pompadour") {
        hairClip(0.35);
        fillStroke(INK, ()=>{
          g.moveTo(cx+faceOff-headRx, headTop+headRy*0.3);
          g.quadraticCurveTo(cx+faceOff, headTop-headRy*0.7, cx+faceOff+headRx*0.5, headTop-headRy*0.4);
          g.quadraticCurveTo(cx+faceOff+headRx+4, headTop, cx+faceOff+headRx, headTop+headRy*0.3);
          g.closePath();
        });
      }
      if (hairStyle === "bun") { hairClip(0.5); hairDome(2); fillStroke(INK, ()=>{ g.arc(cx+faceOff, headTop-4, 9, 0, Math.PI*2); }); }
      if (hairStyle === "ponytail") {
        hairClip(0.5); hairDome(2);
        fill(INK, ()=>{
          g.moveTo(cx+faceOff-headRx, headCy-headRy*0.3);
          g.quadraticCurveTo(cx+faceOff-headRx-18, headCy, cx+faceOff-headRx-10, headCy+headRy);
          g.closePath();
        });
      }
      if (hairStyle === "cap") {
        fillStroke(INK, ()=>{ g.ellipse(cx+faceOff, headCy-headRy*0.3, headRx+2, headRy*0.7, 0, Math.PI, Math.PI*2); });
        fillStroke(INK, ()=>{ g.rect(cx+faceOff-headRx-2, headCy-headRy*0.36, headRx*2+14, 5); });
      }
      if (hairStyle === "beanie") {
        fillStroke(INK, ()=>{ g.ellipse(cx+faceOff, headCy-headRy*0.25, headRx+2, headRy*0.8, 0, Math.PI, Math.PI*2); });
        fillStroke(INK, ()=>{ g.rect(cx+faceOff-headRx-2, headCy-headRy*0.33, headRx*2+4, 7); });
      }

      // ─── BEARD ───
      if (hasBeard && beardStyle !== "mustache" && hairStyle !== "hijab") {
        g.save(); g.beginPath(); g.ellipse(cx+faceOff, headCy, headRx+1.5, headRy+1.5, 0, 0, Math.PI*2); g.clip();
        if (beardStyle === "full") fill(INK, ()=>{ g.rect(cx+faceOff-headRx-5, headCy+headRy*0.2, headRx*2+10, headRy); });
        else if (beardStyle === "goatee") fill(INK, ()=>{ g.ellipse(cx+faceOff+headRx*0.3, headCy+headRy*0.55, 8, 12, 0, 0, Math.PI*2); });
        else if (beardStyle === "chinstrap") stroke(()=>{ g.moveTo(cx+faceOff-headRx*0.5, headCy+headRy*0.3); g.quadraticCurveTo(cx+faceOff, headCy+headRy*0.9, cx+faceOff+headRx*0.7, headCy+headRy*0.3); });
        g.restore();
      }

      // ─── EYES, NOSE, MOUTH ───
      if (hairStyle !== "hijab") {
        const eyeX = cx + faceOff + headRx*0.3;
        const eyeY = headCy - headRy*0.05;

        // Eye 1
        if (eyeStyle === "open") {
          fill(INK, ()=>{ g.ellipse(eyeX, eyeY, 2.5, 3.0, 0, 0, Math.PI*2); });
        } else {
          stroke(()=>{ g.arc(eyeX, eyeY+1, 2.5, Math.PI*1.1, Math.PI*1.9); });
        }
        // Eye 2 (partially obscured/perspective)
        if (ch(0.6)) fill(INK, ()=>{ g.ellipse(cx+faceOff-headRx*0.1, eyeY, 1.8, 2.2, 0, 0, Math.PI*2); });

        // Nose
        stroke(()=>{
          g.moveTo(cx+faceOff+headRx*0.5, headCy-headRy*0.02);
          g.quadraticCurveTo(cx+faceOff+headRx, headCy+headRy*0.15, cx+faceOff+headRx*0.48, headCy+headRy*0.25);
        });

        // Mouth
        const mouthY = headCy + headRy*0.42;
        if (mouthType === "smile") stroke(()=>{ g.arc(eyeX-2, mouthY-2, 5, Math.PI*0.1, Math.PI*0.7); });
        else if (mouthType === "neutral") stroke(()=>{ g.moveTo(eyeX-5, mouthY); g.lineTo(eyeX+3, mouthY); });
        else if (mouthType === "open") fillStroke(INK, ()=>{ g.ellipse(eyeX-1, mouthY, 4, 2.5, 0, 0, Math.PI*2); });

        if (hasMustache) {
          fill(INK, ()=>{ g.ellipse(eyeX-3, mouthY-4, 5, 2.2, 0, 0, Math.PI*2); });
        }

        // Glasses
        if (hasGlasses) {
          g.strokeStyle = INK; g.lineWidth = 2.0;
          if (glassStyle === "round") {
            g.beginPath(); g.arc(eyeX, eyeY, 8, 0, Math.PI*2); g.stroke();
            g.beginPath(); g.moveTo(eyeX-8, eyeY); g.lineTo(cx-headRx+2, eyeY); g.stroke();
          } else if (glassStyle === "square") {
            g.strokeRect(eyeX-8, eyeY-7, 15, 13);
            g.beginPath(); g.moveTo(eyeX-8, eyeY); g.lineTo(cx-headRx+2, eyeY); g.stroke();
          } else if (glassStyle === "sunglasses") {
            fillStroke(INK, ()=>{ g.ellipse(eyeX, eyeY, 9, 7, 0, 0, Math.PI*2); });
            g.beginPath(); g.moveTo(eyeX-9, eyeY); g.lineTo(cx-headRx+2, eyeY); g.stroke();
          }
        }
      }

      // Redraw facial outline to overlay cleanly
      if (hairStyle !== "hijab") {
        g.strokeStyle = INK; g.lineWidth = lw;
        g.beginPath();
        g.ellipse(cx+faceOff, headCy, headRx, headRy, 0, 0, Math.PI*2);
        g.stroke();
      }

      // Headphones
      if (hasHeadphones && hairStyle !== "hijab") {
        g.strokeStyle = INK; g.lineWidth = 3.5;
        g.beginPath(); g.ellipse(cx+faceOff, headCy, headRx+5, headRy+5, 0, Math.PI*1.05, Math.PI*1.95); g.stroke();
        fillStroke(INK, ()=>{ g.roundRect(cx+faceOff-headRx-5, headCy-3, 10, 15, 4); });
      }

      // Phone
      if (hasPhone) {
        const phoneX = cx + bodyW*0.25;
        const phoneY = shoulderY + 25;
        fillStroke(INK, ()=>{ g.roundRect(phoneX, phoneY, 16, 26, 3); });
        fill(WHITE, ()=>{ g.roundRect(phoneX+1.5, phoneY+2, 13, 18, 2); });
        fillStroke(WHITE, ()=>{ g.ellipse(phoneX+8, phoneY+27, 8, 7, 0, 0, Math.PI*2); });
      }

      return c;
    }

    /* ════════════════════════════════════════
       PEEP CONTROLLER & CLASS
       ════════════════════════════════════════ */
    class Peep {
      constructor(sprite) {
        this.image = sprite;
        this.width = W;
        this.height = H;
        this.x = 0; this.y = 0;
        this.anchorY = 0; this.scaleX = 1;
        this.scaleMultiplier = 1; 
        this.walk = null;
      }
      render(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.scale(this.scaleX * this.scaleMultiplier, this.scaleMultiplier);
        ctx.drawImage(this.image, 0, 0, this.image.width, this.image.height, 0, 0, W, H);
        ctx.restore();
      }
    }

    /* ════════════════════════════════════════
       CROWD ENGINE
       ════════════════════════════════════════ */
    const canvas = document.getElementById("crowdCanvas");
    const ctx = canvas.getContext("2d");
    
    // Massive population size
    const COUNT = 380; 

    const stage = { width: 0, height: 0 };
    let dpr = window.devicePixelRatio || 1;

    const allPeeps = [], availablePeeps = [], crowd = [];

    // Scale characters based strictly on depth (Y position)
    const resetPeep = ({ stage, peep }) => {
      const dir = Math.random() > 0.5 ? 1 : -1;
      
      // Depth parameter (0.0 = deep background, 1.0 = immediate foreground)
      const depth = Math.pow(Math.random(), 1.6); 

      // Connect spatial scale strictly to depth
      peep.scaleMultiplier = 0.45 + depth * 1.35; // Back row is 0.45x, Front row is 1.8x (HUGE)

      // Background characters sit higher up on screen; foreground sit lower
      const horizonOffset = -180; // Pulls back row higher up the screen
      const startY = stage.height - (H * peep.scaleMultiplier) + (1 - depth) * horizonOffset + rr(-10, 10);
      
      let startX, endX;
      const margin = W * peep.scaleMultiplier;
      
      if (dir === 1) {
        startX = -margin;
        endX = stage.width + margin;
        peep.scaleX = 1;
      } else {
        startX = stage.width + margin;
        endX = -margin;
        peep.scaleX = -1;
      }

      peep.x = startX;
      peep.y = startY;
      peep.anchorY = startY;

      return { startX, startY, endX, depth };
    };

    const createWalkTimeline = ({ peep, props }) => {
      const { startY, endX, depth } = props;
      
      // Background people move slower to reinforce perspective parallax
      const baseDuration = 11;
      const xDuration = baseDuration + (1 - depth) * 12; 
      const yDuration = 0.22 + (1 - depth) * 0.1; // Slower vertical bobbing in background

      const tl = gsap.timeline();
      tl.timeScale(rr(0.5, 1.4));

      // Constant horizontal stroll
      tl.to(peep, {
        duration: xDuration,
        x: endX,
        ease: "none"
      }, 0);

      // Walk bobbing motion
      tl.to(peep, {
        duration: yDuration,
        repeat: xDuration / yDuration,
        yoyo: true,
        y: startY - (6 * peep.scaleMultiplier), 
        ease: "power1.inOut"
      }, 0);

      return tl;
    };

    function addPeep() {
      if (!availablePeeps.length) return null;
      const peep = removeRandom(availablePeeps);
      const props = resetPeep({ stage, peep });
      
      peep.walk = createWalkTimeline({ peep, props })
        .eventCallback("onComplete", () => {
          removePeep(peep);
          addPeep();
        });

      crowd.push(peep);
      // Sort array so that lower y coordinates (background) render first
      crowd.sort((a, b) => a.anchorY - b.anchorY);
      return peep;
    }

    function removePeep(peep) {
      const i = crowd.indexOf(peep);
      if (i !== -1) crowd.splice(i, 1);
      availablePeeps.push(peep);
    }

    function initCrowd() {
      while (availablePeeps.length) {
        const p = addPeep();
        if (p && p.walk) {
          // Stagger timeline offsets so peeps are distributed across the screen immediately
          p.walk.progress(Math.random());
        }
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.scale(dpr, dpr);

      // Render the depth-sorted crowd
      crowd.forEach(p => p.render(ctx));

      // Draw artistic horizon gradient fade so back row merges into the white background cleanly
      const grad = ctx.createLinearGradient(0, 0, 0, stage.height * 0.45);
      grad.addColorStop(0, "rgba(255,255,255,1)");
      grad.addColorStop(0.3, "rgba(255,255,255,0.85)");
      grad.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, stage.width, stage.height * 0.45);

      ctx.restore();
    }

    function resize() {
      dpr = window.devicePixelRatio || 1;
      stage.width = canvas.clientWidth;
      stage.height = canvas.clientHeight;
      canvas.width = stage.width * dpr;
      canvas.height = stage.height * dpr;

      crowd.forEach(p => p.walk && p.walk.kill());
      crowd.length = 0;
      availablePeeps.length = 0;
      availablePeeps.push(...allPeeps);

      initCrowd();
      render();
    }

    // Build standard procedural sprite pool once to maintain peak performance (cache-to-draw method)
    for (let i = 0; i < COUNT; i++) {
      allPeeps.push(new Peep(drawPeep()));
    }

    resize();
    gsap.ticker.add(render);
    window.addEventListener("resize", resize);
  })();
  </script>
</body>
</html>
