<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crowd Canvas — Procedural Peeps</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: #000;
    }

    .page {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #fff;
    }

    .heading {
      position: absolute;
      top: 5.5rem;
      left: 50%;
      transform: translateX(-50%);
      display: grid;
      place-items: center;
      gap: 1.5rem;
      text-align: center;
      z-index: 2;
    }

    .heading span {
      position: relative;
      max-width: 12ch;
      font-size: 12px;
      line-height: 1.1;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      opacity: 0.4;
    }

    .heading span::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      width: 1px;
      height: 4rem;
      background: linear-gradient(to bottom, #fff, #000);
    }

    .canvas-wrap {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100%;
    }

    #crowdCanvas {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 90vh;
      display: block;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="heading">
      <span>Croud Canvas</span>
    </div>

    <div class="canvas-wrap">
      <canvas id="crowdCanvas" data-count="105"></canvas>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <script>
    /* ============================================================
       UTILS
    ============================================================ */
    const rr = (min, max) => min + Math.random() * (max - min);
    const pick = (arr) => arr[(Math.random() * arr.length) | 0];
    const chance = (p) => Math.random() < p;

    const randomIndex = (array) => rr(0, array.length) | 0;
    const removeFromArray = (array, i) => array.splice(i, 1)[0];
    const removeItemFromArray = (array, item) => {
      const i = array.indexOf(item);
      if (i !== -1) return removeFromArray(array, i);
    };
    const removeRandomFromArray = (array) =>
      removeFromArray(array, randomIndex(array));
    const getRandomFromArray = (array) => array[randomIndex(array)];

    /* ============================================================
       PALETTES
    ============================================================ */
    const SKIN = ["#8d5524", "#c68642", "#e0ac69", "#f1c27d", "#ffdbac", "#6b4423", "#a9714b"];
    const HAIR = ["#0b0a08", "#2c222b", "#4a312c", "#71635a", "#a56b46", "#b55239",
                  "#b7a69e", "#d6c4c2", "#e6cea8", "#fff5e1", "#9b6a97", "#3d5a80"];
    const CLOTH = ["#ef476f", "#ffd166", "#06d6a0", "#118ab2", "#073b4c", "#8338ec",
                   "#fb5607", "#3a86ff", "#ff006e", "#2ec4b6", "#e76f51", "#606c38",
                   "#588157", "#bc4749", "#f4a261", "#264653"];
    const INK = "#1b1b1b";

    /* ============================================================
       PROCEDURAL CHARACTER SPRITE (pure code, no images)
       Character faces RIGHT; flipping is done with scaleX.
    ============================================================ */
    const BASE_W = 110;
    const BASE_H = 150;
    const SPR = 2; // sprite supersampling for crisp rendering

    function darken(hex, amt) {
      const n = parseInt(hex.slice(1), 16);
      let r = (n >> 16) - amt, g = ((n >> 8) & 255) - amt, b = (n & 255) - amt;
      r = Math.max(0, r); g = Math.max(0, g); b = Math.max(0, b);
      return "rgb(" + r + "," + g + "," + b + ")";
    }

    function createCharacterSprite() {
      const c = document.createElement("canvas");
      c.width = BASE_W * SPR;
      c.height = BASE_H * SPR;
      const g = c.getContext("2d");
      g.scale(SPR, SPR);
      g.lineCap = "round";
      g.lineJoin = "round";

      // ---- random DNA ----
      const skin = pick(SKIN);
      const hair = pick(HAIR);
      const shirt = pick(CLOTH);
      const cx = 55;
      const headRx = rr(16, 22);
      const headRy = rr(20, 26);
      const headCy = 58;
      const headTop = headCy - headRy;
      const bodyW = rr(44, 66);
      const shoulderY = 95;
      const style = pick(["buzz", "buzz", "fringe", "afro", "spiky", "bun",
                          "long", "cap", "beanie", "bald", "headphones"]);
      const hasGlasses = chance(0.28);
      const hasBeard = chance(0.22);
      const hasStripes = chance(0.3);
      const capColor = pick(CLOTH);

      /* ---------- LONG HAIR (drawn behind everything) ---------- */
      if (style === "long") {
        g.fillStyle = hair;
        g.beginPath();
        g.ellipse(cx, headCy + headRy * 0.65, headRx + 8, headRy * 1.75, 0, 0, Math.PI * 2);
        g.fill();
      }

      /* ---------- BODY ---------- */
      const r = 14;
      g.fillStyle = shirt;
      g.beginPath();
      g.moveTo(cx - bodyW / 2, BASE_H);
      g.lineTo(cx - bodyW / 2, shoulderY + r);
      g.quadraticCurveTo(cx - bodyW / 2, shoulderY, cx - bodyW / 2 + r, shoulderY);
      g.lineTo(cx + bodyW / 2 - r, shoulderY);
      g.quadraticCurveTo(cx + bodyW / 2, shoulderY, cx + bodyW / 2, shoulderY + r);
      g.lineTo(cx + bodyW / 2, BASE_H);
      g.closePath();
      g.fill();

      if (hasStripes) {
        g.save();
        g.clip(); // clip to body path
        g.fillStyle = "rgba(255,255,255,0.55)";
        for (let y = shoulderY + 12; y < BASE_H; y += 16) {
          g.fillRect(cx - bodyW, y, bodyW * 2, 6);
        }
        g.restore();
      }

      /* ---------- NECK ---------- */
      g.fillStyle = skin;
      g.fillRect(cx - 7, headCy + headRy - 8, 14, (shoulderY + 4) - (headCy + headRy - 8));

      /* ---------- AFRO (behind head) ---------- */
      if (style === "afro") {
        g.fillStyle = hair;
        g.beginPath();
        g.arc(cx, headCy - headRy * 0.5, headRx * 1.45, 0, Math.PI * 2);
        g.fill();
      }

      /* ---------- HEAD ---------- */
      g.fillStyle = skin;
      g.beginPath();
      g.ellipse(cx, headCy, headRx, headRy, 0, 0, Math.PI * 2);
      g.fill();

      /* ---------- EAR ---------- */
      g.fillStyle = darken(skin, 14);
      g.beginPath();
      g.arc(cx - headRx * 0.35, headCy + headRy * 0.08, 4.2, 0, Math.PI * 2);
      g.fill();

      /* ---------- HAIR STYLES (on top of head) ---------- */
      const fringe = (hRatio) => {
        g.save();
        g.beginPath();
        g.ellipse(cx, headCy, headRx + 1, headRy + 1, 0, 0, Math.PI * 2);
        g.clip();
        g.fillStyle = hair;
        g.fillRect(cx - headRx - 3, headTop - 4, headRx * 2 + 6, headRy * hRatio + 4);
        g.restore();
        // dome slightly bigger than head
        g.fillStyle = hair;
        g.beginPath();
        g.ellipse(cx, headCy, headRx + 2, headRy + 2, 0, Math.PI, Math.PI * 2);
        g.fill();
      };

      if (style === "buzz")   fringe(rr(0.45, 0.6));
      if (style === "fringe") fringe(rr(0.75, 0.95));
      if (style === "long")   fringe(rr(0.6, 0.85));
      if (style === "afro")   fringe(0.5);

      if (style === "bun") {
        fringe(0.5);
        g.fillStyle = hair;
        g.beginPath();
        g.arc(cx - headRx * 0.55, headTop - 2, rr(6, 9), 0, Math.PI * 2);
        g.fill();
      }

      if (style === "spiky") {
        fringe(0.4);
        g.fillStyle = hair;
        const n = 5 + (Math.random() * 3 | 0);
        for (let i = 0; i < n; i++) {
          const a = Math.PI + (Math.PI * (i + 0.5)) / n; // along top arc
          const px = cx + Math.cos(a) * (headRx + 1);
          const py = headCy + Math.sin(a) * (headRy + 1);
          const len = rr(7, 14);
          g.beginPath();
          g.moveTo(px - 4, py + 2);
          g.lineTo(px + Math.cos(a) * len, py + Math.sin(a) * len);
          g.lineTo(px + 4, py + 2);
          g.closePath();
          g.fill();
        }
      }

      if (style === "cap") {
        g.fillStyle = capColor;
        g.beginPath();
        g.ellipse(cx, headCy - headRy * 0.45, headRx + 2, headRy * 0.75, 0, Math.PI, Math.PI * 2);
        g.fill();
        // brim (facing right)
        g.beginPath();
        g.roundRect(cx, headCy - headRy * 0.5, headRx + 13, 5, 3);
        g.fill();
      }

      if (style === "beanie") {
        g.fillStyle = capColor;
        g.beginPath();
        g.ellipse(cx, headCy - headRy * 0.35, headRx + 2, headRy * 0.85, 0, Math.PI, Math.PI * 2);
        g.fill();
        g.fillRect(cx - headRx - 2, headCy - headRy * 0.42, headRx * 2 + 4, 7);
        if (chance(0.6)) { // pom pom
          g.beginPath();
          g.arc(cx, headTop - 4, 5, 0, Math.PI * 2);
          g.fill();
        }
      }

      /* ---------- BEARD ---------- */
      if (hasBeard) {
        g.save();
        g.beginPath();
        g.ellipse(cx, headCy, headRx + 1.5, headRy + 1.5, 0, 0, Math.PI * 2);
        g.clip();
        g.fillStyle = hair;
        g.fillRect(cx - headRx - 3, headCy + headRy * 0.32, headRx * 2 + 6, headRy);
        g.restore();
      }

      /* ---------- FACE (facing right) ---------- */
      // eye
      g.fillStyle = INK;
      g.beginPath();
      g.arc(cx + headRx * 0.45, headCy - headRy * 0.08, 2.3, 0, Math.PI * 2);
      g.fill();
      // eyebrow
      g.strokeStyle = INK;
      g.lineWidth = 2;
      g.beginPath();
      g.moveTo(cx + headRx * 0.25, headCy - headRy * 0.34);
      g.lineTo(cx + headRx * 0.62, headCy - headRy * 0.38);
      g.stroke();
      // nose bump
      g.fillStyle = darken(skin, 20);
      g.beginPath();
      g.moveTo(cx + headRx - 2, headCy + headRy * 0.02);
      g.quadraticCurveTo(cx + headRx + 5, headCy + headRy * 0.16, cx + headRx - 2, headCy + headRy * 0.26);
      g.closePath();
      g.fill();
      // mouth
      g.strokeStyle = hasBeard ? "#3a2c26" : INK;
      g.lineWidth = 1.8;
      g.beginPath();
      g.arc(cx + headRx * 0.42, headCy + headRy * 0.42, 4.5, Math.PI * 0.05, Math.PI * 0.6);
      g.stroke();
      // blush
      if (chance(0.35) && !hasBeard) {
        g.fillStyle = "rgba(240,110,110,0.35)";
        g.beginPath();
        g.arc(cx + headRx * 0.28, headCy + headRy * 0.28, 3.5, 0, Math.PI * 2);
        g.fill();
      }

      /* ---------- GLASSES ---------- */
      if (hasGlasses) {
        g.strokeStyle = INK;
        g.lineWidth = 2;
        g.beginPath();
        g.arc(cx + headRx * 0.45, headCy - headRy * 0.08, 6.5, 0, Math.PI * 2);
        g.stroke();
        g.beginPath();
        g.moveTo(cx + headRx * 0.45 - 6.5, headCy - headRy * 0.12);
        g.lineTo(cx - headRx * 0.35, headCy - headRy * 0.12);
        g.stroke();
      }

      /* ---------- HEADPHONES ---------- */
      if (style === "headphones") {
        fringe(0.4);
        g.strokeStyle = INK;
        g.lineWidth = 3.5;
        g.beginPath();
        g.ellipse(cx, headCy, headRx + 4, headRy + 4, 0, Math.PI * 1.05, Math.PI * 1.95);
        g.stroke();
        g.fillStyle = pick(CLOTH);
        g.beginPath();
        g.roundRect(cx - headRx * 0.35 - 5.5, headCy - 4, 10, 14, 4);
        g.fill();
      }

      return c;
    }

    /* ============================================================
       PEEP
    ============================================================ */
    class Peep {
      constructor(sprite) {
        this.image = sprite;
        const s = rr(0.62, 1.05); // size variety = depth feel
        this.width = BASE_W * s;
        this.height = BASE_H * s;
        this.x = 0;
        this.y = 0;
        this.anchorY = 0;
        this.scaleX = 1;
        this.walk = null;
      }
      render(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.scale(this.scaleX, 1);
        ctx.drawImage(
          this.image,
          0, 0, this.image.width, this.image.height,
          0, 0, this.width, this.height
        );
        ctx.restore();
      }
    }

    /* ============================================================
       CROWD ENGINE (same logic as original)
    ============================================================ */
    const canvas = document.getElementById("crowdCanvas");
    const ctx = canvas.getContext("2d");
    const COUNT = Number(canvas.dataset.count) || 105;

    const stage = { width: 0, height: 0 };
    let dpr = window.devicePixelRatio || 1;

    const allPeeps = [];
    const availablePeeps = [];
    const crowd = [];

    const resetPeep = ({ stage, peep }) => {
      const direction = Math.random() > 0.5 ? 1 : -1;
      const offsetY = 100 - 250 * gsap.parseEase("power2.in")(Math.random());
      const startY = stage.height - peep.height + offsetY;
      let startX, endX;

      if (direction === 1) {
        startX = -peep.width;
        endX = stage.width;
        peep.scaleX = 1;
      } else {
        startX = stage.width + peep.width;
        endX = 0;
        peep.scaleX = -1;
      }

      peep.x = startX;
      peep.y = startY;
      peep.anchorY = startY;

      return { startX, startY, endX };
    };

    const normalWalk = ({ peep, props }) => {
      const { startY, endX } = props;
      const xDuration = 10;
      const yDuration = 0.25;

      const tl = gsap.timeline();
      tl.timeScale(rr(0.5, 1.5));
      tl.to(peep, { duration: xDuration, x: endX, ease: "none" }, 0);
      tl.to(peep, {
        duration: yDuration,
        repeat: xDuration / yDuration,
        yoyo: true,
        y: startY - 10,
        ease: "power1.inOut",
      }, 0);

      return tl;
    };

    const walks = [normalWalk];

    function createPeeps() {
      for (let i = 0; i < COUNT; i++) {
        allPeeps.push(new Peep(createCharacterSprite()));
      }
    }

    function addPeepToCrowd() {
      if (!availablePeeps.length) return null;

      const peep = removeRandomFromArray(availablePeeps);

      const walk = getRandomFromArray(walks)({
        peep,
        props: resetPeep({ peep, stage }),
      }).eventCallback("onComplete", () => {
        removePeepFromCrowd(peep);
        addPeepToCrowd();
      });

      peep.walk = walk;
      crowd.push(peep);
      crowd.sort((a, b) => a.anchorY - b.anchorY);

      return peep;
    }

    function removePeepFromCrowd(peep) {
      removeItemFromArray(crowd, peep);
      availablePeeps.push(peep);
    }

    function initCrowd() {
      while (availablePeeps.length) {
        const peep = addPeepToCrowd();
        if (peep && peep.walk) peep.walk.progress(Math.random());
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.scale(dpr, dpr);
      crowd.forEach((peep) => peep.render(ctx));
      ctx.restore();
    }

    function resize() {
      dpr = window.devicePixelRatio || 1;
      stage.width = canvas.clientWidth;
      stage.height = canvas.clientHeight;
      canvas.width = stage.width * dpr;
      canvas.height = stage.height * dpr;

      crowd.forEach((peep) => peep.walk && peep.walk.kill());
      crowd.length = 0;
      availablePeeps.length = 0;
      availablePeeps.push(...allPeeps);

      initCrowd();
      render();
    }

    // no image loading needed — start instantly
    createPeeps();
    resize();
    gsap.ticker.add(render);
    window.addEventListener("resize", resize);
  </script>
</body>
</html>
