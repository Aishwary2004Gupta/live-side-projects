<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procedural Crowd — Open Peeps Style</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fff; overflow: hidden; height: 100vh; }
  .header {
    position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
    font-family: sans-serif; font-size: 12px; letter-spacing: 3px;
    text-transform: uppercase; opacity: 0.4; z-index: 10; text-align: center;
  }
  .header::after {
    content: ''; position: absolute; left: 50%; top: 24px;
    width: 1px; height: 64px;
    background: linear-gradient(to bottom, #fff, #000);
  }
  canvas { position: absolute; bottom: 0; width: 100%; height: 90vh; display: block; }
</style>
</head>
<body>

<div class="header">Crowd Canvas</div>
<canvas id="crowdCanvas"></canvas>

<script>
/* ============================================================
   PART 1 — PROCEDURAL PEEP GENERATOR (Open Peeps style)
   Every character is 100% drawn with code.
   ============================================================ */

const INK = '#111';
const rand   = (a, b) => a + Math.random() * (b - a);
const pick   = arr => arr[Math.floor(Math.random() * arr.length)];
const chance = p => Math.random() < p;

function drawPeep(ctx, w, h) {
  const cx = w / 2;
  const r  = rand(29, 35);            // head radius
  const hy = 74 + rand(-4, 4);        // head center Y

  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = INK;
  ctx.fillStyle = INK;

  // ---- random identity ----
  const style   = pick(['afro','curls','bob','hijab','buns','cap','long','bald','flat','puffs','short']);
  const isHijab = style === 'hijab';
  const beard   = !isHijab && chance(0.28);
  const stache  = !isHijab && !beard && chance(0.20);
  const sunnies = chance(0.08);
  const glasses = !sunnies && chance(0.30);

  /* ---------------- TORSO ---------------- */
  const sw = rand(r * 1.4, r * 1.8);       // shoulder width
  const ty = hy + r + 14;                  // shoulder top
  const torsoPath = () => {
    ctx.beginPath();
    ctx.moveTo(cx - sw, h + 4);
    ctx.lineTo(cx - sw, ty + 20);
    ctx.quadraticCurveTo(cx - sw, ty, cx - sw + 22, ty);
    ctx.lineTo(cx + sw - 22, ty);
    ctx.quadraticCurveTo(cx + sw, ty, cx + sw, ty + 20);
    ctx.lineTo(cx + sw, h + 4);
    ctx.closePath();
  };
  const shirt = pick(['black','black','white','white','stripes','dots']);
  torsoPath();
  if (shirt === 'black') { ctx.fill(); }
  else {
    ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke();
    ctx.save(); torsoPath(); ctx.clip(); ctx.fillStyle = INK;
    if (shirt === 'stripes')
      for (let y = ty + 8; y < h; y += 15) ctx.fillRect(cx - sw, y, sw * 2, 6);
    if (shirt === 'dots')
      for (let i = 0; i < 25; i++) {
        ctx.beginPath();
        ctx.arc(cx - sw + Math.random() * sw * 2, ty + Math.random() * (h - ty), 2.2, 0, 7);
        ctx.fill();
      }
    ctx.restore(); ctx.fillStyle = INK;
  }

  /* ---------------- NECK ---------------- */
  if (!isHijab) {
    ctx.fillStyle = '#fff';
    ctx.fillRect(cx - 9, hy + r - 10, 18, 28);
    ctx.strokeRect(cx - 9, hy + r - 10, 18, 28);
    ctx.fillStyle = INK;
  }

  /* ------------- BACK HAIR (behind head) ------------- */
  if (style === 'afro') {
    ctx.beginPath(); ctx.arc(cx, hy - r * 0.25, r * 1.5, 0, 7); ctx.fill();
    for (let a = 0; a < 6; a++) {                       // curly texture bumps
      const ang = Math.PI * 1.05 + a * (Math.PI * 0.9 / 5);
      ctx.beginPath();
      ctx.arc(cx + Math.cos(ang) * r * 1.4, hy - r * 0.25 + Math.sin(ang) * r * 1.4, r * 0.4, 0, 7);
      ctx.fill();
    }
  }
  if (style === 'bob') {
    ctx.beginPath();
    ctx.roundRect(cx - r * 1.28, hy - r * 1.3, r * 2.56, r * 2.35, [r, r, 14, 14]);
    ctx.fill();
  }
  if (style === 'long') {
    ctx.beginPath();
    ctx.roundRect(cx - r * 1.25, hy - r * 1.28, r * 2.5, r * 2.5 + 45, [r, r, 20, 20]);
    ctx.fill();
  }
  if (style === 'hijab') {
    ctx.beginPath();
    ctx.roundRect(cx - r * 1.35, hy - r * 1.42, r * 2.7, h - (hy - r * 1.42), [r * 1.3, r * 1.3, 0, 0]);
    ctx.fill();
  }

  /* ---------------- HEAD ---------------- */
  let fr = r, fy = hy;                     // face radius / center (smaller if framed by hijab)
  if (isHijab) { fr = r * 0.8; fy = hy + 3; }
  else {
    // ears
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.arc(cx + s * r * 0.95, hy + r * 0.05, r * 0.17, 0, 7);
      ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke();
    }
  }
  ctx.beginPath();
  ctx.ellipse(cx, fy, fr * 0.95, fr, 0, 0, 7);
  ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke();
  ctx.fillStyle = INK;

  /* ---------------- BEARD ---------------- */
  if (beard) {
    ctx.beginPath();
    ctx.arc(cx, fy + 2, fr * 1.0, 0.1 * Math.PI, 0.9 * Math.PI);
    ctx.arc(cx, fy + fr * 0.3, fr * 0.52, 0.88 * Math.PI, 0.12 * Math.PI, true);
    ctx.closePath(); ctx.fill();
  }

  /* ---------------- FACE ---------------- */
  const eyeY = fy - fr * 0.05, eyeDX = fr * 0.4;

  // eyebrows
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.arc(cx + s * eyeDX, eyeY - fr * 0.3, 6, Math.PI * 1.15, Math.PI * 1.85);
    ctx.stroke();
  }
  // eyes
  if (sunnies) {
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(cx + s * eyeDX, eyeY, fr * 0.28, 0, 7); ctx.fill(); }
    ctx.beginPath(); ctx.moveTo(cx - eyeDX + fr * 0.28, eyeY); ctx.lineTo(cx + eyeDX - fr * 0.28, eyeY); ctx.stroke();
  } else {
    if (chance(0.18)) {                                  // happy closed eyes
      for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(cx + s * eyeDX, eyeY + 2, 5, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
    } else {                                             // dot eyes
      for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(cx + s * eyeDX, eyeY, 2.8, 0, 7); ctx.fill(); }
    }
    if (glasses) {
      for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(cx + s * eyeDX, eyeY, fr * 0.27, 0, 7); ctx.stroke(); }
      ctx.beginPath(); ctx.moveTo(cx - eyeDX + fr * 0.27, eyeY); ctx.lineTo(cx + eyeDX - fr * 0.27, eyeY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx - eyeDX - fr * 0.27, eyeY); ctx.lineTo(cx - fr * 0.95, eyeY - 3); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx + eyeDX + fr * 0.27, eyeY); ctx.lineTo(cx + fr * 0.95, eyeY - 3); ctx.stroke();
    }
  }
  // nose
  ctx.beginPath();
  ctx.moveTo(cx - 1, eyeY + fr * 0.18);
  ctx.quadraticCurveTo(cx + 5, eyeY + fr * 0.32, cx - 1, eyeY + fr * 0.38);
  ctx.stroke();

  // mouth
  const my = fy + fr * 0.48;
  const mouth = pick(['smile','smile','grin','neutral','o']);
  if (mouth === 'smile') { ctx.beginPath(); ctx.arc(cx, my - 4, fr * 0.3, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke(); }
  if (mouth === 'grin')  {
    ctx.beginPath(); ctx.arc(cx, my - 2, fr * 0.3, 0, Math.PI); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(cx - fr * 0.18, my - 2, fr * 0.36, 3.5); ctx.fillStyle = INK;
  }
  if (mouth === 'neutral') { ctx.beginPath(); ctx.moveTo(cx - 6, my); ctx.lineTo(cx + 6, my); ctx.stroke(); }
  if (mouth === 'o') { ctx.beginPath(); ctx.arc(cx, my, 3.5, 0, 7); ctx.fill(); }

  // mustache
  if (stache) for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.ellipse(cx + s * 6, my - 8, 7, 3.5, s * 0.3, 0, 7); ctx.fill();
  }

  /* ------------- FRONT HAIR (over forehead) ------------- */
  const capShape = (yb, bumps) => {          // solid hair covering top of head
    ctx.beginPath();
    ctx.arc(cx, hy, r + 1.5, Math.PI, 0);
    ctx.lineTo(cx + r, yb);
    if (bumps) {
      const n = 5;
      for (let i = 0; i < n; i++) {
        const x1 = cx + r - (2 * r / n) * (i + 0.5);
        const x2 = cx + r - (2 * r / n) * (i + 1);
        ctx.quadraticCurveTo(x1, yb + 11, x2, yb);
      }
    } else ctx.lineTo(cx - r, yb);
    ctx.closePath(); ctx.fill();
  };

  if (style === 'curls') {
    capShape(hy - r * 0.3, true);
    ctx.beginPath(); ctx.arc(cx - r * 0.55, hy - r * 0.95, 9, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + r * 0.55, hy - r * 0.95, 9, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(cx, hy - r * 1.08, 9, 0, 7); ctx.fill();
  }
  if (style === 'bob' || style === 'long') capShape(hy - r * 0.35, false);
  if (style === 'short') capShape(hy - r * 0.4, false);
  if (style === 'flat') {
    ctx.beginPath(); ctx.roundRect(cx - r * 1.02, hy - r * 1.35, r * 2.04, r * 1.0, 6); ctx.fill();
  }
  if (style === 'buns') {
    capShape(hy - r * 0.45, false);
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(cx + s * r * 0.8, hy - r * 1.0, r * 0.4, 0, 7); ctx.fill(); }
  }
  if (style === 'puffs') {
    capShape(hy - r * 0.5, false);
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(cx + s * r * 0.95, hy - r * 0.6, r * 0.55, 0, 7); ctx.fill(); }
  }
  if (style === 'cap') {
    capShape(hy - r * 0.42, false);
    const dir = chance(0.5) ? -1 : 1;                    // brim direction
    ctx.beginPath();
    ctx.roundRect(dir === -1 ? cx - r - 17 : cx, hy - r * 0.5, r + 17, 8, 4);
    ctx.fill();
    ctx.beginPath(); ctx.arc(cx, hy - r - 1, 4, 0, 7); ctx.fill();
  }
  if (style === 'bald' && chance(0.7)) {
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(cx + s * r * 0.9, hy - r * 0.05, 6, 0, 7); ctx.fill(); }
  }
  // earring
  if (!isHijab && chance(0.15)) {
    ctx.beginPath(); ctx.arc(cx - r * 0.95, hy + r * 0.28, 3, 0, 7); ctx.stroke();
  }
}

/* ============================================================
   PART 2 — BUILD SPRITE SHEET (drawn once, high-res)
   ============================================================ */
const COLS_X = 10, ROWS_Y = 6;               // 60 unique peeps
const CELL_W = 150, CELL_H = 200, RES = 2;   // 2x for crisp lines

const sheet = document.createElement('canvas');
sheet.width  = COLS_X * CELL_W * RES;
sheet.height = ROWS_Y * CELL_H * RES;
const sctx = sheet.getContext('2d');

for (let i = 0; i < COLS_X * ROWS_Y; i++) {
  const ox = (i % COLS_X) * CELL_W;
  const oy = Math.floor(i / COLS_X) * CELL_H;
  sctx.save();
  sctx.setTransform(RES, 0, 0, RES, ox * RES, oy * RES);
  sctx.beginPath(); sctx.rect(0, 0, CELL_W, CELL_H); sctx.clip();
  drawPeep(sctx, CELL_W, CELL_H);
  sctx.restore();
}

/* ============================================================
   PART 3 — CROWD ENGINE (same logic as the original)
   ============================================================ */
const canvas = document.getElementById('crowdCanvas');
const ctx = canvas.getContext('2d');
const stage = { width: 0, height: 0 };

const allPeeps = [], availablePeeps = [], crowd = [];
const randomRange = (a, b) => a + Math.random() * (b - a);
const removeRandom = arr => arr.splice((Math.random() * arr.length) | 0, 1)[0];

for (let i = 0; i < COLS_X * ROWS_Y; i++) {
  allPeeps.push({
    sx: (i % COLS_X) * CELL_W * RES,
    sy: Math.floor(i / COLS_X) * CELL_H * RES,
    width: CELL_W, height: CELL_H,
    x: 0, y: 0, anchorY: 0, scaleX: 1, depth: 1, walk: null,
    render(c) {
      c.save();
      c.translate(this.x, this.y);
      c.scale(this.scaleX * this.depth, this.depth);
      c.drawImage(sheet, this.sx, this.sy, CELL_W * RES, CELL_H * RES, 0, 0, CELL_W, CELL_H);
      c.restore();
    }
  });
}

const resetPeep = (peep) => {
  const dir = Math.random() > 0.5 ? 1 : -1;
  const t = Math.pow(Math.random(), 2);                  // power2.in distribution
  const offsetY = 100 - 250 * t;
  peep.depth = 0.75 + 0.35 * (1 - t);                    // farther back = smaller
  const startY = stage.height - peep.height * peep.depth + offsetY;
  const startX = dir === 1 ? -peep.width : stage.width + peep.width;
  const endX   = dir === 1 ? stage.width : -peep.width;
  peep.scaleX = dir;
  peep.x = startX; peep.y = startY; peep.anchorY = startY;
  return { startX, startY, endX };
};

const addPeepToCrowd = () => {
  const peep = removeRandom(availablePeeps);
  const p = resetPeep(peep);
  const xDur = 10, yDur = 0.25;
  const tl = gsap.timeline({
    onComplete: () => {
      crowd.splice(crowd.indexOf(peep), 1);
      availablePeeps.push(peep);
      addPeepToCrowd();
    }
  });
  tl.timeScale(randomRange(0.5, 1.5));
  tl.to(peep, { duration: xDur, x: p.endX, ease: 'none' }, 0);
  tl.to(peep, { duration: yDur, repeat: xDur / yDur, yoyo: true, y: p.startY - 8, ease: 'sine.inOut' }, 0);
  peep.walk = tl;
  crowd.push(peep);
  crowd.sort((a, b) => a.anchorY - b.anchorY);
  return peep;
};

const render = () => {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.scale(devicePixelRatio, devicePixelRatio);
  crowd.forEach(p => p.render(ctx));
  ctx.restore();
};

const resize = () => {
  stage.width  = canvas.clientWidth;
  stage.height = canvas.clientHeight;
  canvas.width  = stage.width * devicePixelRatio;
  canvas.height = stage.height * devicePixelRatio;
  crowd.forEach(p => p.walk && p.walk.kill());
  crowd.length = 0;
  availablePeeps.length = 0;
  availablePeeps.push(...allPeeps);
  while (availablePeeps.length) addPeepToCrowd().walk.progress(Math.random());
};

gsap.ticker.add(render);
window.addEventListener('resize', resize);
resize();
</script>

</body>
</html>
