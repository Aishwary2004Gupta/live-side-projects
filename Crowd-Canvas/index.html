<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crowd Canvas — Dense Illustration Style</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
    }
    .page {
      position: relative;
      width: 100vw; height: 100vh;
      overflow: hidden; background: #fff;
    }
    .heading {
      position: absolute; top: 5.5rem; left: 50%;
      transform: translateX(-50%);
      display: grid; place-items: center; gap: 1.5rem;
      text-align: center; z-index: 2;
    }
    .heading span {
      position: relative; max-width: 12ch;
      font-size: 12px; line-height: 1.1;
      text-transform: uppercase; letter-spacing: 0.04em; opacity: 0.4;
    }
    .heading span::after {
      content: ""; position: absolute; top: 100%; left: 50%;
      width: 1px; height: 4rem;
      background: linear-gradient(to bottom, #fff, #000);
    }
    #crowdCanvas {
      position: absolute; left: 0; bottom: 0;
      width: 100%; height: 95vh;
      display: block; pointer-events: none;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="heading"><span>Crowd Canvas</span></div>
    <canvas id="crowdCanvas"></canvas>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
  (function() {
    const rr = (a,b) => a + Math.random()*(b-a);
    const ri = (a,b) => (rr(a,b))|0;
    const pick = a => a[(Math.random()*a.length)|0];
    const ch = p => Math.random()<p;
    const removeRandom = a => a.splice((Math.random()*a.length)|0, 1)[0];

    const INK = "#1a1a1a";
    const WHITE = "#ffffff";
    const LIGHT = "#f0f0f0";
    const FILLS = [INK, WHITE, LIGHT, LIGHT];

    const W = 145, H = 225, S = 2;

    function drawPeep() {
      const c = document.createElement("canvas");
      c.width = W*S; c.height = H*S;
      const g = c.getContext("2d");
      g.scale(S,S);
      g.lineCap = "round"; g.lineJoin = "round";

      const lw = 2.8;
      const cx = 72;
      const headRx = rr(20,27);
      const headRy = rr(24,31);
      const headCy = 64;
      const headTop = headCy - headRy;
      const shoulderY = headCy + headRy + rr(8,18);
      const bodyW = rr(54,78);
      const bodyL = cx - bodyW/2;
      const bodyR = cx + bodyW/2;
      const shirtFill = pick(FILLS);
      const isDark = shirtFill === INK;

      const faceOff = headRx * 0.14;

      const hairStyle = pick([
        "short","buzz","fringe","long","afro","bigafro","curly","bun","ponytail","bangs",
        "spiky","wavy","pompadour","cap","beanie","headband","hoodie","bald","hijab",
        "braids","mohawk","mullet","sidepart","bob","undercut"
      ]);
      const hasGlasses = ch(0.42);
      const glassStyle = pick(["round","square","sunglasses","cat"]);
      const hasBeard = ch(0.32);
      const beardStyle = pick(["full","goatee","stubble","mustache","chinstrap"]);
      const hasMustache = hasBeard && ch(0.6);
      const hasStripes = !isDark && ch(0.25);
      const hasDots = !isDark && ch(0.15);
      const hasCollar = ch(0.4);
      const hasTie = hasCollar && ch(0.2);
      const hasHoodie = hairStyle === "hoodie" || ch(0.18);
      const hasPhone = ch(0.22);
      const hasHeadphones = ch(0.14);
      const hasScarf = ch(0.12);
      const faceShape = pick(["round","oval","square","long"]);
      const eyeStyle = pick(["open","open","happy","surprised","wink","sideeye"]);
      const mouthStyle = pick(["smile","neutral","open","smirk","teeth","serious"]);
      const earSide = ch(0.55);

      const stroke = (fn) => { g.strokeStyle=INK; g.lineWidth=lw; g.beginPath(); fn(); g.stroke(); };
      const fill = (color, fn) => { g.fillStyle=color; g.beginPath(); fn(); g.fill(); };
      const fillStroke = (color, fn) => {
        g.fillStyle = color; g.strokeStyle = INK; g.lineWidth = lw;
        g.beginPath(); fn(); g.fill(); g.stroke();
      };

      // Hijab / Hoodie base
      if (hairStyle === "hijab") {
        fillStroke(INK, () => {
          g.moveTo(bodyL-8, shoulderY+10);
          g.quadraticCurveTo(bodyL-18, headTop-25, cx, headTop-22);
          g.quadraticCurveTo(bodyR+18, headTop-25, bodyR+8, shoulderY+10);
          g.lineTo(bodyR+8, shoulderY+35);
          g.quadraticCurveTo(bodyR, shoulderY+12, bodyR, shoulderY);
          g.lineTo(bodyL, shoulderY);
          g.quadraticCurveTo(bodyL, shoulderY+12, bodyL-8, shoulderY+35);
        });
        fill(WHITE, () => g.ellipse(cx+faceOff, headCy, headRx*0.9, headRy*0.95, 0, 0, Math.PI*2));
      }

      // Big hair behind head
      if (["long","bigafro","curly","braids"].includes(hairStyle)) {
        fill(INK, () => g.ellipse(cx+faceOff, headCy+headRy*0.4, headRx+14, headRy*1.9, 0, 0, Math.PI*2));
      }
      if (hairStyle === "bigafro") {
        fillStroke(INK, () => g.ellipse(cx+faceOff, headCy-headRy*0.4, headRx*1.75, headRy*1.55, 0, 0, Math.PI*2));
      }

      // Body
      const rad = 18;
      if (hasHoodie) {
        fillStroke(shirtFill, () => {
          g.moveTo(bodyL-3, H); g.lineTo(bodyL-3, shoulderY+rad+6);
          g.quadraticCurveTo(bodyL-3, shoulderY+4, bodyL+rad, shoulderY+4);
          g.lineTo(bodyR-rad, shoulderY+4);
          g.quadraticCurveTo(bodyR+3, shoulderY+4, bodyR+3, shoulderY+rad+6);
          g.lineTo(bodyR+3, H);
        });
      } else {
        fillStroke(shirtFill, () => {
          g.moveTo(bodyL, H); g.lineTo(bodyL, shoulderY+rad);
          g.quadraticCurveTo(bodyL, shoulderY, bodyL+rad, shoulderY);
          g.lineTo(bodyR-rad, shoulderY);
          g.quadraticCurveTo(bodyR, shoulderY, bodyR, shoulderY+rad);
          g.lineTo(bodyR, H);
        });
      }

      if (hasStripes) {
        g.save(); g.clip(); // simplified clip for stripes
        g.strokeStyle = INK; g.lineWidth = 2.4;
        for (let y = shoulderY+12; y < H; y += 13) {
          g.beginPath(); g.moveTo(bodyL-6,y); g.lineTo(bodyR+6,y); g.stroke();
        }
        g.restore();
      }
      if (hasDots) {
        g.fillStyle = INK;
        for (let i = 0; i < 45; i++) {
          g.fillRect(rr(bodyL+4, bodyR-4), rr(shoulderY+10, H-10), 2.5, 2.5);
        }
      }

      if (hasCollar && !hasHoodie) {
        stroke(() => {
          g.moveTo(cx-13, shoulderY); g.lineTo(cx-4, shoulderY+18);
          g.lineTo(cx, shoulderY+6); g.lineTo(cx+4, shoulderY+18); g.lineTo(cx+13, shoulderY);
        });
      }

      // Neck
      if (hairStyle !== "hijab") {
        fillStroke(WHITE, () => g.rect(cx-10, headCy+headRy-14, 20, shoulderY-headCy-headRy+18));
      }

      // Head
      if (hairStyle !== "hijab") {
        fillStroke(WHITE, () => {
          if (faceShape === "square") {
            const r = 8; g.roundRect(cx+faceOff-headRx, headCy-headRy, headRx*2, headRy*2, r);
          } else if (faceShape === "long") {
            g.ellipse(cx+faceOff, headCy, headRx*0.82, headRy*1.2, 0, 0, Math.PI*2);
          } else {
            g.ellipse(cx+faceOff, headCy, headRx, headRy, 0, 0, Math.PI*2);
          }
        });
      }

      // Hair on top
      const hairClip = (ratio) => {
        g.save();
        g.beginPath(); g.ellipse(cx+faceOff, headCy, headRx+1, headRy+1, 0, 0, Math.PI*2); g.clip();
        fill(INK, () => g.rect(cx+faceOff-headRx-6, headTop-8, headRx*2+12, headRy*ratio+10));
        g.restore();
      };
      const hairDome = (extra) => fillStroke(INK, () => g.ellipse(cx+faceOff, headCy, headRx+extra, headRy+extra, 0, Math.PI, Math.PI*2));

      if (hairStyle === "short" || hairStyle === "buzz" || hairStyle === "undercut") { hairClip(0.48); hairDome(4); }
      if (hairStyle === "fringe" || hairStyle === "bangs") { hairClip(0.78); hairDome(4); }
      if (hairStyle === "bob") { hairClip(0.65); hairDome(3); }
      if (hairStyle === "long" || hairStyle === "bigafro") hairClip(0.5);
      if (hairStyle === "spiky") {
        hairClip(0.35);
        for (let i = 0; i < 7; i++) {
          const a = Math.PI + (Math.PI * (i+0.5)) / 7;
          const len = rr(12,22);
          fillStroke(INK, () => {
            g.moveTo(cx+faceOff+Math.cos(a)*(headRx+2), headCy+Math.sin(a)*(headRy+2));
            g.lineTo(cx+faceOff+Math.cos(a)*len, headCy+Math.sin(a)*len);
          });
        }
      }
      if (hairStyle === "bun" || hairStyle === "ponytail") {
        hairClip(0.55); hairDome(4);
        fillStroke(INK, () => g.arc(cx+faceOff-headRx*0.6, headTop-6, 11, 0, Math.PI*2));
      }
      if (hairStyle === "cap") {
        fillStroke(INK, () => g.ellipse(cx+faceOff, headCy-headRy*0.45, headRx+5, headRy*0.8, 0, Math.PI, Math.PI*2));
        fillStroke(INK, () => g.roundRect(cx+faceOff+2, headCy-headRy*0.55, headRx+18, 8, 4));
      }
      if (hairStyle === "beanie") {
        fillStroke(INK, () => g.ellipse(cx+faceOff, headCy-headRy*0.35, headRx+5, headRy*0.9, 0, Math.PI, Math.PI*2));
        fillStroke(INK, () => g.rect(cx+faceOff-headRx-4, headCy-headRy*0.45, headRx*2+8, 10));
      }

      // Beard
      if (hasBeard && hairStyle !== "hijab") {
        g.save();
        g.beginPath(); g.ellipse(cx+faceOff, headCy, headRx+3, headRy+3, 0, 0, Math.PI*2); g.clip();
        if (beardStyle === "full") fill(INK, () => g.rect(cx+faceOff-headRx-6, headCy+headRy*0.2, headRx*2+12, headRy+6));
        else if (beardStyle === "goatee") fill(INK, () => g.ellipse(cx+faceOff+headRx*0.25, headCy+headRy*0.6, 10, 14, 0, 0, Math.PI*2));
        g.restore();
      }

      // Face features (matching the dense, expressive look of the image)
      if (hairStyle !== "hijab") {
        const eyeX = cx + faceOff + headRx * 0.35;
        const eyeY = headCy - headRy * 0.08;

        // Eyes
        if (eyeStyle === "open") {
          fill(INK, () => g.ellipse(eyeX, eyeY, 3, 3.5, 0, 0, Math.PI*2));
          fill(WHITE, () => g.arc(eyeX+1, eyeY-1, 1, 0, Math.PI*2));
        } else if (eyeStyle === "happy") {
          stroke(() => g.arc(eyeX, eyeY+1, 4, Math.PI*0.2, Math.PI*0.8));
        } else if (eyeStyle === "surprised") {
          g.strokeStyle = INK; g.lineWidth = 2.2;
          g.beginPath(); g.ellipse(eyeX, eyeY, 3.5, 5, 0, 0, Math.PI*2); g.stroke();
        } else if (eyeStyle === "wink") {
          stroke(() => g.moveTo(eyeX-4, eyeY); g.quadraticCurveTo(eyeX, eyeY-3, eyeX+4, eyeY));
        } else if (eyeStyle === "sideeye") {
          fill(INK, () => g.ellipse(eyeX, eyeY, 3, 2.8, 0.3, 0, Math.PI*2));
        }

        // Second eye (for depth)
        if (ch(0.65)) fill(INK, () => g.ellipse(cx+faceOff-headRx*0.1, eyeY, 2.2, 2.8, 0, 0, Math.PI*2));

        // Eyebrow
        g.lineWidth = 2.9; stroke(() => {
          g.moveTo(eyeX-8, eyeY-11);
          g.quadraticCurveTo(eyeX-2, eyeY-14, eyeX+8, eyeY-10);
        });

        // Nose
        stroke(() => {
          g.moveTo(cx+faceOff+headRx*0.55, headCy-headRy*0.04);
          g.quadraticCurveTo(cx+faceOff+headRx+2, headCy+headRy*0.2, cx+faceOff+headRx*0.5, headCy+headRy*0.32);
        });

        // Mouth
        g.lineWidth = 2.4;
        const mouthY = headCy + headRy * 0.46;
        if (mouthStyle === "smile") stroke(() => g.arc(eyeX-1, mouthY-1, 6.5, Math.PI*0.15, Math.PI*0.75));
        else if (mouthStyle === "open") fillStroke(INK, () => g.ellipse(eyeX, mouthY+1, 4.5, 3.8, 0, 0, Math.PI*2));
        else if (mouthStyle === "teeth") {
          fill(WHITE, () => g.ellipse(eyeX, mouthY, 5, 3, 0, 0, Math.PI*2));
          stroke(() => g.ellipse(eyeX, mouthY, 5, 3, 0, 0, Math.PI*2));
        } else if (mouthStyle === "smirk") {
          stroke(() => { g.moveTo(eyeX-6, mouthY+1); g.quadraticCurveTo(eyeX, mouthY-3, eyeX+6, mouthY+2); });
        } else {
          stroke(() => { g.moveTo(eyeX-7, mouthY); g.lineTo(eyeX+5, mouthY); });
        }

        if (hasMustache) {
          fill(INK, () => {
            g.moveTo(eyeX-9, mouthY-6);
            g.quadraticCurveTo(eyeX-3, mouthY-11, eyeX+1, mouthY-6);
            g.quadraticCurveTo(eyeX+5, mouthY-11, eyeX+10, mouthY-6);
          });
        }

        if (hasGlasses) {
          g.lineWidth = 2.5;
          if (glassStyle === "round") {
            g.beginPath(); g.arc(eyeX, eyeY, 9.5, 0, Math.PI*2); g.stroke();
            g.beginPath(); g.moveTo(eyeX-9.5, eyeY); g.lineTo(cx+faceOff-headRx*0.4, eyeY); g.stroke();
          } else if (glassStyle === "square") {
            g.strokeRect(eyeX-10, eyeY-8, 19, 15);
            g.beginPath(); g.moveTo(eyeX-10, eyeY); g.lineTo(cx+faceOff-headRx*0.4, eyeY); g.stroke();
          } else if (glassStyle === "sunglasses") {
            fillStroke(INK, () => g.ellipse(eyeX, eyeY, 10.5, 7.5, 0, 0, Math.PI*2));
            g.lineWidth = 3; g.beginPath(); g.moveTo(eyeX-10.5, eyeY); g.lineTo(cx+faceOff-headRx*0.4, eyeY); g.stroke();
          }
        }
      }

      // Headphones & Phone
      if (hasHeadphones) {
        g.lineWidth = 4.5; stroke(() => g.ellipse(cx+faceOff, headCy, headRx+8, headRy+7, 0, Math.PI*1.1, Math.PI*1.9));
        fillStroke(INK, () => g.roundRect(cx-headRx*0.4-8, headCy-6, 13, 19, 4));
      }
      if (hasPhone) {
        const px = cx + bodyW*0.35;
        const py = shoulderY + 34;
        fillStroke(INK, () => g.roundRect(px, py, 19, 32, 3));
        fill(WHITE, () => g.roundRect(px+2, py+3, 15, 24, 2));
        fillStroke(WHITE, () => g.ellipse(px+9, py+36, 11, 7, 0, 0, Math.PI*2));
      }

      return c;
    }

    class Peep {
      constructor(sprite) {
        this.image = sprite;
        const s = rr(0.45, 1.22);
        this.width = W * s;
        this.height = H * s;
        this.x = 0; this.y = 0;
        this.anchorY = 0; this.scaleX = 1;
        this.walk = null;
      }
      render(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.scale(this.scaleX, 1);
        ctx.drawImage(this.image, 0, 0, this.image.width, this.image.height, 0, 0, this.width, this.height);
        ctx.restore();
      }
    }

    const canvas = document.getElementById("crowdCanvas");
    const ctx = canvas.getContext("2d");
    const COUNT = 550;

    const stage = { width:0, height:0 };
    let dpr = window.devicePixelRatio || 1;

    const allPeeps = [], availablePeeps = [], crowd = [];

    const resetPeep = ({stage, peep}) => {
      const dir = Math.random() > 0.5 ? 1 : -1;
      const offsetY = 60 - 260 * gsap.parseEase("power2.in")(Math.random());
      const startY = stage.height - peep.height + offsetY;
      let startX, endX;
      if (dir === 1) { startX = -peep.width * 0.8; endX = stage.width; peep.scaleX = 1; }
      else { startX = stage.width + peep.width * 0.8; endX = 0; peep.scaleX = -1; }
      peep.x = startX; peep.y = startY; peep.anchorY = startY;
      return {startX, startY, endX};
    };

    const normalWalk = ({peep, props}) => {
      const {startY, endX} = props;
      const xD = rr(6.5, 14);
      const tl = gsap.timeline();
      tl.timeScale(rr(0.55, 1.9));
      tl.to(peep, {duration: xD, x: endX, ease: "none"}, 0);
      tl.to(peep, {duration: 0.22, repeat: xD/0.22, yoyo: true, y: startY-12, ease: "sine.inOut"}, 0);
      return tl;
    };

    function addPeep() {
      if (!availablePeeps.length) return null;
      const peep = removeRandom(availablePeeps);
      const walk = normalWalk({peep, props: resetPeep({peep, stage})})
        .eventCallback("onComplete", () => { removePeep(peep); addPeep(); });
      peep.walk = walk;
      crowd.push(peep);
      crowd.sort((a,b) => a.anchorY - b.anchorY);
      return peep;
    }

    function removePeep(peep) {
      const i = crowd.indexOf(peep);
      if (i !== -1) crowd.splice(i, 1);
      availablePeeps.push(peep);
    }

    function initCrowd() {
      while (availablePeeps.length) {
        const p = addPeep();
        if (p && p.walk) p.walk.progress(Math.random());
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save(); ctx.scale(dpr, dpr);
      crowd.forEach(p => p.render(ctx));
      ctx.restore();
    }

    function resize() {
      dpr = window.devicePixelRatio || 1;
      stage.width = canvas.clientWidth;
      stage.height = canvas.clientHeight;
      canvas.width = stage.width * dpr;
      canvas.height = stage.height * dpr;

      crowd.forEach(p => p.walk && p.walk.kill());
      crowd.length = 0; availablePeeps.length = 0;
      availablePeeps.push(...allPeeps);
      initCrowd(); render();
    }

    for (let i = 0; i < COUNT; i++) allPeeps.push(new Peep(drawPeep()));
    resize();
    gsap.ticker.add(render);
    window.addEventListener("resize", resize);
  })();
  </script>
</body>
</html>
