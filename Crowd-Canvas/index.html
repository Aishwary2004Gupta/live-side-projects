<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crowd Canvas - Skiper UI Style</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #fff; color: #000; overflow: hidden; font-family: Arial, sans-serif; }
        .page-container { position: relative; width: 100vw; height: 100vh; }
        .heading-wrapper {
            position: absolute; top: 5.5rem; left: 50%;
            transform: translateX(-50%);
            display: grid; justify-items: center; text-align: center;
            gap: 1.5rem; z-index: 10;
        }
        .text-label {
            position: relative; max-width: 12ch; font-size: 12px;
            text-transform: uppercase; line-height: 1.1;
            letter-spacing: 0.04em; opacity: 0.4;
        }
        .text-label::after {
            content: ''; position: absolute; top: 100%; left: 50%;
            width: 1px; height: 4rem;
            background: linear-gradient(to bottom, #fff, #000);
        }
        #crowdCanvas {
            position: absolute; bottom: 0; left: 0;
            width: 100%; height: 90vh; display: block;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="heading-wrapper">
            <span class="text-label">Crowd Canvas</span>
        </div>
        <canvas id="crowdCanvas"></canvas>
    </div>

    <script>
    (function() {
        /* ═══════════════════════════════════════
           STEP 1: BUILD SPRITE SHEET IN CODE
           This creates the "all-peeps.png" equivalent
           at runtime — no external file needed.
        ═══════════════════════════════════════ */
        
        const ROWS = 15;   // sprites per row
        const COLS = 7;    // sprites per column
        const CELL_W = 160;
        const CELL_H = 260;
        const TOTAL = ROWS * COLS; // 105 unique peeps

        const rr = (a, b) => a + Math.random() * (b - a);
        const pick = arr => arr[Math.floor(Math.random() * arr.length)];
        const ch = p => Math.random() < p;

        const INK = "#1a1a1a";
        const WHITE = "#ffffff";
        const LIGHT = "#efefef";
        const FILLS = [INK, WHITE, LIGHT, LIGHT];

        function drawPeepAt(g, ox, oy) {
            g.save();
            g.translate(ox, oy);
            g.lineCap = "round";
            g.lineJoin = "round";

            const lw = 3;
            const cx = 80;
            const headRx = rr(22, 30);
            const headRy = rr(26, 34);
            const headCy = 75;
            const headTop = headCy - headRy;
            const shoulderY = headCy + headRy + rr(8, 18);
            const bodyW = rr(60, 90);
            const bodyL = cx - bodyW / 2;
            const bodyR = cx + bodyW / 2;
            const shirtFill = pick(FILLS);
            const isDark = shirtFill === INK;
            const faceOff = headRx * 0.12;

            const hairStyle = pick([
                "short","buzz","fringe","long","afro","curly","bun",
                "ponytail","bangs","spiky","wavy","pompadour","cap",
                "beanie","headband","hoodie","bald","hijab","braids"
            ]);
            const hasGlasses = ch(0.4);
            const glassStyle = pick(["round","square","sunglasses"]);
            const hasBeard = ch(0.3);
            const beardStyle = pick(["full","goatee","stubble","mustache"]);
            const hasMustache = hasBeard && ch(0.6);
            const hasStripes = !isDark && ch(0.25);
            const hasCollar = ch(0.4);
            const hasHoodie = hairStyle === "hoodie" || (!hasCollar && ch(0.15));
            const eyeStyle = pick(["open","open","happy","closed"]);
            const mouthType = pick(["smile","smile","neutral","open","smirk"]);

            const stroke = fn => { g.strokeStyle=INK; g.lineWidth=lw; g.beginPath(); fn(); g.stroke(); };
            const fill = (color, fn) => { g.fillStyle=color; g.beginPath(); fn(); g.fill(); };
            const fillStroke = (color, fn) => {
                g.fillStyle=color; g.strokeStyle=INK; g.lineWidth=lw;
                g.beginPath(); fn(); g.fill(); g.stroke();
            };

            // Hijab
            if (hairStyle === "hijab") {
                fillStroke(INK, () => {
                    g.moveTo(bodyL-8, shoulderY+18);
                    g.quadraticCurveTo(bodyL-15, headTop-25, cx, headTop-22);
                    g.quadraticCurveTo(bodyR+15, headTop-25, bodyR+8, shoulderY+18);
                    g.lineTo(bodyR+8, shoulderY+35);
                    g.quadraticCurveTo(bodyR, shoulderY+12, bodyR, shoulderY);
                    g.lineTo(bodyL, shoulderY);
                    g.quadraticCurveTo(bodyL, shoulderY+12, bodyL-8, shoulderY+35);
                    g.closePath();
                });
                fill(WHITE, () => g.ellipse(cx+faceOff, headCy, headRx*0.85, headRy*0.9, 0, 0, Math.PI*2));
                stroke(() => g.ellipse(cx+faceOff, headCy, headRx*0.85, headRy*0.9, 0, 0, Math.PI*2));
            }

            // Long hair backing
            if (["long","afro","curly","braids"].includes(hairStyle)) {
                fill(INK, () => g.ellipse(cx+faceOff, headCy+headRy*0.5, headRx+14, headRy*1.8, 0, 0, Math.PI*2));
            }

            // Body
            const rad = 18;
            if (hasHoodie) {
                fillStroke(shirtFill, () => {
                    g.moveTo(bodyL-3, CELL_H);
                    g.lineTo(bodyL-3, shoulderY+rad+4);
                    g.quadraticCurveTo(bodyL-3, shoulderY+2, bodyL+rad-3, shoulderY+2);
                    g.lineTo(bodyR-rad+3, shoulderY+2);
                    g.quadraticCurveTo(bodyR+3, shoulderY+2, bodyR+3, shoulderY+rad+4);
                    g.lineTo(bodyR+3, CELL_H);
                    g.closePath();
                });
            } else {
                fillStroke(shirtFill, () => {
                    g.moveTo(bodyL, CELL_H);
                    g.lineTo(bodyL, shoulderY+rad);
                    g.quadraticCurveTo(bodyL, shoulderY, bodyL+rad, shoulderY);
                    g.lineTo(bodyR-rad, shoulderY);
                    g.quadraticCurveTo(bodyR, shoulderY, bodyR, shoulderY+rad);
                    g.lineTo(bodyR, CELL_H);
                    g.closePath();
                });
            }

            // Stripes
            if (hasStripes) {
                g.save();
                g.beginPath();
                g.moveTo(bodyL, CELL_H); g.lineTo(bodyL, shoulderY+rad);
                g.quadraticCurveTo(bodyL, shoulderY, bodyL+rad, shoulderY);
                g.lineTo(bodyR-rad, shoulderY);
                g.quadraticCurveTo(bodyR, shoulderY, bodyR, shoulderY+rad);
                g.lineTo(bodyR, CELL_H);
                g.closePath();
                g.clip();
                g.strokeStyle = INK; g.lineWidth = 2.5;
                for (let y = shoulderY+15; y < CELL_H; y += 13) {
                    g.beginPath(); g.moveTo(bodyL-5, y); g.lineTo(bodyR+5, y); g.stroke();
                }
                g.restore();
            }

            if (hasCollar && !hasHoodie) {
                stroke(() => {
                    g.moveTo(cx-14, shoulderY);
                    g.lineTo(cx-4, shoulderY+18);
                    g.lineTo(cx, shoulderY+6);
                    g.lineTo(cx+4, shoulderY+18);
                    g.lineTo(cx+14, shoulderY);
                });
            }

            // Neck
            if (hairStyle !== "hijab") {
                fillStroke(WHITE, () => g.rect(cx-10, headCy+headRy-14, 20, shoulderY-(headCy+headRy)+16));
            }

            // Head
            if (hairStyle !== "hijab") {
                fillStroke(WHITE, () => g.ellipse(cx+faceOff, headCy, headRx, headRy, 0, 0, Math.PI*2));
            }

            // Ear
            if (ch(0.5) && !["afro","curly","hoodie","hijab"].includes(hairStyle)) {
                fillStroke(WHITE, () => g.ellipse(cx-headRx+2, headCy+headRy*0.05, 6, 8, 0, 0, Math.PI*2));
                stroke(() => g.arc(cx-headRx+2, headCy+headRy*0.05, 3.5, Math.PI*0.3, Math.PI*1.5));
            }

            // Hair
            const hairClip = ratio => {
                g.save();
                g.beginPath();
                g.ellipse(cx+faceOff, headCy, headRx+0.5, headRy+0.5, 0, 0, Math.PI*2);
                g.clip();
                fill(INK, () => g.rect(cx+faceOff-headRx-5, headTop-5, headRx*2+10, headRy*ratio+5));
                g.restore();
            };
            const hairDome = extra => fillStroke(INK, () => g.ellipse(cx+faceOff, headCy, headRx+extra, headRy+extra, 0, Math.PI, Math.PI*2));

            if (hairStyle === "short") { hairClip(rr(0.42, 0.55)); hairDome(3); }
            else if (hairStyle === "buzz") { hairClip(rr(0.3, 0.42)); hairDome(2); }
            else if (hairStyle === "fringe") { hairClip(rr(0.6, 0.85)); hairDome(3); }
            else if (hairStyle === "bangs") { hairClip(0.5); hairDome(3); fill(INK, () => g.rect(cx+faceOff-headRx-2, headTop-2, headRx*2+4, headRy*0.55)); }
            else if (hairStyle === "long") { hairClip(0.55); hairDome(3); }
            else if (hairStyle === "afro") { hairClip(0.45); fillStroke(INK, () => g.ellipse(cx+faceOff, headCy-headRy*0.3, headRx*1.6, headRy*1.4, 0, 0, Math.PI*2)); }
            else if (hairStyle === "curly") { hairClip(0.45); for (let a = 0; a < Math.PI*2; a += 0.5) { const r = headRx + 8; fill(INK, () => g.arc(cx+faceOff+Math.cos(a)*r, headCy-headRy*0.1+Math.sin(a)*r, rr(4,7), 0, Math.PI*2)); } }
            else if (hairStyle === "wavy") { hairClip(rr(0.45, 0.6)); hairDome(3); }
            else if (hairStyle === "spiky") { hairClip(0.35); for (let i = 0; i < 6; i++) { const a = Math.PI+(Math.PI*(i+0.5))/6; const len = rr(12,20); fillStroke(INK, () => { g.moveTo(cx+faceOff+Math.cos(a)*headRx, headCy+Math.sin(a)*headRy); g.lineTo(cx+faceOff+Math.cos(a)*(headRx+len), headCy+Math.sin(a)*(headRy+len)); }); } }
            else if (hairStyle === "pompadour") { hairClip(0.4); fillStroke(INK, () => { g.moveTo(cx+faceOff-headRx, headTop+headRy*0.3); g.quadraticCurveTo(cx+faceOff, headTop-headRy*0.8, cx+faceOff+headRx*0.5, headTop-headRy*0.4); g.quadraticCurveTo(cx+faceOff+headRx+5, headTop, cx+faceOff+headRx, headTop+headRy*0.3); g.closePath(); }); }
            else if (hairStyle === "bun") { hairClip(0.5); hairDome(3); fillStroke(INK, () => g.arc(cx+faceOff, headTop-6, rr(9,13), 0, Math.PI*2)); }
            else if (hairStyle === "ponytail") { hairClip(0.5); hairDome(3); fill(INK, () => { g.moveTo(cx+faceOff-headRx, headCy-headRy*0.3); g.quadraticCurveTo(cx+faceOff-headRx-25, headCy, cx+faceOff-headRx-14, headCy+headRy*1.3); g.quadraticCurveTo(cx+faceOff-headRx-5, headCy+headRy*0.5, cx+faceOff-headRx, headCy+headRy*0.1); g.closePath(); }); }
            else if (hairStyle === "cap") { fillStroke(INK, () => g.ellipse(cx+faceOff, headCy-headRy*0.4, headRx+3, headRy*0.75, 0, Math.PI, Math.PI*2)); fillStroke(INK, () => { g.moveTo(cx+faceOff-headRx-3, headCy-headRy*0.42); g.lineTo(cx+faceOff+headRx+20, headCy-headRy*0.42); g.lineTo(cx+faceOff+headRx+18, headCy-headRy*0.34); g.lineTo(cx+faceOff-headRx-3, headCy-headRy*0.34); g.closePath(); }); }
            else if (hairStyle === "beanie") { fillStroke(INK, () => g.ellipse(cx+faceOff, headCy-headRy*0.3, headRx+3, headRy*0.85, 0, Math.PI, Math.PI*2)); fillStroke(INK, () => g.rect(cx+faceOff-headRx-3, headCy-headRy*0.38, headRx*2+6, 10)); }
            else if (hairStyle === "headband") { hairClip(rr(0.45,0.6)); hairDome(3); g.lineWidth=5; g.strokeStyle=INK; g.beginPath(); g.ellipse(cx+faceOff, headCy-headRy*0.15, headRx+2, headRy*0.12, 0, Math.PI*1.1, Math.PI*1.9); g.stroke(); }
            else if (hairStyle === "hoodie") { fill(INK, () => { g.moveTo(bodyL-4, shoulderY+12); g.quadraticCurveTo(bodyL-12, headTop-15, cx, headTop-18); g.quadraticCurveTo(bodyR+12, headTop-15, bodyR+4, shoulderY+12); g.closePath(); }); }
            else if (hairStyle === "braids") { hairClip(0.5); hairDome(3); for (let i = 0; i < 4; i++) { const bx = cx+faceOff-headRx*0.5+i*(headRx*1/3); fill(INK, () => { g.moveTo(bx, headTop+headRy*0.3); g.quadraticCurveTo(bx+rr(-6,6), headCy+headRy*0.5, bx+rr(-8,8), headCy+headRy*1.3); g.lineTo(bx+8, headCy+headRy*1.3); g.quadraticCurveTo(bx+rr(-4,10), headCy+headRy*0.5, bx+10, headTop+headRy*0.3); g.closePath(); }); } }

            // Beard
            if (hasBeard && beardStyle !== "mustache" && hairStyle !== "hijab") {
                g.save();
                g.beginPath();
                g.ellipse(cx+faceOff, headCy, headRx+2, headRy+2, 0, 0, Math.PI*2);
                g.clip();
                if (beardStyle === "full") fill(INK, () => g.rect(cx+faceOff-headRx-5, headCy+headRy*0.15, headRx*2+10, headRy));
                else if (beardStyle === "goatee") fill(INK, () => g.ellipse(cx+faceOff+headRx*0.3, headCy+headRy*0.6, 10, 15, 0, 0, Math.PI*2));
                else if (beardStyle === "stubble") { g.fillStyle="rgba(0,0,0,0.35)"; for (let i = 0; i < 70; i++) g.fillRect(cx+faceOff+rr(-headRx*0.8, headRx*0.9), headCy+rr(headRy*0.2, headRy*0.9), 1.5, 1.5); }
                g.restore();
            }

            // Face
            if (hairStyle !== "hijab") {
                const eyeX = cx + faceOff + headRx * 0.32;
                const eyeY = headCy - headRy * 0.06;

                if (eyeStyle === "open") { fill(INK, () => g.ellipse(eyeX, eyeY, 3, 3.5, 0, 0, Math.PI*2)); fill(WHITE, () => g.arc(eyeX+1, eyeY-1, 1, 0, Math.PI*2)); }
                else if (eyeStyle === "happy") stroke(() => g.arc(eyeX, eyeY+1, 3.5, Math.PI*1.1, Math.PI*1.9));
                else if (eyeStyle === "closed") stroke(() => g.arc(eyeX, eyeY, 3.5, Math.PI*1.1, Math.PI*1.9));

                if (ch(0.55)) fill(INK, () => g.ellipse(cx+faceOff-headRx*0.12, eyeY, 2.2, 2.6, 0, 0, Math.PI*2));

                g.strokeStyle = INK; g.lineWidth = 3;
                g.beginPath(); g.moveTo(eyeX-7, eyeY-10); g.quadraticCurveTo(eyeX, eyeY-14, eyeX+8, eyeY-11); g.stroke();

                stroke(() => { g.moveTo(cx+faceOff+headRx*0.5, headCy-headRy*0.05); g.quadraticCurveTo(cx+faceOff+headRx-1, headCy+headRy*0.2, cx+faceOff+headRx*0.48, headCy+headRy*0.3); });
                fill(INK, () => g.arc(cx+faceOff+headRx*0.5, headCy+headRy*0.27, 1.5, 0, Math.PI*2));

                g.lineWidth = 2.5;
                const mouthY = headCy + headRy * 0.45;
                if (mouthType === "smile") stroke(() => g.arc(eyeX-2, mouthY-2, 7, Math.PI*0.1, Math.PI*0.7));
                else if (mouthType === "neutral") stroke(() => { g.moveTo(eyeX-7, mouthY); g.lineTo(eyeX+5, mouthY); });
                else if (mouthType === "open") fillStroke(INK, () => g.ellipse(eyeX-1, mouthY, 5.5, 4, 0, 0, Math.PI*2));
                else if (mouthType === "smirk") stroke(() => { g.moveTo(eyeX-6, mouthY+2); g.quadraticCurveTo(eyeX, mouthY-4, eyeX+6, mouthY); });

                if (hasMustache) {
                    fill(INK, () => {
                        g.moveTo(eyeX-9, mouthY-6);
                        g.quadraticCurveTo(eyeX-4, mouthY-11, eyeX, mouthY-6);
                        g.quadraticCurveTo(eyeX+5, mouthY-11, eyeX+9, mouthY-6);
                        g.quadraticCurveTo(eyeX+3, mouthY-2, eyeX, mouthY-3);
                        g.quadraticCurveTo(eyeX-3, mouthY-2, eyeX-9, mouthY-6);
                    });
                }

                if (hasGlasses) {
                    g.strokeStyle = INK; g.lineWidth = 2.6;
                    if (glassStyle === "round") {
                        g.beginPath(); g.arc(eyeX, eyeY, 10, 0, Math.PI*2); g.stroke();
                        g.beginPath(); g.moveTo(eyeX-10, eyeY); g.lineTo(cx-headRx+2, eyeY); g.stroke();
                    } else if (glassStyle === "square") {
                        g.strokeRect(eyeX-10, eyeY-9, 20, 17);
                        g.beginPath(); g.moveTo(eyeX-10, eyeY); g.lineTo(cx-headRx+2, eyeY); g.stroke();
                    } else {
                        fillStroke(INK, () => g.ellipse(eyeX, eyeY, 11, 8.5, 0, 0, Math.PI*2));
                        g.lineWidth = 3; g.beginPath(); g.moveTo(eyeX-11, eyeY); g.lineTo(cx-headRx+1, eyeY); g.stroke();
                    }
                }

                g.strokeStyle = INK; g.lineWidth = lw;
                g.beginPath(); g.ellipse(cx+faceOff, headCy, headRx, headRy, 0, 0, Math.PI*2); g.stroke();
            }

            g.restore();
        }

        // Build the sprite sheet
        const spriteSheet = document.createElement('canvas');
        spriteSheet.width = ROWS * CELL_W;
        spriteSheet.height = COLS * CELL_H;
        const sg = spriteSheet.getContext('2d');
        
        for (let i = 0; i < TOTAL; i++) {
            const col = i % ROWS;
            const row = Math.floor(i / ROWS);
            drawPeepAt(sg, col * CELL_W, row * CELL_H);
        }

        /* ═══════════════════════════════════════
           STEP 2: CROWD ANIMATION ENGINE
           (This is the original Skiper39 code)
        ═══════════════════════════════════════ */

        const CONFIG = { rows: ROWS, cols: COLS };
        const canvas = document.getElementById('crowdCanvas');
        const ctx = canvas.getContext("2d");

        const randomRange = (min, max) => min + Math.random() * (max - min);
        const randomIndex = arr => randomRange(0, arr.length) | 0;
        const removeFromArray = (arr, i) => arr.splice(i, 1)[0];
        const removeItemFromArray = (arr, item) => removeFromArray(arr, arr.indexOf(item));
        const removeRandomFromArray = arr => removeFromArray(arr, randomIndex(arr));
        const getRandomFromArray = arr => arr[randomIndex(arr)];

        const createPeep = ({ image, rect }) => {
            const peep = {
                image, rect: [], width: 0, height: 0,
                x: 0, y: 0, anchorY: 0, scaleX: 1, walk: null,
                setRect(r) { this.rect = r; this.width = r[2]; this.height = r[3]; },
                render(context) {
                    context.save();
                    context.translate(this.x, this.y);
                    context.scale(this.scaleX, 1);
                    context.drawImage(this.image, this.rect[0], this.rect[1], this.rect[2], this.rect[3], 0, 0, this.width, this.height);
                    context.restore();
                }
            };
            peep.setRect(rect);
            return peep;
        };

        const resetPeep = ({ stage, peep }) => {
            const direction = Math.random() > 0.5 ? 1 : -1;
            const offsetY = 100 - 250 * gsap.parseEase("power2.in")(Math.random());
            const startY = stage.height - peep.height + offsetY;
            let startX, endX;
            if (direction === 1) { startX = -peep.width; endX = stage.width; peep.scaleX = 1; }
            else { startX = stage.width + peep.width; endX = 0; peep.scaleX = -1; }
            peep.x = startX; peep.y = startY; peep.anchorY = startY;
            return { startX, startY, endX };
        };

        const normalWalk = ({ peep, props }) => {
            const { startY, endX } = props;
            const xD = 10, yD = 0.25;
            const tl = gsap.timeline();
            tl.timeScale(randomRange(0.5, 1.5));
            tl.to(peep, { duration: xD, x: endX, ease: "none" }, 0);
            tl.to(peep, { duration: yD, repeat: xD/yD, yoyo: true, y: startY-10, ease: "sine.inOut" }, 0);
            return tl;
        };

        const walks = [normalWalk];
        const stage = { width: 0, height: 0 };
        const allPeeps = [], availablePeeps = [], crowd = [];

        function createPeeps() {
            const { rows, cols } = CONFIG;
            const width = spriteSheet.width, height = spriteSheet.height;
            const total = rows * cols;
            const rectW = width / rows, rectH = height / cols;
            for (let i = 0; i < total; i++) {
                allPeeps.push(createPeep({
                    image: spriteSheet,
                    rect: [(i % rows) * rectW, ((i / rows) | 0) * rectH, rectW, rectH]
                }));
            }
        }

        function addPeepToCrowd() {
            if (!availablePeeps.length) return null;
            const peep = removeRandomFromArray(availablePeeps);
            const walk = getRandomFromArray(walks)({ peep, props: resetPeep({ peep, stage }) })
                .eventCallback("onComplete", () => { removePeepFromCrowd(peep); addPeepToCrowd(); });
            peep.walk = walk;
            crowd.push(peep);
            crowd.sort((a, b) => a.anchorY - b.anchorY);
            return peep;
        }

        function removePeepFromCrowd(peep) {
            removeItemFromArray(crowd, peep);
            availablePeeps.push(peep);
        }

        function initCrowd() {
            while (availablePeeps.length) {
                const p = addPeepToCrowd();
                if (p && p.walk) p.walk.progress(Math.random());
            }
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            const dpr = window.devicePixelRatio || 1;
            ctx.scale(dpr, dpr);
            crowd.forEach(p => p.render(ctx));
            ctx.restore();
        }

        function resize() {
            stage.width = canvas.clientWidth;
            stage.height = canvas.clientHeight;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = stage.width * dpr;
            canvas.height = stage.height * dpr;
            crowd.forEach(p => p.walk && p.walk.kill());
            crowd.length = 0; availablePeeps.length = 0;
            availablePeeps.push(...allPeeps);
            initCrowd();
            render();
        }

        // START
        createPeeps();
        resize();
        gsap.ticker.add(render);
        window.addEventListener("resize", resize);
    })();
    </script>
</body>
</html>
