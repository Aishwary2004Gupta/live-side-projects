<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crowd Canvas — No External Images</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #fff; overflow: hidden; height: 100vh; width: 100vw; }
    .container { position: relative; height: 100vh; width: 100%; background: #fff; }
    .heading {
      position: absolute; top: 88px; left: 50%; transform: translateX(-50%);
      text-align: center; z-index: 10;
    }
    .heading span {
      position: relative; font-size: 12px; text-transform: uppercase;
      letter-spacing: 0.04em; opacity: 0.4; max-width: 12ch;
      display: inline-block; line-height: 1.1;
    }
    .heading span::after {
      content: ''; position: absolute; left: 50%; top: 100%;
      height: 64px; width: 1px;
      background: linear-gradient(to bottom, #fff, #000);
      transform: translateX(-50%);
    }
    #crowdCanvas {
      position: absolute; bottom: 0; left: 0;
      width: 100%; height: 90vh; display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="heading"><span>Crowd Canvas</span></div>
    <canvas id="crowdCanvas"></canvas>
  </div>

  <script>
  (function() {
    const rr = (a,b) => a + Math.random()*(b-a);
    const pick = a => a[(Math.random()*a.length)|0];
    const ch = p => Math.random()<p;
    const removeAt = (a,i) => a.splice(i,1)[0];
    const removeRandom = a => removeAt(a,(Math.random()*a.length)|0);

    const INK = "#1a1a1a", WHITE = "#ffffff", LIGHT = "#f0f0f0";
    const FILLS = [INK, WHITE, LIGHT, LIGHT];
    const W = 140, H = 220, S = 2;

    // Draws ONE random character to an offscreen canvas (returns as <canvas>)
    function drawPeep() {
      const c = document.createElement("canvas");
      c.width = W*S; c.height = H*S;
      const g = c.getContext("2d");
      g.scale(S,S);
      g.lineCap = "round"; g.lineJoin = "round";

      const lw = 2.6, cx = 70;
      const headRx = rr(19,26), headRy = rr(23,30), headCy = 62;
      const headTop = headCy - headRy;
      const shoulderY = headCy + headRy + rr(6,16);
      const bodyW = rr(52,76);
      const bodyL = cx - bodyW/2, bodyR = cx + bodyW/2;
      const shirtFill = pick(FILLS);
      const faceOff = headRx * 0.12;

      const hairStyle = pick(["short","buzz","long","afro","curly","bun","ponytail","bangs","spiky","bald"]);
      const hasGlasses = ch(0.35);
      const hasBeard = ch(0.25);
      const hasStripes = shirtFill !== INK && ch(0.2);

      const stroke = fn => { g.strokeStyle=INK; g.lineWidth=lw; g.beginPath(); fn(); g.stroke(); };
      const fill = (color,fn) => { g.fillStyle=color; g.beginPath(); fn(); g.fill(); };
      const fillStroke = (color,fn) => { g.fillStyle=color; g.strokeStyle=INK; g.lineWidth=lw; g.beginPath(); fn(); g.fill(); g.stroke(); };

      // Body
      const rad = 16;
      fillStroke(shirtFill, ()=>{
        g.moveTo(bodyL, H); g.lineTo(bodyL, shoulderY+rad);
        g.quadraticCurveTo(bodyL, shoulderY, bodyL+rad, shoulderY);
        g.lineTo(bodyR-rad, shoulderY);
        g.quadraticCurveTo(bodyR, shoulderY, bodyR, shoulderY+rad);
        g.lineTo(bodyR, H); g.closePath();
      });

      if (hasStripes) {
        g.save(); g.beginPath();
        g.moveTo(bodyL, H); g.lineTo(bodyL, shoulderY+rad);
        g.quadraticCurveTo(bodyL, shoulderY, bodyL+rad, shoulderY);
        g.lineTo(bodyR-rad, shoulderY);
        g.quadraticCurveTo(bodyR, shoulderY, bodyR, shoulderY+rad);
        g.lineTo(bodyR, H); g.closePath(); g.clip();
        g.strokeStyle = INK; g.lineWidth = 2;
        for (let y = shoulderY+14; y < H; y += 11) {
          g.beginPath(); g.moveTo(bodyL-5, y); g.lineTo(bodyR+5, y); g.stroke();
        }
        g.restore();
      }

      // Neck
      fillStroke(WHITE, ()=>{ g.rect(cx-9, headCy+headRy-12, 18, shoulderY-(headCy+headRy)+14); });

      // Head
      fillStroke(WHITE, ()=>{ g.ellipse(cx+faceOff, headCy, headRx, headRy, 0, 0, Math.PI*2); });

      // Hair
      const hairClip = ratio => {
        g.save(); g.beginPath();
        g.ellipse(cx+faceOff, headCy, headRx+0.5, headRy+0.5, 0,0,Math.PI*2); g.clip();
        fill(INK, ()=>{ g.rect(cx+faceOff-headRx-5, headTop-5, headRx*2+10, headRy*ratio+5); });
        g.restore();
      };
      const hairDome = extra => fillStroke(INK, ()=>{ g.ellipse(cx+faceOff, headCy, headRx+extra, headRy+extra, 0, Math.PI, Math.PI*2); });

      if (hairStyle === "short") { hairClip(0.5); hairDome(3); }
      if (hairStyle === "buzz") { hairClip(0.35); hairDome(2); }
      if (hairStyle === "long") { fill(INK, ()=>{ g.ellipse(cx+faceOff, headCy+headRy*0.5, headRx+12, headRy*2, 0,0,Math.PI*2); }); hairClip(0.55); hairDome(3); }
      if (hairStyle === "afro") { fillStroke(INK, ()=>{ g.ellipse(cx+faceOff, headCy-headRy*0.3, headRx*1.6, headRy*1.4, 0,0,Math.PI*2); }); }
      if (hairStyle === "curly") {
        fill(INK, ()=>{ g.ellipse(cx+faceOff, headCy-headRy*0.1, headRx+10, headRy+8, 0,0,Math.PI*2); });
        for (let a=0;a<Math.PI*2;a+=0.4) fill(INK, ()=>{ g.arc(cx+faceOff+Math.cos(a)*(headRx+8), headCy-headRy*0.1+Math.sin(a)*(headRy+8), rr(3,7),0,Math.PI*2); });
      }
      if (hairStyle === "bun") { hairClip(0.5); hairDome(3); fillStroke(INK,()=>{g.arc(cx+faceOff, headTop-5, 10,0,Math.PI*2);}); }
      if (hairStyle === "ponytail") { hairClip(0.5); hairDome(3); fill(INK,()=>{g.moveTo(cx+faceOff-headRx,headCy-headRy*0.3);g.quadraticCurveTo(cx+faceOff-headRx-20,headCy,cx+faceOff-headRx-10,headCy+headRy*1.1);g.closePath();}); }
      if (hairStyle === "bangs") { hairClip(0.5); hairDome(3); fill(INK,()=>{g.rect(cx+faceOff-headRx-2,headTop-2,headRx*2+4,headRy*0.5);}); }
      if (hairStyle === "spiky") {
        hairClip(0.3);
        for (let i=0;i<6;i++){
          const a = Math.PI + (Math.PI*(i+0.5))/6;
          const bx = cx+faceOff+Math.cos(a)*(headRx+1), by = headCy+Math.sin(a)*(headRy+1);
          fillStroke(INK,()=>{g.moveTo(bx-3,by+2);g.lineTo(bx+Math.cos(a)*15,by+Math.sin(a)*15);g.lineTo(bx+3,by+2);g.closePath();});
        }
      }

      // Beard
      if (hasBeard) {
        g.save(); g.beginPath(); g.ellipse(cx+faceOff, headCy, headRx+2, headRy+2, 0,0,Math.PI*2); g.clip();
        fill(INK, ()=>{ g.rect(cx+faceOff-headRx-5, headCy+headRy*0.15, headRx*2+10, headRy); });
        g.restore();
      }

      // Face features
      const eyeX = cx+faceOff+headRx*0.3, eyeY = headCy-headRy*0.05;
      fill(INK, ()=>{ g.ellipse(eyeX, eyeY, 2.5, 3, 0,0,Math.PI*2); });
      fill(INK, ()=>{ g.ellipse(cx+faceOff-headRx*0.15, eyeY, 2, 2.4, 0,0,Math.PI*2); });
      stroke(()=>{ g.arc(eyeX-2, headCy+headRy*0.42, 5, Math.PI*0.1, Math.PI*0.7); }); // smile

      if (hasGlasses) {
        g.strokeStyle=INK; g.lineWidth=2.2;
        g.beginPath(); g.arc(eyeX, eyeY, 8, 0, Math.PI*2); g.stroke();
        g.beginPath(); g.moveTo(eyeX-8,eyeY); g.lineTo(cx-headRx+2,eyeY); g.stroke();
      }

      // redraw outline
      stroke(()=>{ g.ellipse(cx+faceOff, headCy, headRx, headRy, 0,0,Math.PI*2); });

      return c;
    }

    class Peep {
      constructor(sprite) {
        this.image = sprite;
        const s = rr(0.5, 1.15);
        this.width = W*s; this.height = H*s;
        this.x=0; this.y=0; this.anchorY=0; this.scaleX=1; this.walk=null;
      }
      render(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.scale(this.scaleX, 1);
        ctx.drawImage(this.image, 0,0,this.image.width,this.image.height, 0,0,this.width,this.height);
        ctx.restore();
      }
    }

    const canvas = document.getElementById("crowdCanvas");
    const ctx = canvas.getContext("2d");
    const COUNT = 220;
    const stage = { width:0, height:0 };
    let dpr = window.devicePixelRatio || 1;
    const allPeeps=[], availablePeeps=[], crowd=[];

    const resetPeep = ({stage,peep}) => {
      const dir = Math.random()>0.5?1:-1;
      const offsetY = 100 - 250*gsap.parseEase("power2.in")(Math.random());
      const startY = stage.height - peep.height + offsetY;
      let startX, endX;
      if (dir===1){startX=-peep.width;endX=stage.width;peep.scaleX=1;}
      else{startX=stage.width+peep.width;endX=0;peep.scaleX=-1;}
      peep.x=startX; peep.y=startY; peep.anchorY=startY;
      return {startX,startY,endX};
    };

    const normalWalk = ({peep,props}) => {
      const {startY,endX} = props;
      const xD=10, yD=0.25;
      const tl = gsap.timeline();
      tl.timeScale(rr(0.5,1.5));
      tl.to(peep,{duration:xD,x:endX,ease:"none"},0);
      tl.to(peep,{duration:yD,repeat:xD/yD,yoyo:true,y:startY-10,ease:"sine.inOut"},0);
      return tl;
    };

    function addPeep() {
      if (!availablePeeps.length) return null;
      const peep = removeRandom(availablePeeps);
      const walk = normalWalk({peep,props:resetPeep({peep,stage})})
        .eventCallback("onComplete", ()=>{ removePeep(peep); addPeep(); });
      peep.walk = walk;
      crowd.push(peep);
      crowd.sort((a,b)=>a.anchorY-b.anchorY);
      return peep;
    }
    function removePeep(peep){ const i=crowd.indexOf(peep); if(i!==-1)crowd.splice(i,1); availablePeeps.push(peep); }
    function initCrowd(){ while(availablePeeps.length){ const p=addPeep(); if(p&&p.walk)p.walk.progress(Math.random()); } }
    function render(){ ctx.clearRect(0,0,canvas.width,canvas.height); ctx.save(); ctx.scale(dpr,dpr); crowd.forEach(p=>p.render(ctx)); ctx.restore(); }
    function resize(){
      dpr = window.devicePixelRatio||1;
      stage.width = canvas.clientWidth; stage.height = canvas.clientHeight;
      canvas.width = stage.width*dpr; canvas.height = stage.height*dpr;
      crowd.forEach(p=>p.walk&&p.walk.kill());
      crowd.length=0; availablePeeps.length=0; availablePeeps.push(...allPeeps);
      initCrowd(); render();
    }

    for (let i=0;i<COUNT;i++) allPeeps.push(new Peep(drawPeep()));
    resize();
    gsap.ticker.add(render);
    window.addEventListener("resize", resize);
  })();
  </script>
</body>
</html>
