<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Crowd Canvas - Skiper UI</title>
  <!-- GSAP Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #fff; font-family: sans-serif; overflow: hidden; height: 100vh; width: 100vw; }
    
    /* Layout */
    .wrapper { position: relative; width: 100%; height: 100%; background: #fff; color: #000; }
    
    /* Header Text Styles */
    .header { 
      position: absolute; top: 5.5rem; left: 50%; 
      transform: translateX(-50%); z-index: 10; 
      text-align: center; display: flex; flex-direction: column; align-items: center; gap: 1.5rem;
    }
    .text-label {
      max-width: 12ch;
      font-size: 12px;
      line-height: 1.1;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      opacity: 0.4;
      position: relative;
    }
    .text-label::after {
      content: "";
      position: absolute;
      top: 100%; left: 50%;
      width: 1px; height: 4rem;
      background: linear-gradient(to bottom, #fff, #000);
    }

    /* Canvas positioning */
    canvas {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 90vh;
      display: block;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <span class="text-label">Crowd Canvas</span>
    </div>
    <canvas id="crowdCanvas"></canvas>
  </div>
