<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Circle Mosaic Physics</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        background: #07070a;
        color: #e8e8ef;
        font:
          13px/1.3 system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        display: flex;
        flex-direction: column;
        padding: 8px;
        gap: 8px;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 12px;
        background: #101016;
        border: 1px solid #23232e;
        border-radius: 10px;
        flex-shrink: 0;
        flex-wrap: wrap;
      }

      .header h1 {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.3px;
        margin-right: auto;
      }

      .main {
        display: flex;
        gap: 8px;
        flex: 1;
        min-height: 0;
      }

      .canvas-box {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: #101016;
        border: 1px solid #23232e;
        border-radius: 10px;
        overflow: hidden;
        min-width: 0;
      }

      .canvas-box .label {
        padding: 5px 10px;
        font-size: 11px;
        color: #7a7a92;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        border-bottom: 1px solid #23232e;
        flex-shrink: 0;
        display: flex;
        justify-content: space-between;
      }

      .canvas-box .label b {
        color: #cfcfe4;
        font-weight: 500;
      }

      .stage {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
      }

      .canvas-box canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #000;
        object-fit: contain;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        align-items: center;
        padding: 8px 12px;
        background: #101016;
        border: 1px solid #23232e;
        border-radius: 10px;
        flex-shrink: 0;
      }

      button {
        background: #1b1b24;
        color: #fff;
        border: 1px solid #33334a;
        border-radius: 7px;
        padding: 6px 11px;
        cursor: pointer;
        font-size: 12px;
        transition: 0.15s;
      }

      button:hover {
        background: #26263a;
      }

      button.primary {
        background: #2d5cff;
        border-color: #2d5cff;
      }

      button.primary:hover {
        background: #4571ff;
      }

      .ctrl {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        color: #a9a9bd;
      }

      input[type="checkbox"] {
        accent-color: #2d5cff;
        width: 13px;
        height: 13px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        height: 24px;
        padding: 0 10px;
        border-radius: 999px;
        background: #181824;
        border: 1px solid #2a2a3c;
        color: #d8d8ea;
        font-size: 11px;
      }

      #palette {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }

      .sw {
        width: 38px;
        border-radius: 5px;
        overflow: hidden;
        border: 1px solid #2a2a38;
      }

      .sw i {
        display: block;
        height: 20px;
      }

      .sw span {
        display: block;
        font-size: 8px;
        color: #9a9ab0;
        padding: 2px 0;
        background: #101016;
        text-align: center;
      }

      #status {
        font-size: 11px;
        color: #7f8ca8;
        font-variant-numeric: tabular-nums;
        margin-left: auto;
        white-space: nowrap;
      }

      @media (max-width: 700px) {
        .main {
          flex-direction: column;
        }

        .header h1 {
          font-size: 13px;
        }

        #status {
          width: 100%;
          margin-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>◉ Circle Mosaic</h1>
      <button class="primary" id="pickBtn">Choose Image</button>
      <button id="sampleBtn">Use Sample</button>
      <input type="file" id="file" accept="image/*" hidden />
      <button id="playBtn">Pause</button>
      <button id="resetBtn">Restart</button>
      <button id="saveBtn">Save PNG</button>
    </div>

    <div class="main">
      <div class="canvas-box">
        <div class="label"><b>Original</b><span id="srcInfo">—</span></div>
        <div class="stage" id="srcStage">
          <canvas id="srcCanvas"></canvas>
        </div>
      </div>

      <div class="canvas-box">
        <div class="label"><b>Circle Mosaic</b><span id="mosInfo">—</span></div>
        <div class="stage" id="mosStage">
          <canvas id="c"></canvas>
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="pill">Detail: Auto Max</div>
      <div class="pill" id="countPill">Circles: 0</div>
      <div class="ctrl"><input type="checkbox" id="snap" /> Palette</div>
      <div class="ctrl"><input type="checkbox" id="ghost" /> Ghost</div>
      <div id="palette"></div>
      <div id="status">Loading sample…</div>
    </div>

    <script>
      const TAU = Math.PI * 2;
      const DPR_LIMIT = 1.5;

      let W = 500, H = 500;

      const ANIM = {
        DT: 1 / 60,
        SUBSTEPS: 2,
        PULL: 130,
        DRAG: 0.84,
        MAX_ACC: 52000,
        SNAP_DIST: 0.45,
        SNAP_SPEED: 0.05,
        SNAP_FRAMES: 6
      };

      const S = {
        snap: false,
        ghost: false
      };

      const canvas = document.getElementById("c");
      const srcCanvas = document.getElementById("srcCanvas");
      const ctx = canvas.getContext("2d");
      const sctx = srcCanvas.getContext("2d", { willReadFrequently: true });

      const el = {
        file: document.getElementById("file"),
        pick: document.getElementById("pickBtn"),
        sample: document.getElementById("sampleBtn"),
        play: document.getElementById("playBtn"),
        reset: document.getElementById("resetBtn"),
        save: document.getElementById("saveBtn"),
        snap: document.getElementById("snap"),
        ghost: document.getElementById("ghost"),
        palette: document.getElementById("palette"),
        status: document.getElementById("status"),
        srcInfo: document.getElementById("srcInfo"),
        mosInfo: document.getElementById("mosInfo"),
        countPill: document.getElementById("countPill"),
        srcStage: document.getElementById("srcStage"),
        mosStage: document.getElementById("mosStage")
      };

      const src = {
        loaded: false,
        image: null,
        label: "sample",
        data: null,
        palette: [],
        bg: [7, 7, 10],
        fit: { x: 0, y: 0, w: 0, h: 0 }
      };

      let balls = [];
      let phase = "IDLE";
      let running = true;
      let settled = 0;
      let last = 0;
      let fps = 60;

      const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
      const lum = (c) => c[0] * 0.299 + c[1] * 0.587 + c[2] * 0.114;
      const hex = (c) =>
        "#" + c.map((v) => v.toString(16).padStart(2, "0")).join("").toUpperCase();

      function resizeCanvases() {
        const dpr = Math.min(window.devicePixelRatio || 1, DPR_LIMIT);
        const a = el.srcStage.getBoundingClientRect();
        const b = el.mosStage.getBoundingClientRect();
        const size = Math.max(220, Math.floor(Math.min(a.width, a.height, b.width, b.height)));
        const px = Math.max(220, Math.floor(size * dpr));

        if (px === W && px === H) return;

        W = px;
        H = px;
        canvas.width = W;
        canvas.height = H;
        srcCanvas.width = W;
        srcCanvas.height = H;

        if (src.loaded) {
          redrawSource();
          analyseColors();
          restart();
        } else {
          render();
        }
      }

      window.addEventListener("resize", () => {
        clearTimeout(resizeCanvases._t);
        resizeCanvases._t = setTimeout(resizeCanvases, 80);
      });

      function setStatus(msg) {
        if (msg) {
          el.status.textContent = msg;
          return;
        }
        const state =
          phase === "IDLE" ? "idle" :
          phase === "ASSEMBLE" ? (running ? "assembling" : "paused") :
          "complete";

        el.status.textContent =
          `${state} · circles: ${balls.length} · settled: ${settled}/${balls.length} · palette: ${src.palette.length} · ${fps.toFixed(0)} fps`;
      }

      function redrawSource() {
        if (!src.image) return;

        sctx.fillStyle = "#000";
        sctx.fillRect(0, 0, W, H);

        const img = src.image;
        const scale = Math.min(W / img.width, H / img.height);
        const dw = img.width * scale;
        const dh = img.height * scale;
        const dx = (W - dw) / 2;
        const dy = (H - dh) / 2;

        src.fit = { x: dx, y: dy, w: dw, h: dh };
        sctx.drawImage(img, dx, dy, dw, dh);
        src.data = sctx.getImageData(0, 0, W, H).data;
        src.loaded = true;
        el.srcInfo.textContent = `${src.label} · ${img.width}×${img.height}`;
      }

      function useImage(img, label = "image") {
        src.image = img;
        src.label = label;
        redrawSource();
        analyseColors();
        restart();
      }

      function loadImage(file) {
        const img = new Image();
        img.onload = () => {
          useImage(img, file.name);
          URL.revokeObjectURL(img.src);
        };
        img.onerror = () => setStatus("Could not read that image.");
        img.src = URL.createObjectURL(file);
      }

      function analyseColors() {
        if (!src.data) return;

        const d = src.data;
        const px = [];
        const left = Math.floor(src.fit.x);
        const top = Math.floor(src.fit.y);
        const right = Math.ceil(src.fit.x + src.fit.w);
        const bottom = Math.ceil(src.fit.y + src.fit.h);

        for (let y = top; y < bottom; y += 5) {
          for (let x = left; x < right; x += 5) {
            const i = (y * W + x) * 4;
            px.push([d[i], d[i + 1], d[i + 2]]);
          }
        }

        src.palette = medianCut(px, 10);

        let dark = src.palette[0], best = 1e9;
        for (const c of src.palette) {
          const l = lum(c);
          if (l < best) {
            best = l;
            dark = c;
          }
        }

        src.bg = [
          (dark[0] * 0.22) | 0,
          (dark[1] * 0.22) | 0,
          (dark[2] * 0.22) | 0
        ];

        renderSwatches();
      }

      function medianCut(pixels, k) {
        if (!pixels.length) return [[200, 200, 200]];
        let boxes = [pixels];
        let guard = 0;

        while (boxes.length < k && guard++ < 64) {
          boxes.sort((a, b) => boxSpan(b) - boxSpan(a));
          const box = boxes.shift();
          if (!box || box.length < 2) {
            if (box) boxes.push(box);
            break;
          }
          const ch = widestChannel(box);
          box.sort((p, q) => p[ch] - q[ch]);
          const mid = box.length >> 1;
          boxes.push(box.slice(0, mid), box.slice(mid));
        }

        return boxes.map(avgColor).sort((a, b) => lum(b) - lum(a));
      }

      function channelRange(box, c) {
        let lo = 255, hi = 0;
        for (const p of box) {
          if (p[c] < lo) lo = p[c];
          if (p[c] > hi) hi = p[c];
        }
        return hi - lo;
      }

      function widestChannel(box) {
        const r = channelRange(box, 0);
        const g = channelRange(box, 1);
        const b = channelRange(box, 2);
        return r >= g && r >= b ? 0 : g >= b ? 1 : 2;
      }

      function boxSpan(box) {
        return Math.max(
          channelRange(box, 0),
          channelRange(box, 1),
          channelRange(box, 2)
        ) * Math.log(box.length + 1);
      }

      function avgColor(box) {
        let r = 0, g = 0, b = 0;
        for (const p of box) {
          r += p[0];
          g += p[1];
          b += p[2];
        }
        const n = box.length || 1;
        return [(r / n) | 0, (g / n) | 0, (b / n) | 0];
      }

      function renderSwatches() {
        el.palette.innerHTML = "";
        for (const c of src.palette) {
          const d = document.createElement("div");
          d.className = "sw";
          d.innerHTML = `<i style="background:rgb(${c[0]},${c[1]},${c[2]})"></i><span>${hex(c)}</span>`;
          el.palette.appendChild(d);
        }
      }

      const TAPS = [
        [0, 0],
        [0.62, 0],
        [-0.62, 0],
        [0, 0.62],
        [0, -0.62],
        [0.45, 0.45],
        [-0.45, 0.45],
        [0.45, -0.45],
        [-0.45, -0.45]
      ];

      function nearestPalette(c) {
        let best = src.palette[0], bd = 1e9;
        for (const p of src.palette) {
          const dr = p[0] - c[0];
          const dg = p[1] - c[1];
          const db = p[2] - c[2];
          const dd = dr * dr + dg * dg + db * db;
          if (dd < bd) {
            bd = dd;
            best = p;
          }
        }
        return best;
      }

      function sampleColor(x, y, r) {
        const d = src.data;
        const left = Math.floor(src.fit.x);
        const top = Math.floor(src.fit.y);
        const right = Math.ceil(src.fit.x + src.fit.w - 1);
        const bottom = Math.ceil(src.fit.y + src.fit.h - 1);

        let R = 0, G = 0, B = 0;

        for (const [ox, oy] of TAPS) {
          const px = clamp(Math.round(x + ox * r), left, right);
          const py = clamp(Math.round(y + oy * r), top, bottom);
          const i = (py * W + px) * 4;
          R += d[i];
          G += d[i + 1];
          B += d[i + 2];
        }

        let c = [(R / 9) | 0, (G / 9) | 0, (B / 9) | 0];
        if (S.snap && src.palette.length) c = nearestPalette(c);
        return c;
      }

      function buildHexTargets() {
        const rect = src.fit;
        const area = rect.w * rect.h;

        // auto max detail based on displayed image area
        const targetCount = clamp(Math.round(area / 24), 5000, 14000);

        const hexFactor = Math.sqrt(3) / 2;
        const spacing = Math.sqrt(area / (targetCount * hexFactor));
        const rowStep = spacing * hexFactor;

        // slightly oversized radius so image coverage has no visible holes
        const radius = Math.max(1.2, (spacing / Math.sqrt(3)) * 1.10);

        const out = [];
        let row = 0;

        for (let y = rect.y - radius; y <= rect.y + rect.h + radius; y += rowStep, row++) {
          const off = (row & 1) ? spacing * 0.5 : 0;
          for (let x = rect.x - radius + off; x <= rect.x + rect.w + radius; x += spacing) {
            if (x + radius < rect.x || x - radius > rect.x + rect.w) continue;
            if (y + radius < rect.y || y - radius > rect.y + rect.h) continue;
            out.push({ x, y, r: radius });
          }
        }

        return out;
      }

      class Ball {
        constructor(target) {
          this.tx = target.x;
          this.ty = target.y;
          this.r = target.r;

          const side = (Math.random() * 4) | 0;
          if (side === 0) {
            this.x = Math.random() * W;
            this.y = -20 - Math.random() * H * 0.4;
          } else if (side === 1) {
            this.x = W + 20 + Math.random() * W * 0.4;
            this.y = Math.random() * H;
          } else if (side === 2) {
            this.x = Math.random() * W;
            this.y = H + 20 + Math.random() * H * 0.4;
          } else {
            this.x = -20 - Math.random() * W * 0.4;
            this.y = Math.random() * H;
          }

          const vx = (Math.random() - 0.5) * 6;
          const vy = (Math.random() - 0.5) * 6;
          this.px = this.x - vx;
          this.py = this.y - vy;

          this.fixed = false;
          this.still = 0;

          this.setColor(sampleColor(this.tx, this.ty, this.r));
        }

        setColor(c) {
          this.c = c;
          this.css = `rgb(${c[0]},${c[1]},${c[2]})`;
        }
      }

      function buildBalls() {
        const targets = buildHexTargets();
        balls = targets.map((t) => new Ball(t));
        settled = 0;
        el.countPill.textContent = `Circles: ${balls.length}`;
        el.mosInfo.textContent = `${balls.length} circles`;
      }

      function recolorAll() {
        for (const b of balls) b.setColor(sampleColor(b.tx, b.ty, b.r));
      }

      function physicsStep() {
        const sub = ANIM.DT / ANIM.SUBSTEPS;
        settled = 0;

        for (let s = 0; s < ANIM.SUBSTEPS; s++) {
          for (const b of balls) {
            if (b.fixed) {
              settled++;
              continue;
            }

            let ax = (b.tx - b.x) * ANIM.PULL;
            let ay = (b.ty - b.y) * ANIM.PULL;
            ax = clamp(ax, -ANIM.MAX_ACC, ANIM.MAX_ACC);
            ay = clamp(ay, -ANIM.MAX_ACC, ANIM.MAX_ACC);

            const vx = (b.x - b.px) * ANIM.DRAG;
            const vy = (b.y - b.py) * ANIM.DRAG;

            b.px = b.x;
            b.py = b.y;

            b.x += vx + ax * sub * sub;
            b.y += vy + ay * sub * sub;

            const dist = Math.hypot(b.tx - b.x, b.ty - b.y);
            const speed = Math.abs(b.x - b.px) + Math.abs(b.y - b.py);

            if (dist < ANIM.SNAP_DIST && speed < ANIM.SNAP_SPEED) {
              b.still++;
              if (b.still >= ANIM.SNAP_FRAMES) {
                b.fixed = true;
                b.x = b.tx;
                b.y = b.ty;
                b.px = b.tx;
                b.py = b.ty;
                settled++;
              }
            } else {
              b.still = 0;
            }
          }
        }

        if (balls.length && settled >= balls.length) {
          phase = "DONE";
          running = false;
          el.play.textContent = "Restart";
          render();
          setStatus();
        }
      }

      function render() {
        ctx.fillStyle = `rgb(${src.bg[0]},${src.bg[1]},${src.bg[2]})`;
        ctx.fillRect(0, 0, W, H);

        if (S.ghost && src.loaded) {
          ctx.globalAlpha = 0.14;
          ctx.drawImage(srcCanvas, 0, 0);
          ctx.globalAlpha = 1;
        }

        if (src.loaded) {
          ctx.save();
          ctx.beginPath();
          ctx.rect(src.fit.x, src.fit.y, src.fit.w, src.fit.h);
          ctx.clip();
        }

        for (const b of balls) {
          ctx.fillStyle = b.css;
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r, 0, TAU);
          ctx.fill();
        }

        if (src.loaded) ctx.restore();
      }

      function restart() {
        if (!src.loaded) return;
        buildBalls();
        phase = "ASSEMBLE";
        running = true;
        last = 0;
        el.play.textContent = "Pause";
        render();
        setStatus();
      }

      function savePNG() {
        render();
        const a = document.createElement("a");
        a.download = "circle-mosaic.png";
        a.href = canvas.toDataURL("image/png");
        a.click();
      }

      function loop(ts) {
        requestAnimationFrame(loop);

        if (!last) last = ts;
        const dt = Math.min(0.05, (ts - last) / 1000);
        last = ts;
        fps = fps * 0.9 + (1 / Math.max(dt, 1e-4)) * 0.1;

        if (phase === "ASSEMBLE" && running) {
          physicsStep();
          render();
          setStatus();
        }
      }

      function generateSampleImage() {
        const img = document.createElement("canvas");
        img.width = 900;
        img.height = 600;
        const c = img.getContext("2d");

        const sky = c.createLinearGradient(0, 0, 0, 600);
        sky.addColorStop(0, "#0b1338");
        sky.addColorStop(0.28, "#35256d");
        sky.addColorStop(0.48, "#ff6b6b");
        sky.addColorStop(0.62, "#ffb36b");
        sky.addColorStop(0.70, "#1f143f");
        sky.addColorStop(1, "#06060d");
        c.fillStyle = sky;
        c.fillRect(0, 0, 900, 600);

        for (let i = 0; i < 120; i++) {
          c.globalAlpha = Math.random() * 0.8 + 0.2;
          c.fillStyle = "#fff";
          const s = Math.random() * 2 + 0.5;
          c.fillRect(Math.random() * 900, Math.random() * 180, s, s);
        }
        c.globalAlpha = 1;

        const sunX = 650, sunY = 260;
        const glow = c.createRadialGradient(sunX, sunY, 20, sunX, sunY, 150);
        glow.addColorStop(0, "rgba(255,245,210,1)");
        glow.addColorStop(.35, "rgba(255,210,120,.92)");
        glow.addColorStop(.7, "rgba(255,120,70,.26)");
        glow.addColorStop(1, "rgba(255,120,70,0)");
        c.fillStyle = glow;
        c.fillRect(0, 0, 900, 600);

        c.fillStyle = "#fff5d7";
        c.beginPath();
        c.arc(sunX, sunY, 58, 0, TAU);
        c.fill();

        c.fillStyle = "#20134b";
        c.beginPath();
        c.moveTo(0, 350);
        for (let px = 0; px <= 900; px += 65) {
          c.lineTo(px, 350 - Math.random() * 100 - 20);
        }
        c.lineTo(900, 600);
        c.lineTo(0, 600);
        c.closePath();
        c.fill();

        c.fillStyle = "#120b30";
        c.beginPath();
        c.moveTo(0, 410);
        for (let px = 0; px <= 900; px += 50) {
          c.lineTo(px, 410 - Math.random() * 85 - 10);
        }
        c.lineTo(900, 600);
        c.lineTo(0, 600);
        c.closePath();
        c.fill();

        const lake = c.createLinearGradient(0, 420, 0, 600);
        lake.addColorStop(0, "#ff996c");
        lake.addColorStop(.25, "#7a376b");
        lake.addColorStop(1, "#080811");
        c.fillStyle = lake;
        c.fillRect(0, 420, 900, 180);

        for (let i = 0; i < 36; i++) {
          const yy = 430 + i * 4 + Math.random() * 2;
          const ww = 120 - i * 1.7 + Math.random() * 44;
          c.globalAlpha = Math.max(0, 0.48 - i * 0.012);
          c.fillStyle = "#ffe6bc";
          c.fillRect(sunX - ww / 2, yy, ww, 3);
        }
        c.globalAlpha = 1;

        c.fillStyle = "#07070a";
        c.beginPath();
        c.moveTo(135, 600);
        c.lineTo(160, 360);
        c.lineTo(180, 600);
        c.closePath();
        c.fill();

        for (let i = 0; i < 22; i++) {
          c.strokeStyle = "#07070a";
          c.lineWidth = 2 + Math.random() * 2;
          c.beginPath();
          c.moveTo(160, 390);
          c.lineTo(100 + Math.random() * 120, 280 + Math.random() * 170);
          c.stroke();
        }

        return img;
      }

      el.pick.onclick = () => el.file.click();

      el.file.onchange = (e) => {
        const f = e.target.files[0];
        if (f) loadImage(f);
      };

      el.sample.onclick = () => {
        useImage(generateSampleImage(), "sample landscape");
      };

      el.play.onclick = () => {
        if (!src.loaded) return;
        if (phase === "DONE") {
          restart();
          return;
        }
        running = !running;
        el.play.textContent = running ? "Pause" : "Resume";
        setStatus();
      };

      el.reset.onclick = () => restart();
      el.save.onclick = savePNG;

      el.snap.onchange = (e) => {
        S.snap = e.target.checked;
        recolorAll();
        render();
      };

      el.ghost.onchange = (e) => {
        S.ghost = e.target.checked;
        render();
      };

      document.body.addEventListener("dragover", (e) => e.preventDefault());
      document.body.addEventListener("drop", (e) => {
        e.preventDefault();
        const f = e.dataTransfer.files[0];
        if (f && f.type.startsWith("image/")) loadImage(f);
      });

      window.addEventListener("paste", (e) => {
        for (const item of e.clipboardData.items) {
          if (item.type.startsWith("image/")) {
            loadImage(item.getAsFile());
            break;
          }
        }
      });

      resizeCanvases();
      useImage(generateSampleImage(), "sample landscape");
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
