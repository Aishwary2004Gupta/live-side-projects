<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circle Mosaic — Stable Assembly</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#06070f;color:#e8eaf2;font-family:Inter,system-ui,sans-serif;min-height:100vh}
  .app{display:flex;gap:18px;max-width:1180px;margin:0 auto;padding:18px;align-items:flex-start}
  .panel{width:340px;background:rgba(255,255,255,.06);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:18px;flex-shrink:0}
  .panel h1{font-size:20px;margin-bottom:4px}
  .panel p.sub{font-size:13px;color:#9aa0b5;margin-bottom:14px;line-height:1.4}
  .upload-box{border:2px dashed rgba(255,255,255,.22);border-radius:12px;padding:16px;text-align:center;cursor:pointer;transition:.2s;background:rgba(255,255,255,.03)}
  .upload-box:hover,.upload-box.drag{border-color:#7ee787;background:rgba(126,231,135,.08)}
  .upload-box b{display:block;font-size:14px}
  .upload-box span{font-size:12px;color:#9aa0b5}
  #fileName{font-size:12px;color:#7ee787;margin-top:6px;word-break:break-all}
  .preset-row{display:flex;gap:6px;margin-top:10px}
  .preset-row button{flex:1;font-size:12px;padding:8px 4px}
  h3{font-size:12px;letter-spacing:.12em;color:#9aa0b5;margin:16px 0 8px;text-transform:uppercase}
  #palette{display:flex;gap:8px;flex-wrap:wrap;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px;min-height:62px}
  .swatch-wrap{text-align:center}
  .swatch{width:32px;height:32px;border-radius:9px;border:2px solid rgba(255,255,255,.25);box-shadow:0 2px 10px rgba(0,0,0,.5)}
  .hex{font-size:9px;color:#aaa;margin-top:3px;font-family:monospace}
  .control-row{margin:12px 0}
  .control-row label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;color:#d0d4e3}
  .control-row label b{color:#ffd86e;font-family:monospace}
  input[type=range]{width:100%;accent-color:#7ee787;cursor:pointer}
  select{width:100%;padding:9px;border-radius:10px;background:#111320;color:#fff;border:1px solid #2a2e45;font-size:13px}
  .checks{display:flex;gap:14px;margin-top:10px;font-size:13px}
  .checks label{display:flex;gap:6px;align-items:center;cursor:pointer}
  .checks input{accent-color:#7ee787;width:16px;height:16px}
  .btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  button{padding:10px;border-radius:11px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);color:#fff;cursor:pointer;font-weight:700;font-size:13px;transition:.15s}
  button:hover{background:rgba(255,255,255,.15);transform:translateY(-1px)}
  button.primary{background:#7ee787;color:#000;border:none}
  button.warn{background:rgba(255,100,100,.15);border-color:rgba(255,100,100,.4)}
  .stats{display:flex;justify-content:space-between;margin-top:14px;font-size:13px;color:#9aa0b5;background:rgba(0,0,0,.3);padding:8px 12px;border-radius:10px}
  .stats b{color:#fff;font-family:monospace}
  .hint{font-size:12px;color:#777d95;margin-top:10px;line-height:1.5}
  .canvas-wrap{flex:1;display:flex;justify-content:center;position:sticky;top:18px}
  canvas{width:min(700px,100%);height:auto;aspect-ratio:1/1;background:#000;border-radius:18px;box-shadow:0 20px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.1);cursor:crosshair;touch-action:none}
  @media(max-width:920px){.app{flex-direction:column}.panel{width:100%}.canvas-wrap{position:static;width:100%}}
</style>
</head>
<body>
<div class="app">
  <div class="panel">
    <h1>◉ Circle Mosaic</h1>
    <p class="sub">Upload an image → circles assemble and lock into place.</p>

    <div class="upload-box" id="dropZone">
      <b>📁 Drop image or click</b>
      <span>JPG / PNG / WEBP</span>
      <div id="fileName">default: sunset</div>
      <input type="file" id="fileInput" accept="image/*" hidden>
    </div>

    <div class="preset-row">
      <button data-preset="sunset">🌅 Sunset</button>
      <button data-preset="neon">💠 Neon</button>
      <button data-preset="geo">🎯 Geo</button>
    </div>

    <h3>Detected Palette</h3>
    <div id="palette"><div style="color:#666;font-size:12px">analyzing…</div></div>

    <h3>Detail & Physics</h3>
    <div class="control-row">
      <label>Circle count <b id="detailVal">5000</b></label>
      <input type="range" id="detail" min="1500" max="9000" step="100" value="5000">
    </div>
    <div class="control-row">
      <label>Circle size <b id="psizeVal">1.00×</b></label>
      <input type="range" id="psize" min="0.7" max="1.3" step="0.05" value="1">
    </div>
    <div class="control-row">
      <label>Color mode</label>
      <select id="colorMode">
        <option value="full" selected>True colors (sampled)</option>
        <option value="8">Palette 8 colors</option>
        <option value="5">Palette 5 colors</option>
      </select>
    </div>
    <div class="control-row">
      <label>Assembly speed <b id="speedVal">1.0×</b></label>
      <input type="range" id="speed" min="0.3" max="2.5" step="0.1" value="1">
    </div>

    <div class="checks">
      <label><input type="checkbox" id="collisions" checked> Collisions</label>
      <label><input type="checkbox" id="showOrig"> Show original</label>
    </div>

    <div class="btn-grid">
      <button id="btnAssemble" class="primary">◉ Assemble</button>
      <button id="btnDrop">⬇ Drop</button>
      <button id="btnFloat">☁ Float</button>
      <button id="btnExplode" class="warn">💥 Explode</button>
      <button id="btnScatter">🔀 Scatter</button>
      <button id="btnPause">⏸ Pause</button>
    </div>

    <div class="stats"><div>Count: <b id="countDisplay">0</b></div><div>Settled: <b id="settledDisplay">0</b></div></div>
    <div class="hint">Circles lock when they reach their target. Click/drag to push them.</div>
  </div>

  <div class="canvas-wrap"><canvas id="c" width="700" height="700"></canvas></div>
</div>

<script>
const W=700,H=700,DT=1/60;
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const offCanvas=document.createElement('canvas');
offCanvas.width=W;offCanvas.height=H;
const offCtx=offCanvas.getContext('2d',{willReadFrequently:true});

let particles=[];
let sourceImageData=null;
let palette=[];
let mode='assemble';
let gravity=0;
let collisionsOn=true;
let showOriginal=false;
let paused=false;
let assemblySpeed=1;
let settledCount=0;
let mouse={x:0,y:0,down:false,r:140,str:120000};

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function rgbToHex(r,g,b){return'#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');}

/* Palette detection */
function extractPalette(imgData,k){
  const data=imgData.data;
  const samples=[];
  for(let y=0;y<H;y+=5){
    for(let x=0;x<W;x+=5){
      const i=(y*W+x)*4;
      if(data[i+3]<10)continue;
      samples.push([data[i],data[i+1],data[i+2]]);
    }
  }
  if(!samples.length)return[{r:255,g:255,b:255,count:1}];
  let centroids=[];
  for(let c=0;c<k;c++)centroids.push([...samples[Math.floor(Math.random()*samples.length)]]);
  let counts=new Array(k).fill(0);
  for(let iter=0;iter<15;iter++){
    let sums=Array.from({length:k},()=>[0,0,0,0]);
    for(let s=0;s<samples.length;s++){
      const px=samples[s];
      let best=0,bestD=Infinity;
      for(let c=0;c<k;c++){
        const cc=centroids[c];
        const dr=px[0]-cc[0],dg=px[1]-cc[1],db=px[2]-cc[2];
        const d=dr*dr+dg*dg+db*db;
        if(d<bestD){bestD=d;best=c;}
      }
      sums[best][0]+=px[0];sums[best][1]+=px[1];sums[best][2]+=px[2];sums[best][3]++;
    }
    for(let c=0;c<k;c++){
      if(sums[c][3]>0){
        centroids[c][0]=Math.round(sums[c][0]/sums[c][3]);
        centroids[c][1]=Math.round(sums[c][1]/sums[c][3]);
        centroids[c][2]=Math.round(sums[c][2]/sums[c][3]);
        counts[c]=sums[c][3];
      }
    }
  }
  let pal=centroids.map((c,i)=>({r:c[0],g:c[1],b:c[2],count:counts[i]}));
  pal.sort((a,b)=>b.count-a.count);
  return pal;
}

function renderPalette(){
  const div=document.getElementById('palette');
  div.innerHTML='';
  if(!palette.length){div.innerHTML='<div style="color:#666;font-size:12px">no image</div>';return;}
  const total=palette.reduce((s,p)=>s+p.count,0)||1;
  palette.forEach(p=>{
    const hex=rgbToHex(p.r,p.g,p.b);
    const wrap=document.createElement('div');
    wrap.className='swatch-wrap';
    wrap.title=hex+' — '+Math.round(p.count/total*100)+'%';
    const sw=document.createElement('div');
    sw.className='swatch';
    sw.style.background=`rgb(${p.r},${p.g},${p.b})`;
    const lab=document.createElement('div');
    lab.className='hex';
    lab.textContent=hex;
    wrap.appendChild(sw);wrap.appendChild(lab);
    div.appendChild(wrap);
  });
}

function sampleColor(x,y){
  x=clamp(Math.floor(x),2,W-3);y=clamp(Math.floor(y),2,H-3);
  const d=sourceImageData.data;
  let r=0,g=0,b=0,n=0;
  for(let oy=-2;oy<=2;oy++)for(let ox=-2;ox<=2;ox++){
    const idx=((y+oy)*W+(x+ox))*4;
    r+=d[idx];g+=d[idx+1];b+=d[idx+2];n++;
  }
  return{r:Math.round(r/n),g:Math.round(g/n),b:Math.round(b/n)};
}

function quantize(c,limit){
  let best=palette[0],bestD=Infinity;
  const n=Math.min(limit,palette.length);
  for(let i=0;i<n;i++){
    const p=palette[i];
    const dr=c.r-p.r,dg=c.g-p.g,db=c.b-p.b;
    const d=dr*dr+dg*dg+db*db;
    if(d<bestD){bestD=d;best=p;}
  }
  return{r:best.r,g:best.g,b:best.b};
}

/* Build particles — tighter grid, less random offset */
function buildParticles(){
  if(!sourceImageData)return;
  const targetCount=parseInt(document.getElementById('detail').value);
  const sizeMult=parseFloat(document.getElementById('psize').value);
  const colorMode=document.getElementById('colorMode').value;
  const cols=Math.ceil(Math.sqrt(targetCount*(W/H)));
  const rows=Math.ceil(targetCount/cols);
  const cellW=W/cols,cellH=H/rows;
  let baseR=Math.min(cellW,cellH)*0.72*sizeMult;
  baseR=clamp(baseR,1.5,14);
  particles=[];
  let id=0;
  for(let ry=0;ry<rows;ry++){
    for(let cx=0;cx<cols;cx++){
      if(particles.length>=targetCount)break;
      const gx=(cx+0.5)*cellW,gy=(ry+0.5)*cellH;
      // Very small random offset for organic feel
      const tx=gx+(Math.random()-0.5)*cellW*0.08;
      const ty=gy+(Math.random()-0.5)*cellH*0.08;
      let col=sampleColor(gx,gy);
      if(colorMode!=='full')col=quantize(col,parseInt(colorMode));
      const r=baseR*(0.9+Math.random()*0.2);
      // Start from random position
      const sx=Math.random()*W,sy=Math.random()*H;
      particles.push({
        id:id++,x:sx,y:sy,
        ox:sx+(Math.random()-0.5)*4,oy:sy+(Math.random()-0.5)*4,
        tx,ty,r,m:r*r,col,colStr:`rgb(${col.r},${col.g},${col.b})`,
        settled:false,settleTimer:0
      });
    }
  }
  document.getElementById('countDisplay').textContent=particles.length;
  settledCount=0;
}

function recolor(){
  if(!sourceImageData)return;
  const mode=document.getElementById('colorMode').value;
  for(const p of particles){
    let col=sampleColor(p.tx,p.ty);
    if(mode!=='full')col=quantize(col,parseInt(mode));
    p.col=col;p.colStr=`rgb(${col.r},${col.g},${col.b})`;
  }
}

/* Physics — with settling */
function stepPhysics(dt){
  const dt2=dt*dt;
  const useSpring=(mode==='assemble');
  settledCount=0;
  
  for(let i=0;i<particles.length;i++){
    const p=particles[i];
    
    // Skip if settled
    if(p.settled){
      // Keep at target
      p.x=p.tx;p.y=p.ty;p.ox=p.tx;p.oy=p.ty;
      settledCount++;
      continue;
    }
    
    let ax=0,ay=gravity;
    
    if(useSpring){
      const dx=p.tx-p.x,dy=p.ty-p.y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      
      // Strong spring when far, weak when close
      const stiffness=dist>50?800:200;
      ax+=dx*stiffness;
      ay+=dy*stiffness;
      
      // Check if settled
      if(dist<1.5){
        const vx=p.x-p.ox,vy=p.y-p.oy;
        const speed=Math.sqrt(vx*vx+vy*vy);
        if(speed<0.3){
          p.settleTimer++;
          if(p.settleTimer>8){
            p.settled=true;
            p.x=p.tx;p.y=p.ty;p.ox=p.tx;p.oy=p.ty;
          }
        }else{
          p.settleTimer=0;
        }
      }else{
        p.settleTimer=0;
      }
    }
    
    // Mouse repulsion
    if(mouse.down){
      const dx=p.x-mouse.x,dy=p.y-mouse.y;
      const d2=dx*dx+dy*dy,R=mouse.r;
      if(d2<R*R&&d2>1){
        const d=Math.sqrt(d2);
        const f=(1-d/R)*mouse.str;
        ax+=dx/d*f;ay+=dy/d*f;
        // Break settled state if pushed
        if(p.settled){
          p.settled=false;
          p.settleTimer=0;
        }
      }
    }
    
    // Velocity with damping
    let vx=(p.x-p.ox)*0.92,vy=(p.y-p.oy)*0.92;
    if(vx>20)vx=20;if(vx<-20)vx=-20;
    if(vy>20)vy=20;if(vy<-20)vy=-20;
    
    p.ox=p.x;p.oy=p.y;
    p.x+=vx*assemblySpeed+ax*dt2*assemblySpeed;
    p.y+=vy*assemblySpeed+ay*dt2*assemblySpeed;
  }
  
  // Boundary constraints
  for(const p of particles){
    if(p.x<p.r){p.x=p.r;p.ox=p.x;}
    else if(p.x>W-p.r){p.x=W-p.r;p.ox=p.x;}
    if(p.y<p.r){p.y=p.r;p.oy=p.y;}
    else if(p.y>H-p.r){p.y=H-p.r;p.oy=p.y;}
  }
  
  if(collisionsOn)solveCollisions();
  
  document.getElementById('settledDisplay').textContent=settledCount;
}

function solveCollisions(){
  const cs=20;
  const grid=new Map();
  for(const p of particles){
    const gx=Math.floor(p.x/cs),gy=Math.floor(p.y/cs);
    const key=gy*128+gx;
    let arr=grid.get(key);
    if(!arr){arr=[];grid.set(key,arr);}
    arr.push(p);
  }
  for(let i=0;i<particles.length;i++){
    const p=particles[i];
    if(p.settled)continue;
    const gx=Math.floor(p.x/cs),gy=Math.floor(p.y/cs);
    for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){
      const cell=grid.get((gy+oy)*128+(gx+ox));
      if(!cell)continue;
      for(let k=0;k<cell.length;k++){
        const q=cell[k];
        if(q.id<=p.id||q.settled)continue;
        const dx=p.x-q.x,dy=p.y-q.y;
        const minD=p.r+q.r;
        if(Math.abs(dx)>minD||Math.abs(dy)>minD)continue;
        const d2=dx*dx+dy*dy;
        if(d2<minD*minD&&d2>0.01){
          const d=Math.sqrt(d2);
          const total=minD-d;
          const nx=dx/d,ny=dy/d;
          const tm=p.m+q.m;
          const f1=(q.m/tm)*0.7,f2=(p.m/tm)*0.7;
          p.x+=nx*total*f1;p.y+=ny*total*f1;
          q.x-=nx*total*f2;q.y-=ny*total*f2;
        }
      }
    }
  }
}

function render(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  if(showOriginal){ctx.save();ctx.globalAlpha=0.3;ctx.drawImage(offCanvas,0,0);ctx.restore();}
  for(const p of particles){
    ctx.fillStyle=p.colStr;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.2832);ctx.fill();
  }
  if(mouse.down){
    ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(mouse.x,mouse.y,mouse.r,0,6.2832);ctx.stroke();
  }
}

let lastTime=performance.now(),frames=0;
function loop(now){
  requestAnimationFrame(loop);
  if(!paused){stepPhysics(DT);render();}
  frames++;
  if(now-lastTime>=500){
    document.getElementById('fpsDisplay')&&(document.getElementById('fpsDisplay').textContent=Math.round(frames*1000/(now-lastTime)));
    frames=0;lastTime=now;
  }
}

/* Image load */
function processImage(img){
  const scale=Math.max(W/img.width,H/img.height);
  const dw=img.width*scale,dh=img.height*scale;
  offCtx.fillStyle='#000';offCtx.fillRect(0,0,W,H);
  offCtx.drawImage(img,(W-dw)/2,(H-dh)/2,dw,dh);
  sourceImageData=offCtx.getImageData(0,0,W,H);
  palette=extractPalette(sourceImageData,8);
  renderPalette();
  buildParticles();
  setMode('assemble');
}

function handleFile(file){
  if(!file)return;
  document.getElementById('fileName').textContent=file.name;
  const url=URL.createObjectURL(file);
  const img=new Image();
  img.onload=()=>{processImage(img);URL.revokeObjectURL(url);};
  img.src=url;
}

/* Procedural demos */
function generateArt(kind){
  const c=offCtx;
  c.globalAlpha=1;
  if(kind==='sunset'){
    let sky=c.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,'#05051a');sky.addColorStop(0.35,'#3b1d6e');
    sky.addColorStop(0.55,'#ff5e62');sky.addColorStop(0.68,'#ff9966');
    sky.addColorStop(0.71,'#1a0f2e');sky.addColorStop(1,'#050510');
    c.fillStyle=sky;c.fillRect(0,0,W,H);
    for(let i=0;i<200;i++){c.globalAlpha=Math.random()*0.8+0.2;c.fillStyle='#fff';const s=Math.random()*2+0.5;c.fillRect(Math.random()*W,Math.random()*H*0.35,s,s);}
    c.globalAlpha=1;
    const sx=W/2,sy=H*0.58;
    let glow=c.createRadialGradient(sx,sy,10,sx,sy,180);
    glow.addColorStop(0,'rgba(255,240,200,1)');glow.addColorStop(0.25,'rgba(255,200,100,.9)');
    glow.addColorStop(0.6,'rgba(255,120,60,.3)');glow.addColorStop(1,'rgba(255,100,60,0)');
    c.fillStyle=glow;c.fillRect(0,0,W,H);
    c.fillStyle='#fff6d8';c.beginPath();c.arc(sx,sy,62,0,Math.PI*2);c.fill();
    c.fillStyle='#1e1245';c.beginPath();c.moveTo(0,sy+40);
    for(let x=0;x<=W;x+=70)c.lineTo(x,sy+40-Math.random()*120-20);
    c.lineTo(W,H);c.lineTo(0,H);c.closePath();c.fill();
    c.fillStyle='#120b2e';c.beginPath();c.moveTo(0,sy+80);
    for(let x=0;x<=W;x+=50)c.lineTo(x,sy+80-Math.random()*90-10);
    c.lineTo(W,H);c.lineTo(0,H);c.closePath();c.fill();
    let water=c.createLinearGradient(0,sy+90,0,H);
    water.addColorStop(0,'#ff8a5c');water.addColorStop(0.3,'#5a2a6a');water.addColorStop(1,'#050510');
    c.fillStyle=water;c.fillRect(0,sy+90,W,H-(sy+90));
    for(let i=0;i<30;i++){const y=sy+100+i*8+Math.random()*4;const w=120-i*2+Math.random()*40;c.globalAlpha=Math.max(0,0.5-i*0.015);c.fillStyle='#ffefd0';c.fillRect(sx-w/2,y,w,3);}
    c.globalAlpha=1;
  }else if(kind==='neon'){
    c.fillStyle='#000';c.fillRect(0,0,W,H);
    const cols=['#00f0ff','#ff00c8','#7CFF00','#ffea00','#7b2ff7','#ff6a00'];
    for(let i=0;i<90;i++){
      const x=Math.random()*W,y=Math.random()*H,r=20+Math.random()*90;
      const col=cols[Math.floor(Math.random()*cols.length)];
      const g=c.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');
      c.globalAlpha=0.85;c.fillStyle=g;
      c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();
    }
    c.globalAlpha=1;
    for(let i=0;i<60;i++){
      c.strokeStyle=cols[Math.floor(Math.random()*cols.length)];
      c.lineWidth=2+Math.random()*3;
      c.beginPath();c.arc(Math.random()*W,Math.random()*H,5+Math.random()*25,0,Math.PI*2);c.stroke();
    }
  }else{
    c.fillStyle='#0a0a0a';c.fillRect(0,0,W,H);
    for(let y=35;y<H;y+=70)for(let x=35;x<W;x+=70){
      const hue=(x+y)%360;
      for(let rr=28;rr>4;rr-=7){
        c.fillStyle=`hsl(${(hue+rr*8)%360},95%,${42+rr}%)`;
        c.beginPath();c.arc(x+(Math.random()-0.5)*6,y+(Math.random()-0.5)*6,rr,0,Math.PI*2);c.fill();
      }
      c.fillStyle='#fff';c.beginPath();c.arc(x,y,4,0,Math.PI*2);c.fill();
    }
  }
  sourceImageData=c.getImageData(0,0,W,H);
  palette=extractPalette(sourceImageData,8);
  renderPalette();
  buildParticles();
  setMode('assemble');
}

/* UI */
function updateModeButtons(){
  document.getElementById('btnAssemble').classList.toggle('primary',mode==='assemble'&&gravity===0);
  document.getElementById('btnDrop').classList.toggle('primary',mode==='free'&&gravity>0);
  document.getElementById('btnFloat').classList.toggle('primary',mode==='free'&&gravity===0);
}
function setMode(m){
  if(m==='assemble'){mode='assemble';gravity=0;}
  if(m==='drop'){mode='free';gravity=900;}
  if(m==='float'){mode='free';gravity=0;}
  document.getElementById('gravity')&&(document.getElementById('gravity').value=gravity);
  updateModeButtons();
}

let rebuildTimer=null;
function scheduleRebuild(){clearTimeout(rebuildTimer);rebuildTimer=setTimeout(buildParticles,300);}

document.getElementById('detail').addEventListener('input',e=>{document.getElementById('detailVal').textContent=e.target.value;scheduleRebuild();});
document.getElementById('psize').addEventListener('input',e=>{document.getElementById('psizeVal').textContent=parseFloat(e.target.value).toFixed(2)+'×';scheduleRebuild();});
document.getElementById('speed').addEventListener('input',e=>{assemblySpeed=parseFloat(e.target.value);document.getElementById('speedVal').textContent=assemblySpeed.toFixed(1)+'×';});
document.getElementById('colorMode').addEventListener('change',recolor);
document.getElementById('collisions').addEventListener('change',e=>collisionsOn=e.target.checked);
document.getElementById('showOrig').addEventListener('change',e=>showOriginal=e.target.checked);

document.getElementById('btnAssemble').onclick=()=>setMode('assemble');
document.getElementById('btnDrop').onclick=()=>setMode('drop');
document.getElementById('btnFloat').onclick=()=>setMode('float');
document.getElementById('btnExplode').onclick=()=>{
  for(const p of particles){
    const dx=p.x-W/2,dy=p.y-H/2,d=Math.sqrt(dx*dx+dy*dy)||1;
    const s=10+Math.random()*16;
    p.ox=p.x-dx/d*s;p.oy=p.y-dy/d*s;
    p.settled=false;p.settleTimer=0;
  }
};
document.getElementById('btnScatter').onclick=()=>{
  for(const p of particles){
    p.ox=p.x+(Math.random()-0.5)*30;p.oy=p.y+(Math.random()-0.5)*30;
    p.settled=false;p.settleTimer=0;
  }
};
const pauseBtn=document.getElementById('btnPause');
pauseBtn.onclick=()=>{paused=!paused;pauseBtn.textContent=paused?'▶ Resume':'⏸ Pause';};

document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{document.getElementById('fileName').textContent='demo: '+b.dataset.preset;generateArt(b.dataset.preset);});

const dropZone=document.getElementById('dropZone');
const fileInput=document.getElementById('fileInput');
dropZone.onclick=()=>fileInput.click();
fileInput.onchange=e=>handleFile(e.target.files[0]);
dropZone.ondragover=e=>{e.preventDefault();dropZone.classList.add('drag');};
dropZone.ondragleave=()=>dropZone.classList.remove('drag');
dropZone.ondrop=e=>{e.preventDefault();dropZone.classList.remove('drag');if(e.dataTransfer.files[0])handleFile(e.dataTransfer.files[0]);};

function getPos(e){
  const r=canvas.getBoundingClientRect();
  return{x:(e.clientX-r.left)*(W/r.width),y:(e.clientY-r.top)*(H/r.height)};
}
canvas.addEventListener('mousedown',e=>{const p=getPos(e);mouse.x=p.x;mouse.y=p.y;mouse.down=true;});
canvas.addEventListener('mousemove',e=>{const p=getPos(e);mouse.x=p.x;mouse.y=p.y;});
window.addEventListener('mouseup',()=>mouse.down=false);
canvas.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];const p=getPos(t);mouse.x=p.x;mouse.y=p.y;mouse.down=true;},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];const p=getPos(t);mouse.x=p.x;mouse.y=p.y;},{passive:false});
canvas.addEventListener('touchend',()=>mouse.down=false);

generateArt('sunset');
requestAnimationFrame(loop);
</script>
</body>
</html>
