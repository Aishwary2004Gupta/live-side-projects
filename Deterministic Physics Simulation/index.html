<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Circle Mosaic — Relaxation Packing</title>
<style>
  :root {
    --tp-base: #18181d;
    --tp-folder: #1f1f25;
    --tp-title: #2a2a32;
    --tp-text: #a4a4b2;
    --tp-text-active: #ffffff;
    --tp-border: #2e2e38;
    --tp-accent: #3b73f6;
    --tp-accent-hover: #4e82f8;
    --tp-input: #111115;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #0c0c0e; }
  body {
    font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    display: flex; flex-direction: row; color: var(--tp-text);
  }

  /* --- Workspace (Left) --- */
  .workspace {
    flex: 1; display: flex; flex-direction: column; padding: 24px; gap: 24px;
    align-items: center; justify-content: center; overflow: hidden;
  }
  .canvas-wrapper {
    display: flex; flex-direction: column; gap: 8px;
    max-width: 48%; max-height: 100%;
  }
  .canvas-row {
    display: flex; flex-direction: row; gap: 24px; width: 100%; height: 100%;
    justify-content: center; align-items: center;
  }
  .label { font-size: 11px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: #666675; }
  .canvas-container {
    background: #000; border-radius: 6px; overflow: hidden;
    box-shadow: 0 12px 32px rgba(0,0,0,0.5); border: 1px solid var(--tp-border);
    display: flex;
  }
  canvas { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }

  /* --- Tweakpane (Right) --- */
  .tweakpane {
    width: 280px; background: var(--tp-base); border-left: 1px solid var(--tp-border);
    display: flex; flex-direction: column; padding: 12px; gap: 12px; overflow-y: auto;
    flex-shrink: 0;
  }
  .tp-header { font-size: 13px; font-weight: 600; color: var(--tp-text-active); padding: 4px 4px 12px; border-bottom: 1px solid var(--tp-border); }
  
  .tp-folder { background: var(--tp-folder); border-radius: 6px; overflow: hidden; }
  .tp-title {
    background: var(--tp-title); padding: 6px 10px; font-size: 10px; font-weight: 700;
    color: var(--tp-text-active); text-transform: uppercase; letter-spacing: 0.5px;
  }
  .tp-row {
    display: flex; padding: 8px 10px; align-items: center; font-size: 11px;
    border-top: 1px solid var(--tp-border); min-height: 32px;
  }
  .tp-label { width: 50%; color: var(--tp-text); }
  .tp-control { width: 50%; display: flex; justify-content: flex-end; align-items: center; }
  
  .tp-btn {
    background: var(--tp-title); color: var(--tp-text-active); border: none; padding: 6px 10px;
    border-radius: 4px; width: 100%; cursor: pointer; font-family: inherit; font-size: 11px;
    font-weight: 500; transition: 0.15s; text-align: center;
  }
  .tp-btn:hover { background: #383842; }
  .tp-btn.primary { background: var(--tp-accent); }
  .tp-btn.primary:hover { background: var(--tp-accent-hover); }

  /* Custom Checkbox */
  input[type="checkbox"] {
    appearance: none; width: 16px; height: 16px; background: var(--tp-input);
    border: 1px solid #383842; border-radius: 3px; cursor: pointer; position: relative;
  }
  input[type="checkbox"]:checked { background: var(--tp-accent); border-color: var(--tp-accent); }
  input[type="checkbox"]:checked::after {
    content: ''; position: absolute; left: 4px; top: 1px; width: 4px; height: 8px;
    border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg);
  }

  /* Palette Swatches */
  .tp-palette { display: flex; flex-wrap: wrap; gap: 4px; width: 100%; }
  .tp-swatch { flex: 1 1 20%; min-width: 24px; height: 24px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.1); }
  
  .tp-status { font-family: 'SF Mono', ui-monospace, monospace; color: #888895; }

  @media(max-width: 800px) {
    body { flex-direction: column; }
    .tweakpane { width: 100%; height: 250px; border-left: none; border-top: 1px solid var(--tp-border); }
    .canvas-row { flex-direction: column; }
    .canvas-wrapper { max-width: 100%; }
  }
</style>
</head>
<body>

<div class="workspace">
  <div class="canvas-row">
    <div class="canvas-wrapper">
      <div class="label">Original Source</div>
      <div class="canvas-container"><canvas id="srcCanvas"></canvas></div>
    </div>
    <div class="canvas-wrapper">
      <div class="label">Mosaic Pack (<span id="countInfo">0</span> circles)</div>
      <div class="canvas-container"><canvas id="c"></canvas></div>
    </div>
  </div>
</div>

<div class="tweakpane">
  <div class="tp-header">Mosaic Parameters</div>

  <div class="tp-folder">
    <div class="tp-title">Image Source</div>
    <div class="tp-row">
      <button class="tp-btn primary" id="pickBtn">Upload Image...</button>
      <input type="file" id="file" accept="image/*" hidden />
    </div>
  </div>

  <div class="tp-folder">
    <div class="tp-title">Simulation</div>
    <div class="tp-row">
      <button class="tp-btn" id="playBtn">Pause Relaxation</button>
    </div>
    <div class="tp-row">
      <button class="tp-btn" id="resetBtn">Re-pack Mosaic</button>
    </div>
  </div>

  <div class="tp-folder">
    <div class="tp-title">Render Settings</div>
    <div class="tp-row">
      <div class="tp-label">Snap to Palette</div>
      <div class="tp-control"><input type="checkbox" id="snap"></div>
    </div>
    <div class="tp-row">
      <div class="tp-label">Ghost Original</div>
      <div class="tp-control"><input type="checkbox" id="ghost"></div>
    </div>
  </div>

  <div class="tp-folder">
    <div class="tp-title">Detected Palette</div>
    <div class="tp-row">
      <div class="tp-palette" id="palette"></div>
    </div>
  </div>

  <div class="tp-folder">
    <div class="tp-title">Export</div>
    <div class="tp-row">
      <button class="tp-btn" id="saveBtn">Export HD PNG</button>
    </div>
  </div>

  <div class="tp-row" style="border:none">
    <div class="tp-status" id="status">Initializing...</div>
  </div>
</div>

<script>
/* ============================================================
   CONFIG & STATE
============================================================ */
let W = 0, H = 0;
const N_TARGET = 6000; // High detail, guaranteed coverage

const PHYS = {
  DT: 1/60, SUBSTEPS: 3, 
  BOUNCE: 0.1, FRICTION: 0.85, DAMP: 0.6 
  // No gravity. Pure spatial relaxation to pack circles.
};

const S = { snap: false, ghost: false };

const canvas = document.getElementById('c');
const srcCanvas = document.getElementById('srcCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const sctx = srcCanvas.getContext('2d', { willReadFrequently: true });

const el = {
  file: document.getElementById('file'), pick: document.getElementById('pickBtn'),
  play: document.getElementById('playBtn'), reset: document.getElementById('resetBtn'),
  save: document.getElementById('saveBtn'), snap: document.getElementById('snap'),
  ghost: document.getElementById('ghost'), palette: document.getElementById('palette'),
  status: document.getElementById('status'), countInfo: document.getElementById('countInfo')
};

const src = { loaded: false, lastImg: null, data: null, palette: [], bg: [12,12,14] };

/* ============================================================
   CANVAS SIZING (Preserves Aspect Ratio Exactness)
============================================================ */
function calculateDimensions(img) {
  // Max internal resolution for crispness without lagging physics
  const MAX_RES = 850; 
  let iw = img.width, ih = img.height;
  
  if (iw > MAX_RES || ih > MAX_RES) {
    const ratio = Math.min(MAX_RES/iw, MAX_RES/ih);
    iw = Math.floor(iw * ratio);
    ih = Math.floor(ih * ratio);
  }
  
  W = iw; H = ih;
  canvas.width = W; canvas.height = H;
  srcCanvas.width = W; srcCanvas.height = H;
}

function drawSourceImage(img) {
  calculateDimensions(img);
  sctx.drawImage(img, 0, 0, W, H);
  src.data = sctx.getImageData(0, 0, W, H).data;
  src.loaded = true;
}

function loadImage(file) {
  const img = new Image();
  img.onload = () => {
    src.lastImg = img;
    drawSourceImage(img);
    analyseColors();
    restart();
    URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(file);
}

/* ============================================================
   COLOR ANALYSIS & SAMPLING
============================================================ */
function analyseColors() {
  const d = src.data, px = [];
  for(let y=0; y<H; y+=5) for(let x=0; x<W; x+=5){
    const i = (y*W+x)*4; if(d[i+3] < 20) continue;
    px.push([d[i], d[i+1], d[i+2]]);
  }
  src.palette = medianCut(px, 10);
  
  // Set BG to darkest color
  let dark = src.palette[0], best = 1e9;
  for(const c of src.palette){ const l = c[0]*.299 + c[1]*.587 + c[2]*.114; if(l<best){best=l; dark=c;} }
  src.bg = [(dark[0]*.4)|0, (dark[1]*.4)|0, (dark[2]*.4)|0];
  
  el.palette.innerHTML = '';
  for(const c of src.palette) {
    const d = document.createElement('div'); d.className = 'tp-swatch';
    d.style.background = `rgb(${c[0]},${c[1]},${c[2]})`;
    d.title = `#${c.map(v=>v.toString(16).padStart(2,'0')).join('').toUpperCase()}`;
    el.palette.appendChild(d);
  }
}

// Minimal Median Cut implementation
function medianCut(pixels, k) {
  if(!pixels.length) return [[100,100,100]];
  let boxes = [pixels], guard=0;
  while(boxes.length < k && guard++ < 50) {
    boxes.sort((a,b) => boxSpan(b) - boxSpan(a));
    const box = boxes.shift(); if(!box || box.length<2){ if(box) boxes.push(box); break; }
    const ch = widestChannel(box); box.sort((p,q) => p[ch]-q[ch]);
    const mid = box.length>>1; boxes.push(box.slice(0,mid), box.slice(mid));
  }
  return boxes.map(b => {
    let r=0,g=0,bl=0; for(const p of b){ r+=p[0];g+=p[1];bl+=p[2]; }
    const n = b.length||1; return [r/n|0, g/n|0, bl/n|0];
  });
}
function widestChannel(box){ 
  let lr=255,hr=0, lg=255,hg=0, lb=255,hb=0;
  for(const p of box){ 
    if(p[0]<lr)lr=p[0]; if(p[0]>hr)hr=p[0];
    if(p[1]<lg)lg=p[1]; if(p[1]>hg)hg=p[1];
    if(p[2]<lb)lb=p[2]; if(p[2]>hb)hb=p[2];
  }
  const r=hr-lr, g=hg-lg, b=hb-lb; return r>=g&&r>=b?0:g>=b?1:2;
}
function boxSpan(box){
  let lr=255,hr=0, lg=255,hg=0, lb=255,hb=0;
  for(const p of box){ 
    if(p[0]<lr)lr=p[0]; if(p[0]>hr)hr=p[0];
    if(p[1]<lg)lg=p[1]; if(p[1]>hg)hg=p[1];
    if(p[2]<lb)lb=p[2]; if(p[2]>hb)hb=p[2];
  }
  return Math.max(hr-lr, hg-lg, hb-lb) * Math.log(box.length+1);
}

// Sample image color at specific point
function sampleColor(x, y) {
  if(!src.loaded) return [120,120,120];
  const px = (x<0?0:x>=W?W-1:x)|0;
  const py = (y<0?0:y>=H?H-1:y)|0;
  const i = (py*W + px)*4;
  const d = src.data;
  let c = [d[i], d[i+1], d[i+2]];
  if(S.snap && src.palette.length) {
    let best = src.palette[0], bd = 1e9;
    for(const p of src.palette){
      const dr=p[0]-c[0], dg=p[1]-c[1], db=p[2]-c[2];
      const dist = dr*dr + dg*dg + db*db;
      if(dist<bd){ bd=dist; best=p; }
    }
    c = best;
  }
  return c;
}

/* ============================================================
   PHYSICS & CIRCLES
============================================================ */
class Ball {
  constructor(x, y, r) {
    this.x = x; this.y = y; this.px = x; this.py = y;
    this.r = r; this.m = r*r;
    this.setColor(sampleColor(x,y));
  }
  setColor(c) { this.css = `rgb(${c[0]},${c[1]},${c[2]})`; }
}

let balls = [];
let gridSize = 16;

class Grid {
  constructor(cs){ this.cs=cs; this.cols=Math.ceil(W/cs)+1; this.rows=Math.ceil(H/cs)+1; this.b=Array.from({length:this.cols*this.rows},()=>[]); }
  clear(){ for(const a of this.b) a.length=0; }
  key(gx,gy){ return gx<0||gy<0||gx>=this.cols||gy>=this.rows?-1:gy*this.cols+gx; }
  add(i,x,y){ const k=this.key((x/this.cs)|0,(y/this.cs)|0); if(k>=0) this.b[k].push(i); }
  rebuild(){ this.clear(); for(let i=0;i<balls.length;i++) this.add(i, balls[i].x, balls[i].y); }
}
let grid = new Grid(16);

function resolvePair(i, j) {
  const a = balls[i], b = balls[j];
  const dx = a.x - b.x, dy = a.y - b.y;
  const d2 = dx*dx + dy*dy; const md = a.r + b.r;
  if(d2 >= md*md || d2 < 1e-8) return;
  const d = Math.sqrt(d2), nx = dx/d, ny = dy/d, ov = (md-d)*0.5 * PHYS.DAMP;
  const tm = a.m + b.m, r1 = b.m/tm, r2 = a.m/tm;
  a.x += nx*ov*r1*2; a.y += ny*ov*r1*2;
  b.x -= nx*ov*r2*2; b.y -= ny*ov*r2*2;
}

const NEIGH = [[1,0],[-1,1],[0,1],[1,1]];
function solveCollisions() {
  grid.rebuild();
  const {cols, rows, b} = grid;
  for(let gy=0; gy<rows; gy++) for(let gx=0; gx<cols; gx++){
    const A = b[gy*cols+gx]; if(!A.length) continue;
    for(let m=0; m<A.length; m++) for(let n=m+1; n<A.length; n++) resolvePair(A[m], A[n]);
    for(const [dx,dy] of NEIGH){
      const k = grid.key(gx+dx, gy+dy); if(k<0) continue;
      const B = b[k];
      for(let m=0; m<A.length; m++) for(let n=0; n<B.length; n++) resolvePair(A[m], B[n]);
    }
  }
}

function constrain(b) {
  const vx = b.x - b.px, vy = b.y - b.py;
  if(b.x - b.r < 0){ b.x = b.r; b.px = b.x + vx*PHYS.BOUNCE; } else if(b.x + b.r > W){ b.x = W-b.r; b.px = b.x + vx*PHYS.BOUNCE; }
  if(b.y - b.r < 0){ b.y = b.r; b.py = b.y + vy*PHYS.BOUNCE; } else if(b.y + b.r > H){ b.y = H-b.r; b.py = b.y + vy*PHYS.BOUNCE; }
}

function integrate(b, dt) {
  const vx = (b.x - b.px) * PHYS.FRICTION;
  const vy = (b.y - b.py) * PHYS.FRICTION;
  b.px = b.x; b.py = b.y;
  b.x += vx; b.y += vy;
}

function physicsStep() {
  const sub = PHYS.DT / PHYS.SUBSTEPS;
  for(let s=0; s<PHYS.SUBSTEPS; s++){
    solveCollisions();
    for(const b of balls) constrain(b);
    for(const b of balls) integrate(b, sub);
  }
}

/* ============================================================
   MAIN LOOP & RENDER
============================================================ */
function render() {
  ctx.fillStyle = `rgb(${src.bg[0]},${src.bg[1]},${src.bg[2]})`;
  ctx.fillRect(0, 0, W, H);
  if(S.ghost && src.loaded){ ctx.globalAlpha=0.15; ctx.drawImage(srcCanvas,0,0); ctx.globalAlpha=1; }
  for(const b of balls){
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
    ctx.fillStyle = b.css; ctx.fill();
  }
}

let running = false, acc = 0, last = 0, frames = 0;

function restart() {
  // Spawn math perfectly tuned to overlap and fill WxH area completely
  const aspect = W / H;
  const cols = Math.floor(Math.sqrt(N_TARGET * aspect));
  const rows = Math.floor(N_TARGET / cols);
  const cellW = W / cols;
  const cellH = H / rows;
  
  // Radius strictly larger than half the diagonal to guarantee no gaps
  const R = Math.max(cellW, cellH) * 0.72; 
  gridSize = R * 2.1;
  grid = new Grid(gridSize);
  balls = [];
  
  for(let r=0; r<rows; r++) {
    for(let c=0; c<cols; c++) {
      // Jitter grid slightly so it looks organic, physics will push apart overlaps
      const x = c * cellW + cellW/2 + (Math.random()-0.5)*cellW*0.3;
      const y = r * cellH + cellH/2 + (Math.random()-0.5)*cellH*0.3;
      balls.push(new Ball(x, y, R));
    }
  }

  el.countInfo.textContent = balls.length;
  acc = 0; last = 0; running = true; el.play.textContent = 'Pause Relaxation';
  requestAnimationFrame(loop);
}

function loop(ts) {
  if(!running) return;
  if(!last) last = ts;
  const dt = Math.min(0.05, (ts - last) / 1000);
  last = ts; acc += dt;
  
  let guard = 0;
  while(acc >= PHYS.DT && guard++ < 4) { physicsStep(); acc -= PHYS.DT; }
  
  frames++;
  if(frames % 3 === 0) {
    // Only update colors while relaxing so final image represents the exact pixels underneath
    let active = false;
    for(const b of balls) {
      if(Math.abs(b.x - b.px) > 0.05 || Math.abs(b.y - b.py) > 0.05) {
        b.setColor(sampleColor(b.x, b.y));
        active = true;
      }
    }
    el.status.textContent = active ? 'Relaxing mosaic lattice...' : 'Equilibrium reached.';
  }
  
  render();
  requestAnimationFrame(loop);
}

/* ============================================================
   EVENTS & PROCEDURAL GENERATION
============================================================ */
el.pick.onclick = () => el.file.click();
el.file.onchange = e => { if(e.target.files[0]) loadImage(e.target.files[0]); };

el.play.onclick = () => {
  running = !running;
  el.play.textContent = running ? 'Pause Relaxation' : 'Resume Relaxation';
  if(running) { last = 0; requestAnimationFrame(loop); }
};

el.reset.onclick = restart;
el.save.onclick = () => {
  render(); const a = document.createElement('a');
  a.download = 'circle-mosaic.png'; a.href = canvas.toDataURL('image/png'); a.click();
};

el.snap.onchange = e => { S.snap = e.target.checked; for(const b of balls) b.setColor(sampleColor(b.x,b.y)); render(); };
el.ghost.onchange = e => { S.ghost = e.target.checked; render(); };

document.body.addEventListener('dragover', e => e.preventDefault());
document.body.addEventListener('drop', e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if(f && f.type.startsWith('image/')) loadImage(f); });
window.addEventListener('paste', e => { for(const it of e.clipboardData.items) if(it.type.startsWith('image/')){ loadImage(it.getAsFile()); break; } });

// Generate high-quality procedural glass/poly image on start
function generateSampleImage() {
  const img = document.createElement('canvas'); img.width = 1200; img.height = 800;
  const c = img.getContext('2d');
  
  c.fillStyle = '#0f172a'; c.fillRect(0, 0, 1200, 800);
  
  const addOrb = (x, y, r, color) => {
    const g = c.createRadialGradient(x,y,0, x,y,r);
    g.addColorStop(0, color); g.addColorStop(1, 'transparent');
    c.fillStyle = g; c.fillRect(x-r, y-r, r*2, r*2);
  };
  addOrb(300, 200, 600, '#38bdf8');
  addOrb(900, 700, 700, '#c084fc');
  addOrb(1000, 100, 500, '#f472b6');
  addOrb(200, 800, 500, '#34d399');

  c.fillStyle = 'rgba(255,255,255,0.06)';
  c.beginPath(); c.moveTo(0,0); c.lineTo(700, 800); c.lineTo(0, 800); c.fill();
  c.beginPath(); c.moveTo(1200,0); c.lineTo(300, 0); c.lineTo(1200, 900); c.fill();
  
  return img;
}

const sampleImg = generateSampleImage();
src.lastImg = sampleImg;
drawSourceImage(sampleImg);
analyseColors();
restart();
</script>
</body>
</html>
