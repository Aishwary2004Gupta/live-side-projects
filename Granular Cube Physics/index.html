<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Granular Cube — Dense Sand Simulation</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,400&family=Inter:wght@200;300&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #08080a; color: #fff; font-family: 'Inter', sans-serif; }
  canvas { display: block; position: fixed; inset: 0; outline: none; }
  .overlay {
    position: fixed; z-index: 10; pointer-events: none; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 3rem;
  }
  h1 { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: clamp(3rem, 8vw, 8rem); line-height: 0.85; letter-spacing: -0.04em; color: rgba(255,255,255,0.92); text-shadow: 0 30px 80px rgba(0,0,0,0.9); }
  h1 span { display: block; font-style: italic; font-weight: 400; color: #ff9f43; text-shadow: 0 0 60px rgba(255,159,67,0.45); }
  .label { font-size: 0.7rem; letter-spacing: 0.25em; text-transform: uppercase; color: rgba(255,255,255,0.35); margin-top: 1.5rem; }
  .badge {
    position: fixed; bottom: 2.5rem; right: 2.5rem; z-index: 10; pointer-events: auto;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(16px);
    padding: 1.25rem 1.75rem; border-radius: 1rem;
  }
  .badge h3 { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; margin-bottom: 0.25rem; color: #fff; }
  .badge p { font-size: 0.75rem; color: rgba(255,255,255,0.5); line-height: 1.6; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<canvas id="c"></canvas>

<div class="overlay">
  <div>
    <h1>Granular<br><span>Sand</span></h1>
    <p class="label">Real-Time Volumetric Simulation / 200,000 Particles</p>
  </div>
</div>

<aside class="badge">
  <h3>Interactive</h3>
  <p>Drag to orbit.<br>Scroll to zoom.<br>Auto-rotating studio view.</p>
</aside>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060608);
scene.fog = new THREE.FogExp2(0x060608, 0.02);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(3.8, 2.2, 7.5);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.3;
controls.target.set(0, -0.2, 0);

scene.add(new THREE.AmbientLight(0xffffff, 0.4));

const key = new THREE.DirectionalLight(0xffffff, 3.0);
key.position.set(5, 8, 6);
scene.add(key);

const warm = new THREE.DirectionalLight(0xffaa66, 2.5);
warm.position.set(-7, 3, -8);
scene.add(warm);

const cool = new THREE.DirectionalLight(0x88ccff, 0.8);
cool.position.set(2, 10, -4);
scene.add(cool);

// Glass Cube — very transparent so particles are visible clearly
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  metalness: 0.0,
  roughness: 0.05,
  transmission: 1.0,
  thickness: 1.5,
  transparent: true,
  opacity: 0.05,
  ior: 1.5,
  clearcoat: 1.0,
  clearcoatRoughness: 0.02
});
const cube = new THREE.Mesh(new THREE.BoxGeometry(3.0, 3.0, 3.0), glassMat);
scene.add(cube);

const wire = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(3.0, 3.0, 3.0)),
  new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.18 })
);
cube.add(wire);

// Reflective floor
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.MeshStandardMaterial({ color: 0x030305, roughness: 0.15, metalness: 0.9 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -1.55;
scene.add(floor);

// PARTICLES: Dense orange/gold clusters inside cube, visible and bright
const COUNT = 200000;
const posArr = new Float32Array(COUNT * 3);
const colArr = new Float32Array(COUNT * 3);
const sizeArr = new Float32Array(COUNT);

const orange = new THREE.Color(0xff6600);
const gold = new THREE.Color(0xffaa22);

for (let i = 0; i < COUNT; i++) {
  const i3 = i * 3;

  // Create organic swirling clusters like reference image
  const a = Math.random() * Math.PI * 2;
  const r = Math.random() * 1.3;
  
  // Main cluster shape: large swirling blobs
  let x = Math.sin(a * 3 + i * 0.001) * r * 1.2;
  let y = Math.sin(a * 2 + i * 0.001) * r * 0.8 - 0.3;
  let z = Math.cos(a * 3 + i * 0.001) * r * 1.2;

  // Add dense bottom pile
  if (Math.random() > 0.35) {
    y -= 0.6 + Math.random() * 0.6;
  }

  // Add secondary cluster bumps
  const bump = Math.sin(x * 3 + z * 2) * 0.35;
  x += bump * 0.5;
  z += Math.sin(y * 3) * 0.3;

  // Keep strictly inside cube with padding
  const b = 1.35;
  x = THREE.MathUtils.clamp(x, -b, b);
  y = THREE.MathUtils.clamp(y, -b, b);
  z = THREE.MathUtils.clamp(z, -b, b);

  posArr[i3] = x;
  posArr[i3+1] = y;
  posArr[i3+2] = z;

  // Bright warm colors — mostly orange/gold with slight variation
  const mix = Math.random();
  const c = mix > 0.25 ? orange : gold;
  // Brighten and vary slightly
  c.offsetHSL(0, 0, (Math.random() - 0.3) * 0.3);
  colArr[i3] = c.r;
  colArr[i3+1] = c.g;
  colArr[i3+2] = c.b;

  sizeArr[i] = 0.8 + Math.random() * 1.8;
}

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
geo.setAttribute('color', new THREE.BufferAttribute(colArr, 3));
geo.setAttribute('size', new THREE.BufferAttribute(sizeArr, 1));

const mat = new THREE.PointsMaterial({
  size: 0.06,
  vertexColors: true,
  transparent: true,
  opacity: 0.95,
  blending: THREE.AdditiveBlending,
  sizeAttenuation: true,
  depthWrite: false
});

const points = new THREE.Points(geo, mat);
scene.add(points);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();
  const delta = Math.min(clock.getDelta(), 0.03);

  // Slow rotation of cube
  cube.rotation.y = Math.sin(time * 0.15) * 0.08;

  // Update particle positions: gentle swirl + gravity + accumulation
  const pArr = points.geometry.attributes.position.array;

  for (let i = 0; i < COUNT; i++) {
    const ix = i * 3;
    const iy = i * 3 + 1;
    const iz = i * 3 + 2;

    let x = pArr[ix];
    let y = pArr[iy];
    let z = pArr[iz];

    // Gentle continuous swirl like kinetic sand
    const s = 0.6 + Math.sin(time * 0.4) * 0.1;
    x += Math.sin(y * s + time) * 0.003;
    z += Math.cos(x * s - time) * 0.003;

    // Strong downward flow with energy loss (settling)
    y -= delta * 0.4;

    // When particles hit bottom, they accumulate in dense pile (bounce slightly)
    if (y < -1.25) {
      y = -1.25 + (Math.sin(i * 0.01 + time * 2) * 0.02);
      // Add slight random horizontal drift when settled
      x += (Math.random() - 0.5) * 0.002;
      z += (Math.random() - 0.5) * 0.002;
    }

    // Soft wall collision inside cube
    const b = 1.32;
    if (x > b) x = b - 0.01;
    if (x < -b) x = -b + 0.01;
    if (z > b) z = b - 0.01;
    if (z < -b) z = -b + 0.01;

    pArr[ix] = x;
    pArr[iy] = y;
    pArr[iz] = z;
  }

  points.geometry.attributes.position.needsUpdate = true;
  controls.update();
  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
