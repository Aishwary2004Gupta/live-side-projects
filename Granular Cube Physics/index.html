<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Granular Cube Physics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Orbitron:wght@400;900&display=swap');

    body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Orbitron', sans-serif; }
    canvas { display: block; }
    .glass-panel {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.05);
    }
  </style>
</head>
<body class="text-white h-screen w-full flex flex-col items-center justify-center relative overflow-hidden selection:bg-teal-500 selection:text-black">

  <!-- Background Gradient -->
  <div class="absolute inset-0 z-0 pointer-events-none bg-gradient-to-b from-[#0f0f12] via-[#08080a] to-[#020203]"></div>

  <!-- Header UI -->
  <header class="absolute top-0 left-0 w-full p-8 z-10 flex justify-between items-start pointer-events-none">
    <div>
      <h1 class="text-4xl md:text-6xl font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-teal-300 via-orange-300 to-teal-400 drop-shadow-[0_0_15px_rgba(45,212,191,0.5)]">
        GRANULAR<br><span class="italic font-light text-white/90">STRUCTURE</span>
      </h1>
      <p class="mt-2 text-xs md:text-sm text-white/40 tracking-[0.3em] uppercase">Physical Simulation / Real-time Render</p>
    </div>
    <div class="glass-panel p-6 rounded-2xl pointer-events-auto max-w-xs hidden md:block">
      <h3 class="text-xs text-teal-400 font-bold tracking-widest mb-2">SYSTEM STATUS</h3>
      <div class="space-y-3 text-xs text-white/70 font-mono">
        <div class="flex justify-between"><span>PARTICLES</span> <span id="particle-count" class="text-orange-300">50,000</span></div>
        <div class="flex justify-between"><span>VELOCITY</span> <span class="text-teal-300">ACTIVE</span></div>
        <div class="flex justify-between"><span>CONTAINER</span> <span class="text-white">GLASS CUBE</span></div>
        <div class="w-full h-px bg-white/10 my-2"></div>
        <div class="text-[10px] text-white/30">Drag to rotate. Scroll to zoom.</div>
      </div>
    </div>
  </header>

  <!-- Main Canvas -->
  <div id="canvas-container" class="w-full h-full absolute inset-0 z-0"></div>

  <!-- Footer / Controls -->
  <footer class="absolute bottom-6 left-1/2 -translate-x-1/2 z-10 flex gap-4">
    <button onclick="resetSimulation()" class="glass-panel px-6 py-3 rounded-full text-xs font-bold uppercase tracking-widest hover:bg-white/10 transition-colors hover:text-teal-300 hover:shadow-[0_0_20px_rgba(45,212,191,0.2)]">
      Reset Flow
    </button>
  </footer>

  <script>
    // --- Configuration ---
    const PARTICLE_COUNT = 35000; // High density
    const CUBE_SIZE = 3;
    const BOUNDS = CUBE_SIZE / 2 - 0.1;

    // --- Scene Setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050505);
    scene.fog = new THREE.FogExp2(0x050505, 0.02); // Subtle depth fog

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 50);
    camera.position.set(5, 4, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild(renderer.domElement);

    // --- Controls ---
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enablePan = false;
    controls.enableDamping = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.5;

    // --- Lighting ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
    scene.add(ambientLight);

    // Key Light (Cool Teal)
    const dirLight1 = new THREE.DirectionalLight(0x00ffff, 1);
    dirLight1.position.set(-5, 5, -5);
    scene.add(dirLight1);

    // Fill Light (Warm Orange)
    const dirLight2 = new THREE.DirectionalLight(0xff8800, 1.5);
    dirLight2.position.set(5, -2, 5);
    scene.add(dirLight2);

    // Rim Light (White)
    const dirLight3 = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight3.position.set(0, 0, 10);
    scene.add(dirLight3);

    // --- The Glass Cube ---
    const glassMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      metalness: 0.05,
      roughness: 0.05,
      transmission: 1, // Glass effect
      thickness: 0.5,
      transparent: true,
      opacity: 0.15,
      ior: 1.5,
      clearcoat: 1,
      clearcoatRoughness: 0.05,
      envMapIntensity: 1
    });

    const geometry = new THREE.BoxGeometry(CUBE_SIZE, CUBE_SIZE, CUBE_SIZE);
    // Thin edges for the box
    const boxEdges = new THREE.Mesh(geometry, glassMaterial);
    scene.add(boxEdges);

    // Subtle wireframe for structure definition
    const edges = new THREE.EdgesGeometry(geometry);
    const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ 
      color: 0xffffff, 
      transparent: true, 
      opacity: 0.3 
    }));
    line.position.z = 0.001; // Offset slightly
    scene.add(line);

    // --- Particle System ---
    const positions = new Float32Array(PARTICLE_COUNT * 3);
    const colors = new Float32Array(PARTICLE_COUNT * 3);
    const velocities = new Float32Array(PARTICLE_COUNT * 3);
    const sizes = new Float32Array(PARTICLE_COUNT);

    // Generate initial random positions inside the cube
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const i3 = i * 3;
      positions[i3] = (Math.random() - 0.5) * CUBE_SIZE * 0.8;
      positions[i3 + 1] = Math.random() * CUBE_SIZE * 0.5 + 1.0; // Start mostly at top
      positions[i3 + 2] = (Math.random() - 0.5) * CUBE_SIZE * 0.8;

      // Initialize colors: Mix of Teal and Orange
      const colorChoice = Math.random();
      const c = new THREE.Color();
      if (colorChoice > 0.5) {
        c.setHSL(0.5, 0.8, 0.6); // Teal/Cyan
      } else {
        c.setHSL(0.08, 0.8, 0.7); // Orange
      }
      colors[i3] = c.r;
      colors[i3 + 1] = c.g;
      colors[i3 + 2] = c.b;
      
      // Random sizes for "dust" variation
      sizes[i] = Math.random() * 2 + 1;
    }

    const particleGeometry = new THREE.BufferGeometry();
    particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    particleGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

    const particleMaterial = new THREE.PointsMaterial({
      size: 0.05,
      vertexColors: true,
      transparent: true,
      opacity: 0.8,
      sizeAttenuation: true,
      blending: THREE.AdditiveBlending, // Glowing effect for dense clusters
      depthWrite: false
    });

    const points = new THREE.Points(particleGeometry, particleMaterial);
    scene.add(points);

    // --- Animation Loop ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // Rotate Cube Slowly for view
      boxEdges.rotation.y = time * 0.1;

      // Update Particles
      const posArray = points.geometry.attributes.position.array;

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const i3 = i * 3;
        let x = posArray[i3];
        let y = posArray[i3 + 1];
        let z = posArray[i3 + 2];

        // Gravity Effect (Pull down)
        y -= delta * 0.5 + Math.sin(time + i) * 0.001; 

        // Noise Flow (Swirling)
        // Simple noise approximation using sine waves for organic flow
        const noiseX = Math.sin(time * 2 + x * 3 + y * 2) * 0.05;
        const noiseZ = Math.cos(time * 2 + y * 3 + x * 2) * 0.05;
        
        x += noiseX;
        z += noiseZ;

        // Boundaries (Bounce / Stick)
        const boundary = BOUNDS;
        
        if (y < -boundary) {
          y = -boundary;
          // Reset to top randomly or stay? Let's stay and accumulate.
          // To create "pooling" effect, we just push them slightly up or let them slide.
        }
        
        if (x > boundary) x = boundary - (x - boundary);
        if (x < -boundary) x = -boundary - (x + boundary);
        if (z > boundary) z = boundary - (z - boundary);
        if (z < -boundary) z = -boundary - (z + boundary);

        posArray[i3] = x;
        posArray[i3 + 1] = y;
        posArray[i3 + 2] = z;
      }

      points.geometry.attributes.position.needsUpdate = true;

      controls.update();
      renderer.render(scene, camera);
    }

    // Window Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Reset Function
    window.resetSimulation = function() {
      // Randomize initial positions
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const i3 = i * 3;
        points.geometry.attributes.position.array[i3] = (Math.random() - 0.5) * CUBE_SIZE;
        points.geometry.attributes.position.array[i3 + 1] = Math.random() * CUBE_SIZE + 0.5;
        points.geometry.attributes.position.array[i3 + 2] = (Math.random() - 0.5) * CUBE_SIZE;
      }
      points.geometry.attributes.position.needsUpdate = true;
    }

    animate();
  </script>
</body>
</html>
