<!DOCTYPE html><html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Granular Cube</title> <style> body { margin: 0; overflow: hidden; background: #0a0a0c; } canvas { display: block; } </style> </head> <body> <script type="importmap"> { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } } </script> <script type="module"> import * as THREE from 'three'; import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x08080a);
scene.fog = new THREE.FogExp2(0x08080a, 0.03);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.1, 50);
camera.position.set(4.2, 3.0, 8.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.4;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.25;

scene.add(new THREE.AmbientLight(0xffffff, 0.35));

const key = new THREE.DirectionalLight(0xffffff, 3.0);
key.position.set(5, 8, 6);
scene.add(key);

const warm = new THREE.DirectionalLight(0xffaa55, 2.5);
warm.position.set(-6, 4, -6);
scene.add(warm);

const cool = new THREE.DirectionalLight(0x88ccff, 1.2);
cool.position.set(0, 10, -8);
scene.add(cool);

const floor = new THREE.Mesh(
new THREE.PlaneGeometry(40, 40),
new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.1, metalness: 1.0 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -2.2;
scene.add(floor);

const glass = new THREE.MeshPhysicalMaterial({
color: 0xffffff, metalness: 0.02, roughness: 0.02,
transmission: 1.0, thickness: 1.5, transparent: true,
opacity: 0.08, ior: 1.6, clearcoat: 1, clearcoatRoughness: 0.02
});

const box = new THREE.Mesh(new THREE.BoxGeometry(4, 4, 4), glass);
scene.add(box);

const edges = new THREE.LineSegments(
new THREE.EdgesGeometry(new THREE.BoxGeometry(4, 4, 4)),
new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.25 })
);
scene.add(edges);

const count = 350000;
const pos = new Float32Array(count * 3);
const col = new Float32Array(count * 3);
const size = new Float32Array(count);

const orange = new THREE.Color(0xff7700);
const gold = new THREE.Color(0xffaa33);

for (let i = 0; i < count; i++) {
const i3 = i * 3;
let r = Math.random() * 1.8;
let t = Math.random() * Math.PI * 2;
let p = Math.acos((Math.random() * 2) - 1);

let x = r * Math.sin(p) * Math.cos(t);
let y = r * Math.sin(p) * Math.sin(t);
let z = r * Math.cos(p);

// Bias to fill lower and middle like reference
if (Math.random() > 0.4) y -= 0.6;
if (Math.abs(y) < 0.6) y = y * 0.7 - 0.4;

pos[i3] = x;
pos[i3+1] = y;
pos[i3+2] = z;

const mix = Math.random();
const c = mix > 0.3 ? orange : gold;
c.offsetHSL((Math.random()-0.5)*0.08, 0, (Math.random()-0.5)*0.15);
col[i3] = c.r; col[i3+1] = c.g; col[i3+2] = c.b;
size[i] = Math.random() * 2.5 + 0.3;
}

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
geo.setAttribute('size', new THREE.BufferAttribute(size, 1));

const mat = new THREE.PointsMaterial({
size: 0.045, vertexColors: true, transparent: true,
opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
});

const pts = new THREE.Points(geo, mat);
scene.add(pts);

const clock = new THREE.Clock();

function animate() {
requestAnimationFrame(animate);
const t = clock.getElapsedTime();
box.rotation.y = Math.sin(t * 0.15) * 0.08;
pts.rotation.y = Math.sin(t * 0.1) * 0.04;
controls.update();
renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body> </html>
