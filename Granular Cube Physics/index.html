<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Granular Cube</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #08080a;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <script>
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x08080a);
      scene.fog = new THREE.FogExp2(0x08080a, 0.035);

      const camera = new THREE.PerspectiveCamera(
        40,
        window.innerWidth / window.innerHeight,
        0.1,
        50,
      );
      camera.position.set(4, 3.5, 9);

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.outputEncoding = THREE.sRGBEncoding;
      document.body.appendChild(renderer.domElement);

      // Lights
      const amb = new THREE.AmbientLight(0xffffff, 0.3);
      scene.add(amb);

      const key = new THREE.DirectionalLight(0x88ffff, 2);
      key.position.set(-5, 5, -5);
      scene.add(key);

      const fill = new THREE.DirectionalLight(0xff8800, 2.5);
      fill.position.set(5, -1, 5);
      scene.add(fill);

      const rim = new THREE.DirectionalLight(0xffffff, 1);
      rim.position.set(0, 0, 10);
      scene.add(rim);

      // Glass Cube
      const glassMat = new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        metalness: 0.1,
        roughness: 0.05,
        transmission: 0.95,
        thickness: 1.2,
        transparent: true,
        opacity: 0.12,
        ior: 1.5,
        clearcoat: 1,
        clearcoatRoughness: 0.05,
        envMapIntensity: 1,
      });

      const boxGeo = new THREE.BoxGeometry(3, 3, 3);
      const cube = new THREE.Mesh(boxGeo, glassMat);
      scene.add(cube);

      const edges = new THREE.EdgesGeometry(boxGeo);
      const lines = new THREE.LineSegments(
        edges,
        new THREE.LineBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.25,
        }),
      );
      scene.add(lines);

      // Particles
      const count = 60000;
      const posArr = new Float32Array(count * 3);
      const colArr = new Float32Array(count * 3);
      const sizeArr = new Float32Array(count);

      const teal = new THREE.Color(0x00bfa5);
      const orange = new THREE.Color(0xff8c00);

      for (let i = 0; i < count; i++) {
        const i3 = i * 3;
        // Organic clusters inside cube
        let x = (Math.random() - 0.5) * 2.6;
        let y = (Math.random() - 0.5) * 2.6;
        let z = (Math.random() - 0.5) * 2.6;

        // Bias to create swirling shapes
        const swirl = Math.sin(x * 3 + z * 2) * 0.4 + Math.cos(y * 2 - x) * 0.4;
        x += swirl * 0.8;
        y += Math.sin(x * 2 + z * 3) * 0.8;
        z += Math.cos(y * 3 - x) * 0.8;

        // Keep inside bounds
        if (Math.abs(x) > 1.3) x *= 0.9;
        if (Math.abs(y) > 1.3) y *= 0.9;
        if (Math.abs(z) > 1.3) z *= 0.9;

        // Cluster towards bottom and middle like reference
        if (Math.random() > 0.6) y -= 0.3;

        posArr[i3] = x;
        posArr[i3 + 1] = y;
        posArr[i3 + 2] = z;

        const mix = Math.random();
        const c = mix > 0.35 ? teal : orange;
        // Add noise to colors
        c.offsetHSL(
          (Math.random() - 0.5) * 0.05,
          0,
          (Math.random() - 0.5) * 0.2,
        );
        colArr[i3] = c.r;
        colArr[i3 + 1] = c.g;
        colArr[i3 + 2] = c.b;

        sizeArr[i] = Math.random() * 1.5 + 0.5;
      }

      const pGeo = new THREE.BufferGeometry();
      pGeo.setAttribute("position", new THREE.BufferAttribute(posArr, 3));
      pGeo.setAttribute("color", new THREE.BufferAttribute(colArr, 3));
      pGeo.setAttribute("size", new THREE.BufferAttribute(sizeArr, 1));

      const pMat = new THREE.PointsMaterial({
        size: 0.035,
        vertexColors: true,
        transparent: true,
        opacity: 0.9,
        sizeAttenuation: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });

      const points = new THREE.Points(pGeo, pMat);
      scene.add(points);

      // Render loop (static pose, subtle rotation)
      const clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();
        cube.rotation.y = Math.sin(t * 0.2) * 0.05;
        points.rotation.y = Math.sin(t * 0.15) * 0.02;
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
