<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Granular Cube</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050508; overflow: hidden; font-family: 'Cormorant Garamond', serif; }
  canvas { display: block; }
  .label {
    position: fixed; top: 2.5rem; left: 2.5rem; z-index: 10; pointer-events: none;
    color: rgba(255,255,255,0.9); font-size: 0.85rem; letter-spacing: 0.2em; text-transform: uppercase;
  }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>

<canvas id="c"></canvas>
<div class="label">Granular Sand &mdash; Interactive Cube</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050508);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 0.1, 50);
camera.position.set(3.5, 2.5, 7);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.4;
controls.target.set(0, 0, 0);

scene.add(new THREE.AmbientLight(0xffffff, 0.5));

const sun = new THREE.DirectionalLight(0xffffff, 2.5);
sun.position.set(5, 5, 5);
scene.add(sun);

const fill = new THREE.DirectionalLight(0xffaa55, 2.0);
fill.position.set(-5, 0, -5);
scene.add(fill);

// Glass Cube - transparent
const cubeMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, metalness: 0.05, roughness: 0.05,
  transmission: 1.0, thickness: 1.0, transparent: true,
  opacity: 0.06, ior: 1.5, clearcoat: 1.0
});
const cube = new THREE.Mesh(new THREE.BoxGeometry(3, 3, 3), cubeMat);
scene.add(cube);

const wire = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(3, 3, 3)),
  new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.2 })
);
cube.add(wire);

// Floor reflection
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.MeshStandardMaterial({ color: 0x030305, roughness: 0.1, metalness: 0.9 })
);
floor.rotation.x = -Math.PI/2;
floor.position.y = -1.55;
scene.add(floor);

// PARTICLES
const COUNT = 180000;
const positions = new Float32Array(COUNT*3);
const colors = new Float32Array(COUNT*3);

const orange = new THREE.Color(0xff5500);
const gold = new THREE.Color(0xffaa00);

for (let i=0; i<COUNT; i++) {
  const i3 = i*3;
  
  // Fill the cube volume densely with clusters and voids
  let x = (Math.random()-0.5)*2.6;
  let y = (Math.random()-0.5)*2.6;
  let z = (Math.random()-0.5)*2.6;

  // Create large swirling voids and thick clusters like reference
  const swirl = Math.sin(x*3+y*2)*0.5 + Math.cos(z*2-x)*0.5;
  if (swirl > 0.3) {
    x += 0.4; y += 0.3; z += 0.4;
  }

  // Keep inside
  x = THREE.MathUtils.clamp(x, -1.3, 1.3);
  y = THREE.MathUtils.clamp(y, -1.3, 1.3);
  z = THREE.MathUtils.clamp(z, -1.3, 1.3);

  // Bias downward slightly for weight
  if (y > 0.2) y -= 0.4;

  positions[i3] = x;
  positions[i3+1] = y;
  positions[i3+2] = z;

  // Bright orange/gold
  const c = Math.random() > 0.4 ? orange : gold;
  colors[i3] = c.r; colors[i3+1] = c.g; colors[i3+2] = c.b;
}

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const material = new THREE.PointsMaterial({
  size: 0.08,
  vertexColors: true,
  transparent: true,
  opacity: 1.0,
  blending: THREE.AdditiveBlending,
  sizeAttenuation: true,
  depthWrite: false
});

const points = new THREE.Points(geo, material);
scene.add(points);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Very gentle rotation to show volume
  points.rotation.y = t * 0.05;

  // Gentle continuous motion inside cube
  const arr = points.geometry.attributes.position.array;
  for (let i=0; i<COUNT; i++) {
    const ix = i*3, iy = i*3+1, iz = i*3+2;
    arr[iy] -= 0.001;
    if (arr[iy] < -1.3) arr[iy] += 2.6;
  }
  points.geometry.attributes.position.needsUpdate = true;

  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
