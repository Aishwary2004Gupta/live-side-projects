<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hyperspeed: Neon Endless Drive</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        /* Perfectly centered scene container */
        #hyperspeed-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        /* Overlay title */
        .info-panel {
            position: absolute;
            top: 30px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            border-radius: 50px;
            border: 1px solid rgba(0, 247, 255, 0.3);
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .info-text {
            color: #00f7ff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 247, 255, 0.5);
        }

        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body>

    <div class="info-panel">
        <div class="info-text">⚡ HYPERSPEED ACTIVE & RUNNING ⚡</div>
    </div>

    <div id="hyperspeed-container"></div>

    <!-- Three.js + Postprocessing modules -->
    <script type="importmap">
        {
          "imports": {
            "three": "https://esm.sh/three@0.160.0",
            "postprocessing": "https://esm.sh/postprocessing@6.35.0"
          }
        }
    </script>

    <script type="module">
        import * as THREE from "three";
        import { EffectComposer, RenderPass, EffectPass, BloomEffect } from "postprocessing";

        // Setup the hyper-dense neon parameters
        const hyperDriveOptions = {
            distortion: "turbulentDistortion",
            length: 500,
            roadWidth: 15,
            islandWidth: 2,
            lanesPerRoad: 3,
            fov: 100, // Wide angle cinematic view
            baseSpeed: 1.5, // FAST by default
            carLightsFade: 0.1,
            totalSideLightSticks: 60,
            lightPairsPerRoadWay: 80, // High density of lines
            lightStickWidth: [0.1, 0.4],
            lightStickHeight: [1, 5],
            movingAwaySpeed: [100, 180], // Fast forward velocity
            movingCloserSpeed: [-100, -180],
            carLightsLength: [40, 120], // Long beautiful streaks
            carLightsRadius: [0.08, 0.2],
            carWidthPercentage: [0.2, 0.5],
            carShiftX: [-0.5, 0.5],
            carFloorSeparation: [0.1, 2],
            colors: {
                roadColor: 0x020205,
                islandColor: 0x000000,
                background: 0x000000,
                leftCars: [0xff007f, 0x9d00ff, 0xff00ff], // Cyberpunk magenta/purple
                rightCars: [0x00f7ff, 0x0088ff, 0x00ffaa], // Cyberpunk cyan/teal
                sticks: 0x00f7ff,
            },
        };

        const randomRange = (range) =>
            Array.isArray(range) ? Math.random() * (range[1] - range[0]) + range[0] : Math.random() * range;

        const pickRandom = (arr) =>
            Array.isArray(arr) ? arr[Math.floor(Math.random() * arr.length)] : arr;

        const distortionShader = `
            uniform vec4 uFreq; uniform vec4 uAmp;
            float nsin(float val){ return sin(val) * 0.5 + 0.5; }
            float getDistortionX(float p){ return cos(3.14159 * p * uFreq.x + uTime) * uAmp.x + pow(cos(3.14159 * p * uFreq.y + uTime * (uFreq.y/uFreq.x)), 2.) * uAmp.y; }
            float getDistortionY(float p){ return -nsin(3.14159 * p * uFreq.z + uTime) * uAmp.z - pow(nsin(3.14159 * p * uFreq.w + uTime/(uFreq.z/uFreq.w)), 5.) * uAmp.w; }
            vec3 getDistortion(float progress){ return vec3(getDistortionX(progress)-getDistortionX(0.0125), getDistortionY(progress)-getDistortionY(0.0125), 0.); }
        `;

        class HyperspeedApp {
            constructor(container, options) {
                this.container = container;
                this.options = options;
                this.clock = new THREE.Clock();
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(options.colors.background);
                this.scene.fog = new THREE.Fog(options.colors.background, options.length * 0.1, options.length * 1.5);

                this.timeOffset = 0;

                const { width, height } = this.getSize();
                this.camera = new THREE.PerspectiveCamera(options.fov, width / height, 0.1, 5000);
                this.camera.position.set(0, 7, -15);
                this.camera.lookAt(0, 4, 10); // Look forward into the distance

                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
                this.renderer.setSize(width, height);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                container.appendChild(this.renderer.domElement);

                // Glow/Bloom Effects
                this.composer = new EffectComposer(this.renderer);
                const renderPass = new RenderPass(this.scene, this.camera);
                const bloomEffect = new BloomEffect({ luminanceThreshold: 0.1, luminanceSmoothing: 0.3, intensity: 1.5, radius: 0.8 });
                const bloomPass = new EffectPass(this.camera, bloomEffect);

                this.composer.addPass(renderPass);
                this.composer.addPass(bloomPass);

                this.uniformsDistortion = {
                    uFreq: { value: new THREE.Vector4(4, 8, 8, 1) },
                    uAmp: { value: new THREE.Vector4(15, 5, 10, 5) },
                };

                this.initObjects();
                window.addEventListener("resize", () => this.resize());
                this.animate();
            }

            getSize() {
                return { width: this.container.clientWidth, height: this.container.clientHeight };
            }

            initObjects() {
                const opts = this.options;

                const makePlane = (xOffset, width, colorHex) => {
                    const geo = new THREE.PlaneGeometry(width, opts.length, 20, 100);
                    const mat = new THREE.ShaderMaterial({
                        uniforms: { uTime: { value: 0 }, uTravelLength: { value: opts.length }, uColor: { value: new THREE.Color(colorHex) }, ...this.uniformsDistortion },
                        vertexShader: `uniform float uTime; uniform float uTravelLength; varying vec2 vUv; #include <getDistortion_vertex> void main() { vec3 transformed = position.xyz; float progress = (transformed.y + uTravelLength/2.)/uTravelLength; vec3 dist = getDistortion(progress); transformed.x += dist.x; transformed.z += dist.y; transformed.y -= dist.z; gl_Position = projectionMatrix * modelViewMatrix * vec4(transformed,1.); vUv = uv; }`,
                        fragmentShader: `uniform vec3 uColor; void main() { gl_FragColor = vec4(uColor, 1.0); }`,
                        side: THREE.DoubleSide,
                    });
                    mat.onBeforeCompile = (s) => s.vertexShader = s.vertexShader.replace("#include <getDistortion_vertex>", distortionShader);
                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.rotation.x = -Math.PI / 2;
                    mesh.position.set(xOffset, 0, -opts.length / 2);
                    this.scene.add(mesh);
                };

                makePlane(-(opts.roadWidth / 2 + opts.islandWidth / 2), opts.roadWidth, opts.colors.roadColor);
                makePlane(opts.roadWidth / 2 + opts.islandWidth / 2, opts.roadWidth, opts.colors.roadColor);

                this.createLines(-(opts.roadWidth / 2 + opts.islandWidth / 2), opts.colors.leftCars, opts.movingAwaySpeed);
                this.createLines(opts.roadWidth / 2 + opts.islandWidth / 2, opts.colors.rightCars, opts.movingCloserSpeed);
                this.createSideSticks(-(opts.roadWidth + opts.islandWidth / 2));
                this.createSideSticks(opts.roadWidth + opts.islandWidth / 2);
            }

            createLines(xPos, colorSet, speedRange) {
                const opts = this.options;
                const count = opts.lightPairsPerRoadWay * 2;
                const instanced = new THREE.InstancedBufferGeometry().copy(new THREE.CylinderGeometry(0.1, 0.1, 1, 6));
                instanced.instanceCount = count;

                const offsets = [], metrics = [], colorsArr = [];
                const colorList = colorSet.map((c) => new THREE.Color(c));

                for (let i = 0; i < opts.lightPairsPerRoadWay; i++) {
                    const radius = randomRange(opts.carLightsRadius);
                    const length = randomRange(opts.carLightsLength);
                    const speed = randomRange(speedRange);
                    const laneWidth = opts.roadWidth / opts.lanesPerRoad;
                    const laneX = (i % opts.lanesPerRoad) * laneWidth - opts.roadWidth / 2 + laneWidth / 2;
                    const carWidth = randomRange(opts.carWidthPercentage) * laneWidth;
                    const y = randomRange(opts.carFloorSeparation);
                    const z = -randomRange(opts.length);

                    for (let side = -1; side <= 1; side += 2) {
                        offsets.push(laneX + (side * carWidth) / 2, y, z);
                        metrics.push(radius, length, speed);
                        const col = pickRandom(colorList);
                        colorsArr.push(col.r, col.g, col.b);
                    }
                }

                instanced.setAttribute("aOffset", new THREE.InstancedBufferAttribute(new Float32Array(offsets), 3));
                instanced.setAttribute("aMetrics", new THREE.InstancedBufferAttribute(new Float32Array(metrics), 3));
                instanced.setAttribute("aColor", new THREE.InstancedBufferAttribute(new Float32Array(colorsArr), 3));

                const mat = new THREE.ShaderMaterial({
                    uniforms: { uTime: { value: 0 }, uTravelLength: { value: opts.length }, ...this.uniformsDistortion },
                    vertexShader: `attribute vec3 aOffset; attribute vec3 aMetrics; attribute vec3 aColor; uniform float uTravelLength; uniform float uTime; varying vec3 vColor; #include <getDistortion_vertex> void main() { vec3 pos = position.xyz; float r = aMetrics.x; float len = aMetrics.y; float sp = aMetrics.z; pos.xy *= r; pos.z *= len; pos.z += len - mod(uTime * sp + aOffset.z, uTravelLength); pos.xy += aOffset.xy; float prog = abs(pos.z / uTravelLength); pos.xyz += getDistortion(prog); gl_Position = projectionMatrix * modelViewMatrix * vec4(pos,1.); vColor = aColor; }`,
                    fragmentShader: `varying vec3 vColor; void main() { gl_FragColor = vec4(vColor, 1.0); }`,
                    transparent: true,
                });
                mat.onBeforeCompile = (s) => s.vertexShader = s.vertexShader.replace("#include <getDistortion_vertex>", distortionShader);

                const mesh = new THREE.Mesh(instanced, mat);
                mesh.position.x = xPos;
                this.scene.add(mesh);
            }

            createSideSticks(xPos) {
                const opts = this.options;
                const instanced = new THREE.InstancedBufferGeometry().copy(new THREE.PlaneGeometry(1, 1));
                instanced.instanceCount = opts.totalSideLightSticks;

                const offsets = [], colorsArr = [], metrics = [];
                const step = opts.length / opts.totalSideLightSticks;
                const stickColor = new THREE.Color(opts.colors.sticks);

                for (let i = 0; i < opts.totalSideLightSticks; i++) {
                    offsets.push(i * step);
                    colorsArr.push(stickColor.r, stickColor.g, stickColor.b);
                    metrics.push(randomRange(opts.lightStickWidth), randomRange(opts.lightStickHeight));
                }

                instanced.setAttribute("aOffset", new THREE.InstancedBufferAttribute(new Float32Array(offsets), 1));
                instanced.setAttribute("aColor", new THREE.InstancedBufferAttribute(new Float32Array(colorsArr), 3));
                instanced.setAttribute("aMetrics", new THREE.InstancedBufferAttribute(new Float32Array(metrics), 2));

                const mat = new THREE.ShaderMaterial({
                    uniforms: { uTime: { value: 0 }, uTravelLength: { value: opts.length }, ...this.uniformsDistortion },
                    vertexShader: `attribute float aOffset; attribute vec3 aColor; attribute vec2 aMetrics; uniform float uTravelLength; uniform float uTime; varying vec3 vColor; #include <getDistortion_vertex> void main() { vec3 pos = position.xyz; pos.xy *= aMetrics; float timeShift = mod(uTime*120. + aOffset, uTravelLength); pos.z = -uTravelLength + timeShift; float prog = abs(pos.z / uTravelLength); pos.xyz += getDistortion(prog); pos.y += aMetrics.y/2.; gl_Position = projectionMatrix * modelViewMatrix * vec4(pos,1.); vColor = aColor; }`,
                    fragmentShader: `varying vec3 vColor; void main() { gl_FragColor = vec4(vColor, 1.0); }`,
                    transparent: true,
                    side: THREE.DoubleSide,
                });
                mat.onBeforeCompile = (s) => s.vertexShader = s.vertexShader.replace("#include <getDistortion_vertex>", distortionShader);

                const mesh = new THREE.Mesh(instanced, mat);
                mesh.position.x = xPos;
                this.scene.add(mesh);
            }

            resize() {
                const { width, height } = this.getSize();
                this.renderer.setSize(width, height);
                this.camera.aspect = width / height;
                this.camera.updateProjectionMatrix();
                this.composer.setSize(width, height);
            }

            animate() {
                const delta = this.clock.getDelta();
                this.timeOffset += this.options.baseSpeed * delta; // Drives forward motion infinitely
                const time = this.clock.elapsedTime + this.timeOffset;

                this.scene.traverse((obj) => {
                    if (obj.isMesh && obj.material && obj.material.uniforms && obj.material.uniforms.uTime) {
                        obj.material.uniforms.uTime.value = time;
                    }
                });

                this.composer.render();
                requestAnimationFrame(() => this.animate());
            }
        }

        const container = document.getElementById("hyperspeed-container");
        new HyperspeedApp(container, hyperDriveOptions);
    </script>
</body>
</html>
