<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hyperspeed Effect</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: none;
        }

        .hyperspeed-container {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
            background: #000;
            overflow: hidden;
        }

        .info-text {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            border-radius: 50px;
            color: #00f7ff;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            border: 1px solid rgba(0, 247, 255, 0.3);
            z-index: 10;
            pointer-events: none;
        }

        .speed-tip {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 50px;
            color: #ffcc00;
            font-size: 14px;
            z-index: 10;
            pointer-events: none;
        }

        /* Loading state */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            color: #00f7ff;
            font-family: monospace;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">LOADING HYPERSPEED...</div>
    <div class="hyperspeed-container" id="hyperspeed-container">
        <div class="info-text">
            ⚡ HYPERSPEED DRIVE ⚡ &nbsp;&nbsp;|&nbsp; HOLD CLICK / TOUCH → BOOST
        </div>
        <div class="speed-tip">🚀 Always running - Hold to go faster!</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://esm.sh/three@0.160.0",
                "postprocessing": "https://esm.sh/postprocessing@6.35.0"
            }
        }
    </script>

    <script type="module">
        import * as THREE from "three";
        import {
            EffectComposer,
            RenderPass,
            EffectPass,
            BloomEffect,
        } from "postprocessing";

        // Hyperspeed Presets
        const hyperspeedPresets = {
            one: { // Cyberpunk - Always running version
                distortion: "turbulentDistortion",
                length: 600,
                roadWidth: 12,
                islandWidth: 3,
                lanesPerRoad: 3,
                fov: 90,
                fovSpeedUp: 130,
                baseSpeed: 0.8,  // Always moving base speed
                speedUp: 2.5,    // Additional speed when boosting
                carLightsFade: 0.4,
                totalSideLightSticks: 30,
                lightPairsPerRoadWay: 50,
                shoulderLinesWidthPercentage: 0.05,
                brokenLinesWidthPercentage: 0.1,
                brokenLinesLengthPercentage: 0.5,
                lightStickWidth: [0.12, 0.5],
                lightStickHeight: [1.3, 1.7],
                movingAwaySpeed: [80, 120],
                movingCloserSpeed: [-160, -240],
                carLightsLength: [20, 100],
                carLightsRadius: [0.05, 0.2],
                carWidthPercentage: [0.3, 0.6],
                carShiftX: [-0.8, 0.8],
                carFloorSeparation: [0, 5],
                colors: {
                    roadColor: 0x0a0a12,
                    islandColor: 0x05050a,
                    background: 0x000000,
                    shoulderLines: 0x1a1a2e,
                    brokenLines: 0x1a1a2e,
                    leftCars: [0xd856bf, 0x6750a2, 0xc247ac, 0xff2ced],
                    rightCars: [0x03b3c3, 0x0e5ea5, 0x324555, 0x00f7ff],
                    sticks: 0x00f7ff,
                },
            }
        };

        // Helper functions
        const nsin = (val) => Math.sin(val) * 0.5 + 0.5;
        const randomRange = (range) =>
            Array.isArray(range)
                ? Math.random() * (range[1] - range[0]) + range[0]
                : Math.random() * range;
        const pickRandom = (arr) =>
            Array.isArray(arr) ? arr[Math.floor(Math.random() * arr.length)] : arr;

        // Distortion effects
        const distortions = {
            turbulentDistortion: {
                uniforms: {
                    uFreq: { value: new THREE.Vector4(4, 8, 8, 1) },
                    uAmp: { value: new THREE.Vector4(30, 8, 15, 12) },
                },
                getDistortion: `
                    uniform vec4 uFreq; uniform vec4 uAmp;
                    float nsin(float val){ return sin(val) * 0.5 + 0.5; }
                    float getDistortionX(float p){
                        return cos(3.14159 * p * uFreq.x + uTime) * uAmp.x +
                               pow(cos(3.14159 * p * uFreq.y + uTime * (uFreq.y/uFreq.x)), 2.) * uAmp.y;
                    }
                    float getDistortionY(float p){
                        return -nsin(3.14159 * p * uFreq.z + uTime) * uAmp.z -
                               pow(nsin(3.14159 * p * uFreq.w + uTime/(uFreq.z/uFreq.w)), 5.) * uAmp.w;
                    }
                    vec3 getDistortion(float progress){
                        return vec3(
                            getDistortionX(progress)-getDistortionX(0.0125),
                            getDistortionY(progress)-getDistortionY(0.0125),
                            0.
                        );
                    }
                `,
            }
        };

        // Hyperspeed Component - Always Running Version
        class Hyperspeed {
            constructor(container, effectOptions) {
                this.container = container;
                this.options = effectOptions;
                this.clock = new THREE.Clock();
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(this.options.colors.background);
                this.scene.fog = new THREE.Fog(
                    this.options.colors.background,
                    this.options.length * 0.2,
                    this.options.length * 1.2
                );

                // Initialize with base speed (always moving)
                this.speed = this.options.baseSpeed || 0.8;
                this.speedUpTarget = 0;
                this.fovTarget = this.options.fov;
                this.timeOffset = 0;
                this.autoPulseActive = false;
                this.lastPulseTime = 0;

                this.initCamera();
                this.initRenderer();
                this.initPostProcessing();
                this.initObjects();
                this.bindEvents();

                // Hide loading screen when everything is ready
                setTimeout(() => {
                    document.getElementById('loading').style.opacity = '0';
                    setTimeout(() => {
                        document.getElementById('loading').style.display = 'none';
                    }, 500);
                }, 1000);

                this.animate();
            }

            initCamera() {
                const { width, height } = this.getSize();
                this.camera = new THREE.PerspectiveCamera(
                    this.options.fov,
                    width / height,
                    0.1,
                    5000
                );
                this.camera.position.set(0, 6, -5);
                this.camera.lookAt(0, 6, 0);
            }

            initRenderer() {
                this.renderer = new THREE.WebGLRenderer({
                    antialias: true,
                    alpha: false
                });
                this.renderer.setSize(this.getSize().width, this.getSize().height);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.container.appendChild(this.renderer.domElement);
            }

            initPostProcessing() {
                this.composer = new EffectComposer(this.renderer);
                const renderPass = new RenderPass(this.scene, this.camera);

                const bloomEffect = new BloomEffect({
                    luminanceThreshold: 0.15,
                    luminanceSmoothing: 0.2,
                    intensity: 1.2,
                    radius: 0.7,
                });

                const bloomPass = new EffectPass(this.camera, bloomEffect);
                renderPass.renderToScreen = false;
                bloomPass.renderToScreen = true;

                this.composer.addPass(renderPass);
                this.composer.addPass(bloomPass);
            }

            getSize() {
                return {
                    width: window.innerWidth,
                    height: window.innerHeight
                };
            }

            initObjects() {
                const opts = this.options;

                // Create road planes
                this.createRoadPlane(
                    -(opts.roadWidth / 2 + opts.islandWidth / 2),
                    opts.roadWidth,
                    true,
                    opts.colors.roadColor
                );
                this.createRoadPlane(
                    opts.roadWidth / 2 + opts.islandWidth / 2,
                    opts.roadWidth,
                    true,
                    opts.colors.roadColor
                );
                this.createRoadPlane(
                    0,
                    opts.islandWidth,
                    false,
                    opts.colors.islandColor
                );

                // Create car lights
                this.createCarLights(
                    -(opts.roadWidth / 2 + opts.islandWidth / 2),
                    opts.colors.leftCars,
                    opts.movingAwaySpeed,
                    new THREE.Vector2(0, 1 - opts.carLightsFade)
                );
                this.createCarLights(
                    opts.roadWidth / 2 + opts.islandWidth / 2,
                    opts.colors.rightCars,
                    opts.movingCloserSpeed,
                    new THREE.Vector2(1, opts.carLightsFade)
                );

                // Create side lights
                this.createSideSticks(-(opts.roadWidth + opts.islandWidth / 2));
                this.createSideSticks(opts.roadWidth + opts.islandWidth / 2);
            }

            createRoadPlane(xOffset, width, isRoad, colorHex) {
                const opts = this.options;
                const geo = new THREE.PlaneGeometry(width, opts.length, 40, 200);
                const uniforms = {
                    uTime: { value: 0 },
                    uTravelLength: { value: opts.length },
                    uColor: { value: new THREE.Color(colorHex) },
                    ...this.getDistortionUniforms()
                };

                if (isRoad) {
                    uniforms.uLanes = { value: opts.lanesPerRoad };
                    uniforms.uBrokenLinesColor = {
                        value: new THREE.Color(opts.colors.brokenLines)
                    };
                    uniforms.uBrokenLinesWidthPercentage = {
                        value: opts.brokenLinesWidthPercentage
                    };
                    uniforms.uBrokenLinesLengthPercentage = {
                        value: opts.brokenLinesLengthPercentage
                    };
                }

                const mat = new THREE.ShaderMaterial({
                    uniforms: uniforms,
                    vertexShader: this.getRoadVertexShader(),
                    fragmentShader: isRoad
                        ? this.getRoadFragmentShader()
                        : this.getIslandFragmentShader(),
                    side: THREE.DoubleSide
                });

                this.applyDistortionShader(mat);

                const mesh = new THREE.Mesh(geo, mat);
                mesh.rotation.x = -Math.PI / 2;
                mesh.position.set(xOffset, 0, -opts.length / 2);
                this.scene.add(mesh);
            }

            createCarLights(xPos, colorSet, speedRange, fadeVec) {
                const opts = this.options;
                const baseGeo = new THREE.CylinderGeometry(0.1, 0.1, 1, 6);
                const instanced = new THREE.InstancedBufferGeometry().copy(baseGeo);
                const count = opts.lightPairsPerRoadWay * 2;
                instanced.instanceCount = count;

                const offsets = [], metrics = [], colorsArr = [];
                const laneWidth = opts.roadWidth / opts.lanesPerRoad;
                const colorList = Array.isArray(colorSet)
                    ? colorSet.map(c => new THREE.Color(c))
                    : [new THREE.Color(colorSet)];

                for (let i = 0; i < opts.lightPairsPerRoadWay; i++) {
                    const radius = randomRange(opts.carLightsRadius);
                    const length = randomRange(opts.carLightsLength);
                    const speed = randomRange(speedRange);
                    const lane = i % opts.lanesPerRoad;
                    let laneX = lane * laneWidth - opts.roadWidth / 2 + laneWidth / 2;
                    const carWidth = randomRange(opts.carWidthPercentage) * laneWidth;
                    laneX += randomRange(opts.carShiftX) * laneWidth;
                    const offsetY = randomRange(opts.carFloorSeparation) + radius;
                    const offsetZ = -randomRange(opts.length);

                    for (let side = -1; side <= 1; side += 2) {
                        offsets.push(laneX + (side * carWidth) / 2, offsetY, offsetZ);
                        metrics.push(radius, length, speed);
                        const col = pickRandom(colorList);
                        colorsArr.push(col.r, col.g, col.b);
                    }
                }

                instanced.setAttribute(
                    "aOffset",
                    new THREE.InstancedBufferAttribute(new Float32Array(offsets), 3)
                );
                instanced.setAttribute(
                    "aMetrics",
                    new THREE.InstancedBufferAttribute(new Float32Array(metrics), 3)
                );
                instanced.setAttribute(
                    "aColor",
                    new THREE.InstancedBufferAttribute(new Float32Array(colorsArr), 3)
                );

                const mat = new THREE.ShaderMaterial({
                    uniforms: {
                        uTime: { value: 0 },
                        uTravelLength: { value: opts.length },
                        uFade: { value: fadeVec },
                        ...this.getDistortionUniforms()
                    },
                    vertexShader: this.getCarVertexShader(),
                    fragmentShader: this.getCarFragmentShader(),
                    transparent: true
                });

                this.applyDistortionShader(mat);

                const mesh = new THREE.Mesh(instanced, mat);
                mesh.position.x = xPos;
                this.scene.add(mesh);
            }

            createSideSticks(xPos) {
                const opts = this.options;
                const geo = new THREE.PlaneGeometry(1, 1);
                const instanced = new THREE.InstancedBufferGeometry().copy(geo);
                const total = opts.totalSideLightSticks;
                instanced.instanceCount = total;

                const offsets = [], colorsArr = [], metrics = [];
                const step = opts.length / (total - 1);
                const colorStick = Array.isArray(opts.colors.sticks)
                    ? opts.colors.sticks.map(c => new THREE.Color(c))
                    : [new THREE.Color(opts.colors.sticks)];

                for (let i = 0; i < total; i++) {
                    offsets.push((i - 1) * step * 2 + step * Math.random());
                    const col = pickRandom(colorStick);
                    colorsArr.push(col.r, col.g, col.b);
                    metrics.push(
                        randomRange(opts.lightStickWidth),
                        randomRange(opts.lightStickHeight)
                    );
                }

                instanced.setAttribute(
                    "aOffset",
                    new THREE.InstancedBufferAttribute(new Float32Array(offsets), 1)
                );
                instanced.setAttribute(
                    "aColor",
                    new THREE.InstancedBufferAttribute(new Float32Array(colorsArr), 3)
                );
                instanced.setAttribute(
                    "aMetrics",
                    new THREE.InstancedBufferAttribute(new Float32Array(metrics), 2)
                );

                const mat = new THREE.ShaderMaterial({
                    uniforms: {
                        uTime: { value: 0 },
                        uTravelLength: { value: opts.length },
                        ...this.getDistortionUniforms()
                    },
                    vertexShader: this.getStickVertexShader(),
                    fragmentShader: this.getStickFragmentShader(),
                    side: THREE.DoubleSide,
                    transparent: true
                });

                this.applyDistortionShader(mat);

                const mesh = new THREE.Mesh(instanced, mat);
                mesh.position.x = xPos;
                this.scene.add(mesh);
            }

            getDistortionUniforms() {
                const distortion = distortions[this.options.distortion] || distortions.turbulentDistortion;
                return distortion.uniforms;
            }

            applyDistortionShader(material) {
                const distortion = distortions[this.options.distortion] || distortions.turbulentDistortion;
                if (distortion.getDistortion) {
                    material.onBeforeCompile = (shader) => {
                        shader.vertexShader = shader.vertexShader.replace(
                            "#include <getDistortion_vertex>",
                            distortion.getDistortion
                        );
                    };
                }
            }

            bindEvents() {
                const handleSpeedUp = () => {
                    this.speedUpTarget = this.options.speedUp;
                    this.fovTarget = this.options.fovSpeedUp;
                };

                const handleSlow = () => {
                    this.speedUpTarget = 0;
                    this.fovTarget = this.options.fov;
                };

                // Mouse events
                this.container.addEventListener("mousedown", handleSpeedUp);
                this.container.addEventListener("mouseup", handleSlow);
                this.container.addEventListener("mouseleave", handleSlow);

                // Touch events
                this.container.addEventListener("touchstart", (e) => {
                    e.preventDefault();
                    handleSpeedUp();
                });
                this.container.addEventListener("touchend", handleSlow);
                this.container.addEventListener("touchcancel", handleSlow);

                // Prevent context menu on long press
                this.container.addEventListener("contextmenu", (e) => e.preventDefault());

                // Window resize
                window.addEventListener("resize", () => this.resize());
            }

            resize() {
                const { width, height } = this.getSize();
                if (width <= 0 || height <= 0) return;

                this.renderer.setSize(width, height);
                this.camera.aspect = width / height;
                this.camera.updateProjectionMatrix();
                this.composer.setSize(width, height);
            }

            // Auto-pulse effect for when there's no interaction
            autoPulse() {
                const now = Date.now();
                if (now - this.lastPulseTime > 10000) { // Every 10 seconds
                    this.lastPulseTime = now;

                    // Create a temporary speed boost
                    this.speedUpTarget = this.options.speedUp * 0.7;

                    // Reset after 2 seconds
                    setTimeout(() => {
                        if (!this.autoPulseActive) {
                            this.speedUpTarget = 0;
                        }
                    }, 2000);
                }
            }

            update(delta) {
                // Always have some base speed (never zero)
                const baseSpeed = this.options.baseSpeed || 0.8;

                // Calculate current speed (base + boost)
                const lerpSpeed = Math.min(1, delta * 8);
                this.speed = baseSpeed + (this.speedUpTarget * lerpSpeed);

                // Update time with current speed
                this.timeOffset += this.speed * delta;

                // Auto-pulse when no interaction
                this.autoPulse();

                const time = this.clock.elapsedTime + this.timeOffset;

                // Update all materials with time
                this.scene.traverse((obj) => {
                    if (obj.isMesh && obj.material && obj.material.uniforms && obj.material.uniforms.uTime) {
                        obj.material.uniforms.uTime.value = time;
                    }
                });

                // Update camera FOV
                this.camera.fov += (this.fovTarget - this.camera.fov) * delta * 5;
                this.camera.updateProjectionMatrix();
            }

            render() {
                if (this.composer) this.composer.render();
            }

            animate() {
                const delta = Math.min(0.033, this.clock.getDelta());
                this.update(delta);
                this.render();
                requestAnimationFrame(() => this.animate());
            }

            // Shader functions
            getRoadVertexShader() {
                return `
                    uniform float uTime; uniform float uTravelLength; varying vec2 vUv;
                    #include <getDistortion_vertex>
                    void main() {
                        vec3 transformed = position.xyz;
                        float progress = (transformed.y + uTravelLength/2.)/uTravelLength;
                        vec3 dist = getDistortion(progress);
                        transformed.x += dist.x;
                        transformed.z += dist.y;
                        transformed.y -= dist.z;
                        vec4 mv = modelViewMatrix * vec4(transformed,1.);
                        gl_Position = projectionMatrix * mv;
                        vUv = uv;
                    }
                `;
            }

            getRoadFragmentShader() {
                return `
                    uniform vec3 uColor;
                    uniform float uLanes;
                    uniform vec3 uBrokenLinesColor;
                    uniform float uBrokenLinesWidthPercentage;
                    uniform float uBrokenLinesLengthPercentage;
                    uniform float uTime;
                    varying vec2 vUv;

                    void main() {
                        vec2 uv = vUv;
                        uv.y = mod(uv.y + uTime * 0.05, 1.);

                        float laneWidth = 1./uLanes;
                        float brokenW = laneWidth * uBrokenLinesWidthPercentage;

                        // Create dashed lines effect
                        float lines = step(1.-brokenW, fract(uv.x*2.)) *
                                     step(uBrokenLinesLengthPercentage, fract(uv.y*10.));

                        // Create shoulder lines
                        float side = step(1.-brokenW, fract((uv.x - laneWidth*(uLanes-1.))*2.)) +
                                    step(brokenW, uv.x);
                        lines = mix(lines, side, uv.x);

                        // Mix colors
                        vec3 col = mix(uColor, uBrokenLinesColor, lines);
                        gl_FragColor = vec4(col, 1.0);
                    }
                `;
            }

            getIslandFragmentShader() {
                return `
                    uniform vec3 uColor;
                    void main() {
                        gl_FragColor = vec4(uColor, 1.0);
                    }
                `;
            }

            getCarVertexShader() {
                return `
                    attribute vec3 aOffset;
                    attribute vec3 aMetrics;
                    attribute vec3 aColor;
                    uniform float uTravelLength;
                    uniform float uTime;
                    varying vec3 vColor;
                    varying vec2 vUv;
                    #include <getDistortion_vertex>

                    void main() {
                        vec3 pos = position.xyz;
                        float r = aMetrics.x;
                        float len = aMetrics.y;
                        float sp = aMetrics.z;

                        pos.xy *= r;
                        pos.z *= len;
                        pos.z += len - mod(uTime * sp + aOffset.z, uTravelLength);
                        pos.xy += aOffset.xy;

                        float prog = abs(pos.z / uTravelLength);
                        pos.xyz += getDistortion(prog);

                        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos,1.);
                        vColor = aColor;
                        vUv = uv;
                    }
                `;
            }

            getCarFragmentShader() {
                return `
                    uniform vec2 uFade;
                    varying vec3 vColor;
                    varying vec2 vUv;

                    void main() {
                        float alpha = smoothstep(uFade.x, uFade.y, vUv.x);
                        if(alpha < 0.01) discard;
                        gl_FragColor = vec4(vColor, alpha * 0.9);
                    }
                `;
            }

            getStickVertexShader() {
                return `
                    attribute float aOffset;
                    attribute vec3 aColor;
                    attribute vec2 aMetrics;
                    uniform float uTravelLength;
                    uniform float uTime;
                    varying vec3 vColor;
                    #include <getDistortion_vertex>

                    void main() {
                        vec3 pos = position.xyz;
                        pos.xy *= aMetrics;
                        float timeShift = mod(uTime * 120. + aOffset, uTravelLength);
                        pos.z = -uTravelLength + timeShift;

                        float prog = abs(pos.z / uTravelLength);
                        pos.xyz += getDistortion(prog);

                        pos.y += aMetrics.y/2.;
                        pos.x -= aMetrics.x/2.;

                        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos,1.);
                        vColor = aColor;
                    }
                `;
            }

            getStickFragmentShader() {
                return `
                    varying vec3 vColor;

                    void main() {
                        // Add some glow based on brightness
                        float brightness = (vColor.r + vColor.g + vColor.b) / 3.0;
                        float alpha = mix(0.7, 1.0, brightness);
                        gl_FragColor = vec4(vColor, alpha);
                    }
                `;
            }
        }

        // Initialize the Hyperspeed effect with the Cyberpunk preset
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById("hyperspeed-container");

            // Enhanced Cyberpunk preset with better visibility
            const enhancedPreset = {
                ...hyperspeedPresets.one,
                colors: {
                    ...hyperspeedPresets.one.colors,
                    roadColor: 0x0d0d1a,
                    islandColor: 0x080812,
                    brokenLines: 0x2a2a4a,
                    shoulderLines: 0x1a1a3a,
                    leftCars: [0xff2ced, 0xd856bf, 0xff00aa, 0xc247ac],
                    rightCars: [0x00f7ff, 0x03b3c3, 0x00aaff, 0x0e5ea5],
                    sticks: 0x00f7ff
                },
                lightPairsPerRoadWay: 60,  // More cars for better visibility
                carLightsLength: [30, 120],  // Longer light trails
                totalSideLightSticks: 40    // More side lights
            };

            new Hyperspeed(container, enhancedPreset);
        });
    </script>
</body>
</html>
