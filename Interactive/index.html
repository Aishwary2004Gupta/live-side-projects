<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mouse Interactive Site</title>

    <style>
      .scene {
  position: relative;
  width: 600px;
  height: 400px;
  overflow: hidden;
}

.scene img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.overlay {
  position: absolute;
  inset: 0;
  background: radial-gradient(
    circle 120px at var(--x) var(--y),
    transparent 0,
    transparent 100px,
    rgba(0, 0, 0, 0.8) 130px
  );
  pointer-events: none;
}
      
    </style>
  </head>
  <body>
    <div class="cursor"></div>

    <section class="hero">
      <h1>Move<br />Your Mouse</h1>
      <p>
        This page reacts to your mouse position with a glowing spotlight, custom
        cursor, and 3D hover cards.
      </p>

      <div class="scene" id="scene">
  <img src="image.jpg" alt="">
  <div class="overlay"></div>
</div>

<script>
const scene = document.querySelector("#scene");
const overlay = document.querySelector(".overlay");

scene.addEventListener("mousemove", (event) => {
  const rect = scene.getBoundingClientRect();
  const x = event.clientX - rect.left;
  const y = event.clientY - rect.top;

  overlay.style.setProperty("--x", `${x}px`);
  overlay.style.setProperty("--y", `${y}px`);
});
</script>
  </body>
</html>
