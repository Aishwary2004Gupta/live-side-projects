<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mouse Interactive Site</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: #050505;
        color: white;
        overflow-x: hidden;
        cursor: none;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          circle 300px at var(--mouse-x, 50%) var(--mouse-y, 50%),
          rgba(0, 255, 255, 0.25),
          transparent 70%
        );
        z-index: 1;
      }

      .cursor {
        position: fixed;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: white;
        pointer-events: none;
        z-index: 9999;
        mix-blend-mode: difference;
        transform: translate(-50%, -50%);
      }

      .hero {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 40px;
        position: relative;
        z-index: 2;
      }

      h1 {
        font-size: clamp(3rem, 10vw, 8rem);
        letter-spacing: -0.08em;
        line-height: 0.9;
        margin-bottom: 24px;
      }

      p {
        max-width: 600px;
        font-size: 1.2rem;
        color: #aaa;
        margin-bottom: 60px;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(3, minmax(180px, 260px));
        gap: 24px;
      }

      .card {
        height: 320px;
        border-radius: 24px;
        background:
          radial-gradient(
            circle at var(--card-x, 50%) var(--card-y, 50%),
            rgba(255, 255, 255, 0.25),
            transparent 35%
          ),
          linear-gradient(135deg, #151515, #090909);
        border: 1px solid rgba(255, 255, 255, 0.12);
        display: flex;
        align-items: end;
        padding: 24px;
        transform-style: preserve-3d;
        transition:
          transform 0.12s ease,
          border-color 0.2s ease;
      }

      .card:hover {
        border-color: rgba(0, 255, 255, 0.6);
      }

      .card span {
        font-size: 1.5rem;
        font-weight: bold;
        transform: translateZ(40px);
      }

      @media (max-width: 800px) {
        body {
          cursor: auto;
        }

        .cursor {
          display: none;
        }

        .cards {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="cursor"></div>

    <section class="hero">
      <h1>Move<br />Your Mouse</h1>
      <p>
        This page reacts to your mouse position with a glowing spotlight, custom
        cursor, and 3D hover cards.
      </p>

      <div class="cards">
        <div class="card">
          <span>Hover Me</span>
        </div>
        <div class="card">
          <span>Interactive</span>
        </div>
        <div class="card">
          <span>Mouse FX</span>
        </div>
      </div>
    </section>

    <script>
      const cursor = document.querySelector(".cursor");

      window.addEventListener("mousemove", (e) => {
        const x = e.clientX;
        const y = e.clientY;

        document.body.style.setProperty("--mouse-x", `${x}px`);
        document.body.style.setProperty("--mouse-y", `${y}px`);

        cursor.style.left = `${x}px`;
        cursor.style.top = `${y}px`;
      });

      const cards = document.querySelectorAll(".card");

      cards.forEach((card) => {
        card.addEventListener("mousemove", (e) => {
          const rect = card.getBoundingClientRect();

          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;

          const centerX = rect.width / 2;
          const centerY = rect.height / 2;

          const rotateX = ((y - centerY) / centerY) * -10;
          const rotateY = ((x - centerX) / centerX) * 10;

          card.style.transform = `
          perspective(800px)
          rotateX(${rotateX}deg)
          rotateY(${rotateY}deg)
          scale(1.04)
        `;

          card.style.setProperty("--card-x", `${x}px`);
          card.style.setProperty("--card-y", `${y}px`);
        });

        card.addEventListener("mouseleave", () => {
          card.style.transform = `
          perspective(800px)
          rotateX(0deg)
          rotateY(0deg)
          scale(1)
        `;
        });
      });
    </script>
  </body>
</html>
