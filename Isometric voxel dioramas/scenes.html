.bb::after{content:'';position:absolute;left:50%;bottom:-17px;margin-left:-10px;border:10px solid transparent;border-top:15px solid #111;border-bottom:0}
.bb::before{content:'';position:absolute;left:50%;bottom:-11px;margin-left:-7px;border:7px solid transparent;border-top:12px solid #fff;border-bottom:0;z-index:1}
.bb.shout{background-color:transparent;background-size:100% 100%;border:0;border-radius:0;box-shadow:none;padding:.9em 1.5em;color:#e8261b;font-size:clamp(15px,3vw,30px);text-shadow:2px 2px 0 #111,-1px -1px 0 #111,1px -1px 0 #111,-1px 1px 0 #111;white-space:nowrap;max-width:none}
.bb.shout::before,.bb.shout::after{display:none}

.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{font:inherit;color:var(--fg);background:var(--btn);border:0;border-radius:8px;padding:8px 16px;cursor:pointer}
button.on{background:var(--on);color:var(--onfg)}
