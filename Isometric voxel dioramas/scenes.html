<!DOCTYPE html>

<style>

  #mode{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:44px;height:44px;display:grid;place-items:center;
    border:3px solid #1b2433;border-radius:6px;background:#fff;color:#1b2433;box-shadow:3px 3px 0 #1b2433;cursor:pointer;z-index:2;padding:0}
  #mode:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #1b2433}
  #mode:focus-visible{outline:3px solid #3a86ff;outline-offset:3px}
  body.dark #mode{background:#1a2550;color:#ffe9a8;border-color:#ffe9a8;box-shadow:3px 3px 0 #ffe9a8}
</style>
</head>

{const px=-11,pz=-7;

// ---------- day / night ----------
const btn=document.getElementById('mode');
const SUNI='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>';

function setMode(d){document.body.classList.toggle('dark',d);
  hemi.color.set(d?0x7f94d9:0xffffff);hemi.groundColor.set(d?0x2a3558:0xd8c49a);hemi.intensity=d?.42:.62;

  lampMat.color.set(d?0xfffbd0:0xe6dfb4);seaU.uN.value=d?1:0;btn.innerHTML=d?SUNI:MOONI;btn.setAttribute('aria-pressed',d);

// ---------- animation ----------
const ease=x=>x*x*(3-2*x);

  ball.rotation.set(t*3,0,t*5);bs.position.set(ball.position.x,.1,ball.position.z);bs.scale.setScalar(Math.max(.4,1-ball.position.y*.12));

    ac.hits.forEach(hi=>{const d=((t-hi+T/2+T)%T)-T/2,ww=Math.exp(-d*d/.32);if(ww>w){w=ww;hit=H[hi]}});
    const p=ac.p,x=ac.home[0]+(hit[0]-ac.home[0])*ease(w),z=ac.home[1]+(hit[2]-ac.home[1])*ease(w),jump=JMP[hit[3]]*Math.pow(Math.sin(Math.min(1,w)*PI/2),3);
    p.g.position.set(x,jump,z);p.g.rotation.y=ac.face+(1-w)*Math.sin(t*1.3+i)*.25;
    const sw=Math.sin(ms/110+i)*4*w*(1-w)*.9;p.legs[0].rotation.x=sw;p.legs[1].rotation.x=-sw;
    p.b.position.y=Math.abs(Math.sin(ms/260+i))*.03-(hit[3]=='dig'?w*.15:0);
    const ang=AM[hit[3]]*Math.pow(w,1.2),idle=Math.sin(ms/700+i*2)*.15-.35;
    p.arms[0].rotation.x=idle*(1-w)+ang;p.arms[1].rotation.x=-idle*(1-w)*.8+(hit[3]=='spike'?ang*.35:ang);
    p.arms[0].rotation.z=-.1*w;p.arms[1].rotation.z=.1*w;
    ac.blob.position.set(x,.1,z);ac.blob.scale.setScalar(1-jump*.25)});
  ref.g.rotation.y=Math.sin(ms/1500)*.5;
  spec.arms[1].rotation.x=-2.6+Math.sin(ms/220)*.35;spec.arms[0].rotation.x=-.2;crowd.forEach((q,i)=>{q.b.position.y=Math.abs(Math.sin(ms/700+i*2))*.03;q.arms[i%2].rotation.x=-.5+Math.sin(ms/900+i)*.3});
  sway.forEach(o=>{o.top.rotation.z=Math.sin(ms/1100+o.ph)*.05;o.top.rotation.x=Math.cos(ms/1300+o.ph)*.04});
  seaU.uT.value=tt;
  boat.position.y=-.15+Math.sin(tt*1.5)*.07;boat.rotation.z=Math.sin(tt*1.2)*.06;
  buoys.forEach((g,i)=>{g.position.y=-.15+Math.sin(tt*1.4+i*2)*.07;g.rotation.z=Math.sin(tt+i)*.12});
  renderer.setRenderTarget(rt);renderer.clear();renderer.render(scene,cam);
  renderer.setRenderTarget(null);renderer.clear();renderer.render(qs,qc);
  requestAnimationFrame(frame);
}
function resize(){
  const w=innerWidth,h=innerHeight,asp=w/h,px=Math.max(2,Math.round(Math.min(w,h)/260)),lw=Math.ceil(w/px),lh=Math.ceil(h/px);
  renderer.setSize(lw,lh,false);rt.setSize(lw,lh);
  let vh=21;if(vh*asp<27)vh=27/asp;
  cam.left=-vh*asp;cam.right=vh*asp;cam.top=vh;cam.bottom=-vh;
  cam.position.set(TGT.x+22,18,22);cam.lookAt(TGT);cam.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();
if(matchMedia('(prefers-reduced-motion: reduce)').matches)frame(0);else requestAnimationFrame(frame);
})();
</script>
