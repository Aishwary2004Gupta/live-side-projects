<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Worlds — Isometric Dioramas</title>
<style>
  :root{color-scheme:light;--ink:#344039;--paper:#fff;--green:#42634b;--line:#dce3db}
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden}
  body{background:var(--paper);font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;color:var(--ink)}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;position:fixed;inset:0}
  #mast{position:fixed;top:calc(22px + env(safe-area-inset-top,0px));left:clamp(16px,3vw,42px);z-index:2;pointer-events:none;text-shadow:0 1px 0 #fff}
  #eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#77857a;margin-bottom:7px}
  #title{font-size:clamp(16px,2vw,21px);font-weight:700;letter-spacing:.03em}
  #counter{display:inline-block;font-size:10px;color:#7b897e;margin-left:10px;font-weight:500;vertical-align:2px}
  #nav{position:fixed;z-index:3;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:6px;padding:6px;background:rgba(255,255,255,.9);border:1px solid var(--line);box-shadow:2px 3px 0 rgba(54,71,58,.08);border-radius:5px;backdrop-filter:blur(5px)}
  .scene-button{height:32px;min-width:42px;padding:0 9px;border:1px solid transparent;background:transparent;color:#77857a;font:inherit;font-size:10px;letter-spacing:.04em;cursor:pointer;border-radius:3px;transition:background .18s,color .18s,border-color .18s}
  .scene-button:hover{color:var(--ink);background:#f2f5f1}
  .scene-button[aria-current="true"]{background:#eaf0e9;color:#294b35;border-color:#d5e1d3;font-weight:700}
  .scene-button:focus-visible{outline:2px solid #769c7b;outline-offset:2px}
  #hint{position:fixed;right:clamp(16px,3vw,42px);bottom:calc(31px + env(safe-area-inset-bottom,0px));font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#97a197;z-index:2}
  @media(max-width:650px){#nav{bottom:calc(14px + env(safe-area-inset-bottom,0px));gap:2px;padding:4px}.scene-button{min-width:34px;padding:0 6px;font-size:9px}#hint{display:none}#mast{top:16px}}
  @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="mast" aria-live="polite"><div id="eyebrow">A collection of small places</div><div><span id="title">The Stone Serpent</span><span id="counter">01 / 05</span></div></div>
<nav id="nav" aria-label="Choose a diorama">
  <button class="scene-button" type="button" data-scene="0" aria-label="Scene 1: The Stone Serpent" aria-current="true">01</button>
  <button class="scene-button" type="button" data-scene="1" aria-label="Scene 2: Poolside" aria-current="false">02</button>
  <button class="scene-button" type="button" data-scene="2" aria-label="Scene 3: Sweet Stop" aria-current="false">03</button>
  <button class="scene-button" type="button" data-scene="3" aria-label="Scene 4: After School" aria-current="false">04</button>
  <button class="scene-button" type="button" data-scene="4" aria-label="Scene 5: Open Water" aria-current="false">05</button>
</nav>
<div id="hint">← → to explore</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';
const PI=Math.PI,scene=new THREE.Scene();

const sun=new THREE.DirectionalLight(0xfff1d8,1.05);sun.position.set(-15,24,19);sun.castShadow=true;sun.shadow.mapSize.set(1536,1536);
Object.assign(sun.shadow.camera,{left:-24,right:24,top:24,bottom:-24,near:1,far:65});sun.shadow.bias=-.0007;sun.shadow.radius=3;scene.add(sun);
const matCache=new Map();

function line(points,color,parent=root){const geo=new THREE.BufferGeometry().setFromPoints(points.map(p=>new THREE.Vector3(...p)));const obj=new THREE.Line(geo,new THREE.LineBasicMaterial({color}));parent.add(obj);return obj}
function roundedShape(w,d,r){const s=new THREE.Shape();s.moveTo(-w/2+r,-d/2);s.lineTo(w/2-r,-d/2);s.quadraticCurveTo(w/2,-d/2,w/2,-d/2+r);s.lineTo(w/2,d/2-r);s.quadraticCurveTo(w/2,d/2,w/2-r,d/2);s.lineTo(-w/2+r,d/2);s.quadraticCurveTo(-w/2,d/2,-w/2,d/2-r);s.lineTo(-w/2,-d/2+r);s.quadraticCurveTo(-w/2,-d/2,-w/2+r,-d/2);return s}
function slab(w,d,y,depth,color,parent=root,r=1){const m=new THREE.Mesh(new THREE.ExtrudeGeometry(roundedShape(w,d,r),{depth,bevelEnabled:false,curveSegments:3}),mat(color));m.rotation.x=-PI/2;m.position.set(0,y,0);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function rngFactory(seed){let a=seed>>>0;return()=>{a=(a*1664525+1013904223)>>>0;return a/4294967296}}
function grassTufts(parent,w,d,count=360,seed=31){const rand=rngFactory(seed),geo=new THREE.ConeGeometry(.065,.32,3);geo.translate(0,.16,0);const colors=[0x527b49,0x71944f,0x8ba45e,0x426b43,0x98aa60];const im=new THREE.InstancedMesh(geo,new THREE.MeshLambertMaterial({color:0xffffff,flatShading:true}),count);const o=new THREE.Object3D(),c=new THREE.Color();for(let i=0;i<count;i++){const edge=Math.floor(rand()*4),u=(rand()-.5)*.94;let x=0,z=0;if(edge===0){x=u*w;z=-d/2+(rand()-.5)*.8}else if(edge===1){x=u*w;z=d/2+(rand()-.5)*.8}else if(edge===2){x=-w/2+(rand()-.5)*.8;z=u*d}else{x=w/2+(rand()-.5)*.8;z=u*d}o.position.set(x,.03,z);o.rotation.set((rand()-.5)*.4,rand()*PI*2,(rand()-.5)*.4);o.scale.set(.7+rand()*.8,.55+rand()*1.2,.7+rand()*.8);o.updateMatrix();im.setMatrixAt(i,o.matrix);im.setColorAt(i,c.setHex(colors[i%colors.length]))}im.castShadow=true;parent.add(im)}
function makeBase(parent,{w=19,d=13,edge=0x6d5943,top=0x779255,grass=true}={}){slab(w,d,-.5,.48,edge,parent,1.1);slab(w-.08,d-.08,-.06,.12,top,parent,1.05);if(grass)grassTufts(parent,w-.3,d-.3,420,Math.round(w*13));}
function pavement(parent,w=17.8,d=11.8,color=0xc5b99c){box(w,.06,d,color,0,.04,0,parent);const rand=rngFactory(101);for(let x=-w/2+1;x<w/2;x+=1.75){box(.035,.01,d-.1,0xb7ae98,x,.08,0,parent)}for(let z=-d/2+1;z<d/2;z+=1.5){box(w-.1,.01,.035,0xb7ae98,0,.08,z,parent)}for(let i=0;i<35;i++){const x=(rand()-.5)*w*.9,z=(rand()-.5)*d*.85;const m=box(.12+rand()*.22,.014,.08+rand()*.13,i%2?0xd0c5a7:0xb6aa91,x,.09,z,parent);m.rotation.y=rand()*PI}}

function makeTree(parent,x,z,scale=1){const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(scale);parent.add(g);cylinder(.2,.32,2.4,0x79573b,0,1.2,0,g,7);const rand=rngFactory(765);const shades=[0x43834d,0x4f9555,0x6da55c,0x3f754a];for(let i=0;i<26;i++){const a=i*2.4,r=.45+rand()*1.15,y=2.6+rand()*2.1;const leaf=poly(.62+rand()*.3,shades[i%4],Math.cos(a)*r,y,Math.sin(a)*r,g,0);leaf.scale.set(1,.88+rand()*.3,.9)}return g}

const titles=['The Stone Serpent','Poolside','Sweet Stop','After School','Open Water'];

let animators=[],active=0,sceneClock=0,last=0;
function disposeRoot(group){const shared=new Set(matCache.values());group.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{if(!shared.has(m))m.dispose()})}})}

function buildStoneArena(g){makeBase(g,{edge:0x594537,top:0x5b754d,grass:true});floorTile(g,17.2,10.7,0x766a61,.04);const rand=rngFactory(17);const palette=[0x85796e,0x93867a,0x70655e,0x9c8c7d,0x756c65,0x887e75];
 for(let x=-7.7;x<=7.7;x+=1.65)for(let z=-4.65;z<=4.65;z+=1.3){const xx=x+(rand()-.5)*.22,zz=z+(rand()-.5)*.2;const tile=box(1.56,.045,1.21,palette[Math.floor(rand()*palette.length)],xx,.1,zz,g);tile.rotation.y=(rand()-.5)*.07;}
 // cracked seams, loose chips, and weathered boundary stones

 for(let i=0;i<21;i++){const x=(rand()-.5)*17,z=(rand()-.5)*10;const rock=poly(.14+rand()*.19,palette[i%palette.length],x,.15,z,g);rock.scale.set(1.3,.65,.9)}
 // the emerging, segmented stone serpent

 for(let i=0;i<15;i++){const t=i/14;const y=.48+2.6*Math.sin(t*PI);const x=-4.2+t*8.4;const z=.25+2.05*Math.sin(t*PI*1.5);const r=.45+(i%4===0?.23:0);const b=poly(r,rockColors[i%rockColors.length],x,y,z,g);b.scale.set(1.15,.83,1);b.rotation.set(rand()*.5,rand()*PI,rand()*.4);chain.push({b,x,y,z,t})}
 const head=new THREE.Group();head.position.set(-4.25,.85,.25);g.add(head);poly(.75,0x696970,0,0,0,head);const jaw=box(.95,.35,.72,0x51545b,.2,-.25,.13,head);jaw.rotation.z=-.08;poly(.24,0x65666d,-.4,.5,-.2,head);poly(.24,0x65666d,.22,.52,-.2,head);ballMesh(.1,0xf2b848,.3,.12,.39,head,6);ballMesh(.1,0xf2b848,.57,.12,.33,head,6);box(.08,.08,.04,0x292b2f,.32,.12,.48,head);box(.08,.08,.04,0x292b2f,.59,.12,.42,head);
 const adventurer=makePerson(g,-6.6,-3.6,0xc7493d,0x335a83,0xc98d67,0x382a22,.82);const mage=makePerson(g,1.2,-1.6,0xe2be42,0x514f70,0xd4a076,0x352a20,.78);const watcher=makePerson(g,6.8,3.2,0x4f7956,0x4e536c,0xc9906f,0x3b2923,.8);addShadow(g,-6.6,-3.6,.45,.28);addShadow(g,1.2,-1.6,.4,.25);addShadow(g,6.8,3.2,.4,.25);
 const bolt=new THREE.Group();g.add(bolt);const boltMat=basic(0xffe66d);const boltPts=[];for(let i=0;i<9;i++){const x=-.9+i*.24,y=0,z=0;boltPts.push(new THREE.Vector3(x,y,z))}const boltLine=new THREE.Line(new THREE.BufferGeometry(),boltMat);bolt.add(boltLine);
 const sparks=[];for(let i=0;i<24;i++){const s=new THREE.Mesh(new THREE.BoxGeometry(.07,.07,.07),basic(i%3?0xf6d96f:0xe8f1ff));g.add(sparks.push(s))}
 animators.push(t=>{chain.forEach(({b,x,y,z,t:u},i)=>{b.position.y=y+.13*Math.sin(t*1.4-u*5);b.position.x=x+.06*Math.sin(t+u*8);b.rotation.z=.05*Math.sin(t*1.1+u*6)});head.position.y=.86+.1*Math.sin(t*1.5);const attack=Math.exp(-Math.pow((t%12)-5.2,2)/1.1);bolt.visible=attack>.08;const pts=[];for(let i=0;i<10;i++){const u=i/9;pts.push(new THREE.Vector3(-.7+u*2.5,2.6-u*2.5+(Math.sin(i*11+t*18)*.2),Math.sin(i*4+t*6)*.16))}boltLine.geometry.dispose();boltLine.geometry=new THREE.BufferGeometry().setFromPoints(pts);bolt.position.set(-1.4,0,.15);bolt.scale.setScalar(.6+attack*.2);sparks.forEach((s,i)=>{const ph=t*2+i*1.7;s.visible=(Math.sin(ph)>0.7)&&attack>.05;s.position.set(1.4+Math.sin(ph)*1.2,.25+Math.abs(Math.cos(ph*1.7))*2.1,.3+Math.cos(ph*.7)*1.5)});adventurer.legs[0].rotation.x=Math.sin(t*3)*.15;adventurer.legs[1].rotation.x=-Math.sin(t*3)*.15;mage.arms[0].rotation.x=-.8-.6*attack;mage.arms[1].rotation.x=-.5-.8*attack;watcher.body.rotation.y=.08*Math.sin(t)})}

function makeRipple(parent,x,z,color=0xe5ffff,period=2.8,phase=0){const m=new THREE.Mesh(new THREE.TorusGeometry(1,.035,4,22),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.42,depthWrite:false}));m.rotation.x=PI/2;m.position.set(x,.19,z);parent.add(m);return t=>{const q=((t/period+phase)%1+1)%1;m.scale.setScalar(.15+q*.9);m.material.opacity=.34*(1-q)}}

function swimmer(parent,x,z,shirt,skin,hair){const g=new THREE.Group();g.position.set(x,.15,z);parent.add(g);const torso=box(.46,.26,.28,shirt,0,.1,0,g);torso.rotation.z=.12;const head=ballMesh(.2,skin,.29,.29,.02,g,7);ballMesh(.15,hair,.29,.43,-.015,g,7);const arms=[-1,1].map(s=>{const a=new THREE.Group();a.position.set(s*.14,.19,0);g.add(a);box(.12,.3,.12,skin,0,-.12,0,a);return a});return{g,arms,head}}
function buildPool(g){makeBase(g,{w:19,d:13,edge:0x79786f,top:0xbdb9ad,grass:false});pavement(g,18.4,12.35,0xbab6aa);for(let z=-5.4;z<=5.4;z+=.9)box(18,.012,.025,0xaaa69b,0,.102,z,g);

 for(let i=0;i<2;i++){const x=5.1+i*.78,z=3.9;box(.88,.18,1.45,i?0xe5ded0:0xe5a766,x,.2,z,g);const back=box(.88,.68,.12,0xf0ece2,x,.55,z-.6,g);back.rotation.x=-.14;box(.07,.5,.07,0x8f8a7f,x-.32,.36,z+.35,g);box(.07,.5,.07,0x8f8a7f,x+.32,.36,z+.35,g)}
 const swimmers=[swimmer(g,-3,-1.8,0xe86d4f,0xd7a17e,0x48342b),swimmer(g,-.7,2.7,0x3d7889,0xc68b63,0x302822),swimmer(g,3.2,-.7,0xe1bf4a,0xe0b18a,0x482f28)];
