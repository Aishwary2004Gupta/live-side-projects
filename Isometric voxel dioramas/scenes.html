<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beach Volleyball Diorama</title>
<style>
  :root{--bg:#ffffff}
  @media (prefers-color-scheme: dark){:root{--bg:#ffffff}}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const T=6, PI=Math.PI;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.setClearColor(0xffffff,1);
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const cam=new THREE.OrthographicCamera(-1,1,1,-1,-100,200);
cam.position.set(22,19,22); cam.lookAt(0,0.6,0);

// lights
scene.add(new THREE.HemisphereLight(0xffffff,0xe8d4a8,0.75));
const sun=new THREE.DirectionalLight(0xfff1d6,0.85);
sun.position.set(-12,22,10); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-20,right:20,top:20,bottom:-20,near:1,far:60});
sun.shadow.radius=4; sun.shadow.bias=-0.0006;
scene.add(sun);

const cache={};
const M=c=>cache[c]||(cache[c]=new THREE.MeshLambertMaterial({color:c}));
function add(m,x,y,z,p){m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;(p||scene).add(m);return m}
const box=(w,h,d,c,x,y,z,p)=>add(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c)),x,y,z,p);
const cyl=(r1,r2,h,c,x,y,z,p,s)=>add(new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,s||10),M(c)),x,y,z,p);
const sph=(r,c,x,y,z,p)=>add(new THREE.Mesh(new THREE.SphereGeometry(r,14,10),M(c)),x,y,z,p);
function blob(r,x,z,o,p){ // fake ambient occlusion
  const m=new THREE.Mesh(new THREE.CircleGeometry(r,20),new THREE.MeshBasicMaterial({color:0x6b4a1e,transparent:true,opacity:o||.28,depthWrite:false}));
  m.rotation.x=-PI/2;m.position.set(x,.075,z);(p||scene).add(m);return m}

// ---------- platform ----------
const PX=13,PZ=9;
box(PX*2+.4,.5,PZ*2+.4,0xc99a5b,0,-1.35,0);
box(PX*2,1.1,PZ*2,0xdcb97c,0,-.55,0);
box(PX*2+.3,.12,PZ*2+.3,0xb9824a,0,-.06,0);
for(let i=0;i<12;i++){
  const d=PZ*2/12;
  box(PX*2,.06,d,i%2?0xf2dca3:0xeccf92,0,.03,-PZ+d*(i+.5)).castShadow=false;
}
box(16,.05,8,0xf8e9bd,0,.085,0).castShadow=false;
[[16.2,.14,0,-4],[16.2,.14,0,4]].forEach(a=>box(a[0],.04,a[1],0xffffff,a[2],.12,a[3]).castShadow=false);
[-8,0,8].forEach(x=>box(.14,.04,8.2,x?0xffffff:0xfff7e0,x,.12,0).castShadow=false);
// sand footprints & small details
for(let i=0;i<14;i++){const s=sph(.12+Math.random()*.1,0xe0c07f,(Math.random()-.5)*24,.0,(Math.random()-.5)*16);s.scale.y=.25;s.castShadow=false}

// ---------- chain-link ----------
const cv=document.createElement('canvas');cv.width=cv.height=64;
const g=cv.getContext('2d');g.strokeStyle='#8fa0ad';g.lineWidth=3;
g.beginPath();g.moveTo(0,0);g.lineTo(64,64);g.moveTo(64,0);g.lineTo(0,64);g.stroke();
const tex=new THREE.CanvasTexture(cv);tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
function link(len,x,z,ry){
  const t=tex.clone();t.needsUpdate=true;t.repeat.set(len/.45,1.5/.45);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(len,1.5),new THREE.MeshBasicMaterial({map:t,transparent:true,alphaTest:.2,side:THREE.DoubleSide}));
  m.position.set(x,.8,z);m.rotation.y=ry;scene.add(m);
}
link(PX*2,0,-PZ,0); link(PZ*2,-PX,0,PI/2);
box(PX*2,.1,.1,0x5b6b78,0,1.55,-PZ); box(.1,.1,PZ*2,0x5b6b78,-PX,1.55,0);
for(let x=-PX;x<=PX;x+=PX/4) box(.14,1.6,.14,0x5b6b78,x,.8,-PZ);
for(let z=-PZ;z<=PZ;z+=PZ/3) box(.14,1.6,.14,0x5b6b78,-PX,.8,z);
// front rope fence
for(let x=-PX;x<=PX;x+=PX/4) cyl(.08,.08,.7,0xb4763a,x,.35,PZ,null,6);
for(let z=-PZ;z<=PZ;z+=PZ/3) cyl(.08,.08,.7,0xb4763a,PX,.35,z,null,6);
box(PX*2,.06,.06,0xf3ece0,0,.62,PZ); box(.06,.06,PZ*2,0xf3ece0,PX,.62,0);

// ---------- net ----------
const nc=document.createElement('canvas');nc.width=nc.height=32;
const ng=nc.getContext('2d');ng.strokeStyle='#222';ng.lineWidth=2;ng.strokeRect(0,0,32,32);
const nt=new THREE.CanvasTexture(nc);nt.wrapS=nt.wrapT=THREE.RepeatWrapping;nt.repeat.set(24,3);
const net=new THREE.Mesh(new THREE.PlaneGeometry(9.2,.95),new THREE.MeshBasicMaterial({map:nt,transparent:true,side:THREE.DoubleSide,alphaTest:.1}));
net.position.set(0,2.0,0);net.rotation.y=PI/2;scene.add(net);
box(.1,.12,9.2,0xffffff,0,2.5,0); box(.08,.08,9.2,0xffffff,0,1.5,0);
[-4.6,4.6].forEach(z=>{cyl(.1,.1,2.7,0x3a6ea5,0,1.35,z);box(.5,.35,.5,0xff6b4a,0,.9,z)});

// ---------- people ----------
function person(shirt,shorts,hair,skin,sc){
  const p=new THREE.Group(),b=new THREE.Group();p.add(b);
  const legs=[-1,1].map(s=>{const l=new THREE.Group();l.position.set(0,.5,s*.13);box(.2,.5,.2,skin,0,-.25,0,l);box(.22,.12,.24,shorts,0,-.02,0,l);b.add(l);return l});
  box(.34,.56,.5,shirt,0,.8,0,b);box(.36,.3,.52,shorts,0,.58,0,b);
  sph(.23,skin,0,1.3,0,b);
  const h=sph(.245,hair,-.02,1.35,0,b);h.scale.set(1,.7,1);
  box(.12,.04,.5,0xffffff,.2,1.42,0,b); // visor
  const arms=[-1,1].map(s=>{const a=new THREE.Group();a.position.set(0,1.03,s*.3);box(.14,.5,.14,skin,0,-.25,0,a);b.add(a);return a});
  p.scale.setScalar(sc||1.35);
  return {g:p,b,legs,arms};
}
const TA=[0xff7a3d,0xffc933,0xe04a7a], TB=[0x2ec4b6,0x3a86ff,0x7bd88f];
const skins=[0xf1c9a0,0xc68a5b,0x8d5a3a,0xe3b087];
const H=[ // [x,y,z,type]
 [-5,1.1,-2,'dig'],[-2.8,2.3,1.5,'set'],[-1.3,3.5,-.5,'spike'],
 [4,1.0,1,'dig'],[2.6,2.3,-1.5,'set'],[1.3,3.5,.5,'spike']];
const arcs=[1.5,1.2,.8,1.5,1.2,.8];
const actors=[
 {p:person(TA[0],0x1f3b73,0x3b2314,skins[0]),home:[-5,-2],face:PI/2,hits:[0,2]},
 {p:person(TA[1],0xd14a4a,0xe6b45a,skins[1]),home:[-3,1.5],face:PI/2,hits:[1]},
 {p:person(TB[0],0xffffff,0x161616,skins[2]),home:[4.5,1],face:-PI/2,hits:[3,5]},
 {p:person(TB[1],0xffd23f,0x7a3b1d,skins[3]),home:[3,-1.5],face:-PI/2,hits:[4]},
];
actors.forEach(a=>{scene.add(a.p.g);a.p.g.traverse(o=>{if(o.isMesh){o.castShadow=true}});
  a.blob=blob(.55,0,0,.3);});
const AM={dig:-1.25,set:-2.9,spike:-3.1}, JMP={dig:0,set:.3,spike:.85};

// referee on stand
box(.25,3.2,.25,0xa66a35,-.5,1.6,-5.4);box(.25,3.2,.25,0xa66a35,.5,1.6,-5.4);
box(1.6,.15,1.2,0xc98c4c,0,3.2,-5.4);box(1.6,.7,.12,0xc98c4c,0,3.6,-5.8);
for(let i=0;i<5;i++)box(1,.08,.14,0xc98c4c,0,.4+i*.55,-5.3+.0).rotation.x=0;
const ref=person(0xffffff,0x222222,0x222222,skins[0],1.1);ref.g.position.set(0,3.28,-5.4);ref.g.rotation.y=PI/2+.5;scene.add(ref.g);
blob(1,0,-5.4,.2);
// spectator
const spec=person(0xff5fa2,0x3a86ff,0x7a3b1d,skins[1],1.2);spec.g.position.set(8.2,0,-6);spec.g.rotation.y=-PI*.65;scene.add(spec.g);

// ---------- ball ----------
const ball=new THREE.Group();scene.add(ball);
sph(.3,0xffffff,0,0,0,ball);
const band=new THREE.Mesh(new THREE.TorusGeometry(.3,.05,6,18),M(0x3a86ff));ball.add(band);
const band2=band.clone();band2.rotation.y=PI/2;ball.add(band2);
const bs=blob(.3,0,0,.3);

// ---------- pavilion (tiki beach bar) ----------
const px=-8.5,pz=-6;
box(5.6,.3,3.4,0xb27a42,px,.15,pz);
[[-2.5,-1.4],[2.5,-1.4],[-2.5,1.4],[2.5,1.4]].forEach(o=>cyl(.14,.14,2.8,0x8a5528,px+o[0],1.7,pz+o[1],null,8));
box(5.2,1,.35,0xc98c4c,px,.8,pz+1.2); // counter
box(5.2,.1,.6,0x7a4a20,px,1.35,pz+1.2);
box(5.4,.14,3.2,0x8a5528,px,3.05,pz);
const roof=new THREE.Mesh(new THREE.ConeGeometry(4.3,1.9,4),M(0xd9b45f));roof.rotation.y=PI/4;roof.scale.z=.68;add(roof,px,4.1,pz);
const roof2=new THREE.Mesh(new THREE.ConeGeometry(4.5,.5,4),M(0xb88a3a));roof2.rotation.y=PI/4;roof2.scale.z=.7;add(roof2,px,3.3,pz);
cyl(.05,.05,1.2,0x6b3f1c,px,5.4,pz,null,6);
box(.7,.4,.05,0xff4d6d,px+.4,5.7,pz);
[0xff6b4a,0x2ec4b6,0xffc933].forEach((c,i)=>box(.3,.4,.06,c,px-1.6+i*.6,1.6,pz+1.4)); // bunting
// surfboards
[[-0.8,0xff6b4a],[0,0x2ec4b6],[.8,0xffc933]].forEach(o=>{const s=sph(.4,o[1],px+3.3+o[0]*.0,1.1,pz-1.2+o[0]*.5);s.scale.set(.2,1.6,.5);s.rotation.z=.12});
box(.5,.45,.5,0x3a86ff,px-1,.55,pz+2.1);box(.5,.45,.5,0xff6b4a,px+.2,.55,pz+2.1); // stools

// ---------- palms ----------
const sway=[];
function palm(x,z,s,lean){
  const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(s);scene.add(g);
  let px=0,py=0;
  for(let i=0;i<6;i++){const sg=cyl(.28-i*.03,.31-i*.03,1.1,i%2?0x9a6a3a:0xb07d45,px,py+.55,0,g,8);sg.rotation.z=-lean*.0;px+=lean*.12;py+=1;sg.position.x=px;sg.position.y=py-.45;}
  const top=new THREE.Group();top.position.set(px,py+.1,0);g.add(top);
  sph(.3,0x6b4423,0,0,0,top);
  for(let k=0;k<7;k++){const pv=new THREE.Group();pv.rotation.y=k*PI*2/7;top.add(pv);
    const l=add(new THREE.Mesh(new THREE.ConeGeometry(.45,2.6,4),M(k%2?0x3fae5a:0x56c46d)),1.1,-.1,0,pv);l.scale.z=.3;l.rotation.z=-PI/2-.5;}
  sph(.16,0x7a4a20,.2,-.3,.1,top);sph(.16,0x7a4a20,-.15,-.3,-.1,top);
  blob(1.2*s,x+.2,z,.22);sway.push({top,ph:x});
}
palm(10,-6.6,1.1,.6);palm(-11.5,5.5,1,-.5);palm(11,6,.9,.5);palm(-3.5,-7,.8,.4);

// ---------- umbrellas & props ----------
function umbrella(x,z,c1,c2){
  cyl(.05,.05,2.6,0xeeeeee,x,1.3,z,null,6);
  const u=new THREE.Mesh(new THREE.ConeGeometry(1.6,.9,8),M(c1));add(u,x,2.7,z);
  for(let i=0;i<8;i+=2){const w=new THREE.Mesh(new THREE.ConeGeometry(1.61,.91,8,1,false,i*PI/4,PI/4),M(c2));add(w,x,2.7,z)}
  box(1.5,.06,.7,c1,x+.5,.1,z+1.2).rotation.y=.4; box(1.3,.06,.6,c2,x-.7,.1,z+1.5).rotation.y=-.3;
  blob(1.4,x,z+.3,.15);
}
umbrella(7,-6.4,0xff6b4a,0xffffff);umbrella(10.5,-3.5,0x2ec4b6,0xffffff);
box(1,.6,.7,0x3a86ff,-4,.3,7.4);box(1,.12,.76,0xffffff,-4,.65,7.4); // cooler
for(let i=0;i<3;i++)sph(.26,[0xffffff,0xffc933,0xff6b4a][i],-6+i*.55,.28,7.2);

// ---------- floodlights ----------
const lampMat=new THREE.MeshBasicMaterial({color:0xfff3b0});
[[-12,-8],[12,-8],[-12,8]].forEach(([x,z])=>{
  cyl(.14,.2,8,0x6c7a86,x,4,z,null,8);
  const head=new THREE.Group();head.position.set(x,8.2,z);head.lookAt(0,0,0);scene.add(head);
  box(2,1.1,.25,0x444f58,0,0,0,head);
  const m=new THREE.Mesh(new THREE.BoxGeometry(1.8,.9,.05),lampMat);m.position.z=.15;head.add(m);
  blob(.7,x,z,.25);
});

// ---------- animation ----------
function ease(x){return x*x*(3-2*x)}
function frame(ms){
  const t=(ms/1000)%T, k=Math.floor(t), s=t-k, e=ease(s)*.0+s;
  const a=H[k],b=H[(k+1)%6];
  ball.position.set(a[0]+(b[0]-a[0])*s, a[1]+(b[1]-a[1])*s+4*arcs[k]*s*(1-s), a[2]+(b[2]-a[2])*s);
  ball.rotation.z=t*5;ball.rotation.x=t*3;
  bs.position.set(ball.position.x,.09,ball.position.z);bs.scale.setScalar(Math.max(.4,1-ball.position.y*.12));
  actors.forEach((ac,i)=>{
    let w=0,hit=null;
    ac.hits.forEach(hi=>{let d=((t-hi+T/2+T)%T)-T/2;const ww=Math.exp(-d*d/.32);if(ww>w){w=ww;hit=H[hi];}});
    const p=ac.p,g=p.g;
    const x=ac.home[0]+(hit[0]-ac.home[0])*ease(w), z=ac.home[1]+(hit[2]-ac.home[1])*ease(w);
    const jump=JMP[hit[3]]*Math.sin(Math.min(1,w)*PI/2)**3;
    g.position.set(x,jump,z);
    g.rotation.y=ac.face+ (1-w)*Math.sin(t*1.3+i)*.25;
    const run=4*w*(1-w), sw=Math.sin(ms/110+i)*run*.9;
    p.legs[0].rotation.z=sw;p.legs[1].rotation.z=-sw;
    const crouch=hit[3]=='dig'?w*.15:0;
    p.b.position.y=Math.abs(Math.sin(ms/260+i))*.03-crouch;
    const ang=AM[hit[3]]*Math.pow(w,1.2), idle=Math.sin(ms/700+i*2)*.15+ -.35;
    p.arms[0].rotation.z=0;p.arms[1].rotation.z=0;
    p.arms[0].rotation.x=idle*(1-w)+ang; p.arms[1].rotation.x=-idle*(1-w)*.8+(hit[3]=='spike'?ang*.35:ang);
    p.arms[0].rotation.z=-.1*w;p.arms[1].rotation.z=.1*w;
    ac.blob.position.set(x,.075,z);ac.blob.scale.setScalar(1-jump*.25);
  });
  // referee head-turn & spectator wave
  ref.g.rotation.y=PI/2+Math.sin(ms/1500)*.5;
  spec.arms[1].rotation.x=-2.6+Math.sin(ms/220)*.35;spec.arms[0].rotation.x=-.2;
  sway.forEach(o=>{o.top.rotation.z=Math.sin(ms/1100+o.ph)*.05;o.top.rotation.x=Math.cos(ms/1300+o.ph)*.04});
  nt.offset.x=Math.sin(ms/900)*.01;
  renderer.render(scene,cam);
  requestAnimationFrame(frame);
}
function resize(){
  const w=innerWidth,h=innerHeight,asp=w/h;
  renderer.setSize(w,h,false);
  let vh=17; if(vh*asp<24) vh=24/asp;
  cam.left=-vh*asp;cam.right=vh*asp;cam.top=vh;cam.bottom=-vh;
  cam.position.set(22,19,22);cam.lookAt(0,1,0);cam.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();
if(matchMedia('(prefers-reduced-motion: reduce)').matches){frame(0)}else requestAnimationFrame(frame);
})();
</script>
</body>
</html>
