// ---------- animation ----------

  ball.rotation.set(t*3,0,t*5);bs.position.set(ball.position.x,.1,ball.position.z);bs.scale.setScalar(Math.max(.4,1-ball.position.y*.12));

    ac.hits.forEach(hi=>{const d=((t-hi+T/2+T)%T)-T/2,ww=Math.exp(-d*d/.32);if(ww>w){w=ww;hit=H[hi]}});
    const p=ac.p,x=ac.home[0]+(hit[0]-ac.home[0])*ease(w),z=ac.home[1]+(hit[2]-ac.home[1])*ease(w),jump=JMP[hit[3]]*Math.pow(Math.sin(Math.min(1,w)*PI/2),3);
    p.g.position.set(x,jump,z);p.g.rotation.y=ac.face+(1-w)*Math.sin(t*1.3+i)*.25;
    const sw=Math.sin(ms/110+i)*4*w*(1-w)*.9;p.legs[0].rotation.z=sw;p.legs[1].rotation.z=-sw;
    p.b.position.y=Math.abs(Math.sin(ms/260+i))*.03-(hit[3]=='dig'?w*.15:0);
    const ang=AM[hit[3]]*Math.pow(w,1.2),idle=Math.sin(ms/700+i*2)*.15-.35;
    p.arms[0].rotation.x=idle*(1-w)+ang;p.arms[1].rotation.x=-idle*(1-w)*.8+(hit[3]=='spike'?ang*.35:ang);
    p.arms[0].rotation.z=-.1*w;p.arms[1].rotation.z=.1*w;
    ac.blob.position.set(x,.1,z);ac.blob.scale.setScalar(1-jump*.25)});
  ref.g.rotation.y=PI/2+Math.sin(ms/1500)*.5;
  spec.arms[1].rotation.x=-2.6+Math.sin(ms/220)*.35;spec.arms[0].rotation.x=-.2;
  sway.forEach(o=>{o.top.rotation.z=Math.sin(ms/1100+o.ph)*.05;o.top.rotation.x=Math.cos(ms/1300+o.ph)*.04});
  seaU.uT.value=tt;
  boat.position.y=-.2+Math.sin(tt*1.5)*.07;boat.rotation.z=Math.sin(tt*1.2)*.06;
  buoys.forEach((g,i)=>{g.position.y=-.2+Math.sin(tt*1.4+i*2)*.07;g.rotation.z=Math.sin(tt+i)*.12});
  renderer.render(scene,cam);
  requestAnimationFrame(frame);
}
function resize(){
  const w=innerWidth,h=innerHeight,asp=w/h;renderer.setSize(w,h,false);
  let vh=15.5;if(vh*asp<21)vh=21/asp;
  cam.left=-vh*asp;cam.right=vh*asp;cam.top=vh;cam.bottom=-vh;
  cam.position.set(TGT.x+22,18,22);cam.lookAt(TGT);cam.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();
if(matchMedia('(prefers-reduced-motion: reduce)').matches)frame(0);else requestAnimationFrame(frame);
})();
</script>
