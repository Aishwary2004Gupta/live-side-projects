<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>Isometric voxel dioramas</title>
<style>
:root{--bg:#fdfdfd;--fg:#222;--btn:#e8edf0;--on:#2f5d6b;--onfg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181b;--fg:#e6e8ea;--btn:#262b30;--on:#6fa7b5;--onfg:#0c1316}}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%}

#hud .nm{font-size:clamp(9px,1.7vw,18px);letter-spacing:.14em;text-shadow:0 2px 0 #000;margin-bottom:2px}
#hud .bar{position:relative;height:clamp(9px,2vw,22px);background:#1a1420;border:2px solid #f4f1ea;transform:skewX(-14deg);overflow:hidden;box-shadow:0 2px 0 #000}
#hud .hb.r .bar{transform:skewX(14deg)}#hud .bar i{position:absolute;top:0;bottom:0}
#hud .gh{background:#d4201a}#hud .fl{background:linear-gradient(#fff3a0,#ffc425 45%,#ff8a1e)}
#hud .hb.l .bar i{right:0}#hud .hb.r .bar i{left:0}

#cmbL{left:4%}#cmbR{right:4%}#cmbL small,#cmbR small{font-size:.5em}

#flash{position:absolute;inset:0;background:#fff;opacity:0}

.bb::after{content:'';position:absolute;left:50%;bottom:-17px;margin-left:-10px;border:10px solid transparent;border-top:15px solid #111;border-bottom:0}
.bb::before{content:'';position:absolute;left:50%;bottom:-11px;margin-left:-7px;border:7px solid transparent;border-top:12px solid #fff;border-bottom:0;z-index:1}
.bb.shout{background-color:transparent;background-size:100% 100%;border:0;border-radius:0;box-shadow:none;padding:.9em 1.5em;color:#e8261b;font-size:clamp(15px,3vw,30px);text-shadow:2px 2px 0 #111,-1px -1px 0 #111,1px -1px 0 #111,-1px 1px 0 #111;white-space:nowrap;max-width:none}

.bb.out{animation:out .3s forwards}

.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{font:inherit;color:var(--fg);background:var(--btn);border:0;border-radius:8px;padding:8px 16px;cursor:pointer}
button.on{background:var(--on);color:var(--onfg)}
</style></head><body>
