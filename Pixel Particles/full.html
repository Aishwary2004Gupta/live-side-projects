<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Particles — Interactive Editor</title>

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0b0f;
        font-family: system-ui, sans-serif;
      }

      .app {
        display: flex;
        width: 100%;
        height: 100%;
      }

      #container {
        position: relative;
        flex: 1;
        min-width: 0;
        min-height: 0;
        height: 100%;
        overflow: hidden;
      }

      #container canvas {
        display: block;
        touch-action: none;
      }

      .sidebar {
        flex: 0 0 330px;
        width: 330px;
        height: 100%;
        padding: 14px;
        overflow-y: auto;
        background: #15151c;
        border-left: 1px solid #2a2a35;
        scrollbar-width: thin;
        scrollbar-color: #454553 #15151c;
      }

      #preview {
        display: block;
        width: 100%;
        max-height: 180px;
        margin-bottom: 10px;
        object-fit: contain;
        border: 1px solid #30303b;
        border-radius: 8px;
        background: #09090d;
      }

      #preview:not([src]) {
        display: none;
      }

      #status {
        margin: 0 0 12px;
        color: #a6a6b6;
        font-size: 12px;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }

      #drop-hint {
        position: absolute;
        z-index: 2;
        bottom: 14px;
        left: 14px;
        max-width: calc(100% - 28px);
        padding: 9px 12px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        background: rgba(11, 11, 15, 0.75);
        color: #b0b0bd;
        font-size: 12px;
        line-height: 1.5;
        pointer-events: none;
      }

      #dropzone {
        position: absolute;
        z-index: 5;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        border: 2px dashed #86a9ff;
        background: rgba(60, 100, 220, 0.25);
        color: #fff;
        font-size: 22px;
        pointer-events: none;
      }

      #dropzone.drag {
        display: flex;
      }

      #fileInput {
        display: none;
      }

      .tp-dfwv {
        position: relative !important;
        top: auto !important;
        right: auto !important;
        width: 100% !important;
      }

      .panel-note {
        margin: 12px 2px 0;
        color: #90909f;
        font-size: 11px;
        line-height: 1.6;
      }

      @media (max-width: 760px) {
        .app {
          flex-direction: column;
        }

        #container {
          flex: 0 0 56%;
          width: 100%;
          height: 56%;
        }

        .sidebar {
          flex: 1;
          width: 100%;
          height: auto;
          min-height: 0;
          border-top: 1px solid #2a2a35;
          border-left: 0;
        }

        #preview {
          max-height: 130px;
        }
      }
    </style>
  </head>

  <body>
    <div class="app">
      <main id="container">
        <div id="dropzone">Drop an image to load it</div>

        <div id="drop-hint">
          Drop or paste an image · Drag to orbit · Scroll to zoom · Right-drag
          to pan
        </div>
      </main>

      <aside class="sidebar">
        <img id="preview" alt="Current image preview" />

        <p id="status" role="status" aria-live="polite">
          Loading the butterfly image…
        </p>

        <div id="pane"></div>

        <p class="panel-note">
          Automatic spinning starts disabled.<br />
          Negative spin speeds reverse the direction.<br />
          Play Animation and Overall Speed also affect spinning.
        </p>
      </aside>
    </div>

    <input
      type="file"
      id="fileInput"
      accept="image/*"
      aria-label="Upload an image"
    />

    <script type="x-shader/x-vertex" id="vertexShader">
      uniform float amplitude;
      uniform float time;
      uniform float pointSize;
      uniform float attenuate;
      uniform float rippleAmp;
      uniform float rippleFreq;
      uniform float rippleSpeed;
      uniform float swirl;
      uniform float jitter;
      attribute float depth;
      attribute vec3 vertexColor;
      varying vec3 vColor;

      void main() {
        vColor = vertexColor;
        vec3 pos = position;
        pos.z = depth * amplitude;
        float distanceFromCenter = length(pos.xy);
        pos.z += rippleAmp * sin(distanceFromCenter * rippleFreq - time * rippleSpeed);
        float angle = swirl * depth * sin(time * 0.5);
        float c = cos(angle); float s = sin(angle);
        pos.xy = mat2(c, -s, s, c) * pos.xy;
        pos.x += jitter * sin(time * 1.7 + pos.y * 0.05);
        pos.y += jitter * cos(time * 1.3 + pos.x * 0.05);
        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
        float distanceScale = 400.0 / max(1.0, -mvPosition.z);
        gl_PointSize = pointSize * mix(1.0, distanceScale, attenuate);
        gl_Position = projectionMatrix * mvPosition;
      }
    </script>

    <script type="x-shader/x-fragment" id="fragmentShader">
      uniform float opacity;
      uniform float roundPoints;
      varying vec3 vColor;
      void main() {
        float alpha = opacity;
        if (roundPoints > 0.5) {
          float radius = length(gl_PointCoord - vec2(0.5));
          alpha *= 1.0 - smoothstep(0.42, 0.5, radius);
          if (alpha < 0.01) discard;
        }
        gl_FragColor = vec4(vColor, alpha);
      }
    </script>

    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/TrackballControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tweakpane@3.1.9/dist/tweakpane.min.js"></script>

    <script>
      const params = {
        resolution: 300, threshold: 0, skipTransparent: true, invertDepth: false,
        colorMode: "image", tint: "#ffffff", background: "#0b0b0f",
        amplitude: 120, pointSize: 1.5, attenuate: true, roundPoints: false, opacity: 1,
        play: true, timeScale: 1, pulse: true, pulseSpeed: 1, pulseMin: -1,
        rippleAmp: 0, rippleFreq: 0.08, rippleSpeed: 3, swirl: 0, jitter: 0, wobble: 0,
        spinEnabled: false, spinSpeed: 0.15, spinAxis: "y",
        rotationX: 0, rotationY: 0, rotationZ: 0,
      };

      const statsInfo = { points: 0 };
      const spinRotation = new THREE.Vector3(0, 0, 0);
      const TAU = Math.PI * 2;
      const container = document.getElementById("container");
      
      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
      renderer.setClearColor(params.background, 1);
      container.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, 1, 1, 10000);
      camera.position.set(0, 0, 600);
      const controls = new THREE.TrackballControls(camera, renderer.domElement);
      controls.rotateSpeed = 2; controls.zoomSpeed = 1.2; controls.dynamicDampingFactor = 0.15;

      const uniforms = {
        amplitude: { value: params.amplitude }, time: { value: 0 }, pointSize: { value: params.pointSize },
        attenuate: { value: 1 }, rippleAmp: { value: 0 }, rippleFreq: { value: 0.08 },
        rippleSpeed: { value: 3 }, swirl: { value: 0 }, jitter: { value: 0 },
        opacity: { value: 1 }, roundPoints: { value: 0 },
      };

      const material = new THREE.ShaderMaterial({
        uniforms,
        vertexShader: document.getElementById("vertexShader").textContent,
        fragmentShader: document.getElementById("fragmentShader").textContent,
        transparent: true, depthWrite: false,
      });

      let points = null, currentImage = null, rebuildTimer = null, imageRequestId = 0;

      function buildFromImage(img) {
        const w = Math.min(img.naturalWidth, params.resolution);
        const h = Math.round(img.naturalHeight * (w / img.naturalWidth));
        const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
        const ctx = cv.getContext("2d"); ctx.drawImage(img, 0, 0, w, h);
        const data = ctx.getImageData(0, 0, w, h).data;
        const pos = [], col = [], dep = [];
        const unit = 400 / Math.max(w, h);
        const tint = new THREE.Color(params.tint);
        const tmp = new THREE.Color();

        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const i = (y * w + x) * 4;
            if (params.skipTransparent && data[i+3] < 25) continue;
            const bright = (0.299*data[i]/255 + 0.587*data[i+1]/255 + 0.114*data[i+2]/255);
            if (bright < params.threshold) continue;
            pos.push((x - w/2)*unit, (h/2 - y)*unit, 0);
            dep.push(params.invertDepth ? -(bright - 0.5) : (bright - 0.5));
            if (params.colorMode === 'image') col.push(data[i]/255, data[i+1]/255, data[i+2]/255);
            else if (params.colorMode === 'tint') col.push(tint.r*bright, tint.g*bright, tint.b*bright);
            else if (params.colorMode === 'grayscale') col.push(bright, bright, bright);
            else { tmp.setHSL(params.colorMode === 'heat' ? (1-bright)*0.7 : x/w, 0.9, 0.5); col.push(tmp.r, tmp.g, tmp.b); }
          }
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(pos), 3));
        geo.setAttribute("vertexColor", new THREE.BufferAttribute(new Float32Array(col), 3));
        geo.setAttribute("depth", new THREE.BufferAttribute(new Float32Array(dep), 1));
        if (points) { scene.remove(points); points.geometry.dispose(); }
        points = new THREE.Points(geo, material);
        points.frustumCulled = false;
        scene.add(points);
        currentImage = img;
        document.getElementById("preview").src = img.src;
        statsInfo.points = pos.length / 3;
        document.getElementById("status").textContent = `Loaded: ${img.naturalWidth}x${img.naturalHeight}`;
        pane.refresh();
      }

      function loadImageFromURL(url) {
        const img = new Image(); img.crossOrigin = "anonymous";
        img.onload = () => buildFromImage(img);
        img.src = url;
      }

      const pane = new Tweakpane.Pane({ container: document.getElementById("pane"), title: "Pixel Particles" });
      pane.addButton({ title: "Upload Image" }).on("click", () => document.getElementById("fileInput").click());
      pane.addInput(params, "amplitude", { min: 0, max: 500 });
      
      const rot = pane.addFolder({ title: "Rotation & Spinning" });
      rot.addInput(params, "spinEnabled", { label: "Enable Spinning" });
      rot.addInput(params, "spinSpeed", { min: -2, max: 2 });
      rot.addInput(params, "rotationX", { min: -180, max: 180 });
      rot.addInput(params, "rotationY", { min: -180, max: 180 });
      rot.addInput(params, "rotationZ", { min: -180, max: 180 });
      rot.addButton({ title: "Reset Camera & Rotation" }).on("click", () => {
        params.spinEnabled = false; params.rotationX = params.rotationY = params.rotationZ = params.wobble = 0;
        spinRotation.set(0,0,0); points.rotation.set(0,0,0); controls.reset(); camera.position.set(0,0,600); pane.refresh();
      });

      document.getElementById("fileInput").onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => { const img = new Image(); img.onload = () => buildFromImage(img); img.src = ev.target.result; };
        reader.readAsDataURL(e.target.files[0]);
      };

      function animate(now) {
        requestAnimationFrame(animate);
        uniforms.time.value = now * 0.001;
        if(points) {
            if(params.spinEnabled) spinRotation[params.spinAxis] += params.spinSpeed * 0.02;
            points.rotation.set(THREE.MathUtils.degToRad(params.rotationX)+spinRotation.x+Math.sin(now*0.001)*params.wobble*0.5,
                                THREE.MathUtils.degToRad(params.rotationY)+spinRotation.y,
                                THREE.MathUtils.degToRad(params.rotationZ)+spinRotation.z);
        }
        controls.update(); renderer.render(scene, camera);
      }

      // Initialize with default image
      loadImageFromURL('https://plus.unsplash.com/premium_photo-1724372238882-7b0170a37ada');
      requestAnimationFrame(animate);
    </script>
  </body>
</html>
