<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Particles</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="container"></div>

    <section class="control-panel" aria-label="Particle animation controls">
      <div class="control-panel__header">
        <span class="control-panel__eyebrow">Particle motion</span>
        <button id="playToggle" class="play-toggle" type="button" aria-pressed="false">
          <span id="playToggleIcon" aria-hidden="true">&#9654;</span>
          <span id="playToggleLabel">Play</span>
        </button>
      </div>
      <label class="progress-control" for="motionProgress">
        <span class="progress-control__label">Movement</span>
        <span id="motionValue" class="progress-control__value">0%</span>
        <input id="motionProgress" type="range" min="0" max="100" value="0" step="0.1" />
      </label>
    </section>

    <script type="x-shader/x-vertex" id="vertexShader">
      precision mediump float;
      uniform float amplitude;
      attribute vec3 vertexColor;
      varying vec4 varColor;

      void main() {
        varColor = vec4(vertexColor, 1.0);
        vec4 pos = vec4(position, 1.0);
        pos.z *= amplitude; 
        vec4 mvPosition = modelViewMatrix * pos;
        gl_PointSize = 1.0;
        gl_Position = projectionMatrix * mvPosition;
      }
    </script>

    <script type="x-shader/x-fragment" id="fragmentShader">
      precision mediump float;
      varying vec4 varColor;

      void main() {
        gl_FragColor = varColor;
      }
    </script>

    <!-- Three.js r62 and TrackballControls must load BEFORE your app.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r62/three.min.js"></script>
    <script src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/175711/trackball_ctrl_r62.js"></script>
    <script src="app.js"></script>
  </body>
</html>
