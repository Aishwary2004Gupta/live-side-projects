<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Record player</title>
    <style>
      :root {
        --bg: #121314;
        --panel: rgba(22, 23, 24, 0.85);
        --line: #26292b;
        --ink: #c9d0db;
        --dim: #7d8796;
        --accent: #ff9d3c;
      }
      :root {
        color-scheme: dark;
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --bg: #f2efe9;
        --panel: rgba(252, 251, 248, 0.88);
        --line: #dcd7cd;
        --ink: #25282b;
        --dim: #6a6e73;
      }
      * {
        box-sizing: border-box;
      }
      @media (max-width: 900px) {
        .build {
          display: none;
        }
      }
      .tops {
        display: flex;
        gap: 8px;
        align-items: center;
        min-width: 0;
        max-width: 100%;
      }
      .seg[hidden],
      .seg button[hidden] {
        display: none !important;
      }
      #rp-views button[aria-selected="true"] {
        color: var(--ink);
        background: var(--bg);
        box-shadow: 0 0 0 1px var(--accent) inset;
      }
      .seg {
        display: flex;
        min-width: 0;
        max-width: 100%;
        overflow-x: auto;
        scrollbar-width: none;
        padding: 3px;
        gap: 2px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel);
      }
      .seg button {
        all: unset;
        flex: none;
        white-space: nowrap;
        cursor: pointer;
        padding: 5px 12px;
        border-radius: 999px;
        color: var(--dim);
        font-size: 11px;
        letter-spacing: 0.06em;
      }
      .seg button:hover {
        color: var(--ink);
      }
      .seg button[aria-selected="true"] {
        color: var(--ink);
        background: var(--bg);
        box-shadow: 0 0 0 1px var(--accent) inset;
      }
      .ctl.hide {
        display: none !important;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font:
          12px/1.45 ui-monospace,
          "SF Mono",
          Menlo,
          Consolas,
          monospace;
        overflow: hidden;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      .ui {
        position: fixed;
        pointer-events: none;
      }
      .ui > *,
      a.ui {
        pointer-events: auto;
      }
      #top {
        top: 16px;
        left: 16px;
        right: 16px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        flex-wrap: wrap;
      }
      .brand {
        flex: none;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-size: 11px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .brand i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 10px var(--accent);
      }
      .sw {
        display: flex;
        gap: 8px;
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel);
      }
      .sw button {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.25);
        cursor: pointer;
        padding: 0;
      }
      .sw button[aria-pressed="true"] {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      #ctl {
        top: 64px;
        right: 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 182px;
        max-height: calc(100vh - 140px);
        overflow: auto;
      }
      .ctl button {
        all: unset;
        pointer-events: auto;
        cursor: pointer; /* all:unset would otherwise inherit pointer-events:none from .ui */
        padding: 7px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        display: flex;
        justify-content: space-between;
        color: var(--dim);
      }
      .ctl button:hover {
        color: var(--ink);
      }
      .ctl button.on {
        color: var(--ink);
        border-color: var(--accent);
        box-shadow: 0 0 0 1px var(--accent) inset;
      }
      .ctl button kbd {
        font: inherit;
        opacity: 0.7;
      }
      .ctl .sep {
        height: 6px;
        flex: none;
      }
      .rng {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 6px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--dim);
      }
      .rng input {
        width: 100%;
        accent-color: var(--accent);
        margin: 0;
      }
      .rng output {
        color: var(--ink);
      }
      #info {
        left: 16px;
        bottom: 62px;
        max-width: min(400px, calc(100vw - 32px));
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
      }
      #info h2 {
        margin: 0 0 4px;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 600;
      }
      #info p {
        margin: 0;
      }
      #hint {
        left: 16px;
        bottom: 34px;
        color: var(--dim);
      }
      #attr {
        left: 16px;
        bottom: 14px;
        right: 220px;
        color: var(--dim);
        font-size: 10px;
      }
      #attr a {
        color: var(--dim);
      }
      #read {
        right: 16px;
        bottom: 14px;
        text-align: right;
      }
      #credit {
        right: 16px;
        bottom: 34px;
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--dim);
        text-decoration: none;
      }
      #load {
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        color: var(--dim);
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      @media (max-width: 1100px) {
        #hint {
          display: none;
        }
        #info {
          bottom: 56px;
        }
        #credit {
          bottom: auto;
          top: 44px;
          right: 16px;
        }
        #ctl {
          top: 72px;
        }
      }
      @media (max-width: 640px) {
        #ctl {
          top: auto;
          bottom: 170px;
          width: 150px;
          max-height: 40vh;
        }
        #info {
          bottom: 92px;
          max-width: calc(100vw - 190px);
        }
        #credit,
        #hint {
          display: none;
        }
      }

      body:not(.rp-ready) .ui,
      body:not(.rp-ready) #rp-ui,
      body:not(.rp-ready) #rp-dock,
      body:not(.rp-ready) #rp-now {
        visibility: hidden !important;
      }
      #info,
      #hint {
        display: none !important;
      } /* the instructions live in the Help pop-up instead */
      #rp-loading {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: var(--bg, #121316);
        color: var(--dim, #8b8f94);
        font:
          11px ui-monospace,
          "SF Mono",
          Menlo,
          Consolas,
          monospace;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        text-align: center;
        padding: 24px;
        transition: opacity 0.4s ease;
      }
      body.rp-ready #rp-loading {
        opacity: 0;
        pointer-events: none;
      }
      #rp-loading .disc {
        width: 76px;
        height: 76px;
        border-radius: 50%;
        position: relative;
        animation: rpspin 2.4s linear infinite;
        background:
          radial-gradient(
            circle,
            var(--accent, #ff9a3c) 0 12%,
            #0b0c0d 13% 17%,
            transparent 18%
          ),
          repeating-radial-gradient(circle, #202123 0 1.5px, #141517 1.5px 3px);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.14),
          0 8px 30px rgba(0, 0, 0, 0.35);
      }
      #rp-loading .disc::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(
          from 20deg,
          transparent 0 8%,
          rgba(255, 255, 255, 0.16) 11%,
          transparent 16% 58%,
          rgba(255, 255, 255, 0.1) 61%,
          transparent 66%
        );
      }
      @keyframes rpspin {
        to {
          transform: rotate(360deg);
        }
      }
      #rp-loading b {
        color: var(--ink, #e8e9ea);
        font-weight: 600;
        letter-spacing: 0.3em;
      }
      #rp-load-msg {
        max-width: 420px;
        line-height: 1.8;
        letter-spacing: 0.14em;
      }
      @media (prefers-reduced-motion: reduce) {
        #rp-loading .disc {
          animation: none;
        }
        #rp-loading,
        #rp-np,
        #rp-help-ov,
        #rp-help-ov .card {
          animation: none !important;
          transition: none !important;
        }
        #rp-np .w,
        #rp-np .w.cur {
          transition: none !important;
          animation: none !important;
        }
        #rp-np .mk {
          transition: none;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    />
    <link
      rel="modulepreload"
      href="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js"
    />
    <link
      rel="modulepreload"
      href="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var q = "auto";
        try {
          q = localStorage.getItem("rp-quality") || "auto";
        } catch (e) {}
        var coarse = false,
          reduced = false;
        try {
          coarse = matchMedia("(pointer: coarse)").matches;
          reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
        } catch (e) {}
        var weak =
          (navigator.hardwareConcurrency || 8) <= 4 ||
          (navigator.deviceMemory || 8) <= 4;
        window.__rpLow = q === "low" || (q === "auto" && (coarse || weak));
        window.__rpDprCap = window.__rpLow ? 1.25 : 2;
        window.__rpReduced = reduced;
      })();
    </script>
  </head>
  <body>
    <div id="rp-loading" role="status" aria-live="polite">
      <div class="disc"></div>
      <div><b>Record player</b></div>
      <div id="rp-load-msg">Warming up the deck…</div>
    </div>
    <script>
      (function () {
        var msg = function (t) {
          var m = document.getElementById("rp-load-msg");
          if (m && !document.body.classList.contains("rp-ready"))
            m.textContent = t;
        };
        window.addEventListener(
          "error",
          function (e) {
            if (e.target && e.target.tagName === "SCRIPT")
              msg(
                "Could not download the 3D library. Check your internet connection and reload.",
              );
            else
              msg(
                "Something went wrong starting the scene: " +
                  (e.message || "unknown error"),
              );
          },
          true,
        );
        window.addEventListener("unhandledrejection", function (e) {
          msg("Something went wrong starting the scene.");
        });
        setTimeout(function () {
          msg(
            "Still loading… the 3D library comes from the internet. Check your connection and reload if this stays.",
          );
        }, 12000);
      })();
    </script>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
      import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
      import { LineMaterial } from "three/addons/lines/LineMaterial.js";
      import { LineSegments2 } from "three/addons/lines/LineSegments2.js";
      import { LineSegmentsGeometry } from "three/addons/lines/LineSegmentsGeometry.js";
      import { mergeVertices } from "three/addons/utils/BufferGeometryUtils.js";

      // Source model units are cm, Z-up, nose toward −y, starboard toward −x (after mirroring).
      // Three.js: X = x, Y = z, Z = −y (metres).
      const V = (x, y, z) => new THREE.Vector3(x / 100, z / 100, -y / 100);
      const themeHooks = []; // per-figure theme updates
      let active = "heli"; // which figure is on screen

      // ── renderer, scene, camera ──
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(
        Math.min(devicePixelRatio, window.__rpDprCap || 2),
      );
      renderer.setSize(innerWidth, innerHeight);
      document.body.prepend(renderer.domElement);
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x121314);
      const persp = new THREE.PerspectiveCamera(
        28,
        innerWidth / innerHeight,
        0.1,
        400,
      );
      // true isometric: an orthographic camera (parallel edges stay parallel, like the iso figures); Iso view toggles it
      const ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 400);
      let orthoH = 10; // frustum height (m) at zoom 1
      let camera = persp;
      const TARGET = new THREE.Vector3(0, 2.0, 0.5),
        ISO = new THREE.Vector3(-1, 1, 1).normalize();
      const fitDist = () => 40 * Math.max(1, 1.45 / persp.aspect);
      camera.position.copy(TARGET).addScaledVector(ISO, fitDist());
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.copy(TARGET);
      controls.enableDamping = true;
      controls.maxPolarAngle = Math.PI * 0.495;
      controls.minDistance = 4;
      controls.maxDistance = 120;

      const hemi = new THREE.HemisphereLight(0xdde4ff, 0x080808, 0.7);
      scene.add(hemi);
      const ambient = new THREE.AmbientLight(0xffffff, 0);
      scene.add(ambient);
      const sun = new THREE.DirectionalLight(0xffffff, 0.7);
      sun.position.set(6, 14, 10);
      scene.add(sun);
      const fill = new THREE.DirectionalLight(0x8899bb, 0.2);
      fill.position.set(-10, 4, -8);
      scene.add(fill);

      // screen-space soft gradients + dither, so glows and light pools stay smooth instead of banded or blocky
      const NOISE = `float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }`;
      const composer = new EffectComposer(
        renderer,
        new THREE.WebGLRenderTarget(innerWidth, innerHeight, {
          samples: window.__rpLow ? 2 : 4,
          type: THREE.HalfFloatType,
        }),
      );
      const renderPass = new RenderPass(scene, camera);
      composer.addPass(renderPass);
      composer.addPass(new OutputPass());
      composer.addPass(
        new ShaderPass({
          uniforms: { tDiffuse: { value: null } },
          vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
          fragmentShader: `uniform sampler2D tDiffuse; varying vec2 vUv; ${NOISE}
    void main() { vec4 c = texture2D(tDiffuse, vUv); c.rgb += (hash(gl_FragCoord.xy) - 0.5) / 255.0; gl_FragColor = c; }`,
        }),
      );
      composer.setSize(innerWidth, innerHeight); // render targets at device resolution (a custom target starts at CSS size → blurry on Retina)

      // ── palette & materials ──
      const PALETTE = [
        ["Sodium", "#ff9d3c"],
        ["Tungsten", "#ffd27a"],
        ["Neon", "#ff4fa3"],
        ["Signal", "#3ee08f"],
        ["Dusk", "#7b8cff"],
        ["Moon", "#cfe3ff"],
      ];
      const accent = new THREE.Color(PALETTE[0][1]);
      const bodyMat = new THREE.MeshStandardMaterial({
        color: 0x1b1c1f,
        roughness: 0.9,
        metalness: 0.05,
        side: THREE.DoubleSide,
        polygonOffset: true,
        polygonOffsetFactor: 1,
        polygonOffsetUnits: 1,
      });
      const bladeMat = new THREE.MeshStandardMaterial({
        color: 0x1d1e21,
        roughness: 0.8,
        side: THREE.DoubleSide,
        polygonOffset: true,
        polygonOffsetFactor: 1,
        polygonOffsetUnits: 1,
      });
      const padMat = new THREE.MeshBasicMaterial({ color: 0x18191b }); // unlit, so cabin lights don't leak through the hull onto the deck
      // tinted see-through glass: the lit cockpit and cabin show through it, it doesn't glow by itself
      const glassMat = new THREE.MeshStandardMaterial({
        color: 0x0b0d10,
        roughness: 0.15,
        metalness: 0.2,
        transparent: true,
        opacity: 0.55,
        depthWrite: false,
        side: THREE.DoubleSide,
        emissive: accent.clone(),
        emissiveIntensity: 0,
      });
      const devRes = () => renderer.getDrawingBufferSize(new THREE.Vector2());
      // two tiers like the iso figures: silhouette outline (--line) and crease/detail edges (--detail); always 1 CSS px
      // three tiers, as in the iso figures: silhouette (--line) > major folds > minor detail (--detail, barely above the face fill)
      const LINE_COL = new THREE.Color(0x4f5357),
        MAJOR_COL = new THREE.Color(0x393c3f),
        EDGE_COL = new THREE.Color(0x27292c),
        BG_COL = new THREE.Color(0x121314);
      const MAJOR_ANGLE = 60;
      // lines are pulled slightly toward the camera so the surface they sit on never hides parts of them
      const lineOpts = {
        linewidth: 1,
        resolution: devRes(),
        polygonOffset: true,
        polygonOffsetFactor: -2,
        polygonOffsetUnits: -6,
      };
      const lineMat = new LineMaterial({ color: EDGE_COL, ...lineOpts });
      const majorMat = new LineMaterial({ color: MAJOR_COL, ...lineOpts });
      const outlineMat = new THREE.ShaderMaterial({
        uniforms: {

                g = oc.createGain(),

        EXTRA_NAMES = {};
      FIGS3D.forEach((f) => {
        EXTRA[f.id] = f.mod;
        EXTRA_NAMES[f.id] = f.name;
      });
      const SHOW_FIGS = FIGS3D.length
        ? FIGS3D.map((f) => f.id)
        : [
            "tw",
            "dr",
            "cs",
            "tm",
            "vm",
            "pc",
            "lp",
            "lg",
            "rk",
            "sk",
            "tt",
            "pl",
          ];
      for (const [id, F] of Object.entries(EXTRA)) {
        VIEWS[id] = {
          target: F.view.target,
          dir: new THREE.Vector3(1, 1, 1).normalize(),
          dist: () => F.view.dist * Math.max(1, 1.45 / persp.aspect),
          min: 1,
          cam: null,
          info: F.info,
          hint: F.hint,
        };
        const panel = document.createElement("div");
        panel.className = "ui ctl hide";
        panel.id = "ctl-" + id;
        panel.style.cssText =
          "top:64px; right:16px; display:flex; flex-direction:column; gap:6px; width:182px;";
        [...F.panel].forEach(
          (b) => {
            if (!b) {
              const sp = document.createElement("div");
              sp.className = "sep";
              panel.appendChild(sp);
              return;
            }
            const el = document.createElement("button");
            el.innerHTML = `${b[0]}<kbd>${b[1]}</kbd>`;
            if (b[3]) el.dataset.x = b[3];
            el.addEventListener("click", () => {
              b[2]();
              el.blur();
            });
            panel.appendChild(el);
          },
        );
        document.body.insertBefore(panel, document.getElementById("info"));
        const tab = document.createElement("button");
        tab.dataset.fig = id;
        tab.setAttribute("role", "tab");
        tab.textContent = EXTRA_NAMES[id];
        tab.addEventListener("click", () => setFigure(id));
        document.querySelector("#top .tops .seg").appendChild(tab);
      }
      addEventListener("keydown", (e) => {
        const F = EXTRA[active];
        if (
          !F ||
          e.metaKey ||
          e.ctrlKey ||
          e.altKey ||
          e.target.tagName === "INPUT"
        )
          return;
        if (F.key(e)) e.preventDefault();
      });
      addEventListener("keydown", (e) => {
        if (
          (active !== "tm" && active !== "vm") ||
          e.metaKey ||
          e.ctrlKey ||
          e.altKey ||
          e.target.tagName === "INPUT"
        )
          return;
        if ((active === "tm" ? TM : VM).key(e)) e.preventDefault();
      });
      document.querySelectorAll("#ctl-cs button").forEach((b) =>
        b.addEventListener("click", () => {
          const a = b.dataset.cs;
          if (a === "demo") CS.demo();
          else if (a === "iso") act.iso();
          else {
            CS.key({ key: a === "play" ? " " : "s" });
            CS.up();
          }
          b.blur();
        }),
      );
      addEventListener("keydown", (e) => {
        if (
          active !== "cs" ||
          e.metaKey ||
          e.ctrlKey ||
          e.altKey ||
          e.target.tagName === "INPUT"
        )
          return;
        if (CS.key(e)) e.preventDefault();
      });
      addEventListener("keyup", (e) => {
        if (active === "cs") CS.keyup(e);
      });
      addEventListener("blur", () => CS.up());
      document.querySelectorAll("#ctl-dr button").forEach((b) =>
        b.addEventListener("click", () => {
          const a = b.dataset.dr;
          if (a === "demo") DR.demo();
          else if (a === "iso") act.iso();
          else DR.toggle();
          b.blur();
        }),
      );
      addEventListener("keydown", (e) => {
        if (
          active !== "dr" ||
          e.metaKey ||
          e.ctrlKey ||
          e.altKey ||
          e.target.tagName === "INPUT"
        )
          return;
        if (DR.key(e)) e.preventDefault();
      });
      addEventListener("keydown", (e) => {
        if (
          active !== "tw" ||
          e.metaKey ||
          e.ctrlKey ||
          e.altKey ||
          e.target.tagName === "INPUT"
        )
          return;
        if (e.repeat && e.key === "Enter") {
          e.preventDefault();
          return;
        }
        if (twPress(e.key)) e.preventDefault();
      });

      // ── load the embedded parts file ──
      // (Seahawk removed from this page — the model and its loader live in 'Iso 3D (with Seahawk) backup.html')

      // ── animation ──
      let last = performance.now(),
        sig = "";
      const tmpV = new THREE.Vector2();
      const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);
      function frame(now) {
        if (window.__rpIdle && window.__rpIdle()) {
          requestAnimationFrame(frame);
          return;
        } // nothing is moving: skip this redraw
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        st.rpm = st.eng
          ? Math.min(1, st.rpm + 0.16 * dt)
          : Math.max(0, st.rpm - 0.07 * dt);
        st.mr += st.rpm * 7.5 * dt; // counter-clockwise from above; slowed on screen (real 27 rad/s strobes)
        st.tr += st.rpm * 7.5 * 4.6 * dt * 0.5;
        const goal = st.rpm >= 0.95 ? st.tAlt : 0;
        st.alt +=
          Math.sign(goal - st.alt) *
          Math.min(Math.abs(goal - st.alt), 0.9 * dt);
        if (st.msg === "waiting for rotor speed" && st.rpm >= 0.95) st.msg = "";
        st.doorT += ((st.door ? 1 : 0) - st.doorT) * Math.min(1, dt * 3);
        if (mainRotor) {
          mainRotor.quaternion.setFromAxisAngle(mrAxis, st.mr);
          tailRotor.quaternion.setFromAxisAngle(trAxis, st.tr);
          if (doorMesh) {
            const e = ease(st.doorT);
            doorMesh.position.z = -1.95 * e;
            doorMesh.position.x = -0.04 * Math.min(1, e * 4);
          }
          if (doorPortMesh)
            doorPortMesh.position.z = 1.2 * (1 - ease(st.doorT)); // closed = slid forward over the doorway
          heli.position.y = st.alt;
        }
        const lift = 1 - Math.min(1, st.alt / 9);
        shadowMat.uniforms.opacity.value = THEMES[theme].shadow * lift;
        spotMat.uniforms.opacity.value = st.lights
          ? 0.45 * (1 - Math.min(0.8, st.alt / 8))
          : 0;
        spillMat.uniforms.opacity.value = st.cabin
          ? 0.4 * ease(st.doorT) * lift
          : 0;
        if (active === "tw") twTick(now, dt);
        if (active === "dr") {
          DR.tick(now, dt);
          tickFlashes(now);
        }
        if (active === "cs") CS.tick(now, dt);
        if (active === "tm") TM.tick(now, dt);
        if (active === "vm") VM.tick(now, dt);
        if (EXTRA[active]) EXTRA[active].tick(now, dt);
        const s = `${Math.round(st.rpm * RPM)}|${st.alt.toFixed(1)}|${st.msg}`;
        if (s !== sig) {
          sig = s;
          render();
        }
        controls.update();
        applyWeight();
        const bufH = renderer.getDrawingBufferSize(tmpV).y,
          pxScale =
            camera === ortho ? (bufH * ortho.zoom) / orthoH : bufH / fovK();
        glowMats.forEach((m) => (m.uniforms.scale.value = pxScale));
        composer.render();
        requestAnimationFrame(frame);
      }
      addEventListener("resize", () => {
        persp.aspect = innerWidth / innerHeight;
        persp.updateProjectionMatrix();
        orthoFrustum();
        renderer.setSize(innerWidth, innerHeight);
        composer.setSize(innerWidth, innerHeight);
        outlineMat.uniforms.res.value.copy(devRes());
        lineMat.resolution.copy(devRes());
        majorMat.resolution.copy(devRes());
        accentLineMat.resolution.copy(devRes());
        appliedKey = "";
      });
      render();
      document.querySelectorAll(".seg button[data-fig]").forEach((b) => {
        b.hidden = !SHOW_FIGS.includes(b.dataset.fig);
      });
      if (SHOW_FIGS.length < 2) document.querySelector("#top .tops .seg").hidden = true; // one figure: no tab bar
      setFigure(SHOW_FIGS.includes(load("fig")) ? load("fig") : SHOW_FIGS[0]);
      document.body.classList.add("rp-ready");
      if (window.__rpWake) window.__rpWake(3000);
      setTimeout(() => {
        const l = document.getElementById("rp-loading");
        if (l) l.remove();
      }, 700);
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
