<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tesla Roadster • Stunts</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap");

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: "Inter", system-ui, sans-serif;
        color: #fff;
      }
      #c {
        display: block;
        width: 100%;
        height: 100%;
      }

      .ui {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      .header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 24px 32px;
        pointer-events: auto;
      }
      .logo {
        font-family: "Space Grotesk", sans-serif;
        font-size: 21px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .logo span {
        color: #ff3b3b;
      }

      .modes {
        display: flex;
        gap: 8px;
        background: rgba(20, 20, 22, 0.85);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 9999px;
        padding: 4px;
      }
      .mode-btn {
        padding: 10px 24px;
        border-radius: 9999px;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.3px;
        border: none;
        background: transparent;
        color: #888;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .mode-btn.active {
        background: #fff;
        color: #000;
      }

      .info {
        position: absolute;
        bottom: 32px;
        left: 32px;
        max-width: 380px;
        pointer-events: auto;
      }
      .info h2 {
        font-size: 13px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        opacity: 0.5;
        margin: 0 0 8px;
        font-weight: 500;
      }
      .info p {
        margin: 0;
        font-size: 14px;
        line-height: 1.5;
        color: #aaa;
      }

      .stats {
        position: absolute;
        bottom: 32px;
        right: 32px;
        text-align: right;
        pointer-events: none;
      }
      .stat {
        display: flex;
        align-items: baseline;
        justify-content: flex-end;
        gap: 6px;
        margin-bottom: 4px;
      }
      .stat .value {
        font-size: 42px;
        font-weight: 300;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      .stat .unit {
        font-size: 13px;
        opacity: 0.6;
      }
      .stat-label {
        font-size: 10px;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        opacity: 0.4;
      }

      #vig {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          circle at 50% 40%,
          transparent 45%,
          rgba(0, 0, 0, 0.65) 100%
        );
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="vig"></div>

    <div class="ui">
      <!-- Header -->
      <div class="header">
        <div class="logo">TESLA <span>ROADSTER</span></div>

        <div class="modes">
          <button class="mode-btn active" id="btn-climb">Wall Climb</button>
          <button class="mode-btn" id="btn-kickflip">Kickflip</button>
        </div>
      </div>

      <!-- Info -->
      <div class="info">
        <h2 id="mode-title">WALL CLIMB</h2>
        <p id="mode-desc">
          Multi-mode fans create 4,700 kg of downforce, pinning the car to the
          wall even when inverted.
        </p>
      </div>

      <!-- Stats -->
      <div class="stats">
        <div class="stat">
          <div class="value" id="kg">4700</div>
          <div class="unit">kg</div>
        </div>
        <div class="stat-label">DOWNFORCE</div>

        <div class="stat" style="margin-top: 18px">
          <div class="value" id="g">2.4</div>
          <div class="unit">G</div>
        </div>
        <div class="stat-label">GRIP</div>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";

      // ==================== SETUP ====================
      const canvas = document.getElementById("c");
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: false,
      });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);
      scene.fog = new THREE.FogExp2(0x000000, 0.012);

      const camera = new THREE.PerspectiveCamera(
        38,
        innerWidth / innerHeight,
        0.1,
        400,
      );

      // Lights
      scene.add(new THREE.AmbientLight(0x8899aa, 0.1));
      const key = new THREE.SpotLight(0xfff5ea, 2200, 180, 0.4, 0.6, 1.4);
      key.position.set(22, 52, 26);
      key.castShadow = true;
      scene.add(key);
      scene.add(key.target);
      const rim = new THREE.SpotLight(0x8eb4ff, 380, 160, 0.5, 0.7, 1.6);
      rim.position.set(-28, 24, -22);
      scene.add(rim);

      // Ground
      const floor = new THREE.Mesh(
        new THREE.CircleGeometry(120, 64),
        new THREE.MeshStandardMaterial({ color: 0x050506, roughness: 0.92 }),
      );
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);

      // Red ground line
      const redLine = new THREE.Mesh(
        new THREE.PlaneGeometry(32, 0.2),
        new THREE.MeshBasicMaterial({
          color: 0xff2a2a,
          transparent: true,
          opacity: 0.6,
        }),
      );
      redLine.rotation.x = -Math.PI / 2;
      redLine.position.set(-18, 0.03, 6);
      scene.add(redLine);

      // ==================== RAMP ====================
      const W = 5.4;
      const curve = new THREE.CatmullRomCurve3(
        [
          new THREE.Vector3(-24, 0.02, 0),
          new THREE.Vector3(-12, 0.02, 0),
          new THREE.Vector3(1, 0.8, 0),
          new THREE.Vector3(11, 5.2, 0),
          new THREE.Vector3(14.5, 13, 0),
          new THREE.Vector3(12.8, 21.5, 0),
          new THREE.Vector3(8.5, 27.5, 0),
          new THREE.Vector3(3.5, 30.8, 0),
        ],
        false,
        "catmullrom",
        0.12,
      );
      const TOTAL = curve.getLength();

      function frame(s) {
        s = Math.max(0, Math.min(TOTAL, s));
        const u = s / TOTAL;
        const p = curve.getPointAt(u);
        const t = curve.getTangentAt(u).normalize();
        const up = new THREE.Vector3(-t.y, t.x, 0).normalize();
        return { p, t, u: up };
      }

      // Concrete texture
      function makeConcrete() {
        const cv = document.createElement("canvas");
        cv.width = 512;
        cv.height = 2048;
        const cx = cv.getContext("2d");
        cx.fillStyle = "#8a8d92";
        cx.fillRect(0, 0, 512, 2048);
        const img = cx.getImageData(0, 0, 512, 2048);
        for (let i = 0; i < img.data.length; i += 4) {
          const n = (Math.random() - 0.5) * 26;
          img.data[i] += n;
          img.data[i + 1] += n;
          img.data[i + 2] += n;
        }
        cx.putImageData(img, 0, 0);
        cx.strokeStyle = "rgba(25,25,28,0.3)";
        cx.lineWidth = 3;
        for (let y = 0; y < 2048; y += 92) {
          cx.beginPath();
          cx.moveTo(0, y);
          cx.lineTo(512, y);
          cx.stroke();
        }
        cx.fillStyle = "rgba(235,235,238,0.9)";
        cx.fillRect(250, 0, 12, 2048);
        const tex = new THREE.CanvasTexture(cv);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        tex.anisotropy = 8;
        return tex;
      }
      const concTex = makeConcrete();

      // Build ramp
      (function buildRamp() {
        const N = 300,
          TH = 0.48;
        const v = [],
          nrm = [],
          uv = [],
          idx = [];
        for (let i = 0; i <= N; i++) {
          const s = (i / N) * TOTAL,
            f = frame(s);
          const right = new THREE.Vector3().crossVectors(f.t, f.u).normalize();
          for (const k of [-1, 1]) {
            v.push(
              f.p.x + (right.x * k * W) / 2,
              f.p.y + (right.y * k * W) / 2,
              f.p.z + (right.z * k * W) / 2,
            );
            nrm.push(f.u.x, f.u.y, f.u.z);
            uv.push(k * 0.5 + 0.5, s / 4.2);
          }
          if (i < N) {
            const a = i * 2;
            idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3);
          }
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute("position", new THREE.Float32BufferAttribute(v, 3));
        g.setAttribute("normal", new THREE.Float32BufferAttribute(nrm, 3));
        g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
        g.setIndex(idx);
        const mesh = new THREE.Mesh(
          g,
          new THREE.MeshStandardMaterial({
            map: concTex,
            roughness: 0.68,
            metalness: 0.1,
            side: THREE.DoubleSide,
          }),
        );
        mesh.receiveShadow = true;
        mesh.castShadow = true;
        scene.add(mesh);

        // Red LED edges
        const ledMat = new THREE.MeshStandardMaterial({
          color: 0xff1a1a,
          emissive: 0xff2200,
          emissiveIntensity: 5.5,
          roughness: 0.25,
          metalness: 0.5,
        });
        for (const side of [-1, 1]) {
          const pts = [];
          for (let i = 0; i <= 90; i++) {
            const f = frame((i / 90) * TOTAL);
            const right = new THREE.Vector3()
              .crossVectors(f.t, f.u)
              .normalize();
            pts.push(
              f.p
                .clone()
                .addScaledVector(right, side * (W / 2 + 0.03))
                .addScaledVector(f.u, 0.05),
            );
          }
          scene.add(
            new THREE.Mesh(
              new THREE.TubeGeometry(
                new THREE.CatmullRomCurve3(pts),
                90,
                0.05,
                8,
                false,
              ),
              ledMat,
            ),
          );
        }
      })();

      // ==================== CAR ====================
      const car = new THREE.Group();
      scene.add(car);

      const paint = new THREE.MeshPhysicalMaterial({
        color: 0xe8eaee,
        metalness: 0.93,
        roughness: 0.15,
        clearcoat: 1,
        clearcoatRoughness: 0.03,
      });
      const dark = new THREE.MeshStandardMaterial({
        color: 0x0b0c0e,
        metalness: 0.65,
        roughness: 0.4,
      });
      const glass = new THREE.MeshPhysicalMaterial({
        color: 0x06080d,
        metalness: 0.2,
        roughness: 0.02,
        transmission: 0.4,
        transparent: true,
        opacity: 0.9,
      });

      const sh = new THREE.Shape();
      sh.moveTo(-2.3, 0.26);
      sh.lineTo(-2.34, 0.56);
      sh.lineTo(-2.08, 0.76);
      sh.lineTo(-1.08, 0.8);
      sh.quadraticCurveTo(-0.48, 1.16, 0.26, 1.18);
      sh.quadraticCurveTo(1.02, 1.14, 1.6, 0.82);
      sh.lineTo(2.2, 0.6);
      sh.lineTo(2.36, 0.46);
      sh.lineTo(2.3, 0.26);
      sh.lineTo(-2.3, 0.26);
      const bg = new THREE.ExtrudeGeometry(sh, {
        depth: 1.9,
        bevelEnabled: true,
        bevelThickness: 0.12,
        bevelSize: 0.12,
        bevelSegments: 4,
      });
      bg.center();
      bg.translate(0, 0.7, 0);
      const body = new THREE.Mesh(bg, paint);
      body.castShadow = true;
      car.add(body);

      const cab = new THREE.Mesh(
        new THREE.SphereGeometry(0.9, 26, 14, 0, Math.PI * 2, 0, Math.PI / 2),
        glass,
      );
      cab.scale.set(1.4, 0.5, 0.88);
      cab.position.set(-0.1, 1.02, 0);
      car.add(cab);

      const wing = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.04, 2.0), dark);
      wing.position.set(-2.05, 1.14, 0);
      car.add(wing);

      const wheels = [];
      [
        [1.5, 0.98],
        [1.5, -0.98],
        [-1.46, 0.98],
        [-1.46, -0.98],
      ].forEach(([x, z]) => {
        const w = new THREE.Group();
        const t = new THREE.Mesh(
          new THREE.CylinderGeometry(0.35, 0.35, 0.28, 24),
          new THREE.MeshStandardMaterial({ color: 0x08090a, roughness: 0.9 }),
        );
        t.rotation.x = Math.PI / 2;
        t.castShadow = true;
        const r = new THREE.Mesh(
          new THREE.CylinderGeometry(0.23, 0.23, 0.3, 8),
          new THREE.MeshStandardMaterial({
            color: 0xc2c6cc,
            metalness: 1,
            roughness: 0.2,
          }),
        );
        r.rotation.x = Math.PI / 2;
        w.add(t, r);
        w.position.set(x, 0.35, z);
        car.add(w);
        wheels.push(w);
      });

      [1, -1].forEach((z) => {
        const h = new THREE.Mesh(
          new THREE.BoxGeometry(0.05, 0.055, 0.5),
          new THREE.MeshStandardMaterial({
            emissive: 0xe6f0ff,
            emissiveIntensity: 6,
          }),
        );
        h.position.set(2.34, 0.6, z * 0.56);
        car.add(h);
        const tl = new THREE.Mesh(
          new THREE.BoxGeometry(0.04, 0.055, 0.68),
          new THREE.MeshStandardMaterial({
            emissive: 0xff1a1a,
            emissiveIntensity: 5,
          }),
        );
        tl.position.set(-2.32, 0.6, z * 0.5);
        car.add(tl);
      });

      // Underbody fans
      const skirtMat = new THREE.MeshStandardMaterial({
        color: 0x0c0e12,
        emissive: 0x1a7fff,
        emissiveIntensity: 0,
        roughness: 0.5,
      });
      [
        [0, 0.86, 4.4, 0.05],
        [0, -0.86, 4.4, 0.05],
        [2.2, 0, 0.05, 1.72],
        [-2.2, 0, 0.05, 1.72],
      ].forEach(([x, z, sx, sz]) => {
        const s = new THREE.Mesh(new THREE.BoxGeometry(sx, 0.22, sz), skirtMat);
        s.position.set(x, 0.14, z);
        car.add(s);
      });

      const fans = [];
      [-1.12, -0.12, 0.88].forEach((x) => {
        const g = new THREE.Group();
        g.position.set(x, 0.18, 0);
        const ring = new THREE.Mesh(
          new THREE.TorusGeometry(0.38, 0.04, 8, 24),
          dark,
        );
        ring.rotation.x = Math.PI / 2;
        g.add(ring);
        const rot = new THREE.Group();
        g.add(rot);
        for (let i = 0; i < 9; i++) {
          const b = new THREE.Mesh(
            new THREE.BoxGeometry(0.3, 0.01, 0.08),
            new THREE.MeshStandardMaterial({
              color: 0xd0d4da,
              metalness: 1,
              roughness: 0.2,
            }),
          );
          b.position.x = 0.2;
          b.rotation.x = 0.5;
          const pv = new THREE.Group();
          pv.rotation.y = (i / 9) * Math.PI * 2;
          pv.add(b);
          rot.add(pv);
        }
        const glow = new THREE.Mesh(
          new THREE.CircleGeometry(0.4, 24),
          new THREE.MeshBasicMaterial({
            color: 0x3aa8ff,
            transparent: true,
            opacity: 0,
            side: THREE.DoubleSide,
          }),
        );
        glow.rotation.x = Math.PI / 2;
        glow.position.y = -0.03;
        g.add(glow);
        car.add(g);
        fans.push({ rot, glow });
      });

      const cavity = new THREE.Mesh(
        new THREE.BoxGeometry(4.3, 0.2, 1.68),
        new THREE.MeshBasicMaterial({
          color: 0x2d9bff,
          transparent: true,
          opacity: 0,
        }),
      );
      cavity.position.y = 0.11;
      car.add(cavity);
      const glowLight = new THREE.PointLight(0x3aa6ff, 0, 6);
      glowLight.position.y = 0.07;
      car.add(glowLight);

      // Jets
      const jets = [];
      [
        [-0.55, -0.68],
        [0.55, -0.68],
      ].forEach(([x, z]) => {
        const grp = new THREE.Group();
        grp.position.set(x, 0.04, z);
        const core = new THREE.Mesh(
          new THREE.ConeGeometry(0.08, 1.3, 8, 1, true),
          new THREE.MeshBasicMaterial({
            color: 0xb8e8ff,
            transparent: true,
            opacity: 0,
          }),
        );
        core.rotation.x = Math.PI;
        core.position.y = -0.65;
        grp.add(core);
        const outer = new THREE.Mesh(
          new THREE.ConeGeometry(0.16, 1.9, 8, 1, true),
          new THREE.MeshBasicMaterial({
            color: 0x4aa8ff,
            transparent: true,
            opacity: 0,
          }),
        );
        outer.rotation.x = Math.PI;
        outer.position.y = -0.9;
        grp.add(outer);
        car.add(grp);
        jets.push({ core, outer });
      });

      // ==================== PARTICLES ====================
      const PN = 480,
        pp = new Float32Array(PN * 3),
        ps = [];
      const spawn = (i) => {
        const r = Math.random();
        const p = new THREE.Vector3();
        if (r < 0.4)
          p.set(
            -2.5 - Math.random() * 2.8,
            0.03 + Math.random() * 0.5,
            (Math.random() - 0.5) * 3.3,
          );
        else if (r < 0.75)
          p.set(
            2.5 + Math.random() * 2.8,
            0.03 + Math.random() * 0.5,
            (Math.random() - 0.5) * 3.3,
          );
        else
          p.set(
            (Math.random() - 0.5) * 4.8,
            0.03 + Math.random() * 0.3,
            (Math.random() < 0.5 ? 1 : -1) * (1 + Math.random() * 1.8),
          );
        ps[i] = {
          p,
          f: fans[Math.floor(Math.random() * 3)],
          ex: false,
          v: 1.6 + Math.random() * 1.8,
        };
      };
      for (let i = 0; i < PN; i++) spawn(i);
      const pg = new THREE.BufferGeometry();
      pg.setAttribute("position", new THREE.BufferAttribute(pp, 3));
      const pm = new THREE.PointsMaterial({
        color: 0xbfe6ff,
        size: 0.05,
        transparent: true,
        opacity: 0,
      });
      car.add(new THREE.Points(pg, pm));

      // Landing smoke
      const SN = 380,
        sp = new Float32Array(SN * 3),
        smokeLife = [];
      for (let i = 0; i < SN; i++) {
        sp[i * 3] = 0;
        sp[i * 3 + 1] = -10;
        sp[i * 3 + 2] = 0;
        smokeLife.push({ a: 0, vx: 0, vy: 0, vz: 0 });
      }
      const sg = new THREE.BufferGeometry();
      sg.setAttribute("position", new THREE.BufferAttribute(sp, 3));
      const sm = new THREE.PointsMaterial({
        color: 0xd4e0ee,
        size: 0.6,
        transparent: true,
        opacity: 0,
        sizeAttenuation: true,
      });
      const smoke = new THREE.Points(sg, sm);
      scene.add(smoke);

      function emitSmoke(pos, amt) {
        for (let k = 0; k < amt; k++) {
          const i = Math.floor(Math.random() * SN);
          sp[i * 3] = pos.x + (Math.random() - 0.5) * 1.3;
          sp[i * 3 + 1] = pos.y + Math.random() * 0.3;
          sp[i * 3 + 2] = pos.z + (Math.random() - 0.5) * 1.3;
          smokeLife[i].a = 1;
          smokeLife[i].vx = (Math.random() - 0.5) * 1.4;
          smokeLife[i].vy = 0.9 + Math.random() * 1.6;
          smokeLife[i].vz = (Math.random() - 0.5) * 1.4;
        }
      }

      // ==================== STATE ====================
      let mode = "climb"; // 'climb' or 'kickflip'
      let phase = 0,
        s = 0,
        v = 0,
        fan = 0,
        hold = 0,
        fly = 0;
      let pitch = 0,
        yaw = 0,
        roll = 0;
      let pitchRate = 0,
        yawRate = 0,
        rollRate = 0;
      const flyPos = new THREE.Vector3(),
        flyVel = new THREE.Vector3();
      const camPos = new THREE.Vector3(-26, 4, 20),
        camTgt = new THREE.Vector3(-14, 2, 0);
      const clock = new THREE.Clock();

      const btnClimb = document.getElementById("btn-climb");
      const btnKick = document.getElementById("btn-kickflip");
      const modeTitle = document.getElementById("mode-title");
      const modeDesc = document.getElementById("mode-desc");

      function setMode(newMode) {
        mode = newMode;
        btnClimb.classList.toggle("active", mode === "climb");
        btnKick.classList.toggle("active", mode === "kickflip");

        if (mode === "climb") {
          modeTitle.textContent = "WALL CLIMB";
          modeDesc.textContent =
            "Multi-mode fans create 4,700 kg of downforce, pinning the car to the wall even when inverted.";
          resetClimb();
        } else {
          modeTitle.textContent = "KICKFLIP";
          modeDesc.textContent =
            "Full-speed launch followed by a 360° backflip. Cold-gas thrusters stabilize the rotation before landing.";
          resetKickflip();
        }
      }

      btnClimb.onclick = () => setMode("climb");
      btnKick.onclick = () => setMode("kickflip");

      function resetClimb() {
        phase = 0;
        s = 0;
        v = 0;
        fan = 0;
        hold = 0;
        fly = 0;
        car.position.set(0, 0, 0);
        car.quaternion.identity();
        flyPos.set(0, 0, 0);
        flyVel.set(0, 0, 0);
        pitch = yaw = roll = 0;
      }

      function resetKickflip() {
        phase = 0;
        s = 0;
        v = 0;
        fan = 0;
        hold = 0;
        fly = 0;
        car.position.set(0, 0, 0);
        car.quaternion.identity();
        flyPos.set(0, 0, 0);
        flyVel.set(0, 0, 0);
        pitch = yaw = roll = 0;
      }

      // ==================== MAIN LOOP ====================
      function loop() {
        requestAnimationFrame(loop);
        const dt = Math.min(clock.getDelta(), 0.06);

        // ===== WALL CLIMB MODE =====
        if (mode === "climb") {
          if (phase === 0) {
            fan = Math.min(1, fan + dt * 0.6);
            const targetV = s < TOTAL * 0.3 ? 15 : 10.5;
            v = v * 0.92 + targetV * 0.08;
            const remain = TOTAL * 0.92 - s;
            if (remain < 8) v = Math.max(0, Math.min(v, remain * 1.3));
            s += v * dt;
            if (remain < 0.03) {
              s = TOTAL * 0.92;
              v = 0;
              phase = 1;
            }
          } else if (phase === 1) {
            hold += dt;
            fan = 1;
          }

          const f = frame(s);
          const right = new THREE.Vector3().crossVectors(f.t, f.u).normalize();
          const _m = new THREE.Matrix4().makeBasis(f.t, f.u, right);
          car.quaternion.setFromRotationMatrix(_m);
          car.position.copy(f.p);
          if (phase > 0)
            car.position.addScaledVector(
              f.u,
              Math.sin(hold * 2.8) * 0.004 * Math.exp(-hold * 0.6),
            );

          wheels.forEach((w) => (w.rotation.z -= (v * dt) / 0.35));
        }

        // ===== KICKFLIP MODE =====
        else {
          if (phase === 0) {
            fan = Math.min(1, fan + dt * 0.5);
            v = v * 0.9 + 17 * 0.1;
            s += v * dt;
            if (s > TOTAL * 0.88) {
              phase = 1;
              const f = frame(s);
              flyPos.copy(f.p).addScaledVector(f.u, 0.6);
              flyVel.copy(f.t).multiplyScalar(22).addScaledVector(f.u, 11);
              flyVel.z += (Math.random() - 0.5) * 3;
              pitchRate = -2.35;
              yawRate = 0.6;
              rollRate = 0.35;
              fan = 0.3;
            }
          } else if (phase === 1) {
            fly += dt;
            flyVel.y -= 9.6 * dt;
            flyPos.addScaledVector(flyVel, dt);

            pitch += pitchRate * dt;
            yaw += yawRate * dt;
            roll += rollRate * dt;

            car.position.copy(flyPos);
            const _e = new THREE.Euler(pitch, yaw, roll, "YXZ");
            car.quaternion.setFromEuler(_e);

            if (flyPos.y < 0.8 && flyVel.y < 0) {
              phase = 2;
              emitSmoke(flyPos, 120);
            }
          } else if (phase === 2) {
            fly += dt;
            flyVel.y -= 9.6 * dt;
            flyVel.multiplyScalar(0.98);
            flyPos.addScaledVector(flyVel, dt);

            pitch = pitch * 0.92 + 0.08 * dt;
            yaw = yaw * 0.9;
            roll = roll * 0.9;

            car.position.copy(flyPos);
            const _e = new THREE.Euler(pitch, yaw, roll, "YXZ");
            car.quaternion.setFromEuler(_e);

            if (flyPos.y <= 0.4) {
              phase = 3;
              flyPos.y = 0.35;
              flyVel.set(0, 0, 0);
              emitSmoke(car.position, 180);
            }
          } else if (phase === 3) {
            pitch *= 0.85;
            yaw *= 0.85;
            roll *= 0.85;
            const _e = new THREE.Euler(pitch, yaw, roll, "YXZ");
            car.quaternion.setFromEuler(_e);
            car.position.y = 0.35;
            if (Math.random() < 0.4)
              emitSmoke(
                car.position.clone().add(new THREE.Vector3(0, -0.1, 0)),
                3,
              );
          }
        }

        // Fan & jet visuals
        fans.forEach((fn) => {
          fn.rot.rotation.y += fan * 62 * dt;
          fn.glow.material.opacity =
            fan * (0.3 + 0.12 * Math.sin(Date.now() * 0.012));
        });
        skirtMat.emissiveIntensity = fan * 1.6;
        cavity.material.opacity = fan * 0.22;
        glowLight.intensity = fan * 13;
        pm.opacity = fan * 0.85;

        const jetOn = mode === "kickflip" && phase >= 1 ? 1 : 0;
        jets.forEach((j) => {
          j.core.material.opacity =
            jetOn * (0.6 + 0.3 * Math.sin(Date.now() * 0.04));
          j.outer.material.opacity =
            jetOn * (0.22 + 0.1 * Math.sin(Date.now() * 0.03));
        });

        // Suction particles (only in climb)
        if (mode === "climb" && phase < 2) {
          const pull = 4 + fan * 18;
          for (let i = 0; i < PN; i++) {
            const o = ps[i],
              p = o.p;
            if (!o.ex) {
              const d = new THREE.Vector3(
                o.f.rot.parent.position.x,
                0.18,
                0,
              ).sub(p);
              if (d.length() < 0.26) {
                o.ex = true;
                p.set(o.f.rot.parent.position.x, 0.26, 0);
              } else {
                d.normalize();
                p.addScaledVector(d, (o.v + pull) * dt * fan * 0.9);
              }
            } else {
              p.x += (-2.5 - p.x) * dt * 5 - 8 * fan * dt;
              p.y += (0.85 - p.y) * dt * 3.5;
              if (p.x < -4.2) spawn(i);
            }
            pp[i * 3] = p.x;
            pp[i * 3 + 1] = p.y;
            pp[i * 3 + 2] = p.z;
          }
          pg.attributes.position.needsUpdate = true;
        }

        // Smoke update
        let alive = 0;
        for (let i = 0; i < SN; i++) {
          const L = smokeLife[i];
          if (L.a <= 0) continue;
          L.a -= dt * 0.5;
          sp[i * 3] += L.vx * dt;
          sp[i * 3 + 1] += L.vy * dt;
          sp[i * 3 + 2] += L.vz * dt;
          L.vy += 0.35 * dt;
          L.vx *= 0.985;
          L.vz *= 0.985;
          alive++;
        }
        sg.attributes.position.needsUpdate = true;
        sm.opacity = Math.min(0.65, alive / 70);

        // HUD
        const suction = 4700 * fan;
        document.getElementById("kg").textContent =
          Math.round(suction).toLocaleString();
        document.getElementById("g").textContent = (suction / 1900).toFixed(1);

        // Camera
        let tp, tt;
        if (mode === "climb") {
          if (phase === 0) {
            const k = THREE.MathUtils.smoothstep(s, TOTAL * 0.15, TOTAL * 0.75);
            tp = new THREE.Vector3().lerpVectors(
              new THREE.Vector3(-24, 3.5, 18),
              new THREE.Vector3(-3, 15, 30),
              k,
            );
            tt = car.position.clone().add(new THREE.Vector3(3, 0.8, 0));
          } else {
            const a = -0.35 + hold * 0.07;
            tp = new THREE.Vector3(
              Math.sin(a) * 26 + 3,
              23 + Math.sin(hold * 0.4) * 1.5,
              Math.cos(a) * 24,
            );
            tt = car.position.clone().add(new THREE.Vector3(0, 1, 0));
          }
        } else {
          if (phase < 2) {
            tp = new THREE.Vector3(-18, 8, 22);
            tt = car.position.clone().add(new THREE.Vector3(2, 3, 0));
          } else {
            const dir = new THREE.Vector3(0, 0, 1).applyQuaternion(
              car.quaternion,
            );
            tp = car.position
              .clone()
              .add(
                new THREE.Vector3(-8, 4, -9).applyQuaternion(car.quaternion),
              );
            tt = car.position.clone().addScaledVector(dir, 10);
          }
        }
        camPos.lerp(tp, 1 - Math.pow(0.03, dt));
        camTgt.lerp(tt, 1 - Math.pow(0.035, dt));
        camera.position.copy(camPos);
        camera.lookAt(camTgt);

        renderer.render(scene, camera);
      }
      loop();

      window.addEventListener("resize", () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });

      // Start in climb mode
      setMode("climb");
    </script>
  </body>
</html>
