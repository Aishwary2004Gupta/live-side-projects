<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tesla Roadster • Fan Suction Loop</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #010101; overflow: hidden; font-family: 'Inter', sans-serif; color: #e6e6e6; }
  canvas { display: block; }
  .overlay {
    position: absolute; inset: 0; pointer-events: none; z-index: 10;
    background: radial-gradient(circle at 60% 50%, rgba(0,0,0,0) 30%, rgba(0,0,0,0.7) 100%);
  }
  .hud {
    position: absolute; top: 28px; left: 32px; z-index: 20; pointer-events: none;
  }
  .hud h1 {
    font-family: 'Orbitron', sans-serif; font-size: 1.8rem; letter-spacing: 2px; text-transform: uppercase;
    background: linear-gradient(180deg, #fff 60%, #ff4d4d 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 10px rgba(255,77,77,0.3));
  }
  .hud .sub {
    margin-top: 6px; font-size: 0.75rem; letter-spacing: 1.5px; opacity: 0.8; text-transform: uppercase;
    color: #ff8888;
  }
  .stats {
    position: absolute; bottom: 32px; left: 32px; z-index: 20; pointer-events: none;
    font-family: 'Orbitron', sans-serif; font-size: 0.85rem; letter-spacing: 1px;
  }
  .stats strong { color: #fff; font-size: 1.2rem; display: block; margin-bottom: 4px; }
  .stats span { color: #aaa; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.5px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div class="overlay"></div>
<div class="hud">
  <h1>Tesla Roadster</h1>
  <div class="sub">Multi-Mode Fan Suction • 4,700 kg Downforce • 2G Grip</div>
</div>
<div class="stats">
  <strong>4700 kg</strong>
  <span>Atmospheric Pressure Downforce</span>
</div>

<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  // --- SCENE SETUP ---
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x020203);
  scene.fog = new THREE.FogExp2(0x020203, 0.015);

  const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(-4, 5, 14);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.4;
  controls.target.set(2, 4, 0);

  // --- LIGHTING ---
  const ambient = new THREE.AmbientLight(0x111122, 0.6);
  scene.add(ambient);

  const topLight = new THREE.DirectionalLight(0xffffff, 1.5);
  topLight.position.set(5, 15, 8);
  topLight.castShadow = true;
  scene.add(topLight);

  const fill = new THREE.DirectionalLight(0x6688ff, 0.8);
  fill.position.set(-10, 5, -10);
  scene.add(fill);

  // Red glow along ramp edge
  const redPoint = new THREE.PointLight(0xff2222, 8, 40);
  redPoint.position.set(3, 7, 0);
  scene.add(redPoint);

  const redPoint2 = new THREE.PointLight(0xff5555, 5, 30);
  redPoint2.position.set(-1, 3, 2);
  scene.add(redPoint2);

  // --- RAMP / WALL ---
  // Vertical curved wall (loop-like) built with CatmullRomCurve3
  const curvePoints = [
    new THREE.Vector3(-2, 0, 0),
    new THREE.Vector3(1, 2.5, 0),
    new THREE.Vector3(4, 5.5, 0),
    new THREE.Vector3(3, 8.5, 0),
    new THREE.Vector3(0, 10, 0),
    new THREE.Vector3(-3, 10.5, 0)
  ];
  const path = new THREE.CatmullRomCurve3(curvePoints);
  path.tension = 0.5;

  // Main wall tube
  const tubeGeo = new THREE.TubeGeometry(path, 128, 2.2, 16, false);
  const tubeMat = new THREE.MeshStandardMaterial({
    color: 0x22242a,
    metalness: 0.92,
    roughness: 0.35,
    envMapIntensity: 0.8
  });
  const wall = new THREE.Mesh(tubeGeo, tubeMat);
  wall.receiveShadow = true;
  scene.add(wall);

  // Red glowing edge line (thin tube slightly offset outward)
  const edgePath = new THREE.CatmullRomCurve3(curvePoints.map(p => p.clone().add(new THREE.Vector3(-0.3, 0.1, 0)))); // rough offset for visual
  // Instead: just draw a line along original path with thick line look via tube
  const redTubeGeo = new THREE.TubeGeometry(path, 128, 0.08, 8, false);
  const redMat = new THREE.MeshStandardMaterial({
    color: 0xff3333,
    emissive: 0xaa0000,
    emissiveIntensity: 5,
    metalness: 0.9,
    roughness: 0.2
  });
  const redEdge = new THREE.Mesh(redTubeGeo, redMat);
  scene.add(redEdge);

  // Road surface on inside of curve (flat ribbon)
  const roadPoints = [];
  for (let i = 0; i <= 100; i++) {
    const t = i / 100;
    const p = path.getPointAt(t);
    // offset slightly inward (negative normal direction approximation)
    roadPoints.push(new THREE.Vector3(p.x - 1.8, p.y - 0.2, p.z + 0.2));
  }
  const roadCurve = new THREE.CatmullRomCurve3(roadPoints);
  const roadGeo = new THREE.TubeGeometry(roadCurve, 100, 0.35, 10, false);
  const roadMat = new THREE.MeshStandardMaterial({
    color: 0x1a1c22,
    metalness: 0.8,
    roughness: 0.25,
    emissive: 0x111111
  });
  const road = new THREE.Mesh(roadGeo, roadMat);
  scene.add(road);

  // --- CAR (Low Poly style) ---
  const carGroup = new THREE.Group();
  
  // Main body
  const bodyGeo = new THREE.BoxGeometry(1.6, 0.35, 0.75);
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xbbbbcc, metalness: 0.7, roughness: 0.3 });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.set(0, 0.175, 0);
  carGroup.add(body);

  // Cabin / roof
  const cabinGeo = new THREE.BoxGeometry(0.7, 0.25, 0.6);
  const cabinMat = new THREE.MeshStandardMaterial({ color: 0x334455, metalness: 0.6, roughness: 0.4 });
  const cabin = new THREE.Mesh(cabinGeo, cabinMat);
  cabin.position.set(-0.2, 0.45, 0);
  carGroup.add(cabin);

  // Windshield (dark emissive)
  const glassGeo = new THREE.BoxGeometry(0.45, 0.1, 0.55);
  const glassMat = new THREE.MeshStandardMaterial({ color: 0x002233, emissive: 0x001122, emissiveIntensity: 1 });
  const glass = new THREE.Mesh(glassGeo, glassMat);
  glass.position.set(0.35, 0.45, 0);
  carGroup.add(glass);

  // Rear spoiler / diffuser
  const spoofGeo = new THREE.BoxGeometry(1.2, 0.05, 0.8);
  const spoofMat = new THREE.MeshStandardMaterial({ color: 0x111118, metalness: 0.8, roughness: 0.3 });
  const spoof = new THREE.Mesh(spoofGeo, spoofMat);
  spoof.position.set(-0.65, 0.2, 0);
  carGroup.add(spoof);

  // Wheels (simplified)
  const wheelGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.1, 12);
  const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 });
  const wheelPositions = [
    { x: 0.55, y: 0.15, z: 0.32 },
    { x: 0.55, y: 0.15, z: -0.32 },
    { x: -0.55, y: 0.15, z: 0.32 },
    { x: -0.55, y: 0.15, z: -0.32 }
  ];
  for (const pos of wheelPositions) {
    const w = new THREE.Mesh(wheelGeo, wheelMat);
    w.rotation.z = Math.PI / 2;
    w.position.set(pos.x, pos.y, pos.z);
    carGroup.add(w);
  }

  scene.add(carGroup);

  // --- PARTICLES / SMOKE ---
  const smokeCount = 120;
  const smokeGeo = new THREE.BufferGeometry();
  const smokePos = new Float32Array(smokeCount * 3);
  const smokeVel = [];
  for (let i = 0; i < smokeCount * 3; i++) smokePos[i] = 0;
  for (let i = 0; i < smokeCount; i++) {
    smokeVel.push({
      x: (Math.random() - 0.5) * 0.05,
      y: Math.random() * 0.08 + 0.02,
      z: (Math.random() - 0.5) * 0.05
    });
  }
  smokeGeo.setAttribute('position', new THREE.BufferAttribute(smokePos, 3));
  const smokeMat = new THREE.PointsMaterial({
    color: 0xaaaacc,
    size: 0.4,
    transparent: true,
    opacity: 0.7,
    sizeAttenuation: true
  });
  const smoke = new THREE.Points(smokeGeo, smokeMat);
  smoke.position.set(-2, 0.5, 0);
  scene.add(smoke);

  // --- ANIMATION ---
  let t = 0;
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();

    // Update car along curve
    t += 0.0012;
    if (t > 0.92) t = 0; // loop back

    const pt = path.getPointAt(t);
    const tangent = path.getTangentAt(t);

    // Place car on inner side of wall (slightly offset)
    const offset = new THREE.Vector3(-1.6, -0.2, 0.3); // approximate inward
    const carPos = pt.clone().add(offset);

    // FIX: do NOT use Object.assign car.rotation directly.
    // Use lookAt based on tangent.
    carGroup.position.copy(carPos);
    const target = carPos.clone().add(tangent);
    carGroup.lookAt(target);

    // Slight dynamic tilt for "speed"
    carGroup.rotation.z = Math.sin(t * 10) * 0.02;

    // Update smoke
    const posAttr = smokeGeo.attributes.position;
    const arr = posAttr.array;
    for (let i = 0; i < smokeCount; i++) {
      const idx = i * 3;
      arr[idx] += smokeVel[i].x + Math.sin(i) * 0.01;
      arr[idx + 1] += smokeVel[i].y;
      arr[idx + 2] += smokeVel[i].z;
      // Reset when too high
      if (arr[idx + 1] > 3) {
        arr[idx] = -2 + Math.random();
        arr[idx + 1] = 0.2;
        arr[idx + 2] = Math.random() * 0.5;
      }
    }
    posAttr.needsUpdate = true;

    controls.update();
    renderer.render(scene, camera);
  }

  animate();

  // Resize
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
