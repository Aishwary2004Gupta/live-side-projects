<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tesla Roadster — Ramp Suction</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: 'SF Pro Text','Helvetica Neue',Arial,sans-serif; }
  #c { display: block; width: 100%; height: 100%; }
  .t { position: absolute; pointer-events: none; user-select: none; letter-spacing: 0.02em; }
  #vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.85) 100%); }
  #logo { left: 40px; top: 30px; font-size: 11px; letter-spacing: 0.5em; text-transform: uppercase; opacity: .7; }
  #logo b { display: block; font-size: 20px; letter-spacing: .14em; margin-top: 4px; }
  #stat { left: 50%; top: 30px; transform: translateX(-50%); font-size: 12px; letter-spacing: .4em; text-transform: uppercase; opacity: 0; transition: opacity .6s; }
  #big { right: 40px; bottom: 40px; text-align: right; opacity: 0; transition: opacity .8s; }
  #big .v { font-size: 56px; font-weight: 300; line-height: 1; letter-spacing: .04em; }
  #big .v small { font-size: 20px; opacity: .5; margin-left: 8px; }
  #big .l { font-size: 11px; letter-spacing: .5em; text-transform: uppercase; opacity: .5; margin-top: 8px; }
  #big .g { font-size: 18px; margin-top: 14px; font-weight: 300; opacity: .8; }
  #replay { right: 40px; top: 30px; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; opacity: .4; cursor: pointer; pointer-events: auto; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div class="t" id="logo">tesla<b>ROADSTER</b></div>
<div class="t" id="stat">FAN SUCTION ARMED</div>
<div class="t" id="big">
  <div class="v"><span id="kg">0</span><small>kg</small></div>
  <div class="l">Downforce</div>
  <div class="g"><span id="gg">0.0</span> G &middot; <span id="spd">0</span> km/h</div>
</div>
<div class="t" id="replay" onclick="location.reload()">&#8635; replay</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';

/* ---------- renderer ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.Fog(0x000000, 20, 90);

const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 1, 200);
camera.position.set(-42, 14, 6);
camera.lookAt(0, 22, 0);

/* ---------- lights ---------- */
scene.add(new THREE.AmbientLight(0xffffff, 0.04));

const key = new THREE.SpotLight(0xffffff, 1200, 110, 0.35, 0.25, 1.5);
key.position.set(-45, 30, -12);
key.target.position.set(0, 22, 0);
key.castShadow = true;
key.shadow.mapSize.width = 2048;
key.shadow.mapSize.height = 2048;
key.shadow.bias = -0.0005;
scene.add(key, key.target);

const rim = new THREE.SpotLight(0x6fb3ff, 500, 110, 0.5, 0.35, 1.5);
rim.position.set(40, 28, 18);
scene.add(rim);

const fill = new THREE.PointLight(0x2a4a6a, 80, 60);
fill.position.set(-10, 8, 25);
scene.add(fill);

/* ---------- floor ---------- */
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(300, 300),
  new THREE.MeshStandardMaterial({ color: 0x050507, roughness: 1, metalness: 0 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

/* ---------- ramp (curved wall) ---------- */
const R = 30;
const W = 7;
const THETA_MAX = 2.25; // ~129°, past vertical
const SEGS = 300;

function rampPoint(theta) {
  return new THREE.Vector3(R * Math.sin(theta), R * (1 - Math.cos(theta)), 0);
}
function rampNormal(theta) {
  return new THREE.Vector3(-Math.sin(theta), Math.cos(theta), 0);
}

const pos = [], nor = [], uv = [], idx = [];
for (let i = 0; i <= SEGS; i++) {
  const th = (i / SEGS) * THETA_MAX;
  const p = rampPoint(th);
  const n = rampNormal(th);
  for (const z of [-W / 2, W / 2]) {
    pos.push(p.x, p.y, p.z + z);
    nor.push(n.x, n.y, n.z);
    uv.push(i / SEGS, z / W + 0.5);
  }
  if (i < SEGS) {
    const a = i * 2, b = a + 2;
    idx.push(a, a + 1, b + 1, a, b + 1, b);
  }
}
const rampGeo = new THREE.BufferGeometry();
rampGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
rampGeo.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
rampGeo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
rampGeo.setIndex(idx);
const rampMat = new THREE.MeshStandardMaterial({ color: 0x6e6e72, roughness: 0.95, metalness: 0.05 });
const ramp = new THREE.Mesh(rampGeo, rampMat);
ramp.receiveShadow = true;
ramp.castShadow = true;
scene.add(ramp);

// white centre line
{
  const lp = [];
  for (let i = 0; i <= SEGS; i += 2) {
    const th = (i / SEGS) * THETA_MAX;
    const p = rampPoint(th);
    lp.push(p.x, p.y, 0.04);
  }
  const lgeo = new THREE.BufferGeometry();
  lgeo.setAttribute('position', new THREE.Float32BufferAttribute(lp, 3));
  scene.add(new THREE.Line(lgeo, new THREE.LineBasicMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 2 })));
}

// red LED outer edge
{
  const lp = [];
  for (let i = 0; i <= SEGS; i += 2) {
    const th = (i / SEGS) * THETA_MAX;
    const p = rampPoint(th);
    lp.push(p.x, p.y, W / 2 + 0.03);
  }
  const lgeo = new THREE.BufferGeometry();
  lgeo.setAttribute('position', new THREE.Float32BufferAttribute(lp, 3));
  scene.add(new THREE.Line(lgeo, new THREE.LineBasicMaterial({ color: 0xff2222, emissive: 0xff2222, emissiveIntensity: 4 })));
}

// external steel truss on back side of curve
const trMat = new THREE.MeshStandardMaterial({ color: 0x3a3f48, metalness: 0.85, roughness: 0.4 });
const truss = new THREE.Group();
{
  const postGeo = new THREE.BoxGeometry(0.12, 3.4, 0.12);
  for (let i = 0; i <= SEGS; i += 22) {
    const th = (i / SEGS) * THETA_MAX;
    const p = rampPoint(th);
    const back = new THREE.Vector3(Math.sin(th), -Math.cos(th), 0); // outward from surface
    const base = p.clone().addScaledVector(back, 1.4);
    const post = new THREE.Mesh(postGeo, trMat);
    post.position.copy(base).addScaledVector(new THREE.Vector3(0, 1, 0), 1.7);
    truss.add(post);

    if (i > 0) {
      const thPrev = ((i - 22) / SEGS) * THETA_MAX;
      const pPrev = rampPoint(thPrev);
      const backPrev = new THREE.Vector3(Math.sin(thPrev), -Math.cos(thPrev), 0);
      const basePrev = pPrev.clone().addScaledVector(backPrev, 1.4);
      const dir = new THREE.Vector3().subVectors(base, basePrev);
      const len = dir.length();
      const brace = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.07, len), trMat);
      brace.position.copy(basePrev).addScaledVector(dir, 0.5);
      brace.lookAt(base);
      brace.rotateX(Math.PI / 2);
      truss.add(brace);
    }
  }
}
scene.add(truss);

/* ---------- car ---------- */
const car = new THREE.Group();
scene.add(car);

const paint = new THREE.MeshPhysicalMaterial({ color: 0xeceef1, metalness: 0.85, roughness: 0.18, clearcoat: 1, clearcoatRoughness: 0.06 });
const dark = new THREE.MeshStandardMaterial({ color: 0x0a0b0e, metalness: 0.5, roughness: 0.5 });
const glass = new THREE.MeshPhysicalMaterial({ color: 0x05070a, metalness: 0.3, roughness: 0.02, transmission: 0.45, transparent: true, opacity: 0.9 });

const sh = new THREE.Shape();
sh.moveTo(-2.35, 0.3);
sh.lineTo(-2.42, 0.68);
sh.lineTo(-2.12, 0.86);
sh.lineTo(-1.15, 0.92);
sh.quadraticCurveTo(-0.55, 1.34, 0.32, 1.36);
sh.quadraticCurveTo(1.0, 1.32, 1.62, 0.96);
sh.lineTo(2.28, 0.76);
sh.lineTo(2.52, 0.64);
sh.lineTo(2.46, 0.3);
sh.lineTo(-2.35, 0.3);
const bg = new THREE.ExtrudeGeometry(sh, { depth: 1.9, bevelEnabled: true, bevelThickness: 0.14, bevelSize: 0.14, bevelSegments: 5 });
bg.center(); bg.translate(0, 0.82, 0);
const body = new THREE.Mesh(bg, paint);
body.castShadow = true;
car.add(body);

const cab = new THREE.Mesh(new THREE.SphereGeometry(0.95, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), glass);
cab.scale.set(1.45, 0.55, 0.92);
cab.position.set(-0.05, 1.22, 0);
car.add(cab);

const wing = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.05, 2.15), dark);
wing.position.set(-2.15, 1.34, 0);
car.add(wing);
[-0.9, 0.9].forEach(z => {
  const p = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.38, 0.05), dark);
  p.position.set(-2.1, 1, z);
  car.add(p);
});

const wheels = [];
[[1.55, 1.02], [1.55, -1.02], [-1.5, 1.02], [-1.5, -1.02]].forEach(([x, z]) => {
  const w = new THREE.Group();
  const tire = new THREE.Mesh(new THREE.CylinderGeometry(0.37, 0.37, 0.32, 32), new THREE.MeshStandardMaterial({ color: 0x08090a, roughness: 0.9 }));
  tire.rotation.x = Math.PI / 2;
  tire.castShadow = true;
  const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.34, 10), new THREE.MeshStandardMaterial({ color: 0xb9bec5, metalness: 1, roughness: 0.25 }));
  rim.rotation.x = Math.PI / 2;
  w.add(tire, rim);
  w.position.set(x, 0.39, z);
  car.add(w);
  wheels.push(w);
});

[1, -1].forEach(z => {
  const h = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.07, 0.55), new THREE.MeshStandardMaterial({ emissive: 0xdfefff, emissiveIntensity: 4 }));
  h.position.set(2.4, 0.78, z * 0.68);
  car.add(h);
  const t = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.07, 0.75), new THREE.MeshStandardMaterial({ emissive: 0xff1a1a, emissiveIntensity: 4 }));
  t.position.set(-2.41, 0.78, z * 0.62);
  car.add(t);
});

// underbody skirts / seals
const skirtMat = new THREE.MeshStandardMaterial({ color: 0x0d0f12, emissive: 0x1f8cff, emissiveIntensity: 0, roughness: 0.6 });
[[0, 0.9, 4.6, 0.05], [0, -0.9, 4.6, 0.05], [2.3, 0, 0.05, 1.85], [-2.3, 0, 0.05, 1.85]].forEach(([x, z, sx, sz]) => {
  const s = new THREE.Mesh(new THREE.BoxGeometry(sx, 0.26, sz), skirtMat);
  s.position.set(x, 0.2, z);
  car.add(s);
});

// fans
const fans = [];
[-1.2, -0.2, 0.8].forEach(x => {
  const g = new THREE.Group();
  g.position.set(x, 0.24, 0);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.05, 10, 40), dark);
  ring.rotation.x = Math.PI / 2;
  g.add(ring);
  const rotor = new THREE.Group();
  g.add(rotor);
  for (let i = 0; i < 9; i++) {
    const b = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.012, 0.1), new THREE.MeshStandardMaterial({ color: 0xcfd4da, metalness: 1, roughness: 0.2, side: THREE.DoubleSide }));
    b.position.x = 0.24;
    b.rotation.x = 0.55;
    const pv = new THREE.Group();
    pv.rotation.y = (i / 9) * Math.PI * 2;
    pv.add(b);
    rotor.add(pv);
  }
  const glow = new THREE.Mesh(new THREE.CircleGeometry(0.45, 40), new THREE.MeshBasicMaterial({ color: 0x44aaff, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false }));
  glow.rotation.x = Math.PI / 2;
  glow.position.y = -0.03;
  g.add(glow);
  car.add(g);
  fans.push({ g, rotor, glow, spin: 0 });
});

const cavity = new THREE.Mesh(new THREE.BoxGeometry(4.5, 0.24, 1.78), new THREE.MeshBasicMaterial({ color: 0x2d9bff, transparent: true, opacity: 0, depthWrite: false }));
cavity.position.y = 0.16;
car.add(cavity);

// ---------- blue air jet particles ----------
const MAXP = 900;
const pPos = new Float32Array(MAXP * 3);
const pState = [];
for (let i = 0; i < MAXP; i++) pState.push({ life: 0, max: 0, vel: new THREE.Vector3(), active: false });
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const pMat = new THREE.PointsMaterial({ color: 0x6fcbff, size: 0.14, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending });
const particles = new THREE.Points(pGeo, pMat);
car.add(particles);

function spawnJet(index) {
  const s = pState[index];
  s.active = true;
  s.life = 0;
  s.max = 0.35 + Math.random() * 0.45;
  const fan = fans[Math.floor(Math.random() * fans.length)];
  s.vel.set((Math.random() - 0.5) * 0.8, -6 - Math.random() * 4, (Math.random() - 0.5) * 0.8);
}

let jetEmitTimer = 0;

/* ---------- animation state ---------- */
const STOP_THETA = 2.1;
const st = { theta: 0, speed: 0, phase: 0, fan: 0, t: 0, hold: 0 };
const ui = {
  kg: document.getElementById('kg'),
  gg: document.getElementById('gg'),
  spd: document.getElementById('spd'),
  big: document.getElementById('big'),
  stat: document.getElementById('stat')
};

const clock = new THREE.Clock();

function orientCarOnRamp(theta) {
  const p = rampPoint(theta);
  const forward = new THREE.Vector3(Math.cos(theta), Math.sin(theta), 0);
  const up = rampNormal(theta);
  const right = new THREE.Vector3().crossVectors(forward, up);
  const m = new THREE.Matrix4();
  m.makeBasis(forward, up, right);
  m.setPosition(p);
  car.matrix.copy(m);
  car.matrix.decompose(car.position, car.quaternion, car.scale);
}

function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  st.t += dt;

  if (st.phase === 0) {
    st.fan = Math.min(1, st.fan + dt * 0.35);
    st.speed = THREE.MathUtils.lerp(st.speed, 16, dt * 0.9);
    const rem = STOP_THETA - st.theta;
    if (rem < 0.45) st.speed = Math.max(0, st.speed - dt * 10);
    st.theta += st.speed * dt / R;
    if (st.theta >= STOP_THETA) {
      st.theta = STOP_THETA;
      st.speed = 0;
      st.phase = 1;
      ui.big.style.opacity = 1;
    }
    if (st.theta > 0.7) ui.stat.style.opacity = 1;
  } else {
    st.hold += dt;
    st.fan = Math.min(1, st.fan + dt * 0.25);
  }

  orientCarOnRamp(st.theta);
  wheels.forEach(w => w.rotation.z -= st.speed * dt / 0.37);

  const fanPower = st.fan;
  fans.forEach(fn => {
    fn.rotor.rotation.y += fanPower * 50 * dt;
    fn.glow.material.opacity = fanPower * (0.3 + 0.12 * Math.sin(st.t * 24));
  });
  skirtMat.emissiveIntensity = fanPower * 2.0;
  cavity.material.opacity = fanPower * 0.25;

  // blue downward jets when stuck at top
  if (st.phase === 1 && fanPower > 0.3) {
    jetEmitTimer += dt;
    while (jetEmitTimer > 0.03) {
      jetEmitTimer -= 0.03;
      const free = pState.findIndex(s => !s.active);
      if (free !== -1) spawnJet(free);
    }
  }

  let active = 0;
  for (let i = 0; i < MAXP; i++) {
    const s = pState[i];
    if (!s.active) continue;
    const idx3 = i * 3;
    pPos[idx3] += s.vel.x * dt;
    pPos[idx3 + 1] += s.vel.y * dt;
    pPos[idx3 + 2] += s.vel.z * dt;
    s.vel.y += 14 * dt;
    s.life += dt;
    if (s.life >= s.max) s.active = false;
    else active++;
  }
  pGeo.attributes.position.needsUpdate = true;
  pMat.opacity = active > 0 ? Math.min(0.8, active / MAXP * 3) : 0;

  // HUD physics
  const suction = 4700 * fanPower;
  const up = rampNormal(st.theta);
  const gravityComponent = 1900 * 9.81 * up.dot(new THREE.Vector3(0, 1, 0));
  const normalLoad = suction + gravityComponent;
  const gForce = Math.max(0, normalLoad) / (1900 * 9.81);

  ui.kg.textContent = Math.round(suction).toLocaleString();
  ui.gg.textContent = gForce.toFixed(1);
  ui.spd.textContent = Math.round(st.speed * 3.6);
  ui.stat.textContent = st.phase === 0 ? 'FAN SUCTION ARMED' : 'STATIONARY · INVERTED · HELD BY ATMOSPHERIC PRESSURE';

  // slow cinematic camera drift
  const targetCam = new THREE.Vector3(-42 + Math.sin(st.t * 0.05) * 2, 14 + Math.sin(st.t * 0.07) * 1, 6 + Math.cos(st.t * 0.04) * 1);
  camera.position.lerp(targetCam, 1 - Math.pow(0.02, dt));
  camera.lookAt(car.position.clone().add(new THREE.Vector3(0, 6, 0)));

  renderer.render(scene, camera);
}

loop();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
