<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Flying Roadster — Wall Climb & Kickflip</title>

<style>
  @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap");

  :root{
    color-scheme:dark;
    --white:#f4f4f2;
    --muted:rgba(255,255,255,.48);
    --line:rgba(255,255,255,.13);
    --panel:rgba(12,12,14,.68);
  }

  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:var(--white);
    font-family:Inter,system-ui,sans-serif;
  }

  button{font:inherit}

  #c{
    display:block;
    width:100%;
    height:100%;
    touch-action:none;
  }

  #vignette,
  #grain,
  #cut{
    position:fixed;
    inset:0;
    pointer-events:none;
  }

  #vignette{
    z-index:3;
    background:
      radial-gradient(circle at 52% 45%,transparent 30%,rgba(0,0,0,.18) 62%,rgba(0,0,0,.8) 110%),
      linear-gradient(to bottom,rgba(0,0,0,.16),transparent 20%,transparent 76%,rgba(0,0,0,.42));
  }

  #grain{
    z-index:4;
    opacity:.075;
    mix-blend-mode:soft-light;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.84' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.65'/%3E%3C/svg%3E");
  }

  #cut{
    z-index:30;
    background:#000;
    opacity:0;
    transition:opacity .24s ease;
  }

  #cut.on{opacity:1}

  .ui{
    position:fixed;
    inset:0;
    z-index:10;
    pointer-events:none;
    user-select:none;
  }

  .top{
    position:absolute;
    top:0;
    left:0;
    right:0;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    padding:24px 30px;
  }

  .brand{
    font-family:"Space Grotesk",sans-serif;
    font-size:15px;
    font-weight:600;
    letter-spacing:.22em;
    white-space:nowrap;
  }

  .brand span{
    display:block;
    margin-top:4px;
    color:rgba(255,255,255,.42);
    font-family:Inter,sans-serif;
    font-size:9px;
    font-weight:500;
    letter-spacing:.38em;
  }

  .mode-switch{
    pointer-events:auto;
    display:flex;
    padding:4px;
    gap:3px;
    border:1px solid var(--line);
    border-radius:999px;
    background:rgba(10,10,12,.7);
    box-shadow:0 12px 45px rgba(0,0,0,.4);
    backdrop-filter:blur(20px);
  }

  .mode{
    min-width:126px;
    padding:10px 20px;
    border:0;
    border-radius:999px;
    background:transparent;
    color:rgba(255,255,255,.45);
    font-size:11px;
    font-weight:600;
    letter-spacing:.1em;
    text-transform:uppercase;
    cursor:pointer;
    transition:background .25s,color .25s,transform .2s;
  }

  .mode:hover{
    color:#fff;
    transform:translateY(-1px);
  }

  .mode.active{
    background:#f4f4f2;
    color:#050505;
  }

  .top-right{
    justify-self:end;
    display:flex;
    align-items:center;
    gap:15px;
  }

  .live{
    display:flex;
    align-items:center;
    gap:8px;
    color:rgba(255,255,255,.4);
    font-size:9px;
    font-weight:600;
    letter-spacing:.22em;
    text-transform:uppercase;
  }

  .live::before{
    content:"";
    width:5px;
    height:5px;
    border-radius:50%;
    background:#58baff;
    box-shadow:0 0 12px #369cff;
  }

  #replay{
    pointer-events:auto;
    width:37px;
    height:37px;
    border:1px solid var(--line);
    border-radius:50%;
    background:rgba(10,10,12,.58);
    color:rgba(255,255,255,.7);
    font-size:17px;
    cursor:pointer;
    backdrop-filter:blur(18px);
    transition:background .2s,color .2s,transform .2s;
  }

  #replay:hover{
    color:#fff;
    background:rgba(255,255,255,.1);
    transform:rotate(-20deg);
  }

  .bottom{
    position:absolute;
    left:30px;
    right:30px;
    bottom:28px;
    display:grid;
    grid-template-columns:minmax(270px,440px) 1fr auto;
    align-items:end;
    gap:38px;
  }

  .copy .number{
    color:rgba(255,255,255,.38);
    font-family:"Space Grotesk",sans-serif;
    font-size:10px;
    font-weight:600;
    letter-spacing:.25em;
  }

  .copy h1{
    margin:8px 0 8px;
    font-family:"Space Grotesk",sans-serif;
    font-size:clamp(28px,3.1vw,50px);
    font-weight:500;
    letter-spacing:-.045em;
    line-height:.94;
  }

  .copy p{
    max-width:410px;
    margin:0;
    color:rgba(255,255,255,.5);
    font-size:12px;
    line-height:1.65;
  }

  .timeline{
    align-self:end;
    padding-bottom:5px;
  }

  .timeline-top{
    display:flex;
    justify-content:space-between;
    margin-bottom:9px;
    color:rgba(255,255,255,.38);
    font-size:9px;
    font-weight:600;
    letter-spacing:.2em;
    text-transform:uppercase;
  }

  .timeline-track{
    height:1px;
    overflow:hidden;
    background:rgba(255,255,255,.18);
  }

  #progress{
    width:100%;
    height:100%;
    background:#fff;
    transform:scaleX(0);
    transform-origin:left center;
  }

  .stats{
    display:flex;
    gap:29px;
    align-items:flex-end;
  }

  .stat{
    min-width:88px;
    text-align:right;
  }

  .value-row{
    display:flex;
    justify-content:flex-end;
    align-items:baseline;
    gap:5px;
    white-space:nowrap;
  }

  .value{
    font-family:"Space Grotesk",sans-serif;
    font-size:30px;
    font-weight:500;
    letter-spacing:-.05em;
    font-variant-numeric:tabular-nums;
  }

  .unit{
    color:rgba(255,255,255,.45);
    font-size:10px;
  }

  .label{
    margin-top:5px;
    color:rgba(255,255,255,.35);
    font-size:8px;
    font-weight:600;
    letter-spacing:.2em;
    text-transform:uppercase;
  }

  @media(max-width:800px){
    .top{
      grid-template-columns:1fr auto;
      padding:18px;
    }

    .mode-switch{
      position:absolute;
      top:72px;
      left:50%;
      transform:translateX(-50%);
    }

    .mode{
      min-width:108px;
      padding:9px 13px;
      font-size:9px;
    }

    .live{display:none}

    .bottom{
      left:18px;
      right:18px;
      bottom:18px;
      grid-template-columns:1fr auto;
      gap:18px;
    }

    .copy p,
    .timeline{
      display:none;
    }

    .copy h1{
      font-size:30px;
    }

    .stats{
      gap:15px;
    }

    .stat:nth-child(2){
      display:none;
    }

    .value{
      font-size:25px;
    }
  }
</style>
</head>

<body>
<canvas id="c"></canvas>

<div id="vignette"></div>
<div id="grain"></div>
<div id="cut"></div>

<div class="ui">
  <header class="top">
    <div class="brand">
      ROADSTER
      <span>FAN SUCTION SYSTEM</span>
    </div>

    <nav class="mode-switch" aria-label="Stunt selection">
      <button class="mode active" data-mode="wall">Wall Climb</button>
      <button class="mode" data-mode="kickflip">Kickflip</button>
    </nav>

    <div class="top-right">
      <div class="live">Realtime simulation</div>
      <button id="replay" aria-label="Replay">↻</button>
    </div>
  </header>

  <footer class="bottom">
    <section class="copy">
      <div class="number" id="sceneNumber">01 / STUNT</div>
      <h1 id="sceneTitle">Wall Climb</h1>
      <p id="sceneDescription">
        The sealed underbody creates enough pressure differential to pin the
        Roadster to the ramp beyond vertical.
      </p>
    </section>

    <section class="timeline">
      <div class="timeline-top">
        <span id="status">Fan system starting</span>
        <span id="stage">01</span>
      </div>
      <div class="timeline-track">
        <div id="progress"></div>
      </div>
    </section>

    <section class="stats">
      <div class="stat">
        <div class="value-row">
          <span class="value" id="force">0</span>
          <span class="unit">kg</span>
        </div>
        <div class="label">Downforce</div>
      </div>

      <div class="stat">
        <div class="value-row">
          <span class="value" id="grip">0.0</span>
          <span class="unit">G</span>
        </div>
        <div class="label">Fan grip</div>
      </div>

      <div class="stat">
        <div class="value-row">
          <span class="value" id="speed">0</span>
          <span class="unit">km/h</span>
        </div>
        <div class="label">Velocity</div>
      </div>
    </section>
  </footer>
</div>

<script type="importmap">
{
  "imports":{
    "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
  }

</script>

<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

/* -------------------------------------------------------
   Configuration
------------------------------------------------------- */

const MOBILE =
  matchMedia("(max-width: 800px)").matches ||
  /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

const CAR_MODEL_URL =
  "https://threejs.org/examples/models/gltf/ferrari.glb";

const ROAD_WIDTH = 5.4;
const ROAD_THICKNESS = 0.42;
const CAR_MASS = 1900;
const MAX_FAN_FORCE = 4700;
const GROUND_Y = 0.025;

const canvas = document.querySelector("#c");
const cut = document.querySelector("#cut");

const ui = {
  title: document.querySelector("#sceneTitle"),
  number: document.querySelector("#sceneNumber"),
  description: document.querySelector("#sceneDescription"),
  status: document.querySelector("#status"),
  stage: document.querySelector("#stage"),
  progress: document.querySelector("#progress"),
  force: document.querySelector("#force"),
  grip: document.querySelector("#grip"),
  speed: document.querySelector("#speed"),
  replay: document.querySelector("#replay"),
  modeButtons: [...document.querySelectorAll(".mode")]
};

/* -------------------------------------------------------
   Renderer and postprocessing
------------------------------------------------------- */

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: !MOBILE,
  powerPreference: "high-performance",
  stencil: false
});

let renderDpr = Math.min(devicePixelRatio, MOBILE ? 1.25 : 1.75);

renderer.setPixelRatio(renderDpr);
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.009);

const camera = new THREE.PerspectiveCamera(
  MOBILE ? 42 : 35,
  innerWidth / innerHeight,
  0.1,
  300
);

const pmrem = new THREE.PMREMGenerator(renderer);
const environmentTarget = pmrem.fromScene(new RoomEnvironment(), 0.03);
scene.environment = environmentTarget.texture;
pmrem.dispose();

const composer = new EffectComposer(renderer);
composer.setPixelRatio(renderDpr);
composer.setSize(innerWidth, innerHeight);

const renderPass = new RenderPass(scene, camera);
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  MOBILE ? 0.42 : 0.62,
  0.48,
  0.83
);
const outputPass = new OutputPass();

composer.addPass(renderPass);
composer.addPass(bloomPass);
composer.addPass(outputPass);

/* -------------------------------------------------------
   Reusable math objects
------------------------------------------------------- */

const WORLD_UP = new THREE.Vector3(0, 1, 0);
const LOCAL_X = new THREE.Vector3(1, 0, 0);

const tempV1 = new THREE.Vector3();
const tempV2 = new THREE.Vector3();
const tempV3 = new THREE.Vector3();
const tempV4 = new THREE.Vector3();
const cameraGoal = new THREE.Vector3();
const cameraTargetGoal = new THREE.Vector3();
const cameraPosition = new THREE.Vector3();
const cameraTarget = new THREE.Vector3();
const tempMatrix = new THREE.Matrix4();
const tempQuat = new THREE.Quaternion();
const baseQuat = new THREE.Quaternion();
const rollQuat = new THREE.Quaternion();

const clamp01 = value => Math.max(0, Math.min(1, value));

function smooth01(value) {
  value = clamp01(value);
  return value * value * (3 - 2 * value);
}

function smoother01(value) {
  value = clamp01(value);
  return value * value * value * (value * (value * 6 - 15) + 10);
}

function damp(current, target, lambda, dt) {
  return THREE.MathUtils.lerp(current, target, 1 - Math.exp(-lambda * dt));
}

function dampVector(current, target, lambda, dt) {
  current.lerp(target, 1 - Math.exp(-lambda * dt));
}

function cubicBezier(a, b, c, d, t, out) {
  const it = 1 - t;
  const b0 = it * it * it;
  const b1 = 3 * it * it * t;
  const b2 = 3 * it * t * t;
  const b3 = t * t * t;

  out.set(0, 0, 0)
    .addScaledVector(a, b0)
    .addScaledVector(b, b1)
    .addScaledVector(c, b2)
    .addScaledVector(d, b3);

  return out;
}

function cubicDerivative(a, b, c, d, t, out) {
  const it = 1 - t;

  out.copy(b).sub(a).multiplyScalar(3 * it * it);
  out.addScaledVector(tempV3.copy(c).sub(b), 6 * it * t);
  out.addScaledVector(tempV4.copy(d).sub(c), 3 * t * t);

  return out;
}

/* -------------------------------------------------------
   Lighting
------------------------------------------------------- */

scene.add(new THREE.HemisphereLight(0x65758e, 0x050505, 0.18));

const keyLight = new THREE.SpotLight(
  0xfff4e8,
  MOBILE ? 1300 : 1900,
  125,
  0.43,
  0.72,
  1.45
);

keyLight.position.set(18, 41, 27);
keyLight.target.position.set(5, 15, 0);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(MOBILE ? 512 : 1024, MOBILE ? 512 : 1024);
keyLight.shadow.camera.near = 4;
keyLight.shadow.camera.far = 105;
keyLight.shadow.bias = -0.0002;
keyLight.shadow.normalBias = 0.025;

scene.add(keyLight, keyLight.target);

const coolRim = new THREE.SpotLight(
  0x8bbcff,
  620,
  110,
  0.56,
  0.82,
  1.5
);

coolRim.position.set(-27, 20, -23);
coolRim.target.position.set(3, 15, 0);
scene.add(coolRim, coolRim.target);

const rampWash = new THREE.SpotLight(
  0xe7efff,
  740,
  90,
  0.48,
  0.82,
  1.5
);

rampWash.position.set(-4, 4, 18);
rampWash.target.position.set(8, 18, 0);
scene.add(rampWash, rampWash.target);

const warmFill = new THREE.PointLight(0xffc99e, 70, 55, 2);
warmFill.position.set(-12, 3, 15);
scene.add(warmFill);

/* -------------------------------------------------------
   Stage and event lights
------------------------------------------------------- */

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0x050506,
  roughness: 0.82,
  metalness: 0.12
});

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(220, 170),
  floorMaterial
);

floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.025;
floor.receiveShadow = true;
scene.add(floor);

const groundLine = new THREE.Mesh(
  new THREE.PlaneGeometry(42, 0.11),
  new THREE.MeshBasicMaterial({
    color: 0xff2d24,
    transparent: true,
    opacity: 0.82,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
);

groundLine.rotation.x = -Math.PI / 2;
groundLine.position.set(-24, 0.018, 7.3);
scene.add(groundLine);

const stageLightGeometry = new THREE.SphereGeometry(0.035, 8, 6);
const stageLightMaterial = new THREE.MeshBasicMaterial({ color: 0xd8ecff });
const stageLights = new THREE.InstancedMesh(
  stageLightGeometry,
  stageLightMaterial,
  24
);

for (let i = 0; i < 24; i++) {
  const x = -37 + i * 3.4;
  const y = 0.17 + Math.random() * 0.18;
  const z = i % 2 ? -10 : 11;

  tempMatrix.makeTranslation(x, y, z);
  stageLights.setMatrixAt(i, tempMatrix);
}

stageLights.instanceMatrix.needsUpdate = true;
scene.add(stageLights);

/* -------------------------------------------------------
   Ramp path
------------------------------------------------------- */

const rampCurve = new THREE.CatmullRomCurve3(
  [
    new THREE.Vector3(-25, 0.03, 0),
    new THREE.Vector3(-15, 0.03, 0),
    new THREE.Vector3(-5, 0.08, 0),
    new THREE.Vector3(3.8, 1.05, 0),
    new THREE.Vector3(10.8, 5.5, 0),
    new THREE.Vector3(13.6, 12.3, 0),
    new THREE.Vector3(13.0, 19.5, 0),
    new THREE.Vector3(10.5, 25.0, 0),
    new THREE.Vector3(6.5, 29.3, 0),
    new THREE.Vector3(2.0, 32.0, 0)
  ],
  false,
  "catmullrom",
  0.12
);

const RAMP_LENGTH = rampCurve.getLength();

function createFrame() {
  return {
    p: new THREE.Vector3(),
    t: new THREE.Vector3(),
    u: new THREE.Vector3(),
    r: new THREE.Vector3()
  };
}

function sampleFrame(distance, out) {
  const normalized = clamp01(distance / RAMP_LENGTH);

  rampCurve.getPointAt(normalized, out.p);
  rampCurve.getTangentAt(normalized, out.t).normalize();

  out.u.set(-out.t.y, out.t.x, 0).normalize();
  out.r.crossVectors(out.t, out.u).normalize();

  return out;
}

function frameQuaternion(frame, out) {
  tempMatrix.makeBasis(frame.t, frame.u, frame.r);
  return out.setFromRotationMatrix(tempMatrix);
}

/* -------------------------------------------------------
   Concrete texture
------------------------------------------------------- */

function createConcreteTexture() {
  const textureCanvas = document.createElement("canvas");
  textureCanvas.width = 512;
  textureCanvas.height = 1024;

  const context = textureCanvas.getContext("2d");
  const image = context.createImageData(512, 1024);

  for (let i = 0; i < image.data.length; i += 4) {
    const coarse = Math.sin(i * 0.00047) * 7;
    const noise = (Math.random() - 0.5) * 24 + coarse;
    const base = 132 + noise;

    image.data[i] = base;
    image.data[i + 1] = base + 2;
    image.data[i + 2] = base + 5;
    image.data[i + 3] = 255;
  }

  context.putImageData(image, 0, 0);

  context.strokeStyle = "rgba(25,27,30,.28)";
  context.lineWidth = 2;

  for (let y = 0; y <= 1024; y += 86) {
    context.beginPath();
    context.moveTo(0, y);
    context.lineTo(512, y);
    context.stroke();
  }

  context.strokeStyle = "rgba(230,235,240,.17)";
  context.lineWidth = 1;

  for (const x of [8, 128, 256, 384, 504]) {
    context.beginPath();
    context.moveTo(x, 0);
    context.lineTo(x, 1024);
    context.stroke();
  }

  context.fillStyle = "rgba(228,234,238,.78)";
  context.fillRect(251, 0, 10, 1024);

  const texture = new THREE.CanvasTexture(textureCanvas);
  texture.wrapS = THREE.ClampToEdgeWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());

  return texture;
}

const concreteTexture = createConcreteTexture();

/* -------------------------------------------------------
   Ramp geometry
------------------------------------------------------- */

function buildRamp() {
  const segments = MOBILE ? 180 : 260;
  const frame = createFrame();

  const positions = [];
  const normals = [];
  const uvs = [];
  const indices = [];

  for (let i = 0; i <= segments; i++) {
    const distance = i / segments * RAMP_LENGTH;
    sampleFrame(distance, frame);

    for (const side of [-1, 1]) {
      positions.push(
        frame.p.x + frame.r.x * side * ROAD_WIDTH * 0.5,
        frame.p.y + frame.r.y * side * ROAD_WIDTH * 0.5,
        frame.p.z + frame.r.z * side * ROAD_WIDTH * 0.5
      );

      normals.push(frame.u.x, frame.u.y, frame.u.z);
      uvs.push(side * 0.5 + 0.5, distance / 18);
    }

    if (i < segments) {
      const a = i * 2;
      indices.push(
        a, a + 1, a + 2,
        a + 1, a + 3, a + 2
      );
    }
  }

  const roadGeometry = new THREE.BufferGeometry();
  roadGeometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(positions, 3)
  );
  roadGeometry.setAttribute(
    "normal",
    new THREE.Float32BufferAttribute(normals, 3)
  );
  roadGeometry.setAttribute(
    "uv",
    new THREE.Float32BufferAttribute(uvs, 2)
  );
  roadGeometry.setIndex(indices);
  roadGeometry.computeBoundingSphere();

  const roadMaterial = new THREE.MeshStandardMaterial({
    map: concreteTexture,
    color: 0xb2b4b6,
    roughness: 0.72,
    metalness: 0.08,
    side: THREE.DoubleSide
  });

  const road = new THREE.Mesh(roadGeometry, roadMaterial);
  road.castShadow = true;
  road.receiveShadow = true;
  scene.add(road);

  /* Underside */

  const undersidePositions = [];
  const undersideNormals = [];
  const undersideIndices = [];

  for (let i = 0; i <= segments; i++) {
    const distance = i / segments * RAMP_LENGTH;
    sampleFrame(distance, frame);

    for (const side of [-1, 1]) {
      undersidePositions.push(
        frame.p.x +
          frame.r.x * side * ROAD_WIDTH * 0.5 -
          frame.u.x * ROAD_THICKNESS,

        frame.p.y +
          frame.r.y * side * ROAD_WIDTH * 0.5 -
          frame.u.y * ROAD_THICKNESS,

        frame.p.z +
          frame.r.z * side * ROAD_WIDTH * 0.5 -
          frame.u.z * ROAD_THICKNESS
      );

      undersideNormals.push(-frame.u.x, -frame.u.y, -frame.u.z);
    }

    if (i < segments) {
      const a = i * 2;
      undersideIndices.push(
        a, a + 2, a + 1,
        a + 1, a + 2, a + 3
      );
    }
  }

  const undersideGeometry = new THREE.BufferGeometry();
  undersideGeometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(undersidePositions, 3)
  );
  undersideGeometry.setAttribute(
    "normal",
    new THREE.Float32BufferAttribute(undersideNormals, 3)
  );
  undersideGeometry.setIndex(undersideIndices);

  const underside = new THREE.Mesh(
    undersideGeometry,
    new THREE.MeshStandardMaterial({
      color: 0x272a2f,
      roughness: 0.62,
      metalness: 0.48,
      side: THREE.DoubleSide
    })
  );

  underside.castShadow = true;
  scene.add(underside);

  /* Side slabs */

  const sidePositions = [];
  const sideIndices = [];

  for (const side of [-1, 1]) {
    const base = sidePositions.length / 3;

    for (let i = 0; i <= segments; i++) {
      const distance = i / segments * RAMP_LENGTH;
      sampleFrame(distance, frame);

      const x =
        frame.p.x + frame.r.x * side * ROAD_WIDTH * 0.5;
      const y =
        frame.p.y + frame.r.y * side * ROAD_WIDTH * 0.5;
      const z =
        frame.p.z + frame.r.z * side * ROAD_WIDTH * 0.5;

      sidePositions.push(x, y, z);

      sidePositions.push(
        x - frame.u.x * ROAD_THICKNESS,
        y - frame.u.y * ROAD_THICKNESS,
        z - frame.u.z * ROAD_THICKNESS
      );
    }

    for (let i = 0; i < segments; i++) {
      const a = base + i * 2;
      sideIndices.push(
        a, a + 1, a + 2,
        a + 1, a + 3, a + 2
      );
    }
  }

  const sideGeometry = new THREE.BufferGeometry();
  sideGeometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(sidePositions, 3)
  );
  sideGeometry.setIndex(sideIndices);
  sideGeometry.computeVertexNormals();

  const sideMesh = new THREE.Mesh(
    sideGeometry,
    new THREE.MeshStandardMaterial({
      color: 0x555a60,
      roughness: 0.5,
      metalness: 0.5,
      side: THREE.DoubleSide
    })
  );

  sideMesh.castShadow = true;
  scene.add(sideMesh);

  /* Illuminated edges */

  const ledMaterial = new THREE.MeshStandardMaterial({
    color: 0xff160e,
    emissive: 0xff160e,
    emissiveIntensity: 7,
    roughness: 0.3,
    metalness: 0.35
  });

  const railMaterial = new THREE.MeshStandardMaterial({
    color: 0x181b20,
    roughness: 0.35,
    metalness: 0.9
  });

  for (const side of [-1, 1]) {
    const railPoints = [];
    const ledPoints = [];

    for (let i = 0; i <= 90; i++) {
      sampleFrame(i / 90 * RAMP_LENGTH, frame);

      const point = frame.p.clone()
        .addScaledVector(frame.r, side * (ROAD_WIDTH * 0.5 + 0.04))
        .addScaledVector(frame.u, 0.035);

      ledPoints.push(point);

      railPoints.push(
        point.clone().addScaledVector(frame.u, -0.12)
      );
    }

    scene.add(
      new THREE.Mesh(
        new THREE.TubeGeometry(
          new THREE.CatmullRomCurve3(railPoints),
          100,
          0.105,
          7,
          false
        ),
        railMaterial
      )
    );

    scene.add(
      new THREE.Mesh(
        new THREE.TubeGeometry(
          new THREE.CatmullRomCurve3(ledPoints),
          100,
          0.035,
          6,
          false
        ),
        ledMaterial
      )
    );
  }

  /* Low-cost red light spill */

  for (let i = 0; i < 5; i++) {
    sampleFrame((0.22 + i * 0.17) * RAMP_LENGTH, frame);

    const light = new THREE.PointLight(0xff291e, 13, 9, 2);
    light.position.copy(frame.p)
      .addScaledVector(frame.u, 0.35)
      .addScaledVector(frame.r, ROAD_WIDTH * 0.5);

    scene.add(light);
  }
}

/* -------------------------------------------------------
   Instanced steel truss
------------------------------------------------------- */

function buildTruss() {
  const beams = [];
  const frame = createFrame();

  function addBeam(a, b, width = 0.12) {
    beams.push({
      a: a.clone(),
      b: b.clone(),
      width
    });
  }

  const sideNodes = [[], []];
  const nodeCount = MOBILE ? 16 : 22;

  for (let sideIndex = 0; sideIndex < 2; sideIndex++) {
    const side = sideIndex === 0 ? -1 : 1;

    for (let i = 0; i <= nodeCount; i++) {
      const normalized = 0.31 + i / nodeCount * 0.69;
      sampleFrame(normalized * RAMP_LENGTH, frame);

      const front = frame.p.clone()
        .addScaledVector(frame.r, side * (ROAD_WIDTH * 0.5 + 0.18))
        .addScaledVector(frame.u, -0.28);

      const back = front.clone()
        .addScaledVector(frame.u, -2.7)
        .addScaledVector(frame.r, side * 0.22);

      sideNodes[sideIndex].push({ front, back });

      addBeam(front, back, 0.13);

      if (i > 0) {
        const previous = sideNodes[sideIndex][i - 1];

        addBeam(previous.back, back, 0.16);
        addBeam(previous.front, front, 0.1);

        if (i % 2) {
          addBeam(previous.front, back, 0.095);
        } else {
          addBeam(previous.back, front, 0.095);
        }
      }

      if (i > 2 && i % 4 === 0 && back.y > 3) {
        const ground = new THREE.Vector3(back.x, 0, back.z);
        addBeam(back, ground, 0.16);
      }
    }
  }

  for (let i = 0; i <= nodeCount; i += 2) {
    addBeam(
      sideNodes[0][i].back,
      sideNodes[1][i].back,
      0.11
    );
  }

  const beamGeometry = new THREE.BoxGeometry(1, 1, 1);
  const beamMaterial = new THREE.MeshStandardMaterial({
    color: 0x3d434b,
    roughness: 0.36,
    metalness: 0.9
  });

  const instancedBeams = new THREE.InstancedMesh(
    beamGeometry,
    beamMaterial,
    beams.length
  );

  const direction = new THREE.Vector3();
  const midpoint = new THREE.Vector3();
  const scale = new THREE.Vector3();
  const quaternion = new THREE.Quaternion();

  beams.forEach((beam, index) => {
    direction.copy(beam.b).sub(beam.a);
    const length = direction.length();

    midpoint.copy(beam.a).add(beam.b).multiplyScalar(0.5);

    quaternion.setFromUnitVectors(
      WORLD_UP,
      direction.normalize()
    );

    scale.set(beam.width, length, beam.width);

    tempMatrix.compose(midpoint, quaternion, scale);
    instancedBeams.setMatrixAt(index, tempMatrix);
  });

  instancedBeams.instanceMatrix.needsUpdate = true;
  instancedBeams.receiveShadow = true;
  instancedBeams.frustumCulled = true;

  scene.add(instancedBeams);
}

    const initialBox = new THREE.Box3().setFromObject(model);
    const initialSize = initialBox.getSize(new THREE.Vector3());

    if (initialSize.z > initialSize.x) {
      model.rotation.y = Math.PI / 2;
    }

    model.updateMatrixWorld(true);

    const rotatedBox = new THREE.Box3().setFromObject(model);
    const rotatedSize = rotatedBox.getSize(new THREE.Vector3());
    const horizontalLength = Math.max(rotatedSize.x, rotatedSize.z);
    const scale = 4.65 / horizontalLength;

    model.scale.setScalar(scale);
    model.updateMatrixWorld(true);

    const scaledBox = new THREE.Box3().setFromObject(model);
    const center = scaledBox.getCenter(new THREE.Vector3());

    model.position.x -= center.x;
    model.position.z -= center.z;
    model.position.y -= scaledBox.min.y - 0.035;

    model.traverse(object => {
      if (!object.isMesh) return;

      object.castShadow = !MOBILE;
      object.receiveShadow = true;

      const name = `${object.name} ${object.material?.name || ""}`.toLowerCase();

      if (/body|paint|carpaint/.test(name)) {
        object.material = paintMaterial;
      } else if (/glass|window|windscreen/.test(name)) {
        object.material = glassMaterial;

        object.material = object.material.clone();
        object.material.envMapIntensity = 1.2;
      }
    });

    modelHost.add(model);
    fallbackCar.visible = false;

  undefined,
  () => {

);

function createSmokeTexture() {
  const smokeCanvas = document.createElement("canvas");
  smokeCanvas.width = 128;
  smokeCanvas.height = 128;

  const context = smokeCanvas.getContext("2d");
  const gradient = context.createRadialGradient(
    64, 64, 4,
    64, 64, 62
  );

  gradient.addColorStop(0, "rgba(255,255,255,.9)");
  gradient.addColorStop(0.28, "rgba(230,240,248,.65)");
  gradient.addColorStop(0.62, "rgba(180,195,208,.2)");
  gradient.addColorStop(1, "rgba(120,135,150,0)");

  context.fillStyle = gradient;
  context.fillRect(0, 0, 128, 128);

  const texture = new THREE.CanvasTexture(smokeCanvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}

  uniforms: {

    uViewport: { value: innerHeight * renderDpr },
    uColor: { value: new THREE.Color(0xb8c6d2) }
  },

  vertexShader: `
    attribute float aSize;
    attribute float aAlpha;

    uniform float uViewport;

    varying float vAlpha;

    void main() {
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);

      gl_Position = projectionMatrix * mvPosition;
      gl_PointSize = clamp(
        aSize * uViewport / max(1.0, -mvPosition.z),
        1.0,
        190.0
      );

      vAlpha = aAlpha;
    }
  `,

  fragmentShader: `
    uniform sampler2D uMap;
    uniform vec3 uColor;

    varying float vAlpha;

    void main() {
      vec4 sprite = texture2D(uMap, gl_PointCoord);
      float alpha = sprite.a * vAlpha;

      if (alpha < 0.01) discard;

      gl_FragColor = vec4(uColor, alpha);
    }
  `,

  transparent: true,
  depthWrite: false,
  blending: THREE.NormalBlending
});

const smoke = new THREE.Points(smokeGeometry, smokeMaterial);
smoke.frustumCulled = false;
scene.add(smoke);

function emitSmoke(origin, count, strength = 1) {
  for (let n = 0; n < count; n++) {
    const index = smokeCursor++ % SMOKE_COUNT;
    const particle = smokeData[index];

    const angle = Math.random() * Math.PI * 2;
    const radius = Math.sqrt(Math.random()) * 1.35 * strength;

    smokePositions[index * 3] =
      origin.x + Math.cos(angle) * radius;

    smokePositions[index * 3 + 1] =
      origin.y + Math.random() * 0.2;

    smokePositions[index * 3 + 2] =
      origin.z + Math.sin(angle) * radius;

    particle.active = true;
    particle.age = 0;
    particle.life = 1.1 + Math.random() * 1.8;
    particle.baseSize = 0.48 + Math.random() * 0.75;

    particle.velocity.set(
      Math.cos(angle) * (0.45 + Math.random() * 1.5) * strength,
      0.6 + Math.random() * 1.45,
      Math.sin(angle) * (0.45 + Math.random() * 1.5) * strength
    );
  }
}

function clearSmoke() {
  for (let i = 0; i < SMOKE_COUNT; i++) {
    smokeData[i].active = false;
    smokeAlphas[i] = 0;
    smokePositions[i * 3 + 1] = -50;
  }
}

/* -------------------------------------------------------
   Animation state
------------------------------------------------------- */

const currentFrame = createFrame();
const launchFrame = createFrame();

const launchP0 = new THREE.Vector3();
const launchP1 = new THREE.Vector3();
const launchP2 = new THREE.Vector3();
const launchP3 = new THREE.Vector3();

const launchQuaternion = new THREE.Quaternion();
const landingQuaternion = new THREE.Quaternion();

const state = {
  mode: "wall",
  phase: "run",

  elapsed: 0,
  phaseTime: 0,

  s: 0,
  speed: 0,
  displaySpeed: 0,

  fan: 0,
  jet: 0,
  sideJet: 0,

  hold: 0,
  flight: 0,
  flightDuration: 3.8,

  landingTime: 0,
  landingSpeed: 0,

  wheelDistance: 0,
  progress: 0
};

function spinWheels(distance) {
  const angle = distance / 0.355;

  for (const wheel of fallbackWheels) {
    wheel.rotation.z -= angle;
  }
}

function placeOnRamp(distance) {
  sampleFrame(distance, currentFrame);
  frameQuaternion(currentFrame, car.quaternion);
  car.position.copy(currentFrame.p);
}

function prepareLaunch() {
  sampleFrame(RAMP_LENGTH, launchFrame);
  frameQuaternion(launchFrame, launchQuaternion);

  launchP0.copy(launchFrame.p);

  launchP1.copy(launchP0)
    .addScaledVector(launchFrame.t, 10)
    .addScaledVector(WORLD_UP, 3.5);

  launchP3.set(-19.5, GROUND_Y, 0);
  launchP2.set(-13.5, 14.5, 0);

  tempMatrix.makeBasis(
    tempV1.set(-1, 0, 0),
    WORLD_UP,
    tempV2.set(0, 0, -1)
  );

  landingQuaternion.setFromRotationMatrix(tempMatrix);
}

/* -------------------------------------------------------
   Modes
------------------------------------------------------- */

let transitionId = 0;

function applyModeCopy(mode) {
  const wall = mode === "wall";

  ui.number.textContent = wall ? "01 / STUNT" : "02 / STUNT";
  ui.title.textContent = wall ? "Wall Climb" : "Kickflip";

  ui.description.textContent = wall
    ? "The sealed underbody generates enough pressure differential to carry the Roadster beyond vertical and hold it there at zero speed."
    : "The Roadster leaves the ramp inverted, performs a controlled longitudinal rotation, then uses its thrusters to stabilize and land wheels-down.";

  ui.modeButtons.forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.mode === mode
    );
  });
}

function resetMode(mode = state.mode, snapCamera = true) {
  state.mode = mode;
  state.phase = "run";

  state.elapsed = 0;
  state.phaseTime = 0;

  state.s = 0;
  state.speed = 0;
  state.displaySpeed = 0;

  state.fan = 0;
  state.jet = 0;
  state.sideJet = 0;

  state.hold = 0;
  state.flight = 0;
  state.landingTime = 0;
  state.landingSpeed = 0;

  state.progress = 0;

  clearSmoke();

  for (let i = 0; i < AIR_COUNT; i++) {
    respawnAir(i);
  }

  placeOnRamp(0);
  applyModeCopy(mode);

  ui.status.textContent = "Fan system starting";
  ui.stage.textContent = "01";

  if (snapCamera) {
    cameraPosition.set(-1.5, 13.6, MOBILE ? 54 : 48);
    cameraTarget.set(1.5, 14.5, 0);

    camera.position.copy(cameraPosition);
    camera.lookAt(cameraTarget);
  }
}

function transitionToMode(mode) {
  if (mode === state.mode && cut.classList.contains("on")) return;

  const id = ++transitionId;
  cut.classList.add("on");

  setTimeout(() => {
    if (id !== transitionId) return;

    resetMode(mode, true);

    requestAnimationFrame(() => {
      cut.classList.remove("on");
    });
  }, 220);
}

ui.modeButtons.forEach(button => {
  button.addEventListener("click", () => {
    transitionToMode(button.dataset.mode);
  });
});

ui.replay.addEventListener("click", () => {
  transitionToMode(state.mode);
});

addEventListener("keydown", event => {
  if (event.key === "1" || event.key === "ArrowLeft") {
    transitionToMode("wall");
  }

  if (event.key === "2" || event.key === "ArrowRight") {
    transitionToMode("kickflip");
  }

  if (event.code === "Space") {
    event.preventDefault();
    transitionToMode(state.mode);
  }
});

/* -------------------------------------------------------
   Wall climb
------------------------------------------------------- */

const WALL_STOP = RAMP_LENGTH * 0.905;

function updateWallClimb(dt) {
  state.jet = 0;
  state.sideJet = 0;

  if (state.phase === "run") {
    state.fan = Math.min(1, state.fan + dt * 0.66);

    const remaining = WALL_STOP - state.s;
    const cruiseSpeed = state.s < RAMP_LENGTH * 0.4 ? 16.5 : 12.5;

    let targetSpeed = cruiseSpeed;

    if (remaining < 9) {
      targetSpeed = Math.min(
        cruiseSpeed,
        Math.sqrt(Math.max(0, remaining) * 9.5)
      );
    }

    state.speed = damp(state.speed, targetSpeed, 3.8, dt);

    const oldDistance = state.s;
    state.s = Math.min(WALL_STOP, state.s + state.speed * dt);

    spinWheels(state.s - oldDistance);
    placeOnRamp(state.s);

    state.displaySpeed = state.speed;
    state.progress = state.s / WALL_STOP * 0.92;

    ui.status.textContent =
      state.s < RAMP_LENGTH * 0.38
        ? "Fan suction engaged"
        : "Climbing beyond vertical";

    ui.stage.textContent =
      state.s < RAMP_LENGTH * 0.38 ? "01" : "02";

    if (state.s >= WALL_STOP - 0.01) {
      state.s = WALL_STOP;
      state.speed = 0;
      state.phase = "hold";
      state.phaseTime = 0;
      state.progress = 1;
    }
  } else {
    state.phaseTime += dt;
    state.hold += dt;
    state.fan = 1;
    state.speed = 0;
    state.displaySpeed = 0;

    placeOnRamp(WALL_STOP);

    car.position.addScaledVector(
      currentFrame.u,
      Math.sin(state.hold * 2.8) *
      0.006 *
      Math.exp(-state.hold * 0.65)
    );

    ui.status.textContent =
      state.hold < 1.4
        ? "Stationary beyond vertical"
        : "Held by atmospheric pressure";

    ui.stage.textContent = "03";
    state.progress = 1;
  }
}

/* -------------------------------------------------------
   Kickflip
------------------------------------------------------- */

function beginKickflipFlight() {
  prepareLaunch();

  state.phase = "flight";
  state.phaseTime = 0;
  state.flight = 0;
  state.speed = 0;

  car.position.copy(launchP0);
  car.quaternion.copy(launchQuaternion);

  emitSmoke(
    tempV1.set(launchP0.x, Math.max(0.05, launchP0.y - 1), launchP0.z),
    12,
    0.35
  );
}

function beginLanding() {
  state.phase = "landing";
  state.phaseTime = 0;
  state.landingTime = 0;
  state.landingSpeed = 7.5;

  car.position.copy(launchP3);
  car.quaternion.copy(landingQuaternion);

  emitSmoke(
    tempV1.set(launchP3.x, 0.04, launchP3.z),
    MOBILE ? 85 : 150,
    1.35
  );
}

function updateKickflip(dt) {
  if (state.phase === "run") {
    state.fan = Math.min(1, state.fan + dt * 0.62);
    state.jet = 0;
    state.sideJet = 0;

    const targetSpeed = 18.2;
    state.speed = damp(state.speed, targetSpeed, 3.5, dt);

    const oldDistance = state.s;
    state.s = Math.min(
      RAMP_LENGTH,
      state.s + state.speed * dt
    );

    spinWheels(state.s - oldDistance);
    placeOnRamp(state.s);

    state.displaySpeed = state.speed;
    state.progress = state.s / RAMP_LENGTH * 0.43;

    ui.status.textContent =
      state.s < RAMP_LENGTH * 0.55
        ? "Full fan load"
        : "Approaching launch edge";

    ui.stage.textContent =
      state.s < RAMP_LENGTH * 0.55 ? "01" : "02";

    if (state.s >= RAMP_LENGTH - 0.01) {
      beginKickflipFlight();
    }
  } else if (state.phase === "flight") {
    state.phaseTime += dt;
    state.flight = Math.min(
      1,
      state.flight + dt / state.flightDuration
    );

    const t = state.flight;

    cubicBezier(
      launchP0,
      launchP1,
      launchP2,
      launchP3,
      t,
      car.position
    );

    cubicDerivative(
      launchP0,
      launchP1,
      launchP2,
      launchP3,
      t,
      tempV1
    );

    state.displaySpeed =
      tempV1.length() / state.flightDuration;

    const postureCorrection = smoother01(
      (t - 0.06) / 0.78
    );

    baseQuat.slerpQuaternions(
      launchQuaternion,
      landingQuaternion,
      postureCorrection
    );

    const rotationProgress = smoother01(
      (t - 0.12) / 0.64
    );

    rollQuat.setFromAxisAngle(
      LOCAL_X,
      Math.PI * 2 * rotationProgress
    );

    car.quaternion.copy(baseQuat).multiply(rollQuat);

    const rollPulse = clamp01((t - 0.1) / 0.65);
    state.sideJet =
      Math.sin(rollPulse * Math.PI) *
      (t < 0.8 ? 1 : 0);

    state.jet = smoother01((t - 0.6) / 0.32);
    state.fan = THREE.MathUtils.lerp(
      0.28,
      0.86,
      state.jet
    );

    state.progress = 0.43 + t * 0.52;

    if (t < 0.2) {
      ui.status.textContent = "Ramp departure";
      ui.stage.textContent = "03";
    } else if (t < 0.72) {
      ui.status.textContent = "Longitudinal rotation";
      ui.stage.textContent = "04";
    } else {
      ui.status.textContent = "Thruster stabilization";
      ui.stage.textContent = "05";
    }

    if (
      t > 0.78 &&
      car.position.y < 7 &&
      Math.random() < dt * 22
    ) {
      emitSmoke(
        tempV1.set(car.position.x, 0.04, car.position.z),
        2,
        0.55
      );
    }

    if (t >= 1) {
      beginLanding();
    }
  } else {
    state.phaseTime += dt;
    state.landingTime += dt;

    const previousX = car.position.x;

    state.landingSpeed *= Math.exp(-1.45 * dt);
    car.position.x -= state.landingSpeed * dt;
    car.position.z = 0;

    const bounce =
      Math.abs(Math.sin(state.landingTime * 11)) *
      Math.exp(-state.landingTime * 4.4) *
      0.13;

    car.position.y = GROUND_Y + bounce;
    car.quaternion.copy(landingQuaternion);

    spinWheels(Math.abs(car.position.x - previousX));

    state.displaySpeed = state.landingSpeed;
    state.jet = Math.exp(-state.landingTime * 3.7);
    state.sideJet = 0;
    state.fan = damp(state.fan, 0.22, 1.8, dt);
    state.progress = 0.95 + Math.min(0.05, state.landingTime * 0.025);

    if (state.landingTime < 0.55) {
      ui.status.textContent = "Touchdown";
      ui.stage.textContent = "06";

      if (Math.random() < dt * 28) {
        emitSmoke(
          tempV1.set(car.position.x, 0.04, car.position.z),
          2,
          0.45
        );
      }
    } else if (state.landingSpeed > 0.75) {
      ui.status.textContent = "Controlled rollout";
      ui.stage.textContent = "07";
    } else {
      ui.status.textContent = "Stunt complete";
      ui.stage.textContent = "08";
    }
  }
}

/* -------------------------------------------------------
   Fan and thruster visual updates
------------------------------------------------------- */

function updateVehicleEffects(dt, elapsed) {
  const fan = state.fan;

  for (let i = 0; i < fanRotors.length; i++) {
    fanRotors[i].rotation.y += fan * 68 * dt;

    fanGlows[i].material.opacity =
      fan * (0.2 + 0.07 * Math.sin(elapsed * 29 + i));
  }

  sealMaterial.emissiveIntensity = fan * 1.3;
  cavityGlow.material.opacity = fan * 0.13;
  fanLight.intensity = fan * 17;

  jetCoreMaterial.opacity =
    state.jet * (0.58 + Math.sin(elapsed * 47) * 0.14);

  jetOuterMaterial.opacity =
    state.jet * (0.18 + Math.sin(elapsed * 31) * 0.04);

  sideCoreMaterial.opacity =
    state.sideJet * (0.52 + Math.sin(elapsed * 51) * 0.12);

  sideOuterMaterial.opacity =
    state.sideJet * 0.18;

  for (let i = 0; i < verticalJets.length; i++) {
    const plume = verticalJets[i];
    const flicker = 0.82 + Math.random() * 0.35;

    plume.core.scale.y = flicker;
    plume.outer.scale.y = 0.88 + Math.random() * 0.28;
  }

  for (let i = 0; i < sideJets.length; i++) {
    sideJets[i].core.scale.y = 0.85 + Math.random() * 0.3;
    sideJets[i].outer.scale.y = 0.88 + Math.random() * 0.25;
  }

  thrusterLight.intensity =
    state.jet * 95 + state.sideJet * 42;
}

/* -------------------------------------------------------
   Airflow update
------------------------------------------------------- */

function updateAirflow(dt) {
  const onRamp =
    state.phase === "run" ||
    state.mode === "wall";

  const visibleAmount =
    onRamp ? state.fan : 0;

  airflow.visible = visibleAmount > 0.025;
  airMaterial.opacity = visibleAmount * 0.72;

  if (!airflow.visible) return;

  const pullStrength = 3 + state.fan * 18;

  for (let i = 0; i < AIR_COUNT; i++) {
    const particle = airParticles[i];
    const position = particle.position;

    tempV1.set(
      fanXPositions[particle.target],
      0.12,
      0
    ).sub(position);

    const distance = tempV1.length();

    if (distance < 0.11) {
      respawnAir(i);
      continue;
    }

    tempV1.multiplyScalar(1 / distance);

    const insideSeal =
      Math.abs(position.x) < 2.2 &&
      Math.abs(position.z) < 0.86;

    position.addScaledVector(
      tempV1,
      (
        particle.speed +
        pullStrength * (insideSeal ? 1 : 0.46)
      ) * dt
    );

    if (insideSeal) {
      position.y = Math.min(position.y, 0.2);
    }

    airPositions[i * 3] = position.x;
    airPositions[i * 3 + 1] = position.y;
    airPositions[i * 3 + 2] = position.z;
  }

  airGeometry.attributes.position.needsUpdate = true;
}

/* -------------------------------------------------------
   Smoke update
------------------------------------------------------- */

function updateSmoke(dt) {
  let changed = false;

  for (let i = 0; i < SMOKE_COUNT; i++) {
    const particle = smokeData[i];

    if (!particle.active) continue;

    particle.age += dt;

    const normalizedAge = particle.age / particle.life;

    if (normalizedAge >= 1) {
      particle.active = false;
      smokeAlphas[i] = 0;
      continue;
    }

    const fade =
      Math.sin(normalizedAge * Math.PI) *
      (1 - normalizedAge * 0.28);

    smokeAlphas[i] = fade * 0.58;
    smokeSizes[i] =
      particle.baseSize *
      (0.6 + normalizedAge * 2.5);

    smokePositions[i * 3] += particle.velocity.x * dt;
    smokePositions[i * 3 + 1] += particle.velocity.y * dt;
    smokePositions[i * 3 + 2] += particle.velocity.z * dt;

    particle.velocity.x *= Math.exp(-0.8 * dt);
    particle.velocity.z *= Math.exp(-0.8 * dt);
    particle.velocity.y += 0.18 * dt;

    changed = true;
  }

  if (changed) {
    smokeGeometry.attributes.position.needsUpdate = true;
    smokeGeometry.attributes.aSize.needsUpdate = true;
    smokeGeometry.attributes.aAlpha.needsUpdate = true;
  }
}

/* -------------------------------------------------------
   Cinematic camera
------------------------------------------------------- */

const pointer = new THREE.Vector2();
const pointerSmoothed = new THREE.Vector2();

addEventListener("pointermove", event => {
  pointer.x = event.clientX / innerWidth * 2 - 1;
  pointer.y = event.clientY / innerHeight * 2 - 1;
});

function updateCamera(dt) {
  pointerSmoothed.lerp(pointer, 1 - Math.exp(-2.2 * dt));

  if (state.mode === "wall") {
    const climbProgress = state.s / WALL_STOP;

    if (state.phase === "run") {
      const closeBlend = smoother01(
        (climbProgress - 0.7) / 0.26
      );

      tempV1.set(-1.5, 13.5, MOBILE ? 54 : 48);
      tempV2.set(0.5, 23.5, 28);

      cameraGoal.lerpVectors(
        tempV1,
        tempV2,
        closeBlend
      );

      tempV1.set(2.5, 14.5, 0);
      tempV2.copy(car.position).addScaledVector(
        currentFrame.u,
        0.6
      );

      cameraTargetGoal.lerpVectors(
        tempV1,
        tempV2,
        closeBlend
      );
    } else {
      const closeBlend = smoother01(
        (state.hold - 0.7) / 2.2
      );

      tempV1.set(-0.5, 19, 37);
      tempV2.set(-0.5, 26.5, 21.5);

      cameraGoal.lerpVectors(
        tempV1,
        tempV2,
        closeBlend
      );

      cameraTargetGoal.copy(car.position)
        .addScaledVector(currentFrame.u, 0.5);
    }
  } else {
    if (state.phase === "run") {
      const climbProgress = state.s / RAMP_LENGTH;
      const closeBlend = smoother01(
        (climbProgress - 0.68) / 0.28
      );

      tempV1.set(-1, 13.2, MOBILE ? 55 : 49);
      tempV2.set(0, 22, 31);

      cameraGoal.lerpVectors(
        tempV1,
        tempV2,
        closeBlend
      );

      tempV1.set(1.5, 14, 0);
      tempV2.copy(car.position);

      cameraTargetGoal.lerpVectors(
        tempV1,
        tempV2,
        closeBlend
      );
    } else if (state.phase === "flight") {
      const t = state.flight;
      const landingBlend = smoother01((t - 0.58) / 0.34);

      tempV1.set(-0.5, 18.5, 43);
      tempV2.set(-8.5, 7.2, 29);

      cameraGoal.lerpVectors(
        tempV1,
        tempV2,
        landingBlend
      );

      tempV1.set(-3, 16, 0);
      tempV2.copy(car.position).add(
        tempV3.set(0, 1.5, 0)
      );

      cameraTargetGoal.lerpVectors(
        tempV1,
        tempV2,
        landingBlend
      );
    } else {
      const settleBlend = smoother01(
        state.landingTime / 1.8
      );

      tempV1.set(-8.5, 7.2, 29);
      tempV2.set(-12.5, 4.2, 22);

      cameraGoal.lerpVectors(
        tempV1,
        tempV2,
        settleBlend
      );

      cameraTargetGoal.copy(car.position)
        .add(tempV3.set(1.5, 0.7, 0));
    }
  }

  cameraGoal.x += pointerSmoothed.x * 0.7;
  cameraGoal.y -= pointerSmoothed.y * 0.35;

  dampVector(cameraPosition, cameraGoal, 3.7, dt);
  dampVector(cameraTarget, cameraTargetGoal, 4.2, dt);

  camera.position.copy(cameraPosition);
  camera.up.set(0, 1, 0);
  camera.lookAt(cameraTarget);
}

/* -------------------------------------------------------
   UI update
------------------------------------------------------- */

function updateUI() {
  const force = state.fan * MAX_FAN_FORCE;
  const grip = force / CAR_MASS;

  ui.force.textContent =
    Math.round(force).toLocaleString();

  ui.grip.textContent = grip.toFixed(1);

  ui.speed.textContent = Math.round(
    state.displaySpeed * 3.6
  );

  ui.progress.style.transform =
    `scaleX(${clamp01(state.progress)})`;
}

/* -------------------------------------------------------
   Adaptive resolution
------------------------------------------------------- */

let performanceTime = 0;
let performanceFrames = 0;
let performanceAccumulation = 0;

function updateAdaptiveResolution(rawDt) {
  performanceTime += rawDt;
  performanceFrames++;
  performanceAccumulation += rawDt;

  if (performanceTime < 3.5) return;

  const averageFrameTime =
    performanceAccumulation / performanceFrames;

  performanceTime = 0;
  performanceFrames = 0;
  performanceAccumulation = 0;

  if (averageFrameTime > 0.024 && renderDpr > 1) {
    renderDpr = Math.max(1, renderDpr - 0.15);

    renderer.setPixelRatio(renderDpr);
    composer.setPixelRatio(renderDpr);
    composer.setSize(innerWidth, innerHeight);

    smokeMaterial.uniforms.uViewport.value =
      innerHeight * renderDpr;
  }
}

/* -------------------------------------------------------
   Main loop
------------------------------------------------------- */

const clock = new THREE.Clock();

function animate() {
  const rawDt = clock.getDelta();
  const dt = Math.min(rawDt, 1 / 30);

  state.elapsed += dt;
  state.phaseTime += dt;

  if (state.mode === "wall") {
    updateWallClimb(dt);
  } else {
    updateKickflip(dt);
  }

  updateVehicleEffects(dt, state.elapsed);
  updateAirflow(dt);
  updateSmoke(dt);
  updateCamera(dt);
  updateUI();
  updateAdaptiveResolution(rawDt);

  composer.render();
}

renderer.setAnimationLoop(animate);

/* -------------------------------------------------------
   Resize
------------------------------------------------------- */

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.fov = MOBILE ? 42 : 35;
  camera.updateProjectionMatrix();

  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);

  smokeMaterial.uniforms.uViewport.value =
    innerHeight * renderDpr;
});

/* Initial scene */

prepareLaunch();
resetMode("wall", true);
</script>
