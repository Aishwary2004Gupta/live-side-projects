<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Painted rings</title>
<style>
  html,body{margin:0;height:100%;background:#F2E9D9;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block}
</style>
</head>
<body>
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* ---------------- helpers (Maf / palette / gradient) ---------------- */
const Maf = {
  TAU: Math.PI * 2, PI: Math.PI,
  randomInRange: (a, b) => a + Math.random() * (b - a),
  parabola: (x, k) => Math.pow(4 * x * (1 - x), k),
};

const paletteRange = ["#FD7555","#FE4F2E","#040720","#EB9786","#E02211","#3A0724","#F9C163"];
const paletteColors = paletteRange.map(c => new THREE.Color(c));
function gradientAt(t) {
  const n = paletteColors.length - 1;
  const f = Math.min(Math.max(t, 0), .99999) * n;
  const i = Math.floor(f);
  return paletteColors[i].clone().lerp(paletteColors[i + 1], f - i);
}

/* ---------------- renderer / camera / scene ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(1);
renderer.setClearColor(0xF2E9D9, 1);
document.body.appendChild(renderer.domElement);
const canvas = renderer.domElement;

const camera = new THREE.PerspectiveCamera(35, 1, .1, 100);
camera.position.set(7.8, 3.6, 7.3);
const scene = new THREE.Scene();
const group = new THREE.Group();
camera.lookAt(group.position);
const controls = new THREE.OrbitControls(camera, canvas);

/* ---------------- procedural brush-stroke texture ---------------- */
function makeStrokeTexture() {
  const w = 512, h = 64;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0,  'rgba(255,255,255,0)');
  g.addColorStop(.15,'rgba(255,255,255,.75)');
  g.addColorStop(.5, 'rgba(255,255,255,.95)');
  g.addColorStop(.85,'rgba(255,255,255,.75)');
  g.addColorStop(1,  'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  // bristle gaps
  ctx.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 45; i++) {
    const y = Math.random() * h;
    ctx.lineWidth = .5 + Math.random() * 2.5;
    ctx.strokeStyle = `rgba(0,0,0,${.2 + Math.random() * .6})`;
    ctx.beginPath();
    const x0 = Math.random() * w * .5, x1 = x0 + Math.random() * w * .9;
    ctx.moveTo(x0, y);
    for (let x = x0; x <= x1; x += 12) ctx.lineTo(x, y + Math.sin(x * .05 + i) * 1.5);
    ctx.stroke();
  }
  // ragged edges
  for (let i = 0; i < 80; i++) {
    const x = Math.random() * w, y = Math.random() < .5 ? Math.random() * 10 : h - Math.random() * 10;
    ctx.fillStyle = 'rgba(0,0,0,.8)';
    ctx.beginPath(); ctx.arc(x, y, 1 + Math.random() * 4, 0, Maf.TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
  return tex;
}
const strokeTexture = makeStrokeTexture();

/* ---------------- minimal MeshLine (screen-space ribbon) ---------------- */
function makeRibbonGeometry(points, widthFn) {
  const N = points.length;
  const pos = [], prev = [], next = [], side = [], width = [], uv = [], idx = [];
  for (let i = 0; i < N; i++) {
    const p = points[i], pp = points[Math.max(i - 1, 0)], pn = points[Math.min(i + 1, N - 1)];
    const t = i / (N - 1), wd = widthFn(t);
    for (let s = 0; s < 2; s++) {
      pos.push(p.x, p.y, p.z); prev.push(pp.x, pp.y, pp.z); next.push(pn.x, pn.y, pn.z);
      side.push(s === 0 ? 1 : -1); width.push(wd); uv.push(t, s);
    }
    if (i < N - 1) { const n = i * 2; idx.push(n, n + 1, n + 2, n + 2, n + 1, n + 3); }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('previous', new THREE.Float32BufferAttribute(prev, 3));
  geo.setAttribute('next',     new THREE.Float32BufferAttribute(next, 3));
  geo.setAttribute('side',     new THREE.Float32BufferAttribute(side, 1));
  geo.setAttribute('width',    new THREE.Float32BufferAttribute(width, 1));
  geo.setAttribute('uv',       new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  return geo;
}

const lineVS = `
attribute vec3 previous; attribute vec3 next; attribute float side; attribute float width;
uniform float lineWidth; uniform float aspect;
varying vec2 vUv;
void main(){
  vUv = uv;
  mat4 m = projectionMatrix * modelViewMatrix;
  vec4 finalPosition = m * vec4(position, 1.);
  vec4 prevPos = m * vec4(previous, 1.);
  vec4 nextPos = m * vec4(next, 1.);
  vec2 aspectVec = vec2(aspect, 1.);
  vec2 currentP = finalPosition.xy / finalPosition.w * aspectVec;
  vec2 prevP = prevPos.xy / prevPos.w * aspectVec;
  vec2 nextP = nextPos.xy / nextPos.w * aspectVec;
  vec2 dir;
  if (distance(nextP, currentP) < 1e-6) dir = normalize(currentP - prevP);
  else if (distance(prevP, currentP) < 1e-6) dir = normalize(nextP - currentP);
  else dir = normalize(normalize(currentP - prevP) + normalize(nextP - currentP));
  vec2 normal = vec2(-dir.y, dir.x);
  normal.x /= aspect;
  normal *= .5 * lineWidth * width;
  finalPosition.xy += normal * side * finalPosition.w;
  gl_Position = finalPosition;
}`;
const lineFS = `
uniform sampler2D map; uniform vec3 color; uniform float opacity;
varying vec2 vUv;
void main(){
  float a = texture2D(map, vUv).a * opacity;
  if (a < .08) discard;
  gl_FragColor = vec4(color, a);
}`;

/* ---------------- build the rings ---------------- */
const circleRadius = 2;
const points = [];
for (let j = 0; j <= Math.PI + 1e-6; j += Math.PI / 72)
  points.push(new THREE.Vector3(circleRadius * Math.cos(j), circleRadius * Math.sin(j), 0));
points.reverse();
const ringGeometry = makeRibbonGeometry(points, p => p);

const circles = [];
const SIDES = 72;
for (let i = 0; i < SIDES; i++) {
  const material = new THREE.ShaderMaterial({
    uniforms: {
      map: { value: strokeTexture },
      color: { value: gradientAt(Maf.randomInRange(0, 1)) },
      opacity: { value: .95 },
      lineWidth: { value: .2 },
      aspect: { value: 1 },
    },
    vertexShader: lineVS, fragmentShader: lineFS,
    transparent: true, depthTest: false, depthWrite: false, side: THREE.DoubleSide,
  });
  const mesh = new THREE.Mesh(ringGeometry, material);
  mesh.frustumCulled = false;
  const pivot = new THREE.Group();
  const a = Maf.randomInRange(0, Maf.TAU);
  const y = .05 * (-.5 * SIDES + i);
  pivot.position.set(0, y, 0);
  const tilt = .25;
  pivot.rotation.x = Maf.randomInRange(-tilt, tilt);
  pivot.rotation.z = Maf.randomInRange(-tilt, tilt);
  mesh.rotation.x = Math.PI / 2;
  mesh.scale.setScalar(Maf.parabola(i / SIDES, .5) + Maf.randomInRange(-.1, .1));
  pivot.add(mesh);
  group.add(pivot);
  circles.push({ mesh, pivot, a, speed: 1 + Math.round(Maf.randomInRange(0, 2)) });
}
scene.add(group);

/* ---------------- "Painted" post-processing ---------------- */
const quadVS = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }`;

const kuwaharaFS = `
uniform sampler2D tDiffuse; uniform vec2 resolution; varying vec2 vUv;
#define R 5
void main(){
  vec2 texel = 1. / resolution;
  float n = float((R + 1) * (R + 1));
  vec3 m0=vec3(0.),m1=vec3(0.),m2=vec3(0.),m3=vec3(0.);
  vec3 s0=vec3(0.),s1=vec3(0.),s2=vec3(0.),s3=vec3(0.);
  vec3 c;
  for(int j=-R;j<=0;++j) for(int i=-R;i<=0;++i){ c=texture2D(tDiffuse,vUv+vec2(float(i),float(j))*texel).rgb; m0+=c; s0+=c*c; }
  for(int j=-R;j<=0;++j) for(int i=0;i<=R;++i){ c=texture2D(tDiffuse,vUv+vec2(float(i),float(j))*texel).rgb; m1+=c; s1+=c*c; }
  for(int j=0;j<=R;++j)  for(int i=0;i<=R;++i){ c=texture2D(tDiffuse,vUv+vec2(float(i),float(j))*texel).rgb; m2+=c; s2+=c*c; }
  for(int j=0;j<=R;++j)  for(int i=-R;i<=0;++i){ c=texture2D(tDiffuse,vUv+vec2(float(i),float(j))*texel).rgb; m3+=c; s3+=c*c; }
  float minS = 1e5, s; vec3 res = vec3(0.);
  m0/=n; s0=abs(s0/n-m0*m0); s=s0.r+s0.g+s0.b; if(s<minS){minS=s;res=m0;}
  m1/=n; s1=abs(s1/n-m1*m1); s=s1.r+s1.g+s1.b; if(s<minS){minS=s;res=m1;}
  m2/=n; s2=abs(s2/n-m2*m2); s=s2.r+s2.g+s2.b; if(s<minS){minS=s;res=m2;}
  m3/=n; s3=abs(s3/n-m3*m3); s=s3.r+s3.g+s3.b; if(s<minS){minS=s;res=m3;}
  gl_FragColor = vec4(res, 1.);
}`;

const paintFS = `
uniform sampler2D tDiffuse; uniform vec2 resolution; uniform float minLevel; uniform float seed;
varying vec2 vUv;
float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x), mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x), f.y); }
float lum(vec3 c){ return dot(c, vec3(.299,.587,.114)); }
void main(){
  vec2 texel = 1. / resolution;
  vec2 p = vUv * resolution;
  // wobbly, hand-drawn edges
  vec2 wob = vec2(noise(p*.025+seed), noise(p*.025+vec2(41.7,17.3)+seed)) - .5;
  vec2 uv = vUv + wob * texel * 5.;
  vec3 col = texture2D(tDiffuse, uv).rgb;
  // misregistered ink outlines (sobel)
  vec2 euv = uv + vec2(2., -1.5) * texel;
  float tl=lum(texture2D(tDiffuse,euv+vec2(-1., 1.)*texel).rgb), t=lum(texture2D(tDiffuse,euv+vec2(0., 1.)*texel).rgb), tr=lum(texture2D(tDiffuse,euv+vec2(1., 1.)*texel).rgb);
  float l =lum(texture2D(tDiffuse,euv+vec2(-1., 0.)*texel).rgb),                                                       r =lum(texture2D(tDiffuse,euv+vec2(1., 0.)*texel).rgb);
  float bl=lum(texture2D(tDiffuse,euv+vec2(-1.,-1.)*texel).rgb), b=lum(texture2D(tDiffuse,euv+vec2(0.,-1.)*texel).rgb), br=lum(texture2D(tDiffuse,euv+vec2(1.,-1.)*texel).rgb);
  float gx = -tl-2.*l-bl+tr+2.*r+br;
  float gy = -bl-2.*b-br+tl+2.*t+tr;
  float e = smoothstep(.08, .4, length(vec2(gx, gy)));
  vec3 ecol = texture2D(tDiffuse, euv).rgb;
  vec3 edgeColor = ecol * ecol * .8;
  // levels (Painted minLevel)
  col = (col - minLevel) / (1. - minLevel);
  edgeColor = (edgeColor - minLevel*.4) / (1. - minLevel*.4);
  col = mix(col, edgeColor, e * .85);
  // paper grain + fibres
  float grain = noise(p*.9)*.6 + noise(p*.35)*.4;
  float fibers = noise(vec2(p.x*.08, p.y*1.3));
  col *= .88 + .1*grain + .04*fibers;
  vec2 q = vUv - .5; col *= 1. - dot(q, q) * .25;
  gl_FragColor = vec4(col, 1.);
}`;

const rtOpts = { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat };
const rt1 = new THREE.WebGLRenderTarget(1, 1, rtOpts);
const rt2 = new THREE.WebGLRenderTarget(1, 1, rtOpts);
const orthoCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quadGeo = new THREE.PlaneBufferGeometry(2, 2);

const kuwaharaMat = new THREE.ShaderMaterial({
  uniforms: { tDiffuse: { value: rt1.texture }, resolution: { value: new THREE.Vector2(1, 1) } },
  vertexShader: quadVS, fragmentShader: kuwaharaFS, depthTest: false, depthWrite: false,
});
const paintMat = new THREE.ShaderMaterial({
  uniforms: { tDiffuse: { value: rt2.texture }, resolution: { value: new THREE.Vector2(1, 1) }, minLevel: { value: -.5 }, seed: { value: Math.random() * 100 } },
  vertexShader: quadVS, fragmentShader: paintFS, depthTest: false, depthWrite: false,
});
const kuwaharaScene = new THREE.Scene(); kuwaharaScene.add(new THREE.Mesh(quadGeo, kuwaharaMat));
const paintScene = new THREE.Scene();    paintScene.add(new THREE.Mesh(quadGeo, paintMat));

function paintedRender(scene, camera) {
  renderer.setRenderTarget(rt1); renderer.render(scene, camera);
  renderer.setRenderTarget(rt2); renderer.render(kuwaharaScene, orthoCam);
  renderer.setRenderTarget(null); renderer.render(paintScene, orthoCam);
}

/* ---------------- resize ---------------- */
function resize() {
  const s = Math.min(window.innerWidth, window.innerHeight);
  renderer.setSize(s, s);
  rt1.setSize(s, s); rt2.setSize(s, s);
  kuwaharaMat.uniforms.resolution.value.set(s, s);
  paintMat.uniforms.resolution.value.set(s, s);
  camera.aspect = 1; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

/* ---------------- animation loop ---------------- */
const loopDuration = 4;
const startTime = performance.now();
function draw() {
  requestAnimationFrame(draw);
  const time = (.001 * (performance.now() - startTime)) % loopDuration;
  const t = time / loopDuration;
  circles.forEach(c => { c.pivot.rotation.y = c.speed * t * Maf.TAU + c.a; });
  group.rotation.x = Maf.PI / 8;
  paintedRender(scene, camera);
}
draw();
</script>
</body>
</html>
