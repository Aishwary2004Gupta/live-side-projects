<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Painted Sphere</title>
<style>
  body { margin: 0; overflow: hidden; background: #F2E9D9; }
  canvas { display: block; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>

// ---------- MeshLine (simplified inline version) ----------
class MeshLine {
  constructor() { this.geometry = new THREE.BufferGeometry(); }
  setPoints(points, widthCallback) {
    const positions = [], next = [], previous = [], side = [],
          width = [], uvs = [], indices = [];
    const N = points.length;
    for (let i = 0; i < N; i++) {
      const p = points[i];
      positions.push(p.x, p.y, p.z, p.x, p.y, p.z);
      side.push(1, -1);
      const w = widthCallback ? widthCallback(i / (N - 1)) : 1;
      width.push(w, w);
      uvs.push(i / (N - 1), 0, i / (N - 1), 1);
    }
    for (let i = 0; i < N; i++) {
      const pv = points[Math.max(i - 1, 0)];
      const nx = points[Math.min(i + 1, N - 1)];
      previous.push(pv.x, pv.y, pv.z, pv.x, pv.y, pv.z);
      next.push(nx.x, nx.y, nx.z, nx.x, nx.y, nx.z);
    }
    for (let i = 0; i < N - 1; i++) {
      const n = i * 2;
      indices.push(n, n + 1, n + 2, n + 2, n + 1, n + 3);
    }
    const g = this.geometry;
    g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    g.setAttribute('previous', new THREE.Float32BufferAttribute(previous, 3));
    g.setAttribute('next', new THREE.Float32BufferAttribute(next, 3));
    g.setAttribute('side', new THREE.Float32BufferAttribute(side, 1));
    g.setAttribute('width', new THREE.Float32BufferAttribute(width, 1));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    g.setIndex(indices);
  }
}

function MeshLineMaterial(params) {
  return new THREE.ShaderMaterial({
    uniforms: {
      map: { value: params.map },
      useMap: { value: params.useMap ? 1 : 0 },
      color: { value: params.color || new THREE.Color(0xffffff) },
      opacity: { value: params.opacity != null ? params.opacity : 1 },
      resolution: { value: params.resolution },
      lineWidth: { value: params.lineWidth || 1 },
      sizeAttenuation: { value: params.sizeAttenuation ? 1 : 0 }
    },
    vertexShader: `
      attribute vec3 previous;
      attribute vec3 next;
      attribute float side;
      attribute float width;
      uniform vec2 resolution;
      uniform float lineWidth;
      uniform float sizeAttenuation;
      varying vec2 vUV;
      vec2 fix(vec4 i, float aspect) {
        vec2 res = i.xy / i.w;
        res.x *= aspect;
        return res;
      }
      void main() {
        float aspect = resolution.x / resolution.y;
        mat4 m = projectionMatrix * modelViewMatrix;
        vec4 finalPosition = m * vec4(position, 1.0);
        vec4 prevPos = m * vec4(previous, 1.0);
        vec4 nextPos = m * vec4(next, 1.0);
        vec2 currentP = fix(finalPosition, aspect);
        vec2 prevP = fix(prevPos, aspect);
        vec2 nextP = fix(nextPos, aspect);
        float w = lineWidth * width;
        vec2 dir;
        if (nextP == currentP) dir = normalize(currentP - prevP);
        else if (prevP == currentP) dir = normalize(nextP - currentP);
        else {
          vec2 dir1 = normalize(currentP - prevP);
          vec2 dir2 = normalize(nextP - currentP);
          dir = normalize(dir1 + dir2);
        }
        vec2 normal = vec2(-dir.y, dir.x);
        normal.x /= aspect;
        normal *= 0.5 * w;
        vec4 offset;
        if (sizeAttenuation == 1.0) {
          offset = vec4(normal * side, 0.0, 1.0);
          finalPosition.xy += offset.xy;
        } else {
          normal *= finalPosition.w;
          normal /= resolution.y;
          finalPosition.xy += normal * side;
        }
        vUV = uv;
        gl_Position = finalPosition;
      }
    `,
    fragmentShader: `
      uniform sampler2D map;
      uniform float useMap;
      uniform vec3 color;
      uniform float opacity;
      varying vec2 vUV;
      void main() {
        vec4 c = vec4(color, opacity);
        if (useMap == 1.0) c *= texture2D(map, vUV);
        if (c.a < 0.01) discard;
        gl_FragColor = c;
      }
    `,
    transparent: params.transparent,
    depthTest: params.depthTest,
    depthWrite: params.depthWrite,
    side: THREE.DoubleSide
  });
}

// ---------- Maf helpers ----------
const Maf = {
  TAU: Math.PI * 2,
  PI: Math.PI,
  randomInRange: (min, max) => min + Math.random() * (max - min),
  parabola: (x, k) => Math.pow(4 * x * (1 - x), k)
};

// ---------- Gradient ----------
class GradientLinear {
  constructor(colors) {
    this.colors = colors.map(c => new THREE.Color(c));
  }
  getAt(t) {
    t = Math.max(0, Math.min(1, t));
    const n = this.colors.length - 1;
    const i = Math.floor(t * n);
    const f = t * n - i;
    const a = this.colors[i];
    const b = this.colors[Math.min(i + 1, n)];
    return new THREE.Color(
      a.r + (b.r - a.r) * f,
      a.g + (b.g - a.g) * f,
      a.b + (b.b - a.b) * f
    );
  }
}

// ---------- Procedural stroke texture ----------
function createStrokeTexture() {
  const size = 256;
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, size, size);
  // Build a soft brush-stroke alpha across the length (x)
  for (let x = 0; x < size; x++) {
    const tx = x / size;
    // ends fade out
    const endFade = Math.min(1, Math.min(tx, 1 - tx) * 6);
    for (let y = 0; y < size; y++) {
      const ty = y / size;
      const dy = Math.abs(ty - 0.5) * 2;
      let a = (1 - dy * dy) * endFade;
      // add streaky noise for a painterly feel
      const noise = 0.6 + 0.4 * Math.sin(x * 0.4 + y * 0.05) * Math.cos(x * 0.13);
      a *= noise;
      a = Math.max(0, Math.min(1, a));
      ctx.fillStyle = `rgba(255,255,255,${a})`;
      ctx.fillRect(x, y, 1, 1);
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
  return tex;
}

// ---------- Setup ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0xF2E9D9, 1);
document.body.appendChild(renderer.domElement);
const canvas = renderer.domElement;

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(7.8, 3.6, 7.3);

const scene = new THREE.Scene();
const group = new THREE.Group();
const controls = new THREE.OrbitControls(camera, canvas);
camera.lookAt(group.position);
controls.update();

const palette = ["#FD7555", "#FE4F2E", "#040720", "#EB9786", "#E02211", "#3A0724", "#F9C163"];
const gradient = new GradientLinear(palette);

const strokeTexture = createStrokeTexture();
const resolution = new THREE.Vector2(window.innerWidth, window.innerHeight);

// build the circle points (half circle, like the original)
const circleRadius = 2;
const points = [];
for (let j = 0; j <= Math.PI; j += Math.PI / 72) {
  points.push(new THREE.Vector3(circleRadius * Math.cos(j), circleRadius * Math.sin(j), 0));
}
points.reverse();

const circles = [];
const SIDES = 72;
for (let i = 0; i < SIDES; i++) {
  const line = new MeshLine();
  line.setPoints(points, p => 1);
  const material = MeshLineMaterial({
    map: strokeTexture,
    useMap: true,
    color: new THREE.Color().setHSL(i / SIDES, 1, 0.5),
    resolution: resolution,
    sizeAttenuation: false,
    lineWidth: 200,
    depthWrite: false,
    depthTest: false,
    transparent: true,
    opacity: 0.95
  });
  const mesh = new THREE.Mesh(line.geometry, material);
  const pivot = new THREE.Group();
  const a = Maf.randomInRange(0, Maf.TAU);
  const x = 3 * Math.sin(a);
  const y = 0.05 * (-0.5 * SIDES + i);
  const z = 3 * Math.cos(a);
  pivot.position.set(0, y, 0);
  const tilt = 0.25;
  pivot.rotation.x = Maf.randomInRange(-tilt, tilt);
  pivot.rotation.z = Maf.randomInRange(-tilt, tilt);
  mesh.rotation.x = Math.PI / 2;
  pivot.add(mesh);
  group.add(pivot);
  mesh.scale.setScalar(Maf.parabola(i / SIDES, 0.5) + Maf.randomInRange(-0.1, 0.1));
  circles.push({
    mesh, pivot, x,
    c: Maf.randomInRange(0, 1),
    speed: 1 + Math.round(Maf.randomInRange(0, 2)),
    z, a
  });
}
scene.add(group);

// ---------- Animation ----------
const loopDuration = 4;
const startTime = performance.now();

function draw() {
  requestAnimationFrame(draw);
  const time = (0.001 * (performance.now() - startTime)) % loopDuration;
  const t = time / loopDuration;

  circles.forEach(c => {
    c.pivot.rotation.y = c.speed * t * Maf.TAU + c.a;
    c.mesh.material.uniforms.color.value.copy(gradient.getAt(c.c));
  });

  group.rotation.x = Maf.PI / 8;

  controls.update();
  renderer.render(scene, camera);
}
draw();

// ---------- Resize ----------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  resolution.set(window.innerWidth, window.innerHeight);
});

</script>
</body>
</html>
