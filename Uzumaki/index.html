<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Spiral Fractal (Curlicue)</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #111;
            color: #eee;
            font-family: sans-serif;
            flex-direction: column;
        }
        canvas {
            border: 1px solid #444;
            background-color: #000;
        }
        .controls {
            margin-bottom: 15px;
            padding: 10px;
            background: #222;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="controls">
        <label for="iterations">Iterations (Detail):</label>
        <input type="range" id="iterations" min="50" max="1000" value="400">
        <span id="iterValue">400</span>
    </div>
    
    <canvas id="spiralCanvas" width="800" height="800"></canvas>

    <script src="spiral.js"></script>
</body>
</html>
