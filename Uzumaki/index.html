<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optical Illusion Spiral</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        let time = 0;
        
        function drawOpticalSpiral(centerX, centerY, t, offset) {
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(t * 0.5 + offset);
            
            const rings = 25;
            for (let ring = 0; ring < rings; ring++) {
                const points = 100;
                ctx.beginPath();
                
                for (let i = 0; i <= points; i++) {
                    const angle = (i / points) * Math.PI * 8;
                    const baseRadius = ring * 15;
                    
                    const wave1 = Math.sin(angle * 6 + t * 2) * 8;
                    const wave2 = Math.cos(angle * 10 - t * 1.5) * 6;
                    
                    const radius = baseRadius + wave1 + wave2;
                    const x = radius * Math.cos(angle);
                    const y = radius * Math.sin(angle);
                    
                    if (i === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                
                const isWhite = (ring + Math.floor(t * 2)) % 2 === 0;
                ctx.strokeStyle = isWhite ? '#fff' : '#000';
                ctx.lineWidth = 15;
                ctx.stroke();
                
                ctx.strokeStyle = isWhite ? '#000' : '#fff';
                ctx.lineWidth = 13;
                ctx.stroke();
            }
            
            ctx.restore();
        }
        
        function drawConcentricWaves(centerX, centerY, t, phase) {
            ctx.save();
            ctx.translate(centerX, centerY);
            
            const numRings = 30;
            for (let i = 0; i < numRings; i++) {
                const radius = i * 12 + (t * 20 + phase) % 12;
                const segments = 80;
                
                ctx.beginPath();
                for (let j = 0; j <= segments; j++) {
                    const angle = (j / segments) * Math.PI * 2;
                    const distortion = Math.sin(angle * 8 + t * 3 + i * 0.5) * 5;
                    const r = radius + distortion;
                    
                    const x = r * Math.cos(angle);
                    const y = r * Math.sin(angle);
                    
                    if (j === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                ctx.closePath();
                
                const isWhite = i % 2 === 0;
                ctx.fillStyle = isWhite ? '#fff' : '#000';
                ctx.fill();
                ctx.strokeStyle = isWhite ? '#000' : '#fff';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
            
            ctx.restore();
        }
        
        function drawRadialPattern(centerX, centerY, t) {
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(t * 0.3);
            
            const numSegments = 16;
            const maxRadius = 200;
            
            for (let seg = 0; seg < numSegments; seg++) {
                const startAngle = (seg / numSegments) * Math.PI * 2;
                const endAngle = ((seg + 1) / numSegments) * Math.PI * 2;
                
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, maxRadius, startAngle, endAngle);
                ctx.closePath();
                
                const isWhite = seg % 2 === 0;
                ctx.fillStyle = isWhite ? '#fff' : '#000';
                ctx.fill();
                ctx.strokeStyle = isWhite ? '#000' : '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            
            ctx.restore();
        }
        
        function drawHypnoticSpiral(centerX, centerY, t, rotationOffset) {
            ctx.save();
            ctx.translate(centerX, centerY);
            
            const layers = 20;
            for (let layer = 0; layer < layers; layer++) {
                ctx.beginPath();
                const points = 120;
                
                for (let i = 0; i < points; i++) {
                    const angle = (i / points) * Math.PI * 12;
                    const radius = (angle / (Math.PI * 12)) * 180 + layer * 5;
                    
                    const wobble = Math.sin(angle * 5 + t * 2 + layer * 0.3) * 10;
                    const r = radius + wobble;
                    
                    const x = r * Math.cos(angle + t * 0.4 + rotationOffset);
                    const y = r * Math.sin(angle + t * 0.4 + rotationOffset);
                    
                    if (i === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                
                const isWhite = (layer + Math.floor(t * 3)) % 2 === 0;
                ctx.strokeStyle = isWhite ? '#fff' : '#000';
                ctx.lineWidth = 8;
                ctx.stroke();
            }
            
            ctx.restore();
        }
        
        function animate() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const cellWidth = canvas.width / 3;
            const cellHeight = canvas.height / 3;
            
            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 3; col++) {
                    const x = col * cellWidth + cellWidth / 2;
                    const y = row * cellHeight + cellHeight / 2;
                    const pattern = (row + col) % 4;
                    const offset = (row * 3 + col) * 0.5;
                    
                    ctx.save();
                    ctx.beginPath();
                    ctx.rect(col * cellWidth, row * cellHeight, cellWidth, cellHeight);
                    ctx.clip();
                    
                    if (pattern === 0) {
                        drawOpticalSpiral(x, y, time, offset);
                    } else if (pattern === 1) {
                        drawConcentricWaves(x, y, time, offset);
                    } else if (pattern === 2) {
                        drawRadialPattern(x, y, time + offset);
                    } else {
                        drawHypnoticSpiral(x, y, time, offset);
                    }
                    
                    ctx.restore();
                }
            }
            
            time += 0.03;
            requestAnimationFrame(animate);
        }
        
        animate();
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
