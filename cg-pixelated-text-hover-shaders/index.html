<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shader Font Distortion</title>

  <!-- Speed boost -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="styles.css" />
  <meta name="theme-color" content="#ffffff">
</head>

<body>
  <div id="textContainer"></div>

  <!-- Font control panel -->
  <div id="fontPanel"></div>

  <!-- Dark mode toggle -->
  <div id="darkModeToggle" class="toggle-switch" title="Toggle dark mode">
    <div class="toggle-slider"></div>
  </div>

  <div id="instruction">
    Move mouse / touch → Distort<br>
    Space / Double-tap → Change font<br>
    <strong id="fontName"></strong>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
