<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Clock of Clocks</title>
    <style>
      :root {
        --page-a: #f3f4f6;
        --page-b: #c9ced6;
        --ui-bg: rgba(255, 255, 255, 0.72);
        --ui-fg: #29303b;
        --ui-line: rgba(30, 40, 60, 0.16);
        --ui-active-bg: #1b2540;
        --ui-active-fg: #f2f4f8;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      :root[data-theme="light"] {
        --page-a: #ffffff;
        --page-b: #e6e7ea;
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: radial-gradient(
          ellipse at 50% 35%,
          var(--page-a) 0%,
          var(--page-b) 100%
        );
        font-family:
          "Avenir Next",
          "Segoe UI",
          system-ui,
          -apple-system,
          Helvetica,
          Arial,
          sans-serif;
        color: var(--ui-fg);
        overflow: hidden;
        transition: background 0.6s ease;
      }
      canvas#wall {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      .bar {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(18px + env(safe-area-inset-bottom, 0px));
        max-width: calc(100% - 24px);
        display: flex;
        gap: 4px;
        align-items: center;
        padding: 5px;
        background: var(--ui-bg);
        border: 1px solid var(--ui-line);
        border-radius: 999px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        overflow-x: auto;
        scrollbar-width: none;
        transition: opacity 0.4s ease;
      }
      .bar::-webkit-scrollbar {
        display: none;
      }
      .bar.idle {
        opacity: 0;
      }
      .bar:hover,
      .bar:focus-within {
        opacity: 1;
      }
      .bar button {
        font: inherit;
        font-size: 13px;
        letter-spacing: 0.01em;
        color: var(--ui-fg);
        background: transparent;
        border: 0;
        border-radius: 999px;
        padding: 7px 13px;
        cursor: pointer;
        white-space: nowrap;
        transition:
          background 0.2s,
          color 0.2s;
      }
      .bar button:hover {
        background: rgba(30, 40, 60, 0.08);
      }
      .bar button:focus-visible {
        outline: 2px solid var(--ui-active-bg);
        outline-offset: 1px;
      }
      .bar button[aria-pressed="true"] {
        background: var(--ui-active-bg);
        color: var(--ui-active-fg);
      }
      .bar .sep {
        width: 1px;
        height: 18px;
        background: var(--ui-line);
        margin: 0 4px;
        flex: none;
      }
      @media (prefers-reduced-motion: reduce) {
        body,
        .bar {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas
      id="wall"
      aria-label="A wall of 120 small analog clocks whose hands form the current time"
      role="img"
    ></canvas>

    <div class="bar" id="bar">
      <button data-mode="time" aria-pressed="true">Time</button>
      <button data-mode="ripple" aria-pressed="false">Ripple</button>
      <button data-mode="wave" aria-pressed="false">Wave</button>
      <button data-mode="swirl" aria-pressed="false">Swirl</button>
      <button data-mode="sweep" aria-pressed="false">Sweep</button>
      <button data-mode="follow" aria-pressed="false">Follow</button>
      <span class="sep"></span>
      <button id="auto" aria-pressed="true">Auto</button>
      <button id="h24" aria-pressed="true">24h</button>
      <button id="theme" aria-pressed="false">Light</button>
    </div>

    <script>
      (() => {
        "use strict";

        /* ---------- Grid layout: 15 x 8 clocks. Digits are 3 x 6 clocks. ---------- */
        const COLS = 15,
          ROWS = 8;
        const DIGIT_COLS = [1, 4, 8, 11]; // left column of each digit
        const COLON_COL = 7;
        const DIGIT_ROW = 1; // digits sit between a margin row top & bottom

        // 3 wide x 6 tall bitmaps; hands are derived from which neighbours are filled.
        const GLYPHS = {
          0: ["XXX", "X.X", "X.X", "X.X", "X.X", "XXX"],
          1: ["XX.", ".X.", ".X.", ".X.", ".X.", ".X."],
          2: ["XXX", "..X", "..X", "XXX", "X..", "XXX"],
          3: ["XXX", "..X", "..X", "XXX", "..X", "XXX"],
          4: ["X.X", "X.X", "X.X", "XXX", "..X", "..X"],
          5: ["XXX", "X..", "X..", "XXX", "..X", "XXX"],
          6: ["XXX", "X..", "X..", "XXX", "X.X", "XXX"],
          7: ["XXX", "..X", "..X", "..X", "..X", "..X"],
          8: ["XXX", "X.X", "X.X", "XXX", "X.X", "XXX"],
          9: ["XXX", "X.X", "X.X", "XXX", "..X", "XXX"],
        };
        const IDLE = [135, 135]; // resting pose: short diagonal dash
        const UP = 0,
          RIGHT = 90,
          DOWN = 180,
          LEFT = 270;

        function glyphAngles(ch) {
          const g = GLYPHS[ch];
          const out = [];
          for (let r = 0; r < 6; r++) {
            const row = [];
            for (let c = 0; c < 3; c++) {
              if (g[r][c] !== "X") {
                row.push(IDLE.slice());
                continue;
              }
              const n = [];
              if (r > 0 && g[r - 1][c] === "X") n.push(UP);
              if (c < 2 && g[r][c + 1] === "X") n.push(RIGHT);
              if (r < 5 && g[r + 1][c] === "X") n.push(DOWN);
              if (c > 0 && g[r][c - 1] === "X") n.push(LEFT);
              if (n.length === 0) row.push(IDLE.slice());
              else if (n.length === 1) row.push([n[0], n[0]]);
              else if (n.length === 2) row.push(n);
              else
                row.push(
                  n.includes(UP) && n.includes(DOWN)
                    ? [UP, DOWN]
                    : [RIGHT, LEFT],
                );
            }
            out.push(row);
          }
          return out;
        }

        let use24 = true;
        function timeGrid(date) {
          let h = date.getHours();
          if (!use24) {
            h = h % 12;
            if (h === 0) h = 12;
          }
          const hh = String(h).padStart(2, "0");
          const mm = String(date.getMinutes()).padStart(2, "0");
          const digits = (hh + mm).split("");
          const grid = [];
          for (let r = 0; r < ROWS; r++) {
            grid.push([]);
            for (let c = 0; c < COLS; c++) grid[r].push(IDLE.slice());
          }
          digits.forEach((d, i) => {
            const a = glyphAngles(d);
            for (let r = 0; r < 6; r++)
              for (let c = 0; c < 3; c++)
                grid[DIGIT_ROW + r][DIGIT_COLS[i] + c] = a[r][c];
          });
          // colon: two short upright dashes
          grid[DIGIT_ROW + 2][COLON_COL] = [UP, UP];
          grid[DIGIT_ROW + 4][COLON_COL] = [UP, UP];
          return grid;
        }

        /* ---------- State ---------- */
        const clocks = [];
        for (let r = 0; r < ROWS; r++)
          for (let c = 0; c < COLS; c++)
            clocks.push({
              r,
              c,
              s: [135, 135], // start angles of current tween
              K: [0, 0], // whole-turn offsets chosen at tween start
              t0: -1e9,
              dur: 1, // tween start & duration (seconds)
              fv: [135, 135], // smoothed angles for follow mode
              shown: [135, 135], // last drawn angles
            });

        let mode = "time";
        let auto = true;
        let tGrid = timeGrid(new Date());
        let lastKey = "";
        const pointer = { x: 0, y: 0, active: false };

        const cx = (COLS - 1) / 2,
          cy = (ROWS - 1) / 2;

        /* ---------- Target functions: continuous angles (degrees) per mode ---------- */
        function tangle(cl, dx, dy) {
          // angle from clock toward a point (0 = up, clockwise)
          return (Math.atan2(dx, -dy) * 180) / Math.PI;
        }
        function targetOf(cl, i, t) {
          const r = cl.r,
            c = cl.c;
          switch (mode) {
            case "time":
              return tGrid[r][c][i];
            case "ripple": {
              const dx = cx - c,
                dy = cy - r;
              const dist = Math.hypot(dx, dy);
              const phi = tangle(cl, dx, dy);
              const spread = 50 + 38 * Math.sin(dist * 0.85 - t * 1.5);
              return phi + (i === 0 ? spread : -spread);
            }
            case "wave": {
              const w = 62 * Math.sin(c * 0.55 + r * 0.25 - t * 1.3);
              return i === 0
                ? 90 + w
                : 270 - w * 0.55 + 20 * Math.sin(r * 0.6 + t);
            }
            case "swirl": {
              const dx = c - cx,
                dy = r - cy;
              const phi = tangle(cl, dx, dy);
              const dist = Math.hypot(dx, dy);
              const k = 28 * Math.sin(t * 0.7 - dist * 0.45);
              return phi + 90 + (i === 0 ? k : 180 + k * 0.4);
            }
            case "sweep": {
              const a = t * 38 + (c * 14 + r * 9);
              return i === 0 ? a : a + 180;
            }
            case "follow": {
              return cl.fv[i];
            }
          }
          return 0;
        }

        function pointerAngle(cl, i) {
          const px = pointer.active ? pointer.x : W / 2;
          const py = pointer.active ? pointer.y : H / 2;
          const x = bx + (cl.c + 0.5) * cell,
            y = by + (cl.r + 0.5) * cell;
          const a = tangle(cl, px - x, py - y);
          return i === 0 ? a - 18 : a + 18;
        }

        /* ---------- Tweens ---------- */
        const mod360 = (d) => ((d % 360) + 360) % 360;
        const ease = (p) =>
          p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;

        function beginCell(cl, now, delay, dur, dirs, extras) {
          for (let i = 0; i < 2; i++) {
            cl.s[i] = cl.shown[i];
            const U = targetOf(cl, i, now);
            const d = U - cl.s[i];
            let delta;
            const base = mod360(d);
            if (dirs[i] === "cw") delta = base + 360 * extras[i];
            else if (dirs[i] === "ccw")
              delta = (base === 0 ? 0 : base - 360) - 360 * extras[i];
            else {
              delta = ((((d + 180) % 360) + 360) % 360) - 180;
            }
            cl.K[i] = mode === "follow" ? 0 : delta - d;
            if (mode === "follow") cl.fv[i] = cl.s[i];
          }
          cl.t0 = now + delay;
          cl.dur = dur;
        }

        function startMode(newMode, now) {
          mode = newMode;
          document
            .querySelectorAll("[data-mode]")
            .forEach((b) =>
              b.setAttribute("aria-pressed", String(b.dataset.mode === mode)),
            );
          if (mode === "time") tGrid = timeGrid(new Date());
          for (const cl of clocks) {
            const dist = Math.hypot(cl.c - cx, cl.r - cy);
            if (mode === "time") {
              const ex = Math.random() < 0.5 ? 0 : 1;
              beginCell(
                cl,
                now,
                cl.c * 0.045 + Math.random() * 0.35,
                3.0 + ex * 0.9,
                ["cw", "ccw"],
                [ex, ex],
              );
            } else if (mode === "follow") {
              beginCell(cl, now, 0, 0.01, ["short", "short"], [0, 0]);
            } else {
              beginCell(cl, now, dist * 0.07, 2.4, ["short", "short"], [0, 0]);
            }
          }
        }

        // Minute tick: only clocks whose pose changes are re-animated.
        function updateTime(now) {
          const d = new Date();
          const key = d.getHours() + ":" + d.getMinutes() + ":" + use24;
          if (key === lastKey) return;
          lastKey = key;
          if (mode !== "time") return;
          const next = timeGrid(d);
          for (const cl of clocks) {
            const n = next[cl.r][cl.c],
              o = tGrid[cl.r][cl.c];
            if (
              (mod360(n[0] - o[0]) < 0.5 && mod360(n[1] - o[1]) < 0.5) ||
              (Math.abs(mod360(n[0] - o[0]) - 360) < 0.5 &&
                Math.abs(mod360(n[1] - o[1]) - 360) < 0.5)
            )
              continue;
            // set new target, then tween from the current shown pose
            tGrid[cl.r][cl.c] = n;
          }
          for (const cl of clocks) {
            const n = next[cl.r][cl.c];
            const cur = cl.shown;
            const same = [0, 1].every((i) => {
              const m = mod360(n[i] - cur[i]);
              return m < 0.5 || m > 359.5;
            });
            if (same) continue;
            const ex = Math.random() < 0.5 ? 0 : 1;
            beginCell(
              cl,
              now,
              Math.random() * 0.5 + cl.c * 0.02,
              3.0 + ex * 0.9,
              ["cw", "ccw"],
              [ex, ex],
            );
          }
        }

        /* ---------- Auto choreography ---------- */
        const PATTERNS = ["ripple", "wave", "swirl", "sweep"];
        let phase = "time",
          phaseEnd = 0,
          patIdx = Math.floor(Math.random() * PATTERNS.length);
        function scheduleAuto(now) {
          if (phase === "time") {
            phaseEnd = now + 18;
          } else {
            phaseEnd = now + 9;
          }
        }
        function advanceAuto(now) {
          if (phase === "time") {
            phase = "pattern";
            patIdx = (patIdx + 1) % PATTERNS.length;
            startMode(PATTERNS[patIdx], now);
          } else {
            phase = "time";
            startMode("time", now);
          }
          scheduleAuto(now);
        }

        /* ---------- Rendering ---------- */
        const canvas = document.getElementById("wall");
        const ctx = canvas.getContext("2d");
        let W = 0,
          H = 0,
          DPR = 1,
          cell = 40,
          bx = 0,
          by = 0,
          bw = 0,
          bh = 0;
        let theme = "dark";

        function resize() {
          DPR = Math.min(window.devicePixelRatio || 1, 2.5);
          W = window.innerWidth;
          H = window.innerHeight;
          canvas.width = Math.round(W * DPR);
          canvas.height = Math.round(H * DPR);
          const pad = 0.045;
          const availW = W * (1 - pad * 2),
            availH = H * 0.78;
          cell = Math.min(availW / COLS, availH / ROWS);
          bw = cell * COLS;
          bh = cell * ROWS;
          bx = (W - bw) / 2;
          by = (H - bh) / 2 - H * 0.02;
        }

        const PAL = {
          dark: {
            board: "#172544",
            board2: "#0f1a33",
            ring: "rgba(255,255,255,.07)",
            ringShade: "rgba(0,0,0,.35)",
            hand: "#dfe5ed",
            handHi: "rgba(255,255,255,.85)",
            handShadow: "rgba(0,0,0,.55)",
            edge: "rgba(0,0,0,.35)",
          },
          light: {
            board: "#f5f5f3",
            board2: "#eceae6",
            ring: "rgba(255,255,255,.95)",
            ringShade: "rgba(0,0,0,.13)",
            hand: "#14161a",
            handHi: "rgba(255,255,255,.0)",
            handShadow: "rgba(0,0,0,.22)",
            edge: "rgba(0,0,0,.12)",
          },
        };

        function drawBoard(p) {
          const rad = cell * 0.06;
          ctx.save();
          ctx.shadowColor =
            theme === "dark" ? "rgba(10,20,40,.45)" : "rgba(30,35,50,.22)";
          ctx.shadowBlur = cell * 0.7;
          ctx.shadowOffsetY = cell * 0.28;
          const g = ctx.createLinearGradient(bx, by, bx + bw, by + bh);
          g.addColorStop(0, p.board);
          g.addColorStop(1, p.board2);
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.roundRect(bx, by, bw, bh, rad);
          ctx.fill();
          ctx.restore();
          ctx.strokeStyle = p.edge;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.roundRect(bx + 0.5, by + 0.5, bw - 1, bh - 1, rad);
          ctx.stroke();
        }

        function drawDimple(x, y, R, p) {
          // recessed disc: dark rim on upper-left, light lip on lower-right
          ctx.lineWidth = Math.max(1, R * 0.045);
          ctx.strokeStyle = p.ringShade;
          ctx.beginPath();
          ctx.arc(x, y, R * 0.93, Math.PI * 0.75, Math.PI * 1.75);
          ctx.stroke();
          ctx.strokeStyle = p.ring;
          ctx.beginPath();
          ctx.arc(x, y, R * 0.93, Math.PI * 1.75, Math.PI * 2.75);
          ctx.stroke();
        }

        function drawHand(x, y, ang, len, wid, p) {
          const rad = (ang * Math.PI) / 180;
          const dx = Math.sin(rad) * len,
            dy = -Math.cos(rad) * len;
          ctx.lineCap = "round";
          // shadow
          ctx.strokeStyle = p.handShadow;
          ctx.lineWidth = wid;
          ctx.beginPath();
          ctx.moveTo(x + wid * 0.35, y + wid * 0.5);
          ctx.lineTo(x + dx + wid * 0.35, y + dy + wid * 0.5);
          ctx.stroke();
          // body
          ctx.strokeStyle = p.hand;
          ctx.lineWidth = wid;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + dx, y + dy);
          ctx.stroke();
          if (theme === "dark") {
            ctx.strokeStyle = p.handHi;
            ctx.lineWidth = wid * 0.28;
            ctx.beginPath();
            ctx.moveTo(x - wid * 0.18, y - wid * 0.18);
            ctx.lineTo(x + dx - wid * 0.18, y + dy - wid * 0.18);
            ctx.stroke();
          }
        }

        let prev = performance.now() / 1000;
        function frame() {
          const now = performance.now() / 1000;
          const dt = Math.min(0.05, now - prev);
          prev = now;

          updateTime(now);
          if (auto && now >= phaseEnd) advanceAuto(now);

          if (mode === "follow") {
            const k = 1 - Math.exp(-dt * 7);
            for (const cl of clocks)
              for (let i = 0; i < 2; i++) {
                const tgt = pointerAngle(cl, i);
                const d = ((((tgt - cl.fv[i]) % 360) + 540) % 360) - 180;
                cl.fv[i] += d * k;
              }
          }

          const p = PAL[theme];
          ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
          ctx.clearRect(0, 0, W, H);
          drawBoard(p);

          const R = cell / 2;
          const len = R * 0.97,
            wid = Math.max(2, R * 0.115);

          for (const cl of clocks) {
            const x = bx + (cl.c + 0.5) * cell,
              y = by + (cl.r + 0.5) * cell;
            drawDimple(x, y, R, p);
            for (let i = 0; i < 2; i++) {
              const U = targetOf(cl, i, now) + cl.K[i];
              let a;
              if (now < cl.t0) a = cl.s[i];
              else {
                const q = (now - cl.t0) / cl.dur;
                a = q >= 1 ? U : cl.s[i] + (U - cl.s[i]) * ease(q);
              }
              cl.shown[i] = a;
            }
            // draw the hand that is "behind" first for a stacked look
            drawHand(x, y, cl.shown[1], len, wid, p);
            drawHand(x, y, cl.shown[0], len, wid, p);
          }
          requestAnimationFrame(frame);
        }

        /* ---------- Controls ---------- */
        const bar = document.getElementById("bar");
        document.querySelectorAll("[data-mode]").forEach((b) =>
          b.addEventListener("click", () => {
            auto = false;
            document
              .getElementById("auto")
              .setAttribute("aria-pressed", "false");
            startMode(b.dataset.mode, performance.now() / 1000);
          }),
        );
        document.getElementById("auto").addEventListener("click", (e) => {
          auto = !auto;
          e.currentTarget.setAttribute("aria-pressed", String(auto));
          if (auto) {
            const now = performance.now() / 1000;
            phase = mode === "time" ? "time" : "pattern";
            scheduleAuto(now);
          }
        });
        document.getElementById("h24").addEventListener("click", (e) => {
          use24 = !use24;
          e.currentTarget.setAttribute("aria-pressed", String(use24));
          e.currentTarget.textContent = use24 ? "24h" : "12h";
          lastKey = "";
          if (mode === "time") startMode("time", performance.now() / 1000);
        });
        document.getElementById("theme").addEventListener("click", (e) => {
          theme = theme === "dark" ? "light" : "dark";
          document.documentElement.dataset.theme = theme;
          e.currentTarget.textContent = theme === "dark" ? "Light" : "Dark";
          e.currentTarget.setAttribute(
            "aria-pressed",
            String(theme === "light"),
          );
        });

        window.addEventListener("pointermove", (e) => {
          pointer.x = e.clientX;
          pointer.y = e.clientY;
          pointer.active = true;
        });
        window.addEventListener("pointerdown", (e) => {
          pointer.x = e.clientX;
          pointer.y = e.clientY;
          pointer.active = true;
        });

        // fade the control bar when the pointer is still
        let idleTimer;
        function wake() {
          bar.classList.remove("idle");
          clearTimeout(idleTimer);
          idleTimer = setTimeout(() => bar.classList.add("idle"), 4000);
        }
        ["pointermove", "pointerdown", "keydown"].forEach((ev) =>
          window.addEventListener(ev, wake),
        );
        wake();

        window.addEventListener("resize", resize);
        resize();

        // Opening moment: start from the idle pose and sweep into the current time.
        const t0 = performance.now() / 1000;
        lastKey = (() => {
          const d = new Date();
          return d.getHours() + ":" + d.getMinutes() + ":" + use24;
        })();
        startMode("time", t0);
        scheduleAuto(t0);
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
