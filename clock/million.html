<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>A million times clock</title>
        <style media="screen">
            html {
                height: 100%;
            }
            body {
                --scene: #302b1d;
                --ink: #f1dca0;
                background-color: var(--scene);
                min-height: 100%;
                margin: 0;
                display: flex;
                flex-direction: column;
                font-family: monospace;
                color: var(--ink);
                transition: background-color 300ms ease, color 300ms ease;
            }
            .header {
                text-align: center;
                padding: 16px 20px;
            }
            .header h1 {
                margin: 0;
                font-size: 14px;
                font-weight: 400;
                opacity: .8;
            }
            .footer {
                text-align: center;
                padding: 8px;
            }
            .clock {
                flex-grow: 1;
                position: relative;
                display: flex;
                align-items: center;
                overflow: hidden;
                background-color: var(--scene) !important;
            }
            .clock > div {
                transform: scale(var(--clock-scale, 1));
            }
            .clock canvas:first-child {
                filter: var(--dial-filter, none);
                transition: filter 300ms ease;
            }
            .clock canvas:last-child {
                filter: var(--hand-filter, none);
                transition: filter 300ms ease;
            }
            #theme-panel {
                position: fixed;
                z-index: 2;
                top: 12px;
                right: 12px;
            }
        </style>
    </head>
    <body>
        <div class="header">
            <h1>A million times clock implemented in JavaScript</h1>
            <p>
                <!-- <a href="https://www.youtube.com/watch?v=L88DlFh8aWM" target="_blank">Watch the original</a> &middot;
                <a href="https://github.com/malte-wessel/a-million-times" target="_blank">View source on github</a> -->
            </p>
        </div>
        <div class="clock"></div>
        <div class="footer">
            <!-- Made by <a href="https://twitter.com/drbreak" target="_blank">Malte Wessel</a> -->
        </div>
        <div id="theme-panel"></div>
    <script type="text/javascript" src="main.bundle.js"></script>
    <script type="module" src="theme-panel.js"></script></body>
</html>
