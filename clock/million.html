<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>A million times clock</title>
        <style media="screen">
            html {
                height: 100%;
            }
            body {
                --ink: #d4a82e;
                background-color: #fff;
                height: 100vh;
                height: 100dvh;
                margin: 0;
                display: flex;
                flex-direction: column;
                font-family: monospace;
                color: var(--ink);
                transition: color 300ms ease;
                overflow: hidden;
            }
            .header {
                text-align: center;
                padding: 16px 20px;
            }
            .header h1 {
                color: #000;
                margin: 0;
                font-size: 14px;
                font-weight: 400;
                opacity: .8;
            }
            .footer {
                text-align: center;
                padding: 8px;
            }
            .clock {
                flex: 1 1 auto;
                min-height: 0;
                min-width: 0;
                position: relative;
                display: flex;
                align-items: center;
                overflow: hidden;
                background-color: #fff !important;
            }
            .visually-hidden {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0, 0, 0, 0);
                white-space: nowrap;
                border: 0;
            }
            .clock > div {
                transform: scale(var(--clock-scale, 1));
            }
            .clock canvas:first-child {
                filter: var(--dial-filter, none);
                transition: filter 300ms ease;
            }
            .clock canvas:last-child {
                filter: var(--hand-filter, none);
                transition: filter 300ms ease;
            }
            #theme-panel {
                position: fixed;
                z-index: 2;
                top: calc(12px + env(safe-area-inset-top));
                right: calc(12px + env(safe-area-inset-right));
            }
            @media (max-width: 600px) {
                .header {
                    padding: calc(12px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 8px calc(12px + env(safe-area-inset-left));
                }
                #theme-panel {
                    position: static;
                    width: min(100%, 280px);
                    margin: 12px auto 0;
                }
            }
        </style>
    </head>
    <body>
        <div class="header">
            <h1>A million times clock</h1>
            <div id="theme-panel"></div>
        </div>
        <div class="clock" role="group" aria-label="Animated clock">
            <time class="visually-hidden" id="clock-time"></time>
        </div>
        <div class="footer">
            <!-- Made by <a href="https://twitter.com/drbreak" target="_blank">Malte Wessel</a> -->
        </div>
    <script type="text/javascript" src="main.bundle.js"></script>
    <script type="module" src="theme-panel.js"></script></body>
</html>
