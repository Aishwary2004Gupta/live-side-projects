<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>A million times clock</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
        <style media="screen">
            :root {
                --paper-bg: #dfe1dc;
                --panel-bg: #f5f4f1;
                --panel-edge: rgba(25, 25, 23, 0.12);
                --panel-shadow: rgba(27, 28, 24, 0.16);
                --ink: #d4a82e;
                --dial-filter: none;
                --hand-filter: none;
            }

            html {
                height: 100%;
            }

            body {
                --ink: #d4a82e;
                background: linear-gradient(180deg, #dfe1dc 0%, #d4d5cf 100%);
                min-height: 100vh;
                min-height: 100dvh;
                margin: 0;
                display: flex;
                flex-direction: column;
                font-family: monospace;
                color: var(--ink);
                transition: color 300ms ease;
                overflow: hidden;
            }

            .header {
                text-align: center;
                padding: 20px 20px 10px;
            }

            .header h1 {
                color: rgba(18, 19, 16, 0.72);
                margin: 0;
                font-family: 'Space Grotesk', sans-serif;
                font-size: clamp(12px, 1.6vw, 18px);
                font-weight: 700;
                letter-spacing: 0.12em;
                text-transform: uppercase;
            }

            .footer {
                text-align: center;
                padding: 8px;
            }

            .clock {
                position: relative;
                flex: 1 1 auto;
                min-height: 0;
                min-width: 0;
                width: min(92vw, 1360px);
                margin: 10px auto 18px;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
                border-radius: 18px;
                background: linear-gradient(145deg, rgba(255,255,255,0.68), rgba(236,235,232,0.98));
                border: 1px solid var(--panel-edge);
                box-shadow:
                    0 28px 36px rgba(36, 38, 32, 0.08),
                    inset 0 1px 0 rgba(255,255,255,0.96),
                    inset 0 -18px 25px rgba(0,0,0,0.03);
                perspective: 1600px;
                transform-style: preserve-3d;
            }

            .clock::before {
                content: "";
                position: absolute;
                inset: 12px;
                border-radius: 14px;
                border: 1px solid rgba(17, 18, 15, 0.05);
                box-shadow: inset 0 8px 18px rgba(255,255,255,0.6);
                pointer-events: none;
            }

            .visually-hidden {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0, 0, 0, 0);
                white-space: nowrap;
                border: 0;
            }

            .clock > div {
                position: relative;
                transform: scale(var(--clock-scale, 1)) rotateX(8deg) rotateY(-7deg) translateZ(18px);
                transform-style: preserve-3d;
                filter: drop-shadow(0 12px 12px rgba(21, 21, 22, 0.08));
                transition: transform 320ms ease;
            }

            .clock canvas:first-child {
                filter: var(--dial-filter, none) drop-shadow(0 10px 12px rgba(0,0,0,0.08));
                transition: filter 300ms ease;
            }

            .clock canvas:last-child {
                filter: var(--hand-filter, none) drop-shadow(0 9px 10px rgba(0,0,0,0.09));
                transition: filter 300ms ease;
            }

            #theme-panel {
                position: fixed;
                z-index: 2;
                top: calc(12px + env(safe-area-inset-top));
                right: calc(12px + env(safe-area-inset-right));
            }

            @media (max-width: 600px) {
                body {
                    overflow: auto;
                }

                .header {
                    padding: calc(12px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 8px calc(12px + env(safe-area-inset-left));
                }

                .clock {
                    width: min(96vw, 900px);
                    margin: 4px auto 14px;
                    min-height: 420px;
                }

                #theme-panel {
                    position: static;
                    width: min(100%, 280px);
                    margin: 12px auto 0;
                }
            }
        </style>
    </head>
    <body>
        <div class="header">
            <h1>A million times clock</h1>
            <div id="theme-panel"></div>
        </div>
        <div class="clock" role="group" aria-label="Animated clock">
            <time class="visually-hidden" id="clock-time"></time>
        </div>
        <div class="footer">
            <!-- Made by <a href="https://twitter.com/drbreak" target="_blank">Malte Wessel</a> -->
        </div>
    <script type="text/javascript" src="main.bundle.js"></script>
    <script type="module" src="theme-panel.js"></script></body>
</html>
