<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Million Times — Kinetic Wall Clock</title>
<style>
  :root {
    --frame: #e8dcb5;
    --bg:    #181410;
    --rod:   #a89f7c;
    --on:    #f3e6bc;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: linear-gradient(135deg, #bfae6e 0%, #887347 100%);
  }

  /* The installation frame */
  #frame {
    background: var(--bg);
    border: 18px solid var(--frame);
    border-radius: 3px;
    padding: 36px 34px;
    box-shadow:
      inset 0 0 90px rgba(0,0,0,.85),
      0 35px 80px rgba(0,0,0,.55);
    position: relative;
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(28, 12px);
    grid-template-rows: repeat(14, 12px);
    gap: 5px;
  }

  .rod {
    width: 3px;
    height: 10px;
    background: var(--rod);
    border-radius: 1px;
    opacity: 0.85;
    /* default diagonal tick */
    transform: rotate(45deg);
    transition: transform .7s cubic-bezier(.4,0,.2,1), opacity .7s ease, background .7s ease;
    transform-origin: center center;
  }

  /* The digit windows are just empty grid cells that get "lit" by JS.
     The background rods stay in those windows but are overwritten when a digit is active. */
  .rod.on {
    background: var(--on);
    opacity: 1;
    box-shadow: 0 0 6px rgba(243,230,188,.45);
  }
</style>
</head>
<body>

<div id="frame">
  <div id="grid"></div>
</div>

<script>
(() => {
  "use strict";

  const COLS = 28, ROWS = 14;

  /* 
   * 7-segment mapping: [top, top-right, bottom-right, bottom, bottom-left, top-left, middle]
   * Each segment is a list of grid-offsets {x,y,hor} inside a 5x7 digit window.
   */
  const SEG = {
    0:{t:[{x:1,y:0,h:1},{x:3,y:0,h:1}], r:[{x:4,y:1,v:1},{x:4,y:2,v:1}], br:[{x:4,y:4,v:1},{x:4,y:5,v:1}], b:[{x:1,y:6,h:1},{x:3,y:6,h:1}], bl:[{x:0,y:4,v:1},{x:0,y:5,v:1}], tl:[{x:0,y:1,v:1},{x:0,y:2,v:1}], m:[]},
    1:{t:[], r:[{x:4,y:1,v:1},{x:4,y:2,v:1},{x:4,y:3,v:1}], br:[{x:4,y:3,v:1},{x:4,y:4,v:1},{x:4,y:5,v:1}], b:[], bl:[], tl:[], m:[]},
    2:{t:[{x:1,y:0,h:1},{x:3,y:0,h:1}], r:[{x:4,y:1,v:1},{x:4,y:2,v:1}], br:[], b:[{x:1,y:4,h:1},{x:3,y:4,h:1}], bl:[{x:0,y:4,v:1},{x:0,y:5,v:1}], tl:[], m:[{x:1,y:3,h:1},{x:3,y:3,h:1}]},
    3:{t:[{x:1,y:0,h:1},{x:3,y:0,h:1}], r:[{x:4,y:1,v:1},{x:4,y:2,v:1}], br:[{x:4,y:4,v:1},{x:4,y:5,v:1}], b:[{x:1,y:6,h:1},{x:3,y:6,h:1}], bl:[], tl:[], m:[{x:1,y:3,h:1},{x:3,y:3,h:1}]},
    4:{t:[], r:[{x:4,y:1,v:1},{x:4,y:2,v:1},{x:4,y:3,v:1}], br:[{x:4,y:3,v:1},{x:4,y:4,v:1},{x:4,y:5,v:1}], b:[], bl:[], tl:[{x:0,y:1,v:1},{x:0,y:2,v:1}], m:[{x:1,y:3,h:1},{x:3,y:3,h:1}]},
    5:{t:[{x:1,y:0,h:1},{x:3,y:0,h:1}], r:[], br:[{x:4,y:4,v:1},{x:4,y:5,v:1}], b:[{x:1,y:6,h:1},{x:3,y:6,h:1}], bl:[{x:0,y:4,v:1},{x:0,y:5,v:1}], tl:[{x:0,y:1,v:1},{x:0,y:2,v:1}], m:[{x:1,y:3,h:1},{x:3,y:3,h:1}]},
    6:{t:[{x:1,y:0,h:1},{x:3,y:0,h:1}], r:[], br:[{x:4,y:4,v:1},{x:4,y:5,v:1}], b:[{x:1,y:6,h:1},{x:3,y:6,h:1}], bl:[{x:0,y:4,v:1},{x:0,y:5,v:1}], tl:[{x:0,y:1,v:1},{x:0,y:2,v:1}], m:[{x:1,y:3,h:1},{x:3,y:3,h:1}]},
    7:{t:[{x:1,y:0,h:1},{x:3,y:0,h:1}], r:[{x:4,y:1,v:1},{x:4,y:2,v:1},{x:4,y:3,v:1}], br:[{x:4,y:3,v:1},{x:4,y:4,v:1}], b:[], bl:[], tl:[], m:[]},
    8:{t:[{x:1,y:0,h:1},{x:3,y:0,h:1}], r:[{x:4,y:1,v:1},{x:4,y:2,v:1}], br:[{x:4,y:4,v:1},{x:4,y:5,v:1}], b:[{x:1,y:6,h:1},{x:3,y:6,h:1}], bl:[{x:0,y:4,v:1},{x:0,y:5,v:1}], tl:[{x:0,y:1,v:1},{x:0,y:2,v:1}], m:[{x:1,y:3,h:1},{x:3,y:3,h:1}]},
    9:{t:[{x:1,y:0,h:1},{x:3,y:0,h:1}], r:[{x:4,y:1,v:1},{x:4,y:2,v:1}], br:[{x:4,y:4,v:1},{x:4,y:5,v:1}], b:[{x:1,y:6,h:1},{x:3,y:6,h:1}], bl:[], tl:[{x:0,y:1,v:1},{x:0,y:2,v:1}], m:[{x:1,y:3,h:1},{x:3,y:3,h:1}]},
  };

  // Build grid
  const grid = document.getElementById('grid');
  const rods = [];
  for(let y=0; y<ROWS; y++){
    for(let x=0; x<COLS; x++){
      const d = document.createElement('div');
      d.className = 'rod';
      grid.appendChild(d);
      rods.push({el: d, x, y});
    }
  }

  function idx(x,y){ return y*COLS + x; }

  function clearWindow(oX, oY){
    for(let dy=-1; dy<=7; dy++){
      for(let dx=-1; dx<=5; dx++){
        const cx = oX+dx, cy = oY+dy;
        if(cx>=0 && cx<COLS && cy>=0 && cy<ROWS){
          const r = rods[idx(cx,cy)];
          r.el.classList.remove('on');
          r.el.style.transform = 'rotate(45deg)';
          r.el.style.background = 'var(--rod)';
        }
      }
    }
  }

  function setDigit(val, oX, oY){
    const s = SEG[val];
    const segs = [s.t, s.r, s.br, s.b, s.bl, s.tl, s.m];
    const names = ['t','r','br','b','bl','tl','m'];
    // Helper to add a segment cell
    const draw = (list, rot) => {
      list.forEach(p => {
        // p is a cell offset inside digit; adjust origin
        const cx = oX + p.x, cy = oY + p.y;
        if(cx>=0 && cx<COLS && cy>=0 && cy<ROWS){
          const r = rods[idx(cx,cy)];
          r.el.classList.add('on');
          // horizontal segments -> rotate 90, vertical -> 0
          r.el.style.transform = rot === 'h' ? 'rotate(90deg)' : 'rotate(0deg)';
          r.el.style.background = 'var(--on)';
        }
      });
    };

    draw(s.t, 'h'); draw(s.r, 'v'); draw(s.br, 'v');
    draw(s.b, 'h'); draw(s.bl, 'v'); draw(s.tl, 'v');
    draw(s.m, 'h');
  }

  function drawTime(){
    const now = new Date();
    const hh = String(now.getHours()).padStart(2,'0');
    const mm = String(now.getMinutes()).padStart(2,'0');
    const digits = hh + mm; // 4 chars

    // Layout: 4 digits, colon between digit 2 and 3
    // We approximate positions: start at x=3, width per digit = 6, gap=2
    const startX = 3, gap = 2, dw = 6;

    // Clear all digit windows first (simplistic: clear whole grid background)
    // Instead, we rely on the fact that only digit windows change; 
    // but easiest is to reset all to diagonal, then draw new.
    rods.forEach(r => {
      r.el.classList.remove('on');
      r.el.style.background = 'var(--rod)';
      r.el.style.transform = 'rotate(45deg)';
    });

    // Draw digits
    digits.split('').forEach((ch, i) => {
      const nx = startX + i*(dw+gap) + (i>=2 ? 2 : 0); // shift after colon
      // Actually let's hard-place them for visual balance matching image
      const positions = [
        {x:3, y:4},  // h1
        {x:9, y:4},  // h2
        {x:16,y:4},  // m1
        {x:22,y:4},  // m2
      ];
      setDigit(ch, positions[i].x, positions[i].y);
    });

    // Colon (vertical dots) between digit 2 and 3
    // At roughly x=13, y=5 and y=9
    const colonX = 13, colonY = [5,9];
    colonY.forEach(y => {
      const r = rods[idx(colonX, y)];
      if(r){
        r.el.classList.add('on');
        r.el.style.transform = 'rotate(0deg)';
        r.el.style.background = 'var(--on)';
      }
    });
  }

  // Background kinetic drift (diagonal shimmer)
  let t = 0;
  function drift(){
    t++;
    rods.forEach(r => {
      if(!r.el.classList.contains('on')){
        const noise = Math.sin(t*0.03 + r.x*0.5 + r.y*0.7);
        const a = 45 + noise * 12;
        r.el.style.transform = `rotate(${a}deg)`;
        r.el.style.opacity = 0.7 + noise*0.3;
      }
    });
    requestAnimationFrame(drift);
  }

  // Init
  drawTime();
  setInterval(drawTime, 1000);
  requestAnimationFrame(drift);
})();
</script>

</body>
</html>
