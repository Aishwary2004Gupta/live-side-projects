<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eiffel Tower – Rust Over Time</title>
<style>
  html,body{margin:0;height:100%;background:#0d0f12;color:#e8e2d9;font:14px/1.4 system-ui,sans-serif;overflow:hidden}
  canvas{display:block}
  #ui{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);width:min(760px,92vw);background:rgba(15,16,18,.78);
      backdrop-filter:blur(8px);border:1px solid #ffffff18;border-radius:14px;padding:14px 18px}
  #top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  #year{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
  #stage{color:#d9915a;font-size:13px}
  input[type=range]{width:100%;margin:10px 0 6px;accent-color:#c8662a}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  button,select{background:#2a2c30;color:inherit;border:1px solid #ffffff22;border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
  button:hover{background:#383b40}
  #load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0d0f12;z-index:5;gap:12px}
  #bar{width:260px;height:6px;background:#2a2c30;border-radius:3px;overflow:hidden}
  #bar i{display:block;height:100%;width:0;background:#c8662a}
  #credit{position:fixed;top:10px;left:12px;font-size:11px;opacity:.55;max-width:60vw}
  #credit a{color:inherit}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="load"><div id="lmsg">Loading tower…</div><div id="bar"><i></i></div></div>
<div id="credit"></div>
<div id="ui">
  <div id="top"><div id="year">Year 0</div><div id="stage">Fresh paint</div></div>
  <input id="slider" type="range" min="0" max="150" step="0.1" value="0">
  <div class="row">
    <button id="play">▶ Play</button>
    <button id="reset">⟲ Reset</button>
    <label>Speed <select id="speed"><option value="4">Slow</option><option value="8" selected>Normal</option><option value="25">Fast</option></select></label>
    <label>Model <select id="model"><option value="detailed">Detailed (155 MB)</option><option value="light">Light (17 MB)</option></select></label>
    <button id="rot">Auto-rotate: on</button>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

addEventListener('error',e=>{const m=document.getElementById('lmsg');if(m){m.textContent='Error: '+e.message;document.getElementById('load').style.display='flex';}});
const MAX_YEARS = 150, TOWER_H = 330;
const MODELS = {
  detailed:{paths:['models/detailed/scene.gltf','detailed/scene.gltf','eiffel_tower__1_/scene.gltf','eiffel_tower (1)/scene.gltf','eiffel_tower_1/scene.gltf','scene.gltf'],credit:'"Eiffel Tower" by Fre1231 (CC-BY-4.0)',src:'https://sketchfab.com/3d-models/eiffel-tower-4db4b6809be7488cab729ef182fbc3bb'},
  light:{paths:['models/light/scene.gltf','light/scene.gltf','eiffel_tower/scene.gltf'],credit:'"Eiffel Tower" by Johnson Martin (CC-BY-4.0)',src:'https://sketchfab.com/3d-models/eiffel-tower-6830e60d2c1048f2a33e92679664f652'}
};

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const skyTop = new THREE.Color(0x4d79b0), skyHorizon = new THREE.Color(0xcfd8e0);
scene.fog = new THREE.Fog(0xcfd8e0, 500, 2200);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.5;

// sky dome
const sky = new THREE.Mesh(new THREE.SphereGeometry(3000,32,16), new THREE.ShaderMaterial({
  side:THREE.BackSide, depthWrite:false, fog:false,
  uniforms:{top:{value:skyTop}, hor:{value:skyHorizon}, grey:{value:0}},
  vertexShader:'varying vec3 p;void main(){p=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform vec3 top,hor;uniform float grey;varying vec3 p;void main(){float h=clamp(normalize(p).y,0.,1.);vec3 c=mix(hor,top,pow(h,.6));c=mix(c,vec3(dot(c,vec3(.33))),grey*.6)*(1.-grey*.2);gl_FragColor=vec4(c,1.);}'
}));
scene.add(sky);

const sun = new THREE.DirectionalLight(0xfff1dc, 2.6);
sun.position.set(300,500,250); scene.add(sun);
scene.add(new THREE.HemisphereLight(0xaac4e6,0x3a3328,0.6));

const ground = new THREE.Mesh(new THREE.CircleGeometry(2500,64).rotateX(-Math.PI/2),
  new THREE.MeshStandardMaterial({color:0x4b5a3a,roughness:1}));
ground.position.y = -0.2; scene.add(ground);

const camera = new THREE.PerspectiveCamera(45,innerWidth/innerHeight,1,6000);
camera.position.set(330,170,420);
const controls = new OrbitControls(camera,renderer.domElement);
controls.target.set(0,140,0); controls.enableDamping = true;
controls.maxPolarAngle = Math.PI*0.495; controls.minDistance = 40; controls.maxDistance = 1500;
controls.autoRotate = true; controls.autoRotateSpeed = 0.5;
controls.update();

// ---------- procedural rust ----------
const uniforms = {uRust:{value:0}, uTime:{value:0}};
const NOISE = /* glsl */`
varying vec3 vWPos; varying vec3 vWNrm;
uniform float uRust;
float h31(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float vnoise(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);
  return mix(mix(mix(h31(i),h31(i+vec3(1,0,0)),f.x),mix(h31(i+vec3(0,1,0)),h31(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(h31(i+vec3(0,0,1)),h31(i+vec3(1,0,1)),f.x),mix(h31(i+vec3(0,1,1)),h31(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm(vec3 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*vnoise(p);p=p*2.03+17.1;a*=.5;}return s;}
// susceptibility 0..1 : where rust starts first
float suscept(vec3 p, vec3 n){
  float big = fbm(p*.045);                           // big weathered zones
  float mid = fbm(p*.35+5.);                         // patches
  float streak = fbm(vec3(p.x*1.1,p.y*.07,p.z*1.1)+9.); // rain-run streaks (vertical)
  float up = clamp(n.y*.5+.5,0.,1.);                 // water pools on upward faces
  float low = 1.-clamp(p.y/330.,0.,1.);              // damp lower structure
  return big*.34 + mid*.26 + streak*.24 + up*.10 + low*.06;
}
float rustMaskAt(vec3 p, vec3 n){
  float s = suscept(p,n);
  float thr = mix(.80,.30,uRust);                    // threshold sweeps down as years pass
  return smoothstep(thr, thr+.07, s);
}`;

function makeRustMaterial(base, kind){
  const m = base.clone();
  m.side = THREE.DoubleSide;
  m.userData.kind = kind;
  const strength = {iron:1.0, light:0.45, glass:0.12, stone:0.1}[kind];
  m.onBeforeCompile = sh => {
    sh.uniforms.uRust = uniforms.uRust;
    sh.uniforms.uStrength = {value:strength};
    sh.vertexShader = 'varying vec3 vWPos; varying vec3 vWNrm;\n' + sh.vertexShader.replace('#include <begin_vertex>',
      `#include <begin_vertex>
       vWPos=(modelMatrix*vec4(transformed,1.)).xyz;
       vWNrm=normalize(mat3(modelMatrix)*objectNormal);`);
    sh.fragmentShader = 'uniform float uStrength;\n' + NOISE + sh.fragmentShader
      .replace('#include <color_fragment>', `#include <color_fragment>
        vec3 wn = normalize(vWNrm);
        float R = uRust*uStrength;
        float s = suscept(vWPos, wn);
        float thr = mix(.80,.30,R);
        float rust = smoothstep(thr, thr+.07, s);           // orange rust
        float deep = smoothstep(thr+.10, thr+.24, s)*smoothstep(.35,.9,R); // heavy pitted corrosion
        float faded = smoothstep(thr-.28, thr, s)*smoothstep(0.,.3,R);       // chalking / faded paint
        float pit = fbm(vWPos*3.2), grit = fbm(vWPos*14.);
        float edge = rust*(1.-smoothstep(.0,.22,s-thr));     // bare-steel rim where paint lifts
        vec3 c = diffuseColor.rgb;
        c = mix(c, c*1.25+vec3(.05,.045,.04), faded*.55);    // sun-bleached paint
        c = mix(c, vec3(.16,.15,.14), edge*.7);              // exposed grey steel rim
        vec3 rustCol = mix(vec3(.62,.26,.07), vec3(.40,.15,.06), pit);
        rustCol = mix(rustCol, vec3(.20,.075,.035), deep*(.5+.5*grit));
        rustCol *= .75+.5*grit;
        c = mix(c, rustCol, rust);
        diffuseColor.rgb = c;`)
      .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
        roughnessFactor = mix(roughnessFactor, .97, rust);
        roughnessFactor = mix(roughnessFactor, .85, faded*.5*(1.-rust));`)
      .replace('#include <metalnessmap_fragment>', `#include <metalnessmap_fragment>
        metalnessFactor = mix(metalnessFactor, .05, rust);`)
      .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
        {
          float hgt = rust*(pit*.8+grit*.5);
          vec3 sx=dFdx(-vViewPosition), sy=dFdy(-vViewPosition);
          vec3 r1=cross(sy,normal), r2=cross(normal,sx);
          float det=dot(sx,r1);
          vec3 grad=sign(det)*(dFdx(hgt)*r1+dFdy(hgt)*r2);
          normal=normalize(abs(det)*normal-grad*.35);
        }`);
  };
  m.customProgramCacheKey = () => 'rust-'+kind;
  return m;
}

function classify(mat, name){
  const n = (mat.name||'').toLowerCase();
  if (mat.transparent || n.includes('glaz') || n.includes('002')) return 'glass';
  if (n.includes('limestone')) return 'stone';
  if (n.includes('antenna') || n.includes('pavilion')) return 'light';
  return 'iron';
}

// ---------- falling flakes ----------
const FL = 1600;
const flakeGeo = new THREE.BufferGeometry();
const fpos = new Float32Array(FL*3), fvel = new Float32Array(FL*2);
flakeGeo.setAttribute('position', new THREE.BufferAttribute(fpos,3));
const flakes = new THREE.Points(flakeGeo, new THREE.PointsMaterial({color:0x8a3a14,size:1.1,sizeAttenuation:true,transparent:true,opacity:.9,depthWrite:false}));
flakes.frustumCulled = false; scene.add(flakes);
function respawn(i){
  const y = Math.random()*300+5, rad = 55*(1-y/380)+4;
  const a = Math.random()*Math.PI*2, r = Math.random()*rad;
  fpos[i*3]=Math.cos(a)*r; fpos[i*3+1]=y; fpos[i*3+2]=Math.sin(a)*r;
  fvel[i*2]=1.5+Math.random()*3; fvel[i*2+1]=(Math.random()-.5)*2;
}
for(let i=0;i<FL;i++) respawn(i);

// ---------- model loading ----------
let tower = null;
const loader = new GLTFLoader();
const loadEl = document.getElementById('load'), barI = document.querySelector('#bar i'), lmsg = document.getElementById('lmsg');

function loadModel(key){
  const cfg = MODELS[key];
  loadEl.style.display='flex'; barI.style.width='0'; lmsg.textContent='Loading tower…';
  document.getElementById('credit').innerHTML = `${cfg.credit} – <a href="${cfg.src}" target="_blank" rel="noopener">source</a>`;
  if (tower){ tower.traverse(o=>{ if(o.isMesh){o.geometry.dispose();} }); scene.remove(tower); tower=null; }
  const override = new URLSearchParams(location.search).get('src');
  const candidates = override ? [override] : cfg.paths;
  (async()=>{
    let found=null;
    for(const u of candidates){ try{ const r=await fetch(u,{method:'HEAD'}); if(r.ok){found=u;break;} }catch(e){} }
    if(!found){
      lmsg.innerHTML='Could not find the model file.<br><small>Tried: '+candidates.join(', ')+'<br>Put the unzipped folder (scene.gltf + scene.bin) at one of those paths next to this HTML file, or open this page with <b>?src=your/folder/scene.gltf</b></small>';
      return;
    }
    lmsg.textContent='Loading tower…';
    doLoad(found);
  })();
  function doLoad(path){
  loader.load(path, gltf=>{
    const root = gltf.scene;
    const box = new THREE.Box3().setFromObject(root);
    const size = box.getSize(new THREE.Vector3());
    const k = TOWER_H/size.y;
    const holder = new THREE.Group(); holder.add(root);
    holder.scale.setScalar(k);
    const c = box.getCenter(new THREE.Vector3());
    holder.position.set(-c.x*k, -box.min.y*k, -c.z*k);
    const cache = new Map();
    root.traverse(o=>{
      if(!o.isMesh) return;
      const mats = Array.isArray(o.material)?o.material:[o.material];
      const out = mats.map(m=>{
        if(!cache.has(m)){
          const kind = classify(m);
          const base = m.isMeshStandardMaterial ? m : new THREE.MeshStandardMaterial({color:kind==='glass'?0x2a3a42:0x3b2a1e,roughness:.85,metalness:kind==='iron'?.4:0});
          cache.set(m, makeRustMaterial(base,kind));
          if(kind==='glass'){const r=cache.get(m);r.transparent=true;r.opacity=Math.min(r.opacity,.55);}
        }
        return cache.get(m);
      });
      o.material = Array.isArray(o.material)?out:out[0];
    });
    tower = holder; scene.add(tower);
    loadEl.style.display='none';
    startShow();
  }, e=>{
    if(e.total){ const p=e.loaded/e.total; barI.style.width=(p*100)+'%'; lmsg.textContent=`Loading tower… ${(e.loaded/1048576).toFixed(0)} / ${(e.total/1048576).toFixed(0)} MB`; }
    else lmsg.textContent=`Loading tower… ${(e.loaded/1048576).toFixed(0)} MB`;
  }, err=>{ lmsg.textContent='Failed to load model – serve this folder over HTTP (see README).'; console.error(err); });
  }
}

// ---------- UI ----------
const slider=document.getElementById('slider'), yearEl=document.getElementById('year'), stageEl=document.getElementById('stage');
let years=0, playing=false;
const STAGES=[[0,'Fresh paint'],[12,'Paint dulling and chalking'],[30,'First rust blooms at joints'],[55,'Paint flaking, rust spreading'],[85,'Heavy corrosion, pitted steel'],[115,'Structural decay']];
function setYears(y){
  years=Math.max(0,Math.min(MAX_YEARS,y)); slider.value=years;
  // ease so early years change slowly, middle quickly
  const t=years/MAX_YEARS; uniforms.uRust.value=t*t*(3-2*t)*0.2+t*0.8;
  yearEl.textContent='Year '+Math.round(years);
  stageEl.textContent=[...STAGES].reverse().find(s=>years>=s[0])[1];
  sky.material.uniforms.grey.value=t*.5;
  scene.fog.color.copy(skyHorizon).lerp(new THREE.Color(0x9a9a96),t*.5);
  ground.material.color.set(0x4b5a3a).lerp(new THREE.Color(0x5b5445),t);
}
slider.oninput=()=>{playing=false;playBtn.textContent='▶ Play';setYears(+slider.value)};
const playBtn=document.getElementById('play');
playBtn.onclick=()=>{ if(years>=MAX_YEARS) setYears(0); playing=!playing; playBtn.textContent=playing?'⏸ Pause':'▶ Play'; };
document.getElementById('reset').onclick=()=>{playing=false;playBtn.textContent='▶ Play';setYears(0)};
document.getElementById('model').onchange=e=>loadModel(e.target.value);
const rotBtn=document.getElementById('rot');
rotBtn.onclick=()=>{controls.autoRotate=!controls.autoRotate;rotBtn.textContent='Auto-rotate: '+(controls.autoRotate?'on':'off')};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

// ---------- loop ----------
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),.05);
  if(playing){ const sp=+document.getElementById('speed').value; setYears(years+dt*sp*(MAX_YEARS/150)); if(years>=MAX_YEARS){playing=false;playBtn.textContent='▶ Play';} }
  // flakes: only appear once rust is established
  const amt=Math.max(0,(uniforms.uRust.value-.25)/.75);
  flakes.material.opacity=Math.min(.9,amt*1.5);
  flakes.visible=amt>0;
  const live=Math.floor(FL*amt);
  for(let i=0;i<FL;i++){
    if(i>=live){ fpos[i*3+1]=-100; continue; }
    if(fpos[i*3+1]<0) respawn(i);
    fpos[i*3+1]-=fvel[i*2]*dt*3; fpos[i*3]+=fvel[i*2+1]*dt*2;
    if(fpos[i*3+1]<0) respawn(i);
  }
  flakeGeo.attributes.position.needsUpdate=true;
  controls.update();
  renderer.render(scene,camera);
});

function startShow(){
  setYears(0); playing=true; playBtn.textContent='⏸ Pause';
  camera.position.set(560,260,640); controls.autoRotateSpeed=0.9;
}
setYears(0);
loadModel('detailed');
</script>
</body>
</html>
