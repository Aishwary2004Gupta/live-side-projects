<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Shader Playground</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #010101;
      }

      /* --- NEW UI DESIGN --- */
      #panel {
        position: fixed;
        top: 0;
        right: 0;
        width: 280px;
        height: 100vh;
        background: #0a0a0a;
        border-left: 1px solid #1a1a1a;
        padding: 35px 25px;
        color: #777;
        font-family: "Courier New", Courier, monospace;
        box-sizing: border-box;
        overflow-y: auto;
        z-index: 10;
        display: flex;
        flex-direction: column;
      }

      .panel-header {
        color: #fff;
        font-size: 16px;
        font-weight: bold;
        margin-bottom: 25px;
        letter-spacing: 0.5px;
      }

      ul#effect-list {
        list-style: none;
        padding: 0;
        padding-left: 15px; /* Indent under header */
        margin: 0;
      }

      ul#effect-list li {
        margin: 16px 0;
        cursor: pointer;
        font-size: 14px;
        letter-spacing: 0.5px;
        transition: color 0.15s ease;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      ul#effect-list li:hover {
        color: #b0b0b0;
      }

      ul#effect-list li.active {
        color: #ffffff;
      }

      .bullet {
        font-size: 14px;
        width: 10px;
        display: inline-block;
        text-align: center;
      }

      #pixelUI {
        margin-top: 40px;
        padding-top: 25px;
        border-top: 1px solid #222;
      }

      #pixelUI label {
        display: block;
        margin-bottom: 12px;
        color: #fff;
      }

      select,
      input {
        width: 100%;
      }
      
      /* Custom Range Slider Styling for Dark Theme */
      input[type=range] {
        -webkit-appearance: none;
        background: transparent;
      }
      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 14px;
        width: 14px;
        border-radius: 50%;
        background: #fff;
        cursor: pointer;
        margin-top: -5px;
      }
      input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 4px;
        cursor: pointer;
        background: #333;
        border-radius: 2px;
      }
      
      /* Hide canvas elements properly based on width */
      canvas {
        display: block;
      }
      #main-container {
        width: calc(100% - 280px);
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
      }
    </style>
  </head>

  <body>
    <!-- 3D View Container -->
    <div id="main-container"></div>

    <!-- Right Sidebar Panel -->
    <div id="panel">
      <div class="panel-header">- Effects</div>
      
      <ul id="effect-list">
        <li data-val="ascii"><span class="bullet">o</span> ASCII</li>
        <li data-val="dither"><span class="bullet">o</span> Dithering</li>
        <li data-val="halftone"><span class="bullet">o</span> Halftone</li>
        <li data-val="matrix"><span class="bullet">o</span> Matrix Rain</li>
        <li data-val="dots"><span class="bullet">o</span> Dots</li>
        <li data-val="contour"><span class="bullet">o</span> Contour</li>
        <li data-val="blockify"><span class="bullet">o</span> Blockify</li>
        <li data-val="threshold"><span class="bullet">o</span> Threshold</li>
        <li data-val="edge"><span class="bullet">o</span> Edge Detection</li>
        <li data-val="crosshatch"><span class="bullet">o</span> Crosshatch</li>
        <li data-val="waveLines"><span class="bullet">o</span> Wave Lines</li>
        <li data-val="noise"><span class="bullet">o</span> Noise Field</li>
        <li data-val="voronoi" class="active"><span class="bullet">•</span> Voronoi</li>
        <li data-val="vhs"><span class="bullet">o</span> VHS</li>
      </ul>

      <div id="pixelUI" style="display: none;">
        <label>Pixel Size</label>
        <input type="range" min="6" max="32" value="10" id="pixelSize" />
      </div>
    </div>

    <script type="module">
      import * as THREE from "https://esm.sh/three@0.160.0";
      import { OrbitControls } from "https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js";
      import { GLTFLoader } from "https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";
      import { AsciiEffect } from "https://esm.sh/three@0.160.0/examples/jsm/effects/AsciiEffect.js";

      import {
        EffectComposer,
        RenderPass,
        EffectPass,
        Effect,
        PixelationEffect,
        ScanlineEffect,
      } from "https://esm.sh/postprocessing@6.35.4?deps=three@0.160.0";

      const container = document.getElementById('main-container');

      /* ================= SHADERS / EFFECTS ================= */

      const dotsShader = `
        precision highp float;
        uniform float pixelSize;
        uniform vec2 resolution;
        void mainImage(const in vec4 i, const in vec2 uv, out vec4 o) {
          vec2 normalizedPixelSize = pixelSize / resolution;
          float rowIndex = floor(uv.x / normalizedPixelSize.x);
          vec2 uvPixel = normalizedPixelSize * floor(uv / normalizedPixelSize);
          vec4 color = texture2D(inputBuffer, uvPixel);

          float luma = dot(vec3(0.2126, 0.7152, 0.0722), color.rgb);

          vec2 cellUV = fract(uv / normalizedPixelSize);

          float radius = luma > 0.5 ? 0.3 : luma > 0.001 ? 0.12 : 0.075;
          vec2 circleCenter = luma > 0.5 ? vec2(0.5, 0.5) : vec2(0.25, 0.25);

          float distanceFromCenter = distance(cellUV, circleCenter);

          float circleMask = smoothstep(radius, radius - 0.05, distanceFromCenter);
          color.rgb = vec3(circleMask, circleMask, circleMask) * max(luma, 0.05);

          o = color;
        }
      `;

      // --- High-Quality Ordered Dither Shader ---
      const ditherShader = `
        precision highp float;
        uniform vec2 resolution;

        // 8x8 Bayer matrix (un-normalized)
        const float bayer[64] = float[](
           0.0, 32.0,  8.0, 40.0,  2.0, 34.0, 10.0, 42.0,
          48.0, 16.0, 56.0, 24.0, 50.0, 18.0, 58.0, 26.0,
          12.0, 44.0,  4.0, 36.0, 14.0, 46.0,  6.0, 38.0,
          60.0, 28.0, 52.0, 20.0, 62.0, 30.0, 54.0, 22.0,
           3.0, 35.0, 11.0, 43.0,  1.0, 33.0,  9.0, 41.0,
          51.0, 19.0, 59.0, 27.0, 49.0, 17.0, 57.0, 25.0,
          15.0, 47.0,  7.0, 39.0, 13.0, 45.0,  5.0, 37.0,
          63.0, 31.0, 55.0, 23.0, 61.0, 29.0, 53.0, 21.0
        );

        void mainImage(const in vec4 i, const in vec2 uv, out vec4 o) {
          vec4 c = texture2D(inputBuffer, uv);
          float luma = dot(c.rgb, vec3(0.299, 0.587, 0.114));

          vec2 screenCoord = uv * resolution;

          int x = int(mod(screenCoord.x, 8.0));
          int y = int(mod(screenCoord.y, 8.0));
          int bayerIndex = y * 8 + x;

          float threshold = bayer[bayerIndex] / 64.0;
          float dithered = step(threshold, luma);
          
          o = vec4(vec3(dithered), 1.0);
        }
      `;

      const halftoneShader = `
        precision highp float;
        uniform float pixelSize;
        uniform vec2 resolution;
        void mainImage(const in vec4 i, const in vec2 uv, out vec4 o) {
          vec2 s = pixelSize / resolution;
          vec2 u = s * floor(uv / s) + 0.5*s;
          vec4 c = texture2D(inputBuffer, u / (1.0));
          float l = dot(c.rgb, vec3(.2126,.7152,.0722));
          vec2 f = fract(uv / s);
          float r = (1.0 - l) * 0.5;
          float d = distance(f, vec2(.5));
          float m = smoothstep(r+0.02, r, d);
          o = vec4(vec3(m),1.0);
        }
      `;

      const waveLinesShader = `
        precision highp float;
        uniform float time;
        uniform vec2 resolution;
        
        float random(vec2 st) {
          return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
        }

        void mainImage(const in vec4 i,const in vec2 uv,out vec4 o){
          vec4 c = texture2D(inputBuffer, uv);
          float luma = dot(c.rgb, vec3(.2126,.7152,.0722));
          
          float handMask = smoothstep(0.01, 0.05, luma);
          vec2 distortedUV = uv;
          distortedUV.y += sin(uv.x * 15.0 + time * 1.5) * 0.003 * luma;
          
          float linesCount = max(resolution.y / 5.5, 50.0);
          float yPos = fract(distortedUV.y * linesCount);
          float dist = abs(yPos - 0.5);
          
          float thickness = luma * 0.4;
          float line = smoothstep(thickness + 0.05, thickness, dist);
          
          vec3 finalColor = vec3(line);
          float grain = random(uv * (time + 0.1)) * 0.18;
          finalColor += grain;
          finalColor *= handMask;
          
          o = vec4(finalColor, 1.0);
        }
      `;

      // Tiny Old CRT TV Analog Static / Glitch Grain
      const noiseShader = `
        precision highp float;
        uniform float time;
        uniform vec2 resolution;

        float random(vec2 st) {
          return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
        }

        void mainImage(const in vec4 inputColor, const in vec2 uv, out vec4 outputColor) {
          float luma = dot(texture2D(inputBuffer, uv).rgb, vec3(0.299, 0.587, 0.114));

          float handMask = smoothstep(0.02, 0.06, luma);
          if (handMask < 0.001) {
            outputColor = vec4(vec3(0.0), 1.0);
            return;
          }

          vec2 coord = uv;
          float scanLineCount = floor(resolution.y / 4.0);
          float lineId = floor(coord.y * scanLineCount);
          float lineRandom = random(vec2(lineId, floor(time * 4.0)));

          if(lineRandom > 0.92) {
            coord.x += random(vec2(lineId, time)) * 0.015;
          }
          if(lineRandom < 0.07) {
            outputColor = vec4(vec3(0.0) * handMask, 1.0);
            return;
          }

          float grainPixelSize = 1.0;
          vec2 grainUV = floor(coord * resolution / grainPixelSize) * grainPixelSize / resolution;
          float staticGrain = random(vec2(grainUV.x, grainUV.y + floor(time * 30.0)));

          staticGrain = step(0.48, staticGrain);
          staticGrain -= random(grainUV + time) * 0.12;
          staticGrain *= luma * 1.5;

          vec3 finalColor = vec3(clamp(staticGrain, 0.0, 1.0));
          outputColor = vec4(finalColor * handMask, 1.0);
        }
      `;

      // Non-Cartoony Voronoi - Cracked Frosted Glass (masked to hands)
      const voronoiShader = `
        precision highp float;
        uniform float time;
        uniform vec2 resolution;
        
        vec2 hash(vec2 p) {
          p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
          return -1.0 + 2.0 * fract(sin(p) * 43758.5453123);
        }
        
        float rand(vec2 co) {
          return fract(sin(dot(co.xy, vec2(12.9898, 78.233))) * 43758.5453);
        }
        
        void mainImage(const in vec4 inputColor, const in vec2 uv, out vec4 outputColor) {
          vec4 original = texture2D(inputBuffer, uv);
          float originalLuma = dot(original.rgb, vec3(0.299, 0.587, 0.114));
          
          float handMask = smoothstep(0.01, 0.04, originalLuma);
          
          float cellScale = 42.0; 
          vec2 ratio = vec2(resolution.x / resolution.y, 1.0);
          vec2 drift = vec2(time * 0.15, time * 0.1);
          vec2 coord = uv * ratio * cellScale + drift;
          
          vec2 cell = floor(coord);
          vec2 local = fract(coord);
          
          float minDist = 8.0;
          float secondMinDist = 8.0;
          vec2 centerUV = vec2(0.0);
          
          for(int y = -1; y <= 1; y++) {
            for(int x = -1; x <= 1; x++) {
              vec2 neighbor = vec2(float(x), float(y));
              vec2 cellPos = cell + neighbor;
              vec2 point = vec2(0.5) + 0.4 * sin(time * 1.5 + 6.2831 * hash(cellPos));
              vec2 diff = neighbor + point - local;
              float dist = length(diff);
              
              if(dist < minDist) {
                secondMinDist = minDist;
                minDist = dist;
                centerUV = (cellPos + point - drift) / (ratio * cellScale);
              } else if(dist < secondMinDist) {
                secondMinDist = dist;
              }
            }
          }
          
          vec4 cellColor = texture2D(inputBuffer, centerUV);
          float cellLuma = dot(cellColor.rgb, vec3(0.299, 0.587, 0.114));
          cellLuma = smoothstep(0.05, 0.6, cellLuma * 1.3);
          
          float borderDist = secondMinDist - minDist;
          float border = smoothstep(0.01, 0.08, borderDist); 
          
          float finalLuma = cellLuma * border;
          finalLuma *= handMask;
          
          float grain = (rand(uv * (time + 1.0)) - 0.5) * 0.12;
          vec3 finalOutput = vec3(finalLuma + grain);
          
          outputColor = vec4(finalOutput, 1.0);
        }
      `;

      // Enhanced VHS Effect
      const vhsShader = `
        precision highp float;
        uniform float time;
        uniform vec2 resolution;

        float rand(vec2 co) {
          return fract(sin(dot(co.xy, vec2(12.9898, 78.233))) * 43758.5453);
        }

        void mainImage(const in vec4 i, const in vec2 uv, out vec4 o) {
          float jitter = (rand(vec2(time, uv.y)) - 0.5) * step(0.98, rand(vec2(time * 0.5, 0.0))) * 0.02;
          float wave = sin(uv.y * 3.0 + time * 2.0) * 0.005;
          vec2 shiftedUV = uv + vec2(jitter + wave, 0.0);
          
          float shift = 0.005;
          float r = texture2D(inputBuffer, shiftedUV + vec2(shift, 0.0)).r;
          float g = texture2D(inputBuffer, shiftedUV).g;
          float b = texture2D(inputBuffer, shiftedUV - vec2(shift, 0.0)).b;
          
          vec3 color = vec3(r, g, b);
          float scanline = sin(shiftedUV.y * resolution.y * 0.8) * 0.1;
          color -= scanline;
          
          float noise = (rand(shiftedUV + time) - 0.5) * 0.15;
          color += noise;
          
          color = mix(color, vec3(dot(color, vec3(0.299, 0.587, 0.114))), 0.2);
          
          o = vec4(color, 1.0);
        }
      `;

      // Enhanced Matrix Rain
      class MatrixRainEffect {
        constructor(renderer, camera) {
          this.renderer = renderer;
          this.camera = camera;
          this.canvas = document.createElement("canvas");
          this.ctx = this.canvas.getContext("2d", { willReadFrequently: true });
          this.domElement = this.canvas;

          this.chars = "ｦｧｨｩｪｫｬｭｮｯ012789";
          this.cols = 0;
          this.rows = 0;
          this.drops = [];
          this.speeds = [];
          this.startTime = performance.now();
          this.frameCount = 0;

          this.fontSize = 8;
          this.fontFamily = "monospace";
          this.setSize(container.clientWidth, container.clientHeight);

          this.renderTarget = new THREE.WebGLRenderTarget(
            container.clientWidth,
            container.clientHeight,
            { format: THREE.RGBAFormat },
          );
          this.maskTarget = new THREE.WebGLRenderTarget(1, 1, {
            format: THREE.RGBAFormat,
          });
          this.maskTarget.texture.minFilter = THREE.NearestFilter;
          this.maskTarget.texture.magFilter = THREE.NearestFilter;
          this._maskBuffer = null;

          this.cellCharacter = [];
        }

        setSize(width, height) {
          this.canvas.width = width;
          this.canvas.height = height;
          this.ctx.font = `${this.fontSize}px ${this.fontFamily}`;
          this.cols = Math.floor(width / (this.fontSize * 0.6));
          this.rows = Math.floor(height / this.fontSize);

          this.drops = Array(this.cols).fill(0).map(() => -(Math.random() * this.rows));
          this.speeds = Array(this.cols).fill(0).map(() => 0.3 + Math.random() * 0.6);

          this.cellCharacter = new Array(this.cols * this.rows);
          for(let i=0; i<this.cellCharacter.length; i++) {
            this.cellCharacter[i] = this.chars[Math.floor(Math.random() * this.chars.length)];
          }

          if (this.renderTarget) this.renderTarget.setSize(width, height);
          if (this.maskTarget) {
            const mw = Math.max(1, this.cols);
            const mh = Math.max(1, this.rows);
            this.maskTarget.setSize(mw, mh);
            this._maskBuffer = new Uint8Array(mw * mh * 4);
          }
        }

        render(scene, camera) {
          const oldTarget = this.renderer.getRenderTarget();
          this.renderer.setRenderTarget(this.maskTarget);
          this.renderer.render(scene, camera);
          this.renderer.setRenderTarget(oldTarget);

          this.ctx.fillStyle = "black";
          this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

          const maskBuf = this._maskBuffer;
          if (this.maskTarget && maskBuf) {
            try {
              this.renderer.readRenderTargetPixels(
                this.maskTarget, 0, 0, this.maskTarget.width, this.maskTarget.height, maskBuf
              );
            } catch (err) { maskBuf.fill(0); }
          }

          for (let i = 0; i < this.cols; i++) {
            this.drops[i] += this.speeds[i];
            if(Math.random() > 0.8) {
              const y = Math.max(0, Math.floor(this.drops[i])) % this.rows;
              this.cellCharacter[y * this.cols + i] = this.chars[Math.floor(Math.random() * this.chars.length)];
            }
            if (this.drops[i] >= this.rows + 20) {
              this.drops[i] = -(Math.random() * 20);
              this.speeds[i] = 0.3 + Math.random() * 0.6;
            }
          }

          for(let y = 0; y < this.rows; y++) {
            for(let x = 0; x < this.cols; x++) {
              const sampleY = (this.maskTarget.height - 1) - y;
              const idx = (sampleY * this.maskTarget.width + x) * 4;
              
              const brightness = (maskBuf[idx] + maskBuf[idx+1] + maskBuf[idx+2]) / 3;
              const drawX = x * (this.fontSize * 0.6);
              const drawY = y * this.fontSize;

              if(brightness > 15) {
                if(brightness > 180) {
                  this.ctx.fillStyle = `rgba(200, 255, 200, 0.95)`;
                } else if (brightness > 100) {
                  this.ctx.fillStyle = `rgba(40, 200, 60, 0.85)`;
                } else {
                  this.ctx.fillStyle = `rgba(10, 110, 20, 0.7)`;
                }
                this.ctx.fillText(this.cellCharacter[y * this.cols + x], drawX, drawY);
                
              } else {
                const dropY = this.drops[x];
                const distance = dropY - y;
                
                if (distance >= 0 && distance < 25) {
                  if (distance < 1) {
                    this.ctx.fillStyle = `rgba(100, 200, 100, 0.6)`;
                  } else {
                    const alpha = 0.4 * (1.0 - (distance / 25));
                    this.ctx.fillStyle = `rgba(0, 120, 20, ${alpha})`;
                  }
                  
                  let char = this.cellCharacter[y * this.cols + x];
                  if (Math.random() > 0.95) char = this.chars[Math.floor(Math.random() * this.chars.length)];
                  
                  this.ctx.fillText(char, drawX, drawY);
                }
              }
            }
          }
        }
      }

      const contourShader = `
        precision highp float;
        uniform vec2 resolution;
        vec4 sampleOffset(vec2 uv, vec2 off){ return texture2D(inputBuffer, uv + off / resolution); }
        void mainImage(const in vec4 i,const in vec2 uv,out vec4 o){
          float sx = -1.0*dot(sampleOffset(uv, vec2(-1.,-1.)).rgb, vec3(0.3)) + 1.0*dot(sampleOffset(uv, vec2(1.,-1.)).rgb, vec3(0.3))
                   -2.0*dot(sampleOffset(uv, vec2(-1.,0.)).rgb, vec3(0.3)) + 2.0*dot(sampleOffset(uv, vec2(1.,0.)).rgb, vec3(0.3))
                   -1.0*dot(sampleOffset(uv, vec2(-1.,1.)).rgb, vec3(0.3)) + 1.0*dot(sampleOffset(uv, vec2(1.,1.)).rgb, vec3(0.3));
          float sy = -1.0*dot(sampleOffset(uv, vec2(-1.,-1.)).rgb, vec3(0.3)) -2.0*dot(sampleOffset(uv, vec2(0.,-1.)).rgb, vec3(0.3)) -1.0*dot(sampleOffset(uv, vec2(1.,-1.)).rgb, vec3(0.3))
                   +1.0*dot(sampleOffset(uv, vec2(-1.,1.)).rgb, vec3(0.3)) +2.0*dot(sampleOffset(uv, vec2(0.,1.)).rgb, vec3(0.3)) +1.0*dot(sampleOffset(uv, vec2(1.,1.)).rgb, vec3(0.3));
          float g = length(vec2(sx,sy));
          o = vec4(vec3(1.0 - g), 1.0);
        }
      `;

      const edgeShader = `
        precision highp float;
        uniform vec2 resolution;
        vec4 sampleOffset(vec2 uv, vec2 off){ return texture2D(inputBuffer, uv + off / resolution); }
        void mainImage(const in vec4 i,const in vec2 uv,out vec4 o){
          float c = -4.0*dot(sampleOffset(uv, vec2(0.,0.)).rgb, vec3(0.3));
          c += 1.0*dot(sampleOffset(uv, vec2(-1.,0.)).rgb, vec3(0.3));
          c += 1.0*dot(sampleOffset(uv, vec2(1.,0.)).rgb, vec3(0.3));
          c += 1.0*dot(sampleOffset(uv, vec2(0.,-1.)).rgb, vec3(0.3));
          c += 1.0*dot(sampleOffset(uv, vec2(0.,1.)).rgb, vec3(0.3));
          c = abs(c);
          o = vec4(vec3(step(0.15, c)), 1.0);
        }
      `;

      const blockifyShader = `
        precision highp float;
        uniform float pixelSize;
        uniform vec2 resolution;
        void mainImage(const in vec4 i,const in vec2 uv,out vec4 o){
          vec2 s = pixelSize / resolution;
          vec2 u = s * floor(uv / s);
          vec4 c = texture2D(inputBuffer, u);
          o = c;
        }
      `;

      const thresholdShader = `
        precision highp float;
        uniform float thresh;
        void mainImage(const in vec4 i,const in vec2 uv,out vec4 o){
          vec4 c = texture2D(inputBuffer, uv);
          float l = dot(c.rgb, vec3(.2126,.7152,.0722));
          float v = step(thresh, l);
          o = vec4(vec3(v),1.0);
        }
      `;

      const crosshatchShader = `
        precision highp float;
        uniform vec2 resolution;

        float hatchLine(vec2 p, vec2 dir, float spacing, float thickness) {
          float v = dot(p, dir);
          float m = abs(mod(v, spacing) - spacing * 0.5);
          return 1.0 - smoothstep(thickness * 0.5, thickness, m);
        }

        void mainImage(const in vec4 i,const in vec2 uv,out vec4 o){
          vec4 src = texture2D(inputBuffer, uv);
          float l = dot(src.rgb, vec3(.2126,.7152,.0722));
          float minRes = min(resolution.x, resolution.y);
          vec2 p = uv * minRes;
          float darkness = 1.0 - l;
          float baseSpacing = mix(30.0, 6.0, smoothstep(0.0, 1.0, darkness));
          float baseThickness = mix(1.2, 4.5, smoothstep(0.0, 1.0, darkness));

          float a1 = hatchLine(p, normalize(vec2(1.0, 1.0)), baseSpacing, baseThickness);
          float a2 = hatchLine(p, normalize(vec2(1.0, -1.0)), baseSpacing * 0.7, baseThickness * 0.85);
          float a3 = hatchLine(p, normalize(vec2(1.0, 0.0)), baseSpacing * 0.5, baseThickness * 0.6);

          float hatch = clamp(a1 * 0.9 + a2 * 0.7 + a3 * 0.5, 0.0, 1.0);
          float ink = mix(1.0 - hatch, l * 0.8 + 0.2 * (1.0 - l), 0.0);

          o = vec4(vec3(ink), 1.0);
        }
      `;

      class DotsEffect extends Effect {
        constructor(v) {
          super("Dots", dotsShader, {
            uniforms: new Map([
              ["pixelSize", new THREE.Uniform(v)],
              [
                "resolution",
                new THREE.Uniform(
                  new THREE.Vector2(
                    container.clientWidth * devicePixelRatio,
                    container.clientHeight * devicePixelRatio,
                  ),
                ),
              ],
            ]),
          });
          this.v = v;
        }
        update(renderer) {
          this.uniforms.get("pixelSize").value = this.v;
          this.uniforms
            .get("resolution")
            .value.set(container.clientWidth, container.clientHeight);
        }
      }

      function makeEffect(name, shader, uniforms = {}) {
        const map = new Map();
        for (const k in uniforms) map.set(k, new THREE.Uniform(uniforms[k]));
        return new (class extends Effect {
          constructor() {
            super(name, shader, { uniforms: map });
          }
          update(renderer) {
            if (map.has("resolution")) {
              map.get("resolution").value.set(container.clientWidth, container.clientHeight);
            }
            if (map.has("time"))
              map.get("time").value = performance.now() / 1000;
          }
        })();
      }

      /* ================= SCENE ================= */

      const scene = new THREE.Scene();
      scene.background = new THREE.Color("#010101");

      const frustumSize = 350;
      let camera;

      function updateCamera() {
        const aspect = container.clientWidth / container.clientHeight;
        camera.left = (-frustumSize * aspect) / 2;
        camera.right = (frustumSize * aspect) / 2;
        camera.top = frustumSize / 2;
        camera.bottom = -frustumSize / 2;
        camera.updateProjectionMatrix();
      }

      camera = new THREE.OrthographicCamera(0, 0, 0, 0, 0.01, 500);
      camera.position.set(0, 0, -5);
      camera.zoom = 140;
      updateCamera();

      /* ================= RENDERERS ================= */

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      container.appendChild(renderer.domElement);

      const ascii = new AsciiEffect(renderer, " .:-=+*#%@", { invert: true });
      ascii.domElement.style.position = "absolute";
      ascii.domElement.style.color = "white";
      ascii.domElement.style.background = "black";

      const matrix = new MatrixRainEffect(renderer, camera);
      matrix.domElement.style.position = "absolute";
      matrix.domElement.style.top = "0";
      matrix.domElement.style.left = "0";

      /* ================= CREATE EFFECTS ================= */

      const dots = new DotsEffect(10);
      const dither = makeEffect("Dither", ditherShader, {
        resolution: new THREE.Vector2(container.clientWidth, container.clientHeight)
      });
      const pixel = new PixelationEffect(6);
      const scan = new ScanlineEffect({ density: 1.1 });

      const halftone = makeEffect("Halftone", halftoneShader, {
        pixelSize: 10.0,
        resolution: new THREE.Vector2(container.clientWidth, container.clientHeight),
      });

      const contour = makeEffect("Contour", contourShader, {
        resolution: new THREE.Vector2(container.clientWidth, container.clientHeight),
      });

      const blockify = makeEffect("Blockify", blockifyShader, {
        pixelSize: 8.0,
        resolution: new THREE.Vector2(container.clientWidth, container.clientHeight),
      });

      const threshold = makeEffect("Threshold", thresholdShader, {
        thresh: 0.5,
      });

      const edge = makeEffect("Edge", edgeShader, {
        resolution: new THREE.Vector2(container.clientWidth, container.clientHeight),
      });

      const crosshatch = makeEffect("Crosshatch", crosshatchShader, {
        resolution: new THREE.Vector2(container.clientWidth, container.clientHeight),
      });

      const waveLines = makeEffect("WaveLines", waveLinesShader, {
        time: 0.0,
        resolution: new THREE.Vector2(container.clientWidth, container.clientHeight),
      });

      const noise = makeEffect("Noise", noiseShader, {
        time: 0.0,
        resolution: new THREE.Vector2(container.clientWidth, container.clientHeight),
      });

      const voronoi = makeEffect("Voronoi", voronoiShader, {
        time: 0.0,
        resolution: new THREE.Vector2(container.clientWidth, container.clientHeight),
      });

      const vhs = makeEffect("VHS", vhsShader, {
        time: 0.0,
        resolution: new THREE.Vector2(container.clientWidth, container.clientHeight),
      });

      const map = {
        ascii: ascii,
        dither: dither,
        halftone: halftone,
        matrix: matrix,
        dots: dots,
        contour: contour,
        blockify: blockify,
        threshold: threshold,
        edge: edge,
        crosshatch: crosshatch,
        waveLines: waveLines,
        noise: noise,
        voronoi: voronoi,
        vhs: vhs,
      };

      /* ================= CONTROLS ================= */

      let controls = new OrbitControls(camera, renderer.domElement);
      controls.enablePan = false;
      controls.enableDamping = true;

      /* ================= LIGHTS ================= */

      scene.add(new THREE.AmbientLight(0xffffff, 0.6));
      const dl = new THREE.DirectionalLight(0xffffff, 10);
      dl.position.set(5, 10, 0);
      scene.add(dl);

      /* ================= MODEL ================= */

      new GLTFLoader().load(
        "https://cdn.maximeheckel.com/models/creation-of-adam.glb",
        (g) => {
          const m = g.scene;
          m.position.set(2.25, -2, 0);
          m.rotation.y = -Math.PI / 2;
          m.scale.setScalar(4);
          scene.add(m);

          const box = new THREE.Box3().setFromObject(m);
          const c = box.getCenter(new THREE.Vector3());
          controls.target.copy(c);
          camera.lookAt(c);
        },
      );

      /* ================= POST ================= */

      const composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));

      let currentEffect = "voronoi";
      let pass = new EffectPass(camera, map[currentEffect]);
      composer.addPass(pass);

      /* ================= NEW UI LOGIC ================= */

      const pixelSize = document.getElementById("pixelSize");
      const pixelUI = document.getElementById("pixelUI");
      const listItems = document.querySelectorAll("#effect-list li");

      function switchEffect(v) {
        // Handle custom canvas overrides
        if (v === "ascii") {
          composer.removePass(pass);
          renderer.domElement.remove();
          if (matrix.domElement.parentNode) matrix.domElement.remove();
          container.appendChild(ascii.domElement);
          ascii.setSize(container.clientWidth, container.clientHeight);
          controls.dispose();
          controls = new OrbitControls(camera, ascii.domElement);
          pixelUI.style.display = "none";
          return;
        }

        if (v === "matrix") {
          composer.removePass(pass);
          renderer.domElement.remove();
          if (ascii.domElement.parentNode) ascii.domElement.remove();
          container.appendChild(matrix.domElement);
          matrix.setSize(container.clientWidth, container.clientHeight);
          controls.dispose();
          controls = new OrbitControls(camera, matrix.domElement);
          pixelUI.style.display = "none";
          return;
        }

        // Standard Post Processing Shaders
        if (ascii.domElement.parentNode) ascii.domElement.remove();
        if (matrix.domElement.parentNode) matrix.domElement.remove();
        if (!renderer.domElement.parentNode) container.appendChild(renderer.domElement);

        controls.dispose();
        controls = new OrbitControls(camera, renderer.domElement);
        controls.enablePan = false;
        controls.enableDamping = true;

        composer.removePass(pass);
        pass = new EffectPass(camera, map[v]);
        composer.addPass(pass);
        
        pixelUI.style.display = (v === "dots" || v === "blockify" || v === "halftone") ? "block" : "none";
      }

      listItems.forEach((li) => {
        li.addEventListener("click", () => {
          // Update active styles
          listItems.forEach((item) => {
            item.classList.remove("active");
            item.querySelector(".bullet").textContent = "o";
          });
          li.classList.add("active");
          li.querySelector(".bullet").textContent = "•";

          // Trigger switch
          currentEffect = li.getAttribute("data-val");
          switchEffect(currentEffect);
        });
      });

      pixelSize.oninput = (e) => {
        const value = +e.target.value;
        dots.v = value;
        halftone.uniforms.get("pixelSize").value = value;
        blockify.uniforms.get("pixelSize").value = value;
      };

      /* ================= RESIZE ================= */

      addEventListener("resize", () => {
        const w = container.clientWidth;
        const h = container.clientHeight;
        
        renderer.setSize(w, h);
        composer.setSize(w, h);
        ascii.setSize(w, h);
        matrix.setSize(w, h);

        [
          dots,
          halftone,
          blockify,
          contour,
          edge,
          crosshatch,
          noise,
          voronoi,
          vhs,
          waveLines,
          dither
        ].forEach((e) => {
          if (e && e.uniforms && e.uniforms.get && e.uniforms.get("resolution")) {
            e.uniforms.get("resolution").value.set(w, h);
          }
        });

        updateCamera();
      });

      /* ================= LOOP ================= */

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        if (currentEffect === "ascii") {
          ascii.render(scene, camera);
        } else if (currentEffect === "matrix") {
          composer.render();
          matrix.render(scene, camera);
        } else {
          composer.render();
        }
      }
      animate();
    </script>
  </body>
</html>
