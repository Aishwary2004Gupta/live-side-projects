<!DOCTYPE html>
<html lang="en">
<head>
  <title>Three.js + postprocessing Shader (ESM)</title>
  <meta charset="UTF-8" />
  <style> body { margin: 0; overflow: hidden; } </style>
</head>

<body>
<script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
          "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19/+esm"
        }
      }
</script>
<script type="module">
  import * as THREE from 'https://cdn.skypack.dev/three';
  import { OrbitControls } from 'https://cdn.skypack.dev/three/examples/jsm/controls/OrbitControls.js';
  import { GLTFLoader } from 'https://cdn.skypack.dev/three/examples/jsm/loaders/GLTFLoader.js';

  import {
    EffectComposer,
    EffectPass,
    RenderPass,
    Effect
  } from 'https://cdn.jsdelivr.net/npm/postprocessing@6.46.0?module';

  // ------------------------------------
  // GLSL (Shader example)
  const shader = `
    uniform float pixelSize;
    void mainImage(const in vec4 inputColor, const in vec2 uv, out vec4 outputColor) {
      vec2 normalizedPixelSize = pixelSize / resolution;
      vec2 uvPixel = normalizedPixelSize * floor(uv / normalizedPixelSize);
      vec4 color = texture2D(inputBuffer, uvPixel);

      float luma = dot(vec3(0.2126, 0.7152, 0.0722), color.rgb);
      vec2 cellUV = fract(uv / normalizedPixelSize);

      float radius = luma > 0.5 ? 0.3 : luma > 0.001 ? 0.12 : 0.075;
      vec2 circleCenter = luma > 0.5 ? vec2(0.5, 0.5) : vec2(0.25, 0.25);
      float distanceFromCenter = distance(cellUV, circleCenter);
      float circleMask = smoothstep(radius, radius - 0.05, distanceFromCenter);

      color.rgb = vec3(circleMask, circleMask, circleMask) * max(luma, 0.05);
      outputColor = color;
    }
  `;

  class CustomEffect extends Effect {
    constructor({ pixelSize = 10.0 }) {
      super('CustomDotsEffect', shader, {
        uniforms: new Map([
          ['pixelSize', new THREE.Uniform(pixelSize)],
        ])
      });
      this.pixelSize = pixelSize;
    }

    update(_, __, ___) {
      this.uniforms.get('pixelSize').value = this.pixelSize;
    }
  }

  // ------------------------------------
  // Init Scene
  let scene = new THREE.Scene();
  scene.background = new THREE.Color(0x010101);

  const width = window.innerWidth;
  const height = window.innerHeight;
  const aspect = width / height;
  const frustumSize = 2;

  let camera = new THREE.OrthographicCamera(
    (frustumSize * aspect) / -2,
    (frustumSize * aspect) / 2,
    frustumSize / 2,
    frustumSize / -2,
    0.1,
    100
  );
  camera.position.set(0, 0, -5);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(width, height);
  document.body.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const light = new THREE.DirectionalLight(0xffffff, 10);
  light.position.set(5, 10, 0);
  scene.add(light);

  const loader = new GLTFLoader();
  loader.load('https://cdn.maximeheckel.com/models/creation-of-adam.glb', (gltf) => {
    const model = gltf.scene;
    model.position.set(2.25, -2, 0);
    model.rotation.y = -Math.PI / 2;
    model.scale.setScalar(4);
    scene.add(model);
  });

  // Postprocessing
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));

  const effect = new CustomEffect({ pixelSize: 10 });
  const effectPass = new EffectPass(camera, effect);
  composer.addPass(effectPass);

  // Resize handler
  window.addEventListener('resize', () => {
    const aspect = window.innerWidth / window.innerHeight;
    camera.left = (-frustumSize * aspect) / 2;
    camera.right = (frustumSize * aspect) / 2;
    camera.top = frustumSize / 2;
    camera.bottom = -frustumSize / 2;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
  });

  function animate() {
    requestAnimationFrame(animate);
    composer.render();
  }

  animate();
</script>
</body>
</html>
