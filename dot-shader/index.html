<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dots Postprocessing Effect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      background: #010101;
      font-family: sans-serif;
    }

    canvas {
      display: block;
    }

    #ui {
      position: fixed;
      top: 20px;
      left: 20px;
      color: white;
      z-index: 10;
    }

    input {
      width: 160px;
    }
  </style>
</head>

<body>

<div id="ui">
  <div>Pixel Size</div>
  <input type="range" min="8" max="32" step="2" value="10" id="pixelSlider">
</div>

<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
import { OrbitControls } from "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js";
import { GLTFLoader } from "https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";

import {
  EffectComposer,
  RenderPass,
  EffectPass,
  Effect
} from "https://cdn.jsdelivr.net/npm/postprocessing@6.35.4/build/postprocessing.esm.js";

/* ===============================
   SHADER
================================ */

const fragmentShader = `
uniform float pixelSize;

void mainImage(
  const in vec4 inputColor,
  const in vec2 uv,
  out vec4 outputColor
) {
  vec2 normalizedPixelSize = pixelSize / resolution;
  vec2 uvPixel = normalizedPixelSize * floor(uv / normalizedPixelSize);
  vec4 color = texture2D(inputBuffer, uvPixel);

  float luma = dot(vec3(0.2126, 0.7152, 0.0722), color.rgb);

  vec2 cellUV = fract(uv / normalizedPixelSize);

  float radius =
      luma > 0.5 ? 0.3 :
      luma > 0.001 ? 0.12 : 0.075;

  vec2 center =
      luma > 0.5 ? vec2(0.5) : vec2(0.25);

  float d = distance(cellUV, center);
  float mask = smoothstep(radius, radius - 0.05, d);

  color.rgb = vec3(mask) * max(luma, 0.05);
  outputColor = color;
}
`;

/* ===============================
   CUSTOM EFFECT
================================ */

class CustomDotsEffect extends Effect {
  constructor({ pixelSize = 10 }) {
    super("CustomDotsEffect", fragmentShader, {
      uniforms: new Map([
        ["pixelSize", new THREE.Uniform(pixelSize)]
      ])
    });

    this.pixelSize = pixelSize;
  }

  update() {
    this.uniforms.get("pixelSize").value = this.pixelSize;
  }
}

/* ===============================
   SCENE
================================ */

const scene = new THREE.Scene();
scene.background = new THREE.Color("#010101");

/* Camera */
const camera = new THREE.OrthographicCamera(
  -5, 5, 5, -5, 0.01, 500
);
camera.position.set(0, 0, -5);
camera.zoom = 150;
camera.updateProjectionMatrix();

/* Renderer */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
document.body.appendChild(renderer.domElement);

/* Controls */
const controls = new OrbitControls(camera, renderer.domElement);

/* Lights */
scene.add(new THREE.AmbientLight(0xffffff, 0.55));

const dirLight = new THREE.DirectionalLight(0xffffff, 10);
dirLight.position.set(5, 10, 0);
scene.add(dirLight);

/* ===============================
   MODEL
================================ */

const loader = new GLTFLoader();

loader.load(
  "https://cdn.maximeheckel.com/models/creation-of-adam.glb",
  (gltf) => {
    const model = gltf.scene;
    model.position.set(2.25, -2, 0);
    model.rotation.y = -Math.PI / 2;
    model.scale.setScalar(4);
    scene.add(model);
  }
);

/* ===============================
   POST PROCESSING
================================ */

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const dotsEffect = new CustomDotsEffect({ pixelSize: 10 });
const effectPass = new EffectPass(camera, dotsEffect);
composer.addPass(effectPass);

/* ===============================
   UI CONTROL (Leva replacement)
================================ */

const slider = document.getElementById("pixelSlider");

slider.addEventListener("input", () => {
  dotsEffect.pixelSize = Number(slider.value);
});

/* ===============================
   RESIZE
================================ */

window.addEventListener("resize", () => {
  const w = window.innerWidth;
  const h = window.innerHeight;

  renderer.setSize(w, h);
  composer.setSize(w, h);
});

/* ===============================
   ANIMATE
================================ */

function animate() {
  requestAnimationFrame(animate);

  camera.lookAt(0, 0, 0);

  composer.render();
}

animate();

</script>
</body>
</html>
