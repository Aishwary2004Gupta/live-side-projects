<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Post Processing Playground</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #010101;
}

canvas {
  display: block;
}

#panel {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;

  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(10px);
  border-radius: 14px;
  padding: 14px 20px;

  color: white;
  font-family: system-ui, sans-serif;
  min-width: 260px;

  display: flex;
  flex-direction: column;
  gap: 12px;
}

label {
  font-size: 13px;
  opacity: 0.85;
}

select, input {
  width: 100%;
}
</style>
</head>

<body>

<div id="panel">
  <div>
    <label>Effect</label>
    <select id="effectSelect">
      <option value="dots">Dots</option>
      <option value="dither">Dithering</option>
      <option value="ascii">ASCII</option>
    </select>
  </div>

  <div id="pixelBlock">
    <label>Pixel Size</label>
    <input type="range" min="8" max="32" step="2" value="10" id="pixelSize">
  </div>
</div>

<script type="module">
/* ======================================================
   IMPORTS
====================================================== */
import * as THREE from "https://esm.sh/three@0.160.0";
import { OrbitControls } from "https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js";
import { GLTFLoader } from "https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";
import { AsciiEffect } from "https://esm.sh/three@0.160.0/examples/jsm/effects/AsciiEffect.js";

import {
  EffectComposer,
  RenderPass,
  EffectPass,
  Effect
} from "https://esm.sh/postprocessing@6.35.4?deps=three@0.160.0";

/* ======================================================
   ORIGINAL DOT SHADER (UNCHANGED)
====================================================== */
const dotsShader = `
uniform float pixelSize;

void mainImage(const in vec4 inputColor, const in vec2 uv, out vec4 outputColor) {
  vec2 normalizedPixelSize = pixelSize / resolution;
  vec2 uvPixel = normalizedPixelSize * floor(uv / normalizedPixelSize);
  vec4 color = texture2D(inputBuffer, uvPixel);

  float luma = dot(vec3(0.2126, 0.7152, 0.0722), color.rgb);
  vec2 cellUV = fract(uv / normalizedPixelSize);

  float radius = luma > 0.5 ? 0.3 : luma > 0.001 ? 0.12 : 0.075;
  vec2 circleCenter = luma > 0.5 ? vec2(0.5) : vec2(0.25);

  float dist = distance(cellUV, circleCenter);
  float mask = smoothstep(radius, radius - 0.05, dist);

  color.rgb = vec3(mask) * max(luma, 0.05);
  outputColor = color;
}
`;

const ditherShader = `
void mainImage(const in vec4 inputColor, const in vec2 uv, out vec4 outputColor) {
  vec4 c = texture2D(inputBuffer, uv);
  float g = dot(c.rgb, vec3(0.299,0.587,0.114));
  float v = step(0.5, fract(g * 6.0));
  outputColor = vec4(vec3(v), 1.0);
}
`;

/* ======================================================
   EFFECT CLASSES
====================================================== */
class DotsEffect extends Effect {
  constructor(size) {
    super("Dots", dotsShader, {
      uniforms: new Map([
        ["pixelSize", new THREE.Uniform(size)]
      ])
    });
    this.pixelSize = size;
  }

  update() {
    this.uniforms.get("pixelSize").value = this.pixelSize;
  }
}

class DitherEffect extends Effect {
  constructor() {
    super("Dither", ditherShader);
  }
}

/* ======================================================
   SCENE
====================================================== */
const scene = new THREE.Scene();
scene.background = new THREE.Color("#010101");

const frustumSize = 350;
const aspect = window.innerWidth / window.innerHeight;

const camera = new THREE.OrthographicCamera(
  -frustumSize * aspect / 2,
   frustumSize * aspect / 2,
   frustumSize / 2,
  -frustumSize / 2,
  0.01,
  500
);

camera.position.set(0,0,-5);
camera.zoom = 140;
camera.updateProjectionMatrix();

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

/* lights */
scene.add(new THREE.AmbientLight(0xffffff,0.6));
const dl = new THREE.DirectionalLight(0xffffff,10);
dl.position.set(5,10,0);
scene.add(dl);

/* model */
const loader = new GLTFLoader();
loader.load("https://cdn.maximeheckel.com/models/creation-of-adam.glb", g => {
  const m = g.scene;
  m.position.set(2.25,-2,0);
  m.rotation.y = -Math.PI/2;
  m.scale.setScalar(4);
  scene.add(m);
});

/* ======================================================
   POST SETUP
====================================================== */

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const dots = new DotsEffect(10);
const dither = new DitherEffect();

let currentPass = new EffectPass(camera, dots);
composer.addPass(currentPass);

/* ASCII */
const asciiEffect = new AsciiEffect(renderer, " .:-=+*#%@", { invert: true });
asciiEffect.domElement.style.color = "white";
asciiEffect.domElement.style.backgroundColor = "black";
asciiEffect.domElement.style.position = "absolute";
asciiEffect.domElement.style.top = "0";
asciiEffect.domElement.style.left = "0";
asciiEffect.domElement.style.pointerEvents = "none";

/* ======================================================
   UI LOGIC
====================================================== */
const select = document.getElementById("effectSelect");
const slider = document.getElementById("pixelSize");
const pixelBlock = document.getElementById("pixelBlock");

let mode = "dots";

select.onchange = () => {
  mode = select.value;

  document.body.removeChild(renderer.domElement);
  document.body.removeChild(asciiEffect.domElement);

  if (mode === "ascii") {
    document.body.appendChild(asciiEffect.domElement);
    pixelBlock.style.display = "none";
  } else {
    document.body.appendChild(renderer.domElement);
    pixelBlock.style.display = "block";
  }

  composer.removePass(currentPass);

  if (mode === "dots") {
    currentPass = new EffectPass(camera, dots);
  }

  if (mode === "dither") {
    currentPass = new EffectPass(camera, dither);
  }

  if (mode !== "ascii") {
    composer.addPass(currentPass);
  }
};

slider.oninput = e => {
  dots.pixelSize = Number(e.target.value);
};

/* ======================================================
   RESIZE
====================================================== */
window.addEventListener("resize", () => {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const a = w / h;

  camera.left   = -frustumSize * a / 2;
  camera.right  =  frustumSize * a / 2;
  camera.top    = frustumSize / 2;
  camera.bottom = -frustumSize / 2;
  camera.updateProjectionMatrix();

  renderer.setSize(w,h);
  composer.setSize(w,h);
  asciiEffect.setSize(w,h);
});

/* ======================================================
   LOOP
====================================================== */
function animate() {
  requestAnimationFrame(animate);
  controls.update();

  if (mode === "ascii") {
    asciiEffect.render(scene, camera);
  } else {
    composer.render();
  }
}

animate();
</script>
</body>
</html>
