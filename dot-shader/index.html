<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dots Postprocessing Effect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      background: #010101;
    }

    #ui {
      position: fixed;
      top: 20px;
      left: 20px;
      color: white;
      z-index: 10;
      font-family: sans-serif;
    }
  </style>
</head>

<body>

<div id="ui">
  Pixel Size<br>
  <input type="range" min="8" max="32" step="2" value="10" id="pixelSlider">
</div>

<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
import { OrbitControls } from "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js";
import { GLTFLoader } from "https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";

import {
  EffectComposer,
  RenderPass,
  EffectPass,
  Effect
} from "https://esm.sh/postprocessing@6.35.4";

/* ===============================
   SHADER
================================ */

const fragmentShader = `
uniform float pixelSize;

void mainImage(const in vec4 inputColor, const in vec2 uv, out vec4 outputColor) {
  vec2 normalizedPixelSize = pixelSize / resolution;
  vec2 uvPixel = normalizedPixelSize * floor(uv / normalizedPixelSize);
  vec4 color = texture2D(inputBuffer, uvPixel);

  float luma = dot(vec3(0.2126, 0.7152, 0.0722), color.rgb);

  vec2 cellUV = fract(uv / normalizedPixelSize);

  float radius =
      luma > 0.5 ? 0.3 :
      luma > 0.001 ? 0.12 : 0.075;

  vec2 center =
      luma > 0.5 ? vec2(0.5) : vec2(0.25);

  float d = distance(cellUV, center);
  float mask = smoothstep(radius, radius - 0.05, d);

  color.rgb = vec3(mask) * max(luma, 0.05);
  outputColor = color;
}
`;

/* ===============================
   CUSTOM EFFECT
================================ */

class CustomDotsEffect extends Effect {
  constructor({ pixelSize = 10 }) {
    super("CustomDotsEffect", fragmentShader, {
      uniforms: new Map([
        ["pixelSize", new THREE.Uniform(pixelSize)]
      ])
    });
    this.pixelSize = pixelSize;
  }

  update() {
    this.uniforms.get("pixelSize").value = this.pixelSize;
  }
}

/* ===============================
   SCENE
================================ */

const scene = new THREE.Scene();
scene.background = new THREE.Color("#010101");

const camera = new THREE.OrthographicCamera(-5, 5, 5, -5, 0.01, 500);
camera.position.set(0, 0, -5);
camera.zoom = 150;
camera.updateProjectionMatrix();

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);

/* lights */
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const light = new THREE.DirectionalLight(0xffffff, 10);
light.position.set(5, 10, 0);
scene.add(light);

/* model */
const loader = new GLTFLoader();
loader.load(
  "https://cdn.maximeheckel.com/models/creation-of-adam.glb",
  (gltf) => {
    const model = gltf.scene;
    model.position.set(2.25, -2, 0);
    model.rotation.y = -Math.PI / 2;
    model.scale.setScalar(4);
    scene.add(model);
  }
);

/* post */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const dotsEffect = new CustomDotsEffect({ pixelSize: 10 });
composer.addPass(new EffectPass(camera, dotsEffect));

document.getElementById("pixelSlider").addEventListener("input", e => {
  dotsEffect.pixelSize = Number(e.target.value);
});

/* loop */
function animate() {
  requestAnimationFrame(animate);
  camera.lookAt(0, 0, 0);
  composer.render();
}
animate();

</script>
</body>
</html>
