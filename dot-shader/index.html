<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creation of Adam Dots Effect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #010101;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="container"></div>

    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
        import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
        import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
        import { EffectComposer, Effect } from 'https://cdn.jsdelivr.net/npm/postprocessing@6.36.0/build/postprocessing.esm.js';
        import GUI from 'https://cdn.jsdelivr.net/npm/lil-gui@0.18.2/dist/lil-gui.esm.min.js';

        // --------------------------
        // Setup Scene
        // --------------------------
        const container = document.getElementById("container");

        // Scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010101);

        // Orthographic Camera (matches original settings exactly)
        const aspect = window.innerWidth / window.innerHeight;
        const camera = new THREE.OrthographicCamera(
            -aspect, aspect, 1, -1,
            0.01, 500
        );
        camera.position.set(0, 0, -5);
        camera.zoom = 150;
        camera.updateProjectionMatrix();

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // Orbit Controls (module import)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Using ESM builds for postprocessing and lil-gui (no UMD dynamic loading required)

        // --------------------------
        // Lights (matches original)
        // --------------------------
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.55);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 10.0);
        directionalLight.position.set(5, 10, 0);
        scene.add(directionalLight);

        // --------------------------
        // Custom Dots Effect
        // Exact port of your GLSL shader
        // --------------------------
        class CustomDotsEffect extends Effect {
            constructor({ pixelSize = 1.0 } = {}) {
                super("CustomDotsEffect", `
                    uniform float pixelSize;

                    void mainImage(const in vec4 inputColor, const in vec2 uv, out vec4 outputColor) {
                        vec2 normalizedPixelSize = pixelSize / resolution;
                        float rowIndex = floor(uv.x / normalizedPixelSize.x);
                        vec2 uvPixel = normalizedPixelSize * floor(uv / normalizedPixelSize);
                        vec4 color = texture2D(inputBuffer, uvPixel);

                        float luma = dot(vec3(0.2126, 0.7152, 0.0722), color.rgb);

                        vec2 cellUV = fract(uv / normalizedPixelSize);

                        float radius = luma > 0.5 ? 0.3 : luma > 0.001 ? 0.12 : 0.075;
                        vec2 circleCenter = luma > 0.5 ? vec2(0.5, 0.5) : vec2(0.25, 0.25);

                        float distanceFromCenter = distance(cellUV, circleCenter);

                        float circleMask = smoothstep(radius, radius - 0.05, distanceFromCenter);
                        color.rgb = vec3(circleMask, circleMask, circleMask) * max(luma, 0.05);

                        outputColor = color;
                    }
                `, {
                    uniforms: new Map([
                        ["pixelSize", new THREE.Uniform(pixelSize)]
                    ])
                });

                this.pixelSize = pixelSize;
            }

            update(renderer, inputBuffer, deltaTime) {
                this.uniforms.get("pixelSize").value = this.pixelSize;
            }
        }

        // Setup Post Processing Composer
        const composer = new EffectComposer(renderer);
        const effect = new CustomDotsEffect({ pixelSize: 10.0 });
        composer.addEffect(effect);

        // --------------------------
        // Control Panel (replaces Leva)
        // --------------------------
        const gui = new GUI({ title: 'Controls' });
        gui.add(effect, 'pixelSize', 8.0, 32.0, 2.0).name('Pixel Size');
        gui.close(); // Matches original collapsed Leva panel

        // --------------------------
        // Load Model
        // Exact positioning/rotation/scale from original code
        // --------------------------
        const loader = new GLTFLoader();
        loader.load("https://cdn.maximeheckel.com/models/creation-of-adam.glb", (gltf) => {
            const modelGroup = new THREE.Group();
            modelGroup.add(gltf.scene);
            
            // Exact transform values from original code
            modelGroup.position.set(2.25, -2, 0);
            modelGroup.rotation.y = -Math.PI / 2;
            modelGroup.scale.setScalar(4);

            scene.add(modelGroup);
        });

        // --------------------------
        // Animation Loop
        // --------------------------
        const animate = () => {
            requestAnimationFrame(animate);
            
            controls.update();
            composer.render();
        }

        animate();

        // --------------------------
        // Window Resize Handler
        // --------------------------
        window.addEventListener("resize", () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -aspect;
            camera.right = aspect;
            camera.updateProjectionMatrix();

            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
