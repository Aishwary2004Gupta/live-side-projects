<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Three.js Shader ESModules</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #010101;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
<script type="module">
  import * as THREE from 'https://cdn.skypack.dev/three@0.158.0';
  import { OrbitControls } from 'https://cdn.skypack.dev/three@0.158.0/examples/jsm/controls/OrbitControls.js';
  import { GLTFLoader } from 'https://cdn.skypack.dev/three@0.158.0/examples/jsm/loaders/GLTFLoader.js';
  import { EffectComposer } from 'https://cdn.skypack.dev/postprocessing@6.33.4/build/postprocessing.js';
  import { RenderPass } from 'https://cdn.skypack.dev/postprocessing@6.33.4/build/postprocessing.js';
  import { EffectPass } from 'https://cdn.skypack.dev/postprocessing@6.33.4/build/postprocessing.js';
  import { Effect } from 'https://cdn.skypack.dev/postprocessing@6.33.4/build/postprocessing.js';
  import GUI from 'https://cdn.skypack.dev/dat.gui';

  // GLSL Shader Effect (inline like your file)
  const fragmentShader = `
    uniform float pixelSize;

    void mainImage(const in vec4 inputColor, const in vec2 uv, out vec4 outputColor) {
        vec2 normalizedPixelSize = pixelSize / resolution;
        vec2 uvPixel = normalizedPixelSize * floor(uv / normalizedPixelSize);
        vec4 color = texture2D(inputBuffer, uvPixel);

        float luma = dot(vec3(0.2126, 0.7152, 0.0722), color.rgb);
        vec2 cellUV = fract(uv / normalizedPixelSize);

        float radius = luma > 0.5 ? 0.3 : luma > 0.001 ? 0.12 : 0.075;
        vec2 circleCenter = luma > 0.5 ? vec2(0.5, 0.5) : vec2(0.25, 0.25);
        float distanceFromCenter = distance(cellUV, circleCenter);
        float circleMask = smoothstep(radius, radius - 0.05, distanceFromCenter);

        color.rgb = vec3(circleMask, circleMask, circleMask) * max(luma, 0.05);
        outputColor = color;
    }
  `;

  class CustomDotsEffect extends Effect {
    constructor({ pixelSize = 10.0 } = {}) {
      super('CustomDotsEffect', fragmentShader, {
        uniforms: new Map([['pixelSize', new THREE.Uniform(pixelSize)]])
      });
      this.pixelSize = pixelSize;
    }

    update(renderer, inputBuffer, deltaTime) {
      this.uniforms.get('pixelSize').value = this.pixelSize;
    }
  }

  let renderer, scene, camera, composer, effect, model;

  init();
  animate();

  function init() {
    // Renderer
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // Scene
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x010101);

    // Camera (Orthographic)
    const aspect = window.innerWidth / window.innerHeight;
    const frustumSize = 2;
    camera = new THREE.OrthographicCamera(
      -frustumSize * aspect / 2,
      frustumSize * aspect / 2,
      frustumSize / 2,
      -frustumSize / 2,
      0.01,
      500
    );
    camera.position.set(0, 0, -5);
    camera.lookAt(0, 0, 0);

    // Controls
    new OrbitControls(camera, renderer.domElement);

    // Lights
    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const dirLight = new THREE.DirectionalLight(0xffffff, 10);
    dirLight.position.set(5, 10, 0);
    scene.add(dirLight);

    // Load Model
    const loader = new GLTFLoader();
    loader.load('https://cdn.maximeheckel.com/models/creation-of-adam.glb', (gltf) => {
      model = gltf.scene;
      model.position.set(2.25, -2, 0);
      model.rotation.y = -Math.PI / 2;
      model.scale.setScalar(4);
      scene.add(model);
    });

    // Postprocessing Composer
    composer = new EffectComposer(renderer);
    const renderPass = new RenderPass(scene, camera);
    composer.addPass(renderPass);

    effect = new CustomDotsEffect({ pixelSize: 10.0 });
    const effectPass = new EffectPass(camera, effect);
    composer.addPass(effectPass);

    // GUI
    const gui = new GUI();
    const params = { pixelSize: 10.0 };
    gui.add(params, 'pixelSize', 8.0, 32.0, 2.0).onChange((val) => effect.pixelSize = val);

    // Resize Handling
    window.addEventListener('resize', onWindowResize);
  }

  function onWindowResize() {
    const aspect = window.innerWidth / window.innerHeight;
    const frustumSize = 2;

    camera.left = -frustumSize * aspect / 2;
    camera.right = frustumSize * aspect / 2;
    camera.top = frustumSize / 2;
    camera.bottom = -frustumSize / 2;
    camera.updateProjectionMatrix();

    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
  }

  function animate() {
    requestAnimationFrame(animate);
    composer.render();
  }
</script>
</body>
</html>
