<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Shader Playground</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #010101;
      }

      #panel {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(10px);
        border-radius: 14px;
        padding: 14px 20px;
        color: white;
        font-family: system-ui, sans-serif;
        min-width: 260px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      label {
        font-size: 13px;
        opacity: 0.85;
      }
      select,
      input {
        width: 100%;
      }
    </style>
  </head>

  <body>
    <div id="panel">
      <div>
        <label>Effect</label>
        <select id="effect">
          <option value="dots">Dots</option>
          <option value="dither">Dither</option>
          <option value="ascii">ASCII</option>
          <option value="halftone">Halftona</option>
          <option value="matrix">Matrix Rain</option>
          <option value="contour">Contour</option>
          <option value="pixelsort">Pixal Sort</option>
          <option value="blockify">Blockify</option>
          <option value="threshold">Thrashold</option>
          <option value="edge">Edga Oataction</option>
          <option value="crosshatch">Crosshatch</option>
          <option value="brokenLines">bdava Linas</option>
          <option value="noise">Naisa Field</option>
          <option value="voronoi">Voronoi</option>
          <option value="vhs">VHS</option>
        </select>
      </div>

      <div id="pixelUI">
        <label>Pixel Size</label>
        <input type="range" min="6" max="32" value="10" id="pixelSize" />
      </div>
    </div>

    <script type="module">
      import * as THREE from "https://esm.sh/three@0.160.0";
      import { OrbitControls } from "https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js";
      import { GLTFLoader } from "https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";
      import { AsciiEffect } from "https://esm.sh/three@0.160.0/examples/jsm/effects/AsciiEffect.js";

      import {
        EffectComposer,
        RenderPass,
        EffectPass,
        Effect,
        PixelationEffect,
        ScanlineEffect,
      } from "https://esm.sh/postprocessing@6.35.4?deps=three@0.160.0";

      /* ================= SHADERS / EFFECTS ================= */

      // Dots: declare precision & resolution and update it from renderer
      const dotsShader = `
precision highp float;
uniform float pixelSize;
uniform vec2 resolution;
void mainImage(const in vec4 i, const in vec2 uv, out vec4 o) {
  vec2 s = pixelSize / resolution;
  vec2 u = s * floor(uv / s);
  vec4 c = texture2D(inputBuffer, u);
  float l = dot(c.rgb, vec3(.2126,.7152,.0722));
  vec2 f = fract(uv / s);
  float r = l>.5?.3:l>.001?.12:.075;
  float m = smoothstep(r,r-.05,distance(f,vec2(.5)));
  o = vec4(vec3(m*l),1.);
}
`;

      const ditherShader = `
precision highp float;
void mainImage(const in vec4 i,const in vec2 uv,out vec4 o){
  vec4 c=texture2D(inputBuffer,uv);
  float g=dot(c.rgb,vec3(.299,.587,.114));
  o=vec4(vec3(step(.5,fract(g*6.))),1.);
}
`;

      // Halftone: circular halftone dots per cell
      const halftoneShader = `
precision highp float;
uniform float pixelSize;
uniform vec2 resolution;
void mainImage(const in vec4 i, const in vec2 uv, out vec4 o) {
  vec2 s = pixelSize / resolution;
  vec2 u = s * floor(uv / s) + 0.5*s;
  vec4 c = texture2D(inputBuffer, u / (1.0));
  float l = dot(c.rgb, vec3(.2126,.7152,.0722));
  vec2 f = fract(uv / s);
  float r = (1.0 - l) * 0.5;
  float d = distance(f, vec2(.5));
  float m = smoothstep(r+0.02, r, d);
  o = vec4(vec3(m),1.0);
}
`;

      // Matrix Rain: vertical green streaks via time-based bands
      const matrixShader = `
precision highp float;
uniform float time;
uniform vec2 resolution;
float rand(vec2 co){ return fract(sin(dot(co.xy, vec2(12.9898,78.233))) * 43758.5453); }
void mainImage(const in vec4 i, const in vec2 uv, out vec4 o){
  vec2 p = uv * resolution;
  float col = floor(p.x/8.0);
  float y = p.y/16.0 + time*5.0 + rand(vec2(col,0.0))*50.0;
  float band = step(0.95, fract(y));
  float glow = smoothstep(0.0,0.4,1.0 - fract(y));
  vec3 c = vec3(0.0, mix(0.0,1.0,band)*0.9, 0.0)* (0.4 + 0.6*glow);
  o = vec4(c,1.0);
}
`;

      // Contour / edge: simple sobel edges
      const contourShader = `
precision highp float;
uniform vec2 resolution;
vec4 sampleOffset(vec2 uv, vec2 off){ return texture2D(inputBuffer, uv + off / resolution); }
void mainImage(const in vec4 i,const in vec2 uv,out vec4 o){
  float sx = -1.0*dot(sampleOffset(uv, vec2(-1.,-1.)).rgb, vec3(0.3)) + 1.0*dot(sampleOffset(uv, vec2(1.,-1.)).rgb, vec3(0.3))
           -2.0*dot(sampleOffset(uv, vec2(-1.,0.)).rgb, vec3(0.3)) + 2.0*dot(sampleOffset(uv, vec2(1.,0.)).rgb, vec3(0.3))
           -1.0*dot(sampleOffset(uv, vec2(-1.,1.)).rgb, vec3(0.3)) + 1.0*dot(sampleOffset(uv, vec2(1.,1.)).rgb, vec3(0.3));
  float sy = -1.0*dot(sampleOffset(uv, vec2(-1.,-1.)).rgb, vec3(0.3)) -2.0*dot(sampleOffset(uv, vec2(0.,-1.)).rgb, vec3(0.3)) -1.0*dot(sampleOffset(uv, vec2(1.,-1.)).rgb, vec3(0.3))
           +1.0*dot(sampleOffset(uv, vec2(-1.,1.)).rgb, vec3(0.3)) +2.0*dot(sampleOffset(uv, vec2(0.,1.)).rgb, vec3(0.3)) +1.0*dot(sampleOffset(uv, vec2(1.,1.)).rgb, vec3(0.3));
  float g = length(vec2(sx,sy));
  o = vec4(vec3(1.0 - g), 1.0);
}
`;

      // Pixel sort (simple scanline max-luminance fetch)
      const pixelSortShader = `
precision highp float;
uniform float pixelSize;
uniform vec2 resolution;
float lum(vec3 c){return dot(c, vec3(.2126,.7152,.0722));}
void mainImage(const in vec4 i,const in vec2 uv,out vec4 o){
  vec2 p = uv * resolution;
  ivec2 ip = ivec2(floor(p));
  int k = 16;
  vec3 best = vec3(0.0);
  float bestL = -1.0;
  for(int x=0;x<k;x++){
    float sx = float(x) - float(k)/2.0;
    vec2 samp = (vec2(ip) + vec2(sx,0.0))/resolution;
    vec3 c = texture2D(inputBuffer, samp).rgb;
    float L = lum(c);
    if(L > bestL){ bestL = L; best = c; }
  }
  o = vec4(best,1.0);
}
`;

      // Blockify / pixelate
      const blockifyShader = `
precision highp float;
uniform float pixelSize;
uniform vec2 resolution;
void mainImage(const in vec4 i,const in vec2 uv,out vec4 o){
  vec2 s = pixelSize / resolution;
  vec2 u = s * floor(uv / s);
  vec4 c = texture2D(inputBuffer, u);
  o = c;
}
`;

      // Threshold
      const thresholdShader = `
precision highp float;
uniform float thresh;
void mainImage(const in vec4 i,const in vec2 uv,out vec4 o){
  vec4 c = texture2D(inputBuffer, uv);
  float l = dot(c.rgb, vec3(.2126,.7152,.0722));
  float v = step(thresh, l);
  o = vec4(vec3(v),1.0);
}
`;

      // Crosshatch
      const crosshatchShader = `
precision highp float;
uniform vec2 resolution;
void mainImage(const in vec4 i,const in vec2 uv,out vec4 o){
  vec4 c = texture2D(inputBuffer, uv);
  float l = dot(c.rgb, vec3(.2126,.7152,.0722));
  float lines = 0.0;
  if(l < 0.9) lines += step(0.5, fract((uv.x+uv.y)*40.0));
  if(l < 0.6) lines += step(0.5, fract((uv.x-uv.y)*60.0));
  if(l < 0.3) lines += step(0.5, fract((uv.x+uv.y)*90.0));
  o = vec4(vec3(1.0 - lines*0.6),1.0);
}
`;

      // Noise field
      const noiseShader = `
precision highp float;
uniform float time;
uniform vec2 resolution;
float rand(vec2 co){ return fract(sin(dot(co.xy, vec2(12.9898,78.233))) * 43758.5453); }
void mainImage(const in vec4 i,const in vec2 uv,out vec4 o){
  vec4 c = texture2D(inputBuffer, uv);
  float n = rand(uv*resolution + time);
  o = vec4(c.rgb + (n-0.5)*0.15, 1.0);
}
`;

      // Voronoi
      const voronoiShader = `
precision highp float;
uniform float time;
uniform vec2 resolution;
float rand(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453123); }
void mainImage(const in vec4 i,const in vec2 uv,out vec4 o){
  vec2 p = uv * 10.0;
  float m = 10.0;
  for(int x=-1;x<=1;x++){
    for(int y=-1;y<=1;y++){
      vec2 gp = floor(p) + vec2(x,y);
      vec2 r = vec2(rand(gp), rand(gp.yx));
      vec2 diff = gp + r - p;
      m = min(m, length(diff));
    }
  }
  o = vec4(vec3(m*0.6),1.0);
}
`;

      // VHS effect (scanlines, chromatic offset)
      const vhsShader = `
precision highp float;
uniform float time;
uniform vec2 resolution;
vec4 sample(vec2 uv, vec2 off){ return texture2D(inputBuffer, uv + off / resolution); }
void mainImage(const in vec4 i,const in vec2 uv,out vec4 o){
  float sc = sin(time*10.0)*2.0;
  vec3 c;
  c.r = sample(uv, vec2( sc,0.0)).r;
  c.g = sample(uv, vec2(0.0,0.0)).g;
  c.b = sample(uv, vec2(-sc,0.0)).b;
  float line = 1.0 - 0.15*abs(sin(uv.y*resolution.y*0.5));
  c *= vec3(1.0, 0.98, 0.95) * line;
  o = vec4(c,1.0);
}
`;

      class DotsEffect extends Effect {
        constructor(v) {
          super("Dots", dotsShader, {
            uniforms: new Map([
              ["pixelSize", new THREE.Uniform(v)],
              ["resolution", new THREE.Uniform(new THREE.Vector2(innerWidth * devicePixelRatio, innerHeight * devicePixelRatio))]
            ]),
          });
          this.v = v;
        }
        update(renderer /*, inputBuffer, deltaTime */) {
          this.uniforms.get("pixelSize").value = this.v;
          const canvas = renderer.domElement;
          this.uniforms.get("resolution").value.set(canvas.width, canvas.height);
        }
      }

      // helper effect factory
      function makeEffect(name, shader, uniforms = {}) {
        const map = new Map();
        for(const k in uniforms) map.set(k, new THREE.Uniform(uniforms[k]));
        return new (class extends Effect {
          constructor(){ super(name, shader, { uniforms: map }); }
          update(renderer){ if(map.has("resolution")) { const c=renderer.domElement; map.get("resolution").value.set(c.width, c.height);} if(map.has("time")) map.get("time").value = performance.now()/1000; }
        })();
      }

      const halftone = makeEffect("Halftone", halftoneShader, { pixelSize: 10.0, resolution: new THREE.Vector2(innerWidth, innerHeight) });
      const matrix = makeEffect("Matrix", matrixShader, { time: 0.0, resolution: new THREE.Vector2(innerWidth, innerHeight) });
      const contour = makeEffect("Contour", contourShader, { resolution: new THREE.Vector2(innerWidth, innerHeight) });
      const pixelSort = makeEffect("PixelSort", pixelSortShader, { pixelSize: 10.0, resolution: new THREE.Vector2(innerWidth, innerHeight) });
      const blockify = makeEffect("Blockify", blockifyShader, { pixelSize: 8.0, resolution: new THREE.Vector2(innerWidth, innerHeight) });
      const threshold = makeEffect("Threshold", thresholdShader, { thresh: 0.5 });
      const edge = makeEffect("Edge", contourShader, { resolution: new THREE.Vector2(innerWidth, innerHeight) }); // reuse contour/sobel
      const crosshatch = makeEffect("Crosshatch", crosshatchShader, { resolution: new THREE.Vector2(innerWidth, innerHeight) });
      const brokenLines = makeEffect("BrokenLines", voronoiShader, { time: 0.0, resolution: new THREE.Vector2(innerWidth, innerHeight) });
      const noise = makeEffect("Noise", noiseShader, { time: 0.0, resolution: new THREE.Vector2(innerWidth, innerHeight) });
      const voronoi = makeEffect("Voronoi", voronoiShader, { time: 0.0, resolution: new THREE.Vector2(innerWidth, innerHeight) });
      const vhs = makeEffect("VHS", vhsShader, { time: 0.0, resolution: new THREE.Vector2(innerWidth, innerHeight) });

      // existing instances
      const pixel = new PixelationEffect(6);
      const scan = new ScanlineEffect({ density: 1.1 });

      // replace earlier single map with extended map
      const map = {
        dots: dots,
        dither: dither,
        pixel: pixel,
        scanline: scan,
        halftone: halftone,
        matrix: matrix,
        contour: contour,
        pixelsort: pixelSort,
        blockify: blockify,
        threshold: threshold,
        edge: edge,
        crosshatch: crosshatch,
        brokenLines: brokenLines,
        noise: noise,
        voronoi: voronoi,
        vhs: vhs
      };

      /* ================= SCENE ================= */

      const scene = new THREE.Scene();
      scene.background = new THREE.Color("#010101");

      const frustumSize = 350;
      let camera;

      function updateCamera() {
        const aspect = innerWidth / innerHeight;
        camera.left = (-frustumSize * aspect) / 2;
        camera.right = (frustumSize * aspect) / 2;
        camera.top = frustumSize / 2;
        camera.bottom = -frustumSize / 2;
        camera.updateProjectionMatrix();
      }

      camera = new THREE.OrthographicCamera(0, 0, 0, 0, 0.01, 500);
      camera.position.set(0, 0, -5);
      camera.zoom = 140;
      updateCamera();

      /* ================= RENDERERS ================= */

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(innerWidth, innerHeight);
      document.body.appendChild(renderer.domElement);

      const ascii = new AsciiEffect(renderer, " .:-=+*#%@", { invert: true });
      ascii.domElement.style.position = "absolute";
      ascii.domElement.style.color = "white";
      ascii.domElement.style.background = "black";

      /* ================= CONTROLS ================= */

      let controls = new OrbitControls(camera, renderer.domElement);
      controls.enablePan = false;
      controls.enableDamping = true;

      /* ================= LIGHTS ================= */

      scene.add(new THREE.AmbientLight(0xffffff, 0.6));
      const dl = new THREE.DirectionalLight(0xffffff, 10);
      dl.position.set(5, 10, 0);
      scene.add(dl);

      /* ================= MODEL ================= */

      new GLTFLoader().load(
        "https://cdn.maximeheckel.com/models/creation-of-adam.glb",
        (g) => {
          const m = g.scene;
          m.position.set(2.25, -2, 0);
          m.rotation.y = -Math.PI / 2;
          m.scale.setScalar(4);
          scene.add(m);

          const box = new THREE.Box3().setFromObject(m);
          const c = box.getCenter(new THREE.Vector3());
          controls.target.copy(c);
          camera.lookAt(c);
        },
      );

      /* ================= POST ================= */

      const composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));

      const dots = new DotsEffect(10);
      const dither = new DitherEffect();
      const pixel = new PixelationEffect(6);
      const scan = new ScanlineEffect({ density: 1.1 });

      let pass = new EffectPass(camera, dots);
      composer.addPass(pass);

      /* ================= UI ================= */

      const effect = document.getElementById("effect");
      const pixelSize = document.getElementById("pixelSize");
      const pixelUI = document.getElementById("pixelUI");

      function switchEffect(v) {
        composer.removePass(pass);

        if (v === "ascii") {
          renderer.domElement.remove();
          document.body.appendChild(ascii.domElement);
          ascii.setSize(innerWidth, innerHeight);
          controls.dispose();
          controls = new OrbitControls(camera, ascii.domElement);
          pixelUI.style.display = "none";
          return;
        }

        if (ascii.domElement.parentNode) ascii.domElement.remove();
        if (!renderer.domElement.parentNode)
          document.body.appendChild(renderer.domElement);

        controls.dispose();
        controls = new OrbitControls(camera, renderer.domElement);
        controls.enablePan = false;
        controls.enableDamping = true;

        const map = {
          dots: dots,
          dither: dither,
          pixel: pixel,
          scanline: scan,
          halftone: halftone,
          matrix: matrix,
          contour: contour,
          pixelsort: pixelSort,
          blockify: blockify,
          threshold: threshold,
          edge: edge,
          crosshatch: crosshatch,
          brokenLines: brokenLines,
          noise: noise,
          voronoi: voronoi,
          vhs: vhs
        };

        pass = new EffectPass(camera, map[v]);
        composer.addPass(pass);
        pixelUI.style.display = (v === "dots" || v === "blockify" || v === "halftone" || v === "pixelsort") ? "block" : "none";
      }

      effect.onchange = (e) => switchEffect(e.target.value);
      pixelSize.oninput = (e) => (dots.v = +e.target.value);

      /* ================= RESIZE ================= */

      addEventListener("resize", () => {
        renderer.setSize(innerWidth, innerHeight);
        composer.setSize(innerWidth, innerHeight);
        ascii.setSize(innerWidth, innerHeight);
        updateCamera();
      });

      /* ================= LOOP ================= */

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        effect.value === "ascii"
          ? ascii.render(scene, camera)
          : composer.render();
      }
      animate();
    </script>
  </body>
</html>
