<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dots Effect</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <div id="axisHUD">
      <canvas id="axisCanvas" width="100" height="100"></canvas>
    </div>

    <div id="floatingToggle">+</div>

    <div id="canvasContainer"></div>

    <div id="sidebar">
      <h2><span id="toggleBtn">—</span> Effects</h2>

      <ul id="effectList">
        <li data-value="normal">Normal</li>
        <li data-value="dots" class="active">Dots</li>
      </ul>

      <div id="pixelUI">
        <label>Intensity / Size</label>
        <input type="range" min="6" max="32" value="10" id="pixelSize" />
      </div>
    </div>
  </body>
</html>
