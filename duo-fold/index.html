<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Foldable design — product study</title>
<style>
  :root{
    --bg:#fff;
    --pill:#f0f0f2;
    --ink:#1d1d1f;
    --sub:#6e6e73;
    --blue:#0071e3;
    --open:.55;                    /* 0 = closed, 1 = flat open */
    --a:calc((1 - var(--open)) * 88deg);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"SF Pro Text",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Inter,sans-serif;
    -webkit-font-smoothing:antialiased}

  .wrap{max-width:1760px;margin:0 auto;padding:28px 24px 60px;
    display:grid;grid-template-columns:56px minmax(320px,640px) 1fr;gap:24px;align-items:start}

  /* ── left rail chevrons ── */
  .rail{position:sticky;top:340px;display:grid;gap:16px;justify-items:center}
  .chev{width:44px;height:44px;border:0;border-radius:50%;background:var(--pill);
    display:grid;place-items:center;cursor:pointer;transition:background .2s}
  .chev:hover{background:#e5e5e8}
  .chev svg{width:16px;height:16px;stroke:#4a4a4f;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}

  /* ── copy + scrubber card ── */
  .card{background:var(--pill);border-radius:22px;padding:34px 34px 30px}
  .card h2{margin:0 0 14px;font-size:26px;line-height:1.32;font-weight:400;letter-spacing:-.02em}
  .card h2 b{font-weight:600}
  .hint{margin:0 0 12px;font-size:13px;color:var(--sub)}

  .scrub{position:relative;height:34px;display:flex;align-items:center;touch-action:none}
  .track{position:absolute;left:0;right:0;height:16px;border-radius:99px;background:#dcdce0}
  .thumb{position:absolute;top:50%;width:74px;height:44px;border-radius:99px;background:var(--blue);
    transform:translate(-50%,-50%);left:calc(var(--open)*100%);display:grid;place-items:center;
    cursor:grab;box-shadow:0 2px 10px #0071e355;transition:box-shadow .2s}
  .thumb:active{cursor:grabbing}
  .thumb:focus-visible{outline:3px solid #000;outline-offset:3px}
  .thumb span{color:#fff;font-size:17px;letter-spacing:-2px;font-weight:500}

  /* ── accordion pills ── */
  .pills{margin-top:22px;display:grid;gap:12px;justify-items:start}
  .pill{width:auto;min-width:180px;max-width:100%;background:var(--pill);border:0;border-radius:99px;
    padding:16px 30px 16px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;
    font-size:19px;font-weight:600;letter-spacing:-.01em;color:var(--ink);transition:background .2s}
  .pill:hover{background:#e6e6ea}
  .pill i{width:26px;height:26px;border:1.5px solid #86868b;border-radius:50%;display:grid;place-items:center;
    font-style:normal;font-size:16px;color:#4a4a4f;line-height:1;transition:transform .3s}
  .pill[aria-expanded="true"] i{transform:rotate(45deg)}
  .panelTxt{max-height:0;overflow:hidden;transition:max-height .35s ease;font-size:15px;color:var(--sub);
    line-height:1.5;padding-left:20px;max-width:460px}
  .panelTxt.open{max-height:120px}

  /* ── 3D stage ── */
  .stage{height:790px;position:relative;perspective:2200px;display:grid;place-items:center;
    user-select:none;touch-action:none}
  .floor{position:absolute;bottom:52px;width:420px;height:44px;border-radius:50%;background:#00000030;
    filter:blur(26px);transform:scaleX(calc(.6 + var(--open)*.8))}
  .book{width:604px;height:660px;transform-style:preserve-3d;
    transform:rotateX(2deg) rotateY(calc(var(--a) * -.62)) translateZ(-60px)}
  .half{position:absolute;top:0;width:302px;height:660px;transform-style:preserve-3d;
    transition:transform .55s cubic-bezier(.22,.9,.24,1)}
  .stage.dragging .half,.stage.dragging .book{transition:none}
  .left {left:0;  transform-origin:right center;transform:rotateY(calc(var(--a) *  .38))}
  .right{left:302px;transform-origin:left center;transform:rotateY(calc(var(--a) * -1.02))}

  .face{position:absolute;inset:0;backface-visibility:hidden;overflow:hidden;
    border:9px solid #d9d9dc;background:#000;
    box-shadow:inset 0 0 0 1px #8d8d92, 0 30px 60px #00000038}
  .left  .face{border-radius:44px 6px 6px 44px;border-right-width:2px}
  .right .face{border-radius:6px 44px 44px 6px;border-left-width:2px}
  .face.back{transform:rotateY(180deg);background:#1b1b1d;border-color:#c9c9ce}

  /* wallpaper: desert dunes */
  .wall{position:absolute;inset:0;background:
      linear-gradient(#0d0f16 0%,#2b2b31 16%,#6b6257 34%,#a08e73 46%,#7d6b52 58%,#3a2f24 100%)}
  .wall::before{content:"";position:absolute;left:0;right:0;top:34%;height:22%;
    background:#2a241d;clip-path:polygon(0 60%,14% 26%,27% 52%,44% 12%,63% 46%,78% 22%,100% 54%,100% 100%,0 100%)}
  .wall::after{content:"";position:absolute;left:0;right:0;bottom:0;height:52%;
    background:linear-gradient(#c7ab84,#8a7154 55%,#2e2519);
    clip-path:polygon(0 42%,30% 18%,66% 40%,100% 22%,100% 100%,0 100%)}
  .right .wall{filter:brightness(.42)}

  .glare{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(105deg,#ffffff2e 0 18%,#ffffff00 42%,#00000038 100%)}

  /* screen content */
  .clock{position:absolute;top:70px;left:0;right:0;text-align:center;color:#fff;
    font-size:190px;font-weight:250;letter-spacing:-8px;line-height:1;
    filter:blur(calc((1 - var(--open)) * 3px));opacity:.92;
    font-family:"SF Pro Display",-apple-system,Helvetica,sans-serif}
  .notch{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:104px;height:26px;
    border-radius:99px;background:#000}
  .bar{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:118px;height:5px;
    border-radius:9px;background:#ffffffb0}
  .icons{position:absolute;top:22px;right:18px;color:#fff9;font-size:12px}
  .btns{position:absolute;right:16px;bottom:120px;display:grid;gap:16px}
  .btns b{width:48px;height:48px;border-radius:50%;background:#ffffff2b;backdrop-filter:blur(6px);
    display:grid;place-items:center;font-size:19px;color:#fff}
  .keys{position:absolute;right:-4px;top:160px;width:5px;height:96px;border-radius:4px;
    background:linear-gradient(#c9c9ce,#8d8d92);transform:translateZ(-2px)}

  .credit{position:absolute;bottom:8px;right:14px;font-size:12px;color:#86868b}
  .credit a{color:var(--blue);text-decoration:none}

  @media(max-width:1080px){
    .wrap{grid-template-columns:1fr;padding:20px}
    .rail{display:none}
    .stage{height:560px}
    .book{transform:scale(.72) rotateX(2deg) rotateY(calc(var(--a) * -.62))}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="rail">
    <button class="chev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
    <button class="chev" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
  </div>

  <div>
    <div class="card">
      <h2><b>Foldable design.</b> Offers exceptional viewing experiences in a design that fits in your pocket.</h2>
      <p class="hint" id="lbl">Drag below to open and close</p>
      <div class="scrub" id="scrub">
        <div class="track"></div>
        <div class="thumb" id="thumb" role="slider" tabindex="0" aria-labelledby="lbl"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="55" aria-valuetext="55% open">
          <span>&lsaquo;&rsaquo;</span>
        </div>
      </div>
    </div>

    <div class="pills" id="pills"></div>
  </div>

  <div class="stage" id="stage">
    <div class="floor"></div>
    <div class="book">
      <div class="half left">
        <div class="face front">
          <div class="wall"></div><div class="notch"></div>
          <div class="clock">9:4</div><div class="glare"></div><div class="bar"></div>
        </div>
        <div class="face back"><div class="glare"></div></div>
      </div>
      <div class="half right">
        <div class="face front">
          <div class="wall"></div>
          <div class="icons">&#9679;&#9679;&#9679; &#9737;</div>
          <div class="btns"><b>&#128367;</b><b>&#128247;</b></div>
          <div class="glare"></div><div class="keys"></div>
        </div>
        <div class="face back"><div class="glare"></div></div>
      </div>
    </div>
    <p class="credit">3D model reference:
      <a href="https://www.apple.com/iphone/" target="_blank" rel="noreferrer">Apple iPhone Fold study &#8599;</a></p>
  </div>
</div>

<script>
const root=document.documentElement, thumb=document.getElementById('thumb'),
      scrub=document.getElementById('scrub'), stage=document.getElementById('stage');

let open = parseFloat(localStorage.getItem('foldOpen') ?? .55);
function set(v,live){
  open=Math.min(1,Math.max(0,v));
  root.style.setProperty('--open',open);
  thumb.setAttribute('aria-valuenow',Math.round(open*100));
  thumb.setAttribute('aria-valuetext',Math.round(open*100)+'% open');
  localStorage.setItem('foldOpen',open);
}
set(open);

let drag=false;
const from=e=>{const r=scrub.getBoundingClientRect();
  return ((e.touches?e.touches[0].clientX:e.clientX)-r.left)/r.width;};
const start=e=>{drag=true;stage.classList.add('dragging');set(from(e));};
scrub.addEventListener('pointerdown',start);
addEventListener('pointermove',e=>drag&&set(from(e)));
addEventListener('pointerup',()=>{drag=false;stage.classList.remove('dragging');});

thumb.addEventListener('keydown',e=>{
  const k=e.key, s=e.shiftKey?.2:.05;
  if(k==='ArrowRight'||k==='ArrowUp') set(open+s);
  else if(k==='ArrowLeft'||k==='ArrowDown') set(open-s);
  else if(k==='Home') set(0); else if(k==='End') set(1);
  else if(k===' '||k==='Enter') set(open>.5?0:1);
  else return; e.preventDefault();
});

const items=[
  ['Landscape','A wide inner canvas for video, split view and multitasking.'],
  ['Portrait','Two full-height columns keep reading and replying in one glance.'],
  ['Closed','The cover display handles glances, calls and camera in one hand.'],
  ['Seated','Half-folded, the device stands on its own for hands-free calls.'],
  ['Standing','A stiffened hinge holds any angle between 30° and 150°.'],
  ['Durability','Titanium hinge rated for hundreds of thousands of folds.']
];
document.getElementById('pills').innerHTML=items.map(([t,d],i)=>`
  <button class="pill" aria-expanded="false" aria-controls="p${i}"><i>+</i>${t}</button>
  <div class="panelTxt" id="p${i}">${d}</div>`).join('');
document.querySelectorAll('.pill').forEach(b=>b.onclick=()=>{
  const o=b.getAttribute('aria-expanded')==='true';
  b.setAttribute('aria-expanded',!o);
  b.nextElementSibling.classList.toggle('open',!o);
});
</script>
</body>
</html>
