<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Shader Playground</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
@import url("https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap");

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#010101;
font-family:"Fira Code","Courier New",monospace;
}

#canvasContainer{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
}

#sidebar{
position:fixed;
top:0;
right:0;
width:260px;
height:100%;
background:#0a0a0a;
border-left:1px solid #1a1a1a;
padding:40px 25px;
box-sizing:border-box;
color:#555;
display:flex;
flex-direction:column;
}

h2{
font-size:16px;
color:#fff;
margin-bottom:25px;
}

ul{
list-style:none;
padding:0;
margin:0;
display:flex;
flex-direction:column;
gap:14px;
}

li{
cursor:pointer;
font-size:13px;
}

li.active{
color:#fff;
font-weight:600;
}

#pixelUI{
margin-top:auto;
padding-top:20px;
border-top:1px solid #1a1a1a;
display:none;
}

input[type="range"]{
width:100%;
}
</style>
</head>

<body>

<div id="canvasContainer"></div>

<div id="sidebar">
<h2>Effects</h2>

<ul id="effectList">
<li data-value="normal" class="active">Normal</li>
<li data-value="lego">Lego</li>
</ul>

<div id="pixelUI">
<label>Intensity / Size</label>
<input type="range" min="6" max="32" value="10" id="pixelSize">
</div>

</div>

<script type="module">

import * as THREE from "https://esm.sh/three@0.160.0";
import { OrbitControls } from "https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js";
import { GLTFLoader } from "https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";

import {
EffectComposer,
RenderPass,
EffectPass,
Effect
} from "https://esm.sh/postprocessing@6.35.4?deps=three@0.160.0";


/* ================= SHADERS ================= */

const normalShader = `
precision highp float;
uniform vec2 resolution;
void mainImage(const in vec4 inputColor, const in vec2 uv, out vec4 outputColor) {
outputColor = texture2D(inputBuffer, uv);
}
`;

const legoShader = `
precision highp float;
uniform float pixelSize;
uniform vec2 resolution;
uniform vec2 lightPosition;

float random(vec2 st){
return fract(sin(dot(st.xy,vec2(12.9898,78.233)))*43758.5453123);
}

void mainImage(const in vec4 inputColor,const in vec2 uv,out vec4 outputColor){

vec2 s=pixelSize/resolution;
vec2 uvPixel=s*floor(uv/s);

vec4 color=texture2D(inputBuffer,uvPixel);

vec2 cellUV=fract(uv/s);

float lighting=dot(normalize(cellUV-vec2(.5)),lightPosition)*.7;

float dis=abs(distance(cellUV,vec2(.5))*2.-.5);

color.rgb*=smoothstep(.1,.0,dis)*lighting+1.;

outputColor=color;

}
`;


/* ================= POSTPROCESS HELPER ================= */

function makeEffect(name,shader,uniforms={}){

const map=new Map();

for(const k in uniforms)
map.set(k,new THREE.Uniform(uniforms[k]));

return new (class extends Effect{

constructor(){
super(name,shader,{uniforms:map});
}

update(renderer){
if(map.has("resolution")){
const c=renderer.domElement;
map.get("resolution").value.set(c.width,c.height);
}
}

})();

}


/* ================= SCENE ================= */

const scene=new THREE.Scene();
scene.background=new THREE.Color("#010101");

const camera=new THREE.PerspectiveCamera(
50,
window.innerWidth/window.innerHeight,
0.1,
100
);

camera.position.set(0,1.5,3);


/* ================= RENDERER ================= */

const container=document.getElementById("canvasContainer");

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);

container.appendChild(renderer.domElement);


/* ================= CONTROLS ================= */

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;


/* ================= LIGHTS ================= */

scene.add(new THREE.AmbientLight(0xffffff,.6));

const dl=new THREE.DirectionalLight(0xffffff,2);
dl.position.set(5,10,5);
scene.add(dl);


/* ================= MODEL ================= */

const loader=new GLTFLoader();

loader.load(
"https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Fox/glTF-Binary/Fox.glb",
(gltf)=>{

const fox=gltf.scene;

fox.scale.setScalar(.02);
fox.position.y=-.8;
fox.rotation.y=Math.PI/2;

scene.add(fox);

}
);


/* ================= EFFECTS ================= */

const normal=makeEffect("Normal",normalShader,{
resolution:new THREE.Vector2(innerWidth,innerHeight)
});

const lego=makeEffect("Lego",legoShader,{
pixelSize:10,
resolution:new THREE.Vector2(innerWidth,innerHeight),
lightPosition:new THREE.Vector2(.8,.8)
});

const map={
normal,
lego
};


/* ================= COMPOSER ================= */

const composer=new EffectComposer(renderer);

composer.addPass(new RenderPass(scene,camera));

let pass=new EffectPass(camera,normal);

composer.addPass(pass);


/* ================= UI ================= */

const listItems=document.querySelectorAll("#effectList li");

const pixelUI=document.getElementById("pixelUI");

const pixelInput=document.getElementById("pixelSize");


function switchEffect(val){

composer.removePass(pass);

pass=new EffectPass(camera,map[val]);

composer.addPass(pass);

pixelUI.style.display=val==="lego"?"block":"none";

}


listItems.forEach(item=>{

item.onclick=()=>{

listItems.forEach(li=>li.classList.remove("active"));

item.classList.add("active");

switchEffect(item.dataset.value);

};

});


pixelInput.oninput=(e)=>{

lego.uniforms.get("pixelSize").value=+e.target.value;

};


/* ================= RESIZE ================= */

window.addEventListener("resize",()=>{

camera.aspect=window.innerWidth/window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(window.innerWidth,window.innerHeight);

composer.setSize(window.innerWidth,window.innerHeight);

});


/* ================= ANIMATION ================= */

function animate(){

requestAnimationFrame(animate);

controls.update();

composer.render();

}

animate();

</script>
</body>
</html>
