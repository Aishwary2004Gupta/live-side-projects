<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Shader Playground</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap");

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #010101;
        font-family: "Fira Code", "Courier New", monospace;
      }

      /* ===== Axis HUD (top-left) ===== */
      #axisHUD {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 9999;
        pointer-events: none;
      }
      #axisCanvas {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: rgba(10, 10, 10, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(4px);
      }

      /* --- COLLAPSIBLE SIDEBAR STYLES --- */
      #sidebar {
        position: fixed;
        top: 0;
        right: 0;
        width: 280px;
        height: 100%;
        background: #0a0a0a;
        border-left: 1px solid #1a1a1a;
        padding: 40px 30px;
        box-sizing: border-box;
        z-index: 10;
        display: flex;
        flex-direction: column;
        color: #555;
        user-select: none;
        transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      }

      #sidebar.collapsed {
        transform: translateX(100%);
      }

      h2 {
        font-size: 16px;
        color: #fff;
        margin: 0 0 25px 0;
        font-weight: 600;
        letter-spacing: 0.5px;
        display: flex;
        align-items: center;
        cursor: pointer;
      }

      #toggleBtn {
        color: #555;
        margin-right: 8px;
        font-weight: 400;
        transition: color 0.2s;
        user-select: none;
        width: 20px;
        display: inline-block;
      }

      h2:hover #toggleBtn {
        color: #fff;
      }

      ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 14px;
        overflow-y: auto;
        opacity: 1;
        transition: opacity 0.2s;
      }

      #sidebar.collapsed ul,
      #sidebar.collapsed #pixelUI,
      #sidebar.collapsed #modelUI {
        opacity: 0;
        pointer-events: none;
      }

      ul::-webkit-scrollbar {
        width: 4px;
      }
      ul::-webkit-scrollbar-thumb {
        background: #222;
      }

      li {
        cursor: pointer;
        font-size: 13px;
        display: flex;
        align-items: center;
        transition: color 0.2s ease;
      }

      li::before {
        content: "○";
        font-size: 10px;
        margin-right: 15px;
        display: inline-block;
        transform: translateY(-1px);
      }

      li:hover {
        color: #999;
      }
      li.active {
        color: #fff;
        font-weight: 600;
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.15);
      }
      li.active::before {
        content: "●";
        color: #fff;
      }

      #modelUI {
        margin-top: 24px;
      }

      #modelUI label {
        display: block;
        font-size: 11px;
        margin-bottom: 6px;
        color: #555;
      }

      #modelSelect {
        width: 100%;
        background: #0a0a0a;
        color: #ccc;
        border: 1px solid #333;
        padding: 6px 8px;
        font-family: "Fira Code", monospace;
        font-size: 12px;
      }

      #pixelUI {
        margin-top: auto;
        padding-top: 20px;
        border-top: 1px solid #1a1a1a;
        display: none;
        opacity: 1;
        transition: opacity 0.2s;
      }

      #pixelUI label {
        display: block;
        font-size: 11px;
        margin-bottom: 10px;
        color: #555;
      }

      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        background: transparent;
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 12px;
        width: 12px;
        border-radius: 50%;
        background: #fff;
        cursor: pointer;
        margin-top: -5px;
      }

      input[type="range"]::-webkit-slider-runnable-track {
        width: 100%;
        height: 2px;
        cursor: pointer;
        background: #333;
      }

      /* Toggle button visible when collapsed */
      #floatingToggle {
        position: fixed;
        top: 20px;
        right: 20px;
        width: 40px;
        height: 40px;
        background: #0a0a0a;
        border: 1px solid #333;
        color: #fff;
        font-family: "Fira Code", monospace;
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 9;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }

      #floatingToggle.visible {
        opacity: 1;
        pointer-events: auto;
      }
    </style>
  </head>

  <body>
    <!-- Axis HUD -->
    <div id="axisHUD">
      <canvas id="axisCanvas" width="100" height="100"></canvas>
    </div>

    <!-- Floating toggle -->
    <div id="floatingToggle">+</div>

    <!-- Sidebar -->
    <div id="sidebar">
      <h2><span id="toggleBtn">—</span> Effects</h2>
      <ul id="effectList">
        <li data-value="normal" class="active">Normal</li>
        <li data-value="dots">Dots</li>
        <li data-value="complex">Complex Pixel</li>
        <li data-value="woven">Woven</li>
        <li data-value="lego">Lego</li>
        <li data-value="ascii">ASCII</li>
        <li data-value="dither">Dithering</li>
        <li data-value="halftone">Halftone</li>
        <li data-value="matrix">Matrix Rain</li>
        <li data-value="contour">Contour</li>
        <li data-value="blockify">Blockify</li>
        <li data-value="threshold">Threshold</li>
        <li data-value="edge">Edge Detection</li>
        <li data-value="crosshatch">Crosshatch</li>
        <li data-value="waveLines">Wave Lines</li>
        <li data-value="noise">Noise Field</li>
        <li data-value="voronoi">Voronoi</li>
        <li data-value="vhs">VHS</li>
      </ul>

      <div id="modelUI">
        <label>Model</label>
        <select id="modelSelect">
          <option value="hands">Hands (Creation of Adam)</option>
          <option value="fox">Fox</option>
          <option value="duck">Duck</option>
          <option value="avocado">Avocado</option>
          <option value="lamp">Lamp</option>
          <option value="skull">Scattering Skull</option>
          <option value="astronaut">Astronaut (OBJ)</option>
          <option value="horse">Horse (OBJ)</option>
          <option value="dragon">Dragon (OBJ)</option>
          <option value="head">Head (OBJ)</option>
        </select>
      </div>

      <div id="pixelUI">
        <label>Intensity / Size</label>
        <input type="range" min="6" max="32" value="10" id="pixelSize" />
      </div>
    </div>

    <script type="module">
      import * as THREE from "https://esm.sh/three@0.160.0";
      import { OrbitControls } from "https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js";
      import { GLTFLoader } from "https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";
      import { OBJLoader } from "https://esm.sh/three@0.160.0/examples/jsm/loaders/OBJLoader.js";
      import { AsciiEffect } from "https://esm.sh/three@0.160.0/examples/jsm/effects/AsciiEffect.js";

      import {
        EffectComposer,
        RenderPass,
        EffectPass,
        Effect,
      } from "https://esm.sh/postprocessing@6.35.4?deps=three@0.160.0";

      /* ================= MATRIX RAIN LOGIC ================= */
      class MatrixRainEffect {
        constructor() {
          this.canvas = document.createElement("canvas");
          this.ctx = this.canvas.getContext("2d");
          this.fontSize = 14;
          this.columns = 0;
          this.drops = [];
          this.chars = "ｦｧｨｩｪｫｬｭｮｯ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
          this.canvas.style.position = "fixed";
          this.canvas.style.top = "0";
          this.canvas.style.left = "0";
          this.canvas.style.zIndex = "1";
          this.canvas.style.pointerEvents = "none";
          this.canvas.style.display = "none";
          document.body.appendChild(this.canvas);
        }
        resize(w, h) {
          this.canvas.width = w;
          this.canvas.height = h;
          this.columns = Math.floor(w / this.fontSize);
          this.drops = Array(this.columns).fill(1);
        }
        render() {
          this.ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
          this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
          this.ctx.fillStyle = "#0F0";
          this.ctx.font = this.fontSize + "px monospace";
          for (let i = 0; i < this.drops.length; i++) {
            const text = this.chars.charAt(Math.floor(Math.random() * this.chars.length));
            this.ctx.fillText(text, i * this.fontSize, this.drops[i] * this.fontSize);
            if (this.drops[i] * this.fontSize > this.canvas.height && Math.random() > 0.975) {
              this.drops[i] = 0;
            }
            this.drops[i]++;
          }
        }
      }
      const matrixInstance = new MatrixRainEffect();

      /* ================= SHADERS ================= */

      const normalShader = `void mainImage(const in vec4 i, const in vec2 uv, out vec4 o) { o = texture2D(inputBuffer, uv); }`;

      const dotsShader = `
        precision highp float;
        uniform float pixelSize;
        uniform vec2 resolution;
        void mainImage(const in vec4 i, const in vec2 uv, out vec4 o) {
          vec2 s = pixelSize / resolution;
          vec2 u = s * floor(uv / s);
          vec4 c = texture2D(inputBuffer, u);
          float l = dot(vec3(0.2126, 0.7152, 0.0722), c.rgb);
          vec2 f = fract(uv / s);
          float radius = l > 0.5 ? 0.3 : l > 0.001 ? 0.12 : 0.075;
          float d = distance(f, vec2(0.5));
          float m = smoothstep(radius, radius - 0.05, d);
          o = vec4(vec3(m) * max(l, 0.05), 1.0);
        }
      `;

      const legoShader = `
        precision highp float;
        uniform float pixelSize;
        uniform vec2 resolution;
        uniform vec2 lightPosition;
        void mainImage(const in vec4 inputColor, const in vec2 uv, out vec4 outputColor) {
            vec2 s = pixelSize / resolution;
            vec2 u = s * floor(uv / s);
            vec4 color = texture2D(inputBuffer, u);
            color.rgb = floor(color.rgb * 15.0 + 0.5) / 15.0;
            vec2 f = fract(uv / s);
            float lighting = dot(normalize(f - vec2(0.5)), lightPosition) * 0.7;
            float dis = abs(distance(f, vec2(0.5)) * 2.0 - 0.5);
            color.rgb *= smoothstep(0.1, 0.0, dis) * lighting + 1.0;
            vec2 cUV = f * 2.0 - 1.0;
            vec2 border = 1.05 - pow(cUV, vec2(8.0)) * 1.5;
            color.rgb *= 0.8 + (smoothstep(0.0, 0.8, border.x * border.y) * 0.1);
            outputColor = color;
        }
      `;

      const ditherShader = `
        precision highp float;
        uniform vec2 resolution;
        const float bayer[64] = float[](0.,32.,8.,40.,2.,34.,10.,42.,48.,16.,56.,24.,50.,18.,58.,26.,12.,44.,4.,36.,14.,46.,6.,38.,60.,28.,52.,20.,62.,30.,54.,22.,3.,35.,11.,43.,1.,33.,9.,41.,51.,19.,59.,27.,49.,17.,57.,25.,15.,47.,7.,39.,13.,45.,5.,37.,63.,31.,55.,23.,61.,29.,53.,21.);
        void mainImage(const in vec4 i, const in vec2 uv, out vec4 o) {
          vec4 c = texture2D(inputBuffer, uv);
          float l = dot(c.rgb, vec3(0.299, 0.587, 0.114));
          vec2 sc = uv * resolution;
          int idx = int(mod(sc.y, 8.0)) * 8 + int(mod(sc.x, 8.0));
          o = vec4(vec3(step(bayer[idx]/64.0, l)), 1.0);
        }
      `;

      function makeEffect(name, shader, uniforms = {}) {
        const map = new Map();
        for (const k in uniforms) map.set(k, new THREE.Uniform(uniforms[k]));
        return new (class extends Effect {
          constructor() { super(name, shader, { uniforms: map }); }
          update(renderer) {
            if (map.has("resolution")) {
              const c = renderer.domElement;
              map.get("resolution").value.set(c.width, c.height);
            }
            if (map.has("time")) map.get("time").value = performance.now() / 1000;
          }
        })();
      }

      /* ================= SCENE SETUP ================= */

      const handsFocusPoint = new THREE.Vector3(0, 0, 0);
      const scene = new THREE.Scene();
      scene.background = new THREE.Color("#010101");

      const baseFrustumSize = 350;
      let camera = new THREE.OrthographicCamera(0, 0, 0, 0, 0.01, 500);
      camera.position.set(0, 0, 10);
      camera.zoom = 140;

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      document.body.appendChild(renderer.domElement);

      const composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));

      const ascii = new AsciiEffect(renderer, " .:-=+*#%@", { invert: true });
      ascii.domElement.style.position = "absolute";
      ascii.domElement.style.color = "white";
      ascii.domElement.style.background = "black";

      /* ================= LIGHTS ================= */
      scene.add(new THREE.AmbientLight(0xffffff, 0.6));
      const dl = new THREE.DirectionalLight(0xffffff, 10);
      dl.position.set(5, 10, 0);
      scene.add(dl);

      /* ================= MODELS ================= */
      const gltfLoader = new GLTFLoader();
      const objLoader = new OBJLoader();
      let currentModel = null;

      const MODELS = {
        hands: { url: "https://cdn.maximeheckel.com/models/creation-of-adam.glb", scale: 3.2, rotation: { x: -0.1, y: -Math.PI / 2 + 0.08, z: 0 }, position: { x: 1.8, y: -1.4, z: 0 } },
        fox: { url: "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Fox/glTF-Binary/Fox.glb", scale: 0.02, rotation: { x: 0, y: -Math.PI / 2, z: 0 }, position: { x: 0, y: -0.8, z: 0 } },
        duck: { url: "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Duck/glTF-Binary/Duck.glb", scale: 1.2, rotation: { x: 0, y: 0.5, z: 0 }, position: { x: 0, y: -1, z: 0 } },
        astronaut: { url: "https://raw.githubusercontent.com/Aishwary2004Gupta/ThreeJS_visuals/main/assets/astronaut.obj", scale: 0.5, rotation: { x: 0, y: -Math.PI / 2, z: 0 }, position: { x: 0, y: -1, z: 0 } },
        horse: { url: "https://raw.githubusercontent.com/pichiliani/ModelsOBJ/master/horse.obj", scale: 10, rotation: { x: Math.PI / 2, y: 3.2, z: 0 }, position: { x: 0, y: 0, z: 0 } },
        avocado: { url: "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Avocado/glTF-Binary/Avocado.glb", scale: 30.0, rotation: { x: 0, y: Math.PI, z: 0 }, position: { x: 0, y: -1, z: 0 } },
        lamp: { url: "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/LightsPunctualLamp/glTF-Binary/LightsPunctualLamp.glb", scale: 1.0, rotation: { x: 0, y: Math.PI, z: 0 }, position: { x: 0, y: -1, z: 0 } },
        skull: { url: "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/ScatteringSkull/glTF-Binary/ScatteringSkull.glb", scale: 8.0, rotation: { x: -0.2, y: -Math.PI / 2 - 1.9, z: 0 }, position: { x: 0, y: -0.9, z: 0 } },
      };

      function loadModel(name) {
        const cfg = MODELS[name] || MODELS["hands"];
        if (currentModel) scene.remove(currentModel);
        const isObj = cfg.url.toLowerCase().endsWith(".obj");
        const loader = isObj ? objLoader : gltfLoader;

        loader.load(cfg.url, (result) => {
          currentModel = isObj ? result : result.scene;
          currentModel.scale.setScalar(cfg.scale);
          currentModel.rotation.set(cfg.rotation.x, cfg.rotation.y, cfg.rotation.z);
          currentModel.position.set(cfg.position.x, cfg.position.y, cfg.position.z);
          if (isObj) {
            currentModel.traverse(c => { if (c.isMesh) c.material = new THREE.MeshStandardMaterial({ color: 0xffffff }); });
          }
          scene.add(currentModel);
        });
      }

      /* ================= EFFECTS INIT ================= */
      const map = {
        normal: makeEffect("Normal", normalShader),
        dots: makeEffect("Dots", dotsShader, { pixelSize: 10.0, resolution: new THREE.Vector2() }),
        lego: makeEffect("Lego", legoShader, { pixelSize: 10.0, resolution: new THREE.Vector2(), lightPosition: new THREE.Vector2(0.8, 0.8) }),
        dither: makeEffect("Dither", ditherShader, { resolution: new THREE.Vector2() }),
        halftone: makeEffect("Halftone", halftoneShader, { pixelSize: 10.0, resolution: new THREE.Vector2() }),
      };

      let pass = new EffectPass(camera, map.normal);
      composer.addPass(pass);

      /* ================= UI LOGIC ================= */
      const modelSelect = document.getElementById("modelSelect");
      const effectList = document.querySelectorAll("#effectList li");
      const pixelUI = document.getElementById("pixelUI");
      const axisCanvas = document.getElementById("axisCanvas");
      const axisCtx = axisCanvas.getContext("2d");

      function switchEffect(val) {
        composer.removePass(pass);
        ascii.domElement.style.display = "none";
        matrixInstance.canvas.style.display = "none";
        renderer.domElement.style.display = "block";

        if (val === "ascii") {
          renderer.domElement.style.display = "none";
          document.body.appendChild(ascii.domElement);
          ascii.domElement.style.display = "block";
        } else if (val === "matrix") {
          matrixInstance.canvas.style.display = "block";
        } else if (map[val]) {
          pass = new EffectPass(camera, map[val]);
          composer.addPass(pass);
        }

        pixelUI.style.display = ["dots", "lego", "halftone"].includes(val) ? "block" : "none";
      }

      effectList.forEach(li => li.addEventListener("click", () => {
        effectList.forEach(el => el.classList.remove("active"));
        li.classList.add("active");
        switchEffect(li.dataset.value);
      }));

      modelSelect.addEventListener("change", (e) => loadModel(e.target.value));

      /* ================= ANIMATION ================= */
      function drawAxis(v, color, cx, cy, scale) {
        const ex = cx + v.x * scale, ey = cy - v.y * scale;
        axisCtx.strokeStyle = color;
        axisCtx.lineWidth = 3;
        axisCtx.globalAlpha = v.z < 0 ? 0.3 : 1.0;
        axisCtx.beginPath();
        axisCtx.moveTo(cx, cy);
        axisCtx.lineTo(ex, ey);
        axisCtx.stroke();
      }

      function updateAxisHUD() {
        axisCtx.clearRect(0, 0, 100, 100);
        const invQ = camera.quaternion.clone().invert();
        const xV = new THREE.Vector3(1, 0, 0).applyQuaternion(invQ);
        const yV = new THREE.Vector3(0, 1, 0).applyQuaternion(invQ);
        const zV = new THREE.Vector3(0, 0, 1).applyQuaternion(invQ);
        drawAxis(xV, "#ff4d4d", 50, 50, 35);
        drawAxis(yV, "#46ff7a", 50, 50, 35);
        drawAxis(zV, "#4da6ff", 50, 50, 35);
      }

      const controls = new OrbitControls(camera, renderer.domElement);
      
      let currentLayoutWidth = window.innerWidth;
      function updateLayout() {
        const w = isPanelOpen ? window.innerWidth - 280 : window.innerWidth;
        renderer.setSize(w, window.innerHeight);
        composer.setSize(w, window.innerHeight);
        matrixInstance.resize(w, window.innerHeight);
        ascii.setSize(w, window.innerHeight);
        camera.left = -baseFrustumSize * (w / window.innerHeight) / 2;
        camera.right = baseFrustumSize * (w / window.innerHeight) / 2;
        camera.top = baseFrustumSize / 2;
        camera.bottom = -baseFrustumSize / 2;
        camera.updateProjectionMatrix();
      }

      let isPanelOpen = true;
      const sidebar = document.getElementById("sidebar");
      const toggleBtn = document.getElementById("toggleBtn");
      const floatingToggle = document.getElementById("floatingToggle");

      function togglePanel() {
        isPanelOpen = !isPanelOpen;
        sidebar.classList.toggle("collapsed");
        floatingToggle.classList.toggle("visible");
        toggleBtn.textContent = isPanelOpen ? "—" : "+";
        updateLayout();
      }
      document.querySelector("h2").onclick = togglePanel;
      floatingToggle.onclick = togglePanel;

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        updateAxisHUD();
        const active = document.querySelector("#effectList li.active").dataset.value;
        if (active === "ascii") ascii.render(scene, camera);
        else composer.render();
        if (active === "matrix") matrixInstance.render();
      }

      window.addEventListener("resize", updateLayout);
      loadModel("hands");
      updateLayout();
      animate();
    </script>
  </body>
</html>
