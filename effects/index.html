<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Shader Playground</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap");

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #010101;
        font-family: "Fira Code", "Courier New", monospace;
      }

      #sidebar {
        position: fixed;
        top: 0;
        right: 0;
        width: 280px;
        height: 100%;
        background: #0a0a0a;
        border-left: 1px solid #1a1a1a;
        padding: 40px 30px;
        box-sizing: border-box;
        z-index: 10;
        display: flex;
        flex-direction: column;
        color: #555;
        user-select: none;
        transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      }

      #sidebar.collapsed {
        transform: translateX(100%);
      }

      h2 {
        font-size: 16px;
        color: #fff;
        margin: 0 0 25px 0;
        font-weight: 600;
        letter-spacing: 0.5px;
        display: flex;
        align-items: center;
        cursor: pointer;
      }

      #toggleBtn {
        color: #555;
        margin-right: 8px;
        font-weight: 400;
        transition: color 0.2s;
        user-select: none;
        width: 20px;
        display: inline-block;
      }

      h2:hover #toggleBtn {
        color: #fff;
      }

      ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 14px;
        overflow-y: auto;
        opacity: 1;
        transition: opacity 0.2s;
      }

      #sidebar.collapsed ul,
      #sidebar.collapsed #pixelUI {
        opacity: 0;
        pointer-events: none;
      }

      ul::-webkit-scrollbar {
        width: 4px;
      }
      ul::-webkit-scrollbar-thumb {
        background: #222;
      }

      li {
        cursor: pointer;
        font-size: 13px;
        display: flex;
        align-items: center;
        transition: color 0.2s ease;
      }

      li::before {
        content: "○";
        font-size: 10px;
        margin-right: 15px;
        display: inline-block;
        transform: translateY(-1px);
      }

      li:hover {
        color: #999;
      }
      li.active {
        color: #fff;
        font-weight: 600;
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.15);
      }
      li.active::before {
        content: "●";
        color: #fff;
      }

      #pixelUI {
        margin-top: auto;
        padding-top: 20px;
        border-top: 1px solid #1a1a1a;
        display: none;
        opacity: 1;
        transition: opacity 0.2s;
      }

      #pixelUI label {
        display: block;
        font-size: 11px;
        margin-bottom: 10px;
        color: #555;
      }

      input[type="range"] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 12px;
        width: 12px;
        border-radius: 50%;
        background: #fff;
        cursor: pointer;
        margin-top: -5px;
      }

      input[type="range"]::-webkit-slider-runnable-track {
        width: 100%;
        height: 2px;
        cursor: pointer;
        background: #333;
      }

      #floatingToggle {
        position: fixed;
        top: 20px;
        right: 20px;
        width: 40px;
        height: 40px;
        background: #0a0a0a;
        border: 1px solid #333;
        color: #fff;
        font-family: "Fira Code", monospace;
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 9;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }

      #floatingToggle.visible {
        opacity: 1;
        pointer-events: auto;
      }
    </style>
  </head>

  <body>
    <div id="floatingToggle">+</div>

    <div id="sidebar">
      <h2><span id="toggleBtn">—</span> Effects</h2>
      <ul id="effectList">
        <li data-value="dots" class="active">Dots</li>
        <li data-value="complex">Complex Pixel</li>
        <li data-value="ledGrid">LED Grid</li>
        <li data-value="ascii">ASCII</li>
        <li data-value="dither">Dithering</li>
        <li data-value="halftone">Halftone</li>
        <li data-value="matrix">Matrix Rain</li>
        <li data-value="contour">Contour</li>
        <li data-value="blockify">Blockify</li>
        <li data-value="threshold">Threshold</li>
        <li data-value="edge">Edge Detection</li>
        <li data-value="crosshatch">Crosshatch</li>
        <li data-value="waveLines">Wave Lines</li>
        <li data-value="noise">Noise Field</li>
        <li data-value="voronoi">Voronoi</li>
        <li data-value="vhs">VHS</li>
      </ul>

      <div id="pixelUI">
        <label>Intensity / Size</label>
        <input type="range" min="6" max="32" value="10" id="pixelSize" />
      </div>
    </div>

    <script type="module">
      import * as THREE from "https://esm.sh/three@0.160.0";
      import { OrbitControls } from "https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js";
      import { GLTFLoader } from "https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";
      import { AsciiEffect } from "https://esm.sh/three@0.160.0/examples/jsm/effects/AsciiEffect.js";

      import {
        EffectComposer,
        RenderPass,
        EffectPass,
        Effect,
        PixelationEffect,
        ScanlineEffect,
      } from "https://esm.sh/postprocessing@6.35.4?deps=three@0.160.0";

      const handsFocusPoint = new THREE.Vector3(0, 0, 0);

      /* ================= SHADERS ================= */

      const complexShader = `
        precision highp float;
        uniform float pixelSize;
        uniform vec2 resolution;

        float circleSDF(vec2 p) {
            return length(p - 0.5);
        }

        void mainImage(const in vec4 inputColor, const in vec2 uv, out vec4 outputColor) {
            vec2 normalizedPixelSize = pixelSize / resolution;
            vec2 uvPixel = normalizedPixelSize * floor(uv / normalizedPixelSize);
            vec4 color = texture2D(inputBuffer, uvPixel);

            float luma = dot(vec3(0.2126, 0.7152, 0.0722), color.rgb);
            
            vec2 cellUV = fract(uv / normalizedPixelSize);
            color = vec4(1.0);

            float d = circleSDF(cellUV);
            
            if (luma > 0.2) {
              if (d < 0.3) {
                color = vec4(0.0,0.31,0.933,1.0);
              } else {
                color = vec4(1.0,1.0,1.0,1.0);
              }
            }

            if(luma > 0.75) {
              if(d < 0.3) {
                color = vec4(1.0,1.0,1.0,1.0);
              } else {
                color = vec4(0.0,0.31,0.933,1.0);
              }
            }

            if(luma > 0.99) {
              color = vec4(0.0,0.31,0.933,1.0);
            }

            outputColor = color;
        }
      `;

      const ledShader = `
        precision highp float;
        uniform float pixelSize;
        uniform vec2 resolution;

        float random(vec2 st) {
            return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
        }

        vec3 rgbToHsv(vec3 c) {
            vec4 K = vec4(0.0, -1.0/3.0, 2.0/3.0, -1.0);
            vec4 p = mix(vec4(c.bg, K.wz), vec4(c.gb, K.xy), step(c.b, c.g));
            vec4 q = mix(vec4(p.xyw, c.r), vec4(c.r, p.yzx), step(p.x, c.r));
            float d = q.x - min(q.w, q.y);
            float e = 1.0e-10;
            return vec3(abs(q.z + (q.w - q.y) / (6.0 * d + e)), d / (q.x + e), q.x);
        }

        vec3 hsvToRgb(vec3 c) {
            vec4 K = vec4(1.0, 2.0/3.0, 1.0/3.0, 3.0);
            vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
            return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
        }

        float noise(vec2 st) {
            vec2 i = floor(st);
            vec2 f = fract(st);
            float a = random(i);
            float b = random(i + vec2(1.0, 0.0));
            float c = random(i + vec2(0.0, 1.0));
            float d = random(i + vec2(1.0, 1.0));
            vec2 u = f * f * (3.0 - 2.0 * f);
            return mix(a, b, u.x) +
                   (c - a) * u.y * (1.0 - u.x) +
                   (d - b) * u.x * u.y;
        }

        void mainImage(const in vec4 inputColor, const in vec2 uv, out vec4 outputColor) {
            vec2 normalizedPixelSize = pixelSize / resolution;
            vec2 uvPixel = normalizedPixelSize * floor(uv / normalizedPixelSize);
            vec4 color = texture2D(inputBuffer, uvPixel);

            vec2 cellPosition = floor(uv / normalizedPixelSize);
            vec2 cellUV = fract(uv / normalizedPixelSize);

            float rowOffset = sin((random(vec2(0.0, uvPixel.y)) - 0.5) * 0.25);
            cellUV.x += rowOffset; 
            vec2 centered = cellUV - 0.5;

            float noiseAmount = 0.18;
            vec2 noisyCenter = centered + (vec2(
                random(cellPosition + centered),
                random(cellPosition + centered)
            ) - 0.5) * noiseAmount;

            float isAlternate = mod(cellPosition.x, 2.0);
            float angle = isAlternate == 0.0 ? radians(-65.0) : radians(65.0);
            
            vec2 rotated = vec2(
                noisyCenter.x * cos(angle) - noisyCenter.y * sin(angle),
                noisyCenter.x * sin(angle) + noisyCenter.y * cos(angle)
            );
            
            float aspectRatio = 1.55;
            float ellipse = length(vec2(rotated.x, rotated.y * aspectRatio - 0.075));

            color.rgb *= smoothstep(0.2, 1.0, 1.0 - ellipse);
            
            float stripeNoise = noise(vec2(centered.x, centered.y * 100.0)); 
            color.rgb *= stripeNoise + 0.4;

            float hueShift = (random(cellPosition) - 0.5) * 0.08;
            vec3 hsv = rgbToHsv(color.rgb);
            hsv.x += hueShift;
            color.rgb = hsvToRgb(hsv);

            color.rgb *= smoothstep(0.2, 1.0, 1.0 - ellipse);
            outputColor = color;
        }
      `;

      const dotsShader = `
        precision highp float;
        uniform float pixelSize;
        uniform vec2 resolution;
        void mainImage(const in vec4 i, const in vec2 uv, out vec4 o) {
          vec2 normalizedPixelSize = pixelSize / resolution;
          vec2 uvPixel = normalizedPixelSize * floor(uv / normalizedPixelSize);
          vec4 color = texture2D(inputBuffer, uvPixel);

          float luma = dot(vec3(0.2126, 0.7152, 0.0722), color.rgb);
          vec2 cellUV = fract(uv / normalizedPixelSize);

          float radius = luma > 0.5 ? 0.3 : luma > 0.001 ? 0.12 : 0.075;
          vec2 circleCenter = luma > 0.5 ? vec2(0.5, 0.5) : vec2(0.25, 0.25);
          float distanceFromCenter = distance(cellUV, circleCenter);

          float circleMask = smoothstep(radius, radius - 0.05, distanceFromCenter);
          color.rgb = vec3(circleMask) * max(luma, 0.05);

          o = color;
        }
      `;

      // ditherShader, halftoneShader, waveLinesShader, noise_shader, voronoiShader, vhsShader,
      // MatrixRainEffect, contourShader, edgeShader, blockifyShader, thresholdShader, crosshatchShader
      // are exactly as in the previous message (omitted here for brevity but unchanged).
      // --- BEGIN short versions (same as before) ---

      const ditherShader = `precision highp float;uniform vec2 resolution;const float bayer[64]=float[](0.0,32.0,8.0,40.0,2.0,34.0,10.0,42.0,48.0,16.0,56.0,24.0,50.0,18.0,58.0,26.0,12.0,44.0,4.0,36.0,14.0,46.0,6.0,38.0,60.0,28.0,52.0,20.0,62.0,30.0,54.0,22.0,3.0,35.0,11.0,43.0,1.0,33.0,9.0,41.0,51.0,19.0,59.0,27.0,49.0,17.0,57.0,25.0,15.0,47.0,7.0,39.0,13.0,45.0,5.0,37.0,63.0,31.0,55.0,23.0,61.0,29.0,53.0,21.0);void mainImage(const in vec4 i,const in vec2 uv,out vec4 o){vec4 c=texture2D(inputBuffer,uv);float luma=dot(c.rgb,vec3(0.299,0.587,0.114));vec2 sc=uv*resolution;int x=int(mod(sc.x,8.0));int y=int(mod(sc.y,8.0));int idx=y*8+x;float th=bayer[idx]/64.0;float d=step(th,luma);o=vec4(vec3(d),1.0);}`;
      const halftoneShader = `
        precision highp float;
        uniform float pixelSize;
        uniform vec2 resolution;
        void mainImage(const in vec4 i,const in vec2 uv,out vec4 o){
          vec2 s=pixelSize/resolution;
          vec2 u=s*floor(uv/s)+0.5*s;
          vec4 c=texture2D(inputBuffer,u);
          float l=dot(c.rgb,vec3(.2126,.7152,.0722));
          vec2 f=fract(uv/s);
          float r=(1.0-l)*0.5;
          float d=distance(f,vec2(.5));
          float m=smoothstep(r+0.02,r,d);
          o=vec4(vec3(m),1.0);
        }`;
      const waveLinesShader = `
        precision highp float;
        uniform float time;
        uniform vec2 resolution;
        float random(vec2 st){return fract(sin(dot(st.xy,vec2(12.9898,78.233)))*43758.5453123);}
        void mainImage(const in vec4 i,const in vec2 uv,out vec4 o){
          vec4 c=texture2D(inputBuffer,uv);
          float luma=dot(c.rgb,vec3(.2126,.7152,.0722));
          float handMask=smoothstep(0.01,0.05,luma);
          vec2 duv=uv;duv.y+=sin(uv.x*15.0+time*1.5)*0.003*luma;
          float linesCount=max(resolution.y/5.5,50.0);
          float yPos=fract(duv.y*linesCount);
          float dist=abs(yPos-0.5);
          float thickness=luma*0.4;
          float line=smoothstep(thickness+0.05,thickness,dist);
          vec3 finalColor=vec3(line);
          float g=random(uv*(time+0.1))*0.18;
          finalColor+=g;
          finalColor*=handMask;
          o=vec4(finalColor,1.0);
        }`;
      const noise_shader = `
        precision highp float;
        uniform float time;
        uniform vec2 resolution;
        float random(vec2 st){return fract(sin(dot(st.xy,vec2(12.9898,78.233)))*43758.5453123);}
        void mainImage(const in vec4 ic,const in vec2 uv,out vec4 oc){
          float luma=dot(texture2D(inputBuffer,uv).rgb,vec3(0.299,0.587,0.114));
          float handMask=smoothstep(0.02,0.06,luma);
          if(handMask<0.001){oc=vec4(0.0,0.0,0.0,1.0);return;}
          vec2 coord=uv;
          float scanLineCount=floor(resolution.y/4.0);
          float lineId=floor(coord.y*scanLineCount);
          float lr=random(vec2(lineId,floor(time*4.0)));
          if(lr>0.92)coord.x+=random(vec2(lineId,time))*0.015;
          if(lr<0.07){oc=vec4(vec3(0.0)*handMask,1.0);return;}
          float grainPixelSize=1.0;
          vec2 gUV=floor(coord*resolution/grainPixelSize)*grainPixelSize/resolution;
          float sg=random(vec2(gUV.x,gUV.y+floor(time*30.0)));
          sg=step(0.48,sg);
          sg-=random(gUV+time)*0.12;
          sg*=luma*1.5;
          vec3 fc=vec3(clamp(sg,0.0,1.0));
          oc=vec4(fc*handMask,1.0);
        }`;
      const voronoiShader = `precision highp float;uniform float time;uniform vec2 resolution;vec2 hash(vec2 p){p=vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3)));return -1.0+2.0*fract(sin(p)*43758.5453123);}float rand(vec2 co){return fract(sin(dot(co.xy,vec2(12.9898,78.233)))*43758.5453);}void mainImage(const in vec4 ic,const in vec2 uv,out vec4 oc){vec4 original=texture2D(inputBuffer,uv);float originalLuma=dot(original.rgb,vec3(0.299,0.587,0.114));float handMask=smoothstep(0.01,0.04,originalLuma);float cellScale=42.0;vec2 ratio=vec2(resolution.x/resolution.y,1.0);vec2 drift=vec2(time*0.15,time*0.1);vec2 coord=uv*ratio*cellScale+drift;vec2 cell=floor(coord);vec2 local=fract(coord);float minDist=8.0;float secondMinDist=8.0;vec2 centerUV=vec2(0.0);for(int y=-1;y<=1;y++){for(int x=-1;x<=1;x++){vec2 n=vec2(float(x),float(y));vec2 cellPos=cell+n;vec2 point=vec2(0.5)+0.4*sin(time*1.5+6.2831*hash(cellPos));vec2 diff=n+point-local;float dist=length(diff);if(dist<minDist){secondMinDist=minDist;minDist=dist;centerUV=(cellPos+point-drift)/(ratio*cellScale);}else if(dist<secondMinDist){secondMinDist=dist;}}}vec4 cellColor=texture2D(inputBuffer,centerUV);float cellLuma=dot(cellColor.rgb,vec3(0.299,0.587,0.114));cellLuma=smoothstep(0.05,0.6,cellLuma*1.3);float borderDist=secondMinDist-minDist;float border=smoothstep(0.01,0.08,borderDist);float finalLuma=cellLuma*border*handMask;float g=(rand(uv*(time+1.0))-0.5)*0.12;vec3 fo=vec3(finalLuma+g);oc=vec4(fo,1.0);}`;
      const vhsShader = `precision highp float;uniform float time;uniform vec2 resolution;float rand(vec2 co){return fract(sin(dot(co.xy,vec2(12.9898,78.233)))*43758.5453);}void mainImage(const in vec4 i,const in vec2 uv,out vec4 o){float jitter=(rand(vec2(time,uv.y))-0.5)*step(0.98,rand(vec2(time*0.5,0.0)))*0.02;float wave=sin(uv.y*3.0+time*2.0)*0.005;vec2 suv=uv+vec2(jitter+wave,0.0);float shift=0.005;float r=texture2D(inputBuffer,suv+vec2(shift,0.0)).r;float g=texture2D(inputBuffer,suv).g;float b=texture2D(inputBuffer,suv-vec2(shift,0.0)).b;vec3 col=vec3(r,g,b);float sl=sin(suv.y*resolution.y*0.8)*0.1;col-=sl;float n=(rand(suv+time)-0.5)*0.15;col+=n;col=mix(col,vec3(dot(col,vec3(0.299,0.587,0.114))),0.2);o=vec4(col,1.0);}`;
      // contourShader, edgeShader, blockifyShader, thresholdShader, crosshatchShader identical to previous message
      const contourShader = `
        precision highp float;
        uniform vec2 resolution;
        vec4 sampleOffset(vec2 uv, vec2 off){ return texture2D(inputBuffer, uv + off / resolution); }
        void mainImage(const in vec4 i,const in vec2 uv,out vec4 o){
          float sx = -1.0*dot(sampleOffset(uv, vec2(-1.,-1.)).rgb, vec3(0.3)) + 1.0*dot(sampleOffset(uv, vec2(1.,-1.)).rgb, vec3(0.3))
                   -2.0*dot(sampleOffset(uv, vec2(-1.,0.)).rgb, vec3(0.3)) + 2.0*dot(sampleOffset(uv, vec2(1.,0.)).rgb, vec3(0.3))
                   -1.0*dot(sampleOffset(uv, vec2(-1.,1.)).rgb, vec3(0.3)) + 1.0*dot(sampleOffset(uv, vec2(1.,1.)).rgb, vec3(0.3));
          float sy = -1.0*dot(sampleOffset(uv, vec2(-1.,-1.)).rgb, vec3(0.3)) -2.0*dot(sampleOffset(uv, vec2(0.,-1.)).rgb, vec3(0.3)) -1.0*dot(sampleOffset(uv, vec2(1.,-1.)).rgb, vec3(0.3))
                   +1.0*dot(sampleOffset(uv, vec2(-1.,1.)).rgb, vec3(0.3)) +2.0*dot(sampleOffset(uv, vec2(0.,1.)).rgb, vec3(0.3)) +1.0*dot(sampleOffset(uv, vec2(1.,1.)).rgb, vec3(0.3));
          float g = length(vec2(sx,sy));
          vec3 paper = vec3(0.94, 0.94, 0.90);
          vec3 ink = vec3(0.05, 0.05, 0.1);
          float luma = dot(texture2D(inputBuffer, uv).rgb, vec3(0.299, 0.587, 0.114));
          vec3 shadedPaper = mix(paper, paper * 0.8, luma); 
          float edge = smoothstep(0.05, 0.3, g);
          vec3 finalColor = mix(shadedPaper, ink, edge);
          o = vec4(finalColor, 1.0);
        }
      `;
      const edgeShader = `
        precision highp float;
        uniform vec2 resolution;
        vec4 sampleOffset(vec2 uv, vec2 off){ return texture2D(inputBuffer, uv + off / resolution); }
        void mainImage(const in vec4 i,const in vec2 uv,out vec4 o){
          float c = -4.0*dot(sampleOffset(uv, vec2(0.,0.)).rgb, vec3(0.3));
          c += 1.0*dot(sampleOffset(uv, vec2(-1.,0.)).rgb, vec3(0.3));
          c += 1.0*dot(sampleOffset(uv, vec2(1.,0.)).rgb, vec3(0.3));
          c += 1.0*dot(sampleOffset(uv, vec2(0.,-1.)).rgb, vec3(0.3));
          c += 1.0*dot(sampleOffset(uv, vec2(0.,1.)).rgb, vec3(0.3));
          float edgeStrength = abs(c);
          vec4 base = texture2D(inputBuffer, uv);
          vec3 dimmed = base.rgb * 0.4; 
          vec3 neonColor = vec3(1.0, 0.2, 0.6); 
          float glow = smoothstep(0.01, 0.3, edgeStrength);
          vec3 finalColor = mix(dimmed, neonColor, glow);
          o = vec4(finalColor, 1.0);
        }
      `;
      const blockifyShader = `
        precision highp float;
        uniform float pixelSize;
        uniform vec2 resolution;
        void mainImage(const in vec4 i,const in vec2 uv,out vec4 o){
          vec2 s = pixelSize / resolution;
          vec2 u = s * floor(uv / s);
          vec4 c = texture2D(inputBuffer, u);
          o = c;
        }
      `;
      const thresholdShader = `
        precision highp float;
        uniform vec2 resolution;
        float getDither(vec2 pos) {
            int x = int(mod(pos.x, 4.0));
            int y = int(mod(pos.y, 4.0));
            int index = x + y * 4;
            float dither[16] = float[](
                0.0, 8.0, 2.0, 10.0,
                12.0, 4.0, 14.0, 6.0,
                3.0, 11.0, 1.0, 9.0,
                15.0, 7.0, 13.0, 5.0
            );
            return dither[index] / 16.0;
        }
        void mainImage(const in vec4 i,const in vec2 uv,out vec4 o){
          vec4 c = texture2D(inputBuffer, uv);
          float luma = dot(c.rgb, vec3(.2126,.7152,.0722));
          vec2 screenPos = uv * resolution;
          float ditherValue = getDither(screenPos);
          float t = step(0.4 + ditherValue * 0.3, luma);
          vec3 color = mix(vec3(0.05, 0.05, 0.1), vec3(1.0), t);
          o = vec4(color, 1.0);
        }
      `;
      const crosshatchShader = `
        precision highp float;
        uniform vec2 resolution;
        float hatchLine(vec2 p, vec2 dir, float spacing, float thickness) {
          float v = dot(p, dir);
          float m = abs(mod(v, spacing) - spacing * 0.5);
          return 1.0 - smoothstep(thickness * 0.5, thickness, m);
        }
        void mainImage(const in vec4 i,const in vec2 uv,out vec4 o){
          vec4 src = texture2D(inputBuffer, uv);
          float l = dot(src.rgb, vec3(.2126,.7152,.0722));
          float minRes = min(resolution.x, resolution.y);
          vec2 p = uv * minRes;
          float darkness = 1.0 - l;
          float baseSpacing = mix(30.0, 6.0, smoothstep(0.0, 1.0, darkness));
          float baseThickness = mix(1.2, 4.5, smoothstep(0.0, 1.0, darkness));
          float a1 = hatchLine(p, normalize(vec2(1.0, 1.0)), baseSpacing, baseThickness);
          float a2 = hatchLine(p, normalize(vec2(1.0, -1.0)), baseSpacing * 0.7, baseThickness * 0.85);
          float a3 = hatchLine(p, normalize(vec2(1.0, 0.0)), baseSpacing * 0.5, baseThickness * 0.6);
          float hatch = clamp(a1 * 0.9 + a2 * 0.7 + a3 * 0.5, 0.0, 1.0);
          float ink = mix(1.0 - hatch, l * 0.8 + 0.2 * (1.0 - l), 0.0);
          vec3 color = vec3(ink);
          o = vec4(color, 1.0);
        }
      `;
      // --- END reused shader snippets ---

      class DotsEffect extends Effect {
        constructor(v) {
          super("Dots", dotsShader, {
            uniforms: new Map([
              ["pixelSize", new THREE.Uniform(v)],
              ["resolution", new THREE.Uniform(new THREE.Vector2(innerWidth * devicePixelRatio, innerHeight * devicePixelRatio))]
            ]),
          });
          this.v = v;
        }
        update(renderer) {
          this.uniforms.get("pixelSize").value = this.v;
          const canvas = renderer.domElement;
          this.uniforms.get("resolution").value.set(canvas.width, canvas.height);
        }
      }

      class DitherEffect extends Effect {
        constructor() {
          super("Dither", ditherShader);
        }
      }

      function makeEffect(name, shader, uniforms = {}) {
        const map = new Map();
        for (const k in uniforms) map.set(k, new THREE.Uniform(uniforms[k]));
        return new (class extends Effect {
          constructor() {
            super(name, shader, { uniforms: map });
          }
          update(renderer) {
            if (map.has("resolution")) {
              const c = renderer.domElement;
              map.get("resolution").value.set(c.width, c.height);
            }
            if (map.has("time"))
              map.get("time").value = performance.now() / 1000;
          }
        })();
      }

      /* ================= SCENE / CAMERA ================= */

      const scene = new THREE.Scene();
      scene.background = new THREE.Color("#010101");

      const baseFrustumSize = 350;
      let camera;
      let isPanelOpen = true;

      let currentLayoutWidth = window.innerWidth - 280;
      let targetLayoutWidth = window.innerWidth - 280;
      const sidebarWidth = 280;

      function updateCamera() {
        const aspect = currentLayoutWidth / window.innerHeight;
        camera.left = (-baseFrustumSize * aspect) / 2;
        camera.right = (baseFrustumSize * aspect) / 2;
        camera.top = baseFrustumSize / 2;
        camera.bottom = -baseFrustumSize / 2;
        camera.updateProjectionMatrix();
      }

      camera = new THREE.OrthographicCamera(0, 0, 0, 0, 0.01, 500);
      camera.position.set(0, 0, -5);
      camera.zoom = 140;
      camera.lookAt(handsFocusPoint);
      updateCamera();

      /* ================= RENDERERS ================= */

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(currentLayoutWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const ascii = new AsciiEffect(renderer, " .:-=+*#%@", { invert: true });
      ascii.domElement.style.position = "absolute";
      ascii.domElement.style.color = "white";
      ascii.domElement.style.background = "black";

      class MatrixRainEffectWrapper extends MatrixRainEffect {}
      const matrix = new MatrixRainEffectWrapper(renderer, camera);
      matrix.domElement.style.position = "absolute";
      matrix.domElement.style.top = "0";
      matrix.domElement.style.left = "0";

      /* ================= EFFECT INSTANCES ================= */

      const dots = new DotsEffect(10);
      const dither = makeEffect("Dither", ditherShader, {
        resolution: new THREE.Vector2(innerWidth, innerHeight),
      });
      const pixel = new PixelationEffect(6);
      const scan = new ScanlineEffect({ density: 1.1 });

      const halftone = makeEffect("Halftone", halftoneShader, {
        pixelSize: 10.0,
        resolution: new THREE.Vector2(innerWidth, innerHeight),
      });

      const complex = makeEffect("Complex", complexShader, {
        pixelSize: 10.0,
        resolution: new THREE.Vector2(innerWidth, innerHeight),
      });

      const ledGrid = makeEffect("LEDGrid", ledShader, {
        pixelSize: 10.0,
        resolution: new THREE.Vector2(innerWidth, innerHeight),
      });

      const contour = makeEffect("Contour", contourShader, {
        resolution: new THREE.Vector2(innerWidth, innerHeight),
      });

      const blockify = makeEffect("Blockify", blockifyShader, {
        pixelSize: 8.0,
        resolution: new THREE.Vector2(innerWidth, innerHeight),
      });

      const threshold = makeEffect("Threshold", thresholdShader, {
        resolution: new THREE.Vector2(innerWidth, innerHeight),
      });

      const edge = makeEffect("Edge", edgeShader, {
        resolution: new THREE.Vector2(innerWidth, innerHeight),
      });

      const crosshatch = makeEffect("Crosshatch", crosshatchShader, {
        resolution: new THREE.Vector2(innerWidth, innerHeight),
      });

      const waveLines = makeEffect("WaveLines", waveLinesShader, {
        time: 0.0,
        resolution: new THREE.Vector2(innerWidth, innerHeight),
      });

      const noise = makeEffect("Noise", noise_shader, {
        time: 0.0,
        resolution: new THREE.Vector2(innerWidth, innerHeight),
      });

      const voronoi = makeEffect("Voronoi", voronoiShader, {
        time: 0.0,
        resolution: new THREE.Vector2(innerWidth, innerHeight),
      });

      const vhs = makeEffect("VHS", vhsShader, {
        time: 0.0,
        resolution: new THREE.Vector2(innerWidth, innerHeight),
      });

      const map = {
        dots,
        complex,
        ledGrid,
        dither,
        halftone,
        matrix,
        contour,
        blockify,
        threshold,
        edge,
        crosshatch,
        waveLines,
        noise,
        voronoi,
        vhs,
      };

      /* ================= CONTROLS ================= */

      let controls = new OrbitControls(camera, renderer.domElement);
      controls.enablePan = false;
      controls.enableDamping = true;
      controls.target = handsFocusPoint;
      controls.update();

      /* ================= LIGHTS / MODEL ================= */

      scene.add(new THREE.AmbientLight(0xffffff, 0.6));
      const dl = new THREE.DirectionalLight(0xffffff, 10);
      dl.position.set(5, 10, 0);
      scene.add(dl);

      new GLTFLoader().load(
        "https://cdn.maximeheckel.com/models/creation-of-adam.glb",
        (g) => {
          const m = g.scene;
          m.scale.setScalar(3.2);
          m.rotation.x = -0.1;
          m.rotation.y = -Math.PI / 2 + 0.08;
          m.position.set(1.8, -1.4, 0);
          scene.add(m);
          controls.update();
          camera.lookAt(handsFocusPoint);
        },
      );

      /* ================= POST ================= */

      const composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));

      let pass = new EffectPass(camera, dots);
      composer.addPass(pass);

      /* ================= UI ================= */

      const sidebar = document.getElementById("sidebar");
      const toggleBtn = document.getElementById("toggleBtn");
      const floatingToggle = document.getElementById("floatingToggle");
      const listItems = document.querySelectorAll("#effectList li");
      const pixelUI = document.getElementById("pixelUI");
      const pixelInput = document.getElementById("pixelSize");

      function togglePanel() {
        isPanelOpen = !isPanelOpen;
        if (isPanelOpen) {
          sidebar.classList.remove("collapsed");
          toggleBtn.textContent = "—";
          floatingToggle.classList.remove("visible");
          targetLayoutWidth = window.innerWidth - sidebarWidth;
        } else {
          sidebar.classList.add("collapsed");
          toggleBtn.textContent = "+";
          floatingToggle.classList.add("visible");
          targetLayoutWidth = window.innerWidth;
        }
      }

      document.querySelector("h2").addEventListener("click", togglePanel);
      floatingToggle.addEventListener("click", togglePanel);

      function switchEffect(val) {
        composer.removePass(pass);

        if (val === "ascii") {
          renderer.domElement.style.display = "none";
          if (ascii.domElement.parentNode)
            ascii.domElement.style.display = "block";
          else document.body.appendChild(ascii.domElement);
          if (matrix.domElement.parentNode)
            matrix.domElement.style.display = "none";

          ascii.setSize(currentLayoutWidth, window.innerHeight);
          controls.dispose();
          controls = new OrbitControls(camera, ascii.domElement);
          controls.target = handsFocusPoint;
          controls.enablePan = false;
          controls.enableDamping = true;
          camera.lookAt(handsFocusPoint);
          controls.update();
          pixelUI.style.display = "none";
          return;
        }

        if (val === "matrix") {
          renderer.domElement.style.display = "none";
          if (ascii.domElement.parentNode)
            ascii.domElement.style.display = "none";

          if (matrix.domElement.parentNode)
            matrix.domElement.style.display = "block";
          else document.body.appendChild(matrix.domElement);

          matrix.setSize(currentLayoutWidth, window.innerHeight);
          controls.dispose();
          controls = new OrbitControls(camera, matrix.domElement);
          controls.target = handsFocusPoint;
          controls.enablePan = false;
          controls.enableDamping = true;
          camera.lookAt(handsFocusPoint);
          controls.update();
          pixelUI.style.display = "none";
          return;
        }

        if (ascii.domElement.parentNode)
          ascii.domElement.style.display = "none";
        if (matrix.domElement.parentNode)
          matrix.domElement.style.display = "none";
        renderer.domElement.style.display = "block";

        controls.dispose();
        controls = new OrbitControls(camera, renderer.domElement);
        controls.target = handsFocusPoint;
        controls.enablePan = false;
        controls.enableDamping = true;
        camera.lookAt(handsFocusPoint);
        controls.update();

        pass = new EffectPass(camera, map[val]);
        composer.addPass(pass);

        pixelUI.style.display =
          val === "dots" ||
          val === "blockify" ||
          val === "halftone" ||
          val === "complex" ||
          val === "ledGrid"
            ? "block"
            : "none";
      }

      listItems.forEach((item) => {
        item.addEventListener("click", () => {
          listItems.forEach((li) => li.classList.remove("active"));
          item.classList.add("active");
          const effectValue = item.getAttribute("data-value");
          switchEffect(effectValue);
        });
      });

      pixelInput.oninput = (e) => {
        const value = +e.target.value;
        dots.v = value;
        halftone.uniforms.get("pixelSize").value = value;
        blockify.uniforms.get("pixelSize").value = value;
        complex.uniforms.get("pixelSize").value = value;
        ledGrid.uniforms.get("pixelSize").value = value;
      };

      /* ================= RESIZE & LOOP ================= */

      function updateLayout(width) {
        const height = window.innerHeight;
        renderer.setSize(width, height);
        composer.setSize(width, height);
        updateCamera();

        const c = renderer.domElement;
        [
          dots,
          halftone,
          blockify,
          complex,
          ledGrid,
          contour,
          edge,
          crosshatch,
          noise,
          voronoi,
          vhs,
          waveLines,
          dither,
          threshold,
        ].forEach((e) => {
          if (e.uniforms && e.uniforms.get && e.uniforms.get("resolution")) {
            e.uniforms.get("resolution").value.set(c.width, c.height);
          }
        });

        const currentEffect = document.querySelector(
          "#effectList li.active",
        )?.dataset.value;
        if (currentEffect === "ascii") ascii.setSize(width, height);
        else if (currentEffect === "matrix") matrix.setSize(width, height);
      }

      addEventListener("resize", () => {
        targetLayoutWidth = isPanelOpen
          ? window.innerWidth - sidebarWidth
          : window.innerWidth;
      });

      pixelUI.style.display = "block";

      const activeEffectName = () =>
        document.querySelector("#effectList li.active")?.dataset.value;

      function animate() {
        requestAnimationFrame(animate);
        controls.update();

        if (Math.abs(currentLayoutWidth - targetLayoutWidth) > 0.5) {
          currentLayoutWidth += (targetLayoutWidth - currentLayoutWidth) * 0.15;
          if (Math.abs(currentLayoutWidth - targetLayoutWidth) < 1)
            currentLayoutWidth = targetLayoutWidth;
          updateLayout(currentLayoutWidth);
        }

        const current = activeEffectName();
        if (current === "ascii") {
          ascii.render(scene, camera);
        } else if (current === "matrix") {
          composer.render();
          matrix.render(scene, camera);
        } else {
          composer.render();
        }
      }
      animate();
    </script>
  </body>
</html>
