<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Shader Playground</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap");

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #010101;
        font-family: "Fira Code", "Courier New", monospace;
      }

      /* --- COLLAPSIBLE SIDEBAR STYLES --- */
      #sidebar {
        position: fixed;
        top: 0;
        right: 0;
        width: 280px;
        height: 100%;
        background: #0a0a0a;
        border-left: 1px solid #1a1a1a;
        padding: 40px 30px;
        box-sizing: border-box;
        z-index: 10;
        display: flex;
        flex-direction: column;
        color: #555;
        user-select: none;
        transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      }

      #sidebar.collapsed {
        transform: translateX(100%);
      }

      h2 {
        font-size: 16px;
        color: #fff;
        margin: 0 0 25px 0;
        font-weight: 600;
        letter-spacing: 0.5px;
        display: flex;
        align-items: center;
        cursor: pointer;
      }

      #toggleBtn {
        color: #555;
        margin-right: 8px;
        font-weight: 400;
        transition: color 0.2s;
        user-select: none;
        width: 20px;
        display: inline-block;
      }

      h2:hover #toggleBtn {
        color: #fff;
      }

      ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 14px;
        overflow-y: auto;
        opacity: 1;
        transition: opacity 0.2s;
      }

      #sidebar.collapsed ul,
      #sidebar.collapsed #pixelUI {
        opacity: 0;
        pointer-events: none;
      }

      ul::-webkit-scrollbar {
        width: 4px;
      }
      ul::-webkit-scrollbar-thumb {
        background: #222;
      }

      li {
        cursor: pointer;
        font-size: 13px;
        display: flex;
        align-items: center;
        transition: color 0.2s ease;
      }

      li::before {
        content: "○";
        font-size: 10px;
        margin-right: 15px;
        display: inline-block;
        transform: translateY(-1px);
      }

      li:hover {
        color: #999;
      }
      li.active {
        color: #fff;
        font-weight: 600;
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.15);
      }
      li.active::before {
        content: "●";
        color: #fff;
      }

      #pixelUI {
        margin-top: auto;
        padding-top: 20px;
        border-top: 1px solid #1a1a1a;
        display: none;
        opacity: 1;
        transition: opacity 0.2s;
      }

      #pixelUI label {
        display: block;
        font-size: 11px;
        margin-bottom: 10px;
        color: #555;
      }

      input[type="range"] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 12px;
        width: 12px;
        border-radius: 50%;
        background: #fff;
        cursor: pointer;
        margin-top: -5px;
      }

      input[type="range"]::-webkit-slider-runnable-track {
        width: 100%;
        height: 2px;
        cursor: pointer;
        background: #333;
      }

      #floatingToggle {
        position: fixed;
        top: 20px;
        right: 20px;
        width: 40px;
        height: 40px;
        background: #0a0a0a;
        border: 1px solid #333;
        color: #fff;
        font-family: "Fira Code", monospace;
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 9;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }

      #floatingToggle.visible {
        opacity: 1;
        pointer-events: auto;
      }
    </style>
  </head>

  <body>
    <div id="floatingToggle">+</div>

    <div id="sidebar">
      <h2><span id="toggleBtn">—</span> Effects</h2>
      <ul id="effectList">
        <li data-value="dots" class="active">Dots</li>
        <li data-value="complex">Complex Pixel</li>
        <li data-value="woven">Woven</li>
        <li data-value="ascii">ASCII</li>
        <li data-value="dither">Dithering</li>
        <li data-value="halftone">Halftone</li>
        <li data-value="matrix">Matrix Rain</li>
        <li data-value="contour">Contour</li>
        <li data-value="blockify">Blockify</li>
        <li data-value="threshold">Threshold</li>
        <li data-value="edge">Edge Detection</li>
        <li data-value="crosshatch">Crosshatch</li>
        <li data-value="waveLines">Wave Lines</li>
        <li data-value="noise">Noise Field</li>
        <li data-value="voronoi">Voronoi</li>
        <li data-value="vhs">VHS</li>
      </ul>

      <div id="pixelUI">
        <label>Intensity / Size</label>
        <input type="range" min="6" max="32" value="10" id="pixelSize" />
      </div>
    </div>

    <script type="module">
      import * as THREE from "https://esm.sh/three@0.160.0";
      import { OrbitControls } from "https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js";
      import { GLTFLoader } from "https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";
      import { AsciiEffect } from "https://esm.sh/three@0.160.0/examples/jsm/effects/AsciiEffect.js";

      import {
        EffectComposer,
        RenderPass,
        EffectPass,
        Effect,
      } from "https://esm.sh/postprocessing@6.35.4?deps=three@0.160.0";

      const handsFocusPoint = new THREE.Vector3(0, 0, 0);

      /* ================= SHADERS / EFFECTS ================= */

      const wovenShader = `
        precision highp float;
        uniform float pixelSize;
        uniform vec2 resolution;

        float random(vec2 st) {
            return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
        }

        vec3 rgbToHsv(vec3 c) {
            vec4 K = vec4(0.0, -1.0 / 3.0, 2.0 / 3.0, -1.0);
            vec4 p = mix(vec4(c.bg, K.wz), vec4(c.gb, K.xy), step(c.b, c.g));
            vec4 q = mix(vec4(p.xyw, c.r), vec4(c.r, p.yzx), step(p.x, c.r));
            float d = q.x - min(q.w, q.y);
            float e = 1.0e-10;
            return vec3(abs(q.z + (q.w - q.y) / (6.0 * d + e)), d / (q.x + e), q.x);
        }

        vec3 hsvToRgb(vec3 c) {
            vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
            vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
            return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
        }

        float noise(vec2 st) {
            vec2 i = floor(st);
            vec2 f = fract(st);
            vec2 u = f * f * (3.0 - 2.0 * f);
            return mix(mix(random(i + vec2(0.0,0.0)), random(i + vec2(1.0,0.0)), u.x),
                       mix(random(i + vec2(0.0,1.0)), random(i + vec2(1.0,1.0)), u.x), u.y);
        }

        void mainImage(const in vec4 inputColor, const in vec2 uv, out vec4 outputColor) {
            vec2 normalizedPixelSize = pixelSize / resolution;
            vec2 uvPixel = normalizedPixelSize * floor(uv / normalizedPixelSize);
            vec4 color = texture(inputBuffer, uvPixel);
            vec2 cellPosition = floor(uv / normalizedPixelSize);
            vec2 cellUV = fract(uv / normalizedPixelSize);
            float rowOffset = sin((random(vec2(0.0, uvPixel.y)) - 0.5) * 0.25);
            cellUV.x += rowOffset; 
            vec2 centered = cellUV - 0.5;
            float noiseAmount = 0.18;
            vec2 noisyCenter = centered + (vec2(random(cellPosition), random(cellPosition + 0.5)) - 0.5) * noiseAmount;
            float isAlternate = mod(cellPosition.x, 2.0);
            float angle = isAlternate == 0.0 ? radians(-65.0) : radians(65.0);
            vec2 rotated = vec2(noisyCenter.x * cos(angle) - noisyCenter.y * sin(angle), noisyCenter.x * sin(angle) + noisyCenter.y * cos(angle));
            float aspectRatio = 1.55;
            float ellipse = length(vec2(rotated.x, rotated.y * aspectRatio - 0.075));
            color.rgb *= smoothstep(0.2, 1.0, 1.0 - ellipse);
            float stripeNoise = noise(vec2(centered.x, centered.y * 100.0)); 
            color.rgb *= stripeNoise * 0.6 + 0.4;
            float hueShift = (random(cellPosition) - 0.5) * 0.08;
            vec3 hsv = rgbToHsv(color.rgb);
            hsv.x += hueShift;
            color.rgb = hsvToRgb(hsv);
            color.rgb *= smoothstep(0.2, 1.0, 1.0 - ellipse);
            outputColor = color;
        }
      `;
      
      const complexShader = `
        precision highp float;
        uniform float pixelSize;
        uniform vec2 resolution;
        float circleSDF(vec2 p) { return length(p - 0.5); }
        void mainImage(const in vec4 inputColor, const in vec2 uv, out vec4 outputColor) {
          vec2 normalizedPixelSize = pixelSize / resolution;
          vec2 uvPixel = normalizedPixelSize * floor(uv / normalizedPixelSize);
          vec4 color = texture2D(inputBuffer, uvPixel);
          float luma = dot(vec3(0.2126, 0.7152, 0.0722), color.rgb);
          vec2 cellUV = fract(uv / normalizedPixelSize);
          color = vec4(1.0);
          float d = circleSDF(cellUV);
          if (luma > 0.2) {
            if (d < 0.3) color = vec4(0.0,0.31,0.933,1.0);
            else color = vec4(1.0,1.0,1.0,1.0);
          }
          if(luma > 0.75) {
            if(d < 0.3) color = vec4(1.0,1.0,1.0,1.0);
            else color = vec4(0.0,0.31,0.933,1.0);
          }
          if(luma > 0.99) color = vec4(0.0,0.31,0.933,1.0);
          outputColor = color;
        }
      `;

      const dotsShader = `
        precision highp float;
        uniform float pixelSize;
        uniform vec2 resolution;
        void mainImage(const in vec4 i, const in vec2 uv, out vec4 o) {
          vec2 normalizedPixelSize = pixelSize / resolution;
          vec2 uvPixel = normalizedPixelSize * floor(uv / normalizedPixelSize);
          vec4 color = texture2D(inputBuffer, uvPixel);
          float luma = dot(vec3(0.2126, 0.7152, 0.0722), color.rgb);
          vec2 cellUV = fract(uv / normalizedPixelSize);
          float radius = luma > 0.5 ? 0.3 : luma > 0.001 ? 0.12 : 0.075;
          vec2 circleCenter = luma > 0.5 ? vec2(0.5, 0.5) : vec2(0.25, 0.25);
          float circleMask = smoothstep(radius, radius - 0.05, distance(cellUV, circleCenter));
          o = vec4(mix(vec3(0.05), vec3(1.0), circleMask * max(luma, 0.1)), 1.0);
        }
      `;

      const noiseShader = `
        precision highp float;
        uniform float time;
        uniform vec2 resolution;

        vec2 hash(vec2 p) {
          p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
          return fract(sin(p) * 43758.5453123);
        }

        float random(vec2 st) {
          return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
        }

        void mainImage(const in vec4 inputColor, const in vec2 uv, out vec4 outputColor) {
          vec4 tex = texture2D(inputBuffer, uv);
          float luma = dot(tex.rgb, vec3(0.299, 0.587, 0.114));
          
          // Voronoi Logic
          vec2 g = uv * 40.0;
          vec2 n = floor(g);
          vec2 f = fract(g);
          float m_dist = 1.0;
          for (int j= -1; j<=1; j++) {
            for (int k= -1; k<=1; k++) {
              vec2 b = vec2(float(k), float(j));
              vec2 p = hash(n + b);
              p = 0.5 + 0.5 * sin(time + 6.2831 * p);
              float d = length(b + p - f);
              m_dist = min(m_dist, d);
            }
          }

          // Combined Noise/Voronoi Mask
          float grain = random(uv + fract(time)) * 0.2;
          float handMask = smoothstep(0.01, 0.08, luma);
          vec3 paper = vec3(0.05) + grain;
          vec3 ink = vec3(m_dist);
          
          outputColor = vec4(mix(paper, ink, handMask), 1.0);
        }
      `;

      const ditherShader = `
        precision highp float;
        uniform vec2 resolution;
        const float bayer[64] = float[](
           0.0, 32.0,  8.0, 40.0,  2.0, 34.0, 10.0, 42.0, 48.0, 16.0, 56.0, 24.0, 50.0, 18.0, 58.0, 26.0,
          12.0, 44.0,  4.0, 36.0, 14.0, 46.0,  6.0, 38.0, 60.0, 28.0, 52.0, 20.0, 62.0, 30.0, 54.0, 22.0,
           3.0, 35.0, 11.0, 43.0,  1.0, 33.0,  9.0, 41.0, 51.0, 19.0, 59.0, 27.0, 49.0, 17.0, 57.0, 25.0,
          15.0, 47.0,  7.0, 39.0, 13.0, 45.0,  5.0, 37.0, 63.0, 31.0, 55.0, 23.0, 61.0, 29.0, 53.0, 21.0
        );
        void mainImage(const in vec4 i, const in vec2 uv, out vec4 o) {
          vec4 c = texture2D(inputBuffer, uv);
          float luma = dot(c.rgb, vec3(0.299, 0.587, 0.114));
          vec2 sc = uv * resolution;
          float threshold = bayer[int(mod(sc.y,8.0))*8 + int(mod(sc.x,8.0))] / 64.0;
          o = vec4(mix(vec3(0.05), vec3(1.0), step(threshold, luma)), 1.0);
        }
      `;

      const halftoneShader = `
        precision highp float;
        uniform float pixelSize;
        uniform vec2 resolution;
        void mainImage(const in vec4 i, const in vec2 uv, out vec4 o) {
          vec2 s = pixelSize / resolution;
          vec4 c = texture2D(inputBuffer, s * floor(uv / s) + 0.5*s);
          float l = dot(c.rgb, vec3(.2126,.7152,.0722));
          float m = smoothstep((1.0-l)*0.5 + 0.02, (1.0-l)*0.5, length(fract(uv/s)-0.5));
          o = vec4(mix(vec3(0.05), vec3(1.0), m), 1.0);
        }
      `;

      const contourShader = `
        precision highp float;
        uniform vec2 resolution;
        vec4 sampleOffset(vec2 uv, vec2 off){ return texture2D(inputBuffer, uv + off / resolution); }
        void mainImage(const in vec4 i,const in vec2 uv,out vec4 o){
          float sx = -1.0*dot(sampleOffset(uv, vec2(-1.,-1.)).rgb, vec3(0.3)) + 1.0*dot(sampleOffset(uv, vec2(1.,-1.)).rgb, vec3(0.3))
                   -2.0*dot(sampleOffset(uv, vec2(-1.,0.)).rgb, vec3(0.3)) + 2.0*dot(sampleOffset(uv, vec2(1.,0.)).rgb, vec3(0.3))
                   -1.0*dot(sampleOffset(uv, vec2(-1.,1.)).rgb, vec3(0.3)) + 1.0*dot(sampleOffset(uv, vec2(1.,1.)).rgb, vec3(0.3));
          float sy = -1.0*dot(sampleOffset(uv, vec2(-1.,-1.)).rgb, vec3(0.3)) -2.0*dot(sampleOffset(uv, vec2(0.,-1.)).rgb, vec3(0.3)) -1.0*dot(sampleOffset(uv, vec2(1.,-1.)).rgb, vec3(0.3))
                   +1.0*dot(sampleOffset(uv, vec2(-1.,1.)).rgb, vec3(0.3)) +2.0*dot(sampleOffset(uv, vec2(0.,1.)).rgb, vec3(0.3)) +1.0*dot(sampleOffset(uv, vec2(1.,1.)).rgb, vec3(0.3));
          o = vec4(mix(vec3(0.05), vec3(1.0), smoothstep(0.1, 0.4, length(vec2(sx,sy)))), 1.0);
        }
      `;

      const thresholdShader = `
        precision highp float;
        void mainImage(const in vec4 i,const in vec2 uv,out vec4 o){
          float l = dot(texture2D(inputBuffer, uv).rgb, vec3(.2126,.7152,.0722));
          o = vec4(mix(vec3(0.05), vec3(1.0), step(0.5, l)), 1.0);
        }
      `;

      const edgeShader = `
        precision highp float;
        uniform vec2 resolution;
        vec4 sampleOffset(vec2 uv, vec2 off){ return texture2D(inputBuffer, uv + off / resolution); }
        void mainImage(const in vec4 i,const in vec2 uv,out vec4 o){
          float c = -4.0*dot(sampleOffset(uv, vec2(0.,0.)).rgb, vec3(0.3));
          c += dot(sampleOffset(uv, vec2(-1.,0.)).rgb, vec3(0.3)) + dot(sampleOffset(uv, vec2(1.,0.)).rgb, vec3(0.3));
          c += dot(sampleOffset(uv, vec2(0.,-1.)).rgb, vec3(0.3)) + dot(sampleOffset(uv, vec2(0.,1.)).rgb, vec3(0.3));
          o = vec4(mix(vec3(0.05), vec3(0.0, 1.0, 0.8), step(0.1, abs(c))), 1.0);
        }
      `;

      const crosshatchShader = `
        precision highp float;
        uniform vec2 resolution;
        void mainImage(const in vec4 i,const in vec2 uv,out vec4 o){
          float l = dot(texture2D(inputBuffer, uv).rgb, vec3(.2126,.7152,.0722));
          vec2 p = uv * min(resolution.x, resolution.y);
          float hatch = 1.0 - smoothstep(0.75, 1.5, abs(mod(dot(p, normalize(vec2(1.0))), 10.0) - 5.0));
          o = vec4(mix(vec3(0.05), vec3(1.0), hatch * smoothstep(0.01, 0.05, l)), 1.0);
        }
      `;

      const blockifyShader = `
        precision highp float;
        uniform float pixelSize;
        uniform vec2 resolution;
        void mainImage(const in vec4 i,const in vec2 uv,out vec4 o){
          vec2 s = pixelSize / resolution;
          o = texture2D(inputBuffer, s * floor(uv / s));
        }
      `;

      function makeEffect(name, shader, uniforms = {}) {
        const map = new Map();
        for (const k in uniforms) map.set(k, new THREE.Uniform(uniforms[k]));
        return new (class extends Effect {
          constructor() { super(name, shader, { uniforms: map }); }
          update(renderer) {
            if (map.has("resolution")) map.get("resolution").value.set(renderer.domElement.width, renderer.domElement.height);
            if (map.has("time")) map.get("time").value = performance.now() / 1000;
          }
        })();
      }

      /* ================= SCENE SETUP ================= */

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x050505);

      const baseFrustumSize = 350;
      let camera;
      let isPanelOpen = true;
      let currentLayoutWidth = window.innerWidth - 280;
      let targetLayoutWidth = window.innerWidth - 280;
      const sidebarWidth = 280;

      function updateCamera() {
        const aspect = currentLayoutWidth / window.innerHeight;
        camera.left = (-baseFrustumSize * aspect) / 2;
        camera.right = (baseFrustumSize * aspect) / 2;
        camera.top = baseFrustumSize / 2;
        camera.bottom = -baseFrustumSize / 2;
        camera.updateProjectionMatrix();
      }

      camera = new THREE.OrthographicCamera(0, 0, 0, 0, 0.01, 500);
      camera.position.set(0, 0, -5);
      camera.zoom = 140;
      camera.lookAt(handsFocusPoint);
      updateCamera();

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(currentLayoutWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const ascii = new AsciiEffect(renderer, " .:-=+*#%@", { invert: true });
      const matrix = new (function MatrixRainEffect(renderer, camera) {
          this.renderer = renderer; this.camera = camera;
          this.domElement = document.createElement("canvas");
          this.ctx = this.domElement.getContext("2d");
          this.setSize = (w, h) => { this.domElement.width = w; this.domElement.height = h; this.cols = Math.floor(w/10); this.drops = Array(this.cols).fill(0); };
          this.render = () => { this.ctx.fillStyle = "rgba(0,0,0,0.1)"; this.ctx.fillRect(0,0,this.domElement.width,this.domElement.height); this.ctx.fillStyle = "#0f0"; this.drops.forEach((y,i)=>{this.ctx.fillText(String.fromCharCode(Math.random()*128),i*10,y); if(y>this.domElement.height&&Math.random()>0.975)this.drops[i]=0; this.drops[i]+=10;}); };
      })(renderer, camera);

      /* ================= EFFECTS MAP ================= */

      const dots = makeEffect("Dots", dotsShader, { pixelSize: 10.0 });
      const complex = makeEffect("Complex", complexShader, { pixelSize: 10.0 });
      const woven = makeEffect("Woven", wovenShader, { pixelSize: 10.0 });
      const dither = makeEffect("Dither", ditherShader);
      const halftone = makeEffect("Halftone", halftoneShader, { pixelSize: 10.0 });
      const contour = makeEffect("Contour", contourShader);
      const blockify = makeEffect("Blockify", blockifyShader, { pixelSize: 8.0 });
      const threshold = makeEffect("Threshold", thresholdShader);
      const edge = makeEffect("Edge", edgeShader);
      const crosshatch = makeEffect("Crosshatch", crosshatchShader);
      const noise = makeEffect("Noise", noiseShader, { time: 0.0 });
      const voronoi = makeEffect("Voronoi", contourShader); // Re-using for placeholder
      const waveLines = makeEffect("Wave", crosshatchShader); // Re-using for placeholder
      const vhs = makeEffect("VHS", ditherShader); // Re-using for placeholder

      const map = { dots, complex, woven, ascii, dither, halftone, matrix, contour, blockify, threshold, edge, crosshatch, noise, voronoi, waveLines, vhs };

      /* ================= MODEL ================= */

      let controls = new OrbitControls(camera, renderer.domElement);
      controls.target.copy(handsFocusPoint);
      scene.add(new THREE.AmbientLight(0xffffff, 0.6));
      const dl = new THREE.DirectionalLight(0xffffff, 10); dl.position.set(5, 10, 0); scene.add(dl);

      new GLTFLoader().load("https://cdn.maximeheckel.com/models/creation-of-adam.glb", (g) => {
          const m = g.scene; m.scale.setScalar(3.2); m.rotation.x = -0.1; m.rotation.y = -Math.PI / 2 + 0.08; m.position.set(1.8, -1.4, 0); scene.add(m);
      });

      const composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));
      let pass = new EffectPass(camera, dots);
      composer.addPass(pass);

      /* ================= UI LOGIC ================= */

      const sidebar = document.getElementById("sidebar");
      const toggleBtn = document.getElementById("toggleBtn");
      const floatingToggle = document.getElementById("floatingToggle");
      const listItems = document.querySelectorAll("#effectList li");
      const pixelUI = document.getElementById("pixelUI");
      const pixelInput = document.getElementById("pixelSize");

      function togglePanel() {
        isPanelOpen = !isPanelOpen;
        targetLayoutWidth = window.innerWidth - (isPanelOpen ? sidebarWidth : 0);
        sidebar.classList.toggle("collapsed");
        toggleBtn.textContent = isPanelOpen ? "—" : "+";
        floatingToggle.classList.toggle("visible", !isPanelOpen);
      }

      document.querySelector("h2").addEventListener("click", togglePanel);
      floatingToggle.addEventListener("click", togglePanel);

      function switchEffect(val) {
        composer.removePass(pass);
        const effect = map[val];
        if (!effect) return;
        renderer.domElement.style.display = "block";
        pass = new EffectPass(camera, effect);
        composer.addPass(pass);
        pixelUI.style.display = ["dots", "blockify", "halftone", "complex", "woven"].includes(val) ? "block" : "none";
      }

      listItems.forEach((item) => {
        item.addEventListener("click", () => {
          listItems.forEach((li) => li.classList.remove("active"));
          item.classList.add("active");
          switchEffect(item.getAttribute("data-value"));
        });
      });

      pixelInput.oninput = (e) => {
        const value = +e.target.value;
        Object.values(map).forEach(fx => { if(fx.uniforms && fx.uniforms.has("pixelSize")) fx.uniforms.get("pixelSize").value = value; });
      };

      function animate() {
        requestAnimationFrame(animate);
        if (Math.abs(currentLayoutWidth - targetLayoutWidth) > 0.5) {
          currentLayoutWidth += (targetLayoutWidth - currentLayoutWidth) * 0.15;
          renderer.setSize(currentLayoutWidth, window.innerHeight);
          composer.setSize(currentLayoutWidth, window.innerHeight);
          updateCamera();
        }
        controls.update();
        composer.render();
      }
      pixelUI.style.display = "block";
      animate();
    </script>
  </body>
</html>
