<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Shader Playground</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap");

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #010101;
        font-family: "Fira Code", "Courier New", monospace;
      }

      /* --- COLLAPSIBLE SIDEBAR STYLES --- */
      #sidebar {
        position: fixed;
        top: 0;
        right: 0;
        width: 280px;
        height: 100%;
        background: #0a0a0a;
        border-left: 1px solid #1a1a1a;
        padding: 40px 30px;
        box-sizing: border-box;
        z-index: 10;
        display: flex;
        flex-direction: column;
        color: #555;
        user-select: none;
        transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      }

      #sidebar.collapsed {
        transform: translateX(100%);
      }

      h2 {
        font-size: 16px;
        color: #fff;
        margin: 0 0 25px 0;
        font-weight: 600;
        letter-spacing: 0.5px;
        display: flex;
        align-items: center;
        cursor: pointer;
      }

      #toggleBtn {
        color: #555;
        margin-right: 8px;
        font-weight: 400;
        transition: color 0.2s;
        user-select: none;
        width: 20px;
        display: inline-block;
      }

      h2:hover #toggleBtn {
        color: #fff;
      }

      ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 14px;
        overflow-y: auto;
        opacity: 1;
        transition: opacity 0.2s;
      }

      #sidebar.collapsed ul,
      #sidebar.collapsed #pixelUI,
      #sidebar.collapsed #modelUI {
        opacity: 0;
        pointer-events: none;
      }

      ul::-webkit-scrollbar {
        width: 4px;
      }
      ul::-webkit-scrollbar-thumb {
        background: #222;
      }

      li {
        cursor: pointer;
        font-size: 13px;
        display: flex;
        align-items: center;
        transition: color 0.2s ease;
      }

      li::before {
        content: "○";
        font-size: 10px;
        margin-right: 15px;
        display: inline-block;
        transform: translateY(-1px);
      }

      li:hover {
        color: #999;
      }
      li.active {
        color: #fff;
        font-weight: 600;
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.15);
      }
      li.active::before {
        content: "●";
        color: #fff;
      }

      #modelUI {
        margin-top: 24px;
      }

      #modelUI label {
        display: block;
        font-size: 11px;
        margin-bottom: 6px;
        color: #555;
      }

      #modelSelect {
        width: 100%;
        background: #0a0a0a;
        color: #ccc;
        border: 1px solid #333;
        padding: 6px 8px;
        font-family: "Fira Code", monospace;
        font-size: 12px;
      }

      #pixelUI {
        margin-top: auto;
        padding-top: 20px;
        border-top: 1px solid #1a1a1a;
        display: none;
        opacity: 1;
        transition: opacity 0.2s;
      }

      #pixelUI label {
        display: block;
        font-size: 11px;
        margin-bottom: 10px;
        color: #555;
      }

      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        background: transparent;
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 12px;
        width: 12px;
        border-radius: 50%;
        background: #fff;
        cursor: pointer;
        margin-top: -5px;
      }

      input[type="range"]::-webkit-slider-runnable-track {
        width: 100%;
        height: 2px;
        cursor: pointer;
        background: #333;
      }

      /* Toggle button visible when collapsed */
      #floatingToggle {
        position: fixed;
        top: 20px;
        right: 20px;
        width: 40px;
        height: 40px;
        background: #0a0a0a;
        border: 1px solid #333;
        color: #fff;
        font-family: "Fira Code", monospace;
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 9;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }

      #floatingToggle.visible {
        opacity: 1;
        pointer-events: auto;
      }
    </style>
  </head>

  <body>
    <!-- Floating toggle for when sidebar is hidden -->
    <div id="floatingToggle">+</div>

    <!-- Sidebar -->
    <div id="sidebar">
      <h2><span id="toggleBtn">—</span> Effects</h2>
      <ul id="effectList">
        <li data-value="dots">Dots</li>
        <li data-value="complex">Complex Pixel</li>
        <li data-value="woven">Woven</li>
        <li data-value="lego">Lego</li>
        <li data-value="ascii">ASCII</li>
        <li data-value="dither" class="active">Dithering</li>
        <li data-value="halftone">Halftone</li>
        <li data-value="matrix">Matrix Rain</li>
        <li data-value="contour">Contour</li>
        <li data-value="blockify">Blockify</li>
        <li data-value="threshold">Threshold</li>
        <li data-value="edge">Edge Detection</li>
        <li data-value="crosshatch">Crosshatch</li>
        <li data-value="waveLines">Wave Lines</li>
        <li data-value="noise">Noise Field</li>
        <li data-value="voronoi">Voronoi</li>
        <li data-value="vhs">VHS</li>
      </ul>

      <div id="modelUI">
        <label>Model</label>
        <select id="modelSelect">
          <option value="dragon">Dragon</option>
          <option value="fox">Fox</option>
          <option value="hands">Hands (Creation of Adam)</option>
          <option value="duck">Duck</option>
          <option value="avocado">Avocado</option>
          <option value="lamp">Lamp</option>
          <option value="skull">Scattering Skull</option>
          <option value="hand">Hand</option>
          <option value="astronaut">Astronaut (OBJ)</option>
          <option value="horse">Horse (OBJ)</option>
        </select>
      </div>

      <div id="pixelUI">
        <label>Intensity / Size</label>
        <input type="range" min="6" max="32" value="10" id="pixelSize" />
      </div>
    </div>

    <script type="module">
      import * as THREE from "https://esm.sh/three@0.160.0";
      import { OrbitControls } from "https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js";
      import { GLTFLoader } from "https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";
      import { OBJLoader } from "https://esm.sh/three@0.160.0/examples/jsm/loaders/OBJLoader.js";
      import { AsciiEffect } from "https://esm.sh/three@0.160.0/examples/jsm/effects/AsciiEffect.js";

      import {
        EffectComposer,
        RenderPass,
        EffectPass,
        Effect,
      } from "https://esm.sh/postprocessing@6.35.4?deps=three@0.160.0";

      const handsFocusPoint = new THREE.Vector3(0, 0, 0);

      /* ================= SHADERS / EFFECTS ================= */

      // ENHANCED WOVEN SHADER with better contrast and colors
      const wovenShader = `
        precision highp float;
        uniform float pixelSize;
        uniform vec2 resolution;

        float random(vec2 st) {
          return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
        }

        vec3 rgbToHsv(vec3 c) {
          vec4 K = vec4(0.0, -1.0 / 3.0, 2.0 / 3.0, -1.0);
          vec4 p = mix(vec4(c.bg, K.wz), vec4(c.gb, K.xy), step(c.b, c.g));
          vec4 q = mix(vec4(p.xyw, c.r), vec4(c.r, p.yzx), step(p.x, c.r));
          float d = q.x - min(q.w, q.y);
          float e = 1.0e-10;
          return vec3(abs(q.z + (q.w - q.y) / (6.0 * d + e)), d / (q.x + e), q.x);
        }

        vec3 hsvToRgb(vec3 c) {
          vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
          vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
          return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
        }

        float noise(vec2 st) {
          vec2 i = floor(st);
          vec2 f = fract(st);

          float a = random(i);
          float b = random(i + vec2(1.0, 0.0));
          float c = random(i + vec2(0.0, 1.0));
          float d = random(i + vec2(1.0, 1.0));

          vec2 u = f * f * (3.0 - 2.0 * f);

          return mix(a, b, u.x) +
                 (c - a) * u.y * (1.0 - u.x) +
                 (d - b) * u.x * u.y;
        }

        void mainImage(const in vec4 inputColor, const in vec2 uv, out vec4 outputColor) {
          vec2 normalizedPixelSize = pixelSize / resolution;
          vec2 uvPixel = normalizedPixelSize * floor(uv / normalizedPixelSize);
          vec4 color = texture(inputBuffer, uvPixel);

          float luma = dot(vec3(0.2126, 0.7152, 0.0722), color.rgb);
          vec2 cellPosition = floor(uv / normalizedPixelSize);
          vec2 cellUV = fract(uv / normalizedPixelSize);

          // ---------------- ENHANCED WOVEN BACKGROUND ----------------
          // Dark blue-grey background with visible pattern
          if (luma < 0.001) {
            vec2 centered = cellUV - 0.5;
            float isAlternate = mod(cellPosition.x, 2.0);
            float angle = isAlternate == 0.0 ? radians(-65.0) : radians(65.0);
            
            vec2 rotated = vec2(
              centered.x * cos(angle) - centered.y * sin(angle),
              centered.x * sin(angle) + centered.y * cos(angle)
            );
            
            float aspectRatio = 1.55;
            float ellipse = length(vec2(rotated.x, rotated.y * aspectRatio - 0.075));
            float pattern = smoothstep(0.2, 1.0, 1.0 - ellipse);
            
            // Dark blue-grey base color (not pure black)
            vec3 bgBase = vec3(0.04, 0.05, 0.10); // Dark blue-grey
            float bgIntensity = 0.15;
            
            // Apply pattern to background
            vec3 bgColor = bgBase * pattern * bgIntensity * 3.0;
            
            // Add subtle noise for texture variation
            bgColor += random(cellPosition * 0.5) * 0.03;
            
            outputColor = vec4(bgColor, 1.0);
            return;
          }

          // ---------------- ENHANCED MODEL WOVEN EFFECT ----------------
          float rowOffset = sin((random(vec2(0.0, uvPixel.y)) - 0.5) * 0.25);
          cellUV.x += rowOffset; 
          vec2 centered = cellUV - 0.5;

          float noiseAmount = 0.18;
          vec2 noisyCenter = centered + (vec2(
            random(cellPosition + centered),
            random(cellPosition + centered)
          ) - 0.5) * noiseAmount;

          float isAlternate = mod(cellPosition.x, 2.0);
          float angle = isAlternate == 0.0 ? radians(-65.0) : radians(65.0);
          
          vec2 rotated = vec2(
            noisyCenter.x * cos(angle) - noisyCenter.y * sin(angle),
            noisyCenter.x * sin(angle) + noisyCenter.y * cos(angle)
          );
          
          float aspectRatio = 1.55;
          float ellipse = length(vec2(rotated.x, rotated.y * aspectRatio - 0.075));
          
          // Sharper contrast for woven threads
          float weaveMask = smoothstep(0.18, 0.85, 1.0 - ellipse);
          color.rgb *= weaveMask;
          
          // Brightness boost to make model pop against dark background
          color.rgb *= 1.4;
          
          // Enhanced stripe noise with brighter base
          float stripeNoise = noise(vec2(centered.x, centered.y * 100.0)); 
          color.rgb *= stripeNoise * 0.6 + 0.9;
         
          // More vibrant color processing
          float hueShift = (random(cellPosition) - 0.5) * 0.10;
          vec3 hsv = rgbToHsv(color.rgb);
          hsv.x += hueShift;
          hsv.y = clamp(hsv.y * 1.3, 0.0, 1.0); // Increase saturation
          hsv.z = clamp(hsv.z * 1.2, 0.0, 1.0); // Increase brightness
          color.rgb = hsvToRgb(hsv);

          // Add subtle edge glow to define thread edges
          float edgeGlow = smoothstep(0.25, 0.0, ellipse) * 0.25;
          color.rgb += vec3(edgeGlow) * 0.5;

          outputColor = color;
        }
      `;

      // REFERENCE-ACCURATE LEGO SHADER (matches your provided shader exactly)
      const legoShader = `
        precision highp float;
        uniform float pixelSize;
        uniform vec2 resolution;
        uniform vec2 lightPosition;

        float random(vec2 st) {
            return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
        }

        vec3 rgbToHsv(vec3 c) {
            vec4 K = vec4(0.0, -1.0 / 3.0, 2.0 / 3.0, -1.0);
            vec4 p = mix(vec4(c.bg, K.wz), vec4(c.gb, K.xy), step(c.b, c.g));
            vec4 q = mix(vec4(p.xyw, c.r), vec4(c.r, p.yzx), step(p.x, c.r));
            float d = q.x - min(q.w, q.y);
            float e = 1.0e-10;
            return vec3(abs(q.z + (q.w - q.y) / (6.0 * d + e)), d / (q.x + e), q.x);
        }

        vec3 hsvToRgb(vec3 c) {
            vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
            vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
            return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
        }

        const float colorNum = 16.0;
        const float MASK_BORDER = 1.5;
        const float MASK_INTENSITY = 1.5;

        void mainImage(const in vec4 inputColor, const in vec2 uv, out vec4 outputColor) {
            vec2 normalizedPixelSize = pixelSize / resolution;
            vec2 uvPixel = normalizedPixelSize * floor(uv / normalizedPixelSize);
            vec4 color = texture(inputBuffer, uvPixel);

            color.r = floor(color.r * (colorNum - 1.0) + 0.5) / (colorNum - 1.0);
            color.g = floor(color.g * (colorNum - 1.0) + 0.5) / (colorNum - 1.0);
            color.b = floor(color.b * (colorNum - 1.0) + 0.5) / (colorNum - 1.0);

            color.rgb = clamp(color.rgb, 0.01, 0.95);
            
            vec2 cellPosition = floor(uv / normalizedPixelSize);
            vec2 cellUV = fract(uv / normalizedPixelSize);
            
            float lighting = dot(normalize(cellUV - vec2(0.5)), lightPosition) * 0.7;
            float dis = abs(distance(cellUV, vec2(0.5)) * 2.0 - 0.5);
            color.rgb *= smoothstep(0.1, 0.0, dis) * lighting + 1.0;

            vec2 centeredCellUV = cellUV * 2.0 - 1.0;
            float mask = 1.0; 
            vec2 border = 1.05 - pow(centeredCellUV, vec2(8.0)) * MASK_BORDER;
            mask *= border.x * border.y;
            float maskStrength = smoothstep(0.0, 0.8, mask);
            color.rgb *= 0.8 + (maskStrength * 0.1);

            float hueShift = random(cellPosition) * 0.02;
            vec3 hsv = rgbToHsv(color.rgb);
            hsv.x += hueShift;
            color.rgb = hsvToRgb(hsv);
            
            outputColor = color;
        }
      `;

      const complexShader = `
  precision highp float;
  uniform float pixelSize;
  uniform vec2 resolution;

  float circle(vec2 uv, float r) {
    return 1.0 - smoothstep(r - 0.05, r + 0.05, length(uv - 0.5));
  }

  float square(vec2 uv, float size) {
    vec2 d = abs(uv - 0.5);
    return step(max(d.x, d.y), size);
  }

  float cross(vec2 uv, float thickness) {
    float h = step(abs(uv.x - 0.5), thickness);
    float v = step(abs(uv.y - 0.5), thickness);
    return max(h, v);
  }

  void mainImage(const in vec4 inputColor, const in vec2 uv, out vec4 outputColor) {

    vec2 cellSize = pixelSize / resolution;
    vec2 uvPixel = cellSize * floor(uv / cellSize);
    vec4 src = texture2D(inputBuffer, uvPixel);

    float luma = dot(src.rgb, vec3(0.2126, 0.7152, 0.0722));
    vec2 cellUV = fract(uv / cellSize);

    // Base background (light grey instead of white for better contrast)
    vec3 bg = vec3(0.92);

    float pattern = 0.0;

    // Dark areas → solid fill
    if (luma < 0.15) {
      pattern = 1.0;
    }
    // Mid-dark → cross
    else if (luma < 0.35) {
      pattern = cross(cellUV, 0.12);
    }
    // Mid tones → square
    else if (luma < 0.55) {
      pattern = square(cellUV, 0.30);
    }
    // Mid-light → circle
    else if (luma < 0.75) {
      pattern = circle(cellUV, 0.28);
    }
    // Bright → small dot
    else {
      pattern = circle(cellUV, 0.12);
    }

    // Preserve silhouette strength
    float edgeBoost = smoothstep(0.0, 0.2, 1.0 - luma);

    vec3 blue = vec3(0.0, 0.31, 0.93);

    vec3 finalColor = mix(bg, blue, pattern * (0.6 + edgeBoost * 0.4));

    outputColor = vec4(finalColor, 1.0);
  }
`;
      const dotsShader = `
        precision highp float;
        uniform float pixelSize;
        uniform vec2 resolution;
        void mainImage(const in vec4 i, const in vec2 uv, out vec4 o) {
          vec2 normalizedPixelSize = pixelSize / resolution;
          vec2 uvPixel = normalizedPixelSize * floor(uv / normalizedPixelSize);
          vec4 color = texture2D(inputBuffer, uvPixel);

          float luma = dot(vec3(0.2126, 0.7152, 0.0722), color.rgb);
          vec2 cellUV = fract(uv / normalizedPixelSize);

          float radius = luma > 0.5 ? 0.3 : luma > 0.001 ? 0.12 : 0.075;
          vec2 circleCenter = luma > 0.5 ? vec2(0.5, 0.5) : vec2(0.25, 0.25);
          float distanceFromCenter = distance(cellUV, circleCenter);
          float circleMask = smoothstep(radius, radius - 0.05, distanceFromCenter);
          color.rgb = vec3(circleMask) * max(luma, 0.05);

          o = color;
        }
      `;

      const ditherShader = `
        precision highp float;
        uniform vec2 resolution;

        const float bayer[64] = float[](
           0.0, 32.0,  8.0, 40.0,  2.0, 34.0, 10.0, 42.0,
          48.0, 16.0, 56.0, 24.0, 50.0, 18.0, 58.0, 26.0,
          12.0, 44.0,  4.0, 36.0, 14.0, 46.0,  6.0, 38.0,
          60.0, 28.0, 52.0, 20.0, 62.0, 30.0, 54.0, 22.0,
           3.0, 35.0, 11.0, 43.0,  1.0, 33.0,  9.0, 41.0,
          51.0, 19.0, 59.0, 27.0, 49.0, 17.0, 57.0, 25.0,
          15.0, 47.0,  7.0, 39.0, 13.0, 45.0,  5.0, 37.0,
          63.0, 31.0, 55.0, 23.0, 61.0, 29.0, 53.0, 21.0
        );

        void mainImage(const in vec4 i, const in vec2 uv, out vec4 o) {
          vec4 c = texture2D(inputBuffer, uv);
          float luma = dot(c.rgb, vec3(0.299, 0.587, 0.114));
          vec2 screenCoord = uv * resolution;
          int x = int(mod(screenCoord.x, 8.0));
          int y = int(mod(screenCoord.y, 8.0));
          int bayerIndex = y * 8 + x;
          float threshold = bayer[bayerIndex] / 64.0;
          float dithered = step(threshold, luma);
          o = vec4(vec3(dithered), 1.0);
        }
      `;

      const halftoneShader = `
        precision highp float;
        uniform float pixelSize;
        uniform vec2 resolution;
        void mainImage(const in vec4 i, const in vec2 uv, out vec4 o) {
          vec2 s = pixelSize / resolution;
          vec2 u = s * floor(uv / s) + 0.5*s;
          vec4 c = texture2D(inputBuffer, u);
          float l = dot(c.rgb, vec3(.2126,.7152,.0722));
          vec2 f = fract(uv / s);
          float r = (1.0 - l) * 0.5;
          float d = distance(f, vec2(.5));
          float m = smoothstep(r+0.02, r, d);
          o = vec4(vec3(m),1.0);
        }
      `;

      const waveLinesShader = `
        precision highp float;
        uniform float time;
        uniform vec2 resolution;
        
        float random(vec2 st) {
          return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
        }

        void mainImage(const in vec4 i,const in vec2 uv,out vec4 o){
          vec4 c = texture2D(inputBuffer, uv);
          float luma = dot(c.rgb, vec3(.2126,.7152,.0722));
          float handMask = smoothstep(0.01, 0.05, luma);
          vec2 distortedUV = uv;
          distortedUV.y += sin(uv.x * 15.0 + time * 1.5) * 0.003 * luma;
          float linesCount = max(resolution.y / 5.5, 50.0);
          float yPos = fract(distortedUV.y * linesCount);
          float dist = abs(yPos - 0.5);
          float thickness = luma * 0.4;
          float line = smoothstep(thickness + 0.05, thickness, dist);
          vec3 finalColor = vec3(line);
          float grain = random(uv * (time + 0.1)) * 0.18;
          finalColor += grain;
          finalColor *= handMask;
          o = vec4(finalColor, 1.0);
        }
      `;

      const noise_shader = `
        precision highp float;
        uniform float time;
        uniform vec2 resolution;

        float random(vec2 st) {
          return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
        }

        void mainImage(const in vec4 inputColor, const in vec2 uv, out vec4 outputColor) {
          float luma = dot(texture2D(inputBuffer, uv).rgb, vec3(0.299, 0.587, 0.114));
          float handMask = smoothstep(0.02, 0.06, luma);
          if (handMask < 0.001) {
            outputColor = vec4(vec3(0.0), 1.0);
            return;
          }
          vec2 coord = uv;
          float scanLineCount = floor(resolution.y / 4.0);
          float lineId = floor(coord.y * scanLineCount);
          float lineRandom = random(vec2(lineId, floor(time * 4.0)));
          if(lineRandom > 0.92) {
            coord.x += random(vec2(lineId, time)) * 0.015;
          }
          if(lineRandom < 0.07) {
            outputColor = vec4(vec3(0.0) * handMask, 1.0);
            return;
          }
          float grainPixelSize = 1.0;
          vec2 grainUV = floor(coord * resolution / grainPixelSize) * grainPixelSize / resolution;
          float staticGrain = random(vec2(grainUV.x, grainUV.y + floor(time * 30.0)));
          staticGrain = step(0.48, staticGrain);
          staticGrain -= random(grainUV + time) * 0.12;
          staticGrain *= luma * 1.5;
          vec3 finalColor = vec3(clamp(staticGrain, 0.0, 1.0));
          outputColor = vec4(finalColor * handMask, 1.0);
        }
      `;

      const voronoiShader = `
        precision highp float;
        uniform float time;
        uniform vec2 resolution;
        
        vec2 hash(vec2 p) {
          p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
          return -1.0 + 2.0 * fract(sin(p) * 43758.5453123);
        }
        
        float rand(vec2 co) {
          return fract(sin(dot(co.xy, vec2(12.9898, 78.233))) * 43758.5453);
        }
        
        void mainImage(const in vec4 inputColor, const in vec2 uv, out vec4 outputColor) {
          vec4 original = texture2D(inputBuffer, uv);
          float originalLuma = dot(original.rgb, vec3(0.299, 0.587, 0.114));
          
          if (originalLuma < 0.02) {
            outputColor = vec4(0.0, 0.0, 0.0, 1.0);
            return;
          }

          float cellScale = 42.0; 
          vec2 ratio = vec2(resolution.x / resolution.y, 1.0);
          vec2 drift = vec2(time * 0.15, time * 0.1);
          vec2 coord = uv * ratio * cellScale + drift;
          vec2 cell = floor(coord);
          vec2 local = fract(coord);
          float minDist = 8.0;
          float secondMinDist = 8.0;
          vec2 centerUV = vec2(0.0);
          for(int y = -1; y <= 1; y++) {
            for(int x = -1; x <= 1; x++) {
              vec2 neighbor = vec2(float(x), float(y));
              vec2 cellPos = cell + neighbor;
              vec2 point = vec2(0.5) + 0.4 * sin(time * 1.5 + 6.2831 * hash(cellPos));
              vec2 diff = neighbor + point - local;
              float dist = length(diff);
              if(dist < minDist) {
                secondMinDist = minDist;
                minDist = dist;
                centerUV = (cellPos + point - drift) / (ratio * cellScale);
              } else if(dist < secondMinDist) {
                secondMinDist = dist;
              }
            }
          }
          vec4 cellColor = texture2D(inputBuffer, centerUV);
          float cellLuma = dot(cellColor.rgb, vec3(0.299, 0.587, 0.114));
          cellLuma = smoothstep(0.05, 0.6, cellLuma * 1.3);
          float borderDist = secondMinDist - minDist;
          float border = smoothstep(0.01, 0.08, borderDist); 
          float finalLuma = cellLuma * border;
          
          vec3 finalOutput = vec3(finalLuma);
          outputColor = vec4(finalOutput, 1.0);
        }
      `;

      const vhsShader = `
        precision highp float;
        uniform float time;
        uniform vec2 resolution;

        float rand(vec2 co) {
          return fract(sin(dot(co.xy, vec2(12.9898, 78.233))) * 43758.5453);
        }

        void mainImage(const in vec4 i, const in vec2 uv, out vec4 o) {
          float jitter = (rand(vec2(time, uv.y)) - 0.5) * step(0.98, rand(vec2(time * 0.5, 0.0))) * 0.02;
          float wave = sin(uv.y * 3.0 + time * 2.0) * 0.005;
          vec2 shiftedUV = uv + vec2(jitter + wave, 0.0);
          float shift = 0.005;
          float r = texture2D(inputBuffer, shiftedUV + vec2(shift, 0.0)).r;
          float g = texture2D(inputBuffer, shiftedUV).g;
          float b = texture2D(inputBuffer, shiftedUV - vec2(shift, 0.0)).b;
          vec3 color = vec3(r, g, b);
          float scanline = sin(shiftedUV.y * resolution.y * 0.8) * 0.1;
          color -= scanline;
          float noise = (rand(shiftedUV + time) - 0.5) * 0.15;
          color += noise;
          color = mix(color, vec3(dot(color, vec3(0.299, 0.587, 0.114))), 0.2);
          o = vec4(color, 1.0);
        }
      `;

      class MatrixRainEffect {
        constructor(renderer, camera) {
          this.renderer = renderer;
          this.camera = camera;
          this.canvas = document.createElement("canvas");
          this.ctx = this.canvas.getContext("2d", { willReadFrequently: true });
          this.domElement = this.canvas;

          this.chars = "ｦｧｨｩｪｫｬｭｮｯ012789";
          this.cols = 0;
          this.rows = 0;
          this.drops = [];
          this.speeds = [];
          this.fontSize = 8;
          this.fontFamily = "monospace";
          this.setSize(
            renderer.domElement.clientWidth,
            renderer.domElement.clientHeight,
          );

          this.renderTarget = new THREE.WebGLRenderTarget(
            renderer.domElement.clientWidth,
            renderer.domElement.clientHeight,
            { format: THREE.RGBAFormat },
          );
          this.maskTarget = new THREE.WebGLRenderTarget(1, 1, {
            format: THREE.RGBAFormat,
          });
          this.maskTarget.texture.minFilter = THREE.NearestFilter;
          this.maskTarget.texture.magFilter = THREE.NearestFilter;
          this._maskBuffer = null;
          this.cellCharacter = [];
        }

        setSize(width, height) {
          this.canvas.width = width;
          this.canvas.height = height;
          this.ctx.font = `${this.fontSize}px ${this.fontFamily}`;
          this.cols = Math.floor(width / (this.fontSize * 0.6));
          this.rows = Math.floor(height / this.fontSize);
          this.drops = Array(this.cols)
            .fill(0)
            .map(() => -(Math.random() * this.rows));
          this.speeds = Array(this.cols)
            .fill(0)
            .map(() => 0.3 + Math.random() * 0.6);
          this.cellCharacter = new Array(this.cols * this.rows)
            .fill(0)
            .map(
              () => this.chars[Math.floor(Math.random() * this.chars.length)],
            );
          if (this.renderTarget) this.renderTarget.setSize(width, height);
          if (this.maskTarget) {
            const mw = Math.max(1, this.cols);
            const mh = Math.max(1, this.rows);
            this.maskTarget.setSize(mw, mh);
            this._maskBuffer = new Uint8Array(mw * mh * 4);
          }
        }

        render(scene, camera) {
          const oldTarget = this.renderer.getRenderTarget();
          this.renderer.setRenderTarget(this.maskTarget);
          this.renderer.render(scene, camera);
          this.renderer.setRenderTarget(oldTarget);
          this.ctx.fillStyle = "black";
          this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
          const maskBuf = this._maskBuffer;
          if (this.maskTarget && maskBuf) {
            try {
              this.renderer.readRenderTargetPixels(
                this.maskTarget,
                0,
                0,
                this.maskTarget.width,
                this.maskTarget.height,
                maskBuf,
              );
            } catch (err) {
              maskBuf.fill(0);
            }
          }
          for (let i = 0; i < this.cols; i++) {
            this.drops[i] += this.speeds[i];
            if (Math.random() > 0.8) {
              const y = Math.max(0, Math.floor(this.drops[i])) % this.rows;
              this.cellCharacter[y * this.cols + i] =
                this.chars[Math.floor(Math.random() * this.chars.length)];
            }
            if (this.drops[i] >= this.rows + 20) {
              this.drops[i] = -(Math.random() * 20);
              this.speeds[i] = 0.3 + Math.random() * 0.6;
            }
          }
          for (let y = 0; y < this.rows; y++) {
            for (let x = 0; x < this.cols; x++) {
              const sampleY = this.maskTarget.height - 1 - y;
              const idx = (sampleY * this.maskTarget.width + x) * 4;
              const brightness =
                (maskBuf[idx] + maskBuf[idx + 1] + maskBuf[idx + 2]) / 3;
              const drawX = x * (this.fontSize * 0.6);
              const drawY = y * this.fontSize;
              if (brightness > 15) {
                if (brightness > 180)
                  this.ctx.fillStyle = `rgba(200, 255, 200, 0.95)`;
                else if (brightness > 100)
                  this.ctx.fillStyle = `rgba(40, 200, 60, 0.85)`;
                else this.ctx.fillStyle = `rgba(10, 110, 20, 0.7)`;
                this.ctx.fillText(
                  this.cellCharacter[y * this.cols + x],
                  drawX,
                  drawY,
                );
              } else {
                const dropY = this.drops[x];
                const distance = dropY - y;
                if (distance >= 0 && distance < 25) {
                  if (distance < 1)
                    this.ctx.fillStyle = `rgba(100, 200, 100, 0.6)`;
                  else {
                    const alpha = 0.4 * (1.0 - distance / 25);
                    this.ctx.fillStyle = `rgba(0, 120, 20, ${alpha})`;
                  }
                  let char = this.cellCharacter[y * this.cols + x];
                  if (Math.random() > 0.95)
                    char =
                      this.chars[Math.floor(Math.random() * this.chars.length)];
                  this.ctx.fillText(char, drawX, drawY);
                }
              }
            }
          }
        }
      }

      const contourShader = `
        precision highp float;
        uniform vec2 resolution;
        vec4 sampleOffset(vec2 uv, vec2 off){ return texture2D(inputBuffer, uv + off / resolution); }
        void mainImage(const in vec4 i,const in vec2 uv,out vec4 o){
          float sx = -1.0*dot(sampleOffset(uv, vec2(-1.,-1.)).rgb, vec3(0.3)) + 1.0*dot(sampleOffset(uv, vec2(1.,-1.)).rgb, vec3(0.3))
                   -2.0*dot(sampleOffset(uv, vec2(-1.,0.)).rgb, vec3(0.3)) + 2.0*dot(sampleOffset(uv, vec2(1.,0.)).rgb, vec3(0.3))
                   -1.0*dot(sampleOffset(uv, vec2(-1.,1.)).rgb, vec3(0.3)) + 1.0*dot(sampleOffset(uv, vec2(1.,1.)).rgb, vec3(0.3));
          float sy = -1.0*dot(sampleOffset(uv, vec2(-1.,-1.)).rgb, vec3(0.3)) -2.0*dot(sampleOffset(uv, vec2(0.,-1.)).rgb, vec3(0.3)) -1.0*dot(sampleOffset(uv, vec2(1.,-1.)).rgb, vec3(0.3))
                   +1.0*dot(sampleOffset(uv, vec2(-1.,1.)).rgb, vec3(0.3)) +2.0*dot(sampleOffset(uv, vec2(0.,1.)).rgb, vec3(0.3)) +1.0*dot(sampleOffset(uv, vec2(1.,1.)).rgb, vec3(0.3));
          float g = length(vec2(sx,sy));
          o = vec4(vec3(1.0 - g), 1.0);
        }
      `;

      const edgeShader = `
        precision highp float;
        uniform vec2 resolution;
        vec4 sampleOffset(vec2 uv, vec2 off){ return texture2D(inputBuffer, uv + off / resolution); }
        void mainImage(const in vec4 i,const in vec2 uv,out vec4 o){
          float c = -4.0*dot(sampleOffset(uv, vec2(0.,0.)).rgb, vec3(0.3));
          c += 1.0*dot(sampleOffset(uv, vec2(-1.,0.)).rgb, vec3(0.3));
          c += 1.0*dot(sampleOffset(uv, vec2(1.,0.)).rgb, vec3(0.3));
          c += 1.0*dot(sampleOffset(uv, vec2(0.,-1.)).rgb, vec3(0.3));
          c += 1.0*dot(sampleOffset(uv, vec2(0.,1.)).rgb, vec3(0.3));
          c = abs(c);
          o = vec4(vec3(step(0.15, c)), 1.0);
        }
      `;

      const blockifyShader = `
        precision highp float;
        uniform float pixelSize;
        uniform vec2 resolution;
        void mainImage(const in vec4 i,const in vec2 uv,out vec4 o){
          vec2 s = pixelSize / resolution;
          vec2 u = s * floor(uv / s);
          vec4 c = texture2D(inputBuffer, u);

      const thresholdShader = `
        precision highp float;
        uniform float thresh;
        void mainImage(const in vec4 i,const in vec2 uv,out vec4 o){
          vec4 c = texture2D(inputBuffer, uv);
          float l = dot(c.rgb, vec3(.2126,.7152,.0722));

      const crosshatchShader = `
        precision highp float;
        uniform vec2 resolution;
        float hatchLine(vec2 p, vec2 dir, float spacing, float thickness) {
          float v = dot(p, dir);
          float m = abs(mod(v, spacing) - spacing * 0.5);
          return 1.0 - smoothstep(thickness * 0.5, thickness, m);
        }
        void mainImage(const in vec4 i,const in vec2 uv,out vec4 o){
          vec4 src = texture2D(inputBuffer, uv);
          float l = dot(src.rgb, vec3(.2126,.7152,.0722));
          float minRes = min(resolution.x, resolution.y);
          vec2 p = uv * minRes;
          float darkness = 1.0 - l;
          float baseSpacing = mix(30.0, 6.0, smoothstep(0.0, 1.0, darkness));
          float baseThickness = mix(1.2, 4.5, smoothstep(0.0, 1.0, darkness));
          float a1 = hatchLine(p, normalize(vec2(1.0, 1.0)), baseSpacing, baseThickness);
          float a2 = hatchLine(p, normalize(vec2(1.0, -1.0)), baseSpacing * 0.7, baseThickness * 0.85);
          float a3 = hatchLine(p, normalize(vec2(1.0, 0.0)), baseSpacing * 0.5, baseThickness * 0.6);
          float hatch = clamp(a1 * 0.9 + a2 * 0.7 + a3 * 0.5, 0.0, 1.0);
          float ink = mix(1.0 - hatch, l * 0.8 + 0.2 * (1.0 - l), 0.0);
          vec3 color = vec3(ink);
          o = vec4(color, 1.0);
        }
      `;

              map.get("resolution").value.set(c.width, c.height);

        })();

          toggleBtn.textContent = "—";
          floatingToggle.classList.remove("visible");
          targetLayoutWidth = window.innerWidth - sidebarWidth;
        } else {
          sidebar.classList.add("collapsed");
          toggleBtn.textContent = "+";
          floatingToggle.classList.add("visible");
          targetLayoutWidth = window.innerWidth;
        }
      }

      document.querySelector("h2").addEventListener("click", togglePanel);
      floatingToggle.addEventListener("click", togglePanel);

      function resetControls(domElement) {
        controls.dispose();
        controls = new OrbitControls(camera, domElement);
        controls.enablePan = false;
        controls.enableDamping = true;
        controls.target.copy(handsFocusPoint);
        camera.lookAt(handsFocusPoint);
        controls.update();
      }

      function switchEffect(val) {
        composer.removePass(pass);

        if (val === "ascii") {
          renderer.domElement.style.display = "none";
          if (ascii.domElement.parentNode)
            ascii.domElement.style.display = "block";
          else document.body.appendChild(ascii.domElement);
          if (matrix.domElement.parentNode)
            matrix.domElement.style.display = "none";

          ascii.setSize(currentLayoutWidth, window.innerHeight);
          resetControls(ascii.domElement);
          pixelUI.style.display = "none";
          return;
        }

        if (val === "matrix") {
          renderer.domElement.style.display = "none";
          if (ascii.domElement.parentNode)
            ascii.domElement.style.display = "none";

          if (matrix.domElement.parentNode)
            matrix.domElement.style.display = "block";
          else document.body.appendChild(matrix.domElement);

          matrix.setSize(currentLayoutWidth, window.innerHeight);
          resetControls(matrix.domElement);
          pixelUI.style.display = "none";
          return;
        }

        if (ascii.domElement.parentNode)
          ascii.domElement.style.display = "none";
        if (matrix.domElement.parentNode)
          matrix.domElement.style.display = "none";
        renderer.domElement.style.display = "block";

        resetControls(renderer.domElement);

        pass = new EffectPass(camera, map[val]);
        composer.addPass(pass);

        pixelUI.style.display = [
          "dots",
          "blockify",
          "halftone",
          "complex",
          "woven",
          "lego",
        ].includes(val)
          ? "block"
          : "none";
      }

      listItems.forEach((item) => {
        item.addEventListener("click", () => {
          listItems.forEach((li) => li.classList.remove("active"));
          item.classList.add("active");
          const effectValue = item.getAttribute("data-value");
          switchEffect(effectValue);
        });
      });

      pixelInput.oninput = (e) => {
        const value = +e.target.value;
        ["dots", "halftone", "blockify", "complex", "woven", "lego"].forEach(
          (key) => {
            if (map[key].uniforms) {
              map[key].uniforms.get("pixelSize").value = value;
            } else if (map[key].v) {
              map[key].v = value;
            }
          },
        );
      };

      /* ================= RESIZE & ANIMATION LOGIC ================= */

      function updateLayout(width) {
        const height = window.innerHeight;
        renderer.setSize(width, height);
        composer.setSize(width, height);
        updateCamera();

        const c = renderer.domElement;
        Object.values(map).forEach((e) => {
          if (
            e &&
            e.uniforms &&
            e.uniforms.get &&
            e.uniforms.get("resolution")
          ) {
            e.uniforms.get("resolution").value.set(c.width, c.height);
          }
        });

        if (ascii.domElement.parentNode) ascii.setSize(width, height);
        if (matrix.domElement.parentNode) matrix.setSize(width, height);
      }

      addEventListener("resize", () => {
        if (isPanelOpen) {
          targetLayoutWidth = window.innerWidth - sidebarWidth;
        } else {
          targetLayoutWidth = window.innerWidth;
        }
      });

      pixelUI.style.display = "block";

      const activeEffectName = () =>
        document
          .querySelector("#effectList li.active")
          ?.getAttribute("data-value");

      function animate() {
        requestAnimationFrame(animate);
        controls.update();

        if (Math.abs(currentLayoutWidth - targetLayoutWidth) > 0.5) {
          currentLayoutWidth += (targetLayoutWidth - currentLayoutWidth) * 0.15;
          if (Math.abs(currentLayoutWidth - targetLayoutWidth) < 1) {
            currentLayoutWidth = targetLayoutWidth;
          }
          updateLayout(currentLayoutWidth);
        }

        const current = activeEffectName();

        if (current === "ascii") {
          ascii.render(scene, camera);
        } else if (current === "matrix") {
          composer.render();
          matrix.render(scene, camera);
        } else {
          composer.render();
        }
      }

      animate();
    </script>
  </body>
</html>
