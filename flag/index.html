    <script>
      const SOURCE = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;

      const canvas = document.getElementById("gl");
      const gl = canvas.getContext("webgl2", {
        antialias: true,
        alpha: true,
        premultipliedAlpha: true,
      });
      const msg = document.getElementById("msg");
      function say(t) {
        msg.textContent = t;
        msg.style.display = "block";
        clearTimeout(say.t);
        say.t = setTimeout(() => (msg.style.display = "none"), 3500);
      }
      if (!gl) {
        say("WebGL2 is not available in this browser.");
      }

      const W = 3,
        H = 2,
        FLAG_ASPECT = W / H;

      const VS = `#version 300 es
in vec3 aP;
uniform float uT, uWind, uRot;
uniform vec2 uS;
out vec2 vUv; out vec3 vN; out float vOcc; flat out int vKind;
vec3 rotY(vec3 v){ float c=cos(uRot), s=sin(uRot); return vec3(c*v.x+s*v.z, v.y, -s*v.x+c*v.z); }
float zOf(vec2 p){
  float amp = p.x*0.55 + 0.45*p.x*p.x;
  float w = uWind*(1.0 + 0.25*sin(uT*0.8 + p.x*1.7));
  float z = 0.20*sin(p.x*6.0 - uT*3.2 + p.y*1.8)
          + 0.09*sin(p.x*12.5 - uT*5.6 - p.y*2.7)
          + 0.045*sin(p.y*6.0 + p.x*4.0 - uT*2.4)
          + 0.012*sin(p.x*29.0 - uT*9.0 + p.y*8.0);
  return amp*w*z;
}
vec3 flagPos(vec2 p){
  float z = zOf(p);
  float x = (p.x-0.5)*${W.toFixed(1)} - z*z*1.3;
  float y = (p.y-0.5)*${H.toFixed(1)} - 0.07*p.x*p.x*(1.2-0.4*uWind) + 0.04*sin(uT*2.1 + p.x*3.0)*p.x*uWind;
  return vec3(x,y,z);
}
void main(){
  vec3 pos; vec3 n; vOcc=0.0;
  vKind = int(aP.z);
  vUv = aP.xy;
  if(vKind==0){
    vec2 p=aP.xy; float e=0.012;
    pos = flagPos(p);
    vec3 dx = flagPos(p+vec2(e,0.))-pos, dy = flagPos(p+vec2(0.,e))-pos;
    n = normalize(cross(dx,dy));
    float e2=0.04;
    float lap = zOf(p+vec2(e2,0.))+zOf(p-vec2(e2,0.))+zOf(p+vec2(0.,e2))+zOf(p-vec2(0.,e2))-4.0*zOf(p);
    vOcc = clamp(lap*30.0,-0.6,0.6);
  } else if(vKind==1){
    pos = vec3(-${(W / 2).toFixed(2)} - 0.045 + (aP.x-0.5)*0.075, mix(-2.4, 1.18, aP.y), -0.02);
    n = vec3(0.,0.,1.);
  } else {
    pos = vec3(-${(W / 2).toFixed(2)} - 0.045 + (aP.x-0.5)*0.17, 1.25 + (aP.y-0.5)*0.17, -0.02);
    n = vec3(0.,0.,1.);
  }
  vec3 q = rotY(pos); vN = rotY(n);
  q.z -= 5.0;
  float d = -q.z;
  gl_Position = vec4(q.x*uS.x, q.y*uS.y, d*0.5-0.5, d);
}`;

      const FS = `#version 300 es
precision highp float;
in vec2 vUv; in vec3 vN; in float vOcc; flat in int vKind;
uniform sampler2D uTex; uniform vec2 uScale, uOff;
out vec4 o;
vec3 grommet(vec2 pf, vec3 col){
  for(int i=0;i<3;i++){
    vec2 c = vec2(0.085, 0.32 + float(i)*0.68);
    float d = length(pf-c);
    if(d<0.026) col = vec3(0.05);
    else if(d<0.05) col = mix(vec3(0.35), vec3(0.95), smoothstep(-0.05,0.05,(pf.y-c.y)*0.8+(pf.x-c.x)*0.4)) ;
  }
  return col;
}
void main(){
  if(vKind==1){
    float nx = vUv.x*2.0-1.0, nz = sqrt(max(1.0-nx*nx,0.0));
    float dl = max(dot(vec3(nx,0.0,nz), normalize(vec3(-0.5,0.2,0.8))),0.0);
    o = vec4(vec3(0.12) + vec3(0.85)*pow(dl,1.4), 1.0); return;
  }
  if(vKind==2){
    vec2 q = vUv*2.0-1.0; float r = dot(q,q); if(r>1.0) discard;
    vec3 nb = vec3(q, sqrt(1.0-r));
    float dl = max(dot(nb, normalize(vec3(-0.4,0.6,0.7))),0.0);
    float sp = pow(max(dot(reflect(-normalize(vec3(-0.4,0.6,0.7)),nb),vec3(0,0,1)),0.0),30.0);
    o = vec4(vec3(0.1)+vec3(0.8)*dl+sp, 1.0); return;
  }
  vec3 n = normalize(vN);
  vec3 l = normalize(vec3(-0.35,0.45,1.0));
  float d = abs(dot(n,l));
  float back = step(dot(n,vec3(0,0,1)),0.0);              // seeing the cloth from behind
  float shade = 0.34 + 0.72*d;
  shade *= 1.0 - vOcc*0.75;                                // dark in folds, bright on crests
  vec3 h = normalize(l + vec3(0,0,1));
  float sheen = pow(abs(dot(n,h)),48.0)*0.16 + pow(1.0-abs(n.z),3.0)*0.07;
  vec3 c = texture(uTex, uOff + vUv*uScale).rgb;
  float weave = 0.955 + 0.045*sin(vUv.x*1500.0)*sin(vUv.y*1000.0);
  c *= weave;
  c = mix(c, c*vec3(0.92,0.92,0.95), back*0.5);
  // hoist hem with stitching
  vec2 pf = vec2(vUv.x*${W.toFixed(1)}, vUv.y*${H.toFixed(1)});
  float hem = step(vUv.x,0.045);
  c *= 1.0 - 0.14*hem;
  float stitch = step(abs(vUv.x-0.04),0.0012)*step(0.5,fract(vUv.y*70.0));
  c = mix(c, vec3(0.9), stitch*0.7);
  c *= 1.0 - 0.08*(step(vUv.y,0.012)+step(0.988,vUv.y));
  c = grommet(pf, c);
  o = vec4(c*shade + sheen, 1.0);

      function sh(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
          console.error(gl.getShaderInfoLog(s));
        return s;
      }
      const prog = gl.createProgram();
      gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
      gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
      gl.linkProgram(prog);
      gl.useProgram(prog);

      // Mesh: flag grid (kind 0), pole quad (kind 1), finial ball quad (kind 2)
      const NX = 110,
        NY = 70,
        verts = [],
        idx = [];
      for (let j = 0; j <= NY; j++)
        for (let i = 0; i <= NX; i++) verts.push(i / NX, j / NY, 0);
      for (let j = 0; j < NY; j++)
        for (let i = 0; i < NX; i++) {
          const a = j * (NX + 1) + i,
            b = a + 1,
            c = a + NX + 1,
            d = c + 1;
          idx.push(a, b, c, b, d, c);
        }
      for (const k of [1, 2]) {
        const base = verts.length / 3;
        verts.push(0, 0, k, 1, 0, k, 0, 1, k, 1, 1, k);
        idx.push(base, base + 1, base + 2, base + 1, base + 3, base + 2);
      }

      const vao = gl.createVertexArray();
      gl.bindVertexArray(vao);
      const vb = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, vb);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(verts), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(prog, "aP");
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 3, gl.FLOAT, false, 0, 0);
      const ib = gl.createBuffer();
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
      gl.bufferData(
        gl.ELEMENT_ARRAY_BUFFER,
        new Uint16Array(idx),
        gl.STATIC_DRAW,
      );

      const U = (n) => gl.getUniformLocation(prog, n);
      const uT = U("uT"),
        uWind = U("uWind"),
        uRot = U("uRot"),
        uS = U("uS"),
        uScale = U("uScale"),
        uOff = U("uOff");

      const tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      [
        [gl.TEXTURE_MIN_FILTER, gl.LINEAR],
        [gl.TEXTURE_MAG_FILTER, gl.LINEAR],
        [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE],
        [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE],
      ].forEach(([k, v]) => gl.texParameteri(gl.TEXTURE_2D, k, v));

      let video = null;
      function setMedia(el, w, h, isVideo) {
        video = isVideo ? el : null;
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, el);
        const ma = w / h;
        let sx = 1,
          sy = 1; // "cover" fit
        if (ma > FLAG_ASPECT) sx = FLAG_ASPECT / ma;
        else sy = ma / FLAG_ASPECT;
        gl.uniform2f(uScale, sx, sy);
        gl.uniform2f(uOff, (1 - sx) / 2, (1 - sy) / 2);
      }

      function defaultFlag() {
        const c = document.createElement("canvas");
        c.width = 900;
        c.height = 600;
        const x = c.getContext("2d");
        x.fillStyle = "#ff9933";
        x.fillRect(0, 0, 900, 200);
        x.fillStyle = "#f6f6f2";
        x.fillRect(0, 200, 900, 200);
        x.fillStyle = "#138808";
        x.fillRect(0, 400, 900, 200);
        x.strokeStyle = "#000080";
        x.lineWidth = 5;
        x.beginPath();
        x.arc(450, 300, 80, 0, 7);
        x.stroke();
        x.lineWidth = 3;
        for (let i = 0; i < 24; i++) {
          const a = (i * Math.PI) / 12;
          x.beginPath();
          x.moveTo(450, 300);
          x.lineTo(450 + 80 * Math.cos(a), 300 + 80 * Math.sin(a));
          x.stroke();
        }
        x.fillStyle = "#000080";
        x.beginPath();
        x.arc(450, 300, 10, 0, 7);
        x.fill();
        if (video) video.pause();
        setMedia(c, 900, 600, false);
      }
      defaultFlag();

      function loadFile(f) {
        if (!f) return;
        const r = new FileReader();
        r.onerror = () => say("Could not read that file.");
        r.onload = () => {
          if (f.type.startsWith("image/")) {
            const im = new Image();
            im.onload = () => {
              if (video) video.pause();
              setMedia(im, im.naturalWidth, im.naturalHeight, false);
            };
            im.onerror = () => say("That image format is not supported.");
            im.src = r.result;
          } else if (f.type.startsWith("video/")) {
            if (video) video.pause();
            const v = document.createElement("video");
            v.muted = true;
            v.loop = true;
            v.playsInline = true;
            v.autoplay = true;
            v.onloadeddata = () => {
              setMedia(v, v.videoWidth, v.videoHeight, true);
              v.play().catch(() => {});
            };
            v.onerror = () =>
              say("That video format is not supported by this browser.");
            v.src = r.result;
          } else say("Choose an image or a video file.");
        };
        r.readAsDataURL(f);
      }
      const fileEl = document.getElementById("file");
      fileEl.addEventListener("change", (e) => loadFile(e.target.files[0]));
      document.getElementById("up").addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          fileEl.click();
        }
      });
      document.getElementById("reset").onclick = defaultFlag;
      addEventListener("dragover", (e) => {
        e.preventDefault();
        document.body.classList.add("drag");
      });
      addEventListener("dragleave", (e) => {
        if (!e.relatedTarget) document.body.classList.remove("drag");
      });
      addEventListener("drop", (e) => {
        e.preventDefault();
        document.body.classList.remove("drag");
        loadFile(e.dataTransfer.files[0]);
      });

      // Black / white invert
      let dark = matchMedia("(prefers-color-scheme: dark)").matches;
      document.getElementById("theme").onclick = () => {
        dark = !dark;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      };

      // Code viewer
      const codeEl = document.getElementById("code");
      document.getElementById("src").textContent = SOURCE;
      document.getElementById("show").onclick = () =>
        codeEl.classList.add("open");
      document.getElementById("close").onclick = () =>
        codeEl.classList.remove("open");
      document.getElementById("copy").onclick = async () => {
        try {
          await navigator.clipboard.writeText(SOURCE);
          say("Code copied.");
        } catch (e) {
          say("Select the code and copy it manually.");
        }
      };

      // Render loop
      const windEl = document.getElementById("wind"),
        speedEl = document.getElementById("speed");
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let t = 0,
        last = performance.now();
      function resize() {
        const dpr = Math.min(devicePixelRatio || 1, 2),
          w = innerWidth,
          h = innerHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        gl.viewport(0, 0, canvas.width, canvas.height);
        const asp = w / h,
          f = 2.9;
        if (asp >= 1) gl.uniform2f(uS, f / asp, f);
        else gl.uniform2f(uS, f, f * asp);

      resize();
      gl.enable(gl.DEPTH_TEST);
      gl.clearColor(0, 0, 0, 0);

      function frame(now) {
        const dt = Math.min((now - last) / 1000, 0.05);
        last = now;
        t += dt * parseFloat(speedEl.value) * (reduce ? 0.25 : 1);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        if (video && video.readyState >= 2) {
          gl.bindTexture(gl.TEXTURE_2D, tex);
          gl.texImage2D(
            gl.TEXTURE_2D,
            0,
            gl.RGBA,
            gl.RGBA,
            gl.UNSIGNED_BYTE,
            video,
          );
        }
        gl.uniform1f(uT, t);
        gl.uniform1f(uWind, parseFloat(windEl.value));
        gl.uniform1f(uRot, -0.3);
        gl.drawElements(gl.TRIANGLES, idx.length, gl.UNSIGNED_SHORT, 0);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    </script>
  </body>
