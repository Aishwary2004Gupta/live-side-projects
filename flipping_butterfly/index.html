<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Butterfly</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        background: #102d35;
        perspective: 800px;
        color: #f8ead2;
        font-family: Georgia, "Times New Roman", serif;
      }
      .bg,
      .bg-glow {
        position: fixed;
        inset: 0;
      }
      .bg {
        background:
          radial-gradient(circle at 20% 20%, rgb(239 174 104 / 18%), transparent 24%),
          radial-gradient(circle at 78% 72%, rgb(89 185 171 / 18%), transparent 30%),
          linear-gradient(135deg, #102d35 0%, #173f43 48%, #242d45 100%);
      }
      .bg-glow {
        inset: 50% auto auto 50%;
        width: min(600px, 100vw);
        height: min(600px, 100vw);
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgb(238 166 103 / 28%), transparent 64%);
        filter: blur(12px);
      }
      .controls {
        position: fixed;
        top: 28px;
        left: 50%;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 12px;
        transform: translateX(-50%);
        font-size: 14px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .controls label {
        opacity: 0.72;
      }
      .controls select {
        padding: 9px 30px 9px 12px;
        border: 1px solid rgb(248 234 210 / 40%);
        border-radius: 999px;
        color: #f8ead2;
        background: rgb(16 45 53 / 70%);
        font: inherit;
        letter-spacing: inherit;
        text-transform: inherit;
        cursor: pointer;
      }
      .controls select:focus-visible {
        outline: 2px solid #efb46f;
        outline-offset: 3px;
      }
      .container {
        position: fixed;
        top: 50%;
        left: 50%;
        width: min(460px, 84vw);
        height: min(360px, 62vh);
        transform: translate(-50%, -50%);
        transform-style: preserve-3d;
      }

      .animal-art {
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .animal-path {
        display: none;
        fill: none;
        stroke: url(#animal-colors);
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 5;
        filter: drop-shadow(4px 8px 6px rgb(0 0 0 / 28%));
        stroke-dasharray: 1800;
        stroke-dashoffset: 1800;
        animation: draw-animal 4.5s ease-in-out infinite alternate;
      }
      .container.butterfly .butterfly-path,
      .container.fox .fox-path,
      .container.horse .horse-path,
      .container.seahorse .seahorse-path {
        display: block;
      }

      .animal-name {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        color: rgb(248 234 210 / 58%);
        font-size: 12px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      .line {
        display: none;
      }
      .line:nth-child(1) {
        --color: #fcd97d;
        --width: 20px;
        --offset: 4px;
        --delay: 0s;
      }
      .line:nth-child(2) {
        --color: #ffd571;
        --width: 34px;
        --offset: 0px;
        --delay: 0.075s;
      }
      .line:nth-child(3) {
        --color: #faae7a;
        --width: 48px;
        --offset: 4px;
        --delay: 0.15s;
      }
      .line:nth-child(4) {
        --color: #fac29f;
        --width: 62px;
        --offset: 8px;
        --delay: 0.225s;
      }
      .line:nth-child(5) {
        --color: #f9a58d;
        --width: 74px;
        --offset: 14px;
        --delay: 0.3s;
      }
      .line:nth-child(6) {
        --color: #f8b4b5;
        --width: 82px;
        --offset: 16px;
        --delay: 0.375s;
      }
      .line:nth-child(7) {
        --color: #f8bbc3;
        --width: 86px;
        --offset: 20px;
        --delay: 0.45s;
      }
      .line:nth-child(8) {
        --color: #f7acc0;
        --width: 92px;
        --offset: 24px;
        --delay: 0.525s;
      }
      .line:nth-child(9) {
        --color: #f9ced7;
        --width: 94px;
        --offset: 28px;
        --delay: 0.6s;
      }
      .line:nth-child(10) {
        --color: #f4a4c1;
        --width: 102px;
        --offset: 26px;
        --delay: 0.675s;
      }
      .line:nth-child(11) {
        --color: #f09abf;
        --width: 60px;
        --offset: 60px;
        --delay: 0.75s;
      }
      .line:nth-child(12) {
        --color: #f0b1d0;
        --width: 78px;
        --offset: 50px;
        --delay: 0.825s;
      }
      .line:nth-child(13) {
        --color: #efbad6;
        --width: 94px;
        --offset: 38px;
        --delay: 0.9s;
      }
      .line:nth-child(14) {
        --color: #e3cae0;
        --width: 98px;
        --offset: 32px;
        --delay: 0.975s;
      }
      .line:nth-child(15) {
        --color: #c6a1cc;
        --width: 98px;
        --offset: 30px;
        --delay: 1.05s;
      }
      .line:nth-child(16) {
        --color: #ded1e5;
        --width: 94px;
        --offset: 32px;
        --delay: 1.125s;
      }
      .line:nth-child(17) {
        --color: #aeb2d8;
        --width: 84px;
        --offset: 38px;
        --delay: 1.2s;
      }
      .line:nth-child(18) {
        --color: #cbd2ec;
        --width: 74px;
        --offset: 44px;
        --delay: 1.275s;
      }
      .line:nth-child(19) {
        --color: #adc5e7;
        --width: 58px;
        --offset: 54px;
        --delay: 1.35s;
      }
      .line:nth-child(20) {
        --color: #8cc6ec;
        --width: 32px;
        --offset: 74px;
        --delay: 1.425s;
      }
      @keyframes draw-animal {
        0%,
        12% {
          stroke-dashoffset: 1800;
        }
        42%,
        100% {
          stroke-dashoffset: 0;
        }
      }

      .container.fox .animal-path {
        stroke-width: 5.5;
      }
      .container.seahorse .animal-path {
        stroke-width: 4.5;
      }
      @media (max-width: 520px) {
        .controls {
          top: 20px;
          font-size: 11px;
        }
        .container {
          transform: translate(-50%, -50%) scale(0.82);
        }
      }
    </style>
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <div class="bg-glow" aria-hidden="true"></div>
    <div class="controls">
      <label for="animal">Choose a visitor</label>
      <select id="animal" aria-label="Choose an animated animal">
        <option value="butterfly">Butterfly</option>
        <option value="fox">Fox</option>
        <option value="horse">Horse</option>
        <option value="seahorse">Seahorse</option>
      </select>
    </div>
    <main class="container butterfly" aria-label="Animated butterfly">
      <svg class="animal-art" viewBox="0 0 460 360" role="img" aria-label="Animated animal outline">
        <defs>
          <linearGradient id="animal-colors" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fcd97d" />
            <stop offset="0.48" stop-color="#f09abf" />
            <stop offset="1" stop-color="#8cc6ec" />
          </linearGradient>
        </defs>
        <path class="animal-path butterfly-path" d="M230 175 C195 92 88 40 38 86 C6 116 52 174 179 190 C74 174 25 226 62 270 C101 317 190 253 230 195 C270 253 359 317 398 270 C435 226 386 174 281 190 C408 174 454 116 422 86 C372 40 265 92 230 175 M230 175 L230 292 M220 148 C204 124 195 99 205 78 M240 148 C256 124 265 99 255 78" />
        <path class="animal-path fox-path" d="M84 264 C105 214 112 162 106 102 L162 137 C205 116 251 119 291 141 L358 97 L348 168 C375 196 381 236 361 267 C332 309 253 319 185 306 C137 297 101 285 84 264 M106 102 L151 80 L162 137 M348 168 L358 97 L316 122 M283 191 C291 204 310 207 322 197 M218 217 C229 225 243 225 253 217 M167 267 C199 278 241 281 271 268" />
        <path class="animal-path horse-path" d="M122 296 C145 268 155 231 151 192 C148 153 163 118 194 98 L180 58 L218 83 C249 76 279 84 296 105 L332 79 L321 128 C345 151 347 190 330 213 C314 235 291 245 264 247 C263 274 275 299 302 318 M194 98 L220 128 M297 105 L270 126 M314 157 C302 167 286 169 274 162 M187 252 L172 320 M245 249 L235 323 M168 320 L187 320 M235 323 L256 323" />
        <path class="animal-path seahorse-path" d="M278 302 C235 316 190 294 184 251 C178 211 206 188 234 199 C259 209 263 240 244 255 C227 268 203 253 207 234 C211 214 236 217 239 235 M234 199 C226 169 231 143 252 124 C273 105 274 75 256 60 C238 46 213 54 207 75 C203 90 213 105 228 106 C246 107 256 90 247 77 M252 124 C281 122 306 133 318 155 C332 181 320 205 302 220 M264 150 L299 143 M273 182 L319 181 M186 251 C164 257 144 248 137 229 C129 207 143 188 162 185 C179 182 192 194 190 210 M184 251 C168 270 158 289 159 316 M159 316 L180 316" />
      </svg>
    </main>
    <div class="animal-name" aria-live="polite">Butterfly in flight</div>
    <script>
      const animalSelect = document.querySelector("#animal");
      const animal = document.querySelector(".container");
      const animalName = document.querySelector(".animal-name");

      animalSelect.addEventListener("change", (event) => {
        const selectedAnimal = event.target.value;
        animal.className = `container ${selectedAnimal}`;
        animal.setAttribute("aria-label", `Animated ${selectedAnimal}`);
        animalName.textContent = `${selectedAnimal} in flight`;
      });
    </script>
  </body>
</html>
