<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Butterfly</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        background: #102d35;
        perspective: 800px;
        color: #f8ead2;
        font-family: Georgia, "Times New Roman", serif;
      }
      .bg,
      .bg-glow {
        position: fixed;
        inset: 0;
      }
      .bg {
        background:
          radial-gradient(circle at 20% 20%, rgb(239 174 104 / 18%), transparent 24%),
          radial-gradient(circle at 78% 72%, rgb(89 185 171 / 18%), transparent 30%),
          linear-gradient(135deg, #102d35 0%, #173f43 48%, #242d45 100%);
      }
      .bg-glow {
        inset: 50% auto auto 50%;
        width: min(600px, 100vw);
        height: min(600px, 100vw);
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgb(238 166 103 / 28%), transparent 64%);
        filter: blur(12px);
      }
      .controls {
        position: fixed;
        top: 28px;
        left: 50%;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 12px;
        transform: translateX(-50%);
        font-size: 14px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .controls label {
        opacity: 0.72;
      }
      .controls select {
        padding: 9px 30px 9px 12px;
        border: 1px solid rgb(248 234 210 / 40%);
        border-radius: 999px;
        color: #f8ead2;
        background: rgb(16 45 53 / 70%);
        font: inherit;
        letter-spacing: inherit;
        text-transform: inherit;
        cursor: pointer;
      }
      .controls select:focus-visible {
        outline: 2px solid #efb46f;
        outline-offset: 3px;
      }
      .container {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 276px;
        height: 200px;
        transform: translate(-50%, -50%);
        transform-style: preserve-3d;
      }

      .animal-name {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        color: rgb(248 234 210 / 58%);
        font-size: 12px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      .wing {
        position: absolute;
        top: 0;
        width: 138px;
        height: 200px;
      }

      .wing.left {
        left: 0;
      }
      .wing.right {
        left: 138px;
        transform: scaleX(-1);
      }
      .line {
        display: block;
        width: var(--width);
        height: 10px;
        margin-left: var(--offset);
        border-radius: 20em;
        background: var(--color);
        box-shadow: 6px 0 5px -2px rgb(0 0 0 / 50%);
        transform-origin: left center;
        animation: appear 4s var(--delay) ease-out infinite forwards;
      }
      .line:nth-child(1) {
        --color: #fcd97d;
        --width: 20px;
        --offset: 4px;
        --delay: 0s;
      }
      .line:nth-child(2) {
        --color: #ffd571;
        --width: 34px;
        --offset: 0px;
        --delay: 0.075s;
      }
      .line:nth-child(3) {
        --color: #faae7a;
        --width: 48px;
        --offset: 4px;
        --delay: 0.15s;
      }
      .line:nth-child(4) {
        --color: #fac29f;
        --width: 62px;
        --offset: 8px;
        --delay: 0.225s;
      }
      .line:nth-child(5) {
        --color: #f9a58d;
        --width: 74px;
        --offset: 14px;
        --delay: 0.3s;
      }
      .line:nth-child(6) {
        --color: #f8b4b5;
        --width: 82px;
        --offset: 16px;
        --delay: 0.375s;
      }
      .line:nth-child(7) {
        --color: #f8bbc3;
        --width: 86px;
        --offset: 20px;
        --delay: 0.45s;
      }
      .line:nth-child(8) {
        --color: #f7acc0;
        --width: 92px;
        --offset: 24px;
        --delay: 0.525s;
      }
      .line:nth-child(9) {
        --color: #f9ced7;
        --width: 94px;
        --offset: 28px;
        --delay: 0.6s;
      }
      .line:nth-child(10) {
        --color: #f4a4c1;
        --width: 102px;
        --offset: 26px;
        --delay: 0.675s;
      }
      .line:nth-child(11) {
        --color: #f09abf;
        --width: 60px;
        --offset: 60px;
        --delay: 0.75s;
      }
      .line:nth-child(12) {
        --color: #f0b1d0;
        --width: 78px;
        --offset: 50px;
        --delay: 0.825s;
      }
      .line:nth-child(13) {
        --color: #efbad6;
        --width: 94px;
        --offset: 38px;
        --delay: 0.9s;
      }
      .line:nth-child(14) {
        --color: #e3cae0;
        --width: 98px;
        --offset: 32px;
        --delay: 0.975s;
      }
      .line:nth-child(15) {
        --color: #c6a1cc;
        --width: 98px;
        --offset: 30px;
        --delay: 1.05s;
      }
      .line:nth-child(16) {
        --color: #ded1e5;
        --width: 94px;
        --offset: 32px;
        --delay: 1.125s;
      }
      .line:nth-child(17) {
        --color: #aeb2d8;
        --width: 84px;
        --offset: 38px;
        --delay: 1.2s;
      }
      .line:nth-child(18) {
        --color: #cbd2ec;
        --width: 74px;
        --offset: 44px;
        --delay: 1.275s;
      }
      .line:nth-child(19) {
        --color: #adc5e7;
        --width: 58px;
        --offset: 54px;
        --delay: 1.35s;
      }
      .line:nth-child(20) {
        --color: #8cc6ec;
        --width: 32px;
        --offset: 74px;
        --delay: 1.425s;
      }
      @keyframes appear {
        10% {
          transform: rotateX(90deg);
        }
        15%,
        100% {
          transform: rotateX(360deg);
        }
      }

      .container.moth .line {
        filter: saturate(0.72) brightness(1.08);
      }
      .container.moth .wing {
        transform: scaleY(1.08);
      }
      .container.moth .wing.right {
        transform: scale(-1, 1.08);
      }
      .container.dragonfly {
        width: 360px;
      }
      .container.dragonfly .wing {
        width: 180px;
        height: 200px;
      }
      .container.dragonfly .wing.right {
        left: 180px;
      }
      .container.dragonfly .line {
        height: 7px;
        filter: hue-rotate(85deg) saturate(0.72) brightness(1.12);
      }
      .container.dragonfly .wing .line:nth-child(n + 11) {
        opacity: 0.48;
      }
      .container.dragonfly .wing.left,
      .container.dragonfly .wing.right {
        transform: scaleX(0.9);
      }
      .container.dragonfly .wing.right {
        transform: scaleX(-0.9);
      }
      @media (max-width: 520px) {
        .controls {
          top: 20px;
          font-size: 11px;
        }
        .container {
          transform: translate(-50%, -50%) scale(0.82);
        }
        .container.dragonfly {
          transform: translate(-50%, -50%) scale(0.68);
        }
      }
    </style>
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <div class="bg-glow" aria-hidden="true"></div>
    <div class="controls">
      <label for="animal">Choose a visitor</label>
      <select id="animal" aria-label="Choose an animated animal">
        <option value="butterfly">Butterfly</option>
        <option value="moth">Moth</option>
        <option value="dragonfly">Dragonfly</option>
      </select>
    </div>
    <main class="container" aria-label="Animated butterfly">
      <div class="wing left">
        <span class="line"></span><span class="line"></span>
        <span class="line"></span><span class="line"></span>
        <span class="line"></span><span class="line"></span>
        <span class="line"></span><span class="line"></span>
        <span class="line"></span><span class="line"></span>
        <span class="line"></span><span class="line"></span>
        <span class="line"></span><span class="line"></span>
        <span class="line"></span><span class="line"></span>
        <span class="line"></span><span class="line"></span>
        <span class="line"></span><span class="line"></span>
      </div>
      <div class="wing right">
        <span class="line"></span><span class="line"></span>
        <span class="line"></span><span class="line"></span>
        <span class="line"></span><span class="line"></span>
        <span class="line"></span><span class="line"></span>
        <span class="line"></span><span class="line"></span>
        <span class="line"></span><span class="line"></span>
        <span class="line"></span><span class="line"></span>
        <span class="line"></span><span class="line"></span>
        <span class="line"></span><span class="line"></span>
        <span class="line"></span><span class="line"></span>
      </div>
    </main>
    <div class="animal-name" aria-live="polite">Butterfly in flight</div>
    <script>
      const animalSelect = document.querySelector("#animal");
      const animal = document.querySelector(".container");
      const animalName = document.querySelector(".animal-name");

      animalSelect.addEventListener("change", (event) => {
        const selectedAnimal = event.target.value;
        animal.className = `container ${selectedAnimal}`;
        animal.setAttribute("aria-label", `Animated ${selectedAnimal}`);
        animalName.textContent = `${selectedAnimal} in flight`;
      });
    </script>
  </body>
</html>
