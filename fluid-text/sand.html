<!doctype html>
<html>
<head>
    <style>
        body {
            margin: 0;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            overflow: hidden;
            cursor: none;
        }
        
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            filter: contrast(1.1);
        }
        
        .cursor {
            position: fixed;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 9999;
            mix-blend-mode: screen;
        }
        
        .cursor-inner {
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, rgba(255,200,100,0.8) 0%, transparent 70%);
            border-radius: 50%;
            transition: transform 0.15s;
        }
        
        .cursor-outer {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 1px solid rgba(255,200,100,0.2);
            border-radius: 50%;
            top: -16px;
            left: -16px;
            animation: cursorPulse 2s infinite;
        }
        
        @keyframes cursorPulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.5); opacity: 0.2; }
        }
        
        .info {
            position: fixed;
            top: 20px;
            left: 20px;
            color: rgba(255,200,100,0.6);
            font-family: 'Courier New', monospace;
            font-size: 12px;
            z-index: 100;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        
        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 100;
            background: rgba(0,0,0,0.6);
            padding: 15px;
            border-radius: 30px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,200,100,0.2);
        }
        
        .btn {
            background: linear-gradient(135deg, rgba(255,200,100,0.1) 0%, rgba(255,150,50,0.2) 100%);
            border: 1px solid rgba(255,200,100,0.3);
            color: rgba(255,220,150,0.9);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255,200,100,0.3);
            background: linear-gradient(135deg, rgba(255,200,100,0.2) 0%, rgba(255,150,50,0.3) 100%);
        }
    </style>
    <title>Sand Particle Physics</title>
</head>
<body>
    <div class="cursor" id="cursor">
        <div class="cursor-inner"></div>
        <div class="cursor-outer"></div>
    </div>
    
    <div class="info">
        <div>Particles: <span id="particleCount">0</span></div>
        <div>FPS: <span id="fps">60</span></div>
        <div>Physics: <span id="physicsMode">SAND</span></div>
    </div>
    
    <div class="controls">
        <button class="btn" id="gravityBtn">Gravity</button>
        <button class="btn" id="windBtn">Wind</button>
        <button class="btn" id="modeBtn">Mode</button>
        <button class="btn" id="colorBtn">Color</button>
        <button class="btn" id="resetBtn">Reset</button>
        <button class="btn" id="explodeBtn">Explode</button>
    </div>
    
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d", { alpha: false });
        const cursor = document.getElementById("cursor");
        
        // Sand physics configuration
        const SAND_CONFIG = {
            // Particle properties
            particleSize: 0.8,          // Tiny sand grains
            particleDensity: 1.5,        // Sampling density for text
            maxParticles: 15000,         // Maximum particles for performance
            
            // Physics
            gravity: 0.15,               // Downward force
            friction: 0.985,             // Air resistance
            groundFriction: 0.7,         // Friction when touching ground
            restitution: 0.3,            // Bounciness
            
            // Sand-specific physics
            angleOfRepose: 34,           // Maximum stable slope angle for sand
            cohesion: 0.001,             // How much sand sticks together
            flowRate: 0.92,              // How easily sand flows
            
            // Forces
            mouseRadius: 120,            // Mouse interaction radius
            mouseForce: 35,              // Mouse push strength
            explosionForce: 50,          // Explosion strength
            windForce: 0.2,              // Horizontal wind
            turbulence: 0.02,            // Random air currents
            
            // Return force (elastic)
            returnStrength: 0.02,        // Very weak for sand-like behavior
            maxReturnDistance: 500,      // Maximum distance before return force kicks in
            
            // Visual
            trailLength: 3,              // Motion trail length
            glowIntensity: 0.8,          // Particle glow
            colorVariation: 30,          // Hue variation
        };
        
        // State
        let particles = [];
        let mode = 'sand';
        let gravityOn = true;
        let windOn = false;
        let colorScheme = 0;
        let frameCount = 0;
        let lastTime = performance.now();
        
        const mouse = {
            x: -1000,
            y: -1000,
            vx: 0,
            vy: 0,
            lastX: -1000,
            lastY: -1000,
            isDown: false
        };
        
        // Color schemes
        const colorSchemes = [
            { base: 30, name: 'Sand' },       // Golden sand
            { base: 200, name: 'Water' },     // Blue water
            { base: 120, name: 'Emerald' },   // Green emerald
            { base: 280, name: 'Amethyst' },  // Purple amethyst
            { base: 0, name: 'Ruby' },        // Red ruby
            { base: 180, name: 'Ice' }        // Cyan ice
        ];
        
        let fontSize = Math.min(window.innerWidth / 6, 200);
        const text1 = "Let's";
        const text2 = "Connect";

        class SandParticle {
            constructor(x, y, originX, originY) {
                this.x = x + (Math.random() - 0.5) * 2;
                this.y = y + (Math.random() - 0.5) * 2;
                this.originX = originX;
                this.originY = originY;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.ax = 0;
                this.ay = 0;
                
                // Physical properties
                this.mass = 0.5 + Math.random() * 0.5;
                this.radius = SAND_CONFIG.particleSize * (0.5 + Math.random() * 0.5);
                this.friction = SAND_CONFIG.friction + (Math.random() - 0.5) * 0.01;
                
                // Visual properties
                const scheme = colorSchemes[colorScheme];
                this.hue = scheme.base + (Math.random() - 0.5) * SAND_CONFIG.colorVariation;
                this.saturation = 60 + Math.random() * 40;
                this.lightness = 50 + Math.random() * 30;
                this.alpha = 0.8 + Math.random() * 0.2;
                
                // State
                this.trail = [];
                this.maxTrailLength = SAND_CONFIG.trailLength;
                this.age = 0;
                this.maxAge = 1000 + Math.random() * 1000;
                this.isGrounded = false;
                this.neighbors = [];
            }
            
            findNeighbors(particles, radius = 10) {
                this.neighbors = [];
                for (let other of particles) {
                    if (other === this) continue;
                    const dx = other.x - this.x;
                    const dy = other.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < radius && dist > 0) {
                        this.neighbors.push({ particle: other, distance: dist, dx, dy });
                    }
                }
            }
            
            applySandPhysics() {
                // Reset acceleration
                this.ax = 0;
                this.ay = 0;
                
                // Gravity
                if (gravityOn) {
                    this.ay += SAND_CONFIG.gravity * this.mass;
                }
                
                // Wind
                if (windOn) {
                    this.ax += SAND_CONFIG.windForce * (1 + Math.sin(Date.now() * 0.001) * 0.5);
                    this.ay += Math.sin(Date.now() * 0.002 + this.x * 0.01) * SAND_CONFIG.turbulence;
                }
                
                // Sand pile physics - particles slide off steep slopes
                for (let neighbor of this.neighbors) {
                    const { particle: other, distance, dx, dy } = neighbor;
                    
                    if (distance < this.radius + other.radius) {
                        // Collision response
                        const overlap = (this.radius + other.radius) - distance;
                        const nx = dx / distance;
                        const ny = dy / distance;
                        
                        // Push apart
                        this.ax -= nx * overlap * 0.5;
                        this.ay -= ny * overlap * 0.5;
                        
                        // Check angle of repose (sand sliding)
                        const angle = Math.atan2(dy, dx) * 180 / Math.PI;
                        if (Math.abs(angle) > SAND_CONFIG.angleOfRepose) {
                            this.ax += nx * SAND_CONFIG.flowRate;
                        }
                    }
                }
                
                // Turbulence for more organic movement
                this.ax += (Math.random() - 0.5) * SAND_CONFIG.turbulence;
                this.ay += (Math.random() - 0.5) * SAND_CONFIG.turbulence;
            }
            
            update() {
                // Store trail
                if (this.trail.length === 0 || 
                    Math.abs(this.x - this.trail[this.trail.length - 1].x) > 1 ||
                    Math.abs(this.y - this.trail[this.trail.length - 1].y) > 1) {
                    this.trail.push({ x: this.x, y: this.y, alpha: this.alpha });
                    if (this.trail.length > this.maxTrailLength) {
                        this.trail.shift();
                    }
                }
                
                // Apply sand physics
                this.applySandPhysics();
                
                // Mouse interaction - sand gets pushed and scattered
                const mdx = mouse.x - this.x;
                const mdy = mouse.y - this.y;
                const mouseDistance = Math.sqrt(mdx * mdx + mdy * mdy);
                
                if (mouseDistance < SAND_CONFIG.mouseRadius && mouseDistance > 0) {
                    const influence = Math.pow(1 - (mouseDistance / SAND_CONFIG.mouseRadius), 2);
                    const angle = Math.atan2(mdy, mdx);
                    
                    // Push away from mouse with scatter effect
                    const force = influence * SAND_CONFIG.mouseForce;
                    this.ax -= Math.cos(angle) * force;
                    this.ay -= Math.sin(angle) * force;
                    
                    // Add perpendicular scatter for sand-like dispersion
                    const scatterAngle = angle + (Math.random() - 0.5) * Math.PI;
                    this.ax += Math.cos(scatterAngle) * force * 0.3;
                    this.ay += Math.sin(scatterAngle) * force * 0.3;
                    
                    // Transfer mouse velocity for more realistic interaction
                    if (mouse.isDown) {
                        this.vx += mouse.vx * influence * 0.5;
                        this.vy += mouse.vy * influence * 0.5;
                    }
                }
                
                // Very weak return to origin (sand doesn't have strong memory)
                const returnDx = this.originX - this.x;
                const returnDy = this.originY - this.y;
                const returnDistance = Math.sqrt(returnDx * returnDx + returnDy * returnDy);
                
                if (returnDistance > SAND_CONFIG.maxReturnDistance) {
                    // Only apply return force if very far away
                    const returnForce = SAND_CONFIG.returnStrength * (returnDistance - SAND_CONFIG.maxReturnDistance) * 0.001;
                    this.ax += returnDx * returnForce;
                    this.ay += returnDy * returnForce;
                } else if (returnDistance > 50 && mode === 'elastic') {
                    // Stronger return in elastic mode
                    this.ax += returnDx * 0.05;
                    this.ay += returnDy * 0.05;
                }
                
                // Update velocity
                this.vx += this.ax;
                this.vy += this.ay;
                
                // Apply friction
                this.vx *= this.friction;
                this.vy *= this.friction;
                
                // Ground collision
                if (this.y > canvas.height - 50) {
                    this.y = canvas.height - 50;
                    this.vy *= -SAND_CONFIG.restitution;
                    this.vx *= SAND_CONFIG.groundFriction;
                    this.isGrounded = true;
                } else {
                    this.isGrounded = false;
                }
                
                // Wall collisions
                if (this.x < 0 || this.x > canvas.width) {
                    this.x = this.x < 0 ? 0 : canvas.width;
                    this.vx *= -SAND_CONFIG.restitution;
                }
                
                // Update position
                this.x += this.vx;
                this.y += this.vy;
                
                // Age particle
                this.age++;
            }
            
            draw(ctx) {
                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                const brightness = Math.min(100, this.lightness + speed * 5);
                
                // Draw motion trail
                if (this.trail.length > 1 && speed > 0.5) {
                    ctx.beginPath();
                    ctx.moveTo(this.trail[0].x, this.trail[0].y);
                    
                    for (let i = 1; i < this.trail.length; i++) {
                        const point = this.trail[i];
                        const alpha = (i / this.trail.length) * 0.3 * point.alpha;
                        ctx.lineTo(point.x, point.y);
                    }
                    
                    ctx.strokeStyle = `hsla(${this.hue}, ${this.saturation}%, ${brightness}%, ${0.2})`;
                    ctx.lineWidth = this.radius * 0.5;
                    ctx.stroke();
                }
                
                // Draw particle with subtle glow
                if (SAND_CONFIG.glowIntensity > 0 && speed > 1) {
                    const glowRadius = this.radius * (2 + speed * 0.1);
                    const gradient = ctx.createRadialGradient(
                        this.x, this.y, 0,
                        this.x, this.y, glowRadius
                    );
                    gradient.addColorStop(0, `hsla(${this.hue}, ${this.saturation}%, ${brightness}%, ${this.alpha * 0.5})`);
                    gradient.addColorStop(1, 'transparent');
                    
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, glowRadius, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                // Draw sand grain
                ctx.fillStyle = `hsla(${this.hue}, ${this.saturation}%, ${this.lightness}%, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            fontSize = Math.min(window.innerWidth / 6, 200);
            
            // Set composite operation for better blending
            ctx.globalCompositeOperation = 'screen';
        }

        function createTextParticles() {
            const tempCanvas = document.createElement("canvas");
            const tempCtx = tempCanvas.getContext("2d");
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;

            tempCtx.font = `900 ${fontSize}px Arial Black, Helvetica, sans-serif`;
            tempCtx.fillStyle = "white";
            tempCtx.textBaseline = "middle";
            tempCtx.textAlign = "center";

            const x = canvas.width / 2;
            const y = canvas.height / 2;

            tempCtx.fillText(text1, x, y - fontSize * 0.45);
            tempCtx.fillText(text2, x, y + fontSize * 0.45);

            const imageData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
            const data = imageData.data;
            particles = [];

            // Very dense sampling for sand effect
            const step = SAND_CONFIG.particleDensity;
            for (let y = 0; y < tempCanvas.height; y += step) {
                for (let x = 0; x < tempCanvas.width; x += step) {
                    const index = (y * tempCanvas.width + x) * 4;
                    if (data[index + 3] > 128) {
                        if (particles.length < SAND_CONFIG.maxParticles) {
                            particles.push(new SandParticle(x, y, x, y));
                        }
                    }
                }
            }
            
            document.getElementById('particleCount').textContent = particles.length;
        }

        function drawGhostText() {
            ctx.save();
            ctx.globalCompositeOperation = 'destination-over';
            ctx.font = `900 ${fontSize}px Arial Black, Helvetica, sans-serif`;
            ctx.textBaseline = "middle";
            ctx.textAlign = "center";
            
            const x = canvas.width / 2;
            const y = canvas.height / 2;
            
            // Subtle ghost text
            ctx.fillStyle = `hsla(${colorSchemes[colorScheme].base}, 50%, 20%, 0.05)`;
            ctx.fillText(text1, x + 3, y - fontSize * 0.45 + 3);
            ctx.fillText(text2, x + 3, y + fontSize * 0.45 + 3);
            
            ctx.restore();
        }
        
        function explodeParticles() {
            particles.forEach(p => {
                const dx = p.x - canvas.width / 2;
                const dy = p.y - canvas.height / 2;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 0) {
                    const force = SAND_CONFIG.explosionForce / (1 + dist * 0.01);
                    p.vx += (dx / dist) * force;
                    p.vy += (dy / dist) * force;
                }
            });
        }

        function animate() {
            // FPS counter
            frameCount++;
            const currentTime = performance.now();
            if (currentTime - lastTime >= 1000) {
                document.getElementById('fps').textContent = frameCount;
                frameCount = 0;
                lastTime = currentTime;
            }
            
            // Clear canvas
            ctx.fillStyle = 'rgba(9, 10, 15, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Reset composite operation
            ctx.globalCompositeOperation = 'screen';
            
            // Draw ghost text
            drawGhostText();
            
            // Update particle neighbors for collision
            if (frameCount % 2 === 0) { // Update every other frame for performance
                particles.forEach(p => p.findNeighbors(particles, 5));
            }
            
            // Update and draw particles
            particles.forEach(p => {
                p.update();
                p.draw(ctx);
            });
            
            requestAnimationFrame(animate);
        }

        // Event listeners
        window.addEventListener("mousemove", (e) => {
            mouse.lastX = mouse.x;
            mouse.lastY = mouse.y;
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            mouse.vx = (mouse.x - mouse.lastX) * 0.5;
            mouse.vy = (mouse.y - mouse.lastY) * 0.5;
            
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });
        
        window.addEventListener("mousedown", () => {
            mouse.isDown = true;
            SAND_CONFIG.mouseForce *= 2;
            cursor.querySelector('.cursor-inner').style.transform = 'scale(2)';
        });
        
        window.addEventListener("mouseup", () => {
            mouse.isDown = false;
            SAND_CONFIG.mouseForce /= 2;
            cursor.querySelector('.cursor-inner').style.transform = 'scale(1)';
        });

        // Control buttons
        document.getElementById('gravityBtn').addEventListener('click', () => {
            gravityOn = !gravityOn;
            document.getElementById('gravityBtn').textContent = gravityOn ? 'Gravity ON' : 'Gravity OFF';
        });
        
        document.getElementById('windBtn').addEventListener('click', () => {
            windOn = !windOn;
            document.getElementById('windBtn').textContent = windOn ? 'Wind ON' : 'Wind OFF';
        });
        
        document.getElementById('modeBtn').addEventListener('click', () => {
            const modes = ['sand', 'elastic', 'liquid'];
            mode = modes[(modes.indexOf(mode) + 1) % modes.length];
            
            // Adjust physics based on mode
            switch(mode) {
                case 'sand':
                    SAND_CONFIG.returnStrength = 0.02;
                    SAND_CONFIG.friction = 0.985;
                    SAND_CONFIG.cohesion = 0.001;
                    break;
                case 'elastic':
                    SAND_CONFIG.returnStrength = 0.1;
                    SAND_CONFIG.friction = 0.95;
                    SAND_CONFIG.cohesion = 0.01;
                    break;
                case 'liquid':
                    SAND_CONFIG.returnStrength = 0.05;
                    SAND_CONFIG.friction = 0.99;
                    SAND_CONFIG.cohesion = 0.02;
                    break;
            }
            
            document.getElementById('physicsMode').textContent = mode.toUpperCase();
        });
        
        document.getElementById('colorBtn').addEventListener('click', () => {
            colorScheme = (colorScheme + 1) % colorSchemes.length;
            particles.forEach(p => {
                const scheme = colorSchemes[colorScheme];
                p.hue = scheme.base + (Math.random() - 0.5) * SAND_CONFIG.colorVariation;
            });
        });
        
        document.getElementById('resetBtn').addEventListener('click', () => {
            particles.forEach(p => {
                p.x = p.originX + (Math.random() - 0.5) * 10;
                p.y = p.originY + (Math.random() - 0.5) * 10;
                p.vx = (Math.random() - 0.5) * 2;
                p.vy = (Math.random() - 0.5) * 2;
            });
        });
        
        document.getElementById('explodeBtn').addEventListener('click', explodeParticles);

        window.addEventListener("resize", () => {
            initCanvas();
            createTextParticles();
        });

        // Initialize
        initCanvas();
        createTextParticles();
        animate();
    </script>
</body>
</html>
