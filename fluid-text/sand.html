<!doctype html>
<html>
  <head>
    <style>
      body {
        margin: 0;
        background-color: #000;
        overflow: hidden;
      }
      canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
    </style>
    <title>Sand Particle Text</title>
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      let particles = [];
      const mouse = { x: -1000, y: -1000, radius: 140 };

      let fontSize = Math.min(window.innerWidth / 5, 200);
      const text1 = "Let's";
      const text2 = "Connect";

      // Lightweight velocity field (grid) for fluid-like motion
      const cellSize = 20;
      let cols = 0;
      let rows = 0;
      let fieldVX = new Float32Array(0);
      let fieldVY = new Float32Array(0);
      const prevMouse = { x: -1000, y: -1000 };

      function initField() {
        cols = Math.max(1, Math.ceil(canvas.width / cellSize));
        rows = Math.max(1, Math.ceil(canvas.height / cellSize));
        fieldVX = new Float32Array(cols * rows);
        fieldVY = new Float32Array(cols * rows);
      }

      function injectField(x, y, dx, dy) {
        const cx = Math.floor(x / cellSize);
        const cy = Math.floor(y / cellSize);
        if (cx < 0 || cy < 0 || cx >= cols || cy >= rows) return;
        const i = cy * cols + cx;
        fieldVX[i] += dx * 0.6;
        fieldVY[i] += dy * 0.6;
      }

      function updateField() {
        // Simple blur-based diffusion + decay
        const decay = 0.96;
        const newVX = new Float32Array(cols * rows);
        const newVY = new Float32Array(cols * rows);
        for (let gy = 0; gy < rows; gy++) {
          for (let gx = 0; gx < cols; gx++) {
            let sumX = 0;
            let sumY = 0;
            let count = 0;
            for (let oy = -1; oy <= 1; oy++) {
              for (let ox = -1; ox <= 1; ox++) {
                const nx = gx + ox;
                const ny = gy + oy;
                if (nx >= 0 && ny >= 0 && nx < cols && ny < rows) {
                  const ni = ny * cols + nx;
                  sumX += fieldVX[ni];
                  sumY += fieldVY[ni];
                  count++;
                }
              }
            }
            const i = gy * cols + gx;
            newVX[i] = (sumX / count) * decay;
            newVY[i] = (sumY / count) * decay;
          }
        }
        fieldVX = newVX;
        fieldVY = newVY;
      }

      function sampleField(x, y) {
        const cx = Math.floor(x / cellSize);
        const cy = Math.floor(y / cellSize);
        if (cx < 0 || cy < 0 || cx >= cols || cy >= rows) return { x: 0, y: 0 };
        const i = cy * cols + cx;
        return { x: fieldVX[i], y: fieldVY[i] };
      }

      function initCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        fontSize = Math.min(window.innerWidth / 5, 200);
        initField();
      }

      function createTextParticles() {
        const tempCanvas = document.createElement("canvas");
        const tempCtx = tempCanvas.getContext("2d");
        tempCanvas.width = canvas.width;
        tempCanvas.height = canvas.height;

        tempCtx.font = `bold ${fontSize}px Helvetica, Arial, sans-serif`;
        tempCtx.fillStyle = "white";
        tempCtx.textBaseline = "middle";
        tempCtx.textAlign = "center";

        const x = canvas.width / 2;
        const y = canvas.height / 2;
        tempCtx.fillText(text1, x, y - fontSize * 0.45);
        tempCtx.fillText(text2, x, y + fontSize * 0.45);

        const imageData = tempCtx.getImageData(
          0,
          0,
          tempCanvas.width,
          tempCanvas.height,
        );
        const data = imageData.data;
        particles = [];

        // Dense sampling (every 2 pixels) for a grainy sand look
        for (let y = 0; y < tempCanvas.height; y += 2) {
          for (let x = 0; x < tempCanvas.width; x += 2) {
            const index = (y * tempCanvas.width + x) * 4;
            if (data[index + 3] > 128) {
              particles.push({
                x: x + (Math.random() - 0.5) * 10,
                y: y + (Math.random() - 0.5) * 10,
                originX: x,
                originY: y,
                vx: (Math.random() - 0.5) * 0.6, // Lower initial kinetic energy
                vy: (Math.random() - 0.5) * 0.6,
                size: Math.random() * 2 + 0.8, // Slightly larger grains for a liquid look
                friction: 0.92, // Viscous damping
                ease: 0.0025, // Very slow return to origin to allow flow
                color: `rgba(255, 255, 255, ${Math.random() * 0.45 + 0.45})`, // Subtle brightness variation
              });
            }
          }
        }
      }

      function drawGhostText() {
        ctx.font = `bold ${fontSize}px Helvetica, Arial, sans-serif`;
        ctx.textBaseline = "middle";
        ctx.textAlign = "center";
        ctx.fillStyle = "rgba(255, 255, 255, 0.05)";
        const x = canvas.width / 2;
        const y = canvas.height / 2;
        ctx.fillText(text1, x, y - fontSize * 0.45);
        ctx.fillText(text2, x, y + fontSize * 0.45);
      }

      function animate() {
        // Very light clear to allow slight trails
        ctx.fillStyle = "rgba(0, 0, 0, 0.2)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        drawGhostText();

        particles.forEach((p) => {
          const dx = mouse.x - p.x;
          const dy = mouse.y - p.y;
          const distance = Math.sqrt(dx * dx + dy * dy);

          // Interaction: Kick the sand
          if (distance < mouse.radius) {
            const angle = Math.atan2(dy, dx);
            const force = (mouse.radius - distance) / mouse.radius;
            // Moderate direct push; primary flow comes from velocity field
            p.vx -= Math.cos(angle) * force * 12;
            p.vy -= Math.sin(angle) * force * 12;
            // Slightly nudge particle origin so the glyph deforms and flows
            p.originX += Math.cos(angle) * force * 6;
            p.originY += Math.sin(angle) * force * 6;
          }

          // Apply sampled velocity field for smooth fluid motion
          const f = sampleField(p.x, p.y);
          p.vx += f.x * 0.9;
          p.vy += f.y * 0.9;

          // Physics
          // Return to origin (Gentle drift back)
          p.vx += (p.originX - p.x) * p.ease;
          p.vy += (p.originY - p.y) * p.ease;

          // Small jitter to avoid perfectly smooth motion
          p.vx += (Math.random() - 0.5) * 0.06;
          p.vy += (Math.random() - 0.5) * 0.06;

          p.vx *= p.friction;
          p.vy *= p.friction;
          p.x += p.vx;
          p.y += p.vy;

          // Rendering tiny grains
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, p.size, p.size);
        });

        requestAnimationFrame(animate);
      }

      window.addEventListener("mousemove", (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      });

      // Touch support
      window.addEventListener("touchmove", (e) => {
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
      });

      window.addEventListener("resize", () => {
        initCanvas();
        createTextParticles();
      });

      initCanvas();
      createTextParticles();
      animate();
    </script>
  </body>
</html>
