<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        canvas {
            display: block;
            cursor: none;
        }
    </style>
    <title>Ultimate Fluid Text</title>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let particles = [];
        const mouse = { x: -9999, y: -9999, radius: 120 }; // Start mouse off-screen

        // --- CONFIGURATION ---
        const TEXT = "FLUID";
        const FONT_SIZE = Math.min(window.innerWidth / 4, 250);
        const PARTICLE_SPACING = 4; // Lower = denser, smoother blob
        const MOUSE_FORCE = 6;
        const FRICTION = 0.85;
        const RETURN_FORCE = 0.02;

        function setup() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            // Create particles from text
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;

            // Draw text to hidden canvas
            tempCtx.font = `bold ${FONT_SIZE}px Arial, sans-serif`;
            tempCtx.fillStyle = 'white';
            tempCtx.textAlign = 'center';
            tempCtx.textBaseline = 'middle';
            tempCtx.fillText(TEXT, canvas.width / 2, canvas.height / 2);

            // Get pixel data and create particles
            const imageData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
            const data = imageData.data;
            particles = [];

            for (let y = 0; y < tempCanvas.height; y += PARTICLE_SPACING) {
                for (let x = 0; x < tempCanvas.width; x += PARTICLE_SPACING) {
                    const index = (y * tempCanvas.width + x) * 4;
                    const alpha = data[index + 3];
                    if (alpha > 128) {
                        particles.push({
                            x: x,
                            y: y,
                            originX: x,
                            originY: y,
                            vx: 0,
                            vy: 0,
                        });
                    }
                }
            }
        }

        function updateParticles() {
            particles.forEach(p => {
                // --- MOUSE INTERACTION ---
                const dx = mouse.x - p.x;
                const dy = mouse.y - p.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < mouse.radius) {
                    const force = (1 - distance / mouse.radius) * MOUSE_FORCE;
                    const angle = Math.atan2(dy, dx);
                    // Push particles away from mouse
                    p.vx -= Math.cos(angle) * force;
                    p.vy -= Math.sin(angle) * force;
                }

                // --- RETURN TO ORIGIN FORCE ---
                p.vx += (p.originX - p.x) * RETURN_FORCE;
                p.vy += (p.originY - p.y) * RETURN_FORCE;

                // --- APPLY FRICTION & UPDATE POSITION ---
                p.vx *= FRICTION;
                p.vy *= FRICTION;
                p.x += p.vx;
                p.y += p.vy;
            });
        }

        function render() {
            // --- MOTION BLUR / TRAIL EFFECT ---
            // A low alpha value creates a longer, smoother trail
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // --- METABALL RENDERING ---
            // This is the magic that makes particles look like fluid
            ctx.globalCompositeOperation = 'lighter';

            particles.forEach(p => {
                // Create a radial gradient for each particle
                const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size || 25);
                gradient.addColorStop(0, 'rgba(255, 255, 255, 0.9)'); // Bright center
                gradient.addColorStop(0.5, 'rgba(150, 200, 255, 0.5)'); // Mid-blue
                gradient.addColorStop(1, 'rgba(100, 150, 255, 0)'); // Transparent edge

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size || 25, 0, Math.PI * 2);
                ctx.fill();
            });

            // --- RESET COMPOSITE MODE ---
            ctx.globalCompositeOperation = 'source-over';

            // --- DRAW GHOST TEXT FOR READABILITY ---
            ctx.font = `bold ${FONT_SIZE}px Arial, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.fillText(TEXT, canvas.width / 2, canvas.height / 2);
        }
        
        function animate() {
            updateParticles();
            render();
            requestAnimationFrame(animate);
        }

        // --- EVENT LISTENERS ---
        canvas.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        canvas.addEventListener('mouseleave', () => {
            // Move mouse far away when it leaves the canvas
            mouse.x = -9999;
            mouse.y = -9999;
        });

        window.addEventListener('resize', () => {
            setup();
        });

        // --- INIT ---
        setup();
        animate();
    </script>
</body>
</html>
