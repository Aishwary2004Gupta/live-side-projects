<!doctype html>
<html>
  <head>
    <style>
      body {
        margin: 0;
        background-color: #000;
        overflow: hidden;
      }
      canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
    </style>
    <title>Fluid Particle Text</title>
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      let particles = [];
      const mouse = { x: null, y: null, radius: 150 };

      // --- CONFIGURATION ---
      let fontSize = Math.min(window.innerWidth / 6, 180);
      const text1 = "Let's";
      const text2 = "Connect ";

      // --- FLUID PHYSICS CONSTANTS ---
      const INTERACTION_RADIUS = 25; // How far particles can "see" each other
      const COHESION_STRENGTH = 0.005; // How strongly particles attract
      const REPULSION_STRENGTH = 0.5; // How strongly particles repel when too close
      const MOUSE_FORCE = 8;

      function initCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        fontSize = Math.min(window.innerWidth / 6, 180);
      }

      function createTextParticles() {
        const tempCanvas = document.createElement("canvas");
        const tempCtx = tempCanvas.getContext("2d");
        tempCanvas.width = canvas.width;
        tempCanvas.height = canvas.height;

        tempCtx.font = `bold ${fontSize}px Helvetica, Arial, sans-serif`;
        tempCtx.fillStyle = "white";
        tempCtx.textBaseline = "middle";
        tempCtx.textAlign = "center";

        const x = canvas.width / 2;
        const y = canvas.height / 2;

        tempCtx.fillText(text1, x, y - fontSize * 0.45);
        tempCtx.fillText(text2, x, y + fontSize * 0.45);

        const imageData = tempCtx.getImageData(
          0,
          0,
          tempCanvas.width,
          tempCanvas.height,
        );
        const data = imageData.data;
        particles = [];

        // Sampling: Step 3 for high density but good performance
        for (let y = 0; y < tempCanvas.height; y += 3) {
          for (let x = 0; x < tempCanvas.width; x += 3) {
            const index = (y * tempCanvas.width + x) * 4;
            if (data[index + 3] > 128) {
              particles.push({
                x: x,
                y: y,
                originX: x,
                originY: y,
                vx: 0,
                vy: 0,
                // Fluid particles need a bit more weight and less friction
                friction: 0.92,
                ease: 0.01, // Slower return to origin for a heavier feel
                radius: 2, // For inter-particle collision
              });
            }
          }
        }
      }

      function drawGhostText() {
        ctx.font = `bold ${fontSize}px Helvetica, Arial, sans-serif`;
        ctx.textBaseline = "middle";
        ctx.textAlign = "center";
        ctx.fillStyle = "rgba(255, 255, 255, 0.08)";
        const x = canvas.width / 2;
        const y = canvas.height / 2;
        ctx.fillText(text1, x, y - fontSize * 0.45);
        ctx.fillText(text2, x, y + fontSize * 0.45);
      }

      function applyFluidPhysics() {
        for (let i = 0; i < particles.length; i++) {
          const p1 = particles[i];

          // Mouse interaction
          const dx = mouse.x - p1.x;
          const dy = mouse.y - p1.y;
          const distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < mouse.radius) {
            const angle = Math.atan2(dy, dx);
            const force = (mouse.radius - distance) / mouse.radius;
            p1.vx -= Math.cos(angle) * force * MOUSE_FORCE;
            p1.vy -= Math.sin(angle) * force * MOUSE_FORCE;
          }

          // Inter-particle forces (The core of the fluid effect)
          for (let j = i + 1; j < particles.length; j++) {
            const p2 = particles[j];
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < INTERACTION_RADIUS && dist > 0) {
              const angle = Math.atan2(dy, dx);

              // REPULSION: If too close, push apart
              if (dist < p1.radius + p2.radius + 2) {
                const force =
                  (p1.radius + p2.radius + 2 - dist) * REPULSION_STRENGTH;
                p1.vx -= Math.cos(angle) * force;
                p1.vy -= Math.sin(angle) * force;
                p2.vx += Math.cos(angle) * force;
                p2.vy += Math.sin(angle) * force;
              }

              // COHESION: If at a medium distance, pull together
              else {
                const force =
                  (dist - (p1.radius + p2.radius + 2)) * COHESION_STRENGTH;
                p1.vx += Math.cos(angle) * force;
                p1.vy += Math.sin(angle) * force;
                p2.vx -= Math.cos(angle) * force;
                p2.vy -= Math.sin(angle) * force;
              }
            }
          }

          // Spring back to origin
          p1.vx += (p1.originX - p1.x) * p1.ease;
          p1.vy += (p1.originY - p1.y) * p1.ease;

          // Apply friction and update position
          p1.vx *= p1.friction;
          p1.vy *= p1.friction;
          p1.x += p1.vx;
          p1.y += p1.vy;
        }
      }

      function animate() {
        // Use a semi-transparent clear for motion blur/trail effect
        ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Set blend mode for fluid-like merging
        ctx.globalCompositeOperation = "lighter";

        // Apply physics and draw particles
        applyFluidPhysics();

        particles.forEach((p) => {
          // Draw with a gradient for a "glowy" blob effect
          const gradient = ctx.createRadialGradient(
            p.x,
            p.y,
            0,
            p.x,
            p.y,
            p.radius * 4,
          );
          gradient.addColorStop(0, "rgba(150, 200, 255, 1)");
          gradient.addColorStop(0.5, "rgba(100, 150, 255, 0.5)");
          gradient.addColorStop(1, "rgba(50, 100, 255, 0)");

          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius * 4, 0, Math.PI * 2);
          ctx.fill();
        });

        // Reset blend mode to draw the ghost text correctly
        ctx.globalCompositeOperation = "source-over";
        drawGhostText();

        requestAnimationFrame(animate);
      }

      window.addEventListener("mousemove", (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      });

      window.addEventListener("resize", () => {
        initCanvas();
        createTextParticles();
      });

      initCanvas();
      createTextParticles();
      animate();
    </script>
  </body>
</html>
