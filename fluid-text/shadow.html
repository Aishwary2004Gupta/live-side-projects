<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
    <title>Fluid Text Effect</title>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        let particles = [];
        const mouse = { x: null, y: null, radius: 180, isActive: false };
        let fontSize = Math.min(window.innerWidth / 6, 180);
        const text1 = "Let's";
        const text2 = "Connect 🙋🏻‍♂️";

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            fontSize = Math.min(window.innerWidth / 6, 180);
        }

        function createTextParticles() {
            const tempCanvas = document.createElement("canvas");
            const tempCtx = tempCanvas.getContext("2d");
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;

            tempCtx.font = `bold ${fontSize}px Helvetica, Arial, sans-serif`;
            tempCtx.fillStyle = "white";
            tempCtx.textBaseline = "middle";
            tempCtx.textAlign = "center";

            const x = canvas.width / 2;
            const y = canvas.height / 2;

            tempCtx.fillText(text1, x, y - fontSize * 0.45);
            tempCtx.fillText(text2, x, y + fontSize * 0.45);

            const imageData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
            const data = imageData.data;
            particles = [];

            // Sample every 4px for performance + density balance
            for (let y = 0; y < tempCanvas.height; y += 4) {
                for (let x = 0; x < tempCanvas.width; x += 4) {
                    const index = (y * tempCanvas.width + x) * 4;
                    if (data[index + 3] > 128) {
                        particles.push({
                            x: x,
                            y: y,
                            originX: x,
                            originY: y,
                            vx: 0,
                            vy: 0,
                            size: 2,
                            friction: 0.92,   // Slower decay = more fluid momentum
                            cohesion: 0.015,  // Pull toward nearby particles
                            targetRadius: 8,  // Ideal distance between neighbors
                            color: "rgba(255, 255, 255, 0.7)"
                        });
                    }
                }
            }
        }

        function drawGhostText() {
            ctx.font = `bold ${fontSize}px Helvetica, Arial, sans-serif`;
            ctx.textBaseline = "middle";
            ctx.textAlign = "center";
            ctx.fillStyle = "rgba(255, 255, 255, 0.06)";
            const x = canvas.width / 2;
            const y = canvas.height / 2;
            ctx.fillText(text1, x, y - fontSize * 0.45);
            ctx.fillText(text2, x, y + fontSize * 0.45);
        }

        // Fluid simulation: particles attract/repel based on neighbor distances
        function applyFluidPhysics() {
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];

                // Mouse interaction
                if (mouse.isActive) {
                    const dx = mouse.x - p.x;
                    const dy = mouse.y - p.y;
                    const distance = Math.sqrt(dx*dx + dy*dy);
                    if (distance < mouse.radius) {
                        const force = (mouse.radius - distance) / mouse.radius;
                        const angle = Math.atan2(dy, dx);
                        // Push away
                        p.vx -= Math.cos(angle) * force * 8;
                        p.vy -= Math.sin(angle) * force * 8;
                    }
                }

                // Cohesion: pull toward nearby particles (simulate surface tension)
                for (let j = i + 1; j < particles.length; j++) {
                    const q = particles[j];
                    const dx = q.x - p.x;
                    const dy = q.y - p.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);

                    if (dist > 0 && dist < 30) {
                        // If too far → pull together (cohesion)
                        if (dist > p.targetRadius) {
                            const force = (dist - p.targetRadius) * p.cohesion;
                            const angle = Math.atan2(dy, dx);
                            p.vx += Math.cos(angle) * force;
                            p.vy += Math.sin(angle) * force;
                            q.vx -= Math.cos(angle) * force;
                            q.vy -= Math.sin(angle) * force;
                        }
                        // If too close → push apart (avoid clumping)
                        else if (dist < p.targetRadius * 0.5) {
                            const force = (p.targetRadius * 0.5 - dist) * p.cohesion * 2;
                            const angle = Math.atan2(dy, dx);
                            p.vx -= Math.cos(angle) * force;
                            p.vy -= Math.sin(angle) * force;
                            q.vx += Math.cos(angle) * force;
                            q.vy += Math.sin(angle) * force;
                        }
                    }
                }

                // Spring back to original position (but gently)
                p.vx += (p.originX - p.x) * 0.008;
                p.vy += (p.originY - p.y) * 0.008;

                // Apply friction
                p.vx *= p.friction;
                p.vy *= p.friction;

                // Update position
                p.x += p.vx;
                p.y += p.vy;
            }
        }

        function renderParticles() {
            // Motion blur effect: semi-transparent layer over previous frame
            ctx.fillStyle = "rgba(0, 0, 0, 0.15)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw ghost text under particles
            drawGhostText();

            // Draw each particle as a soft blob
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
            });
        }

        function animate() {
            applyFluidPhysics();
            renderParticles();
            requestAnimationFrame(animate);
        }

        // Mouse events
        window.addEventListener("mousemove", (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            mouse.isActive = true;
        });

        window.addEventListener("mouseleave", () => {
            mouse.isActive = false;
        });

        window.addEventListener("resize", () => {
            initCanvas();
            createTextParticles();
        });

        initCanvas();
        createTextParticles();
        animate();
    </script>
</body>
</html>
