<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>Orange</title>
    <link rel="stylesheet" href="./orange.css" />
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="loading">loading orange...</div>

    <div id="hud" aria-label="orange controls">
      <div class="group">
        <button data-action="spin" class="active">Pause spin</button>
        <button data-action="reset">Reset view</button>
      </div>
      <div class="group">
        <button data-preset="default" class="active">Default</button>
        <button data-preset="close">Close</button>
        <button data-preset="top">Top</button>
        <button data-preset="wide">Wide</button>
      </div>
      <div class="group">
        <button data-quality="low">Low</button>
        <button data-quality="medium" class="active">Medium</button>
        <button data-quality="high">High</button>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./orange.js"></script>
  </body>
</html>
