<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Hover Reveal [WebGL]</title>
  </head>
  <body>
    <div class="canvas-wrap">
      <div class="canvas-inner">
        <canvas id="canvas"></canvas>
      </div>
    </div>
    <link rel="stylesheet" href="style.css" />

    <!-- vertex shader -->
    <script id="vs" type="f">
      attribute vec2 position;
      attribute vec2 texcoord;

      uniform mat3 u_matrix;
      uniform float u_time;

      varying vec2 v_texcoord;
      varying vec2 v_pos;
      varying float v_depth;

      void main() {
        vec2 pos = position;
        v_pos = position;
        v_texcoord = texcoord;
        v_depth = length(position) * 0.5;
        gl_Position = vec4(u_matrix * vec3(pos, 1), 1);
      }
    </script>

    <!-- fragment shader -->
    <script id="fs" type="f">
        precision mediump float;

      // Improved Perlin-like noise
      vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
      vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
      vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

      float snoise(vec2 v) {
          const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
          vec2 i  = floor(v + dot(v, C.yy));
          vec2 x0 = v - i + dot(i, C.xx);
          vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
          vec4 x12 = x0.xyxy + C.xxzz;
          x12.xy -= i1;
          i = mod289(i);
          vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
          vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
          m = m*m*m*m;
          vec3 x = 2.0 * fract(p * C.www) - 1.0;
          vec3 h = abs(x) - 0.5;
          vec3 ox = floor(x + 0.5);
          vec3 a0 = x - ox;
          m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);
          vec3 g;
          g.x = a0.x * x0.x + h.x * x0.y;
          g.yz = a0.yz * x12.xz + h.yz * x12.yw;
          return 130.0 * dot(m, g);
      }

      // Improved color grading function
      vec3 colorGrade(vec3 col, float factor) {
          vec3 lum = vec3(0.299, 0.587, 0.114);
          float brightness = dot(col, lum);
          vec3 saturated = mix(vec3(brightness), col, 1.2);
          return saturated;
      }

      // Better grayscale with contrast
      vec3 toGrayscale(vec3 col) {
          vec3 lum = vec3(0.299, 0.587, 0.114);
          float gray = dot(col, lum);
          gray = pow(gray, 0.95);
          return vec3(gray * 0.9);
      }

        uniform vec2 u_mouse;
        uniform float u_time;
        uniform sampler2D u_darkImage;

        varying vec2 v_texcoord;
        varying vec2 v_pos;
        varying float v_depth;

        void main() {
          vec4 img = texture2D(u_darkImage, v_texcoord);

          // Multi-layer noise for smoother transitions
          vec2 noisePos = vec2(gl_FragCoord) / 75.0;
          float noise1 = snoise(noisePos + vec2(u_time * 0.05));
          float noise2 = snoise(noisePos * 1.5 + vec2(u_time * 0.03, -u_time * 0.02));
          float noise3 = snoise(noisePos * 0.5 + vec2(sin(u_time * 0.02)));
          
          // Combine noises smoothly
          float combinedNoise = (noise1 * 0.5 + noise2 * 0.3 + noise3 * 0.2);
          combinedNoise = mix(combinedNoise, fract(combinedNoise), 0.3);

          // Enhanced mouse distance calculation with smoother falloff
          float dist = distance(u_mouse, gl_FragCoord.xy);
          
          // Dynamic range based on noise for organic feel
          float baseRange = 200.0;
          float noiseRange = mix(150.0, 250.0, (combinedNoise + 1.0) * 0.5);
          float range = mix(baseRange, noiseRange, 0.6);

          // Smooth transition function with easing
          float mixAmount = smoothstep(range + 50.0, max(10.0, range - 50.0), dist);
          
          // Color output
          vec3 colorized = colorGrade(img.rgb, 1.0);
          vec3 grayscaled = toGrayscale(img.rgb);
          
          // Enhanced color blend with better control
          vec3 finalColor = mix(colorized * 1.4, grayscaled * 1.1, mixAmount);
          
          // Add subtle edge glow effect
          float edgeFactor = smoothstep(0.2, 0.0, abs(mixAmount - 0.5));
          finalColor += vec3(0.1, 0.08, 0.15) * edgeFactor * 0.5;

          gl_FragColor = vec4(finalColor, img.a);
        }
    </script>

    <!-- twgl library -->
    <script src="https://twgljs.org/dist/4.x/twgl-full.min.js"></script>
    <script type="module" src="script.js"></script>
  </body>
</html>
