<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brush Torus</title>
<style>
    body {
        margin: 0;
        background: #f5ebdc;
        overflow: hidden;
    }
    canvas {
        display: block;
    }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Three.js setup
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 2000);
camera.position.set(0, 0, 650);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// Beige background
renderer.setClearColor(0xf5ebdc, 1);

// Create multiple brush-stroke tori
function createBrushTorus(count = 14) {
    const group = new THREE.Group();

    for (let i = 0; i < count; i++) {
        const points = [];
        const colors = [];

        const R = 195;
        const r = 52;
        const segments = 180;
        const hueStart = 210;
        const hueEnd = 340;

        for (let j = 0; j <= segments; j++) {
            const v = (j / segments) * Math.PI * 2;
            const offset = i * 26 + Math.sin(Date.now() * 0.001 + v * 2) * 30;

            const u = ((j / segments) * 360 + offset) * (Math.PI / 180);

            const x = (R + r * Math.cos(u)) * Math.cos(v);
            const y = (R + r * Math.cos(u)) * Math.sin(v);
            const z = r * Math.sin(u);

            points.push(new THREE.Vector3(x, y, z));

            // Color gradient
            const t = i / count;
            const hue = hueStart + (hueEnd - hueStart) * t;
            const color = new THREE.Color(`hsl(${hue}, 85%, 70%)`);
            colors.push(color.r, color.g, color.b);
        }

        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

        const material = new THREE.LineBasicMaterial({
            vertexColors: true,
            linewidth: 2.5,
            transparent: true,
            opacity: 0.85
        });

        const line = new THREE.Line(geometry, material);
        group.add(line);
    }

    return group;
}

const torusGroup = createBrushTorus(16);
scene.add(torusGroup);

// Animation
let time = 0;

function animate() {
    requestAnimationFrame(animate);
    time += 0.015;

    // Animate the ribbons
    torusGroup.children.forEach((line, i) => {
        const positions = line.geometry.attributes.position;
        const R = 195;
        const r = 52;

        for (let j = 0; j < positions.count; j++) {
            const v = (j / (positions.count - 1)) * Math.PI * 2;
            const offset = i * 26 + Math.sin(time * 1.2 + v * 3) * 45;

            const u = ((j / (positions.count - 1)) * 360 + offset) * (Math.PI / 180);

            const x = (R + r * Math.cos(u)) * Math.cos(v);
            const y = (R + r * Math.cos(u)) * Math.sin(v);
            const z = r * Math.sin(u);

            positions.setXYZ(j, x, y, z);
        }
        positions.needsUpdate = true;
    });

    // Gentle rotation
    torusGroup.rotation.y = time * 0.15;
    torusGroup.rotation.x = Math.sin(time * 0.08) * 0.3;

    renderer.render(scene, camera);
}

animate();

// Handle resize
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
