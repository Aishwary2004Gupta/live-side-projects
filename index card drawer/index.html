<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Paint Sketch Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #C4BDBC;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: radial-gradient(circle at 50% 48%, #D8D2D0 0%, #C4BDBC 52%, #B4ACAB 100%);
            transition: background 0.4s ease;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
            touch-action: none;
        }

        canvas:active {
            cursor: grabbing;
        }

        .paper-grain {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.15;
            mix-blend-mode: multiply;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            transition: opacity 0.3s ease;
        }

        .hint {
            position: absolute;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            color: #8f7d6a;
            font-size: 12px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-weight: 600;
            pointer-events: none;
            opacity: 0.65;
            transition: opacity 0.4s ease, color 0.3s ease;
            z-index: 10;
            white-space: nowrap;
        }

        .tp-dfwv {
            position: fixed !important;
            top: 14px !important;
            right: 14px !important;
            width: 320px !important;
            max-height: calc(100vh - 28px) !important;
            overflow-y: auto !important;
            border-radius: 12px !important;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.22), 0 2px 8px rgba(0, 0, 0, 0.12) !important;
            z-index: 9999 !important;
        }

        .tp-dfwv::-webkit-scrollbar {
            width: 5px;
        }

        .tp-dfwv::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.25);
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div id="canvas-container">
        <div class="paper-grain" id="paperGrain"></div>
        <div class="hint" id="hint">Drag to inspect &bull; Scroll to zoom</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tweakpane@3.1.10/dist/tweakpane.min.js"></script>

    <script>
        (() => {
            'use strict';

            const PRESETS = {
                'Cobalt & Sunset Orange': {
                    colors: ['#102fe0', '#2a55f5', '#8a10b2', '#de1245', '#ee400e', '#f5780a', '#e89e18'],
                    bgColor: '#C4BDBC'
                },
                'Lavender & Ocean Blue': {
                    colors: ['#a96bff', '#c495ff', '#e8d8ff', '#8e4bf2', '#3a4fe8', '#1b2ad4', '#0d1896'],
                    bgColor: '#ede2d6'
                },
                'Cyberpunk Neon': {
                    colors: ['#00f5d4', '#00bbf9', '#7b2cbf', '#9d4edd', '#f72585', '#7209b7', '#3a0ca3'],
                    bgColor: '#12111d'
                },
                'Sunset Ember & Gold': {
                    colors: ['#590d22', '#800f2f', '#a4133c', '#c9184a', '#ff4d6d', '#ff758f', '#ffb703'],
                    bgColor: '#ebded6'
                },
                'Emerald & Aureolin': {
                    colors: ['#081c15', '#1b4332', '#2d6a4f', '#40916c', '#52b788', '#74c69d', '#ffd166'],
                    bgColor: '#e2ece0'
                },
                'Midnight Pearl & Silver': {
                    colors: ['#0b132b', '#1c2541', '#3a506b', '#5bc0be', '#6fffe9', '#e0fbfc', '#ffffff'],
                    bgColor: '#141a24'
                }
            };

            const DEFAULT_PARAMS = {
                sketch: 'Brush Sculpture',
                preset: 'Cobalt & Sunset Orange',

                c1: '#102fe0',
                c2: '#2a55f5',
                c3: '#8a10b2',
                c4: '#de1245',
                c5: '#ee400e',
                c6: '#f5780a',
                c7: '#e89e18',
                invertPalette: false,

                lines: 180,
                segments: 105,
                sphereRadius: 220,
                turns: 4.5,
                strokeWidth: 68,
                fiberRadius: 1.05,
                waviness: 0.8,
                twist: 0.55,
                lineSpread: 0.2,
                strayFibers: 0.10,
                brushFlicks: false,

                shininess: 85,
                specularIntensity: 0.75,
                opacity: 0.88,

                spinMode: 'Downward',
                spinSpeed: 0.35,
                rotateClockwise: false,
                floatingBob: true,
                bobAmplitude: 2,
                bobSpeed: 0.6,

                bgColor: '#C4BDBC',
                paperGrain: true,
                grainOpacity: 0.15,
                keyLightIntensity: 1.55,
                fillLightIntensity: 0.9,
                rimLightIntensity: 0.85
            };

            const params = { ...DEFAULT_PARAMS };

            const CLOCKWISE_ROTATE_SPEED = 0.25;
            const CLOCKWISE_RETURN_SPEED = 7.5;

            const container = document.getElementById('canvas-container');
            const paperGrainEl = document.getElementById('paperGrain');
            const hintEl = document.getElementById('hint');

            const scene = new THREE.Scene();

            const camera = new THREE.PerspectiveCamera(
                42,
                window.innerWidth / window.innerHeight,
                10,
                3000
            );
            camera.position.set(0, 25, 680);

            const renderer = new THREE.WebGLRenderer({
                antialias: true,
                alpha: true,
                powerPreference: 'high-performance',
                preserveDrawingBuffer: false
            });

            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.15;
            renderer.setClearColor(0x000000, 0);
            container.appendChild(renderer.domElement);

            function resizeRenderer() {
                const w = window.innerWidth;
                const h = window.innerHeight;
                const maxPixels = 5200000;
                const dpr = window.devicePixelRatio || 1;
                const pixelBudget = Math.sqrt(maxPixels / (w * h));

                renderer.setPixelRatio(Math.max(0.75, Math.min(dpr, 2, pixelBudget)));
                renderer.setSize(w, h, false);

                camera.aspect = w / h;
                camera.updateProjectionMatrix();
            }

            resizeRenderer();

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.rotateSpeed = 0.75;
            controls.minDistance = 200;
            controls.maxDistance = 1200;
            controls.enablePan = false;

            controls.addEventListener('start', () => {
                hintEl.style.opacity = '0';
            });

            const ambientLight = new THREE.AmbientLight(0xfff5ea, 0.75);
            scene.add(ambientLight);

            const keyLight = new THREE.DirectionalLight(0xfffcf0, params.keyLightIntensity);
            keyLight.position.set(280, 420, 380);
            scene.add(keyLight);

            const fillLight = new THREE.DirectionalLight(0x8cb0ff, params.fillLightIntensity);
            fillLight.position.set(-360, 60, 260);
            scene.add(fillLight);

            const rimLight = new THREE.DirectionalLight(0xff4477, params.rimLightIntensity);
            rimLight.position.set(60, -320, -320);
            scene.add(rimLight);

            const pivotGroup = new THREE.Group();
            pivotGroup.position.set(0, -5, 0);
            pivotGroup.rotation.set(0.12, 0, 0.02);
            scene.add(pivotGroup);

            /*
             * These groups keep every movement completely separate:
             * pivotGroup  = showcase position and floating bob
             * spinGroup   = normal upward/downward spin only
             * rotateGroup = clockwise checkbox only
             */
            const spinGroup = new THREE.Group();
            const rotateGroup = new THREE.Group();

            pivotGroup.add(spinGroup);
            spinGroup.add(rotateGroup);

            let currentSketch = null;
            let rotateReturning = false;
            let rebuildToken = 0;
            let rebuildTimer = null;
            let building = false;

            function disposeObject(object) {
                object.traverse(child => {
                    if (child.geometry) child.geometry.dispose();

                    if (child.material) {
                        const materials = Array.isArray(child.material)
                            ? child.material
                            : [child.material];

                        materials.forEach(material => material.dispose());
                    }
                });
            }

            function getPalette() {
                let colors = [
                    params.c1,
                    params.c2,
                    params.c3,
                    params.c4,
                    params.c5,
                    params.c6,
                    params.c7
                ];

                if (params.invertPalette) colors = colors.reverse();
                return colors.map(color => new THREE.Color(color));
            }

            function paletteColor(t, palette) {
                t = THREE.MathUtils.clamp(t, 0, 1);

                const position = t * (palette.length - 1);
                const lower = Math.floor(position);
                const upper = Math.min(palette.length - 1, lower + 1);

                return palette[lower].clone().lerp(
                    palette[upper],
                    position - lower
                );
            }

            function randomFactory(seed) {
                let value = seed >>> 0;

                return () => {
                    value = (Math.imul(value, 1664525) + 1013904223) >>> 0;
                    return value / 4294967296;
                };
            }

            function getBrushSpine(t) {
                const theta = t * params.turns * Math.PI * 2 + 1.65;
                const latitude = 1.05 - t * 2.1;
                const r = params.sphereRadius;

                let x = r * (1 + 0.06 * Math.sin(theta * 0.5)) * Math.cos(latitude) * Math.cos(theta);
                let y = r * 1.06 * Math.sin(latitude);
                let z = r * (1 + 0.05 * Math.cos(theta * 0.5)) * Math.cos(latitude) * Math.sin(theta);

                if (params.brushFlicks && t < 0.08) {
                    const flick = Math.pow(1 - t / 0.08, 1.5);
                    x -= flick * 35;
                    y += flick * 30;
                    z -= flick * 15;
                }

                if (params.brushFlicks && t > 0.92) {
                    const flick = Math.pow((t - 0.92) / 0.08, 1.5);
                    x += flick * 35;
                    y -= flick * 30;
                    z += flick * 15;
                }

                return new THREE.Vector3(x, y, z);
            }

            function createMaterial(color, opacity) {
                return new THREE.MeshPhongMaterial({
                    color,
                    specular: color.clone()
                        .lerp(new THREE.Color(0xffffff), 0.7)
                        .multiplyScalar(params.specularIntensity),
                    shininess: params.shininess,
                    transparent: true,
                    opacity,
                    depthWrite: opacity > 0.88
                });
            }

            /*
             * Sketch 1:
             * The original spherical bristle-based brush sculpture.
             */
            function createBrushSculpture() {
                const group = new THREE.Group();
                const palette = getPalette();
                const random = randomFactory(884123);
                const lineCount = Math.min(260, params.lines);
                const pointsPerLine = Math.min(150, params.segments);

                for (let lineIndex = 0; lineIndex < lineCount; lineIndex++) {
                    const u = lineCount === 1 ? 0 : (lineIndex / (lineCount - 1)) * 2 - 1;
                    const side = Math.sign(u) * Math.pow(Math.abs(u), 0.9);
                    const depth = (random() - 0.5) * 0.75;
                    const stray = random() < params.strayFibers;
                    const spread = stray ? 1.18 + random() * 0.20 : 1;
                    const points = [];

                    for (let i = 0; i <= pointsPerLine; i++) {
                        const t = i / pointsPerLine;
                        const position = getBrushSpine(t);
                        const next = getBrushSpine(Math.min(1, t + 0.002));
                        const tangent = next.clone().sub(position).normalize();
                        const sphereNormal = position.clone().normalize();
                        const binormal = new THREE.Vector3()
                            .crossVectors(tangent, sphereNormal)
                            .normalize();

                        const normal = new THREE.Vector3()
                            .crossVectors(binormal, tangent)
                            .normalize();

                        let width = params.strokeWidth * (
                            0.85 + Math.sin(t * Math.PI) * 0.35
                        );

                        if (params.brushFlicks && t < 0.08) {
                            width *= 0.5 + (t / 0.08) * 0.5;
                        }

                        if (params.brushFlicks && t > 0.92) {
                            width *= 0.5 + ((1 - t) / 0.08) * 0.5;
                        }

                        const wave = Math.sin(
                            t * Math.PI * (3 + random() * 3) +
                            lineIndex * 0.15
                        ) * params.waviness;

                        points.push(
                            position
                                .addScaledVector(binormal, side * width * 0.5 * spread + wave)
                                .addScaledVector(normal, depth * params.fiberRadius * 7)
                        );
                    }

                    const curve = new THREE.CatmullRomCurve3(points, false, 'centripetal', 0.4);
                    const color = paletteColor((1 - side) * 0.5, palette);
                    color.multiplyScalar(0.88 + random() * 0.34);

                    const geometry = new THREE.TubeGeometry(
                        curve,
                        Math.max(12, Math.floor(pointsPerLine * 0.7)),
                        (stray ? 0.55 + random() * 0.3 : 0.8 + random() * 0.7) *
                            (params.fiberRadius / 1.15),
                        5,
                        false
                    );

                    group.add(new THREE.Mesh(
                        geometry,
                        createMaterial(color, params.opacity * (stray ? 0.7 : 1))
                    ));
                }

                return group;
            }

            /*
             * Sketch 2:
             * Based on the supplied Winders sketch: layered twisted closed loops.
             */
            function createWinders() {
                const group = new THREE.Group();
                const palette = getPalette();
                const random = randomFactory(1337);
                const lines = Math.min(220, params.lines);
                const segments = Math.min(260, params.segments * 2);

                for (let lineIndex = 0; lineIndex < lines; lineIndex++) {
                    const points = [];
                    const lineT = lineIndex / lines;
                    const q = 0.5 + 0.5 * Math.cos(Math.PI + (lineT + params.twist * 0.5) * Math.PI * 2);
                    const radius = 4.5 + params.sphereRadius / 65 + lineT * 2;
                    const spread = params.lineSpread;

                    const offset = new THREE.Vector3(
                        (random() - 0.5) * spread,
                        (random() - 0.5) * spread,
                        (random() - 0.5) * spread
                    );

                    for (let i = 0; i <= segments; i++) {
                        const theta = (i / segments) * Math.PI * 2;
                        const phase = Math.cos(theta) * (2.5 * Math.PI * q);

                        points.push(new THREE.Vector3(
                            radius * Math.sin(theta) * Math.cos(phase),
                            radius * Math.cos(theta),
                            radius * Math.sin(theta) * Math.sin(phase)
                        ).multiplyScalar(19).add(offset));
                    }

                    const curve = new THREE.CatmullRomCurve3(points, true, 'centripetal', 0.45);
                    const geometry = new THREE.TubeGeometry(
                        curve,
                        segments,
                        (0.34 + random() * 0.65) * params.fiberRadius,
                        5,
                        true
                    );

                    const color = paletteColor(lineIndex / lines, palette);

                    group.add(new THREE.Mesh(
                        geometry,
                        createMaterial(color, params.opacity * (0.55 + random() * 0.45))
                    ));
                }

                group.scale.setScalar(0.72);
                return group;
            }

            /*
             * Sketch 3:
             * Orbital paint ribbons wrapping around a softly pinched sphere.
             */
            function createOrbitalRibbons() {
                const group = new THREE.Group();
                const palette = getPalette();
                const random = randomFactory(9351);
                const lines = Math.min(190, params.lines);
                const segments = Math.min(220, params.segments * 2);
                const radius = params.sphereRadius;

                for (let lineIndex = 0; lineIndex < lines; lineIndex++) {
                    const points = [];
                    const band = (lineIndex / (lines - 1)) * 2 - 1;
                    const lineOffset = (random() - 0.5) * 0.09;

                    for (let i = 0; i <= segments; i++) {
                        const t = i / segments;
                        const angle = t * Math.PI * 2;
                        const latitude = band * 1.18 + Math.sin(angle * 2 + lineIndex) * 0.04;
                        const bandRadius = Math.cos(latitude) * radius;
                        const y = Math.sin(latitude) * radius;

                        points.push(new THREE.Vector3(
                            bandRadius * Math.cos(angle + lineOffset),
                            y,
                            bandRadius * Math.sin(angle + lineOffset)
                        ));
                    }

                    const curve = new THREE.CatmullRomCurve3(points, true, 'centripetal', 0.45);
                    const geometry = new THREE.TubeGeometry(
                        curve,
                        segments,
                        (0.45 + random() * 0.55) * params.fiberRadius,
                        5,
                        true
                    );

                    group.add(new THREE.Mesh(
                        geometry,
                        createMaterial(
                            paletteColor((lineIndex / lines + 0.15) % 1, palette),
                            params.opacity
                        )
                    ));
                }

                return group;
            }

            /*
             * Sketch 4:
             * A colorful flower-like spiral bloom.
             */
            function createSpiralBloom() {
                const group = new THREE.Group();
                const palette = getPalette();
                const random = randomFactory(7331);
                const lines = Math.min(160, params.lines);
                const segments = Math.min(220, params.segments * 2);

                for (let lineIndex = 0; lineIndex < lines; lineIndex++) {
                    const points = [];
                    const lineT = lineIndex / lines;
                    const baseAngle = lineT * Math.PI * 2;
                    const petalOffset = random() * 0.2;

                    for (let i = 0; i <= segments; i++) {
                        const t = i / segments;
                        const angle = t * Math.PI * 2 * params.turns;
                        const flower = Math.sin(angle * 2.5 + baseAngle) * 0.34;
                        const radius = params.sphereRadius * (
                            0.35 + t * 0.62 + flower * 0.25
                        );

                        points.push(new THREE.Vector3(
                            Math.cos(angle + baseAngle) * radius,
                            (t - 0.5) * params.sphereRadius * 1.7 +
                                Math.sin(angle * 3 + petalOffset) * 22,
                            Math.sin(angle + baseAngle) * radius
                        ));
                    }

                    const curve = new THREE.CatmullRomCurve3(points, false, 'centripetal', 0.45);
                    const geometry = new THREE.TubeGeometry(
                        curve,
                        segments,
                        (0.4 + random() * 0.65) * params.fiberRadius,
                        5,
                        false
                    );

                    group.add(new THREE.Mesh(
                        geometry,
                        createMaterial(
                            paletteColor(lineT, palette),
                            params.opacity * (0.65 + random() * 0.35)
                        )
                    ));
                }

                group.scale.setScalar(0.83);
                return group;
            }

            function buildCurrentSketch() {
                switch (params.sketch) {
                    case 'Winders':
                        return createWinders();

                    case 'Orbital Ribbons':
                        return createOrbitalRibbons();

                    case 'Spiral Bloom':
                        return createSpiralBloom();

                    default:
                        return createBrushSculpture();
                }
            }

            function rebuildNow(token) {
                if (token !== rebuildToken || building) return;

                building = true;

                requestAnimationFrame(() => {
                    if (token !== rebuildToken) {
                        building = false;
                        return;
                    }

                    const nextSketch = buildCurrentSketch();

                    if (token !== rebuildToken) {
                        disposeObject(nextSketch);
                        building = false;
                        return;
                    }

                    const oldSketch = currentSketch;
                    rotateGroup.add(nextSketch);
                    currentSketch = nextSketch;

                    if (oldSketch) {
                        rotateGroup.remove(oldSketch);
                        disposeObject(oldSketch);
                    }

                    building = false;
                });
            }

            function scheduleRebuild(delay = 140) {
                rebuildToken++;
                const token = rebuildToken;

                clearTimeout(rebuildTimer);

                rebuildTimer = setTimeout(() => {
                    rebuildTimer = null;
                    rebuildNow(token);
                }, delay);
            }

            function updateBackground() {
                container.style.background = params.bgColor;
                paperGrainEl.style.display = params.paperGrain ? 'block' : 'none';
                paperGrainEl.style.opacity = params.grainOpacity;

                const color = new THREE.Color(params.bgColor);
                const luminance = 0.299 * color.r + 0.587 * color.g + 0.114 * color.b;

                hintEl.style.color = luminance < 0.4
                    ? 'rgba(255,255,255,0.65)'
                    : '#8f7d6a';
            }

            function updateLighting() {
                keyLight.intensity = params.keyLightIntensity;
                fillLight.intensity = params.fillLightIntensity;
                rimLight.intensity = params.rimLightIntensity;
            }

            function applyPreset(name) {
                const preset = PRESETS[name];
                if (!preset) return;

                preset.colors.forEach((color, index) => {
                    params['c' + (index + 1)] = color;
                });

                params.bgColor = preset.bgColor;
            }

            updateBackground();
            updateLighting();
            scheduleRebuild(0);

            try {
                const PaneClass =
                    (window.Tweakpane && (window.Tweakpane.Pane || window.Tweakpane)) ||
                    window.Pane;

                const pane = new PaneClass({
                    title: '🎨 3D Paint Sketch Studio',
                    expanded: true
                });

                function addControl(parent, object, property, options) {
                    if (typeof parent.addBinding === 'function') {
                        return parent.addBinding(object, property, options);
                    }

                    return parent.addInput(object, property, options);
                }

                const fSketch = pane.addFolder({
                    title: '🖼️ Sketch Type',
                    expanded: true
                });

                addControl(fSketch, params, 'sketch', {
                    label: 'Sketch',
                    options: {
                        'Brush Sculpture': 'Brush Sculpture',
                        'Winders': 'Winders',
                        'Orbital Ribbons': 'Orbital Ribbons',
                        'Spiral Bloom': 'Spiral Bloom'
                    }
                }).on('change', scheduleRebuild);

                addControl(fSketch, params, 'preset', {
                    label: 'Palette Preset',
                    options: Object.keys(PRESETS).reduce((result, key) => {
                        result[key] = key;
                        return result;
                    }, {})
                }).on('change', event => {
                    applyPreset(event.value);
                    pane.refresh();
                    updateBackground();
                    scheduleRebuild(20);
                });

                const fPalette = pane.addFolder({
                    title: '🌈 Multi-Pigment Palette',
                    expanded: false
                });

                ['c1', 'c2', 'c3', 'c4', 'c5', 'c6', 'c7'].forEach((key, index) => {
                    addControl(fPalette, params, key, {
                        label: 'Pigment ' + (index + 1)
                    }).on('change', scheduleRebuild);
                });

                addControl(fPalette, params, 'invertPalette', {
                    label: 'Invert Pigment'
                }).on('change', scheduleRebuild);

                const fGeometry = pane.addFolder({
                    title: '📐 Shape & Lines',
                    expanded: true
                });

                addControl(fGeometry, params, 'lines', {
                    min: 30,
                    max: 340,
                    step: 10,
                    label: 'Line Count'
                }).on('change', scheduleRebuild);

                addControl(fGeometry, params, 'segments', {
                    min: 40,
                    max: 180,
                    step: 5,
                    label: 'Line Detail'
                }).on('change', scheduleRebuild);

                addControl(fGeometry, params, 'sphereRadius', {
                    min: 140,
                    max: 280,
                    step: 5,
                    label: 'Sculpture Radius'
                }).on('change', scheduleRebuild);

                addControl(fGeometry, params, 'turns', {
                    min: 2,
                    max: 5,
                    step: 0.05,
                    label: 'Coil Turns'
                }).on('change', scheduleRebuild);

                addControl(fGeometry, params, 'strokeWidth', {
                    min: 30,
                    max: 100,
                    step: 2,
                    label: 'Stroke Width'
                }).on('change', scheduleRebuild);

                addControl(fGeometry, params, 'fiberRadius', {
                    min: 0.4,
                    max: 2.5,
                    step: 0.1,
                    label: 'Fiber Size'
                }).on('change', scheduleRebuild);

                addControl(fGeometry, params, 'waviness', {
                    min: 0,
                    max: 3,
                    step: 0.1,
                    label: 'Bristle Wiggle'
                }).on('change', scheduleRebuild);

                addControl(fGeometry, params, 'twist', {
                    min: 0,
                    max: 1,
                    step: 0.01,
                    label: 'Winder Twist'
                }).on('change', scheduleRebuild);

                addControl(fGeometry, params, 'lineSpread', {
                    min: 0,
                    max: 2,
                    step: 0.05,
                    label: 'Line Spread'
                }).on('change', scheduleRebuild);

                addControl(fGeometry, params, 'strayFibers', {
                    min: 0,
                    max: 0.35,
                    step: 0.01,
                    label: 'Stray Bristles'
                }).on('change', scheduleRebuild);

                addControl(fGeometry, params, 'brushFlicks', {
                    label: 'Brush Flicks (Top + Tail)'
                }).on('change', scheduleRebuild);

                const fMaterial = pane.addFolder({
                    title: '✨ Paint Luster & Finish',
                    expanded: false
                });

                addControl(fMaterial, params, 'shininess', {
                    min: 10,
                    max: 150,
                    step: 5,
                    label: 'Wet Gloss'
                }).on('change', scheduleRebuild);

                addControl(fMaterial, params, 'specularIntensity', {
                    min: 0.1,
                    max: 2,
                    step: 0.05,
                    label: 'Highlights'
                }).on('change', scheduleRebuild);

                addControl(fMaterial, params, 'opacity', {
                    min: 0.2,
                    max: 1,
                    step: 0.02,
                    label: 'Paint Opacity'
                }).on('change', scheduleRebuild);

                const fMotion = pane.addFolder({
                    title: '🌪️ Motion & Spin Dynamics',
                    expanded: true
                });

                addControl(fMotion, params, 'spinMode', {
                    label: 'Spin Direction',
                    options: {
                        'Downward': 'Downward',
                        'Paused': 'Paused',
                        'Upward': 'Upward'
                    }
                });

                addControl(fMotion, params, 'spinSpeed', {
                    min: 0,
                    max: 2,
                    step: 0.05,
                    label: 'Spin Velocity'
                });

                addControl(fMotion, params, 'floatingBob', {
                    label: 'Floating Bob'
                });

                addControl(fMotion, params, 'rotateClockwise', {
                    label: 'Rotate Clockwise'
                }).on('change', () => {
                    rotateReturning = !params.rotateClockwise;
                });

                addControl(fMotion, params, 'bobAmplitude', {
                    min: 0,
                    max: 18,
                    step: 0.5,
                    label: 'Bob Amplitude'
                });

                addControl(fMotion, params, 'bobSpeed', {
                    min: 0.1,
                    max: 3,
                    step: 0.1,
                    label: 'Bob Speed'
                });

                const fEnvironment = pane.addFolder({
                    title: '💡 Lighting & Canvas',
                    expanded: false
                });

                addControl(fEnvironment, params, 'bgColor', {
                    label: 'Background'
                }).on('change', updateBackground);

                addControl(fEnvironment, params, 'paperGrain', {
                    label: 'Canvas Texture'
                }).on('change', updateBackground);

                addControl(fEnvironment, params, 'grainOpacity', {
                    min: 0,
                    max: 0.4,
                    step: 0.02,
                    label: 'Grain Opacity'
                }).on('change', updateBackground);

                addControl(fEnvironment, params, 'keyLightIntensity', {
                    min: 0.2,
                    max: 3,
                    step: 0.1,
                    label: 'Sun Key Light'
                }).on('change', updateLighting);

                addControl(fEnvironment, params, 'fillLightIntensity', {
                    min: 0,
                    max: 2,
                    step: 0.1,
                    label: 'Sky Fill Light'
                }).on('change', updateLighting);

                addControl(fEnvironment, params, 'rimLightIntensity', {
                    min: 0,
                    max: 2,
                    step: 0.1,
                    label: 'Rim Light'
                }).on('change', updateLighting);

                const fActions = pane.addFolder({
                    title: '⚡ Quick Actions',
                    expanded: true
                });

                fActions.addButton({
                    title: '🎲 Randomize Palette & Form'
                }).on('click', () => {
                    const randomColor = () =>
                        '#' + Math.floor(Math.random() * 16777215)
                            .toString(16)
                            .padStart(6, '0');

                    for (let i = 1; i <= 7; i++) {
                        params['c' + i] = randomColor();
                    }

                    params.turns = 3 + Math.random() * 1.8;
                    params.twist = Math.random();
                    params.strokeWidth = 45 + Math.random() * 38;

                    pane.refresh();
                    scheduleRebuild(20);
                });

                fActions.addButton({
                    title: '🔄 Reset'
                }).on('click', () => {
                    Object.assign(params, DEFAULT_PARAMS);

                    spinGroup.rotation.y = 0;
                    rotateGroup.rotation.z = 0;
                    rotateReturning = false;

                    pivotGroup.position.set(0, -5, 0);
                    pivotGroup.rotation.set(0.12, 0, 0.02);

                    camera.position.set(0, 25, 680);
                    controls.target.set(0, 0, 0);
                    controls.update();

                    pane.refresh();
                    updateBackground();
                    updateLighting();
                    scheduleRebuild(20);
                });
            } catch (error) {
                console.error('Tweakpane initialization failed:', error);
            }

            const clock = new THREE.Clock();

            function animate() {
                requestAnimationFrame(animate);

                const delta = Math.min(clock.getDelta(), 0.05);
                const elapsed = clock.elapsedTime;

                /*
                 * Spin Velocity affects ONLY this Y-axis spin.
                 */
                if (params.spinMode !== 'Paused' && params.spinSpeed > 0) {
                    const direction = params.spinMode === 'Upward' ? -1 : 1;
                    spinGroup.rotation.y += direction * delta * params.spinSpeed;
                }

                /*
                 * Clockwise rotation uses a separate group and fixed speed.
                 * It never reads or uses spinSpeed.
                 */
                if (params.rotateClockwise) {
                    rotateGroup.rotation.z -= delta * CLOCKWISE_ROTATE_SPEED;
                    rotateReturning = false;
                }

                /*
                 * When clockwise rotation is turned off, only rotateGroup
                 * returns to Z = 0. spinGroup continues spinning normally.
                 */
                if (!params.rotateClockwise && rotateReturning) {
                    const difference = -rotateGroup.rotation.z;

                    if (Math.abs(difference) > 0.0001) {
                        const easing = 1 - Math.exp(-CLOCKWISE_RETURN_SPEED * delta);
                        rotateGroup.rotation.z += difference * easing;
                    } else {
                        rotateGroup.rotation.z = 0;
                        rotateReturning = false;
                    }
                }

                if (params.floatingBob) {
                    pivotGroup.position.y =
                        -5 + Math.sin(elapsed * params.bobSpeed) * params.bobAmplitude;

                    pivotGroup.rotation.z =
                        0.02 + Math.sin(elapsed * 0.4) * 0.015;
                } else {
                    pivotGroup.position.y += (-5 - pivotGroup.position.y) * 0.08;
                    pivotGroup.rotation.z += (0.02 - pivotGroup.rotation.z) * 0.08;
                }

                controls.update();
                renderer.render(scene, camera);
            }

            animate();

            let resizeFrame = null;

            window.addEventListener('resize', () => {
                cancelAnimationFrame(resizeFrame);

                resizeFrame = requestAnimationFrame(() => {
                    resizeRenderer();
                });
            });

            renderer.domElement.addEventListener('webglcontextlost', event => {
                event.preventDefault();
                console.warn('WebGL context lost.');
            });

            renderer.domElement.addEventListener('webglcontextrestored', () => {
                scheduleRebuild(20);
            });
        })();
    </script>
</body>
</html>
