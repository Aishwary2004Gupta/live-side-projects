<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Setup — Filing Sequence</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Courier+Prime&family=Space+Grotesk:wght@300;500&display=swap');

  :root {
    --bg: #e6e5de;
    --paper: #f0efe8;
    --ink: #161616;
    --tab-black: #131313;
    --accent: #cfc194;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    font-family: 'Courier Prime', 'Courier New', monospace;
    color: var(--ink);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Main scene container */
  .scene {
    position: relative;
    width: 720px;
    height: 640px;
    background: var(--bg);
  }

  /* Filing cabinet stack */
  .cabinet {
    position: absolute;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    width: 520px;
    height: 400px;
  }

  /* Each file card */
  .file {
    position: absolute;
    left: 30px;
    width: 460px;
    height: 36px;
    background: var(--paper);
    border: 1.2px solid var(--ink);
    border-radius: 4px;
    font-size: 11px;
    letter-spacing: 0.02em;
    color: var(--ink);
    overflow: hidden;
    z-index: 1;
    transition: transform 0.4s ease, height 0.4s ease, z-index 0s;
  }

  /* Tab shapes at top of each card */
  .tab {
    position: absolute;
    top: -14px;
    height: 15px;
    background: var(--paper);
    border: 1.2px solid var(--ink);
    border-bottom: 0;
    border-radius: 4px 4px 0 0;
    padding: 0 8px;
    display: flex;
    align-items: flex-end;
    font-size: 10px;
    font-weight: 600;
    white-space: nowrap;
    box-shadow: 0 1px 0 rgba(0,0,0,0.06);
  }

  .tab.black-tab {
    background: var(--tab-black);
    color: #fff;
    border-color: var(--tab-black);
    box-shadow: none;
  }

  /* Inner content shown when open */
  .card-body {
    position: absolute;
    top: 36px;
    left: -30px;
    width: 460px;
    height: 0;
    background: var(--paper);
    border: 1.2px solid var(--ink);
    border-top: 0;
    border-radius: 0 0 4px 4px;
    opacity: 0;
    overflow: hidden;
    transition: height 0.55s ease, opacity 0.35s ease;
    z-index: 50;
    box-shadow: 0 20px 40px rgba(0,0,0,0.08);
    pointer-events: none;
  }

  .file.open .card-body {
    height: 320px;
    opacity: 1;
    pointer-events: auto;
  }

  /* When open, slide card up and expand */
  .file.open {
    z-index: 100;
    transform: translateY(-140px);
    height: 356px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.12);
  }

  /* Card label row */
  .label-row {
    height: 34px;
    display: flex;
    align-items: center;
    padding: 0 16px;
    border-bottom: 1px solid rgba(22,22,22,0.15);
    font-size: 11px;
    letter-spacing: 0.06em;
    justify-content: space-between;
  }

  .file.open .label-row {
    opacity: 0;
    transition: opacity 0.2s ease;
  }

  /* Open content layout */
  .content-wrap {
    padding: 22px 24px 28px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    height: 100%;
  }

  .content-wrap h2 {
    font-size: 16px;
    font-weight: 300;
    letter-spacing: 0.02em;
    font-family: 'Space Grotesk', sans-serif;
    margin-bottom: 2px;
  }

  .content-wrap .sub {
    font-size: 10px;
    color: #777;
    letter-spacing: 0.08em;
    margin-bottom: 10px;
    text-transform: lowercase;
  }

  .img-box {
    flex: 1;
    width: 100%;
    background: #ddd;
    border: 1px solid rgba(22,22,22,0.2);
    border-radius: 3px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .img-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Bottom gold label */
  .drawer-label {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(180deg, #ddd7ad 0%, #c2b78e 100%);
    color: #3a3220;
    padding: 8px 28px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.06em;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    z-index: 200;
    border: 1px solid rgba(255,255,255,0.4);
  }

  /* Scene divider / time marker (optional subtle) */
  .time-marker {
    position: absolute;
    top: 12px;
    left: 24px;
    font-size: 10px;
    color: #999;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* Responsive centering */
  @media (max-width: 780px) {
    .scene { transform: scale(0.85); }
  }
</style>
</head>
<body>

<div class="scene" id="scene">
  <div class="time-marker" id="timer">00:00 / 00:11</div>

  <div class="cabinet" id="cabinet">
    <!-- Cards generated by JS below -->
  </div>

  <div class="drawer-label">sam's secret files</div>
</div>

<script>
  // Exact data from source image with correct names, numbers, and black tab markers
  const files = [
    { id: 94, name: "oil lamp", pos: 22 },
    { id: 95, name: "oats", pos: 65 },
    { letter: "O", num: "010", pos: 48, black: true },
    { id: 96, name: "pants", pos: 18 },
    { id: 97, name: "plane", pos: 72 },
    { id: 98, name: "plant 003", pos: 28, openImg: "https://images.unsplash.com/photo-1446071103084-c257b5f70672?w=500&auto=format&fit=crop&q=60" },
    { id: 99, name: "pomelo", pos: 75 },
    { id: 100, name: "phisher", pos: 35 },
    { id: 101, name: "palo alto", pos: 60 },
    { id: 102, name: "pencile", pos: 20 },
    { id: 103, name: "photos", pos: 70 },
    { id: 104, name: "quiet", pos: 30 },
    { letter: "P", num: "012", pos: 55, black: true },
    { id: 105, name: "queen", pos: 25 },
    { id: 106, name: "questions", pos: 65 },
    { id: 107, name: "quizz", pos: 40 },
    { letter: "Q", num: "005", pos: 75, black: true },
    { id: 109, name: "raccoon", pos: 20 },
    { id: 111, name: "rizz", pos: 70 },
    { id: 113, name: "generic guy", pos: 35, openImg: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=500&auto=format&fit=crop&q=60" },
    { id: 114, name: "rain", pos: 55 },
    { id: 115, name: "rug", pos: 22 },
    { id: 116, name: "ruby", pos: 68 },
    { letter: "R", num: "002", pos: 45, black: true },
    { id: 118, name: "sony", pos: 18, openImg: "https://images.unsplash.com/photo-1484704849700-f032a568e944?w=500&auto=format&fit=crop&q=60" },
    { id: 119, name: "sun", pos: 60 },
    { id: 120, name: "seller", pos: 25 },
    { id: 121, name: "sims", pos: 65 },
    { id: 122, name: "slides", pos: 38 },
    { id: 123, name: "simpsons", pos: 72 },
    { letter: "S", num: "002", pos: 50, black: true },
    { id: 124, name: "sir", pos: 28 },
  ];

  const cabinet = document.getElementById("cabinet");

  // Build cards
  files.forEach((f, i) => {
    const top = i * 16;
    const file = document.createElement("div");
    file.className = "file";
    file.style.top = top + "px";
    file.style.zIndex = i + 1;

    // Tab HTML
    let tabHTML = "";
    if (f.black) {
      tabHTML = `<div class="tab black-tab" style="left:${f.pos}%;transform:translateX(-50%)">
        <span>${f.letter}</span><span>${f.num}</span>
      </div>`;
    } else {
      tabHTML = `<div class="tab" style="left:${f.pos}%;transform:translateX(-50%)">
        <span>${f.id}</span><span>${f.name}</span>
      </div>`;
    }

    // Content for open state
    let contentHTML = "";
    if (f.openImg) {
      contentHTML = `
        <div class="content-wrap">
          <h2>${f.name}</h2>
          <div class="sub">details</div>
          <div class="img-box">
            <img src="${f.openImg}" alt="${f.name}" loading="eager">
          </div>
        </div>
      `;
    } else {
      contentHTML = `<div class="content-wrap"><h2>${f.name}</h2><div class="sub">details</div></div>`;
    }

    file.innerHTML = `
      ${tabHTML}
      <div class="label-row">
        <span>${f.id || f.letter || ''}</span>
        <span>${f.name || f.num || ''}</span>
      </div>
      <div class="card-body" data-file="${f.id || f.letter}">
        ${contentHTML}
      </div>
    `;

    cabinet.appendChild(file);
  });

  // Scene mapping based on exact time script
  // 00:00-00:02: 118 sony open
  // 00:02-00:03: all closed
  // 00:03-00:06: 113 generic guy open
  // 00:06-00:08: all closed
  // 00:08-00:10: 98 plant 003 open
  // 00:10-00:11: all closed

  const scenes = [
    { t: 0, open: 118, label: "00:00 / 00:11" },
    { t: 2000, open: null, label: "00:02 / 00:11" },
    { t: 3000, open: 113, label: "00:03 / 00:11" },
    { t: 6000, open: null, label: "00:06 / 00:11" },
    { t: 8000, open: 98, label: "00:08 / 00:11" },
    { t: 10000, open: null, label: "00:10 / 00:11" },
  ];

  let currentScene = -1;

  function applyScene(openId) {
    document.querySelectorAll(".file").forEach(el => {
      const id = parseInt(el.querySelector(".card-body")?.dataset.file || "0");
      const match = (openId === id);
      if (match) el.classList.add("open");
      else el.classList.remove("open");
    });
  }

  function tick() {
    const now = Date.now();
    const start = window.__start || (window.__start = Date.now());
    const elapsed = now - start;

    // Determine active scene
    let idx = scenes.findIndex(s => elapsed >= s.t && (scenes.findIndex(x => x.t > s.t) === -1 || elapsed < scenes.find(s2 => s2.t > s.t)?.t));
    // Simpler: find last scene whose time has passed
    let active = -1;
    for (let i = 0; i < scenes.length; i++) {
      if (elapsed >= scenes[i].t) active = i;
    }

    if (active !== currentScene) {
      currentScene = active;
      const s = scenes[active];
      document.getElementById("timer").textContent = s ? s.label : "00:11 / 00:11";
      applyScene(s ? s.open : null);
    }

    requestAnimationFrame(tick);
  }

  // Start after brief setup
  setTimeout(() => {
    applyScene(118); // initial scene at load
    tick();
  }, 50);
</script>

</body>
</html>
