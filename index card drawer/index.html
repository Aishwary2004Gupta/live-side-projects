<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brush Torus</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: #e8dbc8;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
    }
    canvas { display: block; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── Scene Setup ─────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe8dbc8);

const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 1, 5000);
camera.position.set(0, 60, 780);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// ─── Lighting ─────────────────────────────────────────────────────────────────
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

const dirLight1 = new THREE.DirectionalLight(0xfff8f0, 1.3);
dirLight1.position.set(300, 400, 300);
scene.add(dirLight1);

const dirLight2 = new THREE.DirectionalLight(0xd0e0ff, 0.7);
dirLight2.position.set(-400, -100, 200);
scene.add(dirLight2);

const pointLight = new THREE.PointLight(0xff8866, 0.5, 1200);
pointLight.position.set(-200, 300, 400);
scene.add(pointLight);

// ─── Color Palette (blue, purple, magenta, red, orange) ──────────────────────
const PALETTE = [
    new THREE.Color(0x3344ee),
    new THREE.Color(0x7722cc),
    new THREE.Color(0xcc2288),
    new THREE.Color(0xee4422),
    new THREE.Color(0xcc7722),
    new THREE.Color(0x4433dd),
    new THREE.Color(0x9911aa),
];

// ─── Brush Torus Builder ──────────────────────────────────────────────────────
function createBrushTorus({ R=210, r=58, numFibers=110, tubeRad=4.0, palette, torusSeg=140, tubeSeg=10, spread=1.05, wavy=0.22 }) {
    const group = new THREE.Group();

    for (let fi = 0; fi < numFibers; fi++) {
        const fiberT = fi / numFibers;

        // Distribute fibers within the tube cross-section
        const angle = fiberT * Math.PI * 2 + (Math.random() - 0.5) * 0.4;
        const radFrac = Math.sqrt(Math.random());
        const fiberOffR = radFrac * r * spread;

        const wavePhase = Math.random() * Math.PI * 2;
        const waveFreq = 2 + Math.random() * 3;

        const points = [];
        for (let j = 0; j <= torusSeg; j++) {
            const v = (j / torusSeg) * Math.PI * 2;
            const cosV = Math.cos(v), sinV = Math.sin(v);

            const wave = wavy * Math.sin(waveFreq * v + wavePhase);
            const localAngle = angle + v * 0.15;
            const rLocal = r + fiberOffR * 0.4 + wave * r * 0.5;

            const x = (R + rLocal * Math.cos(localAngle)) * cosV;
            const y = (R + rLocal * Math.cos(localAngle)) * sinV;
            const z = rLocal * Math.sin(localAngle) + wave * r * 0.25;

            points.push(new THREE.Vector3(x, y, z));
        }
        points.push(points[0].clone());

        const curve = new THREE.CatmullRomCurve3(points, true, 'catmullrom', 0.5);
        const fiberTubeRad = tubeRad * (0.45 + radFrac * 0.75);
        const geometry = new THREE.TubeGeometry(curve, torusSeg * 2, fiberTubeRad, tubeSeg, true);

        // Interpolate color along palette
        const colIdx = Math.floor(fiberT * (palette.length - 1));
        const colNext = Math.min(colIdx + 1, palette.length - 1);
        const colAlpha = (fiberT * (palette.length - 1)) - colIdx;
        const color = palette[colIdx].clone().lerp(palette[colNext], colAlpha);
        color.multiplyScalar(0.72 + Math.random() * 0.52);

        const opacity = 0.50 + Math.random() * 0.45;

        const material = new THREE.MeshPhongMaterial({
            color,
            shininess: 30 + Math.random() * 45,
            specular: new THREE.Color(0x8899ff),
            transparent: true,
            opacity,
            side: THREE.FrontSide,
        });

        group.add(new THREE.Mesh(geometry, material));
    }

    return group;
}

// ─── Build Scene ──────────────────────────────────────────────────────────────
const torusGroup = createBrushTorus({
    R: 210, r: 60,
    numFibers: 110,
    tubeRad: 4.2,
    palette: PALETTE,
    torusSeg: 140,
    tubeSeg: 10,
    spread: 1.05,
    wavy: 0.22,
});

// Tilt to match reference perspective
torusGroup.rotation.x = 0.35;
torusGroup.rotation.z = -0.15;
scene.add(torusGroup);

// ─── Animation ────────────────────────────────────────────────────────────────
let time = 0;

function animate() {
    requestAnimationFrame(animate);
    time += 0.004;

    torusGroup.rotation.y = time * 0.18;
    torusGroup.rotation.x = 0.35 + Math.sin(time * 0.12) * 0.08;

    renderer.render(scene, camera);
}

animate();

// ─── Resize ──────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
