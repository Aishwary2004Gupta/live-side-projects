<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Oil Paint Brush Sculpture Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #ede3d2;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: radial-gradient(circle at 50% 48%, #f8f1e5 0%, #ece0cf 52%, #ddcfba 100%);
            transition: background 0.45s ease;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
            touch-action: none;
        }

        canvas:active {
            cursor: grabbing;
        }

        .paper-grain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.16;
            mix-blend-mode: multiply;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            transition: opacity 0.45s ease;
        }

        .hint {
            position: absolute;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            color: #8f7d6a;
            font-size: 12px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-weight: 600;
            pointer-events: none;
            opacity: 0.65;
            transition: opacity 0.4s ease, color 0.45s ease;
            z-index: 10;
        }

        /* Tweakpane UI Container */
        .tp-dfwv {
            position: fixed !important;
            top: 14px !important;
            right: 14px !important;
            width: 320px !important;
            max-height: calc(100vh - 28px) !important;
            overflow-y: auto !important;
            border-radius: 12px !important;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.22), 0 2px 8px rgba(0, 0, 0, 0.12) !important;
            z-index: 9999 !important;
        }

        .tp-dfwv::-webkit-scrollbar {
            width: 5px;
        }
        .tp-dfwv::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.25);
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div id="canvas-container">
        <div class="paper-grain" id="paperGrain"></div>
        <div class="hint" id="hint">Drag to inspect &bull; Scroll to zoom</div>
    </div>

    <!-- Three.js, OrbitControls & Tweakpane -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tweakpane@3.1.10/dist/tweakpane.min.js"></script>

    <script>
        (() => {
            'use strict';

            if (!window.THREE) {
                console.error('Three.js did not load.');
                return;
            }

            // ─── Preset Color Palette Definitions ─────────────────────────────────────
            const PRESETS = {
                'Cobalt & Sunset Orange': {
                    shape: 'Spherical Coil',
                    colors: ['#102fe0', '#2a55f5', '#8a10b2', '#de1245', '#ee400e', '#f5780a', '#e89e18'],
                    bgClear: '#C4BDBC',
                    turns: 3.15,
                    crestFold: 1.0,
                    width: 62,
                    fiberCount: 340,
                    shininess: 85
                },
                'Lavender & Ocean Blue': {
                    shape: 'Spherical Coil',
                    colors: ['#a96bff', '#c495ff', '#e8d8ff', '#8e4bf2', '#3a4fe8', '#1b2ad4', '#0d1896'],
                    bgClear: '#ede2d6',
                    turns: 3.20,
                    crestFold: 1.15,
                    width: 66,
                    fiberCount: 350,
                    shininess: 95
                },
                'Cyberpunk Neon': {
                    shape: 'Spherical Coil',
                    colors: ['#00f5d4', '#00bbf9', '#7b2cbf', '#9d4edd', '#f72585', '#7209b7', '#3a0ca3'],
                    bgClear: '#12111d',
                    turns: 3.3,
                    crestFold: 0.9,
                    width: 64,
                    fiberCount: 320,
                    shininess: 120
                },
                'Sunset Ember & Gold': {
                    shape: 'Spherical Coil',
                    colors: ['#590d22', '#800f2f', '#a4133c', '#c9184a', '#ff4d6d', '#ff758f', '#ffb703', '#fb8500'],
                    bgClear: '#ebded6',
                    turns: 3.1,
                    crestFold: 0.6,
                    width: 65,
                    fiberCount: 330,
                    shininess: 90
                },
                'Emerald & Aureolin': {
                    shape: 'Spherical Coil',
                    colors: ['#081c15', '#1b4332', '#2d6a4f', '#40916c', '#52b788', '#74c69d', '#ffd166', '#f77f00'],
                    bgClear: '#e2ece0',
                    turns: 3.2,
                    crestFold: 0.85,
                    width: 62,
                    fiberCount: 320,
                    shininess: 85
                },
                'Midnight Pearl & Silver': {
                    shape: 'Spherical Coil',
                    colors: ['#0b132b', '#1c2541', '#3a506b', '#5bc0be', '#6fffe9', '#e0fbfc', '#ffffff'],
                    bgClear: '#141a24',
                    turns: 3.2,
                    crestFold: 0.5,
                    width: 60,
                    fiberCount: 320,
                    shininess: 110
                },
                'Classic Rainbow Spectrum': {
                    shape: 'Spherical Coil',
                    colors: ['#0f2be0', '#1c4ff8', '#4b1bcb', '#820fb0', '#bf0a74', '#df113d', '#ee3d0c', '#f4760a', '#eaa014'],
                    bgClear: '#ede3d2',
                    turns: 3.25,
                    crestFold: 0.2,
                    width: 60,
                    fiberCount: 340,
                    shininess: 85
                },
            };

            // ─── Global State Parameters ───────────────────────────────────────────────
            const DEFAULT_PARAMS = {
                preset: 'Cobalt & Sunset Orange',
                shape: 'Spherical Coil',

                c1: '#102fe0',
                c2: '#2a55f5',
                c3: '#8a10b2',
                c4: '#de1245',
                c5: '#ee400e',
                c6: '#f5780a',
                c7: '#e89e18',
                invertPalette: false,
                colorJitter: 0.05,

                sphereRadius: 195,
                turns: 4.50,
                crestFold: 1.0,
                width: 62,
                thickness: 16,
                fiberCount: 320,
                fiberRadius: 1.15,
                waviness: 1.0,
                strayFibers: 0.12,
                startFlick: false,

                shininess: 85,
                specularIntensity: 0.75,
                fiberOpacity: 0.88,
                underRibbonOpacity: 0.72,

                spinMode: 'Downward',
                spinSpeed: 0.55,
                floatingBob: true,
                rotate: true,
                bobAmplitude: 5.0,
                bobSpeed: 1.1,

                keyLightIntensity: 1.55,
                fillLightIntensity: 0.90,
                rimLightIntensity: 0.85,
                bgColor: '#C4BDBC',
                paperGrain: true,
                grainOpacity: 0.16
            };

            const params = { ...DEFAULT_PARAMS };

            // ─── Staging Constants (framed like the reference image) ──────────────────
            const HOME_CAMERA_POS = new THREE.Vector3(0, 45, 640);
            const HOME_TARGET = new THREE.Vector3(0, 0, 0);

            const BASE_PIVOT_Y = 0;
            const BASE_PIVOT_ROT_X = -0.06;
            const BASE_PIVOT_ROT_Y = -0.35;
            const BASE_PIVOT_ROT_Z = -0.05;

            const CROSSFADE_DURATION = 0.55;

            // ─── Scene & Camera Setup ─────────────────────────────────────────────────
            const container = document.getElementById('canvas-container');
            const paperGrainEl = document.getElementById('paperGrain');
            const hintEl = document.getElementById('hint');

            const scene = new THREE.Scene();

            const camera = new THREE.PerspectiveCamera(
                42,
                window.innerWidth / window.innerHeight,
                10,
                3000
            );
            camera.position.copy(HOME_CAMERA_POS);
            camera.lookAt(HOME_TARGET);

            const renderer = new THREE.WebGLRenderer({
                antialias: true,
                alpha: true,
                powerPreference: 'high-performance',
                preserveDrawingBuffer: false
            });

            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.15;
            renderer.setClearColor(0x000000, 0);

            container.appendChild(renderer.domElement);

            let needsRender = true;

            function getSafePixelRatio() {
                const dpr = window.devicePixelRatio || 1;
                const isTouch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
                const lowCoreDevice = (navigator.hardwareConcurrency || 8) <= 4;
                const maxRatio = (isTouch || lowCoreDevice) ? 1.25 : 2;

                const w = Math.max(1, window.innerWidth);
                const h = Math.max(1, window.innerHeight);
                const maxPixels = 5200000;
                const budgetRatio = Math.sqrt(maxPixels / (w * h));

                return Math.max(0.75, Math.min(dpr, maxRatio, budgetRatio));
            }

            function resizeRenderer() {
                const w = Math.max(1, window.innerWidth);
                const h = Math.max(1, window.innerHeight);

                renderer.setPixelRatio(getSafePixelRatio());
                renderer.setSize(w, h, false);

                camera.aspect = w / h;
                camera.updateProjectionMatrix();

                needsRender = true;
            }

            resizeRenderer();

            // ─── Orbit Controls ───────────────────────────────────────────────────────
            let controls;

            if (THREE.OrbitControls) {
                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.06;
                controls.rotateSpeed = 0.7;
                controls.zoomSpeed = 0.75;
                controls.minDistance = 260;
                controls.maxDistance = 1200;
                controls.autoRotate = false;
                controls.target.copy(HOME_TARGET);
                controls.update();

                controls.addEventListener('start', () => {
                    hintEl.style.opacity = '0';
                });

                controls.addEventListener('change', () => {
                    needsRender = true;
                });
            } else {
                controls = {
                    enabled: true,
                    target: HOME_TARGET.clone(),
                    update: () => false,
                    reset: () => {}
                };
                console.error('OrbitControls did not load.');
            }

            // ─── Lighting Rig ─────────────────────────────────────────────────────────
            const ambientLight = new THREE.AmbientLight(0xfff5ea, 0.75);
            scene.add(ambientLight);

            const keyLight = new THREE.DirectionalLight(0xfffcf0, params.keyLightIntensity);
            keyLight.position.set(280, 420, 380);
            scene.add(keyLight);

            const fillLight = new THREE.DirectionalLight(0x8cb0ff, params.fillLightIntensity);
            fillLight.position.set(-360, 60, 260);
            scene.add(fillLight);

            const rimLight = new THREE.DirectionalLight(0xff4477, params.rimLightIntensity);
            rimLight.position.set(60, -320, -320);
            scene.add(rimLight);

            const innerLight = new THREE.PointLight(0xff7722, 0.8, 700);
            innerLight.position.set(0, 0, 0);
            scene.add(innerLight);

            // ─── Smoothing State (drives every "soft" transition) ─────────────────────
            const smooth = {
                shininess: params.shininess,
                specularIntensity: params.specularIntensity,
                fiberOpacity: params.fiberOpacity,
                underRibbonOpacity: params.underRibbonOpacity,

                keyLightIntensity: params.keyLightIntensity,
                fillLightIntensity: params.fillLightIntensity,
                rimLightIntensity: params.rimLightIntensity,

                spin: 0,
                bobBlend: params.floatingBob ? 1 : 0
            };

            let bobPhase = 0;
            let tiltPhase = 0;

            function damp(current, target, lambda, dt) {
                return current + (target - current) * (1 - Math.exp(-lambda * dt));
            }

            function smoothstep(x) {
                const k = Math.max(0, Math.min(1, x));
                return k * k * (3 - 2 * k);
            }

            // ─── Palette Helpers ──────────────────────────────────────────────────────
            function setPaletteFromColors(colors) {
                const slots = 7;

                for (let i = 0; i < slots; i++) {
                    const position = (i / (slots - 1)) * (colors.length - 1);
                    const lower = Math.floor(position);
                    const upper = Math.min(colors.length - 1, lower + 1);
                    const mix = position - lower;

                    const color = new THREE.Color(colors[lower]).lerp(
                        new THREE.Color(colors[upper]),
                        mix
                    );

                    params['c' + (i + 1)] = '#' + color.getHexString();
                }
            }

            function applyPreset(name) {
                const pr = PRESETS[name];
                if (!pr) return;

                params.shape = pr.shape;
                setPaletteFromColors(pr.colors);
                params.turns = pr.turns;
                params.crestFold = pr.crestFold;
                params.width = pr.width;
                params.fiberCount = pr.fiberCount;
                params.shininess = pr.shininess;
                params.bgColor = pr.bgClear;
            }

            function getActivePalette() {
                const rawColors = [
                    params.c1,
                    params.c2,
                    params.c3,
                    params.c4,
                    params.c5,
                    params.c6,
                    params.c7
                ];

                const list = params.invertPalette ? [...rawColors].reverse() : rawColors;

                return list.map((hex, i) => ({
                    pos: i / (list.length - 1),
                    color: new THREE.Color(hex)
                }));
            }

            function samplePaintColor(t, palette) {
                t = Math.max(0, Math.min(1, t));

                for (let i = 0; i < palette.length - 1; i++) {
                    if (t >= palette[i].pos && t <= palette[i + 1].pos) {
                        const localT = (t - palette[i].pos) / (palette[i + 1].pos - palette[i].pos);
                        return palette[i].color.clone().lerp(palette[i + 1].color, localT);
                    }
                }

                return palette[palette.length - 1].color.clone();
            }

            // ─── Mathematical Spine of 3D Brush Sculpture ─────────────────────────────
            function getSpineData(t) {
                const turns = params.turns;
                const theta = t * turns * Math.PI * 2 + 1.65;

                const lat = 1.05 - t * 2.10;
                const cosLat = Math.cos(lat);
                const sinLat = Math.sin(lat);

                const R = params.sphereRadius;
                const Rx = R * (1.0 + 0.06 * Math.sin(theta * 0.5));
                const Ry = R * 1.06;
                const Rz = R * (1.0 + 0.05 * Math.cos(theta * 0.5));

                let x = Rx * cosLat * Math.cos(theta);
                let y = Ry * sinLat;
                let z = Rz * cosLat * Math.sin(theta);

                if (params.shape === 'Hook Crest S-Loop') {
                    const fold = params.crestFold;

                    if (t < 0.26) {
                        const foldT = Math.sin((t / 0.26) * Math.PI);
                        x -= Math.sin(t * Math.PI * 3.5) * 35 * fold * foldT;
                        y += Math.cos(t * Math.PI * 3.5) * 25 * fold * foldT;
                        z += Math.sin(t * Math.PI * 2.0) * 30 * fold * foldT;
                    }
                }

                if (params.startFlick && t < 0.08) {
                    const tail = Math.pow(1 - t / 0.08, 1.5);
                    x -= tail * 35;
                    y += tail * 30;
                    z -= tail * 15;
                }

                const sphereNorm = new THREE.Vector3(x / Rx, y / Ry, z / Rz).normalize();

                return {
                    pos: new THREE.Vector3(x, y, z),
                    sphereNorm
                };
            }

            // ─── Artwork Lifecycle Management ─────────────────────────────────────────
            const pivotGroup = new THREE.Group();
            pivotGroup.position.set(0, BASE_PIVOT_Y, 0);
            pivotGroup.rotation.x = BASE_PIVOT_ROT_X;
            pivotGroup.rotation.y = BASE_PIVOT_ROT_Y;
            pivotGroup.rotation.z = BASE_PIVOT_ROT_Z;
            scene.add(pivotGroup);

            let currentBrushArt = null;

            function disposeObject(object) {
                object.traverse(child => {
                    if (child.geometry) {
                        child.geometry.dispose();
                    }

                    if (child.material) {
                        if (Array.isArray(child.material)) {
                            child.material.forEach(material => material.dispose());
                        } else {
                            child.material.dispose();
                        }
                    }
                });
            }

            function nextFrame() {
                return new Promise(resolve => requestAnimationFrame(resolve));
            }

            // ─── Build High-Fidelity 3D Brush Artwork ─────────────────────────────────
            async function buildBrushStrokeAsync(token) {
                const masterGroup = new THREE.Group();
                const palette = getActivePalette();

                // Local deterministic RNG keeps every rebuild visually consistent.
                let localSeed = 884123;

                function rnd() {
                    localSeed = (Math.imul(localSeed, 1664525) + 1013904223) >>> 0;
                    return (localSeed >>> 0) / 0xffffffff;
                }

                function rndRange(min, max) {
                    return min + rnd() * (max - min);
                }

                const SPINE_SAMPLES = 360;
                const spineData = [];
                const spinePoints = [];

                for (let i = 0; i <= SPINE_SAMPLES; i++) {
                    const data = getSpineData(i / SPINE_SAMPLES);
                    spineData.push(data);
                    spinePoints.push(data.pos);
                }

                const spineCurve = new THREE.CatmullRomCurve3(spinePoints, false, 'centripetal', 0.45);

                const spineFrames = [];

                for (let i = 0; i <= SPINE_SAMPLES; i++) {
                    const t = i / SPINE_SAMPLES;
                    const pt = spinePoints[i];
                    const tangent = spineCurve.getTangentAt(t).normalize();
                    const sphereNorm = spineData[i].sphereNorm;

                    let binormal = new THREE.Vector3().crossVectors(tangent, sphereNorm);

                    if (binormal.lengthSq() < 0.000001) {
                        binormal = new THREE.Vector3(1, 0, 0);
                    }

                    binormal.normalize();

                    const normal = new THREE.Vector3().crossVectors(binormal, tangent).normalize();

                    spineFrames.push({ pt, tangent, normal, binormal });
                }

                function getFrameAt(t) {
                    const idxFloat = t * SPINE_SAMPLES;
                    const idx = Math.min(Math.floor(idxFloat), SPINE_SAMPLES - 1);
                    const frac = idxFloat - idx;
                    const f1 = spineFrames[idx];
                    const f2 = spineFrames[idx + 1] || f1;

                    return {
                        pt: f1.pt.clone().lerp(f2.pt, frac),
                        tangent: f1.tangent.clone().lerp(f2.tangent, frac).normalize(),
                        normal: f1.normal.clone().lerp(f2.normal, frac).normalize(),
                        binormal: f1.binormal.clone().lerp(f2.binormal, frac).normalize()
                    };
                }

                const baseWidth = params.width;
                const baseThickness = params.thickness;

                function getWidth(t) {
                    if (t < 0.08 && params.startFlick) {
                        return (baseWidth * 0.5) + (t / 0.08) * (baseWidth * 0.5);
                    }

                    const taper = Math.sin(t * Math.PI);
                    return baseWidth * 0.85 + taper * (baseWidth * 0.35);
                }

                function getThickness(t) {
                    return baseThickness * 0.85 + Math.sin(t * Math.PI) * (baseThickness * 0.45);
                }

                // 1. Under-ribbon body layers.
                const NUM_LAYERS = 4;
                const RIBBON_SEGS = 260;

                for (let l = 0; l < NUM_LAYERS; l++) {
                    const ribbonGeom = new THREE.PlaneGeometry(1, 1, 20, RIBBON_SEGS);
                    const posAttr = ribbonGeom.attributes.position;
                    const colAttr = new Float32Array(posAttr.count * 3);

                    const layerH = (l - 1.5) * (baseThickness * 0.26);
                    const widthScale = 0.95 - l * 0.04;

                    for (let r = 0; r <= RIBBON_SEGS; r++) {
                        const t = r / RIBBON_SEGS;
                        const frame = getFrameAt(t);
                        const w = getWidth(t) * widthScale;

                        for (let c = 0; c <= 20; c++) {
                            const vIdx = r * 21 + c;
                            const u = (c / 20) * 2 - 1;

                            const vx = frame.pt.x + frame.binormal.x * (u * w * 0.5) + frame.normal.x * layerH;
                            const vy = frame.pt.y + frame.binormal.y * (u * w * 0.5) + frame.normal.y * layerH;
                            const vz = frame.pt.z + frame.binormal.z * (u * w * 0.5) + frame.normal.z * layerH;

                            posAttr.setXYZ(vIdx, vx, vy, vz);

                            const colorT = (1 - u) * 0.5;
                            const color = samplePaintColor(colorT, palette);

                            colAttr[vIdx * 3] = color.r;
                            colAttr[vIdx * 3 + 1] = color.g;
                            colAttr[vIdx * 3 + 2] = color.b;
                        }
                    }

                    ribbonGeom.setAttribute('color', new THREE.BufferAttribute(colAttr, 3));
                    ribbonGeom.computeVertexNormals();

                    const ribbonMat = new THREE.MeshPhongMaterial({
                        vertexColors: true,
                        specular: new THREE.Color(0xffffff).multiplyScalar(smooth.specularIntensity),
                        shininess: smooth.shininess,
                        transparent: true,
                        opacity: 0,
                        side: THREE.DoubleSide,
                        depthWrite: false
                    });

                    ribbonMat.userData.kind = 'ribbon';

                    const ribbonMesh = new THREE.Mesh(ribbonGeom, ribbonMat);
                    ribbonMesh.userData.kind = 'ribbon';
                    ribbonMesh.matrixAutoUpdate = false;
                    ribbonMesh.updateMatrix();

                    masterGroup.add(ribbonMesh);
                }

                // 2. Individual bristle strands.
                const NUM_BRISTLES = Math.max(1, Math.round(params.fiberCount));
                const BRISTLE_SEGS = 190;
                const waviness = params.waviness;
                const BRISTLE_CHUNK = 10;

                for (let bi = 0; bi < NUM_BRISTLES; bi++) {
                    if (token !== rebuildRequestId) {
                        disposeObject(masterGroup);
                        return null;
                    }

                    const uNorm = NUM_BRISTLES === 1 ? 0 : (bi / (NUM_BRISTLES - 1)) * 2 - 1;

                    const uOffset =
                        Math.sign(uNorm) * Math.pow(Math.abs(uNorm), 0.90) +
                        rndRange(-0.02, 0.02);

                    const vOffset =
                        rndRange(-0.48, 0.48) *
                        Math.sqrt(1 - Math.min(1, Math.abs(uOffset) * 0.85));

                    let colT = (1 - uOffset) * 0.5;
                    colT = Math.max(0, Math.min(1, colT + rndRange(-params.colorJitter, params.colorJitter)));

                    const bristleColor = samplePaintColor(colT, palette);
                    const brightness = rndRange(0.88, 1.30);
                    bristleColor.multiplyScalar(brightness);

                    const isStray = rnd() < params.strayFibers;
                    const spread = isStray ? rndRange(1.08, 1.35) : 1.0;

                    const startT = (bi < 50 || rnd() > 0.80) ? rndRange(0.0, 0.05) : 0.0;
                    const endT = (bi > NUM_BRISTLES - 50 || rnd() > 0.82) ? rndRange(0.95, 1.0) : 1.0;

                    const waveFreq = rndRange(3, 8);
                    const wavePhase = rndRange(0, Math.PI * 2);
                    const waveAmp = rndRange(0.5, 2.2) * waviness;

                    const points = [];
                    const steps = Math.max(4, Math.floor(BRISTLE_SEGS * (endT - startT)));

                    for (let si = 0; si <= steps; si++) {
                        const localT = si / steps;
                        const t = startT + localT * (endT - startT);
                        const frame = getFrameAt(t);

                        const w = getWidth(t) * spread;
                        const th = getThickness(t) * spread;

                        const wave = Math.sin(t * Math.PI * waveFreq + wavePhase) * waveAmp;

                        let fanning = 1.0;

                        if (t < 0.08 && params.startFlick) {
                            fanning = 1.0 + Math.pow(1 - t / 0.08, 1.5) * 0.45 * uOffset;
                        }

                        const px =
                            frame.pt.x +
                            frame.binormal.x * (uOffset * w * 0.5 * fanning + wave) +
                            frame.normal.x * (vOffset * th * 0.5);

                        const py =
                            frame.pt.y +
                            frame.binormal.y * (uOffset * w * 0.5 * fanning + wave) +
                            frame.normal.y * (vOffset * th * 0.5);

                        const pz =
                            frame.pt.z +
                            frame.binormal.z * (uOffset * w * 0.5 * fanning + wave) +
                            frame.normal.z * (vOffset * th * 0.5);

                        points.push(new THREE.Vector3(px, py, pz));
                    }

                    if (points.length > 3) {
                        const curve = new THREE.CatmullRomCurve3(points, false, 'centripetal', 0.4);

                        const radius =
                            (isStray ? rndRange(0.5, 0.85) : rndRange(0.8, 1.7)) *
                            (params.fiberRadius / 1.15);

                        const geom = new THREE.TubeGeometry(
                            curve,
                            Math.floor(steps * 1.35),
                            radius,
                            6,
                            false
                        );

                        const opacityBase = isStray ? rndRange(0.55, 0.78) : rndRange(0.82, 0.98);

                        const specularBase = bristleColor
                            .clone()
                            .lerp(new THREE.Color(0xffffff), 0.70);

                        const mat = new THREE.MeshPhongMaterial({
                            color: bristleColor,
                            specular: specularBase.clone().multiplyScalar(smooth.specularIntensity),
                            shininess: smooth.shininess,
                            transparent: true,
                            opacity: 0,
                            depthWrite: false,
                            side: THREE.FrontSide
                        });

                        mat.userData.kind = 'bristle';
                        mat.userData.baseColor = bristleColor.clone();
                        mat.userData.specularBase = specularBase;
                        mat.userData.opacityBase = opacityBase;

                        const mesh = new THREE.Mesh(geom, mat);
                        mesh.userData.kind = 'bristle';
                        mesh.matrixAutoUpdate = false;
                        mesh.updateMatrix();

                        masterGroup.add(mesh);
                    }

                    // Yield to the browser so the UI never freezes while building.
                    if (bi > 0 && bi % BRISTLE_CHUNK === 0) {
                        await nextFrame();
                    }
                }

                if (token !== rebuildRequestId) {
                    disposeObject(masterGroup);
                    return null;
                }

                return masterGroup;
            }

            // ─── Smooth Material Application (fade-aware) ─────────────────────────────
            function applyGroupMaterials(group) {
                const fadeRaw = group.userData.fade === undefined ? 1 : group.userData.fade;
                const fade = smoothstep(fadeRaw);

                const ribbonTarget = smooth.underRibbonOpacity;
                const fiberScale = smooth.fiberOpacity / 0.88;
                const spec = smooth.specularIntensity;
                const shin = smooth.shininess;

                const children = group.children;

                for (let i = 0; i < children.length; i++) {
                    const mesh = children[i];
                    const mat = mesh.material;

                    if (!mat || !mat.userData) continue;

                    if (mat.userData.kind === 'ribbon') {
                        const finalOpacity = ribbonTarget * fade;

                        mat.opacity = finalOpacity;
                        mat.shininess = shin;
                        mat.specular.setRGB(spec, spec, spec);
                        mat.depthWrite = false;

                        mesh.visible = finalOpacity > 0.002;
                    } else if (mat.userData.kind === 'bristle') {
                        const target = Math.min(1, mat.userData.opacityBase * fiberScale);
                        const finalOpacity = target * fade;

                        mat.opacity = finalOpacity;
                        mat.shininess = shin;
                        mat.specular.copy(mat.userData.specularBase).multiplyScalar(spec);
                        mat.depthWrite = fade > 0.995 && target > 0.88;

                        mesh.visible = finalOpacity > 0.002;
                    }
                }
            }

            function applyAllMaterials() {
                for (let i = 0; i < pivotGroup.children.length; i++) {
                    applyGroupMaterials(pivotGroup.children[i]);
                }
            }

            // UI handlers only nudge the render loop; smoothing does the rest.
            function updateMaterials() {
                needsRender = true;
            }

            function updateLighting() {
                needsRender = true;
            }

            function updateBackground() {
                container.style.background = params.bgColor;
                paperGrainEl.style.display = params.paperGrain ? 'block' : 'none';
                paperGrainEl.style.opacity = params.grainOpacity;

                const c = new THREE.Color(params.bgColor);
                const luminance = 0.299 * c.r + 0.587 * c.g + 0.114 * c.b;
                hintEl.style.color = luminance < 0.4 ? 'rgba(255,255,255,0.65)' : '#8f7d6a';

                needsRender = true;
            }

            // ─── Cross-fade Engine ────────────────────────────────────────────────────
            function updateFades(dt) {
                let active = false;

                for (let i = pivotGroup.children.length - 1; i >= 0; i--) {
                    const group = pivotGroup.children[i];
                    const ud = group.userData;

                    if (ud.fade === undefined) continue;

                    if (ud.fade !== ud.fadeTarget) {
                        const step = dt / CROSSFADE_DURATION;

                        if (ud.fade < ud.fadeTarget) {
                            ud.fade = Math.min(ud.fadeTarget, ud.fade + step);
                        } else {
                            ud.fade = Math.max(ud.fadeTarget, ud.fade - step);
                        }

                        active = true;
                    }

                    if (ud.fade <= 0 && ud.removeWhenDone) {
                        pivotGroup.remove(group);
                        disposeObject(group);
                    }
                }

                return active;
            }

            function finishFadesImmediately() {
                for (let i = pivotGroup.children.length - 1; i >= 0; i--) {
                    const group = pivotGroup.children[i];
                    const ud = group.userData;

                    if (ud.fade === undefined) continue;

                    ud.fade = ud.fadeTarget;

                    if (ud.fade <= 0 && ud.removeWhenDone) {
                        pivotGroup.remove(group);
                        disposeObject(group);
                    }
                }

                applyAllMaterials();
                needsRender = true;
            }

            // ─── Rebuild Scheduling ───────────────────────────────────────────────────
            let rebuildRequestId = 0;
            let rebuildTimer = null;
            let buildInProgress = false;
            let pendingBuildToken = null;

            function scheduleRebuild(delay = 130) {
                rebuildRequestId++;
                const token = rebuildRequestId;

                clearTimeout(rebuildTimer);

                rebuildTimer = setTimeout(() => {
                    rebuildTimer = null;
                    startRebuild(token);
                }, delay);
            }

            function rebuildArtwork() {
                scheduleRebuild();
            }

            function startRebuild(token) {
                if (token !== rebuildRequestId) return;

                if (buildInProgress) {
                    pendingBuildToken = token;
                    return;
                }

                buildInProgress = true;

                buildBrushStrokeAsync(token)
                    .then(nextArt => {
                        if (!nextArt) return;

                        if (token !== rebuildRequestId) {
                            disposeObject(nextArt);
                            return;
                        }

                        const previousArt = currentBrushArt;
                        const previousRotationY = previousArt ? previousArt.rotation.y : 0;

                        nextArt.rotation.y = previousRotationY;
                        nextArt.userData.fade = 0;
                        nextArt.userData.fadeTarget = 1;
                        nextArt.userData.removeWhenDone = false;

                        applyGroupMaterials(nextArt);
                        pivotGroup.add(nextArt);
                        currentBrushArt = nextArt;

                        // Old sculpture dissolves out instead of vanishing instantly.
                        if (previousArt) {
                            previousArt.userData.fadeTarget = 0;
                            previousArt.userData.removeWhenDone = true;
                        }

                        needsRender = true;
                    })
                    .catch(error => {
                        console.error('Artwork rebuild failed:', error);
                    })
                    .finally(() => {
                        buildInProgress = false;

                        if (pendingBuildToken !== null) {
                            const nextToken = pendingBuildToken;
                            pendingBuildToken = null;

                            if (nextToken === rebuildRequestId) {
                                startRebuild(nextToken);
                            }
                        }
                    });
            }

            function wait(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            async function waitForLatestArtwork() {
                if (rebuildTimer !== null) {
                    const token = rebuildRequestId;
                    clearTimeout(rebuildTimer);
                    rebuildTimer = null;
                    startRebuild(token);
                }

                while (buildInProgress || rebuildTimer !== null) {
                    await wait(40);
                }
            }

            // ─── Smooth Camera Fly ────────────────────────────────────────────────────
            let cameraFly = null;

            function flyCameraTo(position, target, duration = 1.0) {
                cameraFly = {
                    fromPos: camera.position.clone(),
                    toPos: position.clone(),
                    fromTarget: controls.target ? controls.target.clone() : target.clone(),
                    toTarget: target.clone(),
                    t: 0,
                    duration: Math.max(0.15, duration)
                };

                if ('enabled' in controls) controls.enabled = false;
                needsRender = true;
            }

            // ─── High-Res Export ──────────────────────────────────────────────────────
            async function saveHighResArtworkPNG() {
                await waitForLatestArtwork();
                finishFadesImmediately();

                const oldSize = renderer.getSize(new THREE.Vector2());
                const oldPixelRatio = renderer.getPixelRatio();
                const oldAspect = camera.aspect;
                const oldSceneBackground = scene.background;

                const displayW = Math.max(1, window.innerWidth);
                const displayH = Math.max(1, window.innerHeight);

                const maxTexture = Math.min(renderer.capabilities.maxTextureSize || 4096, 4096);
                const maxArea = 10000000;

                let scale = Math.min(
                    2,
                    maxTexture / displayW,
                    maxTexture / displayH,
                    Math.sqrt(maxArea / (displayW * displayH))
                );

                scale = Math.max(0.75, scale);

                const exportW = Math.floor(displayW * scale);
                const exportH = Math.floor(displayH * scale);

                let dataURL = null;

                try {
                    scene.background = new THREE.Color(params.bgColor);

                    renderer.setPixelRatio(1);
                    renderer.setSize(exportW, exportH, false);

                    camera.aspect = exportW / exportH;
                    camera.updateProjectionMatrix();

                    renderer.render(scene, camera);
                    dataURL = renderer.domElement.toDataURL('image/png');
                } catch (error) {
                    console.error('PNG export failed:', error);
                } finally {
                    scene.background = oldSceneBackground;

                    renderer.setPixelRatio(oldPixelRatio);
                    renderer.setSize(oldSize.x, oldSize.y, false);

                    camera.aspect = oldAspect;
                    camera.updateProjectionMatrix();

                    needsRender = true;
                }

                if (dataURL) {
                    const link = document.createElement('a');
                    link.download = `brush-sculpture-${Date.now()}.png`;
                    link.href = dataURL;
                    document.body.appendChild(link);
                    link.click();
                    link.remove();
                }
            }

            updateBackground();
            updateLighting();
            scheduleRebuild(0);

            // ─── Tweakpane UI Setup ───────────────────────────────────────────────────
            try {
                const PaneClass = (window.Tweakpane && (window.Tweakpane.Pane || window.Tweakpane)) || window.Pane;

                if (PaneClass) {
                    const pane = new PaneClass({
                        title: '🎨 3D Brush Sculpture Studio',
                        expanded: true
                    });

                    function addControl(parent, obj, prop, opt) {
                        if (typeof parent.addBinding === 'function') {
                            return parent.addBinding(obj, prop, opt);
                        } else if (typeof parent.addInput === 'function') {
                            return parent.addInput(obj, prop, opt);
                        } else {
                            return parent.add(obj, prop, opt);
                        }
                    }

                    const presetOptions = Object.keys(PRESETS).reduce((acc, key) => {
                        acc[key] = key;
                        return acc;
                    }, {});

                    // 1. Presets Folder
                    const fPresets = pane.addFolder({ title: '🌟 Style Presets', expanded: true });

                    addControl(fPresets, params, 'preset', {
                        options: presetOptions
                    }).on('change', ev => {
                        const val = ev && ev.value !== undefined ? ev.value : ev;

                        if (PRESETS[val]) {
                            applyPreset(val);
                            pane.refresh();
                            updateBackground();
                            updateMaterials();
                            scheduleRebuild(20);
                        }
                    });

                    // 2. Palette & Pigment Folder
                    const fPalette = pane.addFolder({ title: '🌈 Multi-Pigment Palette', expanded: false });

                    addControl(fPalette, params, 'c1', { label: 'Outer Edge' }).on('change', rebuildArtwork);
                    addControl(fPalette, params, 'c2', { label: 'Outer Mid' }).on('change', rebuildArtwork);
                    addControl(fPalette, params, 'c3', { label: 'Mid Purple' }).on('change', rebuildArtwork);
                    addControl(fPalette, params, 'c4', { label: 'Core Magenta' }).on('change', rebuildArtwork);
                    addControl(fPalette, params, 'c5', { label: 'Core Crimson' }).on('change', rebuildArtwork);
                    addControl(fPalette, params, 'c6', { label: 'Inner Amber' }).on('change', rebuildArtwork);
                    addControl(fPalette, params, 'c7', { label: 'Inner Gold' }).on('change', rebuildArtwork);
                    addControl(fPalette, params, 'invertPalette', { label: 'Invert Pigment' }).on('change', rebuildArtwork);
                    addControl(fPalette, params, 'colorJitter', {
                        min: 0.0,
                        max: 0.15,
                        step: 0.01,
                        label: 'Color Striation'
                    }).on('change', rebuildArtwork);

                    // 3. Geometry & Sculpture Folder
                    const fGeometry = pane.addFolder({ title: '📐 Geometry & Sculpture', expanded: true });

                    addControl(fGeometry, params, 'turns', {
                        min: 2.0,
                        max: 4.5,
                        step: 0.05,
                        label: 'Coil Turns'
                    }).on('change', rebuildArtwork);

                    addControl(fGeometry, params, 'sphereRadius', {
                        min: 140,
                        max: 260,
                        step: 5,
                        label: 'Sphere Radius'
                    }).on('change', rebuildArtwork);

                    addControl(fGeometry, params, 'width', {
                        min: 30,
                        max: 100,
                        step: 2,
                        label: 'Stroke Width'
                    }).on('change', rebuildArtwork);

                    addControl(fGeometry, params, 'thickness', {
                        min: 6,
                        max: 32,
                        step: 1,
                        label: 'Stroke Depth'
                    }).on('change', rebuildArtwork);

                    addControl(fGeometry, params, 'fiberCount', {
                        min: 80,
                        max: 420,
                        step: 10,
                        label: 'Bristle Density'
                    }).on('change', rebuildArtwork);

                    addControl(fGeometry, params, 'fiberRadius', {
                        min: 0.5,
                        max: 2.5,
                        step: 0.1,
                        label: 'Bristle Size'
                    }).on('change', rebuildArtwork);

                    addControl(fGeometry, params, 'waviness', {
                        min: 0.0,
                        max: 3.0,
                        step: 0.1,
                        label: 'Bristle Wiggle'
                    }).on('change', rebuildArtwork);

                    addControl(fGeometry, params, 'strayFibers', {
                        min: 0.0,
                        max: 0.35,
                        step: 0.01,
                        label: 'Stray Bristles'
                    }).on('change', rebuildArtwork);

                    addControl(fGeometry, params, 'startFlick', {
                        label: 'Top Brush Flick'
                    }).on('change', rebuildArtwork);

                    // 4. Material & Paint Surface Folder
                    const fMaterial = pane.addFolder({ title: '✨ Paint Luster & Finish', expanded: false });

                    addControl(fMaterial, params, 'shininess', {
                        min: 10,
                        max: 150,
                        step: 5,
                        label: 'Wet Gloss'
                    }).on('change', updateMaterials);

                    addControl(fMaterial, params, 'specularIntensity', {
                        min: 0.1,
                        max: 2.0,
                        step: 0.05,
                        label: 'Highlights'
                    }).on('change', updateMaterials);

                    addControl(fMaterial, params, 'fiberOpacity', {
                        min: 0.4,
                        max: 1.0,
                        step: 0.02,
                        label: 'Bristle Opacity'
                    }).on('change', updateMaterials);

                    addControl(fMaterial, params, 'underRibbonOpacity', {
                        min: 0.0,
                        max: 1.0,
                        step: 0.05,
                        label: 'Under-Body Fill'
                    }).on('change', updateMaterials);

                    // 5. Motion & Spin Controls
                    const fMotion = pane.addFolder({ title: '🌪️ Motion & Spin Dynamics', expanded: true });

                    addControl(fMotion, params, 'spinMode', {
                        label: 'Spin Direction',
                        options: {
                            'Downward': 'Downward',
                            'Paused': 'Paused',
                            'Upward': 'Upward',
                        }
                    }).on('change', () => {
                        needsRender = true;
                    });

                    addControl(fMotion, params, 'spinSpeed', {
                        min: 0.0,
                        max: 2.0,
                        step: 0.05,
                        label: 'Spin Velocity'
                    }).on('change', () => {
                        needsRender = true;
                    });

                    addControl(fMotion, params, 'floatingBob', {
                        label: 'Floating Bob'
                    }).on('change', () => {
                        needsRender = true;
                    });

                    // ── Rotate toggle (directly below Floating Bob) ──
                    addControl(fMotion, params, 'rotate', {
                        label: 'Rotate'
                    }).on('change', () => {
                        needsRender = true;
                    });

                    addControl(fMotion, params, 'bobAmplitude', {
                        min: 0.0,
                        max: 18.0,
                        step: 0.5,
                        label: 'Bob Amplitude'
                    }).on('change', () => {
                        needsRender = true;
                    });

                    addControl(fMotion, params, 'bobSpeed', {
                        min: 0.1,
                        max: 3.0,
                        step: 0.1,
                        label: 'Bob Speed'
                    }).on('change', () => {
                        needsRender = true;
                    });

                    // 6. Lighting & Canvas Background
                    const fEnvironment = pane.addFolder({ title: '💡 Lighting & Canvas', expanded: false });

                    addControl(fEnvironment, params, 'bgColor', {
                        label: 'Background'
                    }).on('change', updateBackground);

                    addControl(fEnvironment, params, 'paperGrain', {
                        label: 'Canvas Texture'
                    }).on('change', updateBackground);

                    addControl(fEnvironment, params, 'grainOpacity', {
                        min: 0.0,
                        max: 0.4,
                        step: 0.02,
                        label: 'Grain Opacity'
                    }).on('change', updateBackground);

                    addControl(fEnvironment, params, 'keyLightIntensity', {
                        min: 0.2,
                        max: 3.0,
                        step: 0.1,
                        label: 'Sun Key Light'
                    }).on('change', updateLighting);

                    addControl(fEnvironment, params, 'fillLightIntensity', {
                        min: 0.0,
                        max: 2.0,
                        step: 0.1,
                        label: 'Sky Fill Light'
                    }).on('change', updateLighting);

                    addControl(fEnvironment, params, 'rimLightIntensity', {
                        min: 0.0,
                        max: 2.0,
                        step: 0.1,
                        label: 'Rim Light'
                    }).on('change', updateLighting);

                    // 7. Action Buttons
                    const fActions = pane.addFolder({ title: '⚡ Quick Actions', expanded: true });

                    fActions.addButton({ title: '🎯 Recenter Camera' }).on('click', () => {
                        flyCameraTo(HOME_CAMERA_POS, HOME_TARGET, 1.0);
                    });

                    fActions.addButton({ title: '🎲 Randomize Palette & Form' }).on('click', () => {
                        const randomColor = () =>
                            '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');

                        params.c1 = randomColor();
                        params.c2 = randomColor();
                        params.c3 = randomColor();
                        params.c4 = randomColor();
                        params.c5 = randomColor();
                        params.c6 = randomColor();
                        params.c7 = randomColor();

                        params.turns = 2.8 + Math.random() * 1.6;
                        params.crestFold = 0.5 + Math.random() * 1.0;
                        params.width = 50 + Math.random() * 25;

                        pane.refresh();
                        scheduleRebuild(20);
                    });

                    fActions.addButton({ title: '📸 Save High-Res Artwork PNG' }).on('click', () => {
                        saveHighResArtworkPNG();
                    });

                    fActions.addButton({ title: '🔄 Reset' }).on('click', () => {
                        Object.assign(params, DEFAULT_PARAMS);
                        params.preset = 'Cobalt & Sunset Orange';
                        applyPreset(params.preset);

                        pivotGroup.rotation.x = BASE_PIVOT_ROT_X;
                        pivotGroup.rotation.y = BASE_PIVOT_ROT_Y;

                        flyCameraTo(HOME_CAMERA_POS, HOME_TARGET, 1.1);

                        pane.refresh();
                        updateBackground();
                        updateLighting();
                        updateMaterials();
                        scheduleRebuild(20);
                    });
                }
            } catch (e) {
                console.error('Tweakpane init warning:', e);
            }

            // ─── Main Animation Loop ──────────────────────────────────────────────────
            const clock = new THREE.Clock();

            let lastPivotY = pivotGroup.position.y;
            let lastPivotRotZ = pivotGroup.rotation.z;

            function animate() {
                requestAnimationFrame(animate);

                const dt = Math.min(clock.getDelta(), 0.05);
                let active = false;

                // 1. Smooth lighting transitions.
                const lightKeys = ['keyLightIntensity', 'fillLightIntensity', 'rimLightIntensity'];

                for (let i = 0; i < lightKeys.length; i++) {
                    const key = lightKeys[i];
                    const before = smooth[key];

                    smooth[key] = damp(before, params[key], 9, dt);

                    if (Math.abs(smooth[key] - params[key]) < 0.0005) {
                        smooth[key] = params[key];
                    }

                    if (smooth[key] !== before) active = true;
                }

                keyLight.intensity = smooth.keyLightIntensity;
                fillLight.intensity = smooth.fillLightIntensity;
                rimLight.intensity = smooth.rimLightIntensity;

                // 2. Smooth material transitions.
                const matKeys = ['shininess', 'specularIntensity', 'fiberOpacity', 'underRibbonOpacity'];
                let materialsChanged = false;

                for (let i = 0; i < matKeys.length; i++) {
                    const key = matKeys[i];
                    const before = smooth[key];

                    smooth[key] = damp(before, params[key], 10, dt);

                    if (Math.abs(smooth[key] - params[key]) < 0.0008) {
                        smooth[key] = params[key];
                    }

                    if (smooth[key] !== before) materialsChanged = true;
                }

                // 3. Cross-fade between old and new sculptures.
                const fadesActive = updateFades(dt);

                if (materialsChanged || fadesActive) {
                    applyAllMaterials();
                    active = true;
                }

                // 4. Smooth spin (Rotate checkbox + direction + velocity).
                const spinEnabled = params.rotate && params.spinMode !== 'Paused';
                const spinDirection = params.spinMode === 'Upward' ? -1 : 1;
                const targetSpin = spinEnabled ? spinDirection * params.spinSpeed : 0;

                smooth.spin = damp(smooth.spin, targetSpin, 4.5, dt);

                if (Math.abs(smooth.spin - targetSpin) < 0.0005) {
                    smooth.spin = targetSpin;
                }

                if (Math.abs(smooth.spin) > 0.00001) {
                    const step = smooth.spin * dt;

                    for (let i = 0; i < pivotGroup.children.length; i++) {
                        pivotGroup.children[i].rotation.y += step;
                    }

                    active = true;
                }

                // 5. Smooth floating bob (fades in/out, continuous phase).
                smooth.bobBlend = damp(smooth.bobBlend, params.floatingBob ? 1 : 0, 4.5, dt);

                if (Math.abs(smooth.bobBlend - (params.floatingBob ? 1 : 0)) < 0.0008) {
                    smooth.bobBlend = params.floatingBob ? 1 : 0;
                }

                bobPhase += dt * params.bobSpeed;
                tiltPhase += dt * 0.4;

                const bobAmount = Math.sin(bobPhase) * params.bobAmplitude * smooth.bobBlend;
                const tiltAmount = Math.sin(tiltPhase) * 0.025 * smooth.bobBlend;

                pivotGroup.position.y = BASE_PIVOT_Y + bobAmount;
                pivotGroup.rotation.z = BASE_PIVOT_ROT_Z + tiltAmount;

                if (
                    Math.abs(pivotGroup.position.y - lastPivotY) > 0.0005 ||
                    Math.abs(pivotGroup.rotation.z - lastPivotRotZ) > 0.00005
                ) {
                    active = true;
                }

                lastPivotY = pivotGroup.position.y;
                lastPivotRotZ = pivotGroup.rotation.z;

                // 6. Eased camera fly (Reset / Recenter).
                if (cameraFly) {
                    cameraFly.t += dt / cameraFly.duration;

                    const k = Math.min(1, cameraFly.t);
                    const eased = k < 0.5
                        ? 4 * k * k * k
                        : 1 - Math.pow(-2 * k + 2, 3) / 2;

                    camera.position.lerpVectors(cameraFly.fromPos, cameraFly.toPos, eased);

                    if (controls.target) {
                        controls.target.lerpVectors(cameraFly.fromTarget, cameraFly.toTarget, eased);
                    }

                    camera.lookAt(controls.target || cameraFly.toTarget);
                    active = true;

                    if (k >= 1) {
                        cameraFly = null;
                        if ('enabled' in controls) controls.enabled = true;
                    }
                }

                const controlsChanged = controls.update ? controls.update() : false;

                if (active || controlsChanged || needsRender) {
                    renderer.render(scene, camera);
                    needsRender = false;
                }
            }

            animate();

            // ─── Responsive Window Resize ─────────────────────────────────────────────
            let resizeFrame = null;

            window.addEventListener('resize', () => {
                if (resizeFrame !== null) {
                    cancelAnimationFrame(resizeFrame);
                }

                resizeFrame = requestAnimationFrame(() => {
                    resizeFrame = null;
                    resizeRenderer();
                });
            });

            document.addEventListener('visibilitychange', () => {
                clock.getDelta();
                needsRender = true;
            });

            renderer.domElement.addEventListener('webglcontextlost', event => {
                event.preventDefault();
                console.warn('WebGL context lost.');
            });

            renderer.domElement.addEventListener('webglcontextrestored', () => {
                console.warn('WebGL context restored. Rebuilding artwork.');
                scheduleRebuild(20);
            });
        })();
