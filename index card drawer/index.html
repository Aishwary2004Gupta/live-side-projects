<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Oil Paint Brush Stroke Spiral</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #ede3d2;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: radial-gradient(circle at 50% 48%, #f8f1e5 0%, #ece0cf 52%, #ddcfba 100%);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        canvas:active {
            cursor: grabbing;
        }

        .paper-grain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.16;
            mix-blend-mode: multiply;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .hint {
            position: absolute;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            color: #8f7d6a;
            font-size: 12px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-weight: 600;
            pointer-events: none;
            opacity: 0.65;
            transition: opacity 0.4s ease;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <div class="paper-grain"></div>
        <div class="hint" id="hint">Drag to inspect &bull; Scroll to zoom</div>
    </div>

    <!-- Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // ─── Scene & Camera Setup ─────────────────────────────────────────────────────
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 10, 3000);
        camera.position.set(0, 10, 620);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;
        container.appendChild(renderer.domElement);

        // ─── Orbit Controls ───────────────────────────────────────────────────────────
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.75;
        controls.minDistance = 220;
        controls.maxDistance = 1100;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.45;

        let userInteracting = false;
        controls.addEventListener('start', () => {
            userInteracting = true;
            controls.autoRotate = false;
            document.getElementById('hint').style.opacity = '0';
        });

        // ─── Rich Lighting for Saturated Oil Paint ────────────────────────────────────
        const ambientLight = new THREE.AmbientLight(0xfff5ea, 0.75);
        scene.add(ambientLight);

        // Top right key light (creates specular gloss along bristle ridges)
        const keyLight = new THREE.DirectionalLight(0xfffcf0, 1.55);
        keyLight.position.set(280, 420, 380);
        scene.add(keyLight);

        // Cool fill light from left
        const fillLight = new THREE.DirectionalLight(0x8cb0ff, 0.9);
        fillLight.position.set(-360, 60, 260);
        scene.add(fillLight);

        // Warm backlight / Rim light
        const rimLight = new THREE.DirectionalLight(0xff4477, 0.85);
        rimLight.position.set(60, -320, -320);
        scene.add(rimLight);

        // Soft internal warmth
        const innerLight = new THREE.PointLight(0xff7722, 0.9, 700);
        innerLight.position.set(0, 0, 0);
        scene.add(innerLight);

        // ─── Deterministic RNG ────────────────────────────────────────────────────────
        let seed = 884123;
        function rnd() {
            seed = (seed * 1664525 + 1013904223) & 0xffffffff;
            return (seed >>> 0) / 0xffffffff;
        }

        function rndRange(min, max) {
            return min + rnd() * (max - min);
        }

        // ─── Saturated Oil Pigment Palette ────────────────────────────────────────────
        // Royal Cobalt Blue -> Indigo -> Electric Violet -> Deep Magenta -> Ruby Crimson -> Flaming Orange -> Warm Amber -> Golden Ochre
        const PALETTE = [
            { pos: 0.00, color: new THREE.Color(0x102fe0) }, // Royal Cobalt Blue
            { pos: 0.14, color: new THREE.Color(0x1c4ef8) }, // Vivid Blue
            { pos: 0.28, color: new THREE.Color(0x4a18cb) }, // Deep Indigo Purple
            { pos: 0.42, color: new THREE.Color(0x840fb0) }, // Electric Violet
            { pos: 0.55, color: new THREE.Color(0xbf0a74) }, // Deep Magenta
            { pos: 0.68, color: new THREE.Color(0xdf113d) }, // Ruby Crimson Red
            { pos: 0.80, color: new THREE.Color(0xee3d0c) }, // Flaming Red-Orange
            { pos: 0.92, color: new THREE.Color(0xf4760a) }, // Warm Amber Orange
            { pos: 1.00, color: new THREE.Color(0xeaa014) }, // Golden Ochre
        ];

        function getPaintColor(t) {
            t = Math.max(0, Math.min(1, t));
            for (let i = 0; i < PALETTE.length - 1; i++) {
                if (t >= PALETTE[i].pos && t <= PALETTE[i + 1].pos) {
                    const localT = (t - PALETTE[i].pos) / (PALETTE[i + 1].pos - PALETTE[i].pos);
                    return PALETTE[i].color.clone().lerp(PALETTE[i + 1].color, localT);
                }
            }
            return PALETTE[PALETTE.length - 1].color.clone();
        }

        // ─── Mathematical Spine of the 3D Coiled Brush Stroke ─────────────────────────
        const SPHERE_R = 195;
        const TOTAL_TURNS = 3.15;

        function getSpineData(t) {
            const theta = t * TOTAL_TURNS * Math.PI * 2 + 1.65;

            // Latitude progression
            const lat = 1.05 - t * 2.10;
            const cosLat = Math.cos(lat);
            const sinLat = Math.sin(lat);

            // Ellipsoid radii
            const Rx = SPHERE_R * (1.0 + 0.06 * Math.sin(theta * 0.5));
            const Ry = SPHERE_R * 1.06;
            const Rz = SPHERE_R * (1.0 + 0.05 * Math.cos(theta * 0.5));

            let x = Rx * cosLat * Math.cos(theta);
            let y = Ry * sinLat;
            let z = Rz * cosLat * Math.sin(theta);

            // Smooth brush flick lead-in at top-left
            if (t < 0.08) {
                const tail = Math.pow(1 - t / 0.08, 1.5);
                x -= tail * 35;
                y += tail * 30;
                z -= tail * 15;
            }

            const sphereNorm = new THREE.Vector3(x / Rx, y / Ry, z / Rz).normalize();

            return {
                pos: new THREE.Vector3(x, y, z),
                sphereNorm: sphereNorm
            };
        }

        // ─── Build High-Fidelity 3D Brush Artwork ─────────────────────────────────────
        function buildBrushStroke() {
            const masterGroup = new THREE.Group();

            const SPINE_SAMPLES = 360;
            const spineData = [];
            const spinePoints = [];

            for (let i = 0; i <= SPINE_SAMPLES; i++) {
                const data = getSpineData(i / SPINE_SAMPLES);
                spineData.push(data);
                spinePoints.push(data.pos);
            }

            const spineCurve = new THREE.CatmullRomCurve3(spinePoints, false, 'centripetal', 0.45);

            // Precompute smooth Frenet reference frames
            const spineFrames = [];
            for (let i = 0; i <= SPINE_SAMPLES; i++) {
                const t = i / SPINE_SAMPLES;
                const pt = spinePoints[i];
                const tangent = spineCurve.getTangentAt(t).normalize();
                const sphereNorm = spineData[i].sphereNorm;

                // Binormal is across the wide brush ribbon
                const binormal = new THREE.Vector3().crossVectors(tangent, sphereNorm).normalize();
                // Normal is perpendicular to the ribbon face
                const normal = new THREE.Vector3().crossVectors(binormal, tangent).normalize();

                spineFrames.push({ pt, tangent, normal, binormal });
            }

            function getFrameAt(t) {
                const idxFloat = t * SPINE_SAMPLES;
                const idx = Math.min(Math.floor(idxFloat), SPINE_SAMPLES - 1);
                const frac = idxFloat - idx;
                const f1 = spineFrames[idx];
                const f2 = spineFrames[idx + 1] || f1;

                return {
                    pt: f1.pt.clone().lerp(f2.pt, frac),
                    tangent: f1.tangent.clone().lerp(f2.tangent, frac).normalize(),
                    normal: f1.normal.clone().lerp(f2.normal, frac).normalize(),
                    binormal: f1.binormal.clone().lerp(f2.binormal, frac).normalize(),
                };
            }

            // Bold wide ribbon profile (54 to 84 units)
            function getWidth(t) {
                if (t < 0.08) {
                    return 30 + (t / 0.08) * 36;
                }
                const taper = Math.sin(t * Math.PI);
                return 54 + taper * 30; // 54 to 84 units wide
            }

            // Ribbon thickness
            function getThickness(t) {
                return 16 + Math.sin(t * Math.PI) * 12;
            }

            // ── 1. Volumetric Under-Ribbon Paint Body Layers ────────────────────────
            const NUM_LAYERS = 4;
            const RIBBON_SEGS = 280;

            for (let l = 0; l < NUM_LAYERS; l++) {
                const ribbonGeom = new THREE.PlaneGeometry(1, 1, 20, RIBBON_SEGS);
                const posAttr = ribbonGeom.attributes.position;
                const colAttr = new Float32Array(posAttr.count * 3);

                const layerH = (l - 1.5) * 4.2;
                const widthScale = 0.95 - l * 0.04;

                for (let r = 0; r <= RIBBON_SEGS; r++) {
                    const t = r / RIBBON_SEGS;
                    const frame = getFrameAt(t);
                    const w = getWidth(t) * widthScale;

                    for (let c = 0; c <= 20; c++) {
                        const vIdx = r * 21 + c;
                        const u = (c / 20) * 2 - 1; // [-1, 1] across width

                        const vx = frame.pt.x + frame.binormal.x * (u * w * 0.5) + frame.normal.x * layerH;
                        const vy = frame.pt.y + frame.binormal.y * (u * w * 0.5) + frame.normal.y * layerH;
                        const vz = frame.pt.z + frame.binormal.z * (u * w * 0.5) + frame.normal.z * layerH;

                        posAttr.setXYZ(vIdx, vx, vy, vz);

                        // Gradient: Royal Blue on outer top rim (u = 1) -> Magenta -> Amber Orange (u = -1)
                        const colorT = (1 - u) * 0.5;
                        const color = getPaintColor(colorT);
                        colAttr[vIdx * 3] = color.r;
                        colAttr[vIdx * 3 + 1] = color.g;
                        colAttr[vIdx * 3 + 2] = color.b;
                    }
                }

                ribbonGeom.setAttribute('color', new THREE.BufferAttribute(colAttr, 3));
                ribbonGeom.computeVertexNormals();

                const ribbonMat = new THREE.MeshPhongMaterial({
                    vertexColors: true,
                    specular: new THREE.Color(0xffffff),
                    shininess: 85,
                    transparent: true,
                    opacity: 0.75,
                    side: THREE.DoubleSide,
                    depthWrite: false
                });

                masterGroup.add(new THREE.Mesh(ribbonGeom, ribbonMat));
            }

            // ── 2. Dense Individual Bristle Strands (380 Bristles) ───────────────────
            const NUM_BRISTLES = 380;
            const BRISTLE_SEGS = 200;

            for (let bi = 0; bi < NUM_BRISTLES; bi++) {
                const uNorm = (bi / (NUM_BRISTLES - 1)) * 2 - 1; // [-1 to 1]

                // Cross-sectional distribution
                const uOffset = Math.sign(uNorm) * Math.pow(Math.abs(uNorm), 0.90) + rndRange(-0.02, 0.02);
                const vOffset = rndRange(-0.48, 0.48) * Math.sqrt(1 - Math.min(1, Math.abs(uOffset) * 0.85));

                // Pigment streak mapping: Blue on outer edge, Orange on inner edge
                let colT = (1 - uOffset) * 0.5;
                colT = Math.max(0, Math.min(1, colT + rndRange(-0.05, 0.05)));
                const bristleColor = getPaintColor(colT);

                // Rich brightness & oil paint luster
                const brightness = rndRange(0.88, 1.32);
                bristleColor.multiplyScalar(brightness);

                // Stray bristle characteristics
                const isStray = rnd() > 0.88;
                const spread = isStray ? rndRange(1.08, 1.35) : 1.0;

                // Natural frayed bristle start/end
                const startT = (bi < 50 || rnd() > 0.80) ? rndRange(0.0, 0.05) : 0.0;
                const endT = (bi > NUM_BRISTLES - 50 || rnd() > 0.82) ? rndRange(0.95, 1.0) : 1.0;

                // Micro waviness
                const waveFreq = rndRange(3, 8);
                const wavePhase = rndRange(0, Math.PI * 2);
                const waveAmp = rndRange(0.6, 2.4);

                const points = [];
                const steps = Math.floor(BRISTLE_SEGS * (endT - startT));

                for (let si = 0; si <= steps; si++) {
                    const localT = si / steps;
                    const t = startT + localT * (endT - startT);
                    const frame = getFrameAt(t);

                    const w = getWidth(t) * spread;
                    const th = getThickness(t) * spread;

                    const wave = Math.sin(t * Math.PI * waveFreq + wavePhase) * waveAmp;

                    // Smooth bristle fanning at the top brush flick
                    let fanning = 1.0;
                    if (t < 0.08) {
                        fanning = 1.0 + Math.pow(1 - t / 0.08, 1.5) * 0.45 * (uOffset);
                    }

                    let px = frame.pt.x + frame.binormal.x * (uOffset * w * 0.5 * fanning + wave) + frame.normal.x * (vOffset * th * 0.5);
                    let py = frame.pt.y + frame.binormal.y * (uOffset * w * 0.5 * fanning + wave) + frame.normal.y * (vOffset * th * 0.5);
                    let pz = frame.pt.z + frame.binormal.z * (uOffset * w * 0.5 * fanning + wave) + frame.normal.z * (vOffset * th * 0.5);

                    points.push(new THREE.Vector3(px, py, pz));
                }

                if (points.length > 3) {
                    const curve = new THREE.CatmullRomCurve3(points, false, 'centripetal', 0.4);
                    const radius = isStray ? rndRange(0.55, 0.95) : rndRange(0.90, 1.95);
                    const geom = new THREE.TubeGeometry(curve, Math.floor(steps * 1.35), radius, 6, false);

                    const opacity = isStray ? rndRange(0.55, 0.78) : rndRange(0.82, 0.98);
                    const specular = bristleColor.clone().lerp(new THREE.Color(0xffffff), 0.70);

                    const mat = new THREE.MeshPhongMaterial({
                        color: bristleColor,
                        specular: specular,
                        shininess: rndRange(60, 120),
                        transparent: true,
                        opacity: opacity,
                        depthWrite: opacity > 0.88,
                        side: THREE.FrontSide
                    });

                    masterGroup.add(new THREE.Mesh(geom, mat));
                }
            }

            return masterGroup;
        }

        // ─── Assemble & Position Artwork ──────────────────────────────────────────────
        seed = 884123;
        const brushArt = buildBrushStroke();

        // Exact 3D tilt matching reference image perspective
        brushArt.position.set(0, -12, 0);
        brushArt.rotation.x = 0.52;
        brushArt.rotation.y = -0.40;
        brushArt.rotation.z = -0.24;
        scene.add(brushArt);

        // ─── Animation Loop ───────────────────────────────────────────────────────────
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsed = clock.getElapsedTime();

            if (!userInteracting) {
                // Subtle organic floating motion
                brushArt.rotation.y = -0.44 + Math.sin(elapsed * 0.38) * 0.08;
                brushArt.rotation.x = 0.56 + Math.cos(elapsed * 0.28) * 0.05;
                brushArt.rotation.z = -0.26 + Math.sin(elapsed * 0.22) * 0.04;
                brushArt.position.y = Math.sin(elapsed * 0.7) * 5;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // ─── Window Resize Handler ───────────────────────────────────────────────────
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
    </script>
</body>
</html>
