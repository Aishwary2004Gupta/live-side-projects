<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sam's Secret Files</title>

  <style>
    :root {
      --background: #dddddd;
      --folder: #e4e4e4;
      --folder-dark: #d0d0d0;
      --ink: #111111;
      --tray-height: clamp(112px, 18vh, 170px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--background);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    button {
      font: inherit;
    }

    .archive {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 500px;
      overflow: hidden;
      background: var(--background);
      isolation: isolate;
    }

    /*
      The file stack fills the area above the drawer.
      JavaScript calculates the row spacing so all files remain visible.
    */
    .stack {
      position: absolute;
      top: 4.5vh;
      left: 7%;
      right: 7%;
      bottom: calc(var(--tray-height) - 1px);
      z-index: 10;
      overflow: visible;
    }

    .stack::before,
    .stack::after {
      content: "";
      position: absolute;
      top: 4px;
      bottom: 0;
      width: 1.5px;
      background: var(--ink);
      opacity: 0.9;
      pointer-events: none;
      z-index: 1500;
    }

    .stack::before {
      left: 0;
      transform: skewX(-2deg);
    }

    .stack::after {
      right: 0;
      transform: skewX(2deg);
    }

    /*
      Each file is a full-width folder shape.
      Only its visible tab is interactive.
    */
    .file {
      position: absolute;
      left: 0;
      right: 0;
      height: var(--folder-height);
      pointer-events: none;
      transition: opacity 220ms ease;
    }

    .folder-art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .folder-art path {
      fill: var(--folder);
      stroke: var(--ink);
      stroke-width: 1.45;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    /*
      The raised file label.
    */
    .file-tab {
      position: absolute;
      top: -1px;
      height: calc(100% - 3px);
      border: 0;
      padding: 5px 15px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      color: var(--ink);
      background: var(--folder);
      cursor: pointer;
      pointer-events: auto;
      z-index: 2000;
      clip-path: polygon(
        7% 0%,
        91% 0%,
        100% 100%,
        0% 100%
      );
      transition:
        opacity 180ms ease,
        transform 180ms ease,
        background 180ms ease;
    }

    .file-tab:hover,
    .file-tab:focus-visible {
      background: #eeeeee;
      outline: none;
      transform: translateY(-3px);
    }

    .file-tab.left {
      left: 32%;
      width: 31%;
    }

    .file-tab.right {
      left: 61%;
      width: 29%;
    }

    .file-tab.far-left {
      left: 10%;
      width: 25%;
    }

    .file-tab span {
      white-space: nowrap;
      font-size: clamp(9px, 1.45vw, 16px);
      line-height: 1.2;
    }

    .file-tab .number {
      font-weight: 500;
    }

    .file-tab .name {
      font-weight: 600;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /*
      Active file disappears from its original position while
      its duplicate tab appears attached to the opened panel.
    */
    .archive.is-open .file.is-active .file-tab,
    .archive.is-closing .file.is-active .file-tab {
      opacity: 0;
      pointer-events: none;
    }

    /*
      Black section markers: O 010, P 012, Q 005, etc.
    */
    .marker {
      position: absolute;
      height: var(--folder-height);
      pointer-events: none;
      z-index: 2100;
    }

    .marker-button {
      position: absolute;
      top: -2px;
      left: 0;
      width: 100%;
      height: 78%;
      border: 0;
      padding: 6px 15px 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      color: white;
      background: #050505;
      cursor: pointer;
      pointer-events: auto;
      clip-path: polygon(
        12% 0,
        88% 0,
        100% 100%,
        0 100%
      );
      transition: transform 180ms ease, background 180ms ease;
    }

    .marker-button:hover,
    .marker-button:focus-visible {
      background: #252525;
      transform: translateY(-3px);
      outline: none;
    }

    .marker-button span {
      font-size: clamp(9px, 1.45vw, 16px);
      line-height: 1.2;
    }

    .marker-o {
      left: 9%;
      width: 25%;
    }

    .marker-p {
      left: 34%;
      width: 25%;
    }

    .marker-q {
      left: 54%;
      width: 25%;
    }

    .marker-r {
      left: 17%;
      width: 25%;
    }

    .marker-s {
      left: 4%;
      width: 25%;
    }

    /*
      Open detail panel.
      Its height changes slightly depending on the selected file,
      similar to the reference animation.
    */
    .detail-panel {
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: calc(var(--tray-height) - 1px);
      height: min(
        var(--detail-height, 64vh),
        calc(100% - var(--tray-height) - 18px)
      );
      z-index: 5000;
      visibility: hidden;
      transform: translateY(115%);
      transition:
        transform 700ms cubic-bezier(0.2, 0.85, 0.25, 1),
        visibility 0s linear 700ms;
      pointer-events: none;
    }

    .detail-panel.is-visible {
      visibility: visible;
      pointer-events: auto;
    }

    .archive.is-open .detail-panel.is-visible {
      transform: translateY(0);
      transition:
        transform 700ms cubic-bezier(0.2, 0.85, 0.25, 1),
        visibility 0s linear 0s;
    }

    .detail-surface {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border: 1.5px solid var(--ink);
      border-radius: 9px 9px 0 0;
      background: #e3e3e3;
    }

    .detail-content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: 28px 24px 14px;
    }

    .detail-heading {
      position: relative;
      z-index: 2;
      flex: 0 0 auto;
    }

    .detail-heading h1 {
      margin: 0;
      font-size: clamp(15px, 1.7vw, 19px);
      font-weight: 700;
      line-height: 1.1;
    }

    .detail-heading p {
      margin: 4px 0 0;
      color: #a2a2a2;
      font-size: clamp(14px, 1.5vw, 17px);
    }

    .detail-media {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 5% 8px;
    }

    .detail-media img {
      display: block;
      max-width: 78%;
      max-height: 100%;
      object-fit: contain;
      mix-blend-mode: multiply;
      user-select: none;
      -webkit-user-drag: none;
    }

    /*
      Used when a file does not have an external image.
    */
    .fallback-media {
      position: relative;
      width: min(420px, 75%);
      height: min(270px, 68%);
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid #999;
      background:
        linear-gradient(
          135deg,
          rgba(0, 0, 0, 0.08) 25%,
          transparent 25%
        ) 0 0 / 26px 26px,
        linear-gradient(
          315deg,
          rgba(0, 0, 0, 0.06) 25%,
          transparent 25%
        ) 0 0 / 26px 26px,
        #d5d5d5;
    }

    .fallback-media strong {
      max-width: 80%;
      text-align: center;
      font-size: clamp(18px, 3vw, 34px);
      text-transform: lowercase;
      font-weight: 500;
    }

    .fallback-media small {
      position: absolute;
      left: 15px;
      bottom: 12px;
      font-size: 11px;
      color: #777;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /*
      Tab attached to the open detail card.
    */
    .detail-tab {
      position: absolute;
      top: -31px;
      left: 32%;
      width: 31%;
      height: 38px;
      z-index: 4;
      border: 1.5px solid var(--ink);
      border-bottom: 0;
      border-radius: 13px 13px 0 0;
      padding: 7px 16px 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      color: var(--ink);
      background: var(--folder);
      cursor: pointer;
      opacity: 0;
      transform: translateY(12px);
      transition:
        opacity 250ms ease 180ms,
        transform 450ms cubic-bezier(0.2, 0.85, 0.25, 1) 180ms;
    }

    .archive.is-open .detail-tab {
      opacity: 1;
      transform: translateY(0);
    }

    .detail-tab.right {
      left: 61%;
      width: 29%;
    }

    .detail-tab.far-left {
      left: 10%;
      width: 25%;
    }

    .detail-tab span {
      white-space: nowrap;
      font-size: clamp(9px, 1.45vw, 16px);
      line-height: 1.2;
    }

    .detail-tab .tab-name {
      font-weight: 600;
      text-align: right;
    }

    .detail-close {
      position: absolute;
      top: 12px;
      right: 14px;
      z-index: 10;
      width: 27px;
      height: 27px;
      border: 1px solid transparent;
      border-radius: 50%;
      color: #555;
      background: transparent;
      font-size: 22px;
      line-height: 20px;
      cursor: pointer;
    }

    .detail-close:hover,
    .detail-close:focus-visible {
      color: #111;
      border-color: #777;
      outline: none;
    }

    /*
      Drawer/tray at the bottom.
    */
    .tray {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--tray-height);
      z-index: 300;
      border-top: 1.5px solid var(--ink);
      background:
        linear-gradient(
          to bottom,
          #c9c9c9 0%,
          #9d9d9d 23%,
          #353535 72%,
          #111111 100%
        );
      clip-path: polygon(
        0 0,
        100% 0,
        96% 100%,
        4% 100%
      );
    }

    .tray::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 11px;
      height: 1px;
      background: var(--ink);
    }

    .tray::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 22px;
      height: 1px;
      background: rgba(17, 17, 17, 0.75);
    }

    .tray-label {
      position: absolute;
      left: 50%;
      bottom: clamp(12px, 2vh, 22px);
      transform: translateX(-50%);
      min-width: 155px;
      padding: 7px 20px 6px;
      border: 1.5px solid #222;
      border-radius: 6px;
      background: #9a9b3d;
      color: #151515;
      text-align: center;
      font-size: clamp(12px, 1.5vw, 17px);
      font-weight: 600;
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
    }

    @media (max-width: 650px) {
      .stack {
        left: 3%;
        right: 3%;
        top: 3vh;
      }

      .detail-panel {
        left: 4%;
        right: 4%;
      }

      .detail-content {
        padding-left: 15px;
        padding-right: 15px;
      }

      .file-tab,
      .detail-tab {
        padding-left: 8px;
        padding-right: 8px;
        gap: 4px;
      }

      .detail-media img {
        max-width: 92%;
      }
    }
  </style>
</head>

<body>
  <main class="archive" id="archive">
    <section class="stack" id="stack" aria-label="Secret files"></section>

    <section
      class="detail-panel"
      id="detailPanel"
      aria-hidden="true"
    >
      <div class="detail-surface">
        <div class="detail-content">
          <div class="detail-heading">
            <h1 id="detailTitle">file</h1>
            <p>details</p>
          </div>

          <div class="detail-media" id="detailMedia"></div>
        </div>
      </div>

      <button
        class="detail-tab"
        id="detailTab"
        type="button"
        aria-label="Close opened file"
      >
        <span id="detailNumber">00</span>
        <span class="tab-name" id="detailName">file</span>
      </button>

      <button
        class="detail-close"
        id="detailClose"
        type="button"
        aria-label="Close file"
      >
        ×
      </button>
    </section>

    <footer class="tray">
      <div class="tray-label">sam's secret files</div>
    </footer>
  </main>

    const fileElements = [];
    const markerElements = [];

    function createFolderSvg(side) {
      const svg = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "svg"
      );

      svg.setAttribute("class", "folder-art");
      svg.setAttribute("viewBox", "0 -14 1000 70");
      svg.setAttribute("preserveAspectRatio", "none");
      svg.setAttribute("aria-hidden", "true");

      const path = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "path"
      );

      path.setAttribute("d", folderPaths[side]);
      svg.appendChild(path);

      return svg;
    }

    function createFile(file, index) {
      const element = document.createElement("div");
      element.className = "file";
      element.dataset.id = file.id;
      element.dataset.index = index;

      element.appendChild(createFolderSvg(file.side));

      const tab = document.createElement("button");
      tab.type = "button";
      tab.className = `file-tab ${file.side}`;
      tab.setAttribute(
        "aria-label",
        `Open file ${file.number}, ${file.name}`
      );

      const number = document.createElement("span");
      number.className = "number";
      number.textContent = file.number;

      const name = document.createElement("span");
      name.className = "name";
      name.textContent = file.name;

      tab.append(number, name);

      tab.addEventListener("click", (event) => {
        event.stopPropagation();
        openFile(file, element);
      });

      element.appendChild(tab);
      stack.appendChild(element);
      fileElements.push(element);
    }

    function createMarker(marker) {
      const element = document.createElement("div");
      element.className = `marker ${marker.position}`;
      element.dataset.id = marker.id;
      element.dataset.row = marker.row;

      const button = document.createElement("button");
      button.type = "button";
      button.className = "marker-button";
      button.setAttribute(
        "aria-label",
        `Open ${marker.letter} ${marker.code}`
      );

      const letter = document.createElement("span");
      letter.textContent = marker.letter;

      const code = document.createElement("span");
      code.textContent = marker.code;

      button.append(letter, code);

      button.addEventListener("click", (event) => {
        event.stopPropagation();
        openFile(
          {
            id: marker.id,
            number: marker.letter,
            name: marker.code,
            detail: marker.detail,
            side: "left",
            marker: true,
            height: "57vh"
          },
          element
        );
      });

      element.appendChild(button);
      stack.appendChild(element);
      markerElements.push(element);
    }

    files.forEach(createFile);
    markers.forEach(createMarker);

    /*
      Fits all rows into the visible stack without creating a scrollbar.
    */
    function resizeStack() {
      const totalRows = files.length;
      const stackHeight = stack.clientHeight;

      const step = Math.min(
        24,
        Math.max(11, (stackHeight - 27) / (totalRows - 1))
      );

      const folderHeight = Math.max(
        26,
        Math.min(45, step * 1.88)
      );

      stack.style.setProperty("--step", `${step}px`);
      stack.style.setProperty("--folder-height", `${folderHeight}px`);

      fileElements.forEach((element, index) => {
        const bottom = (totalRows - 1 - index) * step;
        element.style.bottom = `${bottom}px`;
      });

      markerElements.forEach((element) => {
        const row = Number(element.dataset.row);
        const bottom = (totalRows - 1 - row) * step;
        element.style.bottom = `${bottom}px`;
      });
    }

    const resizeObserver = new ResizeObserver(resizeStack);
    resizeObserver.observe(stack);
    window.addEventListener("resize", resizeStack);

    let activeElement = null;
    let activeFile = null;
    let closingTimer = null;

    function createFallback(file) {
      const fallback = document.createElement("div");
      fallback.className = "fallback-media";

      const title = document.createElement("strong");
      title.textContent = file.detail || file.name;

      const small = document.createElement("small");
      small.textContent = `${file.number} / archive record`;

      fallback.append(title, small);
      return fallback;
    }

    function loadMedia(file) {
      detailMedia.innerHTML = "";

      if (!file.image) {
        detailMedia.appendChild(createFallback(file));
        return;
      }

      const image = document.createElement("img");
      image.alt = file.detail || file.name;
      image.src = file.image;

      image.addEventListener("error", () => {
        detailMedia.innerHTML = "";
        detailMedia.appendChild(createFallback(file));
      });

      detailMedia.appendChild(image);
    }

    function setPanelSide(side) {
      detailTab.classList.remove("right", "far-left");

      if (side === "right") {
        detailTab.classList.add("right");
      }

      if (side === "far-left") {
        detailTab.classList.add("far-left");
      }
    }

    function openFile(file, element) {
      clearTimeout(closingTimer);

      if (activeElement) {
        activeElement.classList.remove("is-active");
      }

      activeElement = element;
      activeFile = file;

      if (activeElement) {
        activeElement.classList.add("is-active");
      }

      detailTitle.textContent = file.detail || file.name;
      detailNumber.textContent = file.number;
      detailName.textContent = file.name;
      setPanelSide(file.side);
      loadMedia(file);

      detailPanel.style.setProperty(
        "--detail-height",
        file.height || "64vh"
      );

      detailPanel.classList.add("is-visible");
      detailPanel.setAttribute("aria-hidden", "false");

      requestAnimationFrame(() => {
        archive.classList.remove("is-closing");
        archive.classList.add("is-open");
      });
    }

    function closeFile() {
      if (!activeFile) return;

      archive.classList.remove("is-open");
      archive.classList.add("is-closing");

      closingTimer = setTimeout(() => {
        detailPanel.classList.remove("is-visible");
        detailPanel.setAttribute("aria-hidden", "true");

        if (activeElement) {
          activeElement.classList.remove("is-active");
        }

        activeElement = null;
        activeFile = null;
        archive.classList.remove("is-closing");
      }, 720);
    }

    detailClose.addEventListener("click", closeFile);
    detailTab.addEventListener("click", closeFile);

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeFile();
      }
    });

    resizeStack();
  </script>
</body>
</html>
