<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Oil Paint Brush Sculpture Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #C4BDBC;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: radial-gradient(circle at 50% 48%, #D8D2D0 0%, #C4BDBC 52%, #B4ACAB 100%);
            transition: background 0.4s ease;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
            touch-action: none;
        }

        canvas:active {
            cursor: grabbing;
        }

        .paper-grain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.15;
            mix-blend-mode: multiply;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            transition: opacity 0.3s ease;
        }

        .hint {
            position: absolute;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            color: #8f7d6a;
            font-size: 12px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-weight: 600;
            pointer-events: none;
            opacity: 0.65;
            transition: opacity 0.4s ease, color 0.3s ease;
            z-index: 10;
        }

        .tp-dfwv {
            position: fixed !important;
            top: 14px !important;
            right: 14px !important;
            width: 320px !important;
            max-height: calc(100vh - 28px) !important;
            overflow-y: auto !important;
            border-radius: 12px !important;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.22), 0 2px 8px rgba(0, 0, 0, 0.12) !important;
            z-index: 9999 !important;
        }

        .tp-dfwv::-webkit-scrollbar {
            width: 5px;
        }

        .tp-dfwv::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.25);
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div id="canvas-container">
        <div class="paper-grain" id="paperGrain"></div>
        <div class="hint" id="hint">Drag to inspect &bull; Scroll to zoom</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tweakpane@3.1.10/dist/tweakpane.min.js"></script>

    <script>
        (() => {
            'use strict';

            if (!window.THREE) {
                console.error('Three.js did not load.');
                return;
            }

            const PRESETS = {
                'Cobalt & Sunset Orange': {
                    shape: 'Spherical Coil',
                    colors: ['#102fe0', '#2a55f5', '#8a10b2', '#de1245', '#ee400e', '#f5780a', '#e89e18'],
                    bgClear: '#C4BDBC',
                    turns: 4.50,
                    crestFold: 0.5,
                    width: 68,
                    fiberCount: 340,
                    shininess: 85
                },
                'Lavender & Ocean Blue': {
                    shape: 'Spherical Coil',
                    colors: ['#a96bff', '#c495ff', '#e8d8ff', '#8e4bf2', '#3a4fe8', '#1b2ad4', '#0d1896'],
                    bgClear: '#ede2d6',
                    turns: 4.30,
                    crestFold: 0.6,
                    width: 70,
                    fiberCount: 350,
                    shininess: 95
                },
                'Cyberpunk Neon': {
                    shape: 'Spherical Coil',
                    colors: ['#00f5d4', '#00bbf9', '#7b2cbf', '#9d4edd', '#f72585', '#7209b7', '#3a0ca3'],
                    bgClear: '#12111d',
                    turns: 4.40,
                    crestFold: 0.4,
                    width: 66,
                    fiberCount: 320,
                    shininess: 120
                },
                'Sunset Ember & Gold': {
                    shape: 'Spherical Coil',
                    colors: ['#590d22', '#800f2f', '#a4133c', '#c9184a', '#ff4d6d', '#ff758f', '#ffb703', '#fb8500'],
                    bgClear: '#ebded6',
                    turns: 4.20,
                    crestFold: 0.3,
                    width: 68,
                    fiberCount: 330,
                    shininess: 90
                },
                'Emerald & Aureolin': {
                    shape: 'Spherical Coil',
                    colors: ['#081c15', '#1b4332', '#2d6a4f', '#40916c', '#52b788', '#74c69d', '#ffd166', '#f77f00'],
                    bgClear: '#e2ece0',
                    turns: 4.30,
                    crestFold: 0.5,
                    width: 64,
                    fiberCount: 320,
                    shininess: 85
                },
                'Midnight Pearl & Silver': {
                    shape: 'Spherical Coil',
                    colors: ['#0b132b', '#1c2541', '#3a506b', '#5bc0be', '#6fffe9', '#e0fbfc', '#ffffff'],
                    bgClear: '#141a24',
                    turns: 4.30,
                    crestFold: 0.4,
                    width: 62,
                    fiberCount: 320,
                    shininess: 110
                },
                'Classic Rainbow Spectrum': {
                    shape: 'Spherical Coil',
                    colors: ['#0f2be0', '#1c4ff8', '#4b1bcb', '#820fb0', '#bf0a74', '#df113d', '#ee3d0c', '#f4760a', '#eaa014'],
                    bgClear: '#ede3d2',
                    turns: 4.35,
                    crestFold: 0.2,
                    width: 62,
                    fiberCount: 340,
                    shininess: 85
                }
            };

            const DEFAULT_PARAMS = {
                preset: 'Cobalt & Sunset Orange',
                shape: 'Spherical Coil',

                c1: '#102fe0',
                c2: '#2a55f5',
                c3: '#8a10b2',
                c4: '#de1245',
                c5: '#ee400e',
                c6: '#f5780a',
                c7: '#e89e18',
                invertPalette: false,
                colorJitter: 0.05,

                sphereRadius: 220,
                turns: 4.50,
                crestFold: 0.5,
                width: 68,
                thickness: 14,
                fiberCount: 340,
                fiberRadius: 1.15,
                waviness: 0.8,
                strayFibers: 0.10,
                startFlick: false,

                shininess: 85,
                specularIntensity: 0.75,
                fiberOpacity: 0.88,
                underRibbonOpacity: 0.72,

                spinMode: 'Downward',
                spinSpeed: 0.35,

                /* Separate clockwise rotation toggle — false by default */
                rotateClockwise: false,

                floatingBob: true,
                bobAmplitude: 2.0,
                bobSpeed: 0.6,

                keyLightIntensity: 1.55,
                fillLightIntensity: 0.90,
                rimLightIntensity: 0.85,
                bgColor: '#C4BDBC',
                paperGrain: true,
                grainOpacity: 0.15
            };

            const params = { ...DEFAULT_PARAMS };

            /*
             * Spin uses params.spinSpeed only.
             * Clockwise rotation uses this fixed speed only.
             * They are deliberately independent.
             */
            const CLOCKWISE_ROTATE_SPEED = 0.25;
            const CLOCKWISE_RETURN_SPEED = 7.5;

            const container = document.getElementById('canvas-container');
            const paperGrainEl = document.getElementById('paperGrain');
            const hintEl = document.getElementById('hint');

            const scene = new THREE.Scene();

            const camera = new THREE.PerspectiveCamera(
                42,
                window.innerWidth / window.innerHeight,
                10,
                3000
            );

            camera.position.set(0, 25, 680);

            const renderer = new THREE.WebGLRenderer({
                antialias: true,
                alpha: true,
                powerPreference: 'high-performance',
                preserveDrawingBuffer: false
            });

            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.15;
            renderer.setClearColor(0x000000, 0);
            container.appendChild(renderer.domElement);

            let needsRender = true;

            function getSafePixelRatio() {
                const dpr = window.devicePixelRatio || 1;
                const isTouch = window.matchMedia &&
                    window.matchMedia('(pointer: coarse)').matches;

                const lowCoreDevice =
                    (navigator.hardwareConcurrency || 8) <= 4;

                const maxRatio =
                    (isTouch || lowCoreDevice) ? 1.25 : 2;

                const width = Math.max(1, window.innerWidth);
                const height = Math.max(1, window.innerHeight);
                const maxPixels = 5200000;
                const budgetRatio = Math.sqrt(maxPixels / (width * height));

                return Math.max(0.75, Math.min(dpr, maxRatio, budgetRatio));
            }

            function resizeRenderer() {
                const width = Math.max(1, window.innerWidth);
                const height = Math.max(1, window.innerHeight);

                renderer.setPixelRatio(getSafePixelRatio());
                renderer.setSize(width, height, false);

                camera.aspect = width / height;
                camera.updateProjectionMatrix();

                needsRender = true;
            }

            resizeRenderer();

            let controls;

            if (THREE.OrbitControls) {
                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
                controls.rotateSpeed = 0.75;
                controls.minDistance = 200;
                controls.maxDistance = 1200;
                controls.autoRotate = false;

                controls.addEventListener('start', () => {
                    hintEl.style.opacity = '0';
                });

                controls.addEventListener('change', () => {
                    needsRender = true;
                });
            } else {
                controls = {
                    update: () => false,
                    reset: () => {}
                };

                console.error('OrbitControls did not load.');
            }

            const ambientLight = new THREE.AmbientLight(0xfff5ea, 0.75);
            scene.add(ambientLight);

            const keyLight = new THREE.DirectionalLight(
                0xfffcf0,
                params.keyLightIntensity
            );
            keyLight.position.set(280, 420, 380);
            scene.add(keyLight);

            const fillLight = new THREE.DirectionalLight(
                0x8cb0ff,
                params.fillLightIntensity
            );
            fillLight.position.set(-360, 60, 260);
            scene.add(fillLight);

            const rimLight = new THREE.DirectionalLight(
                0xff4477,
                params.rimLightIntensity
            );
            rimLight.position.set(60, -320, -320);
            scene.add(rimLight);

            const innerLight = new THREE.PointLight(0xff7722, 0.8, 700);
            innerLight.position.set(0, 0, 0);
            scene.add(innerLight);

            function setPaletteFromColors(colors) {
                const slots = 7;

                for (let i = 0; i < slots; i++) {
                    const position = (i / (slots - 1)) * (colors.length - 1);
                    const lower = Math.floor(position);
                    const upper = Math.min(colors.length - 1, lower + 1);
                    const mix = position - lower;

                    const color = new THREE.Color(colors[lower]).lerp(
                        new THREE.Color(colors[upper]),
                        mix
                    );

                    params['c' + (i + 1)] = '#' + color.getHexString();
                }
            }

            function applyPreset(name) {
                const preset = PRESETS[name];
                if (!preset) return;

                params.shape = preset.shape;
                setPaletteFromColors(preset.colors);
                params.turns = preset.turns;
                params.crestFold = preset.crestFold;
                params.width = preset.width;
                params.fiberCount = preset.fiberCount;
                params.shininess = preset.shininess;
                params.bgColor = preset.bgClear;
            }

            function getActivePalette() {
                const rawColors = [
                    params.c1,
                    params.c2,
                    params.c3,
                    params.c4,
                    params.c5,
                    params.c6,
                    params.c7
                ];

                const list = params.invertPalette
                    ? [...rawColors].reverse()
                    : rawColors;

                return list.map((hex, index) => ({
                    pos: index / (list.length - 1),
                    color: new THREE.Color(hex)
                }));
            }

            function samplePaintColor(t, palette) {
                t = Math.max(0, Math.min(1, t));

                for (let i = 0; i < palette.length - 1; i++) {
                    if (t >= palette[i].pos && t <= palette[i + 1].pos) {
                        const localT = (t - palette[i].pos) /
                            (palette[i + 1].pos - palette[i].pos);

                        return palette[i].color
                            .clone()
                            .lerp(palette[i + 1].color, localT);
                    }
                }

                return palette[palette.length - 1].color.clone();
            }

            function getSpineData(t) {
                const theta = t * params.turns * Math.PI * 2 + 1.65;

                const lat = 1.05 - t * 2.10;
                const cosLat = Math.cos(lat);
                const sinLat = Math.sin(lat);

                const radius = params.sphereRadius;
                const rx = radius * (1.0 + 0.06 * Math.sin(theta * 0.5));
                const ry = radius * 1.06;
                const rz = radius * (1.0 + 0.05 * Math.cos(theta * 0.5));

                let x = rx * cosLat * Math.cos(theta);
                let y = ry * sinLat;
                let z = rz * cosLat * Math.sin(theta);

                if (params.shape === 'Hook Crest S-Loop' && t < 0.26) {
                    const fold = params.crestFold;
                    const foldT = Math.sin((t / 0.26) * Math.PI);

                    x -= Math.sin(t * Math.PI * 3.5) * 35 * fold * foldT;
                    y += Math.cos(t * Math.PI * 3.5) * 25 * fold * foldT;
                    z += Math.sin(t * Math.PI * 2.0) * 30 * fold * foldT;
                }

                if (params.startFlick && t < 0.08) {
                    const flick = Math.pow(1 - t / 0.08, 1.5);

                    x -= flick * 35;
                    y += flick * 30;
                    z -= flick * 15;
                }

                if (params.startFlick && t > 0.92) {
                    const rearFlick = Math.pow((t - 0.92) / 0.08, 1.5);

                    x += rearFlick * 35;
                    y -= rearFlick * 30;
                    z += rearFlick * 15;
                }

                const sphereNorm = new THREE.Vector3(
                    x / rx,
                    y / ry,
                    z / rz
                ).normalize();

                return {
                    pos: new THREE.Vector3(x, y, z),
                    sphereNorm
                };
            }

            /*
             * Three groups separate all movement cleanly:
             *
             * pivotGroup  = bob motion / fixed showcase angle
             * spinGroup   = normal Upward / Downward spin (Y axis)
             * rotateGroup = separate clockwise checkbox motion (Z axis)
             *
             * This prevents clockwise rotation from affecting spin logic.
             */
            const pivotGroup = new THREE.Group();
            pivotGroup.position.set(0, -5, 0);
            pivotGroup.rotation.set(0.12, 0, 0.02);
            scene.add(pivotGroup);

            const spinGroup = new THREE.Group();
            pivotGroup.add(spinGroup);

            const rotateGroup = new THREE.Group();
            spinGroup.add(rotateGroup);

            let currentBrushArt = null;
            let fadeInAnimation = null;

            /*
             * When rotation is disabled, this target is always 0:
             * the original upright orientation of rotateGroup.
             */
            const originalRotateZ = 0;
            let rotateReturning = false;

            function disposeObject(object) {
                object.traverse(child => {
                    if (child.geometry) {
                        child.geometry.dispose();
                    }

                    if (child.material) {
                        if (Array.isArray(child.material)) {
                            child.material.forEach(material => material.dispose());
                        } else {
                            child.material.dispose();
                        }
                    }
                });
            }

            function nextFrame() {
                return new Promise(resolve => requestAnimationFrame(resolve));
            }

            async function buildBrushStrokeAsync(token) {
                const masterGroup = new THREE.Group();
                const palette = getActivePalette();

                let localSeed = 884123;

                function rnd() {
                    localSeed = (Math.imul(localSeed, 1664525) + 1013904223) >>> 0;
                    return localSeed / 0xffffffff;
                }

                function rndRange(min, max) {
                    return min + rnd() * (max - min);
                }

                const SPINE_SAMPLES = 360;
                const spineData = [];
                const spinePoints = [];

                for (let i = 0; i <= SPINE_SAMPLES; i++) {
                    const data = getSpineData(i / SPINE_SAMPLES);
                    spineData.push(data);
                    spinePoints.push(data.pos);
                }

                const spineCurve = new THREE.CatmullRomCurve3(
                    spinePoints,
                    false,
                    'centripetal',
                    0.45
                );

                const spineFrames = [];

                for (let i = 0; i <= SPINE_SAMPLES; i++) {
                    const t = i / SPINE_SAMPLES;
                    const tangent = spineCurve.getTangentAt(t).normalize();
                    const sphereNorm = spineData[i].sphereNorm;

                    let binormal = new THREE.Vector3().crossVectors(
                        tangent,
                        sphereNorm
                    );

                    if (binormal.lengthSq() < 0.000001) {
                        binormal = new THREE.Vector3(1, 0, 0);
                    }

                    binormal.normalize();

                    const normal = new THREE.Vector3()
                        .crossVectors(binormal, tangent)
                        .normalize();

                    spineFrames.push({
                        pt: spinePoints[i],
                        tangent,
                        normal,
                        binormal
                    });
                }

                function getFrameAt(t) {
                    const indexFloat = t * SPINE_SAMPLES;
                    const index = Math.min(
                        Math.floor(indexFloat),
                        SPINE_SAMPLES - 1
                    );

                    const fraction = indexFloat - index;
                    const first = spineFrames[index];
                    const second = spineFrames[index + 1] || first;

                    return {
                        pt: first.pt.clone().lerp(second.pt, fraction),
                        tangent: first.tangent.clone().lerp(second.tangent, fraction).normalize(),
                        normal: first.normal.clone().lerp(second.normal, fraction).normalize(),
                        binormal: first.binormal.clone().lerp(second.binormal, fraction).normalize()
                    };
                }

                const baseWidth = params.width;
                const baseThickness = params.thickness;

                function getWidth(t) {
                    if (params.startFlick) {
                        if (t < 0.08) {
                            return (baseWidth * 0.5) +
                                (t / 0.08) * (baseWidth * 0.5);
                        }

                        if (t > 0.92) {
                            return (baseWidth * 0.5) +
                                ((1 - t) / 0.08) * (baseWidth * 0.5);
                        }
                    }

                    const taper = Math.sin(t * Math.PI);
                    return baseWidth * 0.85 + taper * (baseWidth * 0.35);
                }

                function getThickness(t) {
                    return baseThickness * 0.85 +
                        Math.sin(t * Math.PI) * (baseThickness * 0.45);
                }

                const NUM_LAYERS = 4;
                const RIBBON_SEGS = 260;

                for (let layer = 0; layer < NUM_LAYERS; layer++) {
                    const ribbonGeometry = new THREE.PlaneGeometry(
                        1,
                        1,
                        20,
                        RIBBON_SEGS
                    );

                    const positionAttribute = ribbonGeometry.attributes.position;
                    const colorAttribute = new Float32Array(
                        positionAttribute.count * 3
                    );

                    const layerHeight =
                        (layer - 1.5) * (baseThickness * 0.26);

                    const widthScale = 0.95 - layer * 0.04;

                    for (let row = 0; row <= RIBBON_SEGS; row++) {
                        const t = row / RIBBON_SEGS;
                        const frame = getFrameAt(t);
                        const width = getWidth(t) * widthScale;

                        for (let column = 0; column <= 20; column++) {
                            const vertexIndex = row * 21 + column;
                            const u = (column / 20) * 2 - 1;

                            positionAttribute.setXYZ(
                                vertexIndex,
                                frame.pt.x +
                                    frame.binormal.x * (u * width * 0.5) +
                                    frame.normal.x * layerHeight,
                                frame.pt.y +
                                    frame.binormal.y * (u * width * 0.5) +
                                    frame.normal.y * layerHeight,
                                frame.pt.z +
                                    frame.binormal.z * (u * width * 0.5) +
                                    frame.normal.z * layerHeight
                            );

                            const color = samplePaintColor((1 - u) * 0.5, palette);

                            colorAttribute[vertexIndex * 3] = color.r;
                            colorAttribute[vertexIndex * 3 + 1] = color.g;
                            colorAttribute[vertexIndex * 3 + 2] = color.b;
                        }
                    }

                    ribbonGeometry.setAttribute(
                        'color',
                        new THREE.BufferAttribute(colorAttribute, 3)
                    );

                    ribbonGeometry.computeVertexNormals();

                    const ribbonMaterial = new THREE.MeshPhongMaterial({
                        vertexColors: true,
                        specular: new THREE.Color(0xffffff)
                            .multiplyScalar(params.specularIntensity),
                        shininess: params.shininess,
                        transparent: true,
                        opacity: params.underRibbonOpacity,
                        side: THREE.DoubleSide,
                        depthWrite: false
                    });

                    ribbonMaterial.userData.kind = 'ribbon';

                    const ribbonMesh = new THREE.Mesh(
                        ribbonGeometry,
                        ribbonMaterial
                    );

                    ribbonMesh.userData.kind = 'ribbon';
                    ribbonMesh.visible = params.underRibbonOpacity > 0.001;
                    ribbonMesh.matrixAutoUpdate = false;
                    ribbonMesh.updateMatrix();

                    masterGroup.add(ribbonMesh);
                }

                const NUM_BRISTLES = Math.max(1, Math.round(params.fiberCount));
                const BRISTLE_SEGS = 190;
                const BRISTLE_CHUNK = 10;

                for (let bristleIndex = 0; bristleIndex < NUM_BRISTLES; bristleIndex++) {
                    if (token !== rebuildRequestId) {
                        disposeObject(masterGroup);
                        return null;
                    }

                    const uNorm = NUM_BRISTLES === 1
                        ? 0
                        : (bristleIndex / (NUM_BRISTLES - 1)) * 2 - 1;

                    const uOffset =
                        Math.sign(uNorm) *
                        Math.pow(Math.abs(uNorm), 0.90) +
                        rndRange(-0.02, 0.02);

                    const vOffset =
                        rndRange(-0.48, 0.48) *
                        Math.sqrt(1 - Math.min(1, Math.abs(uOffset) * 0.85));

                    let colorT = (1 - uOffset) * 0.5;

                    colorT = Math.max(
                        0,
                        Math.min(
                            1,
                            colorT + rndRange(-params.colorJitter, params.colorJitter)
                        )
                    );

                    const bristleColor = samplePaintColor(colorT, palette);
                    bristleColor.multiplyScalar(rndRange(0.88, 1.30));

                    const isStray = rnd() < params.strayFibers;
                    const spread = isStray ? rndRange(1.08, 1.35) : 1;

                    const startT = (bristleIndex < 50 || rnd() > 0.80)
                        ? rndRange(0, 0.05)
                        : 0;

                    const endT = (bristleIndex > NUM_BRISTLES - 50 || rnd() > 0.82)
                        ? rndRange(0.95, 1)
                        : 1;

                    const waveFrequency = rndRange(3, 8);
                    const wavePhase = rndRange(0, Math.PI * 2);
                    const waveAmplitude = rndRange(0.5, 2.2) * params.waviness;

                    const points = [];
                    const steps = Math.max(
                        4,
                        Math.floor(BRISTLE_SEGS * (endT - startT))
                    );

                    for (let pointIndex = 0; pointIndex <= steps; pointIndex++) {
                        const localT = pointIndex / steps;
                        const t = startT + localT * (endT - startT);
                        const frame = getFrameAt(t);

                        const width = getWidth(t) * spread;
                        const thickness = getThickness(t) * spread;

                        const wave = Math.sin(
                            t * Math.PI * waveFrequency + wavePhase
                        ) * waveAmplitude;

                        let fanning = 1;

                        if (params.startFlick && t < 0.08) {
                            fanning +=
                                Math.pow(1 - t / 0.08, 1.5) *
                                0.45 *
                                uOffset;
                        }

                        if (params.startFlick && t > 0.92) {
                            fanning +=
                                Math.pow((t - 0.92) / 0.08, 1.5) *
                                0.45 *
                                uOffset;
                        }

                        points.push(
                            new THREE.Vector3(
                                frame.pt.x +
                                    frame.binormal.x * (
                                        uOffset * width * 0.5 * fanning + wave
                                    ) +
                                    frame.normal.x * (vOffset * thickness * 0.5),

                                frame.pt.y +
                                    frame.binormal.y * (
                                        uOffset * width * 0.5 * fanning + wave
                                    ) +
                                    frame.normal.y * (vOffset * thickness * 0.5),

                                frame.pt.z +
                                    frame.binormal.z * (
                                        uOffset * width * 0.5 * fanning + wave
                                    ) +
                                    frame.normal.z * (vOffset * thickness * 0.5)
                            )
                        );
                    }

                    if (points.length > 3) {
                        const curve = new THREE.CatmullRomCurve3(
                            points,
                            false,
                            'centripetal',
                            0.4
                        );

                        const radius = (
                            isStray
                                ? rndRange(0.5, 0.85)
                                : rndRange(0.8, 1.7)
                        ) * (params.fiberRadius / 1.15);

                        const geometry = new THREE.TubeGeometry(
                            curve,
                            Math.floor(steps * 1.35),
                            radius,
                            6,
                            false
                        );

                        const opacityBase = isStray
                            ? rndRange(0.55, 0.78)
                            : rndRange(0.82, 0.98);

                        const opacity =
                            opacityBase * (params.fiberOpacity / 0.88);

                        const specular = bristleColor
                            .clone()
                            .lerp(new THREE.Color(0xffffff), 0.70)
                            .multiplyScalar(params.specularIntensity);

                        const material = new THREE.MeshPhongMaterial({
                            color: bristleColor,
                            specular,
                            shininess: params.shininess,
                            transparent: true,
                            opacity: Math.min(1, opacity),
                            depthWrite: opacity > 0.88,
                            side: THREE.FrontSide
                        });

                        material.userData.kind = 'bristle';
                        material.userData.baseColor = bristleColor.clone();
                        material.userData.opacityBase = opacityBase;

                        const mesh = new THREE.Mesh(geometry, material);
                        mesh.userData.kind = 'bristle';
                        mesh.matrixAutoUpdate = false;
                        mesh.updateMatrix();

                        masterGroup.add(mesh);
                    }

                    if (
                        bristleIndex > 0 &&
                        bristleIndex % BRISTLE_CHUNK === 0
                    ) {
                        await nextFrame();
                    }
                }

                if (token !== rebuildRequestId) {
                    disposeObject(masterGroup);
                    return null;
                }

                return masterGroup;
            }

            function updateMaterials() {
                if (!currentBrushArt) {
                    needsRender = true;
                    return;
                }

                currentBrushArt.traverse(child => {
                    if (!child.material) return;

                    const materials = Array.isArray(child.material)
                        ? child.material
                        : [child.material];

                    materials.forEach(material => {
                        if (material.userData.kind === 'ribbon') {
                            material.specular.setRGB(
                                params.specularIntensity,
                                params.specularIntensity,
                                params.specularIntensity
                            );

                            material.shininess = params.shininess;
                            material.opacity = params.underRibbonOpacity;
                            material.needsUpdate = true;

                            child.visible = params.underRibbonOpacity > 0.001;
                        }

                        if (material.userData.kind === 'bristle') {
                            const baseColor =
                                material.userData.baseColor || material.color;

                            const opacityBase =
                                material.userData.opacityBase !== undefined
                                    ? material.userData.opacityBase
                                    : material.opacity;

                            material.color.copy(baseColor);

                            material.specular
                                .copy(baseColor)
                                .lerp(new THREE.Color(0xffffff), 0.70)
                                .multiplyScalar(params.specularIntensity);

                            const opacity =
                                opacityBase * (params.fiberOpacity / 0.88);

                            material.shininess = params.shininess;
                            material.opacity = Math.min(1, opacity);
                            material.depthWrite = opacity > 0.88;
                            material.needsUpdate = true;

                            child.visible = params.fiberOpacity > 0.001;
                        }
                    });
                });

                needsRender = true;
            }

            function updateLighting() {
                keyLight.intensity = params.keyLightIntensity;
                fillLight.intensity = params.fillLightIntensity;
                rimLight.intensity = params.rimLightIntensity;
                needsRender = true;
            }

            function updateBackground() {
                container.style.background = params.bgColor;
                paperGrainEl.style.display = params.paperGrain ? 'block' : 'none';
                paperGrainEl.style.opacity = params.grainOpacity;

                const color = new THREE.Color(params.bgColor);
                const luminance =
                    0.299 * color.r +
                    0.587 * color.g +
                    0.114 * color.b;

                hintEl.style.color = luminance < 0.4
                    ? 'rgba(255,255,255,0.65)'
                    : '#8f7d6a';

                needsRender = true;
            }

            let rebuildRequestId = 0;
            let rebuildTimer = null;
            let buildInProgress = false;
            let pendingBuildToken = null;

            function scheduleRebuild(delay = 150) {
                rebuildRequestId++;
                const token = rebuildRequestId;

                clearTimeout(rebuildTimer);

                rebuildTimer = setTimeout(() => {
                    rebuildTimer = null;
                    startRebuild(token);
                }, delay);
            }

            function rebuildArtwork() {
                scheduleRebuild();
            }

            function startRebuild(token) {
                if (token !== rebuildRequestId) return;

                if (buildInProgress) {
                    pendingBuildToken = token;
                    return;
                }

                buildInProgress = true;

                buildBrushStrokeAsync(token)
                    .then(nextArt => {
                        if (!nextArt) return;

                        if (token !== rebuildRequestId) {
                            disposeObject(nextArt);
                            return;
                        }

                        const oldArt = currentBrushArt;

                        nextArt.traverse(child => {
                            if (child.material) {
                                child.material.transparent = true;
                                child.material.opacity = 0;
                                child.material.needsUpdate = true;
                            }
                        });

                        rotateGroup.add(nextArt);
                        currentBrushArt = nextArt;

                        if (oldArt) {
                            rotateGroup.remove(oldArt);
                            disposeObject(oldArt);
                        }

                        fadeInAnimation = {
                            object: nextArt,
                            startTime: performance.now(),
                            duration: 350
                        };

                        needsRender = true;
                    })
                    .catch(error => {
                        console.error('Artwork rebuild failed:', error);
                    })
                    .finally(() => {
                        buildInProgress = false;

                        if (pendingBuildToken !== null) {
                            const nextToken = pendingBuildToken;
                            pendingBuildToken = null;

                            if (nextToken === rebuildRequestId) {
                                startRebuild(nextToken);
                            }
                        }
                    });
            }

            function updateFadeIn(now) {
                if (!fadeInAnimation) return false;

                const { object, startTime, duration } = fadeInAnimation;
                const progress = Math.min(1, (now - startTime) / duration);
                const eased = 1 - Math.pow(1 - progress, 3);

                object.traverse(child => {
                    if (!child.material) return;

                    if (child.material.userData.kind === 'ribbon') {
                        child.material.opacity =
                            params.underRibbonOpacity * eased;
                    } else if (child.material.userData.kind === 'bristle') {
                        child.material.opacity = Math.min(
                            1,
                            child.material.userData.opacityBase *
                            (params.fiberOpacity / 0.88) *
                            eased
                        );
                    }

                    child.material.needsUpdate = true;
                });

                if (progress >= 1) {
                    fadeInAnimation = null;
                    updateMaterials();
                }

                return true;
            }

            function wait(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            async function waitForLatestArtwork() {
                if (rebuildTimer !== null) {
                    const token = rebuildRequestId;
                    clearTimeout(rebuildTimer);
                    rebuildTimer = null;
                    startRebuild(token);
                }

                while (buildInProgress || rebuildTimer !== null) {
                    await wait(40);
                }
            }

            async function saveHighResArtworkPNG() {
                await waitForLatestArtwork();

                const oldSize = renderer.getSize(new THREE.Vector2());
                const oldPixelRatio = renderer.getPixelRatio();
                const oldAspect = camera.aspect;
                const oldSceneBackground = scene.background;

                const displayWidth = Math.max(1, window.innerWidth);
                const displayHeight = Math.max(1, window.innerHeight);

                const maxTexture = Math.min(
                    renderer.capabilities.maxTextureSize || 4096,
                    4096
                );

                const maxArea = 10000000;

                let scale = Math.min(
                    2,
                    maxTexture / displayWidth,
                    maxTexture / displayHeight,
                    Math.sqrt(maxArea / (displayWidth * displayHeight))
                );

                scale = Math.max(0.75, scale);

                const exportWidth = Math.floor(displayWidth * scale);
                const exportHeight = Math.floor(displayHeight * scale);

                try {
                    scene.background = new THREE.Color(params.bgColor);

                    renderer.setPixelRatio(1);
                    renderer.setSize(exportWidth, exportHeight, false);

                    camera.aspect = exportWidth / exportHeight;
                    camera.updateProjectionMatrix();

                    renderer.render(scene, camera);

                    const dataURL = renderer.domElement.toDataURL('image/png');
                    const link = document.createElement('a');

                    link.download = `brush-sculpture-${Date.now()}.png`;
                    link.href = dataURL;

                    document.body.appendChild(link);
                    link.click();
                    link.remove();
                } catch (error) {
                    console.error('PNG export failed:', error);
                } finally {
                    scene.background = oldSceneBackground;

                    renderer.setPixelRatio(oldPixelRatio);
                    renderer.setSize(oldSize.x, oldSize.y, false);

                    camera.aspect = oldAspect;
                    camera.updateProjectionMatrix();

                    needsRender = true;
                }
            }

            updateBackground();
            updateLighting();
            scheduleRebuild(0);

            try {
                const PaneClass =
                    (window.Tweakpane &&
                        (window.Tweakpane.Pane || window.Tweakpane)) ||
                    window.Pane;

                if (PaneClass) {
                    const pane = new PaneClass({
                        title: '🎨 3D Brush Sculpture Studio',
                        expanded: true
                    });

                    function addControl(parent, object, property, options) {
                        if (typeof parent.addBinding === 'function') {
                            return parent.addBinding(object, property, options);
                        }

                        if (typeof parent.addInput === 'function') {
                            return parent.addInput(object, property, options);
                        }

                        return parent.add(object, property, options);
                    }

                    const presetOptions = Object.keys(PRESETS).reduce(
                        (options, key) => {
                            options[key] = key;
                            return options;
                        },
                        {}
                    );

                    const fPresets = pane.addFolder({
                        title: '🌟 Style Presets',
                        expanded: true
                    });

                    addControl(fPresets, params, 'preset', {
                        options: presetOptions
                    }).on('change', event => {
                        const value =
                            event && event.value !== undefined
                                ? event.value
                                : event;

                        if (PRESETS[value]) {
                            applyPreset(value);
                            pane.refresh();
                            updateBackground();
                            updateMaterials();
                            scheduleRebuild(20);
                        }
                    });

                    const fPalette = pane.addFolder({
                        title: '🌈 Multi-Pigment Palette',
                        expanded: false
                    });

                    addControl(fPalette, params, 'c1', { label: 'Outer Edge' }).on('change', rebuildArtwork);
                    addControl(fPalette, params, 'c2', { label: 'Outer Mid' }).on('change', rebuildArtwork);
                    addControl(fPalette, params, 'c3', { label: 'Mid Purple' }).on('change', rebuildArtwork);
                    addControl(fPalette, params, 'c4', { label: 'Core Magenta' }).on('change', rebuildArtwork);
                    addControl(fPalette, params, 'c5', { label: 'Core Crimson' }).on('change', rebuildArtwork);
                    addControl(fPalette, params, 'c6', { label: 'Inner Amber' }).on('change', rebuildArtwork);
                    addControl(fPalette, params, 'c7', { label: 'Inner Gold' }).on('change', rebuildArtwork);
                    addControl(fPalette, params, 'invertPalette', { label: 'Invert Pigment' }).on('change', rebuildArtwork);

                    addControl(fPalette, params, 'colorJitter', {
                        min: 0,
                        max: 0.15,
                        step: 0.01,
                        label: 'Color Striation'
                    }).on('change', rebuildArtwork);

                    const fGeometry = pane.addFolder({
                        title: '📐 Geometry & Sculpture',
                        expanded: true
                    });

                    addControl(fGeometry, params, 'turns', {
                        min: 2,
                        max: 5,
                        step: 0.05,
                        label: 'Coil Turns'
                    }).on('change', rebuildArtwork);

                    addControl(fGeometry, params, 'sphereRadius', {
                        min: 140,
                        max: 280,
                        step: 5,
                        label: 'Sphere Radius'
                    }).on('change', rebuildArtwork);

                    addControl(fGeometry, params, 'width', {
                        min: 30,
                        max: 100,
                        step: 2,
                        label: 'Stroke Width'
                    }).on('change', rebuildArtwork);

                    addControl(fGeometry, params, 'thickness', {
                        min: 6,
                        max: 32,
                        step: 1,
                        label: 'Stroke Depth'
                    }).on('change', rebuildArtwork);

                    addControl(fGeometry, params, 'fiberCount', {
                        min: 80,
                        max: 420,
                        step: 10,
                        label: 'Bristle Density'
                    }).on('change', rebuildArtwork);

                    addControl(fGeometry, params, 'fiberRadius', {
                        min: 0.5,
                        max: 2.5,
                        step: 0.1,
                        label: 'Bristle Size'
                    }).on('change', rebuildArtwork);

                    addControl(fGeometry, params, 'waviness', {
                        min: 0,
                        max: 3,
                        step: 0.1,
                        label: 'Bristle Wiggle'
                    }).on('change', rebuildArtwork);

                    addControl(fGeometry, params, 'strayFibers', {
                        min: 0,
                        max: 0.35,
                        step: 0.01,
                        label: 'Stray Bristles'
                    }).on('change', rebuildArtwork);

                    addControl(fGeometry, params, 'startFlick', {
                        label: 'Brush Flicks (Top + Tail)'
                    }).on('change', rebuildArtwork);

                    const fMaterial = pane.addFolder({
                        title: '✨ Paint Luster & Finish',
                        expanded: false
                    });

                    addControl(fMaterial, params, 'shininess', {
                        min: 10,
                        max: 150,
                        step: 5,
                        label: 'Wet Gloss'
                    }).on('change', updateMaterials);

                    addControl(fMaterial, params, 'specularIntensity', {
                        min: 0.1,
                        max: 2,
                        step: 0.05,
                        label: 'Highlights'
                    }).on('change', updateMaterials);

                    addControl(fMaterial, params, 'fiberOpacity', {
                        min: 0.4,
                        max: 1,
                        step: 0.02,
                        label: 'Bristle Opacity'
                    }).on('change', updateMaterials);

                    addControl(fMaterial, params, 'underRibbonOpacity', {
                        min: 0,
                        max: 1,
                        step: 0.05,
                        label: 'Under-Body Fill'
                    }).on('change', updateMaterials);

                    const fMotion = pane.addFolder({
                        title: '🌪️ Motion & Spin Dynamics',
                        expanded: true
                    });

                    addControl(fMotion, params, 'spinMode', {
                        label: 'Spin Direction',
                        options: {
                            'Downward': 'Downward',
                            'Paused': 'Paused',
                            'Upward': 'Upward'
                        }
                    }).on('change', () => {
                        needsRender = true;
                    });

                    addControl(fMotion, params, 'spinSpeed', {
                        min: 0,
                        max: 2,
                        step: 0.05,
                        label: 'Spin Velocity'
                    }).on('change', () => {
                        needsRender = true;
                    });

                    addControl(fMotion, params, 'floatingBob', {
                        label: 'Floating Bob'
                    }).on('change', () => {
                        needsRender = true;
                    });

                    addControl(fMotion, params, 'rotateClockwise', {
                        label: 'Rotate Clockwise'
                    }).on('change', () => {
                        /*
                         * On uncheck, rotateReturning activates.
                         * rotateGroup will smoothly return to Z = 0.
                         * spinGroup continues its normal Y-axis spin.
                         */
                        rotateReturning = !params.rotateClockwise;
                        needsRender = true;
                    });

                    addControl(fMotion, params, 'bobAmplitude', {
                        min: 0,
                        max: 18,
                        step: 0.5,
                        label: 'Bob Amplitude'
                    }).on('change', () => {
                        needsRender = true;
                    });

                    addControl(fMotion, params, 'bobSpeed', {
                        min: 0.1,
                        max: 3,
                        step: 0.1,
                        label: 'Bob Speed'
                    }).on('change', () => {
                        needsRender = true;
                    });

                    const fEnvironment = pane.addFolder({
                        title: '💡 Lighting & Canvas',
                        expanded: false
                    });

                    addControl(fEnvironment, params, 'bgColor', {
                        label: 'Background'
                    }).on('change', updateBackground);

                    addControl(fEnvironment, params, 'paperGrain', {
                        label: 'Canvas Texture'
                    }).on('change', updateBackground);

                    addControl(fEnvironment, params, 'grainOpacity', {
                        min: 0,
                        max: 0.4,
                        step: 0.02,
                        label: 'Grain Opacity'
                    }).on('change', updateBackground);

                    addControl(fEnvironment, params, 'keyLightIntensity', {
                        min: 0.2,
                        max: 3,
                        step: 0.1,
                        label: 'Sun Key Light'
                    }).on('change', updateLighting);

                    addControl(fEnvironment, params, 'fillLightIntensity', {
                        min: 0,
                        max: 2,
                        step: 0.1,
                        label: 'Sky Fill Light'
                    }).on('change', updateLighting);

                    addControl(fEnvironment, params, 'rimLightIntensity', {
                        min: 0,
                        max: 2,
                        step: 0.1,
                        label: 'Rim Light'
                    }).on('change', updateLighting);

                    const fActions = pane.addFolder({
                        title: '⚡ Quick Actions',
                        expanded: true
                    });

                    fActions.addButton({
                        title: '🎲 Randomize Palette & Form'
                    }).on('click', () => {
                        const randomColor = () =>
                            '#' +
                            Math.floor(Math.random() * 16777215)
                                .toString(16)
                                .padStart(6, '0');

                        params.c1 = randomColor();
                        params.c2 = randomColor();
                        params.c3 = randomColor();
                        params.c4 = randomColor();
                        params.c5 = randomColor();
                        params.c6 = randomColor();
                        params.c7 = randomColor();

                        params.turns = 3.5 + Math.random() * 1.5;
                        params.crestFold = 0.2 + Math.random() * 0.8;
                        params.width = 50 + Math.random() * 25;

                        pane.refresh();
                        scheduleRebuild(20);
                    });

                    fActions.addButton({
                        title: '📸 Save High-Res Artwork PNG'
                    }).on('click', saveHighResArtworkPNG);

                    fActions.addButton({
                        title: '🔄 Reset'
                    }).on('click', () => {
                        Object.assign(params, DEFAULT_PARAMS);
                        applyPreset(params.preset);

                        pivotGroup.position.set(0, -5, 0);
                        pivotGroup.rotation.set(0.12, 0, 0.02);

                        /* Original upright clockwise-rotation state */
                        rotateGroup.rotation.z = originalRotateZ;
                        rotateReturning = false;

                        /* Normal spin has its own separate rotation group */
                        spinGroup.rotation.y = 0;

                        if (controls.reset) {
                            controls.reset();
                        }

                        pane.refresh();
                        updateBackground();
                        updateLighting();
                        updateMaterials();
                        scheduleRebuild(20);
                    });
                }
            } catch (error) {
                console.error('Tweakpane init warning:', error);
            }

            const clock = new THREE.Clock();

            function animate() {
                requestAnimationFrame(animate);

                const delta = Math.min(clock.getDelta(), 0.05);
                const elapsed = clock.elapsedTime;
                const now = performance.now();

                let animated = false;

                if (fadeInAnimation && updateFadeIn(now)) {
                    animated = true;
                }

                /*
                 * NORMAL SPIN:
                 * - spinGroup rotation on Y-axis.
                 * - params.spinSpeed affects ONLY this block.
                 * - rotateClockwise does not affect this speed.
                 */
                if (params.spinMode !== 'Paused' && params.spinSpeed > 0) {
                    const direction = params.spinMode === 'Upward' ? -1 : 1;

                    spinGroup.rotation.y +=
                        direction * delta * params.spinSpeed;

                    animated = true;
                }

                /*
                 * CLOCKWISE ROTATION:
                 * - rotateGroup rotation on Z-axis.
                 * - Fixed CLOCKWISE_ROTATE_SPEED.
                 * - Does not use params.spinSpeed.
                 * - Runs only while checkbox is ticked.
                 */
                if (params.rotateClockwise) {
                    rotateGroup.rotation.z -=
                        delta * CLOCKWISE_ROTATE_SPEED;

                    rotateReturning = false;
                    animated = true;
                }

                /*
                 * When checkbox is unticked, smoothly return rotateGroup
                 * to its original upright orientation (Z = 0).
                 *
                 * This does not touch spinGroup.rotation.y, so normal
                 * Upward/Downward spinning continues exactly as usual.
                 */
                if (!params.rotateClockwise && rotateReturning) {
                    const difference =
                        originalRotateZ - rotateGroup.rotation.z;

                    if (Math.abs(difference) > 0.0001) {
                        const easing =
                            1 - Math.exp(-CLOCKWISE_RETURN_SPEED * delta);

                        rotateGroup.rotation.z += difference * easing;
                        animated = true;
                    } else {
                        rotateGroup.rotation.z = originalRotateZ;
                        rotateReturning = false;
                    }
                }

                if (params.floatingBob) {
                    pivotGroup.position.y =
                        -5 +
                        Math.sin(elapsed * params.bobSpeed) *
                        params.bobAmplitude;

                    pivotGroup.rotation.z =
                        0.02 +
                        Math.sin(elapsed * 0.4) * 0.015;

                    animated = true;
                } else {
                    if (Math.abs(pivotGroup.position.y + 5) > 0.001) {
                        pivotGroup.position.y = -5;
                        animated = true;
                    }

                    if (Math.abs(pivotGroup.rotation.z - 0.02) > 0.001) {
                        pivotGroup.rotation.z = 0.02;
                        animated = true;
                    }
                }

                const controlsChanged = controls.update
                    ? controls.update()
                    : false;

                if (animated || controlsChanged || needsRender) {
                    renderer.render(scene, camera);
                    needsRender = false;
                }
            }

            animate();

            let resizeFrame = null;

            window.addEventListener('resize', () => {
                if (resizeFrame !== null) {
                    cancelAnimationFrame(resizeFrame);
                }

                resizeFrame = requestAnimationFrame(() => {
                    resizeFrame = null;
                    resizeRenderer();
                });
            });

            document.addEventListener('visibilitychange', () => {
                clock.getDelta();
                needsRender = true;
            });

            renderer.domElement.addEventListener('webglcontextlost', event => {
                event.preventDefault();
                console.warn('WebGL context lost.');
            });

            renderer.domElement.addEventListener('webglcontextrestored', () => {
                console.warn('WebGL context restored. Rebuilding artwork.');
                scheduleRebuild(20);
            });
        })();
    </script>
</body>
</html>
