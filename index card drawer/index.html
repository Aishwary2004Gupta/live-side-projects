<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sam's Secret Files Animation</title>

  <style>
    :root {
      --bg: #dedede;
      --paper: #e7e7e7;
      --paper-dark: #cfcfcf;
      --ink: #101010;
      --muted: #9b9b9b;
      --yellow: #95953d;
      --tray-height: clamp(92px, 14vh, 135px);
      --line: 1.45px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    .scene {
      position: relative;
      width: min(100vw, 980px);
      height: min(100svh, 980px);
      overflow: hidden;
      background: var(--bg);
      isolation: isolate;
    }

    /*
      Slight top-down filing cabinet view.
    */
    .cabinet {
      position: absolute;
      left: 7%;
      right: 7%;
      top: 4.5%;
      bottom: calc(var(--tray-height) - 2px);
      perspective: 900px;
      z-index: 10;
    }

    .stack {
      position: absolute;
      inset: 0;
      transform-origin: 50% 100%;
      transform: rotateX(3deg);
    }

    .stack::before,
    .stack::after {
      content: "";
      position: absolute;
      top: 12px;
      bottom: -3px;
      width: var(--line);
      background: var(--ink);
      z-index: 900;
      pointer-events: none;
    }

    .stack::before {
      left: 0;
      transform: skewX(-3deg);
    }

    .stack::after {
      right: 0;
      transform: skewX(3deg);
    }

    .file {
      position: absolute;
      left: 0;
      right: 0;
      height: var(--file-height);
      pointer-events: none;
      transition: opacity 0.18s ease;
    }

    .file svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .file path {
      fill: var(--paper);
      stroke: var(--ink);
      stroke-width: 1.45;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .tab {
      position: absolute;
      top: -1px;
      height: calc(100% - 4px);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 5px 15px 0;
      color: var(--ink);
      background: var(--paper);
      pointer-events: none;
      clip-path: polygon(8% 0%, 91% 0%, 100% 100%, 0% 100%);
      z-index: 20;
    }

    .tab.left {
      left: 34%;
      width: 31%;
    }

    .tab.right {
      left: 61%;
      width: 29%;
    }

    .tab.far-left {
      left: 10%;
      width: 25%;
    }

    .tab span {
      white-space: nowrap;
      font-size: clamp(9px, 1.55vw, 17px);
      line-height: 1.15;
    }

    .tab .name {
      font-weight: 700;
      text-align: right;
    }

    .section-tab {
      position: absolute;
      height: var(--file-height);
      z-index: 60;
      pointer-events: none;
    }

    .section-inner {
      position: absolute;
      top: -2px;
      left: 0;
      width: 100%;
      height: 78%;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 6px 15px 0;
      color: #fff;
      background: #020202;
      clip-path: polygon(12% 0%, 88% 0%, 100% 100%, 0% 100%);
    }

    .section-inner span {
      font-size: clamp(9px, 1.55vw, 17px);
      line-height: 1.15;
    }

    .section-o {
      left: 12%;
      width: 25%;
    }

    .section-p {
      left: 35%;
      width: 25%;
    }

    .section-q {
      left: 57%;
      width: 25%;
    }

    .section-r {
      left: 17%;
      width: 25%;
    }

    .section-s {
      left: 4%;
      width: 25%;
    }

    /*
      Opened card / record.
    */
    .record {
      position: absolute;
      left: 6.5%;
      right: 6.5%;
      bottom: calc(var(--tray-height) - 3px);
      height: var(--record-height, 58vh);
      max-height: calc(100% - var(--tray-height) - 35px);
      z-index: 3000;
      transform: translateY(116%);
      opacity: 1;
      pointer-events: none;
    }

    .record.is-open {
      animation: recordUp 0.72s cubic-bezier(.18,.88,.22,1) forwards;
    }

    .record.is-close {
      animation: recordDown 0.72s cubic-bezier(.72,0,.25,1) forwards;
    }

    @keyframes recordUp {
      from {
        transform: translateY(116%);
      }
      to {
        transform: translateY(0);
      }
    }

    @keyframes recordDown {
      from {
        transform: translateY(0);
      }
      to {
        transform: translateY(116%);
      }
    }

    .record-surface {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border: var(--line) solid var(--ink);
      border-radius: 9px 9px 0 0;
      background: #e4e4e4;
    }

    .record-tab {
      position: absolute;
      top: -31px;
      height: 38px;
      padding: 7px 16px 0;
      border: var(--line) solid var(--ink);
      border-bottom: 0;
      border-radius: 13px 13px 0 0;
      background: var(--paper);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      opacity: 0;
      transform: translateY(14px);
      animation: tabIn 0.45s cubic-bezier(.18,.88,.22,1) 0.17s forwards;
      z-index: 3;
    }

    .record.is-close .record-tab {
      animation: tabOut 0.18s ease forwards;
    }

    @keyframes tabIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes tabOut {
      to {
        opacity: 0;
        transform: translateY(14px);
      }
    }

    .record-tab.left {
      left: 34%;
      width: 31%;
    }

    .record-tab.right {
      left: 61%;
      width: 29%;
    }

    .record-tab span {
      white-space: nowrap;
      font-size: clamp(9px, 1.55vw, 17px);
      line-height: 1.15;
    }

    .record-tab .record-tab-name {
      font-weight: 700;
      text-align: right;
    }

    .record-content {
      position: absolute;
      inset: 0;
      padding: 28px 25px 15px;
      display: flex;
      flex-direction: column;
    }

    .record-copy {
      position: relative;
      z-index: 5;
      flex: 0 0 auto;
    }

    .record-title {
      margin: 0;
      font-size: clamp(15px, 1.85vw, 20px);
      line-height: 1.1;
      font-weight: 700;
    }

    .record-subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: clamp(14px, 1.65vw, 18px);
      font-weight: 600;
    }

    .record-art {
      position: relative;
      z-index: 2;
      flex: 1;
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 10px 4% 0;
    }

    .record-art svg {
      width: min(58%, 360px);
      height: min(92%, 430px);
      overflow: visible;
    }

    .record-art.generic svg {
      width: min(52%, 350px);
    }

    .record-art.plant svg {
      width: min(62%, 430px);
    }

    /*
      Hide active folder's original tab while the opened record tab takes over.
    */
    .file.active .tab {
      opacity: 0;
    }

    /*
      Tray / cabinet bottom.
    */
    .tray {
      position: absolute;
      left: -1%;
      right: -1%;
      bottom: 0;
      height: var(--tray-height);
      z-index: 2000;
      border-top: var(--line) solid var(--ink);
      background:
        linear-gradient(
          to bottom,
          #c8c8c8 0%,
          #aaa 20%,
          #4a4a4a 69%,
          #101010 100%
        );
      clip-path: polygon(0 0, 100% 0, 96% 100%, 4% 100%);
    }

    .tray::before,
    .tray::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: var(--line);
      background: var(--ink);
    }

    .tray::before {
      top: 10px;
    }

    .tray::after {
      top: 21px;
      opacity: 0.75;
    }

    .label {
      position: absolute;
      left: 50%;
      bottom: clamp(12px, 1.9vh, 22px);
      transform: translateX(-50%);
      padding: 7px 20px 6px;
      min-width: 160px;
      border: var(--line) solid #202020;
      border-radius: 6px;
      background: var(--yellow);
      color: #151515;
      text-align: center;
      font-size: clamp(12px, 1.55vw, 17px);
      font-weight: 700;
      box-shadow: 0 2px 0 rgba(0,0,0,0.2);
    }

    /*
      Tiny timeline indicator, optional but useful.
    */
    .timecode {
      position: absolute;
      left: 16px;
      bottom: 12px;
      z-index: 5000;
      color: rgba(255,255,255,0.85);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
    }

    .hint {
      position: absolute;
      right: 16px;
      bottom: 12px;
      z-index: 5000;
      color: rgba(255,255,255,0.6);
      font-size: 12px;
      pointer-events: none;
    }

    @media (max-width: 640px) {
      .scene {
        width: 100vw;
        height: 100svh;
      }

      .cabinet {
        left: 3.5%;
        right: 3.5%;
        top: 4%;
      }

      .record {
        left: 4%;
        right: 4%;
      }

      .record-content {
        padding-left: 17px;
        padding-right: 17px;
      }

      .tab,
      .record-tab,
      .section-inner {
        padding-left: 8px;
        padding-right: 8px;
        gap: 5px;
      }

      .record-art svg {
        width: 78%;
      }

      .record-art.generic svg,
      .record-art.plant svg {
        width: 82%;
      }
    }
  </style>
</head>

<body>
  <main class="scene" aria-label="Animated filing cabinet">
    <section class="cabinet">
      <div class="stack" id="stack"></div>

    <section class="record" id="record" aria-hidden="true">

        <span class="record-tab-name" id="recordName">sony</span>
      </div>

      <div class="record-surface">
        <div class="record-content">
          <div class="record-copy">
            <h1 class="record-title" id="recordTitle">walkman - 1979</h1>
            <p class="record-subtitle">details</p>
          </div>

          <div class="record-art" id="recordArt"></div>
        </div>
      </div>
    </section>

    <footer class="tray">
      <div class="label">sam's secret files</div>
    </footer>

    <div class="timecode" id="timecode">0:00 / 0:11</div>
    <div class="hint">looping archival motion</div>
  </main>

    const fileNodes = new Map();

    function makeSvg(side) {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", "0 -14 1000 70");
      svg.setAttribute("preserveAspectRatio", "none");

      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", folderPaths[side]);

      svg.appendChild(path);
      return svg;
    }

    function makeFolder(number, name, side, index) {
      const file = document.createElement("div");
      file.className = "file";
      file.dataset.name = name;
      file.dataset.index = index;

      file.appendChild(makeSvg(side));

      const tab = document.createElement("div");
      tab.className = `tab ${side}`;

      const n = document.createElement("span");
      n.textContent = number;

      const label = document.createElement("span");
      label.className = "name";
      label.textContent = name;

      tab.append(n, label);
      file.appendChild(tab);

      stack.appendChild(file);
      fileNodes.set(name, file);
    }

    function makeSection(section) {
      const marker = document.createElement("div");
      marker.className = `section-tab ${section.className}`;
      marker.dataset.row = section.row;

      const inner = document.createElement("div");
      inner.className = "section-inner";

      const letter = document.createElement("span");
      letter.textContent = section.letter;

      const code = document.createElement("span");
      code.textContent = section.code;

      inner.append(letter, code);
      marker.appendChild(inner);
      stack.appendChild(marker);
    }

    folders.forEach(([number, name, side], index) => {
      makeFolder(number, name, side, index);
    });

    sections.forEach(makeSection);

    function resizeStack() {
      const total = folders.length;
      const height = stack.clientHeight;

      const step = Math.min(
        24,
        Math.max(11, (height - 30) / (total - 1))
      );

      const fileHeight = Math.max(
        26,
        Math.min(45, step * 1.9)
      );

      stack.style.setProperty("--file-height", `${fileHeight}px`);

      [...stack.querySelectorAll(".file")].forEach((file) => {
        const index = Number(file.dataset.index);
        const bottom = (total - 1 - index) * step;
        file.style.bottom = `${bottom}px`;
      });

      [...stack.querySelectorAll(".section-tab")].forEach((marker) => {
        const row = Number(marker.dataset.row);
        const bottom = (total - 1 - row) * step;
        marker.style.bottom = `${bottom}px`;
        marker.style.height = `${fileHeight}px`;
      });
    }

    window.addEventListener("resize", resizeStack);
    resizeStack();

      },
      {
        start: 8,
        end: 10,
        action: "open",
        key: "plant",
        number: "98",
        name: "plant 003",
        side: "left",
        title: "plant 003",
        height: "82vh"
      },
      {
        start: 10,
        end: 11,
        action: "close"
      }
    ];

    let currentScene = null;
    let currentOpenName = null;
    const duration = 11;
    const startedAt = performance.now();

    function openRecord(scene) {
      if (currentOpenName) {
        const previous = fileNodes.get(currentOpenName);
        if (previous) previous.classList.remove("active");
      }

      const node = fileNodes.get(scene.name);
      if (node) node.classList.add("active");

      currentOpenName = scene.name;

      record.style.setProperty("--record-height", scene.height);
      recordNumber.textContent = scene.number;
      recordName.textContent = scene.name;
      recordTitle.textContent = scene.title;

      recordTab.className = `record-tab ${scene.side}`;
      recordArt.className = `record-art ${scene.key}`;
      recordArt.innerHTML = art[scene.key];

      record.classList.remove("is-close");
      void record.offsetWidth;
      record.classList.add("is-open");
      record.setAttribute("aria-hidden", "false");
    }

    function closeRecord() {
      record.classList.remove("is-open");
      void record.offsetWidth;
      record.classList.add("is-close");

      if (currentOpenName) {
        const node = fileNodes.get(currentOpenName);
        if (node) {
          setTimeout(() => node.classList.remove("active"), 620);
        }
      }

      currentOpenName = null;
      record.setAttribute("aria-hidden", "true");
    }

    function resetRecordInstantly() {
      record.classList.remove("is-open", "is-close");
      record.style.transform = "translateY(116%)";

      [...fileNodes.values()].forEach(node => node.classList.remove("active"));
      currentOpenName = null;
      currentScene = null;

      requestAnimationFrame(() => {
        record.style.transform = "";
      });
    }

    function getScene(t) {
      return timeline.find(scene => t >= scene.start && t < scene.end);
    }

    function tick(now) {
      const elapsed = ((now - startedAt) / 1000) % duration;
      const seconds = Math.floor(elapsed);
      timecode.textContent = `0:${String(seconds).padStart(2, "0")} / 0:11`;

      /*
        Loop boundary reset.
      */
      if (elapsed < 0.05 && currentScene !== null) {
        resetRecordInstantly();
      }

      const scene = getScene(elapsed);

      if (scene && scene !== currentScene) {
        currentScene = scene;

        if (scene.action === "open") {
          openRecord(scene);
        } else {
          closeRecord();
        }
      }

      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  </script>
</body>
</html>
