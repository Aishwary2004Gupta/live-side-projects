<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Oil Paint Brush Sculpture Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #ede3d2;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: radial-gradient(circle at 50% 48%, #f8f1e5 0%, #ece0cf 52%, #ddcfba 100%);
            transition: background 0.3s ease;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        canvas:active {
            cursor: grabbing;
        }

        .paper-grain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.16;
            mix-blend-mode: multiply;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            transition: opacity 0.3s ease;
        }

        .hint {
            position: absolute;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            color: #8f7d6a;
            font-size: 12px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-weight: 600;
            pointer-events: none;
            opacity: 0.65;
            transition: opacity 0.4s ease, color 0.3s ease;
            z-index: 10;
        }

        .performance-indicator {
            position: fixed;
            bottom: 14px;
            right: 14px;
            background: rgba(0,0,0,0.7);
            color: #4ade80;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-family: monospace;
            z-index: 10000;
        }

        /* Tweakpane UI Container */
        .tp-dfwv {
            position: fixed !important;
            top: 14px !important;
            right: 14px !important;
            width: 320px !important;
            max-height: calc(100vh - 28px) !important;
            overflow-y: auto !important;
            border-radius: 12px !important;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.22), 0 2px 8px rgba(0, 0, 0, 0.12) !important;
            z-index: 9999 !important;
        }

        .tp-dfwv::-webkit-scrollbar {
            width: 5px;
        }
        .tp-dfwv::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.25);
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <div class="paper-grain" id="paperGrain"></div>
        <div class="hint" id="hint">Drag to inspect • Scroll to zoom</div>
        <div class="performance-indicator" id="perfIndicator">FPS: --</div>
    </div>

    <!-- Three.js, OrbitControls & Tweakpane -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tweakpane@3.1.10/dist/tweakpane.min.js"></script>

    <script>
        // ─── Preset Color Palette Definitions ─────────────────────────────────────────
        const PRESETS = {
            'Ref 1: Cobalt & Sunset Orange': {
                shape: 'Hook Crest S-Loop',
                colors: ['#102fe0', '#2a55f5', '#8a10b2', '#de1245', '#ee400e', '#f5780a', '#e89e18'],
                bgClear: '#ede3d2',
                turns: 3.15,
                crestFold: 1.0,
                width: 62,
                fiberCount: 280,
                shininess: 85
            },
            'Ref 2: Lavender & Ocean Blue': {
                shape: 'Hook Crest S-Loop',
                colors: ['#a96bff', '#c495ff', '#e8d8ff', '#8e4bf2', '#3a4fe8', '#1b2ad4', '#0d1896'],
                bgClear: '#ede2d6',
                turns: 3.20,
                crestFold: 1.15,
                width: 66,
                fiberCount: 300,
                shininess: 95
            },
            'Classic Rainbow Spectrum': {
                shape: 'Spherical Coil',
                colors: ['#0f2be0', '#1c4ff8', '#4b1bcb', '#820fb0', '#bf0a74', '#df113d', '#ee3d0c', '#f4760a', '#eaa014'],
                bgClear: '#ede3d2',
                turns: 3.25,
                crestFold: 0.2,
                width: 60,
                fiberCount: 280,
                shininess: 85
            },
            'Cyberpunk Neon': {
                shape: 'Hook Crest S-Loop',
                colors: ['#00f5d4', '#00bbf9', '#7b2cbf', '#9d4edd', '#f72585', '#7209b7', '#3a0ca3'],
                bgClear: '#12111d',
                turns: 3.3,
                crestFold: 0.9,
                width: 64,
                fiberCount: 260,
                shininess: 120
            },
            'Sunset Ember & Gold': {
                shape: 'Spherical Coil',
                colors: ['#590d22', '#800f2f', '#a4133c', '#c9184a', '#ff4d6d', '#ff758f', '#ffb703', '#fb8500'],
                bgClear: '#ebded6',
                turns: 3.1,
                crestFold: 0.6,
                width: 65,
                fiberCount: 280,
                shininess: 90
            },
            'Emerald & Aureolin': {
                shape: 'Hook Crest S-Loop',
                colors: ['#081c15', '#1b4332', '#2d6a4f', '#40916c', '#52b788', '#74c69d', '#ffd166', '#f77f00'],
                bgClear: '#e2ece0',
                turns: 3.2,
                crestFold: 0.85,
                width: 62,
                fiberCount: 280,
                shininess: 85
            },
            'Midnight Pearl & Silver': {
                shape: 'Spherical Coil',
                colors: ['#0b132b', '#1c2541', '#3a506b', '#5bc0be', '#6fffe9', '#e0fbfc', '#ffffff'],
                bgClear: '#141a24',
                turns: 3.2,
                crestFold: 0.5,
                width: 60,
                fiberCount: 280,
                shininess: 110
            }
        };

        // ─── Global State Parameters ──────────────────────────────────────────────────
        const params = {
            preset: 'Ref 1: Cobalt & Sunset Orange',
            shape: 'Hook Crest S-Loop',

            c1: '#102fe0',
            c2: '#2a55f5',
            c3: '#8a10b2',
            c4: '#de1245',
            c5: '#ee400e',
            c6: '#f5780a',
            c7: '#e89e18',
            invertPalette: false,
            colorJitter: 0.05,

            sphereRadius: 195,
            turns: 3.15,
            crestFold: 1.0,
            width: 62,
            thickness: 16,
            fiberCount: 280,
            fiberRadius: 1.15,
            waviness: 1.0,
            strayFibers: 0.12,
            startFlick: true,

            shininess: 85,
            specularIntensity: 0.75,
            fiberOpacity: 0.88,
            underRibbonOpacity: 0.72,

            spinMode: 'Upward',
            spinSpeed: 0.55,
            floatingBob: true,
            bobAmplitude: 5.0,
            bobSpeed: 1.1,

            keyLightIntensity: 1.55,
            fillLightIntensity: 0.90,
            rimLightIntensity: 0.85,
            bgColor: '#ede3d2',
            paperGrain: true,
            grainOpacity: 0.16
        };

        // ─── Performance Settings ────────────────────────────────────────────────────
        const PERF = {
            spineSamples: 180,
            bristleSegs: 80,
            maxFibers: 300,
            rebuildDelay: 150,
            lastRebuild: 0
        };

        // ─── Scene & Camera Setup ────────────────────────────────────────────────────
        const container = document.getElementById('canvas-container');
        const paperGrainEl = document.getElementById('paperGrain');
        const hintEl = document.getElementById('hint');
        const perfIndicator = document.getElementById('perfIndicator');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 10, 3000);
        camera.position.set(0, 10, 620);

        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: true,
            powerPreference: "high-performance",
            preserveDrawingBuffer: true
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;
        container.appendChild(renderer.domElement);

        // ─── Orbit Controls ───────────────────────────────────────────────────────────
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.rotateSpeed = 0.75;
        controls.minDistance = 200;
        controls.maxDistance = 1200;
        controls.autoRotate = false;

        controls.addEventListener('start', () => {
            hintEl.style.opacity = '0';
        });

        // ─── Lighting Rig ─────────────────────────────────────────────────────────────
        const ambientLight = new THREE.AmbientLight(0xfff5ea, 0.75);
        scene.add(ambientLight);

        const keyLight = new THREE.DirectionalLight(0xfffcf0, params.keyLightIntensity);
        keyLight.position.set(280, 420, 380);
        scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0x8cb0ff, params.fillLightIntensity);
        fillLight.position.set(-360, 60, 260);
        scene.add(fillLight);

        const rimLight = new THREE.DirectionalLight(0xff4477, params.rimLightIntensity);
        rimLight.position.set(60, -320, -320);
        scene.add(rimLight);

        const innerLight = new THREE.PointLight(0xff7722, 0.8, 700);
        innerLight.position.set(0, 0, 0);
        scene.add(innerLight);

        // ─── Deterministic RNG with Seeded Cache ─────────────────────────────────────
        let seed = 884123;
        function rnd() {
            seed = (seed * 1664525 + 1013904223) & 0xffffffff;
            return (seed >>> 0) / 0xffffffff;
        }

        function rndRange(min, max) {
            return min + rnd() * (max - min);
        }

        // ─── Cached Spine Data ────────────────────────────────────────────────────────
        let cachedSpineData = null;
        let cachedSpineParams = null;

        function getSpineData(t) {
            const turns = params.turns;
            const theta = t * turns * Math.PI * 2 + 1.65;

            const lat = 1.05 - t * 2.10;
            const cosLat = Math.cos(lat);
            const sinLat = Math.sin(lat);

            const R = params.sphereRadius;
            const Rx = R * (1.0 + 0.06 * Math.sin(theta * 0.5));
            const Ry = R * 1.06;
            const Rz = R * (1.0 + 0.05 * Math.cos(theta * 0.5));

            let x = Rx * cosLat * Math.cos(theta);
            let y = Ry * sinLat;
            let z = Rz * cosLat * Math.sin(theta);

            if (params.shape === 'Hook Crest S-Loop') {
                const fold = params.crestFold;
                if (t < 0.26) {
                    const foldT = Math.sin((t / 0.26) * Math.PI);
                    x -= Math.sin(t * Math.PI * 3.5) * 35 * fold * foldT;
                    y += Math.cos(t * Math.PI * 3.5) * 25 * fold * foldT;
                    z += Math.sin(t * Math.PI * 2.0) * 30 * fold * foldT;
                }
            }

            if (params.startFlick && t < 0.08) {
                const tail = Math.pow(1 - t / 0.08, 1.5);
                x -= tail * 35;
                y += tail * 30;
                z -= tail * 15;
            }

            const sphereNorm = new THREE.Vector3(x / Rx, y / Ry, z / Rz).normalize();

            return {
                pos: new THREE.Vector3(x, y, z),
                sphereNorm: sphereNorm
            };
        }

        function computeSpineCache() {
            const key = `${params.turns}-${params.sphereRadius}-${params.crestFold}-${params.shape}-${params.startFlick}`;
            
            if (cachedSpineParams === key && cachedSpineData) {
                return cachedSpineData;
            }

            const SPINE_SAMPLES = PERF.spineSamples;
            const spineData = [];
            const spinePoints = [];

            for (let i = 0; i <= SPINE_SAMPLES; i++) {
                const data = getSpineData(i / SPINE_SAMPLES);
                spineData.push(data);
                spinePoints.push(data.pos);
            }

            const spineCurve = new THREE.CatmullRomCurve3(spinePoints, false, 'centripetal', 0.45);
            const spineFrames = [];

            for (let i = 0; i <= SPINE_SAMPLES; i++) {
                const t = i / SPINE_SAMPLES;
                const pt = spinePoints[i];
                const tangent = spineCurve.getTangentAt(t).normalize();
                const sphereNorm = spineData[i].sphereNorm;

                const binormal = new THREE.Vector3().crossVectors(tangent, sphereNorm).normalize();
                const normal = new THREE.Vector3().crossVectors(binormal, tangent).normalize();

                spineFrames.push({ pt, tangent, normal, binormal });
            }

            cachedSpineData = { frames: spineFrames, curve: spineCurve, samples: SPINE_SAMPLES };
            cachedSpineParams = key;
            
            return cachedSpineData;
        }

        function getFrameAt(t, cache) {
            const idxFloat = t * cache.samples;
            const idx = Math.min(Math.floor(idxFloat), cache.samples - 1);
            const frac = idxFloat - idx;
            const f1 = cache.frames[idx];
            const f2 = cache.frames[idx + 1] || f1;

            return {
                pt: f1.pt.clone().lerp(f2.pt, frac),
                tangent: f1.tangent.clone().lerp(f2.tangent, frac).normalize(),
                normal: f1.normal.clone().lerp(f2.normal, frac).normalize(),
                binormal: f1.binormal.clone().lerp(f2.binormal, frac).normalize(),
            };
        }

        // ─── Dynamic Palette Sampler ──────────────────────────────────────────────────
        function getActivePalette() {
            const rawColors = [params.c1, params.c2, params.c3, params.c4, params.c5, params.c6, params.c7];
            const list = params.invertPalette ? [...rawColors].reverse() : rawColors;
            return list.map((hex, i) => ({
                pos: i / (list.length - 1),
                color: new THREE.Color(hex)
            }));
        }

        function samplePaintColor(t, palette) {
            t = Math.max(0, Math.min(1, t));
            for (let i = 0; i < palette.length - 1; i++) {
                if (t >= palette[i].pos && t <= palette[i + 1].pos) {
                    const localT = (t - palette[i].pos) / (palette[i + 1].pos - palette[i].pos);
                    return palette[i].color.clone().lerp(palette[i + 1].color, localT);
                }
            }
            return palette[palette.length - 1].color.clone();
        }

        // ─── Optimized Brush Stroke Builder ──────────────────────────────────────────
        function buildBrushStroke() {
            const masterGroup = new THREE.Group();
            const palette = getActivePalette();
            const spineCache = computeSpineCache();

            const baseWidth = params.width;
            const baseThickness = params.thickness;

            function getWidth(t) {
                if (t < 0.08 && params.startFlick) {
                    return (baseWidth * 0.5) + (t / 0.08) * (baseWidth * 0.5);
                }
                const taper = Math.sin(t * Math.PI);
                return baseWidth * 0.85 + taper * (baseWidth * 0.35);
            }

            function getThickness(t) {
                return baseThickness * 0.85 + Math.sin(t * Math.PI) * (baseThickness * 0.45);
            }

            // ── Under-ribbon body layers (optimized) ──
            if (params.underRibbonOpacity > 0.02) {
                const NUM_LAYERS = 2;
                const RIBBON_SEGS = 120;

                for (let l = 0; l < NUM_LAYERS; l++) {
                    const ribbonGeom = new THREE.PlaneGeometry(1, 1, 12, RIBBON_SEGS);
                    const posAttr = ribbonGeom.attributes.position;
                    const colAttr = new Float32Array(posAttr.count * 3);

                    const layerH = (l - 0.5) * (baseThickness * 0.3);
                    const widthScale = 0.95 - l * 0.06;

                    for (let r = 0; r <= RIBBON_SEGS; r++) {
                        const t = r / RIBBON_SEGS;
                        const frame = getFrameAt(t, spineCache);
                        const w = getWidth(t) * widthScale;

                        for (let c = 0; c <= 12; c++) {
                            const vIdx = r * 13 + c;
                            const u = (c / 12) * 2 - 1;

                            posAttr.setXYZ(vIdx,
                                frame.pt.x + frame.binormal.x * (u * w * 0.5) + frame.normal.x * layerH,
                                frame.pt.y + frame.binormal.y * (u * w * 0.5) + frame.normal.y * layerH,
                                frame.pt.z + frame.binormal.z * (u * w * 0.5) + frame.normal.z * layerH
                            );

                            const colorT = (1 - u) * 0.5;
                            const color = samplePaintColor(colorT, palette);
                            colAttr[vIdx * 3] = color.r;
                            colAttr[vIdx * 3 + 1] = color.g;
                            colAttr[vIdx * 3 + 2] = color.b;
                        }
                    }

                    ribbonGeom.setAttribute('color', new THREE.BufferAttribute(colAttr, 3));
                    ribbonGeom.computeVertexNormals();

                    const ribbonMat = new THREE.MeshPhongMaterial({
                        vertexColors: true,
                        specular: new THREE.Color(0xffffff).multiplyScalar(params.specularIntensity),
                        shininess: params.shininess,
                        transparent: true,
                        opacity: params.underRibbonOpacity,
                        side: THREE.DoubleSide,
                        depthWrite: false
                    });

                    masterGroup.add(new THREE.Mesh(ribbonGeom, ribbonMat));
                }
            }

            // ── Individual bristle strands (optimized with merged geometry) ──
            const NUM_BRISTLES = Math.min(params.fiberCount, PERF.maxFibers);
            const BRISTLE_SEGS = PERF.bristleSegs;
            const waviness = params.waviness;

            // Pre-compute bristle data for batched geometry creation
            const bristleData = [];
            
            for (let bi = 0; bi < NUM_BRISTLES; bi++) {
                const uNorm = (bi / (NUM_BRISTLES - 1)) * 2 - 1;
                const uOffset = Math.sign(uNorm) * Math.pow(Math.abs(uNorm), 0.90) + rndRange(-0.02, 0.02);
                const vOffset = rndRange(-0.48, 0.48) * Math.sqrt(1 - Math.min(1, Math.abs(uOffset) * 0.85));

                let colT = (1 - uOffset) * 0.5;
                colT = Math.max(0, Math.min(1, colT + rndRange(-params.colorJitter, params.colorJitter)));
                const bristleColor = samplePaintColor(colT, palette);
                bristleColor.multiplyScalar(rndRange(0.88, 1.30));

                const isStray = rnd() < params.strayFibers;
                const spread = isStray ? rndRange(1.08, 1.35) : 1.0;

                const startT = (bi < 30 || rnd() > 0.85) ? rndRange(0.0, 0.05) : 0.0;
                const endT = (bi > NUM_BRISTLES - 30 || rnd() > 0.87) ? rndRange(0.95, 1.0) : 1.0;

                const waveFreq = rndRange(3, 8);
                const wavePhase = rndRange(0, Math.PI * 2);
                const waveAmp = rndRange(0.5, 2.2) * waviness;

                const radius = (isStray ? rndRange(0.5, 0.85) : rndRange(0.8, 1.7)) * (params.fiberRadius / 1.15);
                const opacity = (isStray ? rndRange(0.55, 0.78) : rndRange(0.82, 0.98)) * (params.fiberOpacity / 0.88);

                bristleData.push({
                    uOffset, vOffset, bristleColor, isStray, spread,
                    startT, endT, waveFreq, wavePhase, waveAmp, radius, opacity
                });
            }

            // Create merged geometry for all bristles
            const mergedPositions = [];
            const mergedNormals = [];
            const mergedColors = [];
            const mergedIndices = [];
            let vertexOffset = 0;

            for (const bd of bristleData) {
                const steps = Math.max(2, Math.floor(BRISTLE_SEGS * (bd.endT - bd.startT)));
                const ringVerts = 6; // Sides per tube ring

                for (let si = 0; si <= steps; si++) {
                    const localT = si / steps;
                    const t = bd.startT + localT * (bd.endT - bd.startT);
                    const frame = getFrameAt(t, spineCache);

                    const w = getWidth(t) * bd.spread;
                    const th = getThickness(t) * bd.spread;

                    const wave = Math.sin(t * Math.PI * bd.waveFreq + bd.wavePhase) * bd.waveAmp;

                    let fanning = 1.0;
                    if (t < 0.08 && params.startFlick) {
                        fanning = 1.0 + Math.pow(1 - t / 0.08, 1.5) * 0.45 * bd.uOffset;
                    }

                    const baseX = frame.pt.x + frame.binormal.x * (bd.uOffset * w * 0.5 * fanning + wave) + frame.normal.x * (bd.vOffset * th * 0.5);
                    const baseY = frame.pt.y + frame.binormal.y * (bd.uOffset * w * 0.5 * fanning + wave) + frame.normal.y * (bd.vOffset * th * 0.5);
                    const baseZ = frame.pt.z + frame.binormal.z * (bd.uOffset * w * 0.5 * fanning + wave) + frame.normal.z * (bd.vOffset * th * 0.5);

                    // Create ring of vertices around the point
                    for (let ring = 0; ring < ringVerts; ring++) {
                        const angle = (ring / ringVerts) * Math.PI * 2;
                        const nx = Math.cos(angle) * bd.radius;
                        const nz = Math.sin(angle) * bd.radius;

                        // Transform normal by frame
                        const worldNX = frame.binormal.x * nx + frame.normal.x * nz;
                        const worldNY = frame.binormal.y * nx + frame.normal.y * nz;
                        const worldNZ = frame.binormal.z * nx + frame.normal.z * nz;

                        mergedPositions.push(baseX + worldNX, baseY + worldNY, baseZ + worldNZ);
                        mergedNormals.push(worldNX / bd.radius, worldNY / bd.radius, worldNZ / bd.radius);
                        mergedColors.push(bd.bristleColor.r, bd.bristleColor.g, bd.bristleColor.b);
                    }

                    // Create triangles between rings
                    if (si < steps) {
                        for (let ring = 0; ring < ringVerts; ring++) {
                            const curr = vertexOffset + ring;
                            const next = vertexOffset + ((ring + 1) % ringVerts);
                            const currNext = curr + ringVerts;
                            const nextNext = next + ringVerts;

                            mergedIndices.push(curr, currNext, next);
                            mergedIndices.push(next, currNext, nextNext);
                        }
                    }
                }

                vertexOffset += (steps + 1) * ringVerts;
            }

            // Create merged buffer geometry
            const mergedGeom = new THREE.BufferGeometry();
            mergedGeom.setAttribute('position', new THREE.Float32BufferAttribute(mergedPositions, 3));
            mergedGeom.setAttribute('normal', new THREE.Float32BufferAttribute(mergedNormals, 3));
            mergedGeom.setAttribute('color', new THREE.Float32BufferAttribute(mergedColors, 3));
            mergedGeom.setIndex(mergedIndices);
            mergedGeom.computeVertexNormals();

            const mergedMat = new THREE.MeshPhongMaterial({
                vertexColors: true,
                specular: new THREE.Color(0xffffff).multiplyScalar(params.specularIntensity),
                shininess: params.shininess,
                transparent: true,
                opacity: params.fiberOpacity,
                side: THREE.FrontSide
            });

            masterGroup.add(new THREE.Mesh(mergedGeom, mergedMat));

            return masterGroup;
        }

        // ─── Artwork Lifecycle Management ─────────────────────────────────────────────
        const pivotGroup = new THREE.Group();
        pivotGroup.position.set(0, -12, 0);
        pivotGroup.rotation.x = 0.52;
        pivotGroup.rotation.z = -0.24;
        pivotGroup.rotation.y = -0.15;
        scene.add(pivotGroup);

        let currentBrushArt = null;
        let rebuildTimeout = null;

        function scheduleRebuild() {
            if (rebuildTimeout) clearTimeout(rebuildTimeout);
            rebuildTimeout = setTimeout(() => {
                rebuildArtwork();
            }, PERF.rebuildDelay);
        }

        function rebuildArtwork() {
            seed = 884123;
            cachedSpineData = null;
            cachedSpineParams = null;

            if (currentBrushArt) {
                pivotGroup.remove(currentBrushArt);
                currentBrushArt.traverse(child => {
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) {
                        if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
                        else child.material.dispose();
                    }
                });
            }

            currentBrushArt = buildBrushStroke();
            pivotGroup.add(currentBrushArt);
            PERF.lastRebuild = performance.now();
        }

        function updateLighting() {
            keyLight.intensity = params.keyLightIntensity;
            fillLight.intensity = params.fillLightIntensity;
            rimLight.intensity = params.rimLightIntensity;
        }

        function updateBackground() {
            container.style.background = params.bgColor;
            paperGrainEl.style.display = params.paperGrain ? 'block' : 'none';
            paperGrainEl.style.opacity = params.grainOpacity;

            const c = new THREE.Color(params.bgColor);
            const luminance = 0.299 * c.r + 0.587 * c.g + 0.114 * c.b;
            hintEl.style.color = luminance < 0.4 ? 'rgba(255,255,255,0.65)' : '#8f7d6a';
        }

        // Initial Build
        rebuildArtwork();
        updateBackground();

        // ─── Tweakpane UI Setup ──────────────────────────────────────────────────────
        try {
            const PaneClass = (window.Tweakpane && (window.Tweakpane.Pane || window.Tweakpane)) || window.Pane;
            
            if (PaneClass) {
                const pane = new PaneClass({
                    title: '🎨 3D Brush Sculpture Studio',
                    expanded: true
                });

                function addControl(parent, obj, prop, opt) {
                    if (typeof parent.addBinding === 'function') {
                        return parent.addBinding(obj, prop, opt);
                    } else if (typeof parent.addInput === 'function') {
                        return parent.addInput(obj, prop, opt);
                    } else {
                        return parent.add(obj, prop, opt);
                    }
                }

                // 1. Presets Folder
                const fPresets = pane.addFolder({ title: '🌟 Style Presets', expanded: true });
                addControl(fPresets, params, 'preset', {
                    options: Object.keys(PRESETS).reduce((acc, key) => ({ ...acc, [key]: key }), {})
                }).on('change', (ev) => {
                    const val = ev.value !== undefined ? ev.value : ev;
                    const pr = PRESETS[val];
                    if (pr) {
                        params.shape = pr.shape;
                        params.c1 = pr.colors[0] || params.c1;
                        params.c2 = pr.colors[1] || params.c2;
                        params.c3 = pr.colors[2] || params.c3;
                        params.c4 = pr.colors[3] || params.c4;
                        params.c5 = pr.colors[4] || params.c5;
                        params.c6 = pr.colors[5] || params.c6;
                        params.c7 = pr.colors[6] || params.c7;
                        params.turns = pr.turns;
                        params.crestFold = pr.crestFold;
                        params.width = pr.width;
                        params.fiberCount = pr.fiberCount;
                        params.shininess = pr.shininess;
                        params.bgColor = pr.bgClear;

                        pane.refresh();
                        updateBackground();
                        rebuildArtwork();
                    }
                });

                // 2. Palette & Pigment Folder
                const fPalette = pane.addFolder({ title: '🌈 Multi-Pigment Palette', expanded: false });
                addControl(fPalette, params, 'c1', { label: 'Outer Edge' }).on('change', scheduleRebuild);
                addControl(fPalette, params, 'c2', { label: 'Outer Mid' }).on('change', scheduleRebuild);
                addControl(fPalette, params, 'c3', { label: 'Mid Purple' }).on('change', scheduleRebuild);
                addControl(fPalette, params, 'c4', { label: 'Core Magenta' }).on('change', scheduleRebuild);
                addControl(fPalette, params, 'c5', { label: 'Core Crimson' }).on('change', scheduleRebuild);
                addControl(fPalette, params, 'c6', { label: 'Inner Amber' }).on('change', scheduleRebuild);
                addControl(fPalette, params, 'c7', { label: 'Inner Gold' }).on('change', scheduleRebuild);
                addControl(fPalette, params, 'invertPalette', { label: 'Invert Pigment' }).on('change', scheduleRebuild);
                addControl(fPalette, params, 'colorJitter', { min: 0.0, max: 0.15, step: 0.01, label: 'Color Striation' }).on('change', scheduleRebuild);

                // 3. Geometry & Sculpture Folder
                const fGeometry = pane.addFolder({ title: '📐 Geometry & Sculpture', expanded: true });
                addControl(fGeometry, params, 'shape', {
                    label: 'Form Type',
                    options: {
                        'Hook Crest S-Loop (Ref)': 'Hook Crest S-Loop',
                        'Spherical Coil': 'Spherical Coil'
                    }
                }).on('change', rebuildArtwork);
                addControl(fGeometry, params, 'crestFold', { min: 0.0, max: 2.0, step: 0.05, label: 'Crest Hook Fold' }).on('change', rebuildArtwork);
                addControl(fGeometry, params, 'turns', { min: 2.0, max: 4.5, step: 0.05, label: 'Coil Turns' }).on('change', rebuildArtwork);
                addControl(fGeometry, params, 'sphereRadius', { min: 140, max: 260, step: 5, label: 'Sphere Radius' }).on('change', rebuildArtwork);
                addControl(fGeometry, params, 'width', { min: 30, max: 100, step: 2, label: 'Stroke Width' }).on('change', scheduleRebuild);
                addControl(fGeometry, params, 'thickness', { min: 6, max: 32, step: 1, label: 'Stroke Depth' }).on('change', scheduleRebuild);
                addControl(fGeometry, params, 'fiberCount', { min: 80, max: 300, step: 10, label: 'Bristle Density' }).on('change', rebuildArtwork);
                addControl(fGeometry, params, 'fiberRadius', { min: 0.5, max: 2.5, step: 0.1, label: 'Bristle Size' }).on('change', scheduleRebuild);
                addControl(fGeometry, params, 'waviness', { min: 0.0, max: 3.0, step: 0.1, label: 'Bristle Wiggle' }).on('change', scheduleRebuild);
                addControl(fGeometry, params, 'strayFibers', { min: 0.0, max: 0.35, step: 0.01, label: 'Stray Bristles' }).on('change', scheduleRebuild);
                addControl(fGeometry, params, 'startFlick', { label: 'Top Brush Flick' }).on('change', rebuildArtwork);

                // 4. Material & Paint Surface Folder
                const fMaterial = pane.addFolder({ title: '✨ Paint Luster & Finish', expanded: false });
                addControl(fMaterial, params, 'shininess', { min: 10, max: 150, step: 5, label: 'Wet Gloss' }).on('change', scheduleRebuild);
                addControl(fMaterial, params, 'specularIntensity', { min: 0.1, max: 2.0, step: 0.05, label: 'Highlights' }).on('change', scheduleRebuild);
                addControl(fMaterial, params, 'fiberOpacity', { min: 0.4, max: 1.0, step: 0.02, label: 'Bristle Opacity' }).on('change', scheduleRebuild);
                addControl(fMaterial, params, 'underRibbonOpacity', { min: 0.0, max: 1.0, step: 0.05, label: 'Under-Body Fill' }).on('change', scheduleRebuild);

                // 5. Motion & Spin Controls
                const fMotion = pane.addFolder({ title: '🌪️ Motion & Spin Dynamics', expanded: true });
                addControl(fMotion, params, 'spinMode', {
                    label: 'Spin Direction',
                    options: {
                        'Upward (Default)': 'Upward',
                        'Downward': 'Downward',
                        'Paused': 'Paused'
                    }
                });
                addControl(fMotion, params, 'spinSpeed', { min: 0.0, max: 2.0, step: 0.05, label: 'Spin Velocity' });
                addControl(fMotion, params, 'floatingBob', { label: 'Floating Bob' });
                addControl(fMotion, params, 'bobAmplitude', { min: 0.0, max: 18.0, step: 0.5, label: 'Bob Amplitude' });
                addControl(fMotion, params, 'bobSpeed', { min: 0.1, max: 3.0, step: 0.1, label: 'Bob Speed' });

                // 6. Lighting & Canvas Background
                const fEnvironment = pane.addFolder({ title: '💡 Lighting & Canvas', expanded: false });
                addControl(fEnvironment, params, 'bgColor', { label: 'Background' }).on('change', updateBackground);
                addControl(fEnvironment, params, 'paperGrain', { label: 'Canvas Texture' }).on('change', updateBackground);
                addControl(fEnvironment, params, 'grainOpacity', { min: 0.0, max: 0.4, step: 0.02, label: 'Grain Opacity' }).on('change', updateBackground);
                addControl(fEnvironment, params, 'keyLightIntensity', { min: 0.2, max: 3.0, step: 0.1, label: 'Sun Key Light' }).on('change', updateLighting);
                addControl(fEnvironment, params, 'fillLightIntensity', { min: 0.0, max: 2.0, step: 0.1, label: 'Sky Fill Light' }).on('change', updateLighting);
                addControl(fEnvironment, params, 'rimLightIntensity', { min: 0.0, max: 2.0, step: 0.1, label: 'Rim Light' }).on('change', updateLighting);

                // 7. Action Buttons
                const fActions = pane.addFolder({ title: '⚡ Quick Actions', expanded: true });
                fActions.addButton({ title: '🎲 Randomize Palette & Form' }).on('click', () => {
                    const randomColor = () => '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
                    params.c1 = randomColor();
                    params.c2 = randomColor();
                    params.c3 = randomColor();
                    params.c4 = randomColor();
                    params.c5 = randomColor();
                    params.c6 = randomColor();
                    params.c7 = randomColor();
                    params.turns = 2.8 + Math.random() * 0.8;
                    params.crestFold = 0.5 + Math.random() * 1.0;
                    params.width = 50 + Math.random() * 25;
                    pane.refresh();
                    rebuildArtwork();
                });

                fActions.addButton({ title: '📸 Save High-Res Artwork PNG' }).on('click', () => {
                    renderer.render(scene, camera);
                    const dataURL = renderer.domElement.toDataURL('image/png');
                    const link = document.createElement('a');
                    link.download = `brush-sculpture-${Date.now()}.png`;
                    link.href = dataURL;
                    link.click();
                });

                fActions.addButton({ title: '🔄 Reset to Reference 1' }).on('click', () => {
                    params.preset = 'Ref 1: Cobalt & Sunset Orange';
                    const pr = PRESETS[params.preset];
                    params.shape = pr.shape;
                    params.c1 = pr.colors[0];
                    params.c2 = pr.colors[1];
                    params.c3 = pr.colors[2];
                    params.c4 = pr.colors[3];
                    params.c5 = pr.colors[4];
                    params.c6 = pr.colors[5];
                    params.c7 = pr.colors[6];
                    params.turns = pr.turns;
                    params.crestFold = pr.crestFold;
                    params.width = pr.width;
                    params.fiberCount = pr.fiberCount;
                    params.shininess = pr.shininess;
                    params.bgColor = '#ede3d2';
                    pane.refresh();
                    updateBackground();
                    rebuildArtwork();
                });
            }
        } catch (e) {
            console.error('Tweakpane init warning:', e);
        }

        // ─── FPS Counter ─────────────────────────────────────────────────────────────
        let frameCount = 0;
        let lastFPSTime = performance.now();

        function updateFPS() {
            frameCount++;
            const now = performance.now();
            if (now - lastFPSTime >= 1000) {
                const fps = Math.round(frameCount * 1000 / (now - lastFPSTime));
                perfIndicator.textContent = `FPS: ${fps}`;
                perfIndicator.style.color = fps >= 50 ? '#4ade80' : fps >= 30 ? '#fbbf24' : '#ef4444';
                frameCount = 0;
                lastFPSTime = now;
            }
        }

        // ─── Main Animation Loop ─────────────────────────────────────────────────────
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.1);
            const elapsed = clock.getElapsedTime();

            // Continuous axial spin
            if (currentBrushArt && params.spinMode !== 'Paused') {
                const direction = params.spinMode === 'Upward' ? -1 : 1;
                currentBrushArt.rotation.y += direction * delta * params.spinSpeed;
            }

            // Floating organic bob
            if (params.floatingBob) {
                pivotGroup.position.y = -12 + Math.sin(elapsed * params.bobSpeed) * params.bobAmplitude;
                pivotGroup.rotation.z = -0.24 + Math.sin(elapsed * 0.4) * 0.025;
            }

            controls.update();
            renderer.render(scene, camera);
            updateFPS();
        }

        animate();

        // ─── Responsive Window Resize ─────────────────────────────────────────────────
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });

        // ─── Visibility Change Handler ──────────────────────────────────────────────
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                clock.stop();
            } else {
                clock.start();
            }
        });
    </script>
</body>
</html>
