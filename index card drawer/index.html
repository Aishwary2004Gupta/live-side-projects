<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sam's Secret Files</title>
<style>
  :root {
    --bg: #e8e6df;
    --card-bg: #f3f1ea;
    --ink: #1a1a1a;
    --border: #1a1a1a;
    --tab-black: #111111;
    --tab-white: #f3f1ea;
    --label-gold: #c9b458;
    --shadow: rgba(0,0,0,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    font-family: 'Courier New', Courier, monospace;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    padding-bottom: 40px;
  }

  .viewport {
    position: relative;
    width: 95%;
    max-width: 700px;
    height: 85vh;
    max-height: 800px;
    perspective: 1000px;
  }

  /* The Card Stack */
  .stack {
    position: absolute;
    bottom: 60px; /* Above drawer face */
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    height: calc(100% - 80px);
  }

  .card {
    position: absolute;
    width: 100%;
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-radius: 3px 3px 0 0;
    cursor: pointer;
    transition: transform 0.55s cubic-bezier(0.23, 1, 0.32, 1), 
                height 0.5s cubic-bezier(0.23, 1, 0.32, 1),
                box-shadow 0.35s ease,
                z-index 0s 0s;
    transform-origin: top center;
    z-index: var(--z);
    overflow: hidden;
  }

  .card:hover:not(.open):not(.below-open) {
    transform: translateY(-6px) scale(1.01);
    z-index: 200 !important;
  }

  /* Tab Styling */
  .tab {
    position: absolute;
    top: -19px;
    width: 90px;
    height: 20px;
    background: var(--tab-white);
    border: 1.5px solid var(--border);
    border-bottom: none;
    border-radius: 6px 6px 0 0;
    left: var(--pos);
    transform: translateX(-50%);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 8px 3px;
    font-size: 10px;
    font-weight: bold;
    color: var(--ink);
    z-index: 2;
  }

  .tab::before {
    /* Subtle 3D lip */
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: inherit;
    filter: brightness(0.9);
  }

  .tab.black {
    background: var(--tab-black);
    color: #fff;
  }

  .card-inner {
    height: 48px;
    border-bottom: 1px solid rgba(26,26,26,0.15);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    opacity: 1;
    transition: opacity 0.2s ease;
  }

  /* Content Area (Hidden by default) */
  .content {
    position: absolute;
    top: 48px;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--card-bg);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease 0.1s;
    padding: 20px;
    display: flex;
    flex-direction: column;
  }

  .content h2 {
    font-size: 13px;
    margin-bottom: 4px;
    color: var(--ink);
  }

  .content p {
    font-size: 10px;
    color: #777;
    margin-bottom: 16px;
  }

  .content-image {
    flex: 1;
    width: 100%;
    object-fit: contain;
    object-position: center top;
    max-height: 220px;
  }

  /* Open State */
  .card.open {
    z-index: 500 !important;
    transform: translateY(-180px) !important;
    height: 380px !important;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1),
                height 0.6s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.4s ease,
                z-index 0s 0s;
  }

  .card.open .content {
    opacity: 1;
    pointer-events: auto;
  }

  .card.open .card-inner {
    opacity: 0;
  }

  /* Push down cards below the opened one */
  .card.below-open {
    filter: brightness(0.97);
  }

  /* Drawer Base */
  .drawer-base {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 102%; /* slightly wider for 3D */
    height: 70px;
    background: linear-gradient(to bottom, #dcd8cc 0%, #b8b4a8 100%);
    border-top: 3px solid var(--border);
    border-radius: 4px 4px 8px 8px;
    box-shadow: inset 0 4px 12px rgba(255,255,255,0.4),
                0 10px 30px rgba(0,0,0,0.2);
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .drawer-face-front {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: -20px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.05) 0%, transparent 100%);
    border-top: 1px solid rgba(255,255,255,0.5);
  }

  .gold-label {
    background: linear-gradient(135deg, #e0c87a 0%, #bfa44f 100%);
    color: #3a3500;
    padding: 6px 20px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 0.05em;
    border: 1px solid rgba(255,255,255,0.3);
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    z-index: 11;
    position: relative;
  }

  /* Decorative UI from screenshot (fake player) */
  .player-ui {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 12px;
    color: #666;
    font-size: 10px;
    opacity: 0.6;
    z-index: 12;
  }
  .player-ui span { cursor: default; }

  /* Mobile adjustments */
  @media (max-height: 750px) {
    .card.open { transform: translateY(-140px) !important; height: 320px !important; }
    .stack { bottom: 50px; }
  }
</style>
</head>
<body>

<div class="viewport">
  <div class="stack" id="stack"></div>
  
  <div class="drawer-base">
    <div class="drawer-face-front"></div>
    <div class="gold-label">sam's secret files</div>
    
    <div class="player-ui">
      <span>▶</span>
      <span>0:00 / 0:11</span>
      <span>🔊</span>
      <span>⛶</span>
    </div>
  </div>
</div>

<script>
  // Data matching the visual exactly
  const FILES = [
    { id: '94', name: 'oil lamp', type: 'normal' },
    { id: '95', name: 'oats', type: 'normal' },
    { id: 'O', num: '010', name: '', type: 'divider' }, // Black tab
    { id: '96', name: 'pants', type: 'normal' },
    { id: '97', name: 'plane', type: 'normal' },
    { id: '98', name: 'plant 003', type: 'normal', img: 'https://images.unsplash.com/photo-1459411552884-841db9b3cc2a?w=400&auto=format&fit=crop&q=60' },
    { id: '99', name: 'pomelo', type: 'normal' },
    { id: '100', name: 'phisher', type: 'normal' },
    { id: '101', name: 'palo alto', type: 'normal' },
    { id: '102', name: 'pencile', type: 'normal' },
    { id: '103', name: 'photos', type: 'normal' },
    { id: '104', name: 'quiet', type: 'normal' },
    { id: 'P', num: '012', name: '', type: 'divider' }, // Black tab
    { id: '105', name: 'queen', type: 'normal' },
    { id: '106', name: 'questions', type: 'normal' },
    { id: '107', name: 'quizz', type: 'normal' },
    { id: '108', name: 'quit', type: 'normal' },
    { id: 'Q', num: '005', name: '', type: 'divider' }, // Black tab
    { id: '109', name: 'raccoon', type: 'normal' },
    { id: '110', name: '', type: 'normal', empty: true },
    { id: '111', name: 'rizz', type: 'normal' },
    { id: '112', name: 'rum', type: 'normal' },
    { id: '113', name: 'generic guy', type: 'normal', img: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=400&auto=format&fit=crop&q=60' },
    { id: 'R', num: '002', name: '', type: 'divider' }, // Black tab
    { id: '114', name: 'rain', type: 'normal' },
    { id: '115', name: 'rug', type: 'normal' },
    { id: '116', name: 'ruby', type: 'normal' },
    { id: '117', name: 'sider', type: 'normal' },
    { id: '118', name: 'sony', type: 'normal', img: 'https://images.unsplash.com/photo-1545127398-14699f92334b?w=400&auto=format&fit=crop&q=60' },
    { id: '119', name: 'sun', type: 'normal' },
    { id: '120', name: 'seller', type: 'normal' },
    { id: '121', name: 'sims', type: 'normal' },
    { id: '122', name: 'slides', type: 'normal' },
    { id: '123', name: 'simpsons', type: 'normal' },
    { id: 'S', num: '002', name: '', type: 'divider' }, // Black tab
    { id: '124', name: 'sir', type: 'normal' }
  ];

  // Tab positions (percentage from left) - alternates for realistic look
  const TAB_POSITIONS = [18, 82, 50, 28, 72, 42]; 

  const stack = document.getElementById('stack');
  let currentlyOpen = null;

  FILES.forEach((file, i) => {
    const card = document.createElement('article');
    card.className = 'card';
    card.dataset.index = i;
    
    // Stacking logic: each card is 22px lower than last
    const yOffset = i * 22;
    card.style.top = `${yOffset}px`;
    card.style.setProperty('--z', i + 1);
    card.style.setProperty('--pos', `${TAB_POSITIONS[i % TAB_POSITIONS.length]}%`);

    const isBlack = file.type === 'divider';
    const tabClass = isBlack ? 'tab black' : 'tab';
    
    // Build tab content
    let tabLeft = file.id || '';
    let tabRight = file.num || file.name || (file.empty ? '' : '');
    
    // Special handling for dividers which show Letter and Number
    if (isBlack) {
      tabLeft = file.id;
      tabRight = file.num;
    }

    card.innerHTML = `
      <div class="${tabClass}">
        <span>${tabLeft}</span>
        <span style="text-align:right">${tabRight}</span>
      </div>
      <div class="card-inner">
        ${!isBlack && file.name ? `<span>${file.id}</span><span>${file.name}</span>` : ''}
        ${isBlack ? `<span></span>` : ''}
      </div>
      <div class="content">
        <h2>${file.name || file.id}</h2>
        <p>details</p>
        ${file.img ? `<img src="${file.img}" alt="" class="content-image">` : `<div style="flex:1;display:flex;align-items:center;justify-content:center;color:#ccc;font-size:11px;border:1px dashed #ccc;margin-top:10px;">[file encrypted]</div>`}
      </div>
    `;

    // Click handler
    card.addEventListener('click', () => toggleCard(card));

    stack.appendChild(card);
  });

  function toggleCard(clickedCard) {
    // If clicking already open card, close it
    if (currentlyOpen === clickedCard) {
      closeCard(clickedCard);
      return;
    }

    // Close previous if exists
    if (currentlyOpen) {
      closeCard(currentlyOpen);
    }

    // Open new
    openCard(clickedCard);
  }

  function openCard(card) {
    currentlyOpen = card;
    
    // Mark all cards below this one
    const idx = parseInt(card.dataset.index);
    document.querySelectorAll('.card').forEach((c, i) => {
      if (i > idx) c.classList.add('below-open');
      else c.classList.remove('below-open');
    });

    card.classList.add('open');
  }

  function closeCard(card) {
    card.classList.remove('open');
    // Reset below markers after animation
    setTimeout(() => {
      document.querySelectorAll('.card').forEach(c => c.classList.remove('below-open'));
    }, 300);
    currentlyOpen = null;
  }
</script>
</body>
</html>
