<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interstellar</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="script.js" defer></script>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <textarea
      id="codeEditor"
      class="editor"
      spellcheck="false"
      autocorrect="off"
      autocapitalize="off"
      translate="no"
    ></textarea>
    <pre id="error"></pre>
    <div id="indicator"></div>

    <div id="controls">
      <div class="controls">
        <input
          id="btnToggleView"
          class="icon"
          type="checkbox"
          name="toggleView"
        />
        <input
          id="btnToggleResolution"
          class="icon"
          type="checkbox"
          name="toggleResolution"
        />
        <input id="btnReset" class="icon" type="checkbox" name="reset" />
      </div>
    </div>

    <script type="x-shader/x-fragment">
      //version 300 es
precision highp float;
out vec4 O;

uniform float time;
uniform vec2 resolution;
uniform vec2 move;
uniform vec2 wheel;

#define FC gl_FragCoord.xy
#define R resolution
#define T (25.+time)
#define S smoothstep
#define N normalize
#define MN min(R.x,R.y)
#define rnd(p) fract(sin(dot(p,vec2(12.9898,78.233)))*345678.)
#define rot(a) mat2(cos((a)-vec4(0,11,33,0)))

// Function for a rounded box
float roundBox(vec3 p, vec3 s, float r) {
    p = abs(p) - s + r;
    return length(max(p, .0)) + min(.0, max(max(p.x, p.y), p.z)) - r;
}

// --- Modified map function to generate individual books on shelves ---
float map(vec3 p) {
    // Save global position for later use
    vec3 pos = p;

    // Create a floor at y=-3
    p.y += 3.0;

    // Calculate shelf and column indices based on position
    vec2 id = floor(p.xz);
    
    // Randomly shift columns for visual variety
    if (mod(id.y, 2.0) == 0.0) {
        p.x -= T * 0.5;
        id.x = floor(p.x);
    }

    // Randomize book properties for each shelf location
    float seed = rnd(id + pos.y * 100.0);
    float bookWidth  = 0.15 + 0.25 * sin(seed * 10.0);
    float bookHeight = 1.8 + 0.4 * cos(seed * 10.0 + 1.0);
    float bookDepth  = 0.2 + 0.1 * sin(seed * 10.0 + 2.0);
    
    // Get fractional part to position the book inside its shelf cell
    vec3 localPos = fract(p) - vec3(0.5, 0.5, 0.5);
    
    // Move books to their final positions on the shelf
    vec3 bookOffset = localPos;
    bookOffset.x *= bookWidth;
    bookOffset.y *= bookHeight;
    bookOffset.z *= bookDepth;
    
    // Final distance field for this single book
    float d = roundBox(bookOffset, vec3(bookWidth/2.0, bookHeight/2.0, bookDepth/2.0), 0.01);

    return d;
}

// --- Rest of the shader code remains mostly the same for lighting and camera ---

// Calculate surface normals from the map
vec3 norm(vec3 p) {
    float h = 1e-3; 
    vec2 k = vec2(-1, 1);
    return N(k.xyy * map(p + k.xyy * h) + k.yxy * map(p + k.yxy * h) + k.yyx * map(p + k.yyx * h) + k.xxx * map(p + k.xxx * h));
}

// Raymarching loop to find intersections with the map
bool march(inout vec3 p, vec3 rd, out float dd) {
    for (int i = 0; i < 400; i++) {
        float d = map(p);
        if (abs(d) < 1e-3) return true; // Hit
        if (dd > 15.0) return false;    // Missed after traveling too far
        p += rd * d * 0.5;              // Step towards object
        dd += d * 0.5;                  // Accumulate traveled distance
    }
    return false;
}

// Ambient occlusion calculation
float occ(vec3 p, vec3 n, float d) {
    return clamp(map(p + n * d) / d, 0.0, 1.0);
}

// Generate ray direction based on screen coordinates
vec3 dir(vec2 uv, vec3 p, vec3 t, float z) {
    vec3 up = vec3(0, 1, 0),
        f = N(t - p),
        r = N(cross(up, f)),
        u = N(cross(f, r));
    return mat3(r, u, f) * N(vec3(uv, z));
}

// Apply rotation to camera movement
void cam(inout vec3 p) {
    p.xz *= rot(0.2 - move.x / MN + 0.2 * T * 0.01);
}

vec3 render(vec2 uv) {
    vec3 col = vec3(0),
        p = vec3(0, -0.3, -23.5 - wheel.y / MN - 1e2 * sin(T * 5e-3));
    
    cam(p);
    
    // Define light position (above the scene)
    vec3 rd = dir(uv, p, vec3(0, 5.5, 0), 1.2), lp = p;
    lp.z += 0.5; 

    float dd;
    if (march(p, rd, dd)) {
        vec3 n = norm(p);
        vec3 l = N(lp - p); // Direction to light
        
        // Diffuse lighting component
        float dif = clamp(dot(l, n), 0.0, 1.0);
        
        // Specular highlight component (kept low for a matte look)
        float spe = pow(clamp(dot(N(lp - rd), n), 0.0, 1.0), 21.0) * 0.5;
        
        // Ambient Occlusion for soft shadows
        float ao = occ(p, n, 0.5) * 0.8 * occ(p, n, 1.0);
        
        // Distance-based light attenuation
        float ld = distance(lp, p);
        float atten = 1.0 / (1.0 + ld * 0.25 + ld * ld * 0.125);
        
        // Base material color (warm tones like old paper)
        vec3 mat = vec3(4, 1.6, 0.6);
        
        // Combine lighting components
        col += 0.08 + dif * mat * ao * atten; // Diffuse
        col += spe * atten;                   // Specular
    }
    
    // Tone mapping and post-processing
    col = mix(vec3(0), col, exp(-125e-5 * dd * dd * dd));
    col = tanh(col * col);
    col = sqrt(col);
    col = mix(vec3(0), col, min(time * 0.3, 1.0));

    // Vignette effect (darken edges)
    vec2 c = FC / R;
    c *= 1.0 - c.yx;
    float vig = c.x * c.y * 25.0;
    vig = pow(vig, 0.5);
    col *= vig;
    return col;
}

void main() {
    vec2 uv = (FC - 0.5 * R) / MN;
    vec3 col = render(uv);
    O = vec4(col, 1);
}
    </script>
  </body>
</html>
