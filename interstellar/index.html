<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interstellar</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="script.js" defer></script>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <textarea
      id="codeEditor"
      class="editor"
      spellcheck="false"
      autocorrect="off"
      autocapitalize="off"
      translate="no"
    ></textarea>
    <pre id="error"></pre>
    <div id="indicator"></div>
    <div id="controls">
      <div class="controls">
        <input
          id="btnToggleView"
          class="icon"
          type="checkbox"
          name="toggleView"
        />
        <input
          id="btnToggleResolution"
          class="icon"
          type="checkbox"
          name="toggleResolution"
        />
        <input id="btnReset" class="icon" type="checkbox" name="reset" />
      </div>
    </div>
    <script type="x-shader/x-fragment">
      #version 300 es
      precision highp float;
      out vec4 O;
      uniform float time;
      uniform vec2 resolution;
      uniform vec2 move;
      uniform vec2 wheel;
      #define FC gl_FragCoord.xy
      #define R resolution
      #define T (25.0 + time)
      #define N normalize
      #define MN min(R.x, R.y)
      #define rnd(p) fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453)
      #define rot(a) mat2(cos((a) - vec4(0.0, 11.0, 33.0, 0.0)))

      float box(vec3 p, vec3 s) {
        vec3 q = abs(p) - s;
        return length(max(q, 0.0)) + min(0.0, max(max(q.x, q.y), q.z));
      }

      void cell(vec3 p, out vec3 q, out vec2 id) {
        vec2 grid = vec2(3.15, 2.8);
        id = floor((p.xy + grid * 0.5) / grid);
        q = p;
        q.xy = mod(p.xy + grid * 0.5, grid) - grid * 0.5;
      }

      float structure(vec3 p) {
        vec3 q; vec2 id;
        cell(p, q, id);
        float d = 1e5;
        d = min(d, box(q - vec3(-1.47, 0.0, 0.0), vec3(0.11, 1.42, 0.34)));
        d = min(d, box(q - vec3( 1.47, 0.0, 0.0), vec3(0.11, 1.42, 0.34)));
        d = min(d, box(q - vec3(0.0, -1.36, 0.0), vec3(1.48, 0.10, 0.34)));
        d = min(d, box(q - vec3(0.0,  1.36, 0.0), vec3(1.48, 0.10, 0.34)));
        d = min(d, box(q - vec3(0.0, 0.0, 0.40), vec3(1.48, 1.40, 0.08)));
        return d;
      }

      float windowScene(vec3 p) {
        vec3 q; vec2 id;
        cell(p, q, id);
        float window = step(0.48, rnd(id + 4.7));
        float d = box(q - vec3(0.0, 0.05, -0.05), vec3(0.92, 0.92, 0.12));
        return mix(1e5, d, window);
      }

      float bookScene(vec3 p) {
        vec3 q; vec2 id;
        cell(p, q, id);
        float d = 1e5;
        float window = step(0.48, rnd(id + 4.7));
        for (int i = 0; i < 7; i++) {
          float row = float(i);
          float y = -1.08 + row * 0.34;
          float width = 0.82 + 0.42 * rnd(id + row * 3.1);
          float height = 0.10 + 0.045 * rnd(id + row * 8.3);
          float lean = (rnd(id + row * 12.7) - 0.5) * 0.10;
          vec2 xy = rot(lean) * vec2(q.x, q.y - y);
          d = min(d, box(vec3(xy.x, xy.y, q.z + 0.05), vec3(width, height, 0.48)));
        }
        return mix(d, 1e5, window);
      }

      float lightScene(vec3 p) {
        vec3 q; vec2 id;
        cell(p, q, id);
        float window = step(0.48, rnd(id + 4.7));
        float lit = step(0.64, rnd(id + 18.2));
        float d = box(q - vec3(0.0, 0.05, -0.19), vec3(0.72, 0.69, 0.03));
        return mix(1e5, d, window * lit);
      }

      float map(vec3 p) {
        p.x += sin(floor(p.y / 2.8) * 1.7) * 0.18;
        p.z += T * 0.025;
        return min(min(structure(p), bookScene(p)), min(windowScene(p), lightScene(p)));
      }
      vec3 norm(vec3 p) {
        float h = 1e-3; vec2 k = vec2(-1.0, 1.0);
        return N(k.xyy * map(p + k.xyy * h) +
          k.yxy * map(p + k.yxy * h) +
          k.yyx * map(p + k.yyx * h) +
          k.xxx * map(p + k.xxx * h));
      }
      bool march(inout vec3 p, vec3 rd, out float dd) {
        dd = 0.0;
        for (int i = 0; i < 400; i++) {
          float d = map(p);
          if (abs(d) < 1e-3) return true;
          if (dd > 45.0) return false;
          p += rd * d * 0.55;
          dd += d * 0.55;
        }
        return false;
      }
      float occ(vec3 p, vec3 n, float d) {
        return clamp(map(p + n * d) / d, 0.0, 1.0);
      }
      vec3 dir(vec2 uv, vec3 p, vec3 t, float z) {
        vec3 up = vec3(0.0, 1.0, 0.0);
        vec3 f = N(t - p);
        vec3 r = N(cross(up, f));
        vec3 u = N(cross(f, r));
        return mat3(r, u, f) * N(vec3(uv, z));
      }
      void cam(inout vec3 p) {
        p.xz *= rot(0.12 - move.x / MN + sin(T * 0.04) * 0.015);
        p.xy *= rot(0.02 + move.y / MN);
      }
      vec3 materialAt(vec3 p) {
        vec3 sceneP = p;
        sceneP.z += T * 0.025;
        float sd = structure(sceneP);
        float bd = bookScene(sceneP);
        float wd = windowScene(sceneP);
        float ld = lightScene(sceneP);
        if (ld < sd && ld < bd && ld < wd) return vec3(1.8, 0.42, 0.06);
        if (wd < sd && wd < bd) return vec3(0.015, 0.025, 0.028);
        if (bd < sd) {
          vec3 q; vec2 id;
          cell(sceneP, q, id);
          float row = floor((q.y + 1.08) / 0.34);
          float palette = rnd(id + row * 6.3);
          if (palette < 0.25) return vec3(0.32, 0.42, 0.45);
          if (palette < 0.50) return vec3(0.72, 0.25, 0.12);
          if (palette < 0.75) return vec3(0.48, 0.54, 0.50);
          return vec3(0.86, 0.58, 0.30);
        }
        return vec3(0.10, 0.13, 0.14);
      }
      vec3 render(vec2 uv) {
        vec3 col = vec3(0.002, 0.004, 0.006);
        vec3 p = vec3(0.0, 0.0, -18.0 - wheel.y / MN);
        cam(p);
        vec3 rd = dir(uv, p, vec3(0.0, 0.0, 1.5), 1.15);
        vec3 lp = vec3(-5.0, 7.0, -7.0);
        float dd;
        if (march(p, rd, dd)) {
          vec3 n = norm(p);
          vec3 l = N(lp - p);
          vec3 mat = materialAt(p);
          float dif = clamp(dot(l, n), 0.0, 1.0);
          float rim = pow(1.0 - clamp(dot(n, -rd), 0.0, 1.0), 2.0);
          float spe = pow(clamp(dot(N(lp - rd), n), 0.0, 1.0), 24.0);
          float ao = occ(p, n, 0.45) * 0.82 * occ(p, n, 1.0);
          float ld = distance(lp, p);
          float atten = 1.0 / (1.0 + ld * 0.18 + ld * ld * 0.05);
          col += mat * (0.20 + dif * 1.45 * ao * atten);
          col += spe * vec3(0.8, 0.9, 0.85) * atten;
          col += rim * mat * 0.18;
        }
        col = mix(vec3(0.004, 0.008, 0.012), col, exp(-0.00018 * dd * dd * dd));
        col = col * 1.35 / (1.0 + abs(col * 1.35));
        col = sqrt(max(col, 0.0));
        vec2 c = FC / R;
        c *= 1.0 - c.yx;
        col *= pow(c.x * c.y * 25.0, 0.35);
        return col;
      }
      void main() {
        vec2 uv = (FC - 0.5 * R) / MN;
        O = vec4(render(uv), 1.0);
      }
    </script>
  </body>
</html>
