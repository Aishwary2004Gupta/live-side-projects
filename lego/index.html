<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Shader Playground</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap");

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #010101;
        font-family: "Fira Code", "Courier New", monospace;
      }

      #canvasContainer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      #axisHUD {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 9999;
        pointer-events: none;
      }

      #axisCanvas {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: rgba(10, 10, 10, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      #sidebar {
        position: fixed;
        top: 0;
        right: 0;
        width: 280px;
        height: 100%;
        background: #0a0a0a;
        border-left: 1px solid #1a1a1a;
        padding: 40px 30px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        color: #555;
        transition: transform 0.3s ease;
      }

      #sidebar.collapsed {
        transform: translateX(100%);
      }

      h2 {
        font-size: 16px;
        color: #fff;
        margin: 0 0 25px 0;
        display: flex;
        cursor: pointer;
      }

      #toggleBtn {
        margin-right: 8px;
      }

      ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      li {
        cursor: pointer;
        font-size: 13px;
      }

      li::before {
        content: "○";
        margin-right: 15px;
      }

      li.active {
        color: #fff;
        font-weight: 600;
      }

      li.active::before {
        content: "●";
      }

      #pixelUI {
        margin-top: auto;
        padding-top: 20px;
        border-top: 1px solid #1a1a1a;
        display: block;
      }

      input[type="range"] {
        width: 100%;
      }

      #floatingToggle {
        position: fixed;
        top: 20px;
        right: 20px;
        width: 40px;
        height: 40px;
        background: #0a0a0a;
        border: 1px solid #333;
        color: #fff;
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 10000;
        opacity: 0;
        transition: opacity 0.25s ease;
      }

      #floatingToggle.visible {
        opacity: 1;
      }
    </style>
  </head>

  <body>
    <div id="axisHUD">
      <canvas id="axisCanvas" width="100" height="100"></canvas>
    </div>

    <div id="floatingToggle">+</div>

    <div id="canvasContainer"></div>

    <div id="sidebar">
      <h2><span id="toggleBtn">—</span> Effects</h2>

      <ul id="effectList">
        <li data-value="normal">Normal</li>
        <li data-value="lego" class="active">Lego</li>
      </ul>

      <div id="pixelUI">
        <label>Intensity / Size</label>
        <input type="range" min="6" max="32" value="10" id="pixelSize" />
      </div>
    </div>

    <script type="module">
      import * as THREE from "https://esm.sh/three@0.160.0";
      import { OrbitControls } from "https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js";
      import { GLTFLoader } from "https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";
      import {
        EffectComposer,
        RenderPass,
        EffectPass,
        Effect,
      } from "https://esm.sh/postprocessing@6.35.4?deps=three@0.160.0";

      const handsFocusPoint = new THREE.Vector3(0, 0, 0);

      /* Shaders */

      const normalShader = `
precision highp float;
uniform vec2 resolution;
void mainImage(const in vec4 inputColor,const in vec2 uv,out vec4 outputColor){
outputColor=texture2D(inputBuffer,uv);
}
`;

      const legoShader = `
precision highp float;
uniform float pixelSize;
uniform vec2 resolution;
uniform vec2 lightPosition;

void mainImage(const in vec4 inputColor,const in vec2 uv,out vec4 outputColor){

vec2 s=pixelSize/resolution;
vec2 uvPixel=s*floor(uv/s);
vec4 color=texture2D(inputBuffer,uvPixel);

vec2 cellUV=fract(uv/s);

float lighting=dot(normalize(cellUV-vec2(.5)),lightPosition)*.7;
float dis=abs(distance(cellUV,vec2(.5))*2.-.5);

color.rgb*=smoothstep(.1,0.,dis)*lighting+1.;

outputColor=color;
}
`;

      function makeEffect(name, shader, uniforms = {}) {
        const map = new Map();
        for (const k in uniforms) map.set(k, new THREE.Uniform(uniforms[k]));

        return new (class extends Effect {
          constructor() {
            super(name, shader, { uniforms: map });
          }

          update(renderer) {
            if (map.has("resolution")) {
              const c = renderer.domElement;
              map.get("resolution").value.set(c.width, c.height);
            }
          }
        })();
      }

      /* Scene */

      const scene = new THREE.Scene();
      scene.background = new THREE.Color("#010101");

      /* Correct Orthographic Camera */

      const frustumSize = 350;
      let aspect = window.innerWidth / window.innerHeight;

      const camera = new THREE.OrthographicCamera(
        (frustumSize * aspect) / -2,
        (frustumSize * aspect) / 2,
        frustumSize / 2,
        frustumSize / -2,
        0.01,
        500,
      );

      camera.position.set(0, 0, -5);
      camera.zoom = 140;
      camera.updateProjectionMatrix();

      const container = document.getElementById("canvasContainer");

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, container);
      controls.enablePan = false;
      controls.enableDamping = true;

      /* Lights */

      scene.add(new THREE.AmbientLight(0xffffff, 0.6));

      const dl = new THREE.DirectionalLight(0xffffff, 10);
      dl.position.set(5, 10, 0);
      scene.add(dl);

      /* Model */

      const loader = new GLTFLoader();

      loader.load(
        "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Fox/glTF-Binary/Fox.glb",
        (g) => {
          const m = g.scene;
          m.scale.setScalar(0.02);
          m.rotation.y = -Math.PI / 2 + 4;
          m.position.y = -0.8;
          scene.add(m);
        },
      );

      /* Effects */

      const normal = makeEffect("Normal", normalShader, {
        resolution: new THREE.Vector2(innerWidth, innerHeight),
      });

      const lego = makeEffect("Lego", legoShader, {
        pixelSize: 10,
        resolution: new THREE.Vector2(innerWidth, innerHeight),
        lightPosition: new THREE.Vector2(0.8, 0.8),
      });

      const map = { normal, lego };

      const composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));

      let pass = new EffectPass(camera, lego);
      composer.addPass(pass);

      function switchEffect(val) {
        composer.removePass(pass);
        pass = new EffectPass(camera, map[val]);
        composer.addPass(pass);

        document.getElementById("pixelUI").style.display =
          val === "lego" ? "block" : "none";
      }

      /* UI */

      document.querySelectorAll("#effectList li").forEach((item) => {
        item.addEventListener("click", () => {
          document
            .querySelectorAll("#effectList li")
            .forEach((li) => li.classList.remove("active"));
          item.classList.add("active");
          switchEffect(item.dataset.value);
        });
      });

      /* Slider */

      document.getElementById("pixelSize").oninput = (e) => {
        lego.uniforms.get("pixelSize").value = +e.target.value;
      };

      /* Compass */

      const axisCanvas = document.getElementById("axisCanvas");
      const axisCtx = axisCanvas.getContext("2d");

      function drawAxis(v, color, label, cx, cy, scale) {
        const ex = cx + v.x * scale;
        const ey = cy - v.y * scale;

        axisCtx.strokeStyle = color;
        axisCtx.fillStyle = color;
        axisCtx.lineWidth = 3;

        axisCtx.beginPath();
        axisCtx.moveTo(cx, cy);
        axisCtx.lineTo(ex, ey);
        axisCtx.stroke();

        axisCtx.fillText(label, ex + 4, ey + 4);
      }

      function updateAxisHUD() {
        const w = axisCanvas.width;
        const h = axisCanvas.height;

        axisCtx.clearRect(0, 0, w, h);

        const cx = w / 2;
        const cy = h / 2;
        const scale = w * 0.35;

        const invQ = camera.quaternion.clone().invert();

        const xV = new THREE.Vector3(1, 0, 0).applyQuaternion(invQ);
        const yV = new THREE.Vector3(0, 1, 0).applyQuaternion(invQ);
        const zV = new THREE.Vector3(0, 0, 1).applyQuaternion(invQ);

        drawAxis(xV, "#ff4d4d", "X", cx, cy, scale);
        drawAxis(yV, "#46ff7a", "Y", cx, cy, scale);
        drawAxis(zV, "#4da6ff", "Z", cx, cy, scale);
      }

      /* Sidebar */

      const sidebar = document.getElementById("sidebar");
      const toggleBtn = document.getElementById("toggleBtn");
      const floatingToggle = document.getElementById("floatingToggle");

      let isPanelOpen = true;

      function togglePanel() {
        isPanelOpen = !isPanelOpen;

        if (isPanelOpen) {
          sidebar.classList.remove("collapsed");
          toggleBtn.textContent = "—";
          floatingToggle.classList.remove("visible");
        } else {
          sidebar.classList.add("collapsed");
          toggleBtn.textContent = "+";
          floatingToggle.classList.add("visible");
        }
      }

      document.querySelector("h2").addEventListener("click", togglePanel);
      floatingToggle.addEventListener("click", togglePanel);

      /* Resize Fix */

      window.addEventListener("resize", () => {
        const aspect = window.innerWidth / window.innerHeight;

        camera.left = (-frustumSize * aspect) / 2;
        camera.right = (frustumSize * aspect) / 2;
        camera.top = frustumSize / 2;
        camera.bottom = -frustumSize / 2;

        camera.updateProjectionMatrix();

        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
      });

      /* Animation */

      function animate() {
        requestAnimationFrame(animate);

        controls.update();
        updateAxisHUD();

        composer.render();
      }

      animate();
    </script>
  </body>
</html>
