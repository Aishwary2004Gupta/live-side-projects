<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Liquid Glass</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

  html,body{
    width:100%;height:100%;
    overflow-x:hidden;
    background:#5227ff;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    cursor:none;
  }

  /* ── custom cursor ── */
  .cursor{
    position:fixed;width:12px;height:12px;
    background:#fff;border-radius:50%;
    pointer-events:none;z-index:9999;
    transform:translate(-50%,-50%);
    mix-blend-mode:difference;
  }

  /* ── scrollable content ── */
  .content{
    position:relative;z-index:1;
    min-height:300vh;
  }

  .section{
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;position:relative;overflow:hidden;
  }

  .section h1{
    font-size:clamp(3rem,8vw,7rem);
    font-weight:900;color:#fff;
    letter-spacing:-.05em;
    text-align:center;
    user-select:none;
    z-index:1;
  }

  .section .sub{
    position:absolute;bottom:10%;left:50%;transform:translateX(-50%);
    color:rgba(255,255,255,.45);font-size:1rem;letter-spacing:.15em;
    text-transform:uppercase;
  }

  .img-card{
    position:absolute;border-radius:18px;overflow:hidden;
    box-shadow:0 25px 60px rgba(0,0,0,.35);
    transition:transform .4s ease;
  }
  .img-card img{width:100%;height:100%;object-fit:cover;display:block}

  .s1 .img-card:nth-child(2){width:280px;height:380px;top:12%;left:8%}
  .s1 .img-card:nth-child(3){width:220px;height:300px;top:55%;right:10%}

  .s2 .img-card:nth-child(2){width:320px;height:220px;top:15%;right:12%}
  .s2 .img-card:nth-child(3){width:200px;height:280px;bottom:12%;left:15%}

  .s3 .img-card:nth-child(2){width:260px;height:350px;top:10%;left:12%}
  .s3 .img-card:nth-child(3){width:300px;height:200px;bottom:10%;right:8%}

  /* ── nav bar ── */
  .nav{
    position:fixed;bottom:0;left:0;right:0;z-index:100;
    display:flex;justify-content:center;gap:2.5rem;
    padding:1.2rem 0 1.6rem;
    background:linear-gradient(transparent,rgba(0,0,0,.25));
  }
  .nav a{
    color:#fff;text-decoration:none;font-weight:700;font-size:.95rem;
    letter-spacing:.08em;text-transform:uppercase;
    opacity:.7;transition:opacity .25s;
  }
  .nav a:hover{opacity:1}

  /* ═══════════════════════════════════════
     THE LIQUID GLASS LENS
     ═══════════════════════════════════════ */
  .glass-lens{
    position:fixed;
    width:280px;height:280px;
    pointer-events:none;
    z-index:50;
    transform:translate(-50%,-50%);
    /* will-change for perf */
    will-change:transform;
  }

  /* the visible glass shape */
  .glass-lens .lens-body{
    position:absolute;inset:0;
    border-radius:50%;
    /* backdrop filter for the "glass" feel */
    backdrop-filter:blur(12px) brightness(1.08) saturate(1.3);
    -webkit-backdrop-filter:blur(12px) brightness(1.08) saturate(1.3);
    /* subtle inner shadow for depth */
    box-shadow:
      inset 0 0 40px rgba(255,255,255,.12),
      inset 0 -8px 24px rgba(0,0,0,.15),
      0 8px 40px rgba(0,0,0,.25),
      0 0 0 1px rgba(255,255,255,.18);
    /* the SVG displacement is applied via filter on a child */
    overflow:hidden;
  }

  /* chromatic aberration layers */
  .glass-lens .lens-body::before,
  .glass-lens .lens-body::after{
    content:'';position:absolute;inset:0;border-radius:50%;
  }
  .glass-lens .lens-body::before{
    background:radial-gradient(ellipse at 30% 30%,rgba(255,0,0,.06),transparent 70%);
    transform:translate(2px,-1px);
  }
  .glass-lens .lens-body::after{
    background:radial-gradient(ellipse at 70% 70%,rgba(0,0,255,.06),transparent 70%);
    transform:translate(-2px,1px);
  }

  /* specular highlight */
  .glass-lens .highlight{
    position:absolute;
    width:40%;height:25%;
    top:12%;left:22%;
    background:radial-gradient(ellipse,rgba(255,255,255,.35),transparent 70%);
    border-radius:50%;
    transform:rotate(-20deg);
    pointer-events:none;
  }

  /* liquid ripple ring */
  .glass-lens .ripple{
    position:absolute;inset:-4px;
    border-radius:50%;
    border:1.5px solid rgba(255,255,255,.12);
    animation:ripplePulse 3s ease-in-out infinite;
  }
  @keyframes ripplePulse{
    0%,100%{transform:scale(1);opacity:.5}
    50%{transform:scale(1.03);opacity:.2}
  }

  /* the SVG filter target – a transparent overlay that gets displaced */
  .glass-lens .displacement-layer{
    position:absolute;inset:0;border-radius:50%;
    /* this is where the SVG filter distorts the backdrop */
    filter:url(#liquid-distort);
    backdrop-filter:blur(2px);
    -webkit-backdrop-filter:blur(2px);
    background:transparent;
  }

  /* ── bar mode ── */
  .glass-lens.bar-mode{
    width:100%;height:80px;
    bottom:0;top:auto;left:0;right:0;
    transform:translateY(0);
  }
  .glass-lens.bar-mode .lens-body{
    border-radius:40px;
  }
  .glass-lens.bar-mode .highlight{
    width:60%;height:40%;top:15%;left:20%;
  }

  /* ── cube mode ── */
  .glass-lens.cube-mode{
    width:220px;height:220px;
  }
  .glass-lens.cube-mode .lens-body{
    border-radius:24px;
  }

  /* ── SVG (hidden) ── */
  .svg-defs{
    position:absolute;width:0;height:0;overflow:hidden;
  }

  /* ── scroll hint ── */
  .scroll-hint{
    position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);
    z-index:90;color:rgba(255,255,255,.4);font-size:.8rem;
    letter-spacing:.2em;text-transform:uppercase;
    animation:bob 2s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes bob{
    0%,100%{transform:translateX(-50%) translateY(0)}
    50%{transform:translateX(-50%) translateY(8px)}
  }

  /* ── mode switcher (demo) ── */
  .mode-switch{
    position:fixed;top:1.2rem;right:1.2rem;z-index:200;
    display:flex;gap:.5rem;
  }
  .mode-switch button{
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
    color:#fff;padding:.4rem .9rem;border-radius:8px;
    font-size:.75rem;cursor:pointer;letter-spacing:.05em;
    transition:background .2s;
  }
  .mode-switch button:hover{background:rgba(255,255,255,.2)}
  .mode-switch button.active{background:rgba(255,255,255,.25);border-color:rgba(255,255,255,.5)}
</style>
</head>
<body>

<!-- ═══ SVG FILTERS (the "liquid" distortion) ═══ -->
<svg class="svg-defs" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="liquid-distort" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence
        id="turb"
        type="fractalNoise"
        baseFrequency="0.015 0.015"
        numOctaves="3"
        seed="2"
        result="noise"
      />
      <feDisplacementMap
        in="SourceGraphic"
        in2="noise"
        scale="28"
        xChannelSelector="R"
        yChannelSelector="G"
      />
    </filter>

    <filter id="liquid-distort-strong" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence
        id="turb2"
        type="fractalNoise"
        baseFrequency="0.02 0.02"
        numOctaves="4"
        seed="5"
        result="noise"
      />
      <feDisplacementMap
        in="SourceGraphic"
        in2="noise"
        scale="40"
        xChannelSelector="R"
        yChannelSelector="G"
      />
    </filter>
  </defs>
</svg>

<!-- custom cursor -->
<div class="cursor" id="cursor"></div>

<!-- mode switcher -->
<div class="mode-switch">
  <button class="active" data-mode="lens">Lens</button>
  <button data-mode="bar">Bar</button>
  <button data-mode="cube">Cube</button>
</div>

<!-- scroll hint -->
<div class="scroll-hint" id="scrollHint">Scroll ↓</div>

<!-- ═══ SCROLLABLE CONTENT ═══ -->
<div class="content" id="content">

  <div class="section s1">
    <div class="img-card" style="width:280px;height:380px;top:12%;left:8%">
      <img src="https://images.unsplash.com/photo-1595001354022-29103be3b73a?q=80&w=600&auto=format&fit=crop" alt="" />
    </div>
    <div class="img-card" style="width:220px;height:300px;top:55%;right:10%">
      <img src="https://images.unsplash.com/photo-1478436127897-769e1b3f0f36?q=80&w=600&auto=format&fit=crop" alt="" />
    </div>
    <h1>React Bits</h1>
    <span class="sub">Move your mouse · Scroll down</span>
  </div>

  <div class="section s2">
    <div class="img-card" style="width:320px;height:220px;top:15%;right:12%">
      <img src="https://images.unsplash.com/photo-1513682121497-80211f36a7d3?q=80&w=600&auto=format&fit=crop" alt="" />
    </div>
    <div class="img-card" style="width:200px;height:280px;bottom:12%;left:15%">
      <img src="https://images.unsplash.com/photo-1516205651411-aef33a44f7c2?q=80&w=600&auto=format&fit=crop" alt="" />
    </div>
    <h1>Fluid Glass</h1>
    <span class="sub">Pure CSS · SVG · JS</span>
  </div>

  <div class="section s3">
    <div class="img-card" style="width:260px;height:350px;top:10%;left:12%">
      <img src="https://images.unsplash.com/photo-1505069190533-da1c9af13346?q=80&w=600&auto=format&fit=crop" alt="" />
    </div>
    <div class="img-card" style="width:300px;height:200px;bottom:10%;right:8%">
      <img src="https://images.unsplash.com/photo-1595001354022-29103be3b73a?q=80&w=600&auto=format&fit=crop" alt="" />
    </div>
    <h1>Refraction</h1>
    <span class="sub">No WebGL required</span>
  </div>

</div>

<!-- ═══ THE GLASS LENS ═══ -->
<div class="glass-lens" id="glassLens">
  <div class="lens-body">
    <div class="displacement-layer"></div>
    <div class="highlight"></div>
  </div>
  <div class="ripple"></div>
</div>

<!-- ═══ NAV ══ -->
<nav class="nav">
  <a href="#">Home</a>
  <a href="#">About</a>
  <a href="#">Contact</a>
</nav>

<script>
(() => {
  /* ── refs ── */
  const lens     = document.getElementById('glassLens');
  const cursor   = document.getElementById('cursor');
  const scrollHint = document.getElementById('scrollHint');
  const turb     = document.getElementById('turb');
  const turb2    = document.getElementById('turb2');

  /* ── state ─ */
  let mode        = 'lens';   // lens | bar | cube
  let mouseX      = innerWidth / 2;
  let mouseY      = innerHeight / 2;
  let lensX       = mouseX;
  let lensY       = mouseY;
  let lensVX      = 0;
  let lensVY      = 0;
  let prevX       = mouseX;
  let prevY       = mouseY;
  let time        = 0;
  let scrollY     = 0;

  /* ── mouse tracking ── */
  window.addEventListener('mousemove', e => {
    mouseX = e.clientX;
    mouseY = e.clientY;
  });

  /* ── touch support ── */
  window.addEventListener('touchmove', e => {
    mouseX = e.touches[0].clientX;
    mouseY = e.touches[0].clientY;
  }, { passive: true });

  /* ── scroll tracking ── */
  window.addEventListener('scroll', () => {
    scrollY = window.scrollY;
    // fade out scroll hint
    const opacity = Math.max(0, 1 - scrollY / 200);
    scrollHint.style.opacity = opacity;
  }, { passive: true });

  /* ── mode switcher ── */
  document.querySelectorAll('.mode-switch button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mode-switch button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      mode = btn.dataset.mode;
      lens.className = 'glass-lens' + (mode === 'bar' ? ' bar-mode' : mode === 'cube' ? ' cube-mode' : '');
    });
  });

  /* ── lerp helper ── */
  function lerp(a, b, t) { return a + (b - a) * t; }

  /* ── main loop ── */
  function tick() {
    time += 0.016;

    /* smooth follow */
    const ease = mode === 'bar' ? 0.06 : 0.08;
    const targetX = mode === 'bar' ? mouseX : mouseX;
    const targetY = mode === 'bar'
      ? innerHeight - 40          // lock to bottom
      : mouseY;

    prevX = lensX;
    prevY = lensY;
    lensX = lerp(lensX, targetX, ease);
    lensY = lerp(lensY, targetY, ease);

    lensVX = lensX - prevX;
    lensVY = lensY - prevY;

    /* position the lens */
    if (mode === 'bar') {
      lens.style.left = lensX + 'px';
      lens.style.top  = '';
      lens.style.transform = 'translate(-50%, 0)';
    } else {
      lens.style.left = lensX + 'px';
      lens.style.top  = lensY + 'px';
      lens.style.transform = 'translate(-50%, -50%)';
    }

    /* subtle 3D tilt based on velocity */
    const tiltX = lensVY * -0.8;
    const tiltY = lensVX *  0.8;
    const body = lens.querySelector('.lens-body');
    body.style.transform =
      `perspective(600px) rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;

    /* animate the SVG turbulence for the "liquid" feel */
    const bf1 = 0.012 + Math.sin(time * 0.7) * 0.004;
    const bf2 = 0.012 + Math.cos(time * 0.5) * 0.004;
    const seed = Math.floor(time * 2) % 100;

    if (turb) {
      turb.setAttribute('baseFrequency', `${bf1} ${bf2}`);
      turb.setAttribute('seed', seed);
    }
    if (turb2) {
      turb2.setAttribute('baseFrequency', `${bf1 * 1.3} ${bf2 * 1.3}`);
      turb2.setAttribute('seed', seed + 50);
    }

    /* displacement scale reacts to speed */
    const speed = Math.sqrt(lensVX ** 2 + lensVY ** 2);
    const dispScale = 22 + Math.min(speed * 3, 30);
    const dispEl = document.querySelector('#liquid-distort feDisplacementMap');
    if (dispEl) dispEl.setAttribute('scale', dispScale);

    /* custom cursor */
    cursor.style.left = mouseX + 'px';
    cursor.style.top  = mouseY + 'px';

    requestAnimationFrame(tick);
  }

  tick();
})();
</script>
</body>
</html>
