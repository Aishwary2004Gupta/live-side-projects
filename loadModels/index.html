<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Task Manager</title>
    
    <!-- CSS: This handles the visual style -->
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 350px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            outline: none;
        }

        button#add-btn {
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button#add-btn:hover {
            background-color: #218838;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            background: #fff;
            border-bottom: 1px solid #eee;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        li:hover {
            background-color: #fafafa;
        }

        li.completed span {
            text-decoration: line-through;
            color: #888;
        }

        .delete-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <!-- HTML: This handles the structure -->
    <div class="container">
        <h2>My Tasks</h2>
        
        <div class="input-group">
            <input type="text" id="task-input" placeholder="Add a new task...">
            <button id="add-btn">Add</button>
        </div>

        <ul id="task-list">
            <!-- Tasks will appear here -->
        </ul>
    </div>

    <!-- JavaScript: This handles the logic/interactivity -->
    <script>
        // 1. Select elements from the HTML
        const input = document.getElementById('task-input');
        const addBtn = document.getElementById('add-btn');
        const taskList = document.getElementById('task-list');

        // 2. Function to add a new task
        function addTask() {
            const taskText = input.value;

            if (taskText === '') {
                alert("Please write a task!");
                return;
            }

            // Create the list item (li)
            const li = document.createElement('li');

            // Create the text span
            const span = document.createElement('span');
            span.textContent = taskText;
            
            // Add click event to mark as done
            span.addEventListener('click', function() {
                li.classList.toggle('completed');
            });

            // Create the delete button
            const deleteBtn = document.createElement('button');
            deleteBtn.textContent = 'Delete';
            deleteBtn.classList.add('delete-btn');
            
            // Add click event to delete the task
            deleteBtn.addEventListener('click', function() {
                taskList.removeChild(li);
            });

            // Put everything together
            li.appendChild(span);
            li.appendChild(deleteBtn);
            taskList.appendChild(li);

            // Clear the input field
            input.value = '';
        }

        // 3. Event Listeners
        addBtn.addEventListener('click', addTask);

        // Allow pressing "Enter" key to add task
        input.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                addTask();
            }
        });
    </script>
</body>
</html>
