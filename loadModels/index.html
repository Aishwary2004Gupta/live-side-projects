<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML/CSS/JS Demo</title>
    <style>
        /* --- CSS (The Styling) --- */
        
        :root {
            /* Default Light Mode Variables */
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --btn-bg: #3b82f6;
            --btn-text: #ffffff;
        }

        body.dark-mode {
            /* Dark Mode Variables */
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --text-color: #e0e0e0;
            --btn-bg: #e94560;
            --btn-text: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .card {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            width: 300px;
            transition: background-color 0.3s ease;
        }

        h1 {
            margin-top: 0;
        }

        p {
            line-height: 1.6;
        }

        button {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 15px;
            transition: transform 0.1s ease;
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- --- HTML (The Structure) --- -->
    <div class="card">
        <h1>Hello World!</h1>
        <p>This is a demo of HTML, CSS, and JavaScript working together.</p>
        <p>Click the button below to toggle Dark Mode.</p>
        <button id="theme-toggle">Switch Theme 🌗</button>
    </div>

    <!-- --- JavaScript (The Logic) --- -->
    <script>
        // Select the button and the body element
        const toggleButton = document.getElementById('theme-toggle');
        const bodyElement = document.body;

        // Check if the user already has a saved theme preference
        const currentTheme = localStorage.getItem('theme');
        if (currentTheme === 'dark') {
            bodyElement.classList.add('dark-mode');
            toggleButton.textContent = "Switch to Light Mode ☀️";
        }

        // Add event listener to the button
        toggleButton.addEventListener('click', function() {
            // Toggle the 'dark-mode' class on the body
            bodyElement.classList.toggle('dark-mode');

            // Change button text based on mode
            if (bodyElement.classList.contains('dark-mode')) {
                toggleButton.textContent = "Switch to Light Mode ☀️";
                // Save preference to LocalStorage so it remembers next time
                localStorage.setItem('theme', 'dark');
            } else {
                toggleButton.textContent = "Switch Theme 🌗";
                localStorage.setItem('theme', 'light');
            }
        });
    </script>
</body>
</html>
