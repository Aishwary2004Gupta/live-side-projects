<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Butterfly</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: #35354f; perspective: 800px; }
      .bg, .bg-glow { position: fixed; inset: 0; }
      .bg { background: #35354f; }
      .bg-glow {
        inset: 50% auto auto 50%;
        width: min(600px, 100vw);
        height: min(600px, 100vw);
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, #3c6c7c, #35354f 60%);
      }
      .container {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 138px;
        height: 200px;
        transform: translate(-50%, -50%) rotateY(-12deg);
        transform-style: preserve-3d;
      }
      .line {
        display: block;
        width: var(--width);
        height: 10px;
        margin-left: var(--offset);
        border-radius: 20em;
        background: var(--color);
        box-shadow: 6px 0 5px -2px rgb(0 0 0 / 50%);
        transform-origin: left center;
        animation: appear 4s var(--delay) ease-out infinite forwards;
      }
      .line:nth-child(1) { --color: #fcd97d; --width: 20px; --offset: 4px; --delay: 0s; }
      .line:nth-child(2) { --color: #ffd571; --width: 34px; --offset: 0px; --delay: .075s; }
      .line:nth-child(3) { --color: #faae7a; --width: 48px; --offset: 4px; --delay: .15s; }
      .line:nth-child(4) { --color: #fac29f; --width: 62px; --offset: 8px; --delay: .225s; }
      .line:nth-child(5) { --color: #f9a58d; --width: 74px; --offset: 14px; --delay: .3s; }
      .line:nth-child(6) { --color: #f8b4b5; --width: 82px; --offset: 16px; --delay: .375s; }
      .line:nth-child(7) { --color: #f8bbc3; --width: 86px; --offset: 20px; --delay: .45s; }
      .line:nth-child(8) { --color: #f7acc0; --width: 92px; --offset: 24px; --delay: .525s; }
      .line:nth-child(9) { --color: #f9ced7; --width: 94px; --offset: 28px; --delay: .6s; }
      .line:nth-child(10) { --color: #f4a4c1; --width: 102px; --offset: 26px; --delay: .675s; }
      .line:nth-child(11) { --color: #f09abf; --width: 60px; --offset: 60px; --delay: .75s; }
      .line:nth-child(12) { --color: #f0b1d0; --width: 78px; --offset: 50px; --delay: .825s; }
      .line:nth-child(13) { --color: #efbad6; --width: 94px; --offset: 38px; --delay: .9s; }
      .line:nth-child(14) { --color: #e3cae0; --width: 98px; --offset: 32px; --delay: .975s; }
      .line:nth-child(15) { --color: #c6a1cc; --width: 98px; --offset: 30px; --delay: 1.05s; }
      .line:nth-child(16) { --color: #ded1e5; --width: 94px; --offset: 32px; --delay: 1.125s; }
      .line:nth-child(17) { --color: #aeb2d8; --width: 84px; --offset: 38px; --delay: 1.2s; }
      .line:nth-child(18) { --color: #cbd2ec; --width: 74px; --offset: 44px; --delay: 1.275s; }
      .line:nth-child(19) { --color: #adc5e7; --width: 58px; --offset: 54px; --delay: 1.35s; }
      .line:nth-child(20) { --color: #8cc6ec; --width: 32px; --offset: 74px; --delay: 1.425s; }
      @keyframes appear {
        10% { transform: rotateX(90deg); }
        15%, 100% { transform: rotateX(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <div class="bg-glow" aria-hidden="true"></div>
    <main class="container" aria-label="Animated butterfly">
      <span class="line"></span><span class="line"></span>
      <span class="line"></span><span class="line"></span>
      <span class="line"></span><span class="line"></span>
      <span class="line"></span><span class="line"></span>
      <span class="line"></span><span class="line"></span>
      <span class="line"></span><span class="line"></span>
      <span class="line"></span><span class="line"></span>
      <span class="line"></span><span class="line"></span>
      <span class="line"></span><span class="line"></span>
      <span class="line"></span><span class="line"></span>
    </main>
  </body>
</html>
