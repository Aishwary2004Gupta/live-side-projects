<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Butterfly</title>
</head>
<body>

    <style>
        $colors: (
  #FCD97D,
  #FFD571,
  #FAAE7A,
  #FAC29F,
  #F9A58D,
  #F8B4B5,
  #F8BBC3,
  #F7ACC0,
  #F9CED7,
  #F4A4C1,
  #F09ABF,
  #F0B1D0,
  #EFBAD6,
  #E3CAE0,
  #C6A1CC,
  #DED1E5,
  #AEB2D8,
  #CBD2EC,
  #ADC5E7,
  #8CC6EC
);

$points: (
  (20px, 4px),
  (34px, 0px),
  (48px, 4px),
  (62px, 8px),
  (74px, 14px),
  (82px, 16px),
  (86px, 20px),
  (92px, 24px),
  (94px, 28px),
  (102px, 26px),
  (60px, 60px),
  (78px, 50px),
  (94px, 38px),
  (98px, 32px),
  (98px, 30px),
  (94px, 32px),
  (84px, 38px),
  (74px, 44px),
  (58px, 54px),
  (32px, 74px),
);

body{
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

.bg{
  position: absolute;
  width: 100%;
  height: 100%;
  background: #35354F;
}

.bg-glow{
  position: absolute;
  margin: auto;
  top:0; bottom:0; left:0; right:0;
  width: 600px;
  height: 600px; 
  background: radial-gradient(#3C6C7C, #35354F 60%);  
}

.footer h4{
  position: absolute;
  margin: auto;
  left:0; right:0; top:auto; bottom:10px;
  width: 215px;
  height: 20px;
  font-family: Sans-serif;
  font-weight: 100;
  color: pink;
  a{
    color: #8CC6EC;
  }
}

.container{
  position: absolute;
  margin: auto;
  top:0; bottom:0; left:0; right:0;
  width: 138px;
  height: 200px;
  transform: translateX(-50%);
  box-reflect: right;
}

@mixin line{
  display: block;
  width: 20px;
  height: 10px;
  border-radius: 20em;
  box-shadow: 6px 0px 5px -2px rgba(0,0,0,0.5);
}

@for $i from 0 to 20 {
  .line:nth-child(#{$i+1}){
    @include line;
    background: nth($colors, $i+1);
    width: nth(nth($points, $i+1), 1);
    margin-left: nth(nth($points, $i+1), 2);
    animation: appear 4s unquote(0.075*$i +'s') ease-out infinite forwards;
  }
}

@keyframes appear{
  10%{
    transform: rotateX(90deg);
  }
  15%{
    transform: rotateX(360deg);
  }
  100%{
    transform: rotateX(360deg);
  }
}
    </style>

    div.bg
  div.bg-glow
  div.container
    - for (i=0; i<20; i++)
      div.line
      
</body>
</html>
