              >, Vincent van Gogh, 1889, oil on canvas, in the public domain.
            </li>
            <li id="note-2">
              The words are written for this page. The morning star is from his
              <a
                href="https://vangoghletters.org/vg/letters/let777/letter.html"
                target="_blank"
                rel="noopener noreferrer"
                >letter to Theo</a
              >, early June 1889.

                target="_blank"
                rel="noopener noreferrer"
                >letter to Émile Bernard</a
              >, about 26 November 1889.
            </li>
            <li id="note-4">
              The size and the 1941 acquisition are from
              <a
                href="https://www.moma.org/collection/works/79802"
                target="_blank"
                rel="noopener noreferrer"
