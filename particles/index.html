<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recreated Agency Effects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* --- 1. General & Body Styling --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #111;
            color: #e0e0e0;
            font-family: 'Poppins', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        main {
            position: relative;
            z-index: 1; /* Ensure content is above the canvas */
        }
        
        header, footer {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-height: 100vh;
            padding: 0 2rem;
        }

        header h1 {
            font-size: clamp(3rem, 10vw, 6rem);
            font-weight: 600;
        }
        
        header p {
            font-size: 1.2rem;
            color: #888;
            margin-top: 1rem;
        }
        
        footer p {
            font-size: 2rem;
        }

        /* --- 2. Particle Canvas Styling --- */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0; /* Behind main content */
            background-color: #111; /* Fallback for when JS is disabled */
        }

        /* --- 3. Project List Styling --- */
        .project-list {
            list-style: none;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            border-bottom: 1px solid #444;
        }

        .project-item {
            border-top: 1px solid #444;
        }

        .project-item a {
            display: block;
            padding: 4rem 2rem;
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 600;
            color: #fff;
            text-decoration: none;
            transition: color 0.4s ease;
        }

        .project-item a:hover {
            color: #777;
        }

        /* --- 4. Hover Image Styling --- */
        .hover-images img {
            /* Positioning and Sizing */
            position: fixed;
            z-index: 10;
            width: 350px;
            height: auto;
            object-fit: cover;
            
            /* Initial State: Hidden and non-interactive */
            opacity: 0;
            pointer-events: none;
            
            /* Center the image on the cursor */
            transform: translate(-50%, -50%);
            
            /* Smooth transitions */
            transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

    </style>
</head>
<body>

    <!-- Canvas for the particle effect background -->
    <canvas id="particle-canvas"></canvas>

    <!-- Main content container -->
    <main>
        <header>
            <h1>Agency Effects</h1>
            <p>Scroll down to experience the sticky animation</p>
        </header>

        <ul class="project-list">
            <li class="project-item">
                <a href="#" data-image-id="img-1">E-commerce Platform</a>
            </li>
            <li class="project-item">
                <a href="#" data-image-id="img-2">Interactive Data Viz</a>
            </li>
            <li class="project-item">
                <a href="#" data-image-id="img-3">Brand Identity System</a>
            </li>
            <li class="project-item">
                <a href="#" data-image-id="img-4">Mobile App Redesign</a>
            </li>
        </ul>
        
        <footer>
            <p>End of the list.</p>
        </footer>
    </main>

    <!-- Hidden container for the images that appear on hover -->
    <div class="hover-images">
        <img src="https://images.unsplash.com/photo-1558980394-a37decb7d3d3?q=80&w=2670&auto=format&fit=crop" id="img-1" alt="Project 1">
        <img src="https://images.unsplash.com/photo-1517048676732-d65bc937f952?q=80&w=2670&auto=format&fit=crop" id="img-2" alt="Project 2">
        <img src="https://images.unsplash.com/photo-1559056199-641a0ac7055e?q=80&w=2670&auto=format&fit=crop" id="img-3" alt="Project 3">
        <img src="https://images.unsplash.com/photo-1600880292203-757bb62b4baf?q=80&w=2670&auto=format&fit=crop" id="img-4" alt="Project 4">
    </div>

    <!-- GSAP Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // --- EFFECT 1: PARTICLE NETWORK ---
            const canvas = document.getElementById('particle-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            let particlesArray;

            const mouse = {
                x: null,
                y: null,
                radius: (canvas.height / 110) * (canvas.width / 110)
            };

            window.addEventListener('mousemove', e => {
                mouse.x = e.x;
                mouse.y = e.y;
            });

            class Particle {
                constructor(x, y, directionX, directionY, size, color) {
                    this.x = x;
                    this.y = y;
                    this.directionX = directionX;
                    this.directionY = directionY;
                    this.size = size;
                    this.color = color;
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
                    ctx.fillStyle = 'rgba(128, 128, 128, 0.5)'; // Grey particle color
                    ctx.fill();
                }
                update() {
                    if (this.x > canvas.width || this.x < 0) {
                        this.directionX = -this.directionX;
                    }
                    if (this.y > canvas.height || this.y < 0) {
                        this.directionY = -this.directionY;
                    }
                    this.x += this.directionX;
                    this.y += this.directionY;
                    this.draw();
                }
            }

            function init() {
                particlesArray = [];
                let numberOfParticles = (canvas.height * canvas.width) / 9000;
                for (let i = 0; i < numberOfParticles; i++) {
                    let size = (Math.random() * 2) + 1;
                    let x = (Math.random() * ((innerWidth - size * 2) - (size * 2)) + size * 2);
                    let y = (Math.random() * ((innerHeight - size * 2) - (size * 2)) + size * 2);
                    let directionX = (Math.random() * .4) - 0.2;
                    let directionY = (Math.random() * .4) - 0.2;
                    let color = 'rgba(128, 128, 128, 0.5)';
                    particlesArray.push(new Particle(x, y, directionX, directionY, size, color));
                }
            }

            function connect() {
                let opacityValue = 1;
                for (let a = 0; a < particlesArray.length; a++) {
                    for (let b = a; b < particlesArray.length; b++) {
                        let distance = ((particlesArray[a].x - particlesArray[b].x) * (particlesArray[a].x - particlesArray[b].x)) +
                                     ((particlesArray[a].y - particlesArray[b].y) * (particlesArray[a].y - particlesArray[b].y));
                        if (distance < (canvas.width / 7) * (canvas.height / 7)) {
                            opacityValue = 1 - (distance / 20000);
                            ctx.strokeStyle = `rgba(100, 100, 100, ${opacityValue})`;
                            ctx.lineWidth = 1;
                            ctx.beginPath();
                            ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                            ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                            ctx.stroke();
                        }
                    }
                }
            }
            
            function animate() {
                requestAnimationFrame(animate);
                ctx.clearRect(0, 0, innerWidth, innerHeight);
                for (let i = 0; i < particlesArray.length; i++) {
                    particlesArray[i].update();
                }
                connect();
            }

            window.addEventListener('resize', () => {
                canvas.width = innerWidth;
                canvas.height = innerHeight;
                mouse.radius = (canvas.height / 110) * (canvas.width / 110);
                init();
            });

            window.addEventListener('mouseout', () => {
                mouse.x = undefined;
                mouse.y = undefined;
            });

            init();
            animate();


            // --- EFFECT 2: CURSOR-FOLLOWING IMAGE ---
            const projectLinks = document.querySelectorAll('.project-item a');
            const hoverImagesContainer = document.querySelector('.hover-images');
            let currentImage = null;
            let mouseX = 0, mouseY = 0;
            let targetX = 0, targetY = 0;
            const lerpFactor = 0.1; // Smoothing factor for image movement

            projectLinks.forEach(link => {
                link.addEventListener('mouseenter', (e) => {
                    const imageId = link.getAttribute('data-image-id');
                    if(currentImage) currentImage.style.opacity = 0; // Hide previous image
                    
                    currentImage = document.getElementById(imageId);
                    if (currentImage) {
                        mouseX = targetX = e.clientX;
                        mouseY = targetY = e.clientY;
                        currentImage.style.opacity = '1';
                    }
                });

                link.addEventListener('mouseleave', () => {
                    if (currentImage) {
                        currentImage.style.opacity = '0';
                    }
                    currentImage = null;
                });
            });

            window.addEventListener('mousemove', (e) => {
                targetX = e.clientX;
                targetY = e.clientY;
            });
            
            // Animation loop for smooth image following
            function smoothFollow() {
                if (currentImage) {
                    mouseX += (targetX - mouseX) * lerpFactor;
                    mouseY += (targetY - mouseY) * lerpFactor;
                    currentImage.style.transform = `translate(-50%, -50%) translate(${mouseX}px, ${mouseY}px)`;
                }
                requestAnimationFrame(smoothFollow);
            }
            smoothFollow();


            // --- EFFECT 3: STICKY SCROLL ANIMATION (GSAP) ---
            gsap.registerPlugin(ScrollTrigger);

            const projectItems = document.querySelectorAll(".project-item");

            projectItems.forEach((item, index) => {
                // Animate the element itself (the <li>)
                gsap.to(item, {
                    scale: 0.9,
                    opacity: 0.7,
                    transformOrigin: 'center center',
                    ease: 'power1.inOut',
                    scrollTrigger: {
                        trigger: item,
                        start: "top top", // When the top of the item hits the top of the viewport
                        end: "bottom top", // When the bottom of the item hits the top of the viewport
                        pin: true, // Pin the item for the duration between start and end
                        scrub: 1, // Smoothly link animation progress to scrollbar (1-second lag)
                        // markers: true, // Uncomment for debugging visual markers
                    }
                });
            });

        });
    </script>
</body>
</html>
