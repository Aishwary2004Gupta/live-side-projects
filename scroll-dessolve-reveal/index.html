  <body>
    <canvas id="gl"></canvas>

    <header class="ui topbar">

    <div class="ui center" id="hero">

    <footer class="ui bottombar">

        <span class="num" id="counter">001</span><span class="of">/ ∞</span>

    <div class="progress"><span id="bar"></span></div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";

      /* ==================================================================
   0. TUNING
   ================================================================== */
      const DPR_CAP = 1.25; // lower to 1.0 on weak GPUs
      const FULL_W = 1024,
        FULL_Q = 72;
      const LOW_W = 256,
        LOW_Q = 40;
      const EDGE_MAX = 1024; // baked edge-map max dimension
      const MAX_PARALLEL = 6;
      const LOOK_AHEAD = 6;
      const TRAVEL_VH = 1.6;
      const SMOOTHING = 0.12;
      const VIRTUAL_LENGTH = 4000;

      /* ==================================================================
   1. SHADERS
   ================================================================== */
      const vert = /* glsl */ `
  varying vec2 vUv;
  void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
`;

      /* One-time bake: Sobel contour of the artwork → red channel */
      const bakeFrag = /* glsl */ `
  precision highp float;
  uniform sampler2D uTexture;
  uniform vec2 uTexel;
  varying vec2 vUv;
  float lum(vec3 c){ return dot(c, vec3(0.299,0.587,0.114)); }
  void main(){
    vec2 st = uTexel * 1.35;
    float tl=lum(texture2D(uTexture, vUv+vec2(-st.x, st.y)).rgb);
    float t =lum(texture2D(uTexture, vUv+vec2( 0.0,  st.y)).rgb);
    float tr=lum(texture2D(uTexture, vUv+vec2( st.x, st.y)).rgb);
    float l =lum(texture2D(uTexture, vUv+vec2(-st.x, 0.0 )).rgb);
    float r =lum(texture2D(uTexture, vUv+vec2( st.x, 0.0 )).rgb);
    float bl=lum(texture2D(uTexture, vUv+vec2(-st.x,-st.y)).rgb);
    float b =lum(texture2D(uTexture, vUv+vec2( 0.0, -st.y)).rgb);
    float br=lum(texture2D(uTexture, vUv+vec2( st.x,-st.y)).rgb);
    float gx = -tl - 2.0*l - bl + tr + 2.0*r + br;
    float gy = -tl - 2.0*t - tr + bl + 2.0*b + br;
    float e = sqrt(gx*gx + gy*gy);
    float contour = pow(clamp(e * 2.2, 0.0, 1.0), 0.72);
    gl_FragColor = vec4(contour, contour, contour, 1.0);
  }
`;

      const coverCommon = /* glsl */ `
  uniform sampler2D uTexture;
  uniform sampler2D uEdge;
  uniform vec2 uResolution;
  uniform vec2 uImageResolution;
  varying vec2 vUv;
  float lum(vec3 c){ return dot(c, vec3(0.299,0.587,0.114)); }
  vec2 coverUv(){
    vec2 ratio = vec2(
      min((uResolution.x/uResolution.y)/(uImageResolution.x/uImageResolution.y), 1.0),
      min((uResolution.y/uResolution.x)/(uImageResolution.y/uImageResolution.x), 1.0));
    return vec2(vUv.x*ratio.x + (1.0-ratio.x)*0.5, vUv.y*ratio.y + (1.0-ratio.y)*0.5);
  }
`;

      /* FRONT: dissolves outward, silver strictly on baked contours */
      const frontFrag =
        /* glsl */ coverCommon +
        `
  uniform float uDissolve;
  uniform vec2 uCenter;
  uniform float uGrayscale;
  uniform float uEdgeIntensity;
  uniform float uEdgeBrightness;

  float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
  float noise(vec2 p){
    vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
    return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y);
  }
  float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<4;i++){ v+=a*noise(p); p*=2.0; a*=0.5; } return v; }

  void main(){
    vec2 uv = coverUv();
    vec4 tex = texture2D(uTexture, uv);
    float contour = texture2D(uEdge, uv).r;

    vec3 baseColor = mix(tex.rgb, vec3(lum(tex.rgb) * 0.22), uGrayscale);

    vec2 c = vUv - uCenter;
    float aspect = uResolution.x / uResolution.y;
    c.x *= aspect;
    float dist = length(c);
    float angle = atan(c.y, c.x);

    vec2 blockUv = floor(vUv * 85.0) / 85.0;
    float n = fbm(blockUv * 9.0) * 0.14 + fbm(vec2(angle * 5.0, 0.0)) * 0.08;
    float nd = (dist + n) / length(vec2(aspect*0.5, 0.5));

    float th = uDissolve * 1.55;
    float mask = smoothstep(th - 0.03, th, nd);

    float ambient = contour * (uEdgeIntensity * 2.6 + 0.12 * uGrayscale);
    float rimZone = smoothstep(th - 0.12, th, nd) * smoothstep(th + 0.04, th - 0.02, nd);
    float rim = contour * rimZone * 4.2;

    vec3 silver = vec3(0.92, 0.95, 1.0);
    gl_FragColor = vec4(baseColor + silver * (ambient + rim) * uEdgeBrightness, mask * tex.a);
  }
`;

      /* BACK: silver sketch → blooms into full color */
      const backFrag =
        /* glsl */ coverCommon +
        `
  uniform float uEdgeIntensity;
  uniform float uDarkness;
  void main(){
    vec2 uv = coverUv();
    vec4 tex = texture2D(uTexture, uv);
    float contour = texture2D(uEdge, uv).r;
    vec3 baseColor = mix(tex.rgb, vec3(lum(tex.rgb) * 0.16), uDarkness);
    vec3 silver = vec3(0.92, 0.95, 1.0);
    gl_FragColor = vec4(clamp(baseColor + silver * contour * uEdgeIntensity * 2.8, 0.0, 1.0), tex.a);
  }
`;

      /* ==================================================================
   2. RENDERER
   ================================================================== */
      const canvas = document.getElementById("gl");
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: false,
        alpha: false,
        powerPreference: "high-performance",
        stencil: false,
        depth: false,
      });
      renderer.setClearColor(0x000000, 1);

      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
      camera.position.z = 1;
      const quad = new THREE.PlaneGeometry(2, 2);

      /* fallback 2×2 textures so shaders can compile before any image arrives */
      const fallbackTex = new THREE.DataTexture(
        new Uint8Array([
          8, 8, 8, 255, 12, 12, 12, 255, 12, 12, 12, 255, 8, 8, 8, 255,
        ]),
        2,
        2,
      );
      fallbackTex.colorSpace = THREE.SRGBColorSpace;
      fallbackTex.needsUpdate = true;
      const fallbackEdge = new THREE.DataTexture(
        new Uint8Array([
          0, 0, 0, 255, 0, 0, 0, 255, 0, 0, 0, 255, 0, 0, 0, 255,
        ]),
        2,
        2,
      );
      fallbackEdge.needsUpdate = true;

      /* --- bake pipeline --- */
      const bakeUniforms = {
        uTexture: { value: fallbackTex },
        uTexel: { value: new THREE.Vector2(1 / 2, 1 / 2) },
      };
      const bakeScene = new THREE.Scene();
      bakeScene.add(
        new THREE.Mesh(
          quad,
          new THREE.ShaderMaterial({
            vertexShader: vert,
            fragmentShader: bakeFrag,
            uniforms: bakeUniforms,
            depthTest: false,
            depthWrite: false,
          }),
        ),
      );

      function bakeEdges(tex) {
        const img = tex.image;
        const iw = img.width,
          ih = img.height;
        const s = Math.min(1, EDGE_MAX / Math.max(iw, ih));
        const rt = new THREE.WebGLRenderTarget(
          Math.max(2, Math.round(iw * s)),
          Math.max(2, Math.round(ih * s)),
          {
            minFilter: THREE.LinearFilter,
            magFilter: THREE.LinearFilter,
            format: THREE.RGBAFormat,
            type: THREE.UnsignedByteType,
            depthBuffer: false,
            stencilBuffer: false,
            generateMipmaps: false,
          },
        );
        bakeUniforms.uTexture.value = tex;
        bakeUniforms.uTexel.value.set(1 / iw, 1 / ih);
        renderer.setRenderTarget(rt);
        renderer.render(bakeScene, camera);
        renderer.setRenderTarget(null);
        return rt;
      }

      /* --- main scene --- */
      const uniformsBack = {
        uTexture: { value: fallbackTex },
        uEdge: { value: fallbackEdge },
        uResolution: { value: new THREE.Vector2(1, 1) },
        uImageResolution: { value: new THREE.Vector2(1024, 680) },
        uEdgeIntensity: { value: 0.6 },
        uDarkness: { value: 1 },
      };
      const uniformsFront = {
        uTexture: { value: fallbackTex },
        uEdge: { value: fallbackEdge },
        uResolution: { value: new THREE.Vector2(1, 1) },
        uImageResolution: { value: new THREE.Vector2(1024, 680) },
        uDissolve: { value: 0 },
        uCenter: { value: new THREE.Vector2(0.5, 0.5) },
        uGrayscale: { value: 0 },
        uEdgeIntensity: { value: 0 },
        uEdgeBrightness: { value: 1 },
      };
      const scene = new THREE.Scene();
      const meshBack = new THREE.Mesh(
        quad,
        new THREE.ShaderMaterial({
          vertexShader: vert,
          fragmentShader: backFrag,
          uniforms: uniformsBack,
          transparent: true,
          depthTest: false,
          depthWrite: false,
        }),
      );
      const meshFront = new THREE.Mesh(
        quad,
        new THREE.ShaderMaterial({
          vertexShader: vert,
          fragmentShader: frontFrag,
          uniforms: uniformsFront,
          transparent: true,
          depthTest: false,
          depthWrite: false,
        }),
      );
      meshBack.renderOrder = 0;
      meshFront.renderOrder = 1;
      scene.add(meshBack, meshFront);

      /* precompile every shader now → zero hitch on first scroll */
      renderer.compile(scene, camera);
      renderer.compile(bakeScene, camera);

      /* ==================================================================
   3. ARCHIVE + LOADER (LQIP → full, off-thread decode, priority queue)
   ================================================================== */
      const PHOTO_IDS = [
        "photo-1579783900882-c0d3dad7b119",
        "photo-1582561424760-0321d75e81fa",
        "photo-1579783902614-a3fb3927b675",
        "photo-1577083552431-6e5fd01aa342",
        "photo-1580136579312-94651dfd596d",
        "photo-1578301978693-85fa9c0320b9",
        "photo-1579783928621-7a13d66a62d1",
        "photo-1563089145-599997674d42",
        "photo-1582561424749-31765c92c81d",
        "photo-1577720580479-7d839d829c73",
      ];
      const srcURL = (id, w, q) =>
        `https://images.unsplash.com/${id}?auto=format&fit=crop&w=${w}&q=${q}`;

      const assets = PHOTO_IDS.map((id) => ({
        id,
        low: null,
        full: null,
        edgeLow: null,
        edgeFull: null,
        lowReq: false,
        fullReq: false,
        tries: 0,
      }));
      const assetAt = (i) =>
        assets[((i % assets.length) + assets.length) % assets.length];

      let needsRender = true,
        readyCount = 0;

      /* priority queue */
      let inFlight = 0;
      const jobs = [];
      function schedule(priority, run) {
        jobs.push({ priority, run });
        pump();
      }
      function pump() {
        while (inFlight < MAX_PARALLEL && jobs.length) {
          let bi = 0;
          for (let i = 1; i < jobs.length; i++)
            if (jobs[i].priority < jobs[bi].priority) bi = i;
          const job = jobs.splice(bi, 1)[0];
          inFlight++;
          job.run().finally(() => {
            inFlight--;
            pump();
          });
        }
      }

      const hasBitmap = typeof createImageBitmap === "function";
      const bmpLoader = hasBitmap ? new THREE.ImageBitmapLoader() : null;
      if (bmpLoader) {
        bmpLoader.setCrossOrigin("anonymous");
        bmpLoader.setOptions({
          imageOrientation: "flipY",
          premultiplyAlpha: "none",
        });
      }
      const imgLoader = new THREE.TextureLoader();
      imgLoader.setCrossOrigin("anonymous");

      function finishTexture(tex) {
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.minFilter = tex.magFilter = THREE.LinearFilter;
        tex.generateMipmaps = false;
        tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
        tex.needsUpdate = true;
        renderer.initTexture(tex); // GPU upload now, not during a scroll frame
        return tex;
      }
      function loadTexture(url) {
        return new Promise((res, rej) => {
          if (bmpLoader)
            bmpLoader.load(
              url,
              (b) => res(finishTexture(new THREE.Texture(b))),
              undefined,
              () =>
                imgLoader.load(
                  url,
                  (t) => res(finishTexture(t)),
                  undefined,
                  rej,
                ),
            );
          else
            imgLoader.load(url, (t) => res(finishTexture(t)), undefined, rej);
        });
      }

      function requestLow(a, p) {
        if (a.low || a.lowReq) return;
        a.lowReq = true;
        schedule(p, () =>
          loadTexture(srcURL(a.id, LOW_W, LOW_Q))
            .then((t) => {
              a.low = t;
              a.edgeLow = bakeEdges(t);
              needsRender = true;
            })
            .catch(() => {
              if (a.tries++ < 3) a.lowReq = false;
            }),
        );
      }
      function requestFull(a, p) {
        if (a.full || a.fullReq) return;
        a.fullReq = true;
        schedule(p, () =>
          loadTexture(srcURL(a.id, FULL_W, FULL_Q))
            .then((t) => {
              a.full = t;
              a.edgeFull = bakeEdges(t);
              readyCount++;
              needsRender = true;
              /* low-res no longer needed */
              if (a.low) {
                a.low.dispose();
                a.low.image?.close?.();
                a.low = null;
              }
              if (a.edgeLow) {
                a.edgeLow.dispose();
                a.edgeLow = null;
              }
            })
            .catch(() => {
              if (a.tries++ < 3) a.fullReq = false;
            }),
        );
      }
      const bestOf = (a) =>
        a.full
          ? { tex: a.full, edge: a.edgeFull.texture }
          : a.low
            ? { tex: a.low, edge: a.edgeLow.texture }
            : null;

      /* warm start */
      assets.forEach((a, i) => requestLow(a, i));
      assets.forEach((a, i) => requestFull(a, i < 3 ? -100 + i : 100 + i));

      /* ==================================================================
   4. SCROLL + RESIZE
   ================================================================== */
      let travel = 1,
        smoothScroll = 0,
        lastIndex = -1,
        lastProgress = -1;
      const spacer = document.getElementById("spacer"),
        barEl = document.getElementById("bar"),
        counter = document.getElementById("counter"),
        heroEl = document.getElementById("hero"),
        loaderEl = document.getElementById("loader"),
        statusEl = document.getElementById("status");

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, DPR_CAP);
        renderer.setPixelRatio(dpr);
        renderer.setSize(window.innerWidth, window.innerHeight, false);
        uniformsFront.uResolution.value.set(
          window.innerWidth * dpr,
          window.innerHeight * dpr,
        );
        uniformsBack.uResolution.value.copy(uniformsFront.uResolution.value);
        travel = window.innerHeight * TRAVEL_VH;
        spacer.style.height =
          VIRTUAL_LENGTH * travel + window.innerHeight + "px";
        needsRender = true;
      }
      window.addEventListener("resize", resize);
      window.addEventListener("orientationchange", () =>
        setTimeout(resize, 250),
      );
      window.addEventListener(
        "scroll",
        () => {
          needsRender = true;
        },
        { passive: true },
      );
      if ("scrollRestoration" in history) history.scrollRestoration = "manual";
      window.scrollTo(0, 0);
      resize();
      smoothScroll = window.scrollY;

      /* ==================================================================
   5. RENDER LOOP — never blocks on network
   ================================================================== */
      function apply(u, s) {
        u.uTexture.value = s.tex;
        u.uEdge.value = s.edge;
        const img = s.tex.image;
        u.uImageResolution.value.set(
          img.naturalWidth || img.width,
          img.naturalHeight || img.height,
        );
      }

      let firstPaint = false,
        lastStatus = "";
      function frame() {
        requestAnimationFrame(frame);

        const target = window.scrollY;
        smoothScroll += (target - smoothScroll) * SMOOTHING;
        if (Math.abs(target - smoothScroll) < 0.05) smoothScroll = target;

        const index = Math.max(0, Math.floor(smoothScroll / travel));
        const progress = Math.min(
          Math.max((smoothScroll - index * travel) / travel, 0),
          1,
        );

        for (let k = 0; k <= LOOK_AHEAD; k++) {
          const a = assetAt(index + k);
          requestLow(a, k - 50);
          requestFull(a, k * 10 - 40);
        }

        /* pick best available; fall back to neighbour so the frame is always drawn */
        const sF = bestOf(assetAt(index)) || bestOf(assetAt(index + 1));
        const sB = bestOf(assetAt(index + 1)) || sF;

        if (
          sF &&
          (needsRender ||
            index !== lastIndex ||
            Math.abs(progress - lastProgress) > 0.0004)
        ) {
          apply(uniformsFront, sF);
          uniformsFront.uDissolve.value = progress;
          uniformsFront.uGrayscale.value = Math.min(1, progress / 0.35);
          uniformsFront.uEdgeIntensity.value = progress * 0.55;
          uniformsFront.uEdgeBrightness.value = 1 - progress * 0.45;

          apply(uniformsBack, sB);
          const acc = Math.min(1, progress * 1.12);
          uniformsBack.uEdgeIntensity.value = 0.65 * (1 - acc);
          uniformsBack.uDarkness.value = 1 - acc;

          renderer.render(scene, camera);
          needsRender = false;
          lastIndex = index;
          lastProgress = progress;

          barEl.style.transform = `scaleX(${progress})`;
          counter.textContent = String(index + 1).padStart(3, "0");
          const fade = Math.max(
            0,
            1 - smoothScroll / (window.innerHeight * 0.6),
          );
          heroEl.style.opacity = fade;
          heroEl.style.transform = `translate(-50%,-50%) scale(${0.98 + fade * 0.02})`;

          if (!firstPaint) {
            firstPaint = true;
            loaderEl.classList.add("hidden");
            setTimeout(() => loaderEl.remove(), 600);
          }
        }

        const st =
          readyCount >= assets.length
            ? "infinite gallery"
            : `restoring ${readyCount}/${assets.length}`;
        if (st !== lastStatus) {
          statusEl.textContent = st;
          lastStatus = st;
        }
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
