<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Scroll Dissolve Reveal — Historic Art Edition</title>

<style>
  :root{
    --fg: #f5f5f5;
    --muted: rgba(245,245,245,.55);
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
  }

  *{ box-sizing:border-box; }

  html{
    scroll-behavior:auto;
    background:#000;
  }

  /* ---------- COMPLETELY HIDE SCROLLBAR ---------- */
  html, body{
    scrollbar-width: none;          /* Firefox */
    -ms-overflow-style: none;       /* IE / old Edge */
  }
  html::-webkit-scrollbar,
  body::-webkit-scrollbar{
    display: none;                  /* Chrome / Safari / Edge */
    width: 0;
    height: 0;
  }

  body{
    margin:0;
    background:#000;
    color:var(--fg);
    font-family:var(--font);
    overscroll-behavior-y:none;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- WebGL layer ---------- */
  #gl{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    z-index:0;
  }

  .vignette{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:
      radial-gradient(120% 90% at 50% 50%, transparent 40%, rgba(0,0,0,.75) 100%);
    mix-blend-mode:multiply;
  }

  /* ---------- Scroll spacer ---------- */
  #spacer{
    position:relative;
    z-index:2;
    width:100%;
    pointer-events:none;
  }

  /* ---------- UI ---------- */
  .ui{
    position:fixed;
    z-index:3;
    pointer-events:none;
    user-select:none;
  }

  .topbar{
    top:0; left:0; right:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:22px clamp(16px,4vw,48px);
    font-size:12px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--muted);
    mix-blend-mode:difference;
  }
  .topbar strong{
    color:var(--fg);
    font-weight:600;
    letter-spacing:.28em;
  }

  .center{
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    mix-blend-mode:difference;
    transition:opacity .45s ease, transform .45s ease;
  }
  .center h1{
    margin:0;
    font-size:clamp(28px,7vw,86px);
    line-height:.95;
    font-weight:700;
    letter-spacing:-.03em;
  }
  .center p{
    margin:14px 0 0;
    font-size:clamp(11px,1.4vw,13px);
    letter-spacing:.3em;
    text-transform:uppercase;
    color:var(--muted);
  }

  .bottombar{
    left:0; right:0; bottom:0;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
    padding:22px clamp(16px,4vw,48px) 40px;
    color:var(--muted);
    mix-blend-mode:difference;
  }

  /* ---------- BIG COUNTER (BOTTOM LEFT) ---------- */
  .counter{
    font-variant-numeric:tabular-nums;
    display:flex;
    align-items:baseline;
    gap:14px;
    line-height:.9;
  }
  .counter .num{
    font-size:clamp(56px, 11vw, 160px);
    font-weight:700;
    letter-spacing:-.04em;
    color:var(--fg);
    line-height:.85;
  }
  .counter .of{
    font-size:clamp(14px, 2.2vw, 26px);
    font-weight:500;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
  }

  /* ---------- BOLD PROGRESS BAR ---------- */
  .progress{
    position:fixed;
    left:0; right:0; bottom:0;
    height:10px;
    z-index:4;
    background:rgba(255,255,255,.15);
    pointer-events:none;
  }
  .progress span{
    display:block;
    height:100%;
    width:0%;
    background:#fff;
    box-shadow:0 0 18px rgba(255,255,255,.55), 0 0 4px rgba(255,255,255,.9);
    transform-origin:left center;
    will-change:width;
  }

  .hint{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:11px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--muted);
    padding-bottom:8px;
  }
  .hint i{
    display:block;
    width:1px;
    height:34px;
    background:linear-gradient(to bottom, rgba(255,255,255,0), #fff);
    animation:drop 1.8s ease-in-out infinite;
  }
  @keyframes drop{
    0%   { transform:scaleY(.2); transform-origin:top;    opacity:0; }
    40%  { transform:scaleY(1);  transform-origin:top;    opacity:1; }
    60%  { transform:scaleY(1);  transform-origin:bottom; opacity:1; }
    100% { transform:scaleY(.2); transform-origin:bottom; opacity:0; }
  }

  #loader{
    position:fixed;
    inset:0;
    z-index:9;
    display:grid;
    place-items:center;
    background:#000;
    color:var(--muted);
    font-size:11px;
    letter-spacing:.3em;
    text-transform:uppercase;
    transition:opacity .6s ease;
  }
  #loader.hidden{ opacity:0; pointer-events:none; }

  @media (prefers-reduced-motion: reduce){
    .hint i{ animation:none; }
  }
</style>
</head>

<body>

  <canvas id="gl"></canvas>
  <div class="vignette"></div>
  <div id="spacer"></div>

  <header class="ui topbar">
    <strong>Dissolve&nbsp;/&nbsp;Reveal</strong>
    <span id="status">historic archive</span>
  </header>

  <div class="ui center" id="hero">
    <h1>Historic Dissolve</h1>
    <p>etched silver line reveal</p>
  </div>

  <footer class="ui bottombar">
    <div class="counter">
      <span class="num" id="counter">001</span>
      <span class="of">/ ∞</span>
    </div>
    <div class="hint"><span>Scroll</span><i></i></div>
  </footer>

  <div class="progress"><span id="bar"></span></div>
  <div id="loader">Loading Archive</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

/* ==================================================================
   1. SHADERS (High-Contrast Sobel Edge Lines)
   ================================================================== */

const coverVertexShader = /* glsl */`
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;

/* FRONT LAYER: Dissolves outward while tracing actual artwork outlines in silver */
const coverFragmentShader = /* glsl */`
  uniform sampler2D uTexture;
  uniform vec2 uResolution;
  uniform vec2 uImageResolution;
  uniform float uDissolve;
  uniform vec2 uCenter;
  uniform float uTime;
  uniform float uGrayscale;
  uniform float uEdgeIntensity;
  uniform float uEdgeBrightness;
  varying vec2 vUv;

  float getLuminance(vec3 color) {
    return dot(color, vec3(0.299, 0.587, 0.114));
  }

  /* Optimized 3x3 Sobel edge detection to map exact image contours */
  float sobel(sampler2D tex, vec2 uv, vec2 texelSize) {
    vec2 s = texelSize * 1.5;
    float gx = 0.0;
    float gy = 0.0;

    gx += -1.0 * getLuminance(texture2D(tex, uv + vec2(-s.x, -s.y)).rgb);
    gx += -2.0 * getLuminance(texture2D(tex, uv + vec2(-s.x,  0.0)).rgb);
    gx += -1.0 * getLuminance(texture2D(tex, uv + vec2(-s.x,  s.y)).rgb);
    gx +=  1.0 * getLuminance(texture2D(tex, uv + vec2( s.x, -s.y)).rgb);
    gx +=  2.0 * getLuminance(texture2D(tex, uv + vec2( s.x,  0.0)).rgb);
    gx +=  1.0 * getLuminance(texture2D(tex, uv + vec2( s.x,  s.y)).rgb);

    gy += -1.0 * getLuminance(texture2D(tex, uv + vec2(-s.x, -s.y)).rgb);
    gy += -2.0 * getLuminance(texture2D(tex, uv + vec2( 0.0, -s.y)).rgb);
    gy += -1.0 * getLuminance(texture2D(tex, uv + vec2( s.x, -s.y)).rgb);
    gy +=  1.0 * getLuminance(texture2D(tex, uv + vec2(-s.x,  s.y)).rgb);
    gy +=  2.0 * getLuminance(texture2D(tex, uv + vec2( 0.0,  s.y)).rgb);
    gy +=  1.0 * getLuminance(texture2D(tex, uv + vec2( s.x,  s.y)).rgb);

    return sqrt(gx * gx + gy * gy);
  }

  float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
  }

  float noise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    float a = hash(i);
    float b = hash(i + vec2(1.0, 0.0));
    float c = hash(i + vec2(0.0, 1.0));
    float d = hash(i + vec2(1.0, 1.0));
    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
  }

  float fbm(vec2 p) {
    float value = 0.0;
    float amplitude = 0.5;
    float frequency = 1.0;
    for (int i = 0; i < 5; i++) {
      value += amplitude * noise(p * frequency);
      amplitude *= 0.5;
      frequency *= 2.0;
    }
    return value;
  }

  void main() {
    vec2 ratio = vec2(
      min((uResolution.x / uResolution.y) / (uImageResolution.x / uImageResolution.y), 1.0),
      min((uResolution.y / uResolution.x) / (uImageResolution.y / uImageResolution.x), 1.0)
    );

    vec2 uv = vec2(
      vUv.x * ratio.x + (1.0 - ratio.x) * 0.5,
      vUv.y * ratio.y + (1.0 - ratio.y) * 0.5
    );

    vec4 texColor = texture2D(uTexture, uv);

    float gray = getLuminance(texColor.rgb);
    texColor.rgb = mix(texColor.rgb, vec3(gray), uGrayscale);

    vec2 centeredUv = vUv - uCenter;
    float aspect = uResolution.x / uResolution.y;
    centeredUv.x *= aspect;
    float dist = length(centeredUv);

    float angle = atan(centeredUv.y, centeredUv.x);

    float noiseScale = 6.0;
    vec2 pixelatedUv = floor(vUv * uResolution / noiseScale) * noiseScale / uResolution;
    float blockNoise = fbm(pixelatedUv * 100.0) * 0.15;
    float angularNoise = fbm(vec2(angle * 5.0, 0.0)) * 0.15;

    float totalNoise = blockNoise + angularNoise;
    float noisyDist = dist + totalNoise;

    float maxDist = length(vec2(aspect * 0.5, 0.5));
    float normalizedDist = noisyDist / maxDist;

    float dissolveThreshold = uDissolve * 1.5;

    vec2 texelSize = 1.0 / uResolution;
    float edge = sobel(uTexture, uv, texelSize);
    edge = pow(edge, 0.6) * 2.2;
    edge = clamp(edge, 0.0, 1.0);

    float dissolveMask = smoothstep(dissolveThreshold - 0.03, dissolveThreshold, normalizedDist);

    vec3 edgeColor = vec3(0.92, 0.96, 1.0); // Metallic silver tint
    vec3 baseColor = mix(texColor.rgb, vec3(0.0), uGrayscale * 0.5);
    vec3 finalColor = baseColor;

    float edgeGlowIntensity = uEdgeIntensity * 2.5;
    float edgeGlow = edge * edgeGlowIntensity * (1.0 + uGrayscale * 2.0);
    finalColor += edgeColor * edgeGlow * uEdgeBrightness;

    /* Highlight zone along the boundary */
    float edgeZoneWidth = 0.14 * (1.0 - uDissolve) + 0.03;
    float edgeZone = smoothstep(dissolveThreshold - edgeZoneWidth, dissolveThreshold - edgeZoneWidth + 0.04, normalizedDist) *
                     smoothstep(dissolveThreshold + 0.02, dissolveThreshold - 0.02, normalizedDist);

    /* KEY FIX: Multiply pixelated hash by 'edge' so silver lines strictly follow image outlines */
    float blockHash = hash(floor(vUv * uResolution / 5.0));
    float sparkle = blockHash * edge * edgeZone;

    float edgeBrightness = (1.0 - uDissolve) * uEdgeBrightness * (1.0 + uGrayscale * 2.0);
    finalColor += edgeColor * (sparkle * 4.0 * edgeBrightness);

    float alpha = dissolveMask * texColor.a;
    gl_FragColor = vec4(finalColor, alpha);
  }
`;

/* BACK LAYER: Revealed layer starting as etched silver linework on dark canvas */
const coverFragmentShaderReverse = /* glsl */`
  uniform sampler2D uTexture;
  uniform vec2 uResolution;
  uniform vec2 uImageResolution;
  uniform float uDissolve;
  uniform vec2 uCenter;
  uniform float uTime;
  uniform float uBrightness;
  uniform float uEdgeIntensity;
  uniform float uDarkness;
  uniform float uGrayscale;
  varying vec2 vUv;

  float getLuminance(vec3 color) {
    return dot(color, vec3(0.299, 0.587, 0.114));
  }

  float sobel(sampler2D tex, vec2 uv, vec2 texelSize) {
    vec2 s = texelSize * 1.5;
    float gx = 0.0;
    float gy = 0.0;

    gx += -1.0 * getLuminance(texture2D(tex, uv + vec2(-s.x, -s.y)).rgb);
    gx += -2.0 * getLuminance(texture2D(tex, uv + vec2(-s.x,  0.0)).rgb);
    gx += -1.0 * getLuminance(texture2D(tex, uv + vec2(-s.x,  s.y)).rgb);
    gx +=  1.0 * getLuminance(texture2D(tex, uv + vec2( s.x, -s.y)).rgb);
    gx +=  2.0 * getLuminance(texture2D(tex, uv + vec2( s.x,  0.0)).rgb);
    gx +=  1.0 * getLuminance(texture2D(tex, uv + vec2( s.x,  s.y)).rgb);

    gy += -1.0 * getLuminance(texture2D(tex, uv + vec2(-s.x, -s.y)).rgb);
    gy += -2.0 * getLuminance(texture2D(tex, uv + vec2( 0.0, -s.y)).rgb);
    gy += -1.0 * getLuminance(texture2D(tex, uv + vec2( s.x, -s.y)).rgb);
    gy +=  1.0 * getLuminance(texture2D(tex, uv + vec2(-s.x,  s.y)).rgb);
    gy +=  2.0 * getLuminance(texture2D(tex, uv + vec2( 0.0,  s.y)).rgb);
    gy +=  1.0 * getLuminance(texture2D(tex, uv + vec2( s.x,  s.y)).rgb);

    return sqrt(gx * gx + gy * gy);
  }

  void main() {
    vec2 ratio = vec2(
      min((uResolution.x / uResolution.y) / (uImageResolution.x / uImageResolution.y), 1.0),
      min((uResolution.y / uResolution.x) / (uImageResolution.y / uImageResolution.x), 1.0)
    );

    vec2 uv = vec2(
      vUv.x * ratio.x + (1.0 - ratio.x) * 0.5,
      vUv.y * ratio.y + (1.0 - ratio.y) * 0.5
    );

    vec4 texColor = texture2D(uTexture, uv);

    float gray = getLuminance(texColor.rgb);
    texColor.rgb = mix(texColor.rgb, vec3(gray), uGrayscale);

    vec2 texelSize = 1.0 / uResolution;
    float edge = sobel(uTexture, uv, texelSize);
    edge = pow(edge, 0.6) * 2.2;
    edge = clamp(edge, 0.0, 1.0);

    vec3 edgeColor = vec3(0.92, 0.96, 1.0); // Metallic silver lines
    vec3 darkBase = vec3(0.02);
    vec3 baseColor = mix(texColor.rgb, darkBase, uDarkness);

    float edgeGlow = edge * uEdgeIntensity * 2.5;
    baseColor += edgeColor * edgeGlow;

    vec3 finalColor = clamp(baseColor, 0.0, 1.0);
    gl_FragColor = vec4(finalColor, texColor.a);
  }
`;


/* ==================================================================
   2. HISTORIC ARTWORK SOURCE (Curated Museums & Classical Art)
   ================================================================== */

const IMG_W = 1280, IMG_H = 1600;

/* Collection of high-resolution classical historic artworks, paintings & sculptures */
const HISTORIC_ARTWORKS = [
  "https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?w=1280&auto=format&fit=crop&q=80", // Rembrandt Portrait
  "https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=1280&auto=format&fit=crop&q=80", // Classical Painting Detail
  "https://images.unsplash.com/photo-1582562124811-c09040d0a901?w=1280&auto=format&fit=crop&q=80", // Vintage Engraving / Historic Art
  "https://images.unsplash.com/photo-1578926375605-eaf7559b1458?w=1280&auto=format&fit=crop&q=80", // Classical Masterpiece
  "https://images.unsplash.com/photo-1579783901586-d88db74b4fe4?w=1280&auto=format&fit=crop&q=80", // Historic Portrait
  "https://images.unsplash.com/photo-1577083552431-6e5fd01aa342?w=1280&auto=format&fit=crop&q=80", // Renaissance Art
  "https://images.unsplash.com/photo-1578301978693-85fa9c0320b9?w=1280&auto=format&fit=crop&q=80", // Marble Sculpture
  "https://images.unsplash.com/photo-1561214115-f2f134cc4912?w=1280&auto=format&fit=crop&q=80", // Baroque Art
  "https://images.unsplash.com/photo-1580136579312-94651dfd596d?w=1280&auto=format&fit=crop&q=80", // Greek Statue
  "https://images.unsplash.com/photo-1579783890846-302381e428a2?w=1280&auto=format&fit=crop&q=80", // Classical Scene
  "https://images.unsplash.com/photo-1579783902136-1234125b2149?w=1280&auto=format&fit=crop&q=80", // Fine Art Painting
  "https://images.unsplash.com/photo-1541701494587-cb58502866ab?w=1280&auto=format&fit=crop&q=80", // Historic Fresco
  "https://images.unsplash.com/photo-1576016770956-de890263e5e4?w=1280&auto=format&fit=crop&q=80", // Vintage Museum Piece
  "https://images.unsplash.com/photo-1579783892117-09f1f0a205a2?w=1280&auto=format&fit=crop&q=80"  // Ancient Mythology Art
];

let artworkIndex = 0;

function makeImageURL() {
  const url = HISTORIC_ARTWORKS[artworkIndex % HISTORIC_ARTWORKS.length];
  artworkIndex++;
  return url;
}

const images = [];
function ensureImages(count) {
  while (images.length < count) images.push(makeImageURL());
}
ensureImages(6);


/* ==================================================================
   3. TEXTURE CACHE & PRELOADER
   ================================================================== */

const loader = new THREE.TextureLoader();
loader.setCrossOrigin('anonymous');
const cache = new Map();

function getTexture(url) {
  let entry = cache.get(url);
  if (entry) return entry;

  entry = { texture: null, loading: true, error: false };
  cache.set(url, entry);

  loader.load(
    url,
    (tex) => {
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.generateMipmaps = false;
      tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
      entry.texture = tex;
      entry.loading = false;
      needsRender = true;
    },
    undefined,
    () => { entry.loading = false; entry.error = true; needsRender = true; }
  );
  return entry;
}

function pruneTextures(index) {
  const keep = new Set();
  for (let i = index - 2; i <= index + 4; i++) if (images[i]) keep.add(images[i]);
  cache.forEach((entry, url) => {
    if (!keep.has(url)) {
      if (entry.texture) entry.texture.dispose();
      cache.delete(url);
    }
  });
}


/* ==================================================================
   4. THREE.JS SCENE SETUP
   ================================================================== */

const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: false,
  alpha: false,
  powerPreference: 'high-performance'
});
renderer.setClearColor(0x000000, 1);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
camera.position.set(0, 0, 1);

const geometry = new THREE.PlaneGeometry(2, 2);

const uniformsBack = {
  uTexture:         { value: null },
  uResolution:      { value: new THREE.Vector2(1, 1) },
  uImageResolution: { value: new THREE.Vector2(IMG_W, IMG_H) },
  uDissolve:        { value: 0 },
  uCenter:          { value: new THREE.Vector2(0.5, 0.5) },
  uTime:            { value: 0 },
  uBrightness:      { value: 0 },
  uEdgeIntensity:   { value: 0.6 },
  uDarkness:        { value: 1 },
  uGrayscale:       { value: 1 },
};

const uniformsFront = {
  uTexture:         { value: null },
  uResolution:      { value: new THREE.Vector2(1, 1) },
  uImageResolution: { value: new THREE.Vector2(IMG_W, IMG_H) },
  uDissolve:        { value: 0 },
  uCenter:          { value: new THREE.Vector2(0.5, 0.5) },
  uTime:            { value: 0 },
  uGrayscale:       { value: 0 },
  uEdgeIntensity:   { value: 0 },
  uEdgeBrightness:  { value: 1 },
};

const matBack = new THREE.ShaderMaterial({
  vertexShader: coverVertexShader,
  fragmentShader: coverFragmentShaderReverse,
  uniforms: uniformsBack,
  transparent: true, depthTest: false, depthWrite: false
});

const matFront = new THREE.ShaderMaterial({
  vertexShader: coverVertexShader,
  fragmentShader: coverFragmentShader,
  uniforms: uniformsFront,
  transparent: true, depthTest: false, depthWrite: false
});

const meshBack = new THREE.Mesh(geometry, matBack);
meshBack.position.z = -0.1;
meshBack.renderOrder = 0;

const meshFront = new THREE.Mesh(geometry, matFront);
meshFront.renderOrder = 1;

scene.add(meshBack, meshFront);


/* ==================================================================
   5. SCROLL DRIVER & RENDER LOOP
   ================================================================== */

const TRAVEL_VH = 1.5;
const SMOOTHING = 0.12;

let travel = window.innerHeight * TRAVEL_VH;
let smoothScroll = 0;
let needsRender = true;
let lastIndex = -1, lastProgress = -1;

const spacer   = document.getElementById('spacer');
const barEl    = document.getElementById('bar');
const counter  = document.getElementById('counter');
const heroEl   = document.getElementById('hero');
const loaderEl = document.getElementById('loader');
const statusEl = document.getElementById('status');

function updateSpacerHeight() {
  spacer.style.height = ((images.length - 1) * travel + window.innerHeight) + 'px';
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 1.75);
  renderer.setPixelRatio(dpr);
  renderer.setSize(window.innerWidth, window.innerHeight, false);

  const w = window.innerWidth * dpr;
  const h = window.innerHeight * dpr;
  uniformsFront.uResolution.value.set(w, h);
  uniformsBack.uResolution.value.set(w, h);

  travel = window.innerHeight * TRAVEL_VH;
  updateSpacerHeight();
  needsRender = true;
}

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 250));
resize();
smoothScroll = window.scrollY;

const clock = new THREE.Clock();
let firstPaintDone = false;

function frame() {
  requestAnimationFrame(frame);

  const target = window.scrollY;
  smoothScroll += (target - smoothScroll) * SMOOTHING;
  if (Math.abs(target - smoothScroll) < 0.05) smoothScroll = target;

  let index = Math.floor(smoothScroll / travel);
  if (index < 0) index = 0;
  let progress = (smoothScroll - index * travel) / travel;
  progress = Math.min(Math.max(progress, 0), 1);

  if (index + 4 >= images.length) {
    ensureImages(index + 8);
    updateSpacerHeight();
  }

  const frontEntry = getTexture(images[index]);
  const backEntry  = getTexture(images[index + 1]);

  for (let i = index + 2; i <= index + 3; i++) if (images[i]) getTexture(images[i]);
  if (index !== lastIndex) pruneTextures(index);

  const ready = !!(frontEntry.texture && backEntry.texture);

  if (ready && (needsRender || index !== lastIndex || Math.abs(progress - lastProgress) > 0.0004)) {

    /* ---- FRONT UNIFORMS ---- */
    uniformsFront.uTexture.value = frontEntry.texture;
    const fImg = frontEntry.texture.image;
    uniformsFront.uImageResolution.value.set(fImg.width, fImg.height);
    uniformsFront.uTime.value = clock.getElapsedTime();
    uniformsFront.uDissolve.value = progress;
    uniformsFront.uGrayscale.value = Math.min(1, progress / 0.4);
    uniformsFront.uEdgeIntensity.value = progress * 0.5;
    uniformsFront.uEdgeBrightness.value = 1 - progress;

    /* ---- BACK UNIFORMS ---- */
    uniformsBack.uTexture.value = backEntry.texture;
    const bImg = backEntry.texture.image;
    uniformsBack.uImageResolution.value.set(bImg.width, bImg.height);
    uniformsBack.uTime.value = uniformsFront.uTime.value;
    const accelerated = Math.min(1, progress * 1.1);
    uniformsBack.uEdgeIntensity.value = 0.6 * (1 - accelerated);
    uniformsBack.uDarkness.value = 1 - accelerated;
    uniformsBack.uGrayscale.value = 1 - accelerated;

    renderer.render(scene, camera);

    needsRender = false;
    lastIndex = index;
    lastProgress = progress;

    /* ---- UI UPDATE ---- */
    barEl.style.width = (progress * 100).toFixed(2) + '%';
    counter.textContent = String(index + 1).padStart(3, '0');
    const heroFade = Math.max(0, 1 - smoothScroll / (window.innerHeight * 0.6));
    heroEl.style.opacity = heroFade;
    heroEl.style.transform = `translate(-50%,-50%) scale(${0.98 + heroFade * 0.02})`;

    if (!firstPaintDone) {
      firstPaintDone = true;
      loaderEl.classList.add('hidden');
      setTimeout(() => loaderEl.remove(), 700);
    }
  }

  statusEl.textContent = ready ? 'historic archive' : 'loading art…';
}

requestAnimationFrame(frame);

window.addEventListener('scroll', () => { needsRender = true; }, { passive: true });
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
window.scrollTo(0, 0);
</script>
