<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" /> 
    <title>Page Flip Book</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/CustomEase.min.js"></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 20px;
        background: #e6e9ed;
        font-family: system-ui, sans-serif;
      }

      h1 {
        margin: 0;
        text-align: center;
        font:
          500 2.4rem Georgia,
          serif;
      }

      .stage {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .caption {
        margin: 0;
        text-align: center;
        font-size: 12px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #8a8d97;
      }

      .arrow {
        border: 0;
        background: none;
        font-size: 36px;
        color: #aaa;
        cursor: pointer;
      }

      .arrow:hover {
        color: #111;
      }

      .book {
        position: relative;
        width: min(720px, 80vw);
        aspect-ratio: 16 / 9;
        perspective: 2600px;
        cursor: pointer;
      }

      .book::before {
        content: "";
        position: absolute;
        inset: 9% 19% 3% 21%;
        border-radius: 18px;
        background: rgba(20, 22, 30, 0.15);
        filter: blur(28px);
      }

      .book * {
        pointer-events: none;
      }

      .page,
      .turn {
        display: contents;
      }

      .half,
      .face {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        overflow: hidden;
      }

      .half {
        width: 50%;
      }

      .half.right {
        left: 50%;
      }

      .half img,
      .face img {
        display: block;
        width: 200%;
        height: 100%;
        /* object-fit: cover; Original */
        object-fit: contain;
        object-position: center;
        user-select: none;
      }

      img.right {
        margin-left: -100%;
      }

      .flap {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 50%;
        transform-style: preserve-3d;
        will-change: transform;
      }

      .flap.next {
        left: 50%;
      }

      .face {
        width: 100%;
        backface-visibility: hidden;
        /* The curl-clip path is mutated every frame during a turn to bow
           the free edge of the page inward, like a bending sheet of paper. */
        clip-path: url(#curl-clip);
      }

      .face.back {
        transform: rotateY(180deg);
      }

      /* Soft shading that builds up along the curling edge as the page
         bends, and fades again as it lies flat. Driven by JS (opacity). */
      .fold-shadow {
        position: absolute;
        inset: 0;
        opacity: 0;
        z-index: 6;
      }

      .flap.next .fold-shadow {
        background: linear-gradient(
          to left,
          rgba(10, 10, 15, 0.55),
          rgba(10, 10, 15, 0) 65%
        );
      }

      .flap.prev .fold-shadow {
        background: linear-gradient(
          to right,
          rgba(10, 10, 15, 0.55),
          rgba(10, 10, 15, 0) 65%
        );
      }

      .book.blur-light img {
        filter: url(#motion-blur-light);
      }

      .book.blur-heavy img {
        filter: url(#motion-blur-heavy);
      }
    </style>
  </head>

  <body>
    <h1>Travel Sketch Journal</h1>

    <svg width="0" height="0" aria-hidden="true">
      <defs>
        <filter id="motion-blur-light">
          <feGaussianBlur stdDeviation="5 0" />
        </filter>
        <filter id="motion-blur-heavy">
          <feGaussianBlur stdDeviation="14 0" />
        </filter>
        <!-- Shared clip-path applied to the turning page's front/back faces.
             Its 'd' is rewritten every animation frame to bow the free edge
             inward, simulating a page bending as it turns. -->
        <clipPath id="curl-clip" clipPathUnits="objectBoundingBox">
          <path id="curl-path" d="M0,0 L1,0 L1,1 L0,1 Z" />
        </clipPath>
      </defs>
    </svg>

    <div class="stage">
      <button class="arrow" id="prevButton">‹</button>
      <div class="book" id="book">
        <div class="page" id="page"></div>
      </div>
      <button class="arrow" id="nextButton">›</button>
    </div>

    <p class="caption" id="caption"></p>

    <script>
      const pages = [
        // {
        //   src: "",
        //   title: "Kyoto Performing Arts Hall",
        // },
        {
          src: "https://www.lizsteel.com/wp-content/uploads/2013/01/LizSteel-09-Sat29_01-Bedok-Swimming-Pool.jpg",
          title: "Bedok-Swimming-Pool",
        },
        {
          src: "https://www.lizsteel.com/wp-content/uploads/2013/01/LizSteel-09-Sat29_02-Bedok-Town-Centre.jpg",
          title: "Bedok-Town-Centre",
        },
        {
          src: "https://www.lizsteel.com/wp-content/uploads/2013/01/LizSteel-09-Sat29_03-Bedok-Lunch.jpg",
          title: "Bedok-Lunch",
        },
        {
          src: "https://www.lizsteel.com/wp-content/uploads/2013/01/LizSteel-09-Sat29_04-South-Bedok-Adhoc.jpg",
          title: "South-Bedok-Adhoc",
        },
        {
          src: "https://www.lizsteel.com/wp-content/uploads/2013/01/LizSteel-09-Sat29_05-Marina-Bay-Sands.jpg",
          title: "Marina Bay Sands",
        },
        {
          src: "https://www.lizsteel.com/wp-content/uploads/2013/01/LizSteel-09-Sat29_06-Too-many-tourists.jpg",
          title: "Too Many Tourists",
        },
        {
          src: "https://www.lizsteel.com/wp-content/uploads/2013/01/LizSteel-10-LD30_01-Lords-Day.jpg",
          title: "Lords Day",
        },
      ];

      gsap.registerPlugin(CustomEase);
      CustomEase.create("pageTurn", ".42,.05,.25,1");

      let currentPage = 0;
      let flipTween = null;
      let introPlaying = false;

      // How far (as a fraction of the page's own width) the free edge
      // bows inward at the peak of the curl. Tweak to taste.
      const MAX_BEND = 0.07;

      const halfImage = (pageIndex, side) =>
        `<img src="${pages[pageIndex].src}" class="${side}">`;

      // Builds the clip-path 'd' for the turning page. `edge` is the side
      // of the page that is NOT attached to the spine (the side that's
      // free to lift/bow), `bend` is 0 (flat) to MAX_BEND (fully bowed).
      function curlPathD(edge, bend) {
        if (edge === "right") {
          const x = 1 - bend;
          const xTip = 1 - bend * 1.6;
          return `M0,0 L${x},0 Q${xTip},0.5 ${x},1 L0,1 Z`;
        }
        const x = bend;
        const xTip = bend * 1.6;
        return `M1,0 L${x},0 Q${xTip},0.5 ${x},1 L1,1 Z`;
      }

      const curlPathEl = document.getElementById("curl-path");

      function showPage(pageIndex) {
        currentPage = pageIndex;
        page.innerHTML = `
        <div class="half left">${halfImage(pageIndex, "left")}</div>
        <div class="half right">${halfImage(pageIndex, "right")}</div>`;
      }

      function setCaption(title) {
        caption.textContent = title;
        gsap.fromTo(
          caption,
          { opacity: 0 },
          { opacity: 1, duration: 0.4, overwrite: "auto" },
        );
      }

      function turn(direction, duration = 0.85, ease = "pageTurn", onDone) {
        if (flipTween && flipTween.isActive()) {
          flipTween.progress(1);
        }

        const goingNext = direction === "next";
        const targetPage =
          (currentPage + (goingNext ? 1 : -1) + pages.length) % pages.length;

        const liftSide = goingNext ? "right" : "left";
        const landSide = goingNext ? "left" : "right";
        const freeEdge = goingNext ? "right" : "left";

        book.insertAdjacentHTML(
          "beforeend",
          `
        <div class="turn">
          <div class="half ${liftSide}">${halfImage(targetPage, liftSide)}</div>
          <div class="flap ${goingNext ? "next" : "prev"}">
            <div class="face">${halfImage(currentPage, liftSide)}</div>
            <div class="face back">${halfImage(targetPage, landSide)}</div>
            <div class="fold-shadow"></div>
          </div>
        </div>`,
        );

        const foldShadowEl = book.querySelector(".flap .fold-shadow");
        curlPathEl.setAttribute("d", curlPathD(freeEdge, 0));

        setCaption(pages[targetPage].title);

        flipTween = gsap.to(book.querySelector(".flap"), {
          rotationY: goingNext ? -180 : 180,
          transformOrigin: goingNext ? "left center" : "right center",
          duration: duration,
          ease: ease,
          onUpdate: function () {
            // Bend peaks when the page is mid-turn (edge-on to the
            // viewer) and relaxes flat at both the start and end.
            const t = this.progress();
            const bend = MAX_BEND * Math.sin(t * Math.PI);
            curlPathEl.setAttribute("d", curlPathD(freeEdge, bend));
            if (foldShadowEl) {
              foldShadowEl.style.opacity = (bend / MAX_BEND) * 0.85;
            }
          },
          onComplete() {
            showPage(targetPage);
            book.querySelector(".turn").remove();
            if (onDone) onDone();
          },
        });
      }

      function riffle(step = 0) {
        if (!introPlaying || step >= pages.length) {
          introPlaying = false;
          book.classList.remove("blur-light", "blur-heavy");
          return;
        }

        const bell = Math.sin((Math.PI * step) / (pages.length - 1));
        book.classList.toggle("blur-light", bell > 0.25 && bell <= 0.6);
        book.classList.toggle("blur-heavy", bell > 0.6);

        turn("next", 0.2 - 0.15 * bell, "none", () => riffle(step + 1));
      }

      function navigate(direction) {
        introPlaying = false;
        turn(direction);
      }

      nextButton.onclick = () => navigate("next");
      prevButton.onclick = () => navigate("prev");

      book.onclick = (event) =>
        navigate(event.offsetX < book.offsetWidth / 2 ? "prev" : "next");

      addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight") navigate("next");
        if (event.key === "ArrowLeft") navigate("prev");
      });

      showPage(0);
      setCaption(pages[0].title);

      gsap.delayedCall(0.2, () => {
        introPlaying = true;
        riffle();
      });
    </script>
  </body>
</html>
