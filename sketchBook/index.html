<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page-Flip Book — GSAP</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/CustomEase.min.js"></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 20px;
        background: #e6e9ed;
        font-family: system-ui, sans-serif;
      }

      h1 {
        margin: 0;
        text-align: center;
        font:
          500 2.4rem Georgia,
          serif;
      }

      .stage {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .caption {
        margin: 0;
        text-align: center;
        font-size: 12px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #8a8d97;
      }

      .meta {
        margin: 0;
        text-align: center;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #6b7280;
      }

      .arrow {
        border: 0;
        background: none;
        font-size: 36px;
        color: #aaa;
        cursor: pointer;
      }

      .arrow:hover {
        color: #111;
      }

      .book {
        position: relative;
        width: min(720px, 80vw);
        aspect-ratio: 16 / 9;
        perspective: 2600px;
        cursor: pointer;
      }

      .book::before {
        content: "";
        position: absolute;
        inset: 9% 19% 3% 21%;
        border-radius: 18px;
        background: rgba(20, 22, 30, 0.15);
        filter: blur(28px);
      }

      .book * {
        pointer-events: none;
      }

      .page,
      .turn {
        display: contents;
      }

      .half,
      .face {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        overflow: hidden;
      }

      .half {
        width: 50%;
      }

      .half.right {
        left: 50%;
      }

      .half img,
      .face img {
        display: block;
        width: 1200px;
        height: 800px;
        max-width: 100%;
        max-height: 100%;
        object-fit: cover;
        object-position: center;
        user-select: none;
        background: #dfe3e8;
      }

      img.right {
        margin-left: -100%;
      }

      .flap {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 50%;
        transform-style: preserve-3d;
        will-change: transform;
      }

      .flap.next {
        left: 50%;
      }

      .face {
        width: 100%;
        backface-visibility: hidden;
      }

      .face.back {
        transform: rotateY(180deg);
      }

      .book.blur-light img {
        filter: url(#motion-blur-light);
      }

      .book.blur-heavy img {
        filter: url(#motion-blur-heavy);
      }
    </style>
  </head>

  <body>
    <h1>Sketchbook</h1>

    <svg width="0" height="0" aria-hidden="true">
      <filter id="motion-blur-light">
        <feGaussianBlur stdDeviation="5 0" />
      </filter>
      <filter id="motion-blur-heavy">
        <feGaussianBlur stdDeviation="14 0" />
      </filter>
    </svg>

    <div class="stage">
      <button class="arrow" id="prevButton">‹</button>
      <div class="book" id="book">
        <div class="page" id="page"></div>
      </div>
      <button class="arrow" id="nextButton">›</button>
    </div>

    <p class="caption" id="caption"></p>
    <p class="meta" id="meta"></p>

    <script>
      const pages = [
        {
          src: "https://storage.googleapis.com/runable-production-workspaces/users/B7I80URAC8WthbW432Num3yftMbH69DN/chats/3f1e27b3-e0a3-464c-b4cc-999761e5733c/workspace/fieldbook-art/spread-04-clean_1786702331378.png?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=runable-production%40runable-458805.iam.gserviceaccount.com%2F20260814%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260814T101300Z&X-Goog-Expires=604800&X-Goog-SignedHeaders=host&X-Goog-Signature=4e73d29a2d46bda8b197aabd649839ede7db381f72b894d9ad931b604e9237c1d6f80d3c25980425448c977e7edc66982ba920c2daff7d6e95304befd1d3b8301186b7fe4ddde9dcfd2bd3a377873c0c51967ca659debf245bbe9e6c497818ab34ca599eb837fc03626dbda48220caa95c45f751381462d8cbdbfc5b58cf61b971c369a86a59cb93cd32f62553be89779d5184c7db37595c43055dcd18274c3906c9f03f21d471c9c06a23f2b4892548ba7a5f62f0b3b726cf8cb152ee26840e24295bf4caf379ba6e9171c2e313704f68e852524208330ed5eb5d688d42151e95affa52ede86b28bf43ac8460b4030c7ae7ea1ea102b7d7ca11e0f236721de5",
          title: "Kyoto Performing Arts Hall",
          width: 2048,
          height: 1365,
        },
        {
          src: "https://raw.githubusercontent.com/Hank-D-Tank/x-book/refs/heads/main/images/castle.png",
          title: "Kyoto Performing Arts Hall",
          width: 1200,
          height: 800,
        },
        {
          src: "https://raw.githubusercontent.com/Hank-D-Tank/x-book/refs/heads/main/images/kyoto-performing-arts.png",
          title: "Kyoto Garden Museum",
          width: 1200,
          height: 800,
        },
        {
          src: "https://raw.githubusercontent.com/Hank-D-Tank/x-book/refs/heads/main/images/kyoto.png",
          title: "Western Castle",
          width: 1200,
          height: 800,
        },
        {
          src: "https://raw.githubusercontent.com/Hank-D-Tank/x-book/refs/heads/main/images/osaka.png",
          title: "Taipei Night Market",
          width: 1200,
          height: 800,
        },
        {
          src: "https://raw.githubusercontent.com/Hank-D-Tank/x-book/refs/heads/main/images/taipei-market.png",
          title: "Osaka Castle",
          width: 1200,
          height: 800,
        },
        {
          src: "https://raw.githubusercontent.com/Hank-D-Tank/x-book/refs/heads/main/images/tokyo-museum.png",
          title: "Tokyo National Museum",
          width: 1200,
          height: 800,
        },
      ];

      gsap.registerPlugin(CustomEase);
      CustomEase.create("pageTurn", ".42,.05,.25,1");

      let currentPage = 0;
      let flipTween = null;
      let introPlaying = false;

      const halfImage = (pageIndex, side) =>
        `<img src="${pages[pageIndex].src}" class="${side}" width="1200" height="800" loading="eager" decoding="async">`;

      function showPage(pageIndex) {
        currentPage = pageIndex;
        page.innerHTML = `
        <div class="half left">${halfImage(pageIndex, "left")}</div>
        <div class="half right">${halfImage(pageIndex, "right")}</div>`;
      }

      function setCaption(title, width, height) {
        caption.textContent = title;
        meta.textContent = width && height ? `Image size: ${width} × ${height}px` : "";
        gsap.fromTo(
          caption,
          { opacity: 0 },
          { opacity: 1, duration: 0.4, overwrite: "auto" },
        );
        gsap.fromTo(
          meta,
          { opacity: 0 },
          { opacity: 1, duration: 0.4, overwrite: "auto" },
        );
      }

      pages.forEach((pageData) => {
        pageData.width = 1200;
        pageData.height = 800;
      });

      function turn(direction, duration = 0.85, ease = "pageTurn", onDone) {
        if (flipTween && flipTween.isActive()) {
          flipTween.progress(1);
        }

        const goingNext = direction === "next";
        const targetPage =
          (currentPage + (goingNext ? 1 : -1) + pages.length) % pages.length;

        const liftSide = goingNext ? "right" : "left";
        const landSide = goingNext ? "left" : "right";

        book.insertAdjacentHTML(
          "beforeend",
          `
        <div class="turn">
          <div class="half ${liftSide}">${halfImage(targetPage, liftSide)}</div>
          <div class="flap ${goingNext ? "next" : "prev"}">
            <div class="face">${halfImage(currentPage, liftSide)}</div>
            <div class="face back">${halfImage(targetPage, landSide)}</div>
          </div>
        </div>`,
        );

        setCaption(
          pages[targetPage].title,
          pages[targetPage].width,
          pages[targetPage].height,
        );

        flipTween = gsap.to(book.querySelector(".flap"), {
          rotationY: goingNext ? -180 : 180,
          transformOrigin: goingNext ? "left center" : "right center",
          duration: duration,
          ease: ease,
          onComplete() {
            showPage(targetPage);
            book.querySelector(".turn").remove();
            if (onDone) onDone();
          },
        });
      }

      function riffle(step = 0) {
        if (!introPlaying || step >= pages.length) {
          introPlaying = false;
          book.classList.remove("blur-light", "blur-heavy");
          return;
        }

        const bell = Math.sin((Math.PI * step) / (pages.length - 1));
        book.classList.toggle("blur-light", bell > 0.25 && bell <= 0.6);
        book.classList.toggle("blur-heavy", bell > 0.6);

        turn("next", 0.2 - 0.15 * bell, "none", () => riffle(step + 1));
      }

      function navigate(direction) {
        introPlaying = false;
        turn(direction);
      }

      nextButton.onclick = () => navigate("next");
      prevButton.onclick = () => navigate("prev");

      book.onclick = (event) =>
        navigate(event.offsetX < book.offsetWidth / 2 ? "prev" : "next");

      addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight") navigate("next");
        if (event.key === "ArrowLeft") navigate("prev");
      });

      showPage(0);
      setCaption(pages[0].title, pages[0].width, pages[0].height);

      gsap.delayedCall(0.2, () => {
        introPlaying = true;
        riffle();
      });
    </script>
  </body>
</html>
