<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page-Flip Book — GSAP</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/CustomEase.min.js"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-content: center;
      gap: 20px;
      background: #e6e9ed;
      font-family: system-ui, sans-serif;
    }

    h1 {
      margin: 0;
      text-align: center;
      font: 500 2.4rem Georgia, serif;
    }

    .stage {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .caption {
      margin: 0;
      text-align: center;
      font-size: 12px;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: #8a8d97;
    }

    .arrow {
      border: 0;
      background: none;
      font-size: 36px;
      color: #aaa;
      cursor: pointer;
    }

    .arrow:hover {
      color: #111;
    }

    .book {
      position: relative;
      width: min(720px, 80vw);
      aspect-ratio: 16 / 9;
      perspective: 2600px;
      cursor: pointer;
    }

    .book::before {
      content: "";
      position: absolute;
      inset: 9% 19% 3% 21%;
      border-radius: 18px;
      background: rgba(20, 22, 30, .15);
      filter: blur(28px);
    }

    .book * {
      pointer-events: none;
    }

    .page,
    .turn {
      display: contents;
    }

    .half,
    .face {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      overflow: hidden;
    }

    .half {
      width: 50%;
    }

    .half.right {
      left: 50%;
    }

    .half img,
    .face img {
      display: block;
      width: 200%;
      height: 100%;
      object-fit: cover;
      user-select: none;
    }

    img.right {
      margin-left: -100%;
    }

    .flap {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 50%;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .flap.next {
      left: 50%;
    }

    .face {
      width: 100%;
      backface-visibility: hidden;
    }

    .face.back {
      transform: rotateY(180deg);
    }

    .book.blur-light img {
      filter: url(#motion-blur-light);
    }

    .book.blur-heavy img {
      filter: url(#motion-blur-heavy);
    }
  </style>
</head>

<body>

  <h1>Sketchbook</h1>

  <svg width="0" height="0" aria-hidden="true">
    <filter id="motion-blur-light"><feGaussianBlur stdDeviation="5 0" /></filter>
    <filter id="motion-blur-heavy"><feGaussianBlur stdDeviation="14 0" /></filter>
  </svg>

  <div class="stage">
    <button class="arrow" id="prevButton">‹</button>
    <div class="book" id="book">
      <div class="page" id="page"></div>
    </div>
    <button class="arrow" id="nextButton">›</button>
  </div>

  <p class="caption" id="caption"></p>

  <script>
    const pages = [
      { src: "https://storage.googleapis.com/runable-production-workspaces/users/B7I80URAC8WthbW432Num3yftMbH69DN/chats/3f1e27b3-e0a3-464c-b4cc-999761e5733c/workspace/fieldbook-art/spread-01_1786702094679.png?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=runable-production%40runable-458805.iam.gserviceaccount.com%2F20260814%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260814T100904Z&X-Goog-Expires=604800&X-Goog-SignedHeaders=host&X-Goog-Signature=3440fab9b2749bfacffdf81371e8aa313e688ac05f3cc8ff742b9bf12fb40654a58e814d2082ba75252b1b11664d7b8e08043d8fe4f9a0e2d4ba368e58a62b64edb1508d32721f4658e734f716ed12884399bf823993b67c2156689bdf4bed66647376efa3a21e1c8cc6ed693a1ef9f0467da0f011b759a59541a10af81e6f4a74d190c3758c56e3dd1c3dc7b00b61db8986c8593892eebc2a868cfce5a7d8f8469ac31077f1b8642d0ef966af484f68cd43832a9ed0f197e2852c30fa6ed29b2220ca46fe3d9d19509279d994fa7e69a960203ee2671a001a2db7f10e1d63bc3dd99f2af1ddfa229c564e8d615381775d9c8c8aa1876cc832735ccf7f0536a1", title: "Kyoto Performing Arts Hall" },
      { src: "https://raw.githubusercontent.com/Hank-D-Tank/x-book/refs/heads/main/images/castle.png", title: "Kyoto Performing Arts Hall" },
      { src: "https://raw.githubusercontent.com/Hank-D-Tank/x-book/refs/heads/main/images/kyoto-performing-arts.png", title: "Kyoto Garden Museum" },
      { src: "https://raw.githubusercontent.com/Hank-D-Tank/x-book/refs/heads/main/images/kyoto.png", title: "Western Castle" },
      { src: "https://raw.githubusercontent.com/Hank-D-Tank/x-book/refs/heads/main/images/osaka.png", title: "Taipei Night Market" },
      { src: "https://raw.githubusercontent.com/Hank-D-Tank/x-book/refs/heads/main/images/taipei-market.png", title: "Osaka Castle" },
      { src: "https://raw.githubusercontent.com/Hank-D-Tank/x-book/refs/heads/main/images/tokyo-museum.png", title: "Tokyo National Museum" },
      
    ];

    gsap.registerPlugin(CustomEase);
    CustomEase.create("pageTurn", ".42,.05,.25,1");

    let currentPage = 0;
    let flipTween = null;
    let introPlaying = false;

    const halfImage = (pageIndex, side) =>
      `<img src="${pages[pageIndex].src}" class="${side}">`;

    function showPage(pageIndex) {
      currentPage = pageIndex;
      page.innerHTML = `
        <div class="half left">${halfImage(pageIndex, "left")}</div>
        <div class="half right">${halfImage(pageIndex, "right")}</div>`;
    }

    function setCaption(title) {
      caption.textContent = title;
      gsap.fromTo(caption, { opacity: 0 }, { opacity: 1, duration: 0.4, overwrite: "auto" });
    }

    function turn(direction, duration = 0.85, ease = "pageTurn", onDone) {
      if (flipTween && flipTween.isActive()) {
        flipTween.progress(1);
      }

      const goingNext = direction === "next";
      const targetPage = (currentPage + (goingNext ? 1 : -1) + pages.length) % pages.length;

      const liftSide = goingNext ? "right" : "left";
      const landSide = goingNext ? "left" : "right";

      book.insertAdjacentHTML("beforeend", `
        <div class="turn">
          <div class="half ${liftSide}">${halfImage(targetPage, liftSide)}</div>
          <div class="flap ${goingNext ? "next" : "prev"}">
            <div class="face">${halfImage(currentPage, liftSide)}</div>
            <div class="face back">${halfImage(targetPage, landSide)}</div>
          </div>
        </div>`);

      setCaption(pages[targetPage].title);

      flipTween = gsap.to(book.querySelector(".flap"), {
        rotationY: goingNext ? -180 : 180,
        transformOrigin: goingNext ? "left center" : "right center",
        duration: duration,
        ease: ease,
        onComplete() {
          showPage(targetPage);
          book.querySelector(".turn").remove();
          if (onDone) onDone();
        }
      });
    }

    function riffle(step = 0) {
      if (!introPlaying || step >= pages.length) {
        introPlaying = false;
        book.classList.remove("blur-light", "blur-heavy");
        return;
      }

      const bell = Math.sin(Math.PI * step / (pages.length - 1));
      book.classList.toggle("blur-light", bell > 0.25 && bell <= 0.6);
      book.classList.toggle("blur-heavy", bell > 0.6);

      turn("next", 0.2 - 0.15 * bell, "none", () => riffle(step + 1));
    }

    function navigate(direction) {
      introPlaying = false;
      turn(direction);
    }

    nextButton.onclick = () => navigate("next");
    prevButton.onclick = () => navigate("prev");

    book.onclick = event =>
      navigate(event.offsetX < book.offsetWidth / 2 ? "prev" : "next");

    addEventListener("keydown", event => {
      if (event.key === "ArrowRight") navigate("next");
      if (event.key === "ArrowLeft") navigate("prev");
    });

    showPage(0);
    setCaption(pages[0].title);

    gsap.delayedCall(0.2, () => {
      introPlaying = true;
      riffle();
    });
  </script>
</body>

</html>
