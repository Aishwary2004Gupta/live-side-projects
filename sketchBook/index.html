<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page Flip Book</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/CustomEase.min.js"></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 20px;
        background: #e6e9ed;
        font-family: system-ui, sans-serif;
      }

      h1 {
        margin: 0;
        text-align: center;
        font:
          500 2.4rem Georgia,
          serif;
      }

      .stage {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .caption {
        margin: 0;
        text-align: center;
        font-size: 12px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #8a8d97;
      }

      .arrow {
        border: 0;
        background: none;
        font-size: 36px;
        color: #aaa;
        cursor: pointer;
      }

      .arrow:hover {
        color: #111;
      }

      .book {
        position: relative;
        width: min(720px, 80vw);
        /* Fallback until the first page's real dimensions are known —
           overridden in JS (applyAspect) to match each page's own image
           so it renders with no letterboxing, and the curl strips (which
           key off --bw) always line up with what's on screen. */
        aspect-ratio: 16 / 9;
        perspective: 2600px;
        cursor: grab;
        touch-action: pan-y;
        transition: aspect-ratio 0.3s ease;
        -webkit-tap-highlight-color: transparent;
      }

      .book:active {
        cursor: grabbing;
      }

      .book::before {
        content: "";
        position: absolute;
        inset: 9% 19% 3% 21%;
        border-radius: 18px;
        background: rgba(20, 22, 30, 0.15);
        filter: blur(28px);
      }

      .book * {
        pointer-events: none;
      }

      .page,
      .turn {
        display: contents;
      }

      .half {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 50%;
        overflow: hidden;
      }

      .half.right {
        left: 50%;
      }

      .half img {
        display: block;
        width: 200%;
        height: 100%;
        object-fit: contain;
        object-position: center;
        user-select: none;
      }

      img.right {
        margin-left: -100%;
      }

      /* ================================================================
         The turning leaf: a chain of nested strips forming a curved arc.
         Each strip is hinged to the one before it at a small angle
         (--td), so the whole run of strips sweeps out a curve instead of
         pivoting flat like a door. The chain's own rotation (--tt) runs
         a little further than the true half-turn and back again, which
         is what makes the page bow outward mid-flip and relax flat at
         both ends.
      ================================================================= */
      .flip-curl {
        position: absolute;
        top: 0;
        height: 100%;
        width: calc(var(--bw, 0px) * var(--span));
        transform-style: preserve-3d;
        will-change: transform;
        z-index: 6;
      }
      .flip-curl.next {
        left: 50%;
        transform-origin: left center;
        transform: rotateY(calc(-1 * var(--tt, 0deg)));
      }
      .flip-curl.prev {
        right: 50%;
        transform-origin: right center;
        transform: rotateY(var(--tt, 0deg));
      }
      .flip-strip {
        position: absolute;
        top: 0;
        height: 100%;
        width: calc(var(--bw, 0px) * var(--span) / var(--n));
        transform-style: preserve-3d;
        will-change: transform;
      }
      .flip-curl.next .flip-strip {
        transform-origin: left center;
      }
      .flip-curl.prev .flip-strip {
        transform-origin: right center;
      }
      .flip-curl.next > .flip-strip {
        left: 0;
      }
      .flip-curl.prev > .flip-strip {
        right: 0;
        left: auto;
      }
      .flip-curl.next .flip-strip .flip-strip {
        left: 100%;
        transform: rotateY(var(--td, 0deg));
      }
      .flip-curl.prev .flip-strip .flip-strip {
        right: 100%;
        transform: rotateY(calc(-1 * var(--td, 0deg)));
      }
      .flip-face {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        right: -1.6px;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        background-repeat: no-repeat;
        background-size: var(--bw, 0px) auto;
        background-position-y: center;
      }
      .flip-face.back {
        transform: rotateY(180deg);
      }
      /* per-strip shading: darkens toward whichever edge is turning away
         from the light, so the curve reads as a bent surface, not a flat
         rotating card */
      .flip-sh {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .flip-curl.next .flip-face.front .flip-sh,
      .flip-curl.prev .flip-face.back .flip-sh {
        background: linear-gradient(
          90deg,
          rgba(20, 16, 10, var(--a1, 0)),
          rgba(20, 16, 10, var(--a2, 0))
        );
      }
      .flip-curl.next .flip-face.back .flip-sh,
      .flip-curl.prev .flip-face.front .flip-sh {
        background: linear-gradient(
          90deg,
          rgba(20, 16, 10, var(--a2, 0)),
          rgba(20, 16, 10, var(--a1, 0))
        );
      }
      /* a faint sheen that only shows while the leaf is actually in the
         air (--shade) and only on strips that are catching the light
         (--lit), so the curl looks glossy at its crest */
      .flip-gl {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: #fffaf0;
        opacity: calc(var(--shade, 0) * var(--lit, 1) * var(--lit, 1) * 0.18);
      }
      /* soften the very last strip so the curl fades into flat paper
         instead of ending on a hard edge */
      .flip-strip.edge .flip-sh {
        -webkit-mask-image: linear-gradient(90deg, #000 0 30%, transparent 100%);
        mask-image: linear-gradient(90deg, #000 0 30%, transparent 100%);
      }

      .book.blur-light .flip-face,
      .book.blur-light img {
        filter: url(#motion-blur-light);
      }
      .book.blur-heavy .flip-face,
      .book.blur-heavy img {
        filter: url(#motion-blur-heavy);
      }
    </style>
  </head>

  <body>
    <h1>Travel Sketch Journal</h1>

    <svg width="0" height="0" aria-hidden="true">
      <filter id="motion-blur-light">
        <feGaussianBlur stdDeviation="5 0" />
      </filter>
      <filter id="motion-blur-heavy">
        <feGaussianBlur stdDeviation="14 0" />
      </filter>
    </svg>

    <div class="stage">
      <button class="arrow" id="prevButton">‹</button>
      <div class="book" id="book">
        <div class="page" id="page"></div>
      </div>
      <button class="arrow" id="nextButton">›</button>
    </div>

    <p class="caption" id="caption"></p>

    <script>
      const pages = [
        {
          src: "https://www.lizsteel.com/wp-content/uploads/2013/01/LizSteel-09-Sat29_01-Bedok-Swimming-Pool.jpg",
          title: "Bedok-Swimming-Pool",
        },
        {
          src: "https://www.lizsteel.com/wp-content/uploads/2013/01/LizSteel-09-Sat29_02-Bedok-Town-Centre.jpg",
          title: "Bedok-Town-Centre",
        },
        {
          src: "https://www.lizsteel.com/wp-content/uploads/2013/01/LizSteel-09-Sat29_03-Bedok-Lunch.jpg",
          title: "Bedok-Lunch",
        },
        {
          src: "https://www.lizsteel.com/wp-content/uploads/2013/01/LizSteel-09-Sat29_04-South-Bedok-Adhoc.jpg",
          title: "South-Bedok-Adhoc",
        },
        {
          src: "https://www.lizsteel.com/wp-content/uploads/2013/01/LizSteel-09-Sat29_05-Marina-Bay-Sands.jpg",
          title: "Marina Bay Sands",
        },
        {
          src: "https://www.lizsteel.com/wp-content/uploads/2013/01/LizSteel-09-Sat29_06-Too-many-tourists.jpg",
          title: "Too Many Tourists",
        },
        {
          src: "https://www.lizsteel.com/wp-content/uploads/2013/01/LizSteel-10-LD30_01-Lords-Day.jpg",
          title: "Lords Day",
        },
      ];

      gsap.registerPlugin(CustomEase);
      CustomEase.create("pageTurn", ".42,.05,.25,1");

      const book = document.getElementById("book");

      /* ---------------------------------------------------- the curl */
      const N = 28; // strips in the chain — more = smoother curve
      const SPAN = 0.5; // the flap covers exactly one half of the book
      const BETA = 0.55; // peak overshoot of the arc, in radians
      const DRAG_SPAN = 0.62; // fraction of the book's width = a full drag swipe
      const EDGE_TAPER = 5; // strips over which shading eases out at the curling tip

      let currentPage = 0;
      let turnState = null; // {dir, from, to, t} — the flip currently in the DOM
      let flipTween = null;
      let introPlaying = false;
      let strips = [];
      let pointer = null;

      const el = (tag, cls) => {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        return e;
      };

      const halfImage = (pageIndex, side) =>
        `<img src="${pages[pageIndex].src}" class="${side}">`;

      /* ---------------------------------------------- book sizing ---
         Each page's src is a full two-page spread. The book's own box is
         resized (via aspect-ratio) to match that spread's real width:height
         so object-fit:contain never has to letterbox it — and so --bw
         (which the curl strips key their slicing off) always corresponds
         to exactly the image that's on screen. */
      function loadDimensions() {
        return Promise.all(
          pages.map(
            (p) =>
              new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                  p.w = img.naturalWidth;
                  p.h = img.naturalHeight;
                  resolve();
                };
                img.onerror = () => {
                  p.w = 16;
                  p.h = 9;
                  resolve();
                };
                img.src = p.src;
              }),
          ),
        );
      }

      function layout() {
        book.style.setProperty("--bw", book.clientWidth + "px");
      }
      addEventListener("resize", layout);

      function applyAspect(pageIndex) {
        const p = pages[pageIndex];
        if (p.w && p.h) {
          book.style.aspectRatio = p.w + " / " + p.h;
        }
        layout();
      }

      // Builds the strip chain for one turn. Each strip's background is
      // offset so that, laid flat, the whole chain reads as one continuous
      // slice of the source spread — the offset math never needs revisiting
      // once the animation starts.
      function buildCurl(dir, from, to) {
        strips = [];
        const c = el("div", "flip-curl " + dir);
        c.style.setProperty("--n", N);
        c.style.setProperty("--span", SPAN);
        let host = c;
        for (let i = 0; i < N; i++) {
          const s = el("div", "flip-strip");
          const gut = "calc(var(--bw) * 0.5)";
          const sw = "calc(var(--bw) * " + SPAN + " / " + N + ")";
          const A = "calc(-1 * (" + gut + " + " + i + " * " + sw + "))";
          const B = "calc(" + (i + 1) + " * " + sw + " - " + gut + ")";
          const f = el("div", "flip-face front");
          const b = el("div", "flip-face back");
          const dress = (e, url, px) => {
            e.style.backgroundImage = "url(" + url + ")";
            e.style.backgroundPositionX = px;
          };
          dress(f, pages[from].src, dir === "next" ? A : B);
          dress(b, pages[to].src, dir === "next" ? B : A);
          f.appendChild(el("div", "flip-sh"));
          f.appendChild(el("div", "flip-gl"));
          b.appendChild(el("div", "flip-sh"));
          b.appendChild(el("div", "flip-gl"));
          s.appendChild(f);
          s.appendChild(b);
          if (i === N - 1) s.classList.add("edge");
          host.appendChild(s);
          host = s;
          strips.push(s);
        }
        return c;
      }

      // Drives the curl for a given progress t (0 → 1). The chain's total
      // rotation (tt) runs past the true half-turn by `beta` and back
      // again, which bows the strips outward mid-flip; each strip's own
      // hinge angle (td) is that same overshoot spread evenly across the
      // chain. Per-strip lighting/shadow follow how face-on each strip is.
      function applyTurn(t) {
        const th = Math.PI * t;
        const beta = BETA * Math.sin(Math.PI * t);
        const D = 180 / Math.PI;
        const tt = th + beta;
        const td = (2 * beta) / N;
        book.style.setProperty("--tt", (tt * D).toFixed(2) + "deg");
        book.style.setProperty("--td", (td * D).toFixed(3) + "deg");
        book.style.setProperty("--shade", Math.sin(Math.PI * t).toFixed(3));
        const last = strips.length - 1;
        for (let i = 0; i < strips.length; i++) {
          // cos² rather than |cos| — same 0..1 range, but no cusp where the
          // strip crosses edge-on, so the shading eases through smoothly
          // instead of kinking.
          const c1 = Math.cos(tt - i * td);
          const c2 = Math.cos(tt - (i + 1) * td);
          const l1 = c1 * c1;
          const l2 = c2 * c2;
          // fade the shadow out over the last few strips so the curl
          // relaxes into flat paper instead of stopping on a hard edge
          const distFromTip = last - i;
          const taper =
            distFromTip < EDGE_TAPER ? distFromTip / EDGE_TAPER : 1;
          const st = strips[i].style;
          st.setProperty("--lit", Math.sqrt(l1).toFixed(3));
          st.setProperty("--a1", ((1 - l1) * 0.55 * taper).toFixed(3));
          st.setProperty("--a2", ((1 - l2) * 0.55 * taper).toFixed(3));
        }
      }

      function showPage(pageIndex) {
        currentPage = pageIndex;
        page.innerHTML = `
        <div class="half left">${halfImage(pageIndex, "left")}</div>
        <div class="half right">${halfImage(pageIndex, "right")}</div>`;
        applyAspect(pageIndex);
      }

      function setCaption(title) {
        caption.textContent = title;
        gsap.fromTo(
          caption,
          { opacity: 0 },
          { opacity: 1, duration: 0.4, overwrite: "auto" },
        );
      }

      /* ------------------------------------------------- turn control
         `turnState` is the single source of truth for whatever flip is
         currently in the DOM. Buttons/keys drive it start-to-finish with
         a tween (see turn()); dragging instead writes turnState.t on
         every pointermove and lets the tween only take over at the end,
         to snap forward (commitTurn) or back (cancelTurn). */
      function paintTurn(dir, from, to) {
        layout();
        const liftSide = dir === "next" ? "right" : "left";
        book.insertAdjacentHTML(
          "beforeend",
          `<div class="turn">
            <div class="half ${liftSide}">${halfImage(to, liftSide)}</div>
          </div>`,
        );
        const turnHost = book.querySelector(".turn");
        turnHost.appendChild(buildCurl(dir, from, to));
        applyTurn(0);
      }

      function startTurn(dir) {
        if (flipTween) {
          flipTween.kill();
          flipTween = null;
        }
        const existing = book.querySelector(".turn");
        if (existing) existing.remove();

        const from = currentPage;
        const to =
          dir === "next"
            ? (from + 1) % pages.length
            : (from - 1 + pages.length) % pages.length;
        turnState = { dir, from, to, t: 0 };
        setCaption(pages[to].title);
        paintTurn(dir, from, to);
      }

      function commitTurn(duration = 0.3) {
        if (!turnState) return;
        const target = turnState;
        flipTween = gsap.to(target, {
          t: 1,
          duration,
          ease: "pageTurn",
          onUpdate() {
            applyTurn(target.t);
          },
          onComplete() {
            showPage(target.to);
            const h = book.querySelector(".turn");
            if (h) h.remove();
            if (turnState === target) turnState = null;
            flipTween = null;
          },
        });
      }

      function cancelTurn(duration = 0.26) {
        if (!turnState) return;
        const target = turnState;
        flipTween = gsap.to(target, {
          t: 0,
          duration,
          ease: "pageTurn",
          onUpdate() {
            applyTurn(target.t);
          },
          onComplete() {
            const h = book.querySelector(".turn");
            if (h) h.remove();
            if (turnState === target) turnState = null;
            flipTween = null;
            setCaption(pages[currentPage].title);
          },
        });
      }

      // Fully automatic flip — used by the arrow buttons, keyboard, and
      // the intro riffle, none of which have a mouse position to follow.
      function turn(direction, duration = 0.85, ease = "pageTurn", onDone) {
        startTurn(direction);
        const target = turnState;
        flipTween = gsap.to(target, {
          t: 1,
          duration,
          ease,
          onUpdate() {
            applyTurn(target.t);
          },
          onComplete() {
            showPage(target.to);
            const h = book.querySelector(".turn");
            if (h) h.remove();
            if (turnState === target) turnState = null;
            flipTween = null;
            if (onDone) onDone();
          },
        });
      }

      function riffle(step = 0) {
        if (!introPlaying || step >= pages.length) {
          introPlaying = false;
          book.classList.remove("blur-light", "blur-heavy");
          return;
        }

        const bell = Math.sin((Math.PI * step) / (pages.length - 1));
        book.classList.toggle("blur-light", bell > 0.25 && bell <= 0.6);
        book.classList.toggle("blur-heavy", bell > 0.6);

        turn("next", 0.2 - 0.15 * bell, "none", () => riffle(step + 1));
      }

      function navigate(direction) {
        introPlaying = false;
        turn(direction);
      }

      nextButton.onclick = () => navigate("next");
      prevButton.onclick = () => navigate("prev");

      /* ---------------------------------------------- mouse/touch drag
         Press anywhere on the book to grab that half; dragging horizontally
         drives the curl in lockstep with the pointer. Release past the
         halfway point (or fast enough, or as a quick tap) to complete the
         turn — otherwise it springs back flat. */
      book.addEventListener("pointerdown", (e) => {
        if (e.button !== 0) return;
        introPlaying = false;
        const rect = book.getBoundingClientRect();
        const dir = (e.clientX - rect.left) / rect.width > 0.5 ? "next" : "prev";
        startTurn(dir);
        pointer = { dir, x0: e.clientX, w: rect.width, moved: 0 };
        book.setPointerCapture(e.pointerId);
      });

      book.addEventListener("pointermove", (e) => {
        if (!pointer || !turnState) return;
        const dx = e.clientX - pointer.x0;
        pointer.moved = Math.max(pointer.moved, Math.abs(dx));
        const raw =
          (pointer.dir === "next" ? -dx : dx) / (pointer.w * DRAG_SPAN);
        const t = Math.max(0, Math.min(1, raw));
        turnState.t = t;
        applyTurn(t);
      });

      function endDrag() {
        if (!pointer) return;
        const p = pointer;
        pointer = null;
        if (!turnState) return;
        if (p.moved < 6) {
          commitTurn(); // a tap — finish the flip
          return;
        }
        if (turnState.t > 0.42) commitTurn();
        else cancelTurn();
      }
      book.addEventListener("pointerup", endDrag);
      book.addEventListener("pointercancel", endDrag);
      book.addEventListener("dragstart", (e) => e.preventDefault());

      addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight") navigate("next");
        if (event.key === "ArrowLeft") navigate("prev");
      });

      (async function boot() {
        layout();
        await loadDimensions();
        showPage(0);
        setCaption(pages[0].title);

        gsap.delayedCall(0.2, () => {
          introPlaying = true;
          riffle();
        });
      })();
    </script>
  </body>
</html>
