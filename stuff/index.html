<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Draggable Stickers</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="draggable-stickers">
        <!-- This div is only used for drag constraints -->
        <div class="constraints-area" id="constraints-area"></div>

        <!-- Container for the stickers -->
        <div class="stickers-container" id="stickers-container"></div>

        <!-- Reset button (hidden until all stickers are free) -->
        <div class="reset-button-wrapper" id="reset-wrapper">
            <button class="reset-button" id="reset-btn" disabled>Reset Stickers</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
