<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marijana Pav — Sticker Pack</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,400;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #f7f3ea;
    --ink: #181818;
    --ink-soft: #4a4540;
    --accent-red: #c73e3e;
    --accent-mustard: #d4a843;
    --accent-sage: #5b7c6b;
    --shadow: rgba(24,24,24,0.14);
    --shadow-strong: rgba(24,24,24,0.22);

    --font-editorial: 'Cormorant Garamond', Georgia, serif;
    --font-ui: 'Inter', ui-sans-serif, system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--font-ui);
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  }

  /* Subtle paper noise + grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 9999;
    pointer-events: none;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 256px;
    mix-blend-mode: multiply;
  }

  /* Header */
  .header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.1rem 2.5rem;
    background: linear-gradient(to bottom, rgba(247,243,234,0.92), rgba(247,243,234,0.4));
    backdrop-filter: blur(8px) saturate(140%);
    -webkit-backdrop-filter: blur(8px) saturate(140%);
  }

  .header a {
    font-family: var(--font-editorial);
    font-style: italic;
    font-weight: 400;
    font-size: 1.35rem;
    text-decoration: none;
    color: var(--ink);
    letter-spacing: -0.02em;
  }

  .header nav a {
    font-family: var(--font-ui);
    font-style: normal;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    margin-left: 2rem;
    color: var(--ink-soft);
    text-decoration: none;
    transition: color 0.2s ease;
  }

  .header nav a:hover { color: var(--ink); }

  /* Main layout */
  main {
    position: relative;
    z-index: 2;
    max-width: 1200px;
    margin: 0 auto;
    padding: 7rem 2rem 10rem;
  }

  /* Editorial intro */
  .hero {
    text-align: center;
    margin-bottom: 4rem;
    max-width: 640px;
    margin-left: auto;
    margin-right: auto;
  }

  .hero h1 {
    font-family: var(--font-editorial);
    font-style: italic;
    font-weight: 300;
    font-size: clamp(3.5rem, 8vw, 6.5rem);
    line-height: 0.92;
    letter-spacing: -0.04em;
    color: var(--ink);
    margin-bottom: 0.4em;
  }

  .hero h1 .line-accent {
    display: block;
    font-family: var(--font-ui);
    font-style: normal;
    font-weight: 500;
    font-size: 0.42em;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin-top: 0.6em;
    color: var(--ink-soft);
  }

  .hero p {
    font-family: var(--font-editorial);
    font-style: italic;
    font-weight: 400;
    font-size: 1.25rem;
    color: var(--ink-soft);
    line-height: 1.45;
  }

  /* Product card (the "poster" behind stickers) */
  .poster-card {
    position: relative;
    width: min(92vw, 640px);
    margin: 0 auto 6rem;
    aspect-ratio: 4 / 5;
    background: linear-gradient(160deg, #e8ddd0 0%, #ddd3c4 60%, #cec3b0 100%);
    border: 1px solid rgba(0,0,0,0.06);
    border-radius: 3px;
    box-shadow:
      0 30px 60px -12px rgba(0,0,0,0.12),
      0 10px 24px -10px rgba(0,0,0,0.08),
      inset 0 0 0 1px rgba(255,255,255,0.35);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 3rem;
    z-index: 1;
  }

  .poster-card::after {
    content: '';
    position: absolute;
    inset: 4%;
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 2px;
    pointer-events: none;
  }

  .poster-card .label-tag {
    display: inline-block;
    font-family: var(--font-ui);
    font-size: 0.65rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    border: 1.5px solid var(--ink);
    padding: 0.35rem 0.9rem;
    margin-bottom: 2rem;
    color: var(--ink);
  }

  .poster-card h2 {
    font-family: var(--font-editorial);
    font-weight: 300;
    font-style: italic;
    font-size: clamp(3.5rem, 12vw, 8rem);
    line-height: 0.85;
    letter-spacing: -0.05em;
    color: var(--ink);
    margin-bottom: 0.2em;
  }

  .poster-card .poster-sub {
    font-family: var(--font-ui);
    font-weight: 300;
    font-size: 1rem;
    color: var(--ink-soft);
    letter-spacing: 0.06em;
  }

  /* Sticker layer (absolute over poster) */
  .sticker-scene {
    position: relative;
    z-index: 10;
    width: min(92vw, 640px);
    height: min(calc(92vw * 1.35), 860px);
    margin: -12rem auto 2rem; /* overlap poster */
    pointer-events: none;
  }

  .constraints {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }

  .sticker {
    position: absolute;
    top: 0; left: 50%;
    width: 130px;
    height: 130px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    will-change: transform;
    z-index: 1;
    transform-origin: center center;
    filter: drop-shadow(0 14px 18px var(--shadow-strong)) drop-shadow(0 4px 6px rgba(0,0,0,0.08));
    pointer-events: auto;
    line-height: 0;
  }

  .sticker::before {
    /* tape / peel effect behind some stickers */
    content: '';
    position: absolute;
    z-index: -1;
    top: -8px; left: 50%; width: 70%; height: 16px;
    background: rgba(255,255,255,0.35);
    border: 1px solid rgba(0,0,0,0.05);
    border-radius: 2px;
    transform: translateX(-50%) rotate(-2deg);
    backdrop-filter: blur(2px);
  }

  .sticker.dragging {
    cursor: grabbing;
    filter: drop-shadow(0 22px 30px rgba(0,0,0,0.28)) drop-shadow(0 6px 10px rgba(0,0,0,0.15));
    z-index: 999 !important;
  }

  .sticker svg {
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
  }

  /* Reset control */
  .reset-wrap {
    position: relative;
    z-index: 20;
    text-align: center;
    margin-top: 3rem;
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
    transition: opacity 0.35s ease, transform 0.35s ease;
  }

  .reset-wrap.show {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .btn-reset {
    font-family: var(--font-ui);
    font-size: 0.75rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink);
    background: transparent;
    border: 1px solid rgba(0,0,0,0.15);
    padding: 0.7rem 1.6rem;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, transform 0.15s;
    text-decoration: none;
  }

  .btn-reset:hover:not(:disabled) {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
    transform: translateY(-2px);
  }

  .btn-reset:disabled {
    opacity: 0.3;
    cursor: default;
  }

  /* Footer / context line */
  .context-line {
    text-align: center;
    margin-top: 3rem;
    font-family: var(--font-editorial);
    font-style: italic;
    font-size: 0.95rem;
    color: var(--ink-soft);
  }

  /* Responsive */
  @media (max-width: 768px) {
    .header { padding: 1rem 1.25rem; }
    .header nav a { margin-left: 1rem; font-size: 0.6rem; }
    .sticker { width: 100px; height: 100px; }
    .sticker-scene { height: min(calc(92vw * 1.3), 720px); }
    .poster-card { padding: 2rem 1.5rem; }
    .hero h1 { font-size: 3rem; }
  }

  @media (min-width: 768px) and (max-width: 1024px) {
    .sticker { width: 110px; height: 110px; }
  }
</style>
</head>
<body>

<header class="header" aria-label="Site header">
  <a href="#" aria-label="Home">Marijana Pav</a>
  <nav aria-label="Primary">
    <a href="#">Work</a>
    <a href="#">Prints</a>
    <a href="#">Shop</a>
  </nav>
</header>

<main>
  <section class="hero" aria-label="Product intro">
    <h1>
      Sticker Pack <span style="font-family: var(--font-editorial); font-style: italic; font-weight: 300;">Vol. 01</span>
      <span class="line-accent">Hand-cut die stickers — arrange, rearrange</span>
    </h1>
    <p>Eleven pieces. One scene. Drag them, stack them, make them yours.</p>
  </section>

  <section aria-label="Product scene with stickers" class="sticker-scene" id="scene">
    <div class="constraints" id="constraints" aria-hidden="true"></div>

    <!-- Central poster card -->
    <article class="poster-card" aria-label="Poster design">
      <span class="label-tag">Limited Edition</span>
      <h2>Stickers</h2>
      <p class="poster-sub">Vol. 01 / 2025</p>
    </article>

    <!-- Sticker layer -->
    <div id="anchor" style="position:absolute; top:0; left:50%; width:0; height:0;"></div>
  </section>

  <aside class="reset-wrap" id="resetWrap" aria-label="Reset control">
    <button class="btn-reset" id="btnReset" disabled>Reset Arrangement</button>
  </aside>

  <p class="context-line">May be arranged freely on any surface.</p>
</main>

<script>
  /* -------------------------------------------------
     Sticker SVGs — refined editorial die-cuts
     ------------------------------------------------- */
  const stickers = [
    // 0. Stamp 1 — Approved (red seal)
    `<svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
      <circle cx="70" cy="70" r="58" fill="#c73e3e" stroke="#fff" stroke-width="5"/>
      <circle cx="70" cy="70" r="44" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
      <text x="70" y="60" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="28" fill="#fff" letter-spacing="2">100%</text>
      <text x="70" y="82" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="13" fill="#fff" letter-spacing="3.5" opacity="0.95">APPROVED</text>
      <text x="70" y="100" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="7.5" fill="#fff" letter-spacing="2" opacity="0.7">★ OFFICIAL ★</text>
    </svg>`,

    // 1. Zet — black square + yellow Z
    `<svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
      <rect x="12" y="12" width="116" height="116" rx="14" fill="#1a1816" stroke="#fff" stroke-width="4"/>
      <text x="70" y="92" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-weight="700" font-size="68" fill="#e6bd3a" letter-spacing="-2">Z</text>
      <circle cx="108" cy="36" r="8" fill="#c73e3e" stroke="#fff" stroke-width="2"/>
    </svg>`,

    // 2. Cmd Key — keycap
    `<svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
      <rect x="14" y="22" width="112" height="100" rx="16" fill="#d5d1c9" stroke="#fff" stroke-width="5"/>
      <rect x="14" y="16" width="112" height="100" rx="16" fill="#e3dfd5" stroke="#fff" stroke-width="4"/>
      <g stroke="#1a1816" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M42 42 h56 v56 h-56 z"/>
        <path d="M42 42 v-10 q0-8 8-8 h20 q8 0 8 8 v10"/>
        <path d="M98 42 v-10 q0-8 8-8 h8 q8 0 8 8 v10"/>
        <path d="M42 98 v10 q0 8-8 8 h-20 q-8 0-8-8 v-10"/>
        <path d="M98 98 v10 q0 8 8 8 h8 q8 0 8-8 v-10"/>
      </g>
    </svg>`,

    // 3. Option Key
    `<svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
      <rect x="14" y="22" width="112" height="100" rx="16" fill="#ccc6bb" stroke="#fff" stroke-width="5"/>
      <rect x="14" y="16" width="112" height="100" rx="16" fill="#ddd7ce" stroke="#fff" stroke-width="4"/>
      <path d="M28 104 L78 44 L108 44 M28 104 L54 104" stroke="#1a1816" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`,

    // 4. Battery — filled green with check
    `<svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
      <rect x="16" y="42" width="96" height="64" rx="14" fill="#2d3e2d" stroke="#fff" stroke-width="5"/>
      <rect x="112" y="58" width="12" height="32" rx="3" fill="#2d3e2d" stroke="#fff" stroke-width="4"/>
      <rect x="26" y="50" width="76" height="48" rx="8" fill="#5b7c6b" stroke="#fff" stroke-width="2"/>
      <path d="M42 86 L58 98 L86 70" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`,

    // 5. Copyright — purple ring
    `<svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
      <circle cx="70" cy="70" r="58" fill="#6b4c7a" stroke="#fff" stroke-width="5"/>
      <circle cx="70" cy="70" r="42" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="3"/>
      <path d="M84 58 Q74 52 60 52 Q48 52 48 70 Q48 88 60 88 Q74 88 84 78" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/>
    </svg>`,

    // 6. Buka — speech bubble
    `<svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
      <path d="M22 36 Q22 22 34 22 L106 22 Q118 22 118 36 L118 76 Q118 90 106 90 L70 90 L50 108 L54 90 L38 90 Q26 90 26 76 Z" fill="#d4a843" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
      <text x="70" y="66" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="26" fill="#fff" letter-spacing="1">BUKA!</text>
    </svg>`,

    // 7. v60 — brown vertical tag
    `<svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
      <path d="M24 36 L116 36 L88 108 L52 108 Z" fill="#5b4a3a" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
      <ellipse cx="70" cy="40" rx="36" ry="7" fill="#3d2f22" stroke="#fff" stroke-width="2"/>
      <g stroke="#fff" stroke-width="1.5" opacity="0.3">
        <line x1="46" y1="40" x2="58" y2="102"/>
        <line x1="70" y1="40" x2="70" y2="102"/>
        <line x1="94" y1="40" x2="82" y2="102"/>
      </g>
      <circle cx="70" cy="114" r="4.5" fill="#3d2f22"/>
    </svg>`,

    // 8. FigmaExport — dark with arrow
    `<svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
      <rect x="16" y="16" width="108" height="108" rx="16" fill="#181818" stroke="#fff" stroke-width="5"/>
      <g stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <line x1="70" y1="34" x2="70" y2="82"/>
        <polyline points="50,52 70,34 90,52"/>
        <line x1="36" y1="102" x2="104" y2="102"/>
      </g>
    </svg>`,

    // 9. Stamp 2 — Draft blue
    `<svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
      <g transform="rotate(-8 70 70)">
        <rect x="14" y="48" width="112" height="36" rx="4" fill="#3a6fa5" stroke="#fff" stroke-width="5"/>
        <text x="70" y="74" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="22" fill="#fff" letter-spacing="6">DRAFT</text>
      </g>
    </svg>`,

    // 10. LoremIpsum — paper block
    `<svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
      <rect x="16" y="22" width="108" height="98" rx="6" fill="#f0ebe6" stroke="#1a1816" stroke-width="4"/>
      <line x1="26" y1="40" x2="114" y2="40" stroke="#1a1816" stroke-width="3" stroke-linecap="round"/>
      <line x1="26" y1="58" x2="104" y2="58" stroke="#3a6fa5" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="26" y1="72" x2="112" y2="72" stroke="#3a6fa5" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="26" y1="86" x2="92" y2="86" stroke="#3a6fa5" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="26" y1="100" x2="98" y2="100" stroke="#3a6fa5" stroke-width="2.5" stroke-linecap="round"/>
    </svg>`
  ];

  /* -------------------------------------------------
     Utilities
     ------------------------------------------------- */
  const len = stickers.length;
  const isSm = window.matchMedia('(max-width: 768px)').matches;
  const isMd = window.matchMedia('(min-width: 768px) and (max-width: 1024px)').matches;

  function lerp(a, b, t) { return a + (b - a) * t; }
  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function clamp(min, max, v) { return Math.min(Math.max(v, min), max); }

  /* -------------------------------------------------
     Init state
     ------------------------------------------------- */
  const anchor = document.getElementById('anchor');
  const scene = document.getElementById('scene');
  const constraints = document.getElementById('constraints');
  const resetWrap = document.getElementById('resetWrap');
  const resetBtn = document.getElementById('btnReset');

  const states = []; // per sticker
  const elRefs = [];

  let zCounter = 1;

  function computeInitial() {
    const positions = [];
    for (let i = 0; i < len; i++) {
      const t = i / (len - 1);
      const isInFirst = i < Math.floor(len / 2);
      const isOdd = (i & 1);

      let ix, iy;
      if (isSm) {
        ix = Math.sin(lerp(-1, 1, t)) * 150 * -1;
        iy = (isOdd ? -1 : 1) * randInt(30, 60);
      } else {
        ix = Math.abs(Math.sin(lerp(-1, 1, t))) * (isMd ? 150 : randInt(340, 520)) * (isInFirst ? -1 : 1);
        iy = (isOdd ? -1 : 1) * randInt(20, 70);
      }

      const rot = Math.random() * (Math.sign(Math.sin(Math.random() * 100)) * 32);
      const sc = isSm ? 0.7 : isMd ? 0.8 : 1.15;

      positions.push({ x: ix, y: iy, r: rot, s: sc });
    }
    return positions;
  }

  const initials = computeInitial();

  /* -------------------------------------------------
     Render stickers
     ------------------------------------------------- */
  stickers.forEach((svgStr, i) => {
    const init = initials[i];

    const el = document.createElement('div');
    el.className = 'sticker';
    el.innerHTML = svgStr;
    el.setAttribute('aria-label', `Sticker ${i + 1}`);
    el.style.zIndex = 1;

    // Start centered (will animate out)
    el.style.transform = `translate(0px, 0px) rotate(0deg) scale(0.7)`;
    el.style.opacity = '0';

    states[i] = {
      cx: 0, cy: 0, cr: 0, cs: 0.7,
      vx: 0, vy: 0, vr: 0, vs: 0,
      targetX: init.x, targetY: init.y, targetR: init.r, targetS: init.s,
      dragging: false, z: 1, anim: null
    };

    anchor.appendChild(el);
    elRefs[i] = el;

    // Staggered entrance
    setTimeout(() => {
      el.style.transition = 'opacity 0.5s ease';
      el.style.opacity = '1';
      requestAnimationFrame(() => { el.style.transition = ''; });
      springTo(i, init.x, init.y, init.r, init.s, { stiffness: 70, damping: 13, bounce: 0.15 + Math.random() * 0.2 });
    }, i * 80 + 100);

    bindDrag(el, i);
  });

  /* -------------------------------------------------
     Spring physics helper
     ------------------------------------------------- */
  function springTo(idx, tx, ty, tr, ts, opts = {}) {
    const s = states[idx];
    if (s.anim && s.anim.running) s.anim.running = false; // stop previous
    s.anim = { running: true };

    const stiffness = opts.stiffness || 80;
    const damping = opts.damping || 14;

    // Set target
    s.targetX = tx; s.targetY = ty; s.targetR = tr; s.targetS = ts;

    // Slightly offset current velocity for continuity (if continuing from drag)
    // But for reset/entrance we start near zero

    const startTime = performance.now();

    (function tick(now) {
      if (!s.anim || !s.anim.running) return;
      const dt = Math.min((now - (tick.prev || now)) / 1000, 0.06);
      tick.prev = now;

      // Spring integration (semi-implicit Euler)
      const k = stiffness * 0.03; // scaled for 60fps feel
      const d = damping * 0.03;

      // Pos
      const fx = (s.targetX - s.cx) * k - s.vx * d;
      s.vx += fx;
      s.cx += s.vx;

      const fy = (s.targetY - s.cy) * k - s.vy * d;
      s.vy += fy;
      s.cy += s.vy;

      // Rotate
      const fr = (s.targetR - s.cr) * k - s.vr * d;
      s.vr += fr;
      s.cr += s.vr;

      // Scale
      const fs = (s.targetS - s.cs) * k - s.vs * d;
      s.vs += fs;
      s.cs += s.vs;

      apply(idx);

      // Stop when close
      const settled = Math.abs(s.vx) < 0.05 && Math.abs(s.vy) < 0.05 && Math.abs(s.vr) < 0.03 && Math.abs(s.vs) < 0.002
        && Math.abs(s.cx - s.targetX) < 0.8 && Math.abs(s.cy - s.targetY) < 0.8
        && Math.abs(s.cr - s.targetR) < 0.5 && Math.abs(s.cs - s.targetS) < 0.005;

      if (settled) {
        s.cx = s.targetX; s.cy = s.targetY; s.cr = s.targetR; s.cs = s.targetS;
        s.vx = s.vy = s.vr = s.vs = 0;
        apply(idx);
        s.anim = null;

        // If this completed after drag ended and no others dragging, show reset
        shownCheck();
        return;
      }

      requestAnimationFrame(tick);
    })();
  }

  function apply(idx) {
    const s = states[idx];
    const el = elRefs[idx];
    el.style.transform = `translate(${s.cx.toFixed(2)}px, ${s.cy.toFixed(2)}px) rotate(${s.cr.toFixed(2)}deg) scale(${s.cs.toFixed(3)})`;
  }

  /* -------------------------------------------------
     Drag logic (pointer events)
     ------------------------------------------------- */
  function bindDrag(el, idx) {
    let startX, startY, startCx, startCy, pointerId = null, isDown = false;

    el.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      isDown = true;
      pointerId = e.pointerId;
      try { el.setPointerCapture(e.pointerId); } catch {}

      startX = e.clientX;
      startY = e.clientY;

      const s = states[idx];
      startCx = s.cx;
      startCy = s.cy;

      // Stop any return animation
      if (s.anim && s.anim.running) s.anim.running = false;

      // Bring to front
      zCounter++;
      s.z = zCounter;
      el.style.zIndex = zCounter;

      s.dragging = true;

      // whileDrag: scale up, rotate neutral, shadow stronger
      const targetScale = s.targetS * 1.22;
      s.cs = targetScale; // instant for responsiveness
      s.cr = 0;
      apply(idx);

      el.classList.add('dragging');
      hideReset();
    });

    el.addEventListener('pointermove', (e) => {
      if (!isDown || e.pointerId !== pointerId) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;

      const s = states[idx];
      s.cx = startCx + dx;
      s.cy = startCy + dy;

      // Subtle rotation based on horizontal drag velocity
      const vx = dx * 0.15;
      s.cr = vx;
      apply(idx);
    });

    const endDrag = (e) => {
      if (!isDown) return;
      if (e && e.pointerId !== undefined && e.pointerId !== pointerId) return;
      isDown = false;
      pointerId = null;
      if (e) { try { el.releasePointerCapture(e.pointerId); } catch {} }

      const s = states[idx];
      s.dragging = false;
      el.classList.remove('dragging');

      // Animate scale back to initial, rotate back, and slide gently to original
      // We use the spring with reduced stiffness for a "settle"
      springTo(idx, s.targetX, s.targetY, s.targetR, s.targetS, { stiffness: 65, damping: 16 });
    };

    el.addEventListener('pointerup', endDrag);
    el.addEventListener('pointercancel', endDrag);
  }

  /* -------------------------------------------------
     Reset UI
     ------------------------------------------------- */
  function hideReset() {
    resetWrap.classList.remove('show');
    resetBtn.disabled = true;
  }

  function shownCheck() {
    const any = states.some(s => s.dragging);
    if (!any) {
      resetWrap.classList.add('show');
      resetBtn.disabled = false;
    }
  }

  resetBtn.addEventListener('click', () => {
    // Animate all back to initial variants
    initials.forEach((init, i) => {
      // Small randomness for "rearrange" feel
      const offX = randInt(-20, 20);
      const offY = randInt(-20, 20);
      springTo(i, init.x + offX, init.y + offY, init.r, init.s, { stiffness: 70, damping: 14 });
    });
    hideReset();
  });

  // Ensure scene is positioned correctly relative to poster
  function syncScene() {
    // No-op for pure CSS overlay; scene uses negative margin
  }

  // Prevent dragstart on images/text inside stickers
  document.querySelectorAll('.sticker').forEach(el => {
    el.querySelectorAll('svg, text, circle, rect').forEach(child => {
      child.addEventListener('dragstart', e => e.preventDefault());
    });
  });
</script>

</body>
</html>
