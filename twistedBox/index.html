<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twisted Box - Three.js</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // --- SCENE SETUP ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(1.5, 1.5, 1.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // --- LIGHTS ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 4);
    directionalLight.position.set(-1, 2, 2);
    scene.add(directionalLight);

    // --- CONTROLS ---
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.autoRotate = true;
    controls.enableDamping = true;

    // --- TWISTED BOX (The Logic from your React Code) ---
    function createTwistedBox() {
        // Create box geometry with 10 segments (necessary for smooth twisting)
        const geometry = new THREE.BoxGeometry(1, 1, 1, 10, 10, 10);
        const material = new THREE.MeshLambertMaterial({ 
            color: 0xff69b4,     // hotpink
            emissive: 0xff69b4   // hotpink
        });
        const mesh = new THREE.Mesh(geometry, material);

        const positionAttribute = geometry.attributes.position;
        const vertex = new THREE.Vector3();
        const quaternion = new THREE.Quaternion();
        const upVector = new THREE.Vector3(0, 1, 0);

        // Apply the twist deformation to each vertex
        for (let i = 0; i < positionAttribute.count; i++) {
            vertex.fromBufferAttribute(positionAttribute, i);

            // The twist logic: rotate around Y based on Y position
            quaternion.setFromAxisAngle(
                upVector, 
                (Math.PI / 180) * (vertex.y + 10) * 100
            );
            
            vertex.applyQuaternion(quaternion);
            
            // Update the attribute
            positionAttribute.setXYZ(i, vertex.x, vertex.y, vertex.z);
        }

        positionAttribute.needsUpdate = true;
        // Recompute normals so lighting looks correct after deformation
        geometry.computeVertexNormals(); 

        return mesh;
    }

    const twistedBox = createTwistedBox();
    scene.add(twistedBox);

    // --- ANIMATION LOOP ---
    function animate() {
        requestAnimationFrame(animate);
        
        // Update controls (required for autoRotate and damping)
        controls.update();
        
        renderer.render(scene, camera);
    }

    // Handle Window Resize
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
