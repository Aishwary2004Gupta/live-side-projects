<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Painted rings</title>
<style>
  html,body{margin:0;height:100%;background:#F2E9D9;overflow:hidden;font-family:Georgia,"Times New Roman",serif}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block}

  /* ---------- tweak panel ---------- */
  #panel{position:fixed;top:16px;right:16px;width:260px;max-height:calc(100% - 32px);overflow-y:auto;
    background:rgba(242,233,217,.92);border:2px solid #3A0724;box-shadow:6px 6px 0 #FD7555;
    color:#3A0724;font-size:12px;backdrop-filter:blur(4px);transition:transform .3s}
  #panel.closed{transform:translateX(calc(100% + 24px))}
  #panel::-webkit-scrollbar{width:6px}#panel::-webkit-scrollbar-thumb{background:#EB9786}
  #panel h1{margin:0;padding:10px 12px;font-size:14px;letter-spacing:.15em;text-transform:uppercase;
    background:#3A0724;color:#F9C163;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
  #panel h1 span{font-size:11px;opacity:.7}
  .folder{border-top:1px dashed #EB9786}
  .folder>.title{padding:7px 12px;font-weight:bold;letter-spacing:.08em;text-transform:uppercase;font-size:11px;
    background:#EB978633;cursor:pointer;user-select:none}
  .folder>.title::before{content:"▾ ";font-size:10px}
  .folder.collapsed>.title::before{content:"▸ "}
  .folder.collapsed>.body{display:none}
  .row{display:grid;grid-template-columns:86px 1fr 40px;align-items:center;gap:8px;padding:5px 12px}
  .row label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:#EB9786;outline:none}
  .row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;
    background:#E02211;border:2px solid #3A0724;cursor:pointer}
  .row input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:#E02211;border:2px solid #3A0724;cursor:pointer}
  .row .val{text-align:right;font-variant-numeric:tabular-nums;opacity:.8}
  .row input[type=color]{width:100%;height:20px;border:1px solid #3A0724;background:none;padding:0;cursor:pointer}
  .row input[type=checkbox]{justify-self:start;accent-color:#E02211}
  .row.btn{grid-template-columns:1fr}
  button.b{width:100%;padding:6px;border:2px solid #3A0724;background:#F9C163;color:#3A0724;font:inherit;
    font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
  button.b:hover{background:#FD7555;color:#fff}
  button.b:active{transform:translate(1px,1px)}
  #toggle{position:fixed;top:16px;right:16px;padding:6px 10px;border:2px solid #3A0724;background:#F9C163;
    color:#3A0724;font:inherit;font-size:11px;letter-spacing:.1em;cursor:pointer;display:none;box-shadow:4px 4px 0 #FD7555}
  #toggle.show{display:block}
</style>
</head>
<body>
<div id="panel"><h1 onclick="togglePanel()">Tweaks <span>hide ✕</span></h1></div>
<button id="toggle" onclick="togglePanel()">☰ tweaks</button>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* ---------------- params ---------------- */
const P = {
  // rings
  sides: 72, radius: 2, tilt: .25, spread: .05, lineWidth: .2, opacity: .95, taper: 1, scaleJitter: .1,
  // motion
  loopDuration: 4, rotationX: Math.PI / 8, paused: false, autoRotate: false,
  // paint
  kuwahara: 5, wobble: 5, edge: .85, edgeLow: .08, edgeHigh: .4, edgeOffset: 2, minLevel: -.5, grain: .1, vignette: .25,
  // colors
  c0:"#FD7555", c1:"#FE4F2E", c2:"#040720", c3:"#EB9786", c4:"#E02211", c5:"#3A0724", c6:"#F9C163",
  background:"#F2E9D9",
};

/* ---------------- helpers ---------------- */
const Maf = {
  TAU: Math.PI * 2, PI: Math.PI,
  randomInRange: (a, b) => a + Math.random() * (b - a),
  parabola: (x, k) => Math.pow(4 * x * (1 - x), k),
};
let paletteColors = [];
function rebuildPalette() { paletteColors = [P.c0,P.c1,P.c2,P.c3,P.c4,P.c5,P.c6].map(c => new THREE.Color(c)); }
function gradientAt(t) {
  const n = paletteColors.length - 1, f = Math.min(Math.max(t, 0), .99999) * n, i = Math.floor(f);
  return paletteColors[i].clone().lerp(paletteColors[i + 1], f - i);
}
rebuildPalette();

/* ---------------- renderer / camera / scene ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(1);
renderer.setClearColor(P.background, 1);
document.body.appendChild(renderer.domElement);
const canvas = renderer.domElement;
const camera = new THREE.PerspectiveCamera(35, 1, .1, 100);
camera.position.set(7.8, 3.6, 7.3);
const scene = new THREE.Scene();
const group = new THREE.Group();
camera.lookAt(group.position);
const controls = new THREE.OrbitControls(camera, canvas);

/* ---------------- procedural stroke texture ---------------- */
function makeStrokeTexture() {
  const w = 512, h = 64, c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'), g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(.15,'rgba(255,255,255,.75)'); g.addColorStop(.5,'rgba(255,255,255,.95)');
  g.addColorStop(.85,'rgba(255,255,255,.75)'); g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  ctx.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 45; i++) {
    const y = Math.random() * h; ctx.lineWidth = .5 + Math.random() * 2.5;
    ctx.strokeStyle = `rgba(0,0,0,${.2 + Math.random() * .6})`; ctx.beginPath();
    const x0 = Math.random() * w * .5, x1 = x0 + Math.random() * w * .9; ctx.moveTo(x0, y);
    for (let x = x0; x <= x1; x += 12) ctx.lineTo(x, y + Math.sin(x * .05 + i) * 1.5); ctx.stroke();
  }
  for (let i = 0; i < 80; i++) {
    const x = Math.random() * w, y = Math.random() < .5 ? Math.random() * 10 : h - Math.random() * 10;
    ctx.fillStyle = 'rgba(0,0,0,.8)'; ctx.beginPath(); ctx.arc(x, y, 1 + Math.random() * 4, 0, Maf.TAU); ctx.fill();
  }
  const tex = new THREE.CanvasTexture(c); tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping; return tex;
}
let strokeTexture = makeStrokeTexture();

/* ---------------- ribbon geometry + shaders ---------------- */
function makeRibbonGeometry(points, widthFn) {
  const N = points.length, pos = [], prev = [], next = [], side = [], width = [], uv = [], idx = [];
  for (let i = 0; i < N; i++) {
    const p = points[i], pp = points[Math.max(i - 1, 0)], pn = points[Math.min(i + 1, N - 1)], t = i / (N - 1), wd = widthFn(t);
    for (let s = 0; s < 2; s++) { pos.push(p.x,p.y,p.z); prev.push(pp.x,pp.y,pp.z); next.push(pn.x,pn.y,pn.z); side.push(s ? -1 : 1); width.push(wd); uv.push(t, s); }
    if (i < N - 1) { const n = i * 2; idx.push(n, n+1, n+2, n+2, n+1, n+3); }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('previous', new THREE.Float32BufferAttribute(prev, 3));
  geo.setAttribute('next', new THREE.Float32BufferAttribute(next, 3));
  geo.setAttribute('side', new THREE.Float32BufferAttribute(side, 1));
  geo.setAttribute('width', new THREE.Float32BufferAttribute(width, 1));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx); return geo;
}
const lineVS = `
attribute vec3 previous; attribute vec3 next; attribute float side; attribute float width;
uniform float lineWidth; uniform float aspect; varying vec2 vUv;
void main(){
  vUv = uv; mat4 m = projectionMatrix * modelViewMatrix;
  vec4 fp = m * vec4(position,1.), pp = m * vec4(previous,1.), np = m * vec4(next,1.);
  vec2 av = vec2(aspect,1.), c = fp.xy/fp.w*av, p = pp.xy/pp.w*av, n = np.xy/np.w*av, dir;
  if (distance(n,c)<1e-6) dir = normalize(c-p); else if (distance(p,c)<1e-6) dir = normalize(n-c);
  else dir = normalize(normalize(c-p)+normalize(n-c));
  vec2 nrm = vec2(-dir.y,dir.x); nrm.x /= aspect; nrm *= .5*lineWidth*width;
  fp.xy += nrm*side*fp.w; gl_Position = fp;
}`;
const lineFS = `
uniform sampler2D map; uniform vec3 color; uniform float opacity; varying vec2 vUv;
void main(){ float a = texture2D(map,vUv).a*opacity; if(a<.08) discard; gl_FragColor = vec4(color,a); }`;

/* ---------------- build rings ---------------- */
let circles = [], ringGeometry;
function buildRings() {
  while (group.children.length) group.remove(group.children[0]);
  circles.forEach(c => c.mesh.material.dispose());
  if (ringGeometry) ringGeometry.dispose();
  const pts = [];
  for (let j = 0; j <= Math.PI + 1e-6; j += Math.PI / 72) pts.push(new THREE.Vector3(P.radius*Math.cos(j), P.radius*Math.sin(j), 0));
  pts.reverse();
  ringGeometry = makeRibbonGeometry(pts, p => Math.pow(p, P.taper));
  circles = [];
  for (let i = 0; i < P.sides; i++) {
    const material = new THREE.ShaderMaterial({
      uniforms: { map:{value:strokeTexture}, color:{value:new THREE.Color()}, opacity:{value:P.opacity}, lineWidth:{value:P.lineWidth}, aspect:{value:1} },
      vertexShader: lineVS, fragmentShader: lineFS, transparent: true, depthTest: false, depthWrite: false, side: THREE.DoubleSide,
    });
    const mesh = new THREE.Mesh(ringGeometry, material); mesh.frustumCulled = false;
    const pivot = new THREE.Group();
    pivot.position.set(0, P.spread * (-.5 * P.sides + i), 0);
    pivot.rotation.x = Maf.randomInRange(-P.tilt, P.tilt); pivot.rotation.z = Maf.randomInRange(-P.tilt, P.tilt);
    mesh.rotation.x = Math.PI / 2;
    mesh.scale.setScalar(Maf.parabola(i / P.sides, .5) + Maf.randomInRange(-P.scaleJitter, P.scaleJitter));
    pivot.add(mesh); group.add(pivot);
    circles.push({ mesh, pivot, a: Maf.randomInRange(0, Maf.TAU), c: Maf.randomInRange(0, 1), speed: 1 + Math.round(Maf.randomInRange(0, 2)) });
  }
  recolor();
}
function recolor() { rebuildPalette(); circles.forEach(c => c.mesh.material.uniforms.color.value.copy(gradientAt(c.c))); }
function reshuffle() { circles.forEach(c => { c.c = Math.random(); c.a = Maf.randomInRange(0, Maf.TAU); c.speed = 1 + Math.round(Maf.randomInRange(0, 2)); }); recolor(); }
scene.add(group);
buildRings();

/* ---------------- post-processing ---------------- */
const quadVS = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy,0.,1.); }`;
const kuwaharaFS = `
uniform sampler2D tDiffuse; uniform vec2 resolution; uniform int radius; varying vec2 vUv;
#define MAXR 8
void main(){
  vec2 texel = 1./resolution; float n = float((radius+1)*(radius+1));
  vec3 m[4]; vec3 s[4]; for(int k=0;k<4;k++){ m[k]=vec3(0.); s[k]=vec3(0.); }
  for(int j=-MAXR;j<=MAXR;j++) for(int i=-MAXR;i<=MAXR;i++){
    if(abs(i)>radius||abs(j)>radius) continue;
    vec3 c = texture2D(tDiffuse, vUv+vec2(float(i),float(j))*texel).rgb; vec3 cc = c*c;
    if(i<=0&&j<=0){m[0]+=c;s[0]+=cc;} if(i>=0&&j<=0){m[1]+=c;s[1]+=cc;}
    if(i>=0&&j>=0){m[2]+=c;s[2]+=cc;} if(i<=0&&j>=0){m[3]+=c;s[3]+=cc;}
  }
  float minS = 1e5; vec3 res = vec3(0.);
  for(int k=0;k<4;k++){ vec3 mm=m[k]/n; vec3 ss=abs(s[k]/n-mm*mm); float v=ss.r+ss.g+ss.b; if(v<minS){minS=v;res=mm;} }
  gl_FragColor = vec4(res,1.);
}`;
const paintFS = `
uniform sampler2D tDiffuse; uniform vec2 resolution; uniform float minLevel, seed, wobble, edge, edgeLow, edgeHigh, edgeOffset, grainAmt, vignette;
varying vec2 vUv;
float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x), mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x), f.y); }
float lum(vec3 c){ return dot(c, vec3(.299,.587,.114)); }
void main(){
  vec2 texel = 1./resolution, p = vUv*resolution;
  vec2 wob = vec2(noise(p*.025+seed), noise(p*.025+vec2(41.7,17.3)+seed)) - .5;
  vec2 uv = vUv + wob*texel*wobble;
  vec3 col = texture2D(tDiffuse, uv).rgb;
  vec2 euv = uv + vec2(edgeOffset, -edgeOffset*.75)*texel;
  float tl=lum(texture2D(tDiffuse,euv+vec2(-1.,1.)*texel).rgb), t=lum(texture2D(tDiffuse,euv+vec2(0.,1.)*texel).rgb), tr=lum(texture2D(tDiffuse,euv+vec2(1.,1.)*texel).rgb);
  float l=lum(texture2D(tDiffuse,euv+vec2(-1.,0.)*texel).rgb), r=lum(texture2D(tDiffuse,euv+vec2(1.,0.)*texel).rgb);
  float bl=lum(texture2D(tDiffuse,euv+vec2(-1.,-1.)*texel).rgb), b=lum(texture2D(tDiffuse,euv+vec2(0.,-1.)*texel).rgb), br=lum(texture2D(tDiffuse,euv+vec2(1.,-1.)*texel).rgb);
  float gx=-tl-2.*l-bl+tr+2.*r+br, gy=-bl-2.*b-br+tl+2.*t+tr;
  float e = smoothstep(edgeLow, edgeHigh, length(vec2(gx,gy)));
  vec3 ecol = texture2D(tDiffuse, euv).rgb, edgeColor = ecol*ecol*.8;
  col = (col-minLevel)/(1.-minLevel); edgeColor = (edgeColor-minLevel*.4)/(1.-minLevel*.4);
  col = mix(col, edgeColor, e*edge);
  float grain = noise(p*.9)*.6+noise(p*.35)*.4, fibers = noise(vec2(p.x*.08,p.y*1.3));
  col *= 1.-grainAmt*1.2 + grainAmt*grain + grainAmt*.4*fibers;
  vec2 q = vUv-.5; col *= 1.-dot(q,q)*vignette;
  gl_FragColor = vec4(col,1.);
}`;
const rtOpts = { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat };
const rt1 = new THREE.WebGLRenderTarget(1,1,rtOpts), rt2 = new THREE.WebGLRenderTarget(1,1,rtOpts);
const orthoCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1), quadGeo = new THREE.PlaneBufferGeometry(2,2);
const kuwaharaMat = new THREE.ShaderMaterial({ uniforms:{ tDiffuse:{value:rt1.texture}, resolution:{value:new THREE.Vector2(1,1)}, radius:{value:P.kuwahara} },
  vertexShader: quadVS, fragmentShader: kuwaharaFS, depthTest:false, depthWrite:false });
const paintMat = new THREE.ShaderMaterial({ uniforms:{ tDiffuse:{value:rt2.texture}, resolution:{value:new THREE.Vector2(1,1)}, minLevel:{value:P.minLevel},
  seed:{value:Math.random()*100}, wobble:{value:P.wobble}, edge:{value:P.edge}, edgeLow:{value:P.edgeLow}, edgeHigh:{value:P.edgeHigh},
  edgeOffset:{value:P.edgeOffset}, grainAmt:{value:P.grain}, vignette:{value:P.vignette} },
  vertexShader: quadVS, fragmentShader: paintFS, depthTest:false, depthWrite:false });
const kuwaharaScene = new THREE.Scene(); kuwaharaScene.add(new THREE.Mesh(quadGeo, kuwaharaMat));
const paintScene = new THREE.Scene(); paintScene.add(new THREE.Mesh(quadGeo, paintMat));
function paintedRender() {
  renderer.setRenderTarget(rt1); renderer.render(scene, camera);
  renderer.setRenderTarget(rt2); renderer.render(kuwaharaScene, orthoCam);
  renderer.setRenderTarget(null); renderer.render(paintScene, orthoCam);
}

/* ---------------- resize ---------------- */
function resize() {
  const s = Math.min(window.innerWidth, window.innerHeight);
  renderer.setSize(s, s); rt1.setSize(s, s); rt2.setSize(s, s);
  kuwaharaMat.uniforms.resolution.value.set(s, s); paintMat.uniforms.resolution.value.set(s, s);
  camera.aspect = 1; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

/* ---------------- tweak panel ---------------- */
const panel = document.getElementById('panel');
function togglePanel(){ panel.classList.toggle('closed'); document.getElementById('toggle').classList.toggle('show'); }
function folder(name, collapsed) {
  const f = document.createElement('div'); f.className = 'folder' + (collapsed ? ' collapsed' : '');
  f.innerHTML = `<div class="title">${name}</div><div class="body"></div>`;
  f.querySelector('.title').onclick = () => f.classList.toggle('collapsed');
  panel.appendChild(f); return f.querySelector('.body');
}
function slider(body, key, min, max, step, onChange, label) {
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<label>${label || key}</label><input type="range" min="${min}" max="${max}" step="${step}" value="${P[key]}"><span class="val"></span>`;
  const inp = row.querySelector('input'), val = row.querySelector('.val');
  const show = () => val.textContent = (+P[key]).toFixed(step < 1 ? 2 : 0);
  inp.oninput = () => { P[key] = +inp.value; show(); onChange && onChange(P[key]); }; show(); body.appendChild(row);
}
function color(body, key, onChange, label) {
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<label>${label || key}</label><input type="color" value="${P[key]}"><span class="val"></span>`;
  row.querySelector('input').oninput = e => { P[key] = e.target.value; onChange(P[key]); }; body.appendChild(row);
}
function check(body, key, onChange, label) {
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<label>${label || key}</label><input type="checkbox" ${P[key] ? 'checked' : ''}><span></span>`;
  row.querySelector('input').onchange = e => { P[key] = e.target.checked; onChange && onChange(P[key]); }; body.appendChild(row);
}
function button(body, text, fn) {
  const row = document.createElement('div'); row.className = 'row btn';
  const b = document.createElement('button'); b.className = 'b'; b.textContent = text; b.onclick = fn; row.appendChild(b); body.appendChild(row);
}
const setU = (mat, k) => v => mat.uniforms[k].value = v;
const setLine = k => v => circles.forEach(c => c.mesh.material.uniforms[k].value = v);

let b = folder('Rings');
slider(b, 'sides', 8, 160, 1, buildRings, 'count');
slider(b, 'radius', .5, 4, .01, buildRings);
slider(b, 'spread', 0, .15, .001, buildRings);
slider(b, 'tilt', 0, 1, .01, buildRings);
slider(b, 'scaleJitter', 0, .5, .01, buildRings, 'jitter');
slider(b, 'taper', 0, 3, .01, buildRings);
slider(b, 'lineWidth', .01, 1, .005, setLine('lineWidth'), 'width');
slider(b, 'opacity', 0, 1, .01, setLine('opacity'));
button(b, 'Reshuffle', reshuffle);
button(b, 'New brush', () => { strokeTexture = makeStrokeTexture(); circles.forEach(c => c.mesh.material.uniforms.map.value = strokeTexture); });

b = folder('Motion');
slider(b, 'loopDuration', 1, 12, .1, null, 'loop (s)');
slider(b, 'rotationX', -Math.PI, Math.PI, .01, null, 'tilt group');
check(b, 'paused');
check(b, 'autoRotate', v => controls.autoRotate = v, 'orbit');

b = folder('Paint');
slider(b, 'kuwahara', 0, 8, 1, setU(kuwaharaMat, 'radius'), 'blob size');
slider(b, 'wobble', 0, 20, .1, setU(paintMat, 'wobble'));
slider(b, 'edge', 0, 1, .01, setU(paintMat, 'edge'), 'outline');
slider(b, 'edgeLow', 0, 1, .01, setU(paintMat, 'edgeLow'), 'edge low');
slider(b, 'edgeHigh', 0, 1.5, .01, setU(paintMat, 'edgeHigh'), 'edge high');
slider(b, 'edgeOffset', -6, 6, .1, setU(paintMat, 'edgeOffset'), 'misregister');
slider(b, 'minLevel', -1, .5, .01, setU(paintMat, 'minLevel'), 'levels');
slider(b, 'grain', 0, .4, .005, setU(paintMat, 'grainAmt'), 'paper grain');
slider(b, 'vignette', 0, 1, .01, setU(paintMat, 'vignette'));
button(b, 'New paper seed', () => paintMat.uniforms.seed.value = Math.random() * 100);

b = folder('Palette', true);
for (let i = 0; i < 7; i++) color(b, 'c' + i, recolor, 'color ' + (i + 1));
color(b, 'background', v => { renderer.setClearColor(v, 1); document.body.style.background = v; });
button(b, 'Randomize palette', () => {
  for (let i = 0; i < 7; i++) P['c' + i] = '#' + new THREE.Color().setHSL(Math.random(), .5 + Math.random() * .5, .2 + Math.random() * .5).getHexString();
  panel.querySelectorAll('input[type=color]').forEach((el, i) => { if (i < 7) el.value = P['c' + i]; }); recolor();
});

b = folder('Misc', true);
button(b, 'Save PNG', () => { paintedRender(); const a = document.createElement('a'); a.download = 'painted-rings.png'; a.href = canvas.toDataURL(); a.click(); });
button(b, 'Reset camera', () => { camera.position.set(7.8, 3.6, 7.3); controls.target.set(0,0,0); controls.update(); });
window.addEventListener('keydown', e => { if (e.key === 'h') togglePanel(); });

/* ---------------- loop ---------------- */
let elapsed = 0, last = performance.now();
function draw() {
  requestAnimationFrame(draw);
  const now = performance.now(); if (!P.paused) elapsed += (now - last) * .001; last = now;
  const t = (elapsed % P.loopDuration) / P.loopDuration;
  circles.forEach(c => { c.pivot.rotation.y = c.speed * t * Maf.TAU + c.a; });
  group.rotation.x = P.rotationX;
  controls.update();
  paintedRender();
}
draw();
</script>
</body>
</html>
